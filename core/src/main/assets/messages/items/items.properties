items.artifacts.masterthievesarmband.no_steal=That enemy has nothing to steal.
items.artifacts.masterthievesarmband.stole_item=You stole an item: %s.
items.artifacts.masterthievesarmband.failed_steal=You didn't manage to steal anything.
items.artifacts.masterthievesarmband.level_up=Your glove grows stronger!
items.artifacts.masterthievesarmband.desc=A pirate capture glove that grows stronger with the Laztro you collect. It can snatch items from enemies.
items.artifacts.masterthievesarmband.desc_cursed=The corrupted glove is bound to your wrist, and somehow your Laztro reserve seems to be slowly getting lighter...
items.artifacts.masterthievesarmband.desc_worn=You feel power building in the glove on your wrist as you gain experience. You can use this power to steal from shops, or to rob enemies!\n\nRobbing enemies happens instantly, briefly disorients them, and gives you a chance to get whatever loot they have! This power is more effective against unaware enemies. Robbing the same enemy multiple times does not give more chances at loot.

items.artifacts.sandalsofnature.name=spore boots
items.artifacts.sandalsofnature.name_1=spore boots Mk II
items.artifacts.sandalsofnature.name_2=spore boots Mk III
items.artifacts.sandalsofnature.name_3=spore boots Mk IV
items.artifacts.sandalsofnature.ac_feed=FEED
items.artifacts.sandalsofnature.ac_root=ROOT
items.artifacts.sandalsofnature.prompt=Select a seed
items.artifacts.sandalsofnature.levelup=Your boots gain a larger tank!
items.artifacts.sandalsofnature.absorb_seed=The footwear absorbs the seed, they seem healthier.
items.artifacts.sandalsofnature.no_effect=You must feed a seed to your footwear first.
items.artifacts.sandalsofnature.low_charge=Your footwear don't have enough energy for that.
items.artifacts.sandalsofnature.prompt_target=Select a location
items.artifacts.sandalsofnature.out_of_range=That location is out of range.
items.artifacts.sandalsofnature.desc_1=What initially seem like boots made of twine are actually two plants! They seem very weak and pale, perhaps they need to be given nutrients?
items.artifacts.sandalsofnature.desc_2=The spore tank has grown and the boots have taken on a greenish tint. Could they get even better?
items.artifacts.sandalsofnature.desc_3=The boots now have two full tanks, and sprouts appear on the soles with every step. Maybe they can grow even more?
items.artifacts.sandalsofnature.desc_4=The boots have reached their full size. The tanks are full and the soles look like thick roots.
items.artifacts.sandalsofnature.desc_hint=You feel more attuned with nature while wearing this module.
items.artifacts.sandalsofnature.desc_cursed=The corrupted boots are blocking any attunement with nature.
items.artifacts.sandalsofnature.desc_ability=The footwear ripples with the color of the last seed you fed them. They can briefly root into the ground and produce that plant's effect anywhere in a 3 tile radius.\nSeed: _%s_\nCharge needed: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=You have fed the footwear %d seeds.

items.artifacts.skeletonkey.name=master keycard
items.artifacts.skeletonkey.ac_insert=INSERT
items.artifacts.skeletonkey.cursed=You can't use a corrupted master keycard.
items.artifacts.skeletonkey.prompt=Choose a target
items.artifacts.skeletonkey.invalid_target=There's nothing to lock or unlock there.
items.artifacts.skeletonkey.lock_no_space=You can't lock a character inside of a door!
items.artifacts.skeletonkey.iron_charges=Opening a regular lock requires 1 charge.
items.artifacts.skeletonkey.gold_charges=Opening a gold lock requires 2 charges.
items.artifacts.skeletonkey.lock_charges=Locking a door requires 2 charges.
items.artifacts.skeletonkey.wall_charges=Creating a temporary wall requires 2 charges.
items.artifacts.skeletonkey.crystal_charges=Opening a crystal lock requires 5 charges.
items.artifacts.skeletonkey.wont_open=The keycard refuses to fit into this lock for some reason.
items.artifacts.skeletonkey.locked_with_key=That door was locked by your master keycard.
items.artifacts.skeletonkey.force_lock=The lock has weakened without your master keycard. You manage to force it open.
items.artifacts.skeletonkey.discard=You discard your excess keycards.
items.artifacts.skeletonkey.levelup=Your master keycard grows stronger!
items.artifacts.skeletonkey.desc=An officer's master keycard with a chip that rewrites its own credentials. The code changes every time you look at it.
items.artifacts.skeletonkey.desc_worn=This master keycard seems to gain power as you use it instead of the ship's regular keycards. It can be inserted into almost any of the sectors' locks to either open or close them, including doors that were never locked previously.\n\nThe keycard can even be used on empty space in a cardinal or diagonal direction to 'lock' the air in front of you, creating a 3 tile wide solid wall that lasts for 10 turns. Locking will push away enemies if there is space to do so.
items.artifacts.skeletonkey.desc_cursed=The corrupted keycard seems to be actively avoiding fitting into any lock, and is even making it difficult (but not impossible) for you to use your other keycards.
items.artifacts.skeletonkey$keywall.desc=A temporary force barrier has been placed here by the master keycard.

items.artifacts.talismanofforesight.name=motion sensor
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.low_charge=The sensor requires at least 5% charge to scry.
items.artifacts.talismanofforesight.prompt=Choose a location to scan.
items.artifacts.talismanofforesight.levelup=Your Sensor grows stronger!
items.artifacts.talismanofforesight.full_charge=Your Sensor is fully charged!
items.artifacts.talismanofforesight.desc=A helmet motion sensor wired into your suit. It warns you when traps or hidden passages are nearby and, once charged, can sweep the area.
items.artifacts.talismanofforesight.desc_worn=When you hold the sensor you feel like your senses are heightened. The sensor is slowly building charge as time passes and when you discover hidden doors or traps.\n\nThe sensor can expend its charge to 'scry' in a cone shape, which reveals all tiles and secrets in the scanned area, and will grant you vision of enemies and items for a short time.
items.artifacts.talismanofforesight.desc_cursed=The corrupted sensor is intently staring into you, dulling your senses.
items.artifacts.talismanofforesight$foresight.name=foresight
items.artifacts.talismanofforesight$foresight.uneasy=You feel uneasy.
items.artifacts.talismanofforesight$foresight.desc=You feel very nervous, as if there is nearby unseen danger.

items.artifacts.timekeepershourglass.name=temporal stabilizer
items.artifacts.timekeepershourglass.ac_activate=ACTIVATE
items.artifacts.timekeepershourglass.deactivate=You deactivate the time freeze.
items.artifacts.timekeepershourglass.no_charge=Your stabilizer hasn't recharged enough yet.
items.artifacts.timekeepershourglass.cursed=You can't use a corrupted stabilizer.
items.artifacts.timekeepershourglass.onstasis=The world seems to shift around you in an instant.
items.artifacts.timekeepershourglass.onfreeze=Everything around you suddenly freezes.
items.artifacts.timekeepershourglass.stasis=Put myself in stasis
items.artifacts.timekeepershourglass.freeze=Freeze time around me
items.artifacts.timekeepershourglass.prompt=How do you want to use the stabilizer?\n\nIn stasis, time passes normally while you are frozen and completely invulnerable, using up to 2 charges at a time.\n\nWith time frozen, you can move as if your actions take no time. This can be cancelled at any moment by using the stabilizer again.
items.artifacts.timekeepershourglass.desc=An experimental temporal stabilizer. It can freeze you outside of time or speed up your time relative to the rest of the sector.
items.artifacts.timekeepershourglass.desc_hint=The stabilizer has lost several temporal cells. If you found more...
items.artifacts.timekeepershourglass.desc_cursed=The corrupted stabilizer is stuck to your body, and you feel it tampering with your flow of time.
items.artifacts.timekeepershourglass$timefreeze.name=Time Freeze
items.artifacts.timekeepershourglass$timefreeze.desc=Time is frozen around you, and your actions happen instantly. The effect lasts until cancelled or until the stabilizer runs out of charge. Attacking or using a special weapon also breaks the effect.\n\nTurns until charge is spent: %s.
items.artifacts.timekeepershourglass$sandbag.name=temporal cell
items.artifacts.timekeepershourglass$sandbag.levelup=You fit the cell into your stabilizer.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Your stabilizer has all its cells!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=You don't have a stabilizer to use this cell in.
items.artifacts.timekeepershourglass$sandbag.desc=A temporal energy cell that fits your stabilizer perfectly.\n\nIt's quite lucky the merchant has this exact part just when you need it...

