items.armor.armor.seal_attached=The Marine's shield generator is attached to this armor. When he is about to be injured below half health, it will grant him _%d shielding_.
items.armor.armor.seal_transfer=The Marine's shield generator must be affixed to his currently worn armor in order to benefit him. Would you like to automatically detach the generator from the armor you are removing and affix it to the armor you are equipping?
