items.artifacts.etherealchains.desc_cursed=The corrupted cables are locked to your side, constantly swinging around, trying to trip or bind you.
items.artifacts.etherealchains.desc_equipped=The cables rest around your side, slowly siphoning the bioelectric energy of those you defeat. Each charge is a link in the chain, which will extend out exactly one tile.
items.artifacts.etherealchains$chainsrecharge.levelup=Your cables grow stronger!

