items.hull.magazine.name=magazine
items.hull.magazine.name_partial=magazine (%d/%d)
items.hull.magazine.desc=A standard Vigil-7 magazine that holds %d rounds. It fits both the service rifle and the suppressed pistol. Use the weapon's _reload_ action to insert it.
items.artifacts.sandalsofnature.desc=Boots with spore tanks. They absorb seeds and make plants sprout where you step.
items.hull.suppressedpistol.name=suppressed pistol
items.hull.suppressedpistol.desc=The Special Forces pistol, with a long suppressor on the barrel. It takes the same 12-round magazine as the rifle and stays in the backpack, ready to draw.\n\nThe shot makes no noise. Unlike the rifle, it does not draw nearby enemies, and a target that never saw the shooter does not even know where the bullet came from.
items.hull.suppressedpistol.ac_shoot=shoot
items.hull.suppressedpistol.ac_reload=reload
items.hull.suppressedpistol.prompt=Choose a target
