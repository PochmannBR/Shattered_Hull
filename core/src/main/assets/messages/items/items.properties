###armor curses
items.armor.curses.antientropy.name=%s of anti-entropy
items.armor.curses.antientropy.desc=The Anti-entropy corruption works against the forces of the universe, pulling energy into the wearer and away from their surroundings. This briefly sets the wearer on fire, but freezes everything around them!

items.armor.curses.bulk.name=%s of bulk
items.armor.curses.bulk.desc=Armor of bulk looks larger and more imposing, but doesn't actually have enhanced defense. Even worse, the added size makes moving into doorways very difficult.

items.armor.curses.corrosion.name=%s of corrosion
items.armor.curses.corrosion.desc=Armor of corrosion is capable of bursting with corrosive fluid, coating everything in the area with sticky acidic ooze.

items.armor.curses.displacement.name=%s of displacement
items.armor.curses.displacement.desc=The corruption of displacement attempts to move the wearer to safety when they are attacked. It is a bit too effective however, randomly teleporting the user around the level.

items.armor.curses.metabolism.name=%s of metabolism
items.armor.curses.metabolism.desc=The metabolism corruption directly converts satiety into health when the wearer is injured, providing a boost of healing, but quickly causing starvation.

items.armor.curses.multiplicity.name=%s of multiplicity
items.armor.curses.multiplicity.desc=Armor corrupted with multiplicity contains dangerous duplication code. It will sometimes create a mirror image of the wearer, but is equally likely to duplicate the attacker!

items.armor.curses.overgrowth.name=%s of overgrowth
items.armor.curses.overgrowth.desc=Armor of overgrowth is covered in various blooming plants. While this effect certainly looks interesting, it does nothing for defense, and these plants will randomly activate in combat!

items.armor.curses.stench.name=%s of stench
items.armor.curses.stench.desc=Armor corrupted with stench will release clouds of noxious gas, which is hazardous to everything caught in the cloud.


###glyphs
items.armor.glyphs.affection.name=%s of affection
items.armor.glyphs.affection.desc=This powerful plating manipulates the mind of attackers, entrancing them for a while.

items.armor.glyphs.antimagic.name=%s of anti-energy
items.armor.glyphs.antimagic.desc=This powerful plating allows armor to defend its wearer against energy attacks as well as physical ones. This energy defence is not affected by the armor's tier.

items.armor.glyphs.brimstone.name=%s of brimstone
items.armor.glyphs.brimstone.desc=This plating shields the wearer and their belongings from fire, completely nullifying its damage and negative effects.

items.armor.glyphs.camouflage.name=%s of camouflage
items.armor.glyphs.camouflage.desc=This plating allows the wearer to blend into tall grass, granting them temporary invisibility.

items.armor.glyphs.entanglement.name=%s of entanglement
items.armor.glyphs.entanglement.desc=This plating grows earthen armor around the wearer to absorb damage, but this armor will break if the wearer moves.

items.armor.glyphs.flow.name=%s of flow
items.armor.glyphs.flow.desc=This plating manipulates the flow of water around the wearer, making them much faster when moving through it.

items.armor.glyphs.obfuscation.name=%s of obfuscation
items.armor.glyphs.obfuscation.desc=This plating obscures the wearer, making them more difficult to detect.

items.armor.glyphs.potential.name=%s of potential
items.armor.glyphs.potential.desc=This plating builds energy when struck, granting charge to the wearer's special weapon when it activates.

items.armor.glyphs.repulsion.name=%s of repulsion
items.armor.glyphs.repulsion.desc=This plating rebounds force against attackers, sending them flying back.

items.armor.glyphs.stone.name=%s of stone
items.armor.glyphs.stone.desc=This plating surrounds the armor with a heavy ceramic layer that makes dodging impossible, but blocks damage in proportion with evasion.

items.armor.glyphs.swiftness.name=%s of swiftness
items.armor.glyphs.swiftness.desc=This plating enhances the speed of the wearer whenever they aren't near to an enemy.

items.armor.glyphs.thorns.name=%s of thorns
items.armor.glyphs.thorns.desc=This powerful plating harms attackers, causing them to slowly bleed when they attack the wearer.

items.armor.glyphs.viscosity.name=%s of viscosity
items.armor.glyphs.viscosity.deferred=deferred %d
items.armor.glyphs.viscosity$defereddamage.name=deferred damage
items.armor.glyphs.viscosity$defereddamage.ondeath=The deferred damage killed you...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Killed by deferred damage
items.armor.glyphs.viscosity$defereddamage.desc=Damage is being dealt slowly over time instead of immediately.\n\nDeferred damage remaining: %d.
items.armor.glyphs.viscosity.desc=This plating is able to store damage dealt to the wearer, dealing it to them slowly rather than all at once.



