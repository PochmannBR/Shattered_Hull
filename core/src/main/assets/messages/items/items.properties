items.artifacts.masterthievesarmband.name=capture glove
items.artifacts.masterthievesarmband.ac_steal=STEAL
items.artifacts.masterthievesarmband.no_charge=Your glove does not have enough charge.
items.artifacts.masterthievesarmband.cursed=You can't use a corrupted glove.
items.artifacts.masterthievesarmband.full=Your glove is fully charged!
items.artifacts.masterthievesarmband.prompt=Choose an enemy to target
items.artifacts.masterthievesarmband.no_target=You must target an enemy that is adjacent to you.
