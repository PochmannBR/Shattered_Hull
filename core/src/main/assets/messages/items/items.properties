items.hull.servicerifle.reload_partial=You swap magazines and stow the old one, with %d rounds, in your backpack.
items.hull.servicerifle.ammo=Ammo: _%d/%d_ in the inserted magazine. Each shot deals _%d-%d damage_ and loses accuracy against adjacent enemies.
