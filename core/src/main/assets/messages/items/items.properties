items.artifacts.unstablespellbook.ac_read=READ
items.artifacts.unstablespellbook.ac_add=ADD
items.artifacts.unstablespellbook.blinded=You cannot read from the databank while blinded.
items.artifacts.unstablespellbook.no_charge=Your databank is out of energy for now.
items.artifacts.unstablespellbook.cursed=You cannot read from a corrupted databank.
