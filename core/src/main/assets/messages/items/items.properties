items.artifacts.unstablespellbook.infuse_scroll=You infuse the cartridge's energy into the databank.
items.artifacts.unstablespellbook.unable_scroll=You are unable to add this cartridge to the databank.
items.artifacts.unstablespellbook.unknown_scroll=You're not sure what type of cartridge this is yet.
items.artifacts.unstablespellbook.desc=A databank damaged in the crash. It runs random cartridges and can be refilled with cartridges you feed into it.
items.artifacts.unstablespellbook.desc_cursed=The corrupted databank has bound itself to you, it is inhibiting your ability to use most cartridges.
items.artifacts.unstablespellbook.desc_index=The databank is incomplete. Its index is currently pointing to the following blank pages:
items.artifacts.unstablespellbook.desc_empowered=The cartridges that you've added to the databank are glowing with power. You will be able to choose the exotic version of these cartridge's effects, but at the cost of an additional charge.
items.artifacts.unstablespellbook.read_empowered=The cartridge you added to the databank surges with energy. You are able to channel either the regular, or exotic version of this cartridge's effect.\n\nChoosing the exotic variant will cost 2 charges instead of 1.



###bags
items.bags.bag.name=backpack
items.bags.bag.discover_hint=You can buy this item in a shop.

items.bags.potionbandolier.name=injector bandolier
items.bags.potionbandolier.desc=This thick bandolier fits around your chest like a sash, it has many insulated straps on it to hold injector vials, your med kit, or liquid metal vials.\n\nWhile inside the bandolier, your injectors should be protected from the cold.

items.bags.scrollholder.name=cartridge holder
items.bags.scrollholder.desc=A tubular field case made to hold data cartridges. Its side compartments also fit devices, plating applicators and conductive resin.\n\nThe case doesn't look very flammable, so your cartridges should be safe from fire inside it.

items.bags.velvetpouch.name=velvet pouch
items.bags.velvetpouch.desc=This small velvet pouch can store many small items in it, such as seeds, tactical capsules, and some synthesis ingredients.
items.bags.velvetpouch.discover_hint=One of the heroes starts with this item.

items.bags.magicalholster.name=magnetic holster
items.bags.magicalholster.desc=This slim holster is made from synthetic leather, with magnetic locks which let it store a massive amount of ranged weapons.\n\nYou can simply reach into the bag and will always grab the item you were looking for.\n\nThanks to the holster's locks and charging contacts, special weapons will charge slightly faster and thrown weapons will last slightly longer inside of it.



###bombs
items.bombs.arcanebomb.name=pulse bomb
items.bombs.arcanebomb.desc=This bomb has been fitted with an energy pulse core. It will explode into a powerful blast similar to the Swarm Matrix's pumped up attack, dealing _%1$d-%2$d energy damage_ to anything within 2 tiles.
items.bombs.arcanebomb.discover_hint=You can craft this item via synthesis.

items.bombs.bomb.name=bomb
items.bombs.bomb.ac_lightthrow=LIGHT & THROW
items.bombs.bomb.snuff_fuse=You quickly snuff the bomb's fuse.
items.bombs.bomb.ondeath=The explosion killed you...
items.bombs.bomb.rankings_desc=Killed by an explosion
items.bombs.bomb.desc=A fairly hefty black powder bomb. An explosion from this bomb deals _%1$d-%2$d damage_ to anything adjacent to it, and will destroy some adjacent terrain or items.
items.bombs.bomb.desc_fuse=It looks like the fuse will take a couple rounds to burn down once it is lit.
items.bombs.bomb.desc_burning=The bomb's fuse is burning away, keep your distance or put it out!
items.bombs.bomb$doublebomb.name=two bombs
items.bombs.bomb$doublebomb.desc=A stack of two hefty black powder bombs, looks like you get one free!

items.bombs.firebomb.name=firebomb
items.bombs.firebomb.desc=This bomb has been modified to explode in a larger area, dealing _%1$d-%2$d damage_ and spreading sustained flame within 2 tiles.
items.bombs.firebomb.discover_hint=You can craft this item via synthesis.

items.bombs.flashbangbomb.name=flashbang
items.bombs.flashbangbomb.desc=This customized bomb will erupt into a blast of light, sound, and electricity when it explodes. Anything within 2 tiles will take _%1$d-%2$d damage_ from the explosion, an additional 25%% damage from the electricity, and be stunned for 10 turns.
items.bombs.flashbangbomb.discover_hint=You can craft this item via synthesis.

items.bombs.frostbomb.name=frost bomb
items.bombs.frostbomb.desc=This bomb has been modified to explode in a larger area, dealing _%1$d-%2$d damage_ and spreading a sustained gust of freezing air within 2 tiles.
items.bombs.frostbomb.discover_hint=You can craft this item via synthesis.

items.bombs.holybomb.name=UV bomb
items.bombs.holybomb.desc=This bomb has been modified to release an ultraviolet flash in a larger area when it explodes. Anything within 2 tiles will take _%1$d-%2$d damage_ from the explosion, and the assimilated and hive creatures will take an additional 50%% damage from the ultraviolet light.
items.bombs.holybomb.discover_hint=You can craft this item via synthesis.

items.bombs.noisemaker.name=noisemaker
items.bombs.noisemaker.desc=This customized bomb will repeatedly make noise when its fuse runs out. When something touches the bomb, it will explode and deal _%1$d-%2$d damage_ to anything within 2 tiles!
items.bombs.noisemaker.desc_burning=The noisemaker is ticking away, it'll explode when something gets near!
items.bombs.noisemaker.discover_hint=You can craft this item via synthesis.

items.bombs.smokebomb.name=smoke bomb
items.bombs.smokebomb.desc=This bomb has been modified to spew a thick cloud of gas at the same time as exploding. It will deal _%1$d-%2$d damage_ and spread shrouding fog within 2 tiles.
items.bombs.smokebomb.discover_hint=You can craft this item via synthesis.

items.bombs.regrowthbomb.name=regrowth bomb
items.bombs.regrowthbomb.desc=This customized bomb will splash life-giving liquid everywhere within 3 tiles instead of exploding. The area caught in the blast will rapidly sprout grass and plants. Yourself and any allies caught in the blast will be healed as if they had injected a injector of healing.
items.bombs.regrowthbomb.discover_hint=You can craft this item via synthesis.

items.bombs.shrapnelbomb.name=shrapnel bomb
items.bombs.shrapnelbomb.desc=This bomb has been modified with scraps of the drill rig's metal, which will fragment and fly everywhere when it explodes, dealing _%1$d-%2$d damage_ in a huge range around the bomb. You had better hide behind something when using it...
items.bombs.shrapnelbomb.discover_hint=You can craft this item via synthesis.

items.bombs.woollybomb.name=woolly bomb
items.bombs.woollybomb.desc=This customized bomb will create a wide field of holographic sheep after exploding. The explosion will deal _%1$d-%2$d damage_ to anything within 2 tiles. The sheep will block movement and persist for a very long time! The sheep will not last as long in the presence of powerful enemies though, and can be manually dispelled sooner by interacting with them.
items.bombs.woollybomb.discover_hint=You can craft this item via synthesis.

###food
items.food.berry.name=alien berry
items.food.berry.eat_msg=That berry was tasty!
items.food.berry.desc=A small berry that grows among the alien plants. It can be eaten quickly, fills you up a little, and may contain a usable seed!
items.food.berry.discover_hint=You can find this item using a specific hero talent.

items.food.blandfruit.name=alien fruit
items.food.blandfruit.cooked=cooked alien fruit
items.food.blandfruit.sunfruit=sunfruit
items.food.blandfruit.rotfruit=rotfruit
items.food.blandfruit.earthfruit=earthfruit
items.food.blandfruit.blindfruit=blindfruit
items.food.blandfruit.firefruit=firefruit
items.food.blandfruit.icefruit=icefruit
items.food.blandfruit.fadefruit=fadefruit
items.food.blandfruit.sorrowfruit=sorrowfruit
items.food.blandfruit.stormfruit=stormfruit
items.food.blandfruit.dreamfruit=magefruit
items.food.blandfruit.starfruit=starfruit
items.food.blandfruit.swiftfruit=swiftfruit
items.food.blandfruit.raw=You can't bear to eat it raw.
items.food.blandfruit.desc=A dry, tasteless alien fruit. Maybe cooking it with another ingredient would improve the flavor.
items.food.blandfruit.desc_cooked=The fruit has plumped up from its time in the synthesis bench and has even absorbed the properties of the seed it was cooked with. It will have the effect of whatever injector the seed corresponded to.
items.food.blandfruit.desc_eat=It looks ready to be eaten!
items.food.blandfruit.desc_throw=It seems pretty volatile, it might be best to throw it.
items.food.blandfruit$chunks.name=alien fruit chunks
items.food.blandfruit$chunks.desc=The alien fruit has exploded on impact, leaving inert chunks behind.\n\nDespite a bit of dirt, these large chunks of cooked alien fruit seem perfectly edible.

items.food.chargrilledmeat.name=grilled swarm meat
items.food.chargrilledmeat.desc=Swarm meat grilled well over a flame. It still tastes strange, but it's safe.
items.food.chargrilledmeat.discover_hint=You can create this using another food item.

items.food.food.name=combat ration
items.food.food.ac_eat=EAT
items.food.food.eat_msg=That food tasted delicious!
items.food.food.desc=Standard Brigade combat ration: dried meat, crackers and a protein bar.

items.food.frozencarpaccio.name=frozen swarm meat
items.food.frozencarpaccio.invis=You see your hands turn invisible!
items.food.frozencarpaccio.hard=You feel your skin harden!
items.food.frozencarpaccio.refresh=Refreshing!
items.food.frozencarpaccio.better=You feel better!
items.food.frozencarpaccio.desc=Swarm meat frozen solid. Sliced thin, it's surprisingly good.
items.food.frozencarpaccio.discover_hint=You can create this using another food item.

items.food.meatpie.name=field pie
items.food.meatpie.eat_msg=That food was incredible!
items.food.meatpie.desc=A field pie stuffed with meat. It fills you up far more than any other meal.
items.food.meatpie.discover_hint=You can craft this item via synthesis.

items.food.mysterymeat.name=swarm meat
items.food.mysterymeat.eat_msg=That food tasted... strange.
items.food.mysterymeat.hot=Oh it's hot!
items.food.mysterymeat.legs=You can't feel your legs!
items.food.mysterymeat.not_well=You are not feeling well.
items.food.mysterymeat.stuffed=You are stuffed.
items.food.mysterymeat.desc=A chunk of meat torn from a swarm creature. Eat at your own risk.
items.food.mysterymeat.discover_hint=You can get this item as a drop from certain enemies.
items.food.mysterymeat$placeholder.name=meat

items.food.phantommeat.name=translucent meat
items.food.phantommeat.desc=A large glistening translucent steak, cut from a translucent lamprey. This strange meat doesn't need to be cooked and grants a number of defensive benefits in addition to fully satiating you. When eaten it will grant invisibility, barkskin, some healing, and cures many harmful effects.
items.food.phantommeat.discover_hint=You can get this item as a drop from certain enemies.

items.food.pasty.name=onboard snack
items.food.pasty.fish_name=steamed fish
items.food.pasty.amulet_name=queen's heart?
items.food.pasty.egg_name=easter egg
items.food.pasty.rainbow_name=rainbow injector
items.food.pasty.shattered_name=green cake
items.food.pasty.pie_name=pumpkin pie
items.food.pasty.vanilla_name=blue cake
items.food.pasty.cane_name=candy cane
items.food.pasty.sparkling_name=sparkling injector
items.food.pasty.desc=A baked pastry filled with meat and potato, straight from the Vigil-7 mess hall. Delicious!
items.food.pasty.fish_desc=A whole steamed fish, vacuum preserved on a bed of greens. It's tradition to save some fish for later around this time of year, so you'll keep some leftovers instead of eating it all at once.\n\nHappy Lunar New Year!
items.food.pasty.amulet_desc=You've finally found it, the Queen's Heart... wait a minute, this is just a foil-wrapped chocolate made to look like the heart!
items.food.pasty.egg_desc=A great big chocolate egg, wrapped in colorful yellow foil. There's easily enough chocolate here to fill you up, and the sugar might give your modules a tiny bit of extra charge.\n\nHappy Easter!
items.food.pasty.rainbow_desc=This colorful injector is a kind of liquid food. In addition to satisfying your hunger, it has a mild sedative in it which will calm an adjacent non-boss enemy, making them temporarily hesitant to fight you.\n\nHappy Pride!
items.food.pasty.shattered_desc=This large slice of vanilla cake has colorful sprinkles and green frosting. The cake was made to celebrate years of experience, and will grant a small amount of that experience to you when eaten.\n\nShattered Pixel Dungeon was first released on August 5th 2014. Happy birthday Shattered Pixel Dungeon!
items.food.pasty.pie_desc=A great big slice of pumpkin pie. Its sweet and spicy flavor will fill you up and give you a tiny bit of healing.\n\nHappy Halloween!
items.food.pasty.vanilla_desc=This large slice of vanilla cake has colorful sprinkles and blue frosting. The cake was made to celebrate years of experience, and will grant a small amount of that experience to you when eaten.\n\nThe original Pixel Dungeon was first released on December 4th 2012. Happy birthday Pixel Dungeon!
items.food.pasty.cane_desc=A huge sugary sweet candy cane. It's big enough to fill you up, and the sugar might give your special weapons a tiny bit of extra charge too.\n\nHappy Holidays!
items.food.pasty.sparkling_desc=This sparkling injector is a kind of liquid food. It satisfies hunger and simulates sparkling wine, but isn't actually alcoholic. The warm feeling in your belly will grant a little bit of shielding.\n\nHappy New Year!
items.food.pasty$fishleftover.name=fish leftovers
items.food.pasty$fishleftover.eat_msg=That food tasted ok.
items.food.pasty$fishleftover.desc=Some surplus fish from your previous meal. You can eat it any time you like to restore a little hunger.

items.food.smallration.name=compact ration
items.food.smallration.eat_msg=That food tasted ok.
items.food.smallration.desc=It looks exactly like a standard combat ration but smaller.
items.food.smallration.discover_hint=You can buy this item in a shop.

items.food.stewedmeat.name=stewed swarm meat
items.food.stewedmeat.eat_msg=That food tasted ok.
items.food.stewedmeat.desc=Boiling the swarm meat killed the parasites. It should be safe to eat.
items.food.stewedmeat.discover_hint=You can craft this item via synthesis.

items.food.supplyration.name=emergency ration
items.food.supplyration.desc=A ration from the Vigil-7 escape pods, made to be eaten on the move and to get out of tight spots.\n\nIt fills you up less than a combat ration, but it can be eaten quickly, heals a little and restores a charge to the Special Forces active camo module.
items.food.supplyration.discover_hint=You can find this item using a specific hero talent.



##journal items
items.journal.documentpage.name=torn page
items.journal.documentpage.desc=A loose page, probably torn from a notebook. You'll need to pick it up to read it.

items.journal.alchemypage.name=torn recipe archive page
items.journal.alchemypage.desc=A torn page from the synthesis bench recipe archive.\n\nMost of the text is too small to read at a distance, but you can make out the title:\n\n_"%s"_

items.journal.guidebook.name=space combatant's manual
items.journal.guidebook.hint_mobile=Your manual has advice for you! Tap the flashing journal button on the top-right to read it.
items.journal.guidebook.hint_desktop=Your manual has advice for you! Select the flashing journal button (%s) on the top-right to read it.
items.journal.guidebook.hint_status=Manual
items.journal.guidebook.desc=The pocket manual every Orbital Brigade recruit gets on day one. This copy came in the escape pod survival kit and links to your journal to show the right page at the right moment.\n\nThe cover carries the Brigade's first commandment in big letters: "Breathe. Then shoot."

items.journal.guidepage.name=loose manual page
items.journal.guidepage.desc=A page that came loose from the Space Combatant's Manual.\n\nMost of the text is too small to read at a distance, but you can make out the title:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=ship log
items.journal.regionlorepage$sewers.desc=An audio log from a Vigil-7 crew member, recorded on a device dented by the crash. Pick it up to listen.

items.journal.regionlorepage$prison.name=pirate journal page
items.journal.regionlorepage$prison.desc=A page torn from a journal, marked with a claw symbol in the corner. Pick it up to read it.

items.journal.regionlorepage$caves.name=helmet log
items.journal.regionlorepage$caves.desc=The memory module of an Orbital Brigade helmet, still working. Pick it up to listen.

items.journal.regionlorepage$city.name=rusted tablet
items.journal.regionlorepage$city.desc=A small rusted metal tablet with a message laser etched into it. The letters are still clear despite the tablet's age, but you'll have to pick it up to read it.

items.journal.regionlorepage$halls.name=glowing tablet
items.journal.regionlorepage$halls.desc=A small black tablet with glowing green letters etched into it. The glowing letters blur together into a haze at a distance, you'll have to pick it up to read it.


###keys
items.keys.goldenkey.name=gold keycard
items.keys.goldenkey.desc=A keycard with the gold stripe of cargo containers. It opens a locked chest in this sector.

items.keys.crystalkey.name=cyan keycard
items.keys.crystalkey.desc=A keycard with the cyan stripe of armored compartments. It opens a crystal door or chest in this sector.

items.keys.ironkey.name=gray keycard
items.keys.ironkey.desc=A Vigil-7 keycard with the gray stripe of regular doors. It opens a locked door in this sector.

items.keys.wornkey.name=damaged keycard
items.keys.wornkey.desc=A cracked, scorched keycard that still responds. It should open some important door nearby.



###potions
items.potions.potion.ac_drink=INJECT
items.potions.potion.turquoise=turquoise injector
items.potions.potion.crimson=crimson injector
items.potions.potion.azure=azure injector
items.potions.potion.jade=jade injector
items.potions.potion.golden=golden injector
items.potions.potion.magenta=magenta injector
items.potions.potion.charcoal=charcoal injector
items.potions.potion.ivory=ivory injector
items.potions.potion.amber=amber injector
items.potions.potion.bistre=bistre injector
items.potions.potion.indigo=indigo injector
items.potions.potion.silver=silver injector
items.potions.potion.unknown_desc=An unlabeled Brigade field injector. The liquid inside is colorful and swirling. Who knows what it does when applied or thrown?
items.potions.potion.harmful=Harmful injector!
items.potions.potion.beneficial=Beneficial injector
items.potions.potion.yes=Yes, I know what I'm doing
items.potions.potion.no=No, I changed my mind
items.potions.potion.sure_drink=Are you sure you want to inject yourself with it? In most cases you should throw such injectors at your enemies.
items.potions.potion.sure_throw=Are you sure you want to throw it? In most cases it makes more sense to inject it.
items.potions.potion.shatter=The injector breaks and the liquid spills harmlessly.
items.potions.potion.discover_hint=You can find this item randomly during the mission, or craft it via synthesis.
items.potions.potion$placeholder.name=injector
items.potions.potion$seedtopotion.name=Random Injector

items.potions.potionofexperience.name=neural injector
items.potions.potionofexperience.desc=The storied experiences of multitudes of battles reduced to liquid form, this draught will instantly raise your experience level.

items.potions.potionoffrost.name=cryo injector
items.potions.potionoffrost.desc=The chemical contained in this injector will evaporate into a freezing cloud upon exposure to open air.

items.potions.potionofhaste.name=adrenaline injector
items.potions.potionofhaste.energetic=You feel energetic!
items.potions.potionofhaste.desc=Drinking this oddly sweet liquid will imbue you with tremendous energy for a short time, allowing you to run at high speeds.

items.potions.potionofhealing.name=regeneration injector
items.potions.potionofhealing.heal=Your wounds begin to close.
items.potions.potionofhealing.desc=This elixir will rapidly restore your health and instantly cure many ailments.

items.potions.potionofinvisibility.name=cloaking injector
items.potions.potionofinvisibility.invisible=You see your hands turn invisible!
items.potions.potionofinvisibility.desc=Drinking this injector will render you temporarily invisible. While invisible, enemies will be unable to see you. Physical attacks and energy effects (such as cartridges and special weapons) will immediately cancel invisibility.

items.potions.potionoflevitation.name=antigravity injector
items.potions.potionoflevitation.float=You float into the air!
items.potions.potionoflevitation.desc=Drinking this curious liquid will cause you to hover in the air, able to drift effortlessly over traps and pits. Throwing this injector will create a cloud of unrefined gas, disorienting anything caught in it.

items.potions.potionofliquidflame.name=incendiary injector
items.potions.potionofliquidflame.desc=This injector contains an unstable compound which will burst violently into flame upon exposure to open air.

items.potions.potionofmindvision.name=perception injector
items.potions.potionofmindvision.see_mobs=You can somehow feel the presence of other creatures' minds!
items.potions.potionofmindvision.see_none=You can somehow tell that you are alone on this level at the moment.
items.potions.potionofmindvision.desc=After injecting this, your mind will become attuned to the psychic signature of distant creatures, enabling you to sense biological presences through walls. Also this injector will permit you to see through nearby walls and doors.

items.potions.potionofparalyticgas.name=paralytic injector
items.potions.potionofparalyticgas.desc=Upon exposure to open air, the liquid in this injector will vaporize into a numbing yellow haze. Anyone who inhales the cloud will be paralyzed instantly, unable to move for some time after the cloud dissipates. This item can be thrown at distant enemies to catch them within the effect of the gas.

items.potions.potionofpurity.name=antitoxin injector
items.potions.potionofpurity.freshness=You feel uncommon freshness in the air.
items.potions.potionofpurity.protected=A protective film envelops you!
items.potions.potionofpurity.desc=This reagent will quickly neutralize all harmful area-bound effects in a large area. Drinking it will give you temporary immunity to such effects.

items.potions.potionofstrength.name=strength injector
items.potions.potionofstrength.msg=Newfound strength surges through your body, you now have %d strength!
items.potions.potionofstrength.desc=This powerful liquid will course through your muscles, permanently increasing your strength by one point.

items.potions.potionoftoxicgas.name=toxic injector
items.potions.potionoftoxicgas.desc=Uncorking or shattering this pressurized glass will cause its contents to explode into a deadly cloud of toxic green gas. You might choose to fling this injector at distant enemies instead of uncorking it by hand.



###brews
items.potions.brews.brew.discover_hint=You can craft this item via synthesis.

items.potions.brews.aquabrew.name=aqua brew
items.potions.brews.aquabrew.desc=When shattered, this brew will release a burst of pressurized water at its location. It's only forceful enough to damage fiery enemies, but it also spreads water to nearby terrain, disables traps, douses fires, and knocks back characters near the burst.

items.potions.brews.blizzardbrew.name=blizzard brew
items.potions.brews.blizzardbrew.desc=When shattered, this brew will unleash a swirling blizzard which quickly spreads like a gas.

items.potions.brews.causticbrew.name=caustic brew
items.potions.brews.causticbrew.desc=This brew will spread corrosive ooze in a wide area around the location it shatters in. Anything caught by the ooze will slowly melt if it can't wash it off in water.

items.potions.brews.infernalbrew.name=infernal brew
items.potions.brews.infernalbrew.desc=When shattered, this brew will unleash a raging inferno which quickly spreads like a gas.

items.potions.brews.shockingbrew.name=shocking brew
items.potions.brews.shockingbrew.desc=When shattered, this brew will unleash an electrical storm in a wide area around the location it breaks at.

items.potions.brews.unstablebrew.name=unstable brew
items.potions.brews.unstablebrew.desc=This brew glows with shifting colors of the rainbow.\n\nWhen injected or thrown it will trigger the effect of a random injector. The injector effect will always be beneficial if it is injected, and will always be harmful if it is thrown.

###elixirs
items.potions.elixirs.elixir.discover_hint=You can craft this item via synthesis.

items.potions.elixirs.elixirofarcanearmor.name=elixir of dispersion field
items.potions.elixirs.elixirofarcanearmor.desc=This elixir will grant the drinker a long lasting resistance to energy damage.

items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir of aquatic rejuvenation
items.potions.elixirs.elixirofaquaticrejuvenation.desc=This elixir contains the remains of the Swarm Matrix enhanced with a healing injector. While it will not provide immediate healing, it will steadily restore a greater amount of health while you are standing in water.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=aquatic healing
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=You have temporarily gained restorative properties similar to that of the Swarm Matrix.\n\nWhile standing in water, you will recover a small amount of health per turn. The effect is paused when you are at full health or are out of water.\n\nHealing left: %d.

items.potions.elixirs.elixirofdragonsblood.name=elixir of igneous blood
items.potions.elixirs.elixirofdragonsblood.desc=When consumed, this elixir will send fiery power coursing through the drinker's veins. This effect will make the drinker immune to fire, and allow them to set enemies aflame with physical attacks.

items.potions.elixirs.elixiroffeatherfall.name=elixir of feather fall
items.potions.elixirs.elixiroffeatherfall.light=You feel light as a feather!
items.potions.elixirs.elixiroffeatherfall.desc=This elixir offers a weaker but more controlled levitation effect, allowing the drinker to fall great distances without harm for a little while.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=feather fall
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=You are under the effects of a feather fall elixir, allowing you to fall into chasms without taking damage!\n\nTurns remaining: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=elixir of honeyed healing
items.potions.elixirs.elixirofhoneyedhealing.desc=This elixir combines healing with the sweetness of honey. When injected, it will apply the same effect as a injector of healing and satisfy a small amount of hunger, but it can also be thrown to heal an ally.\n\nCreatures with an affinity for honey might be pacified if this item is used on them.

items.potions.elixirs.elixiroficytouch.name=elixir of icy touch
items.potions.elixirs.elixiroficytouch.desc=When consumed, this elixir will allow the drinker to sap the heat from enemies they attack. This effect will make the drinker immune to the cold, and allow them to chill enemies with physical attacks.

items.potions.elixirs.elixirofmight.name=elixir of might
items.potions.elixirs.elixirofmight.msg=Newfound strength surges through your body, you now have %d strength!
items.potions.elixirs.elixirofmight.desc=This powerful liquid will course through your muscles, permanently increasing your strength by one point and temporarily increasing maximum health by %d points. The health boost scales with your maximum health, but will slowly wear off as you gain levels.
items.potions.elixirs.elixirofmight$htboost.name=max health boost
items.potions.elixirs.elixirofmight$htboost.desc=Your body feels unnaturally strong and healthy.\n\nYour maximum health is boosted for an extended period of time. As you gain levels, the boost will steadily fade.\n\nCurrent boost amount: %d.\nLevels remaining: %d.

items.potions.elixirs.elixiroftoxicessence.name=elixir of toxic essence
items.potions.elixirs.elixiroftoxicessence.desc=When consumed, this elixir will imbue the drinker with toxic energy. The drinker will continuously spread toxic gas as they move, and will be immune to toxic gas and poison for slightly longer than the duration of the effect.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=exotic turquoise injector
items.potions.exotic.exoticpotion.crimson=exotic crimson injector
items.potions.exotic.exoticpotion.azure=exotic azure injector
items.potions.exotic.exoticpotion.jade=exotic jade injector
items.potions.exotic.exoticpotion.golden=exotic golden injector
items.potions.exotic.exoticpotion.magenta=exotic magenta injector
items.potions.exotic.exoticpotion.charcoal=exotic charcoal injector
items.potions.exotic.exoticpotion.ivory=exotic ivory injector
items.potions.exotic.exoticpotion.amber=exotic amber injector
items.potions.exotic.exoticpotion.bistre=exotic bistre injector
items.potions.exotic.exoticpotion.indigo=exotic indigo injector
items.potions.exotic.exoticpotion.silver=exotic silver injector
items.potions.exotic.exoticpotion.unknown_desc=This round injector contains a grainy colorful liquid. It seems to be foreign to this land, who knows what it might do when injected or thrown?
items.potions.exotic.exoticpotion.warning=Do you really want to cancel this injector usage? It will be consumed anyway.
items.potions.exotic.exoticpotion.yes=Yes, I'm positive
items.potions.exotic.exoticpotion.no=No, I changed my mind
items.potions.exotic.exoticpotion.discover_hint=You can craft this item via synthesis.

items.potions.exotic.potionofcleansing.name=injector of cleansing
items.potions.exotic.potionofcleansing.desc=This powerful reagent will render the drinker immune to all harmful status effects for a few turns when injected. It can be thrown at a target to cleanse them as well.
items.potions.exotic.potionofcleansing$cleanse.name=cleansed
items.potions.exotic.potionofcleansing$cleanse.desc=This character is temporarily immune to all harmful status effects!\n\nTurns remaining: %s.

items.potions.exotic.potionofcorrosivegas.name=injector of corrosive gas
items.potions.exotic.potionofcorrosivegas.desc=Uncorking or shattering this pressurized glass will cause its contents to explode into a deadly cloud of corrosive rust-colored gas. The gas spreads more quickly than toxic gas and is more deadly, but also won't last as long.

items.potions.exotic.potionofdragonsbreath.name=injector of fire breath
items.potions.exotic.potionofdragonsbreath.prompt=Choose a location to burn
items.potions.exotic.potionofdragonsbreath.desc=This injector contains an unusual compound which bursts into flame shortly after mixing with saliva. Quickly spitting the liquid will allow the user to spew flame from their mouth!

items.potions.exotic.potionofearthenarmor.name=injector of earthen armor
items.potions.exotic.potionofearthenarmor.desc=Rather than paralyze, this liquid has a hardening effect on the skin which will turn it into temporary natural armor.

items.potions.exotic.potionofdivineinspiration.name=injector of tactical insight
items.potions.exotic.potionofdivineinspiration.no_more_points=You can't gain any more bonus talent points.
items.potions.exotic.potionofdivineinspiration.select_tier=Select a talent tier to gain two bonus points in. You must have unlocked the tier to be able to spend the points.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Talent Points!
items.potions.exotic.potionofdivineinspiration.desc=A cocktail of nootropics and tactical memory written into protein, granting the user two bonus talent points in a tier of their choosing.\n\nThis injector can only be used once for each talent tier.

items.potions.exotic.potionofmagicalsight.name=injector of enhanced sight
items.potions.exotic.potionofmagicalsight.desc=After injecting this, your senses will be briefly heightened to incredible levels, allowing you to see through walls in a 12 tile radius!

items.potions.exotic.potionofmastery.name=injector of mastery
items.potions.exotic.potionofmastery.prompt=Master an Item
items.potions.exotic.potionofmastery.weapon_easier=Your weapon becomes easier to wield!
items.potions.exotic.potionofmastery.armor_easier=Your armor becomes easier to wear!
items.potions.exotic.potionofmastery.desc=Rather than granting raw strength, this injector will instead attune the muscles of the user to a particular item. This will make that item easier to use, as if the drinker had practised with it and built muscle memory.\n\nThe chosen weapon or armor will require 2 less strength to use. This injector can only be used once on each item.

items.potions.exotic.potionofshielding.name=injector of shielding
items.potions.exotic.potionofshielding.desc=Rather than heal, this injector will instead project a durable shield around the user's body, blocking a considerable amount of damage.

items.potions.exotic.potionofshroudingfog.name=injector of shrouding fog
items.potions.exotic.potionofshroudingfog.desc=When exposed to air, the liquid in this injector will produce a thick smoky fog which quickly spreads and blocks the vision of your enemies.

items.potions.exotic.potionofsnapfreeze.name=injector of snap freeze
items.potions.exotic.potionofsnapfreeze.desc=The chemical contained in this injector will rapidly react with the air, instantly freezing and rooting all within its effect.

items.potions.exotic.potionofstamina.name=injector of stamina
items.potions.exotic.potionofstamina.desc=Drinking this oddly sweet liquid will imbue you with a long-lasting boost of energy, allowing you to run at a quickened pace for an extended period of time.

items.potions.exotic.potionofstormclouds.name=injector of storm clouds
items.potions.exotic.potionofstormclouds.desc=Throwing this injector will create a quickly-spreading cloud of concentrated vapor, which will condense and pour down onto the environment. Most terrain will be converted to water, fiery enemies will take damage, fire will be doused, and traps will be overwhelmed and break.



###quest items
items.quest.ceremonialcandle.name=ceremonial candle
items.quest.ceremonialcandle.desc=A set of candles, melted down and fused together through use.\n\nAlone they are worthless, but used with other candles in a pattern, they can focus the energy for a summoning ritual.
items.quest.ceremonialcandle.discover_hint=You can find this item during a specific quest.

items.quest.corpsedust.name=corpse dust
items.quest.corpsedust.chill=A chill runs down your spine.
items.quest.corpsedust.desc=The ball of corpse dust doesn't differ outwardly from a regular dust ball. But you can feel a malevolent energy lurking within it.\n\nGetting rid of it as soon as possible would be a good idea.
items.quest.corpsedust.discover_hint=You can find this item during a specific quest.
items.quest.corpsedust&dustwraith.rankings_desc=Corrupted by Corpse Dust

items.quest.darkgold.name=raw Laztro
items.quest.darkgold.you_now_have=You now have %d chunks of raw Laztro.
items.quest.darkgold.desc=Laztro still locked in rock, with purple veins that glow in the dark. Unrefined it's no good as currency, but Corporal Moreno knows what to do with it.
items.quest.darkgold.discover_hint=You can find this item during a specific quest.

items.quest.dwarftoken.name=access chip
items.quest.dwarftoken.discard=You discard the extra chips.
items.quest.dwarftoken.desc=An access chip one of the vault guards was carrying. It must open something around here. Best to hold on to it.
items.quest.dwarftoken.desc_old=Some swarm guards carry access chips torn from ships. What they are for, only they know.
items.quest.dwarftoken.discover_hint=You can find this item during a specific quest.

items.quest.embers.name=elemental embers
items.quest.embers.desc=Special embers which can only be harvested from young fire elementals. They radiate thermal energy.
items.quest.embers.discover_hint=You can find this item during a specific quest.

items.quest.escapecrystal.name=escape crystal
items.quest.escapecrystal.ac_use=USE
items.quest.escapecrystal.prompt=Select an item
items.quest.escapecrystal.desc=A thin crystal holding a teleport charge. You can use it at any time to leave the vault, but if you leave early, you will not get the full reward!
items.quest.escapecrystal.discover_hint=You can find this item during a specific quest.
items.quest.escapecrystal.injure_warning_1=Time seems to slow and you hear the smuggler's voice:\n\n"Hey, you look pretty hurt, everything all right down there? I want my figurine, but not so badly that I want you to die getting it!"
items.quest.escapecrystal.injure_warning_2="If you're stuck in a nasty situation you can use one of those _teleport items from the starting room_ to escape back there and try again."
items.quest.escapecrystal.injure_warning_3="If things are looking really dire, you can _escape using that crystal I gave you._ I'm not going to give you the full reward but it's certainly better than dying!"
items.quest.escapecrystal.injure_confirm=Okay (this message won't appear again in future runs)
items.quest.escapecrystal.leaving_start=Time seems to slow as you hear the smuggler's voice:\n\n"Look, I get it if you're nervous, but please, at least leave the first room!"\n\n"Don't worry about your gear, I'm a pirate of my word, I promise everything will be waiting when you get back. I also promise to let you use the crystal to escape if you're really in danger."
items.quest.escapecrystal.leaving_early=Time seems to slow as you hear the smuggler's voice:\n\n"Seriously, running already!? You know you can get away from most of the enemies in there, right?"\n\n"Look, if your life is in danger I can pull you out, but I won't let you bring anything back. I expected a lot more from you =("
items.quest.escapecrystal.leaving_partly_explored=Time seems to slow down and you hear the Imp's voice:\n\n"Oh, are you leaving already? Well I suppose you've helped chart the place out, and that's better than nothing."\n\n"Still, I had expected more from you =(. Of course I'll pull you out if you need me to. I'll let you take something like a injector or cartridge with you I suppose."
items.quest.escapecrystal.leaving_fully_explored=Time seems to slow and you hear the smuggler's voice:\n\n"Need to leave? Well, at least you explored a good part of the vault. I hoped you'd do better looting it, but now I have a much better idea of how the place works."\n\n"I'll let you take something, but nothing upgraded!"
items.quest.escapecrystal.leaving_partial_victory=Time seems to slow and you hear the smuggler's voice:\n\n"I hoped you'd get my figurine, but you did a great job exploring and clearing most of the vault!"\n\n"You know what? I'll let you keep one item, as long as it's no higher than +1, and I'll still set up my stall a few sectors down. I need some time to plan my next moves anyway."
items.quest.escapecrystal.leaving_victory=Time seems to slow and you hear the smuggler's voice:\n\n"Excellent work!! Ready to leave? I'll take the figurine from you when you get back."\n\n"As promised, I'll set up my stall a few sectors down and let you take whatever you want! Choose carefully, everything else stays in the vault."
items.quest.escapecrystal.leaving_item=Are you sure this is the item that you want to take with you?
items.quest.escapecrystal.leaving_seal=_The Shield Generator attached to this armor is tied to the mirror and cannot be taken with you._ The generator will be automatically removed from the armor. This will reduce the armor's level by 1 but will not remove any plating it has.
items.quest.escapecrystal.leaving_staff=_This orbital transmitter is tied to the mirror and cannot be taken with you, but the special weapon attached to it can._ The special weapon will be removed from the transmitter and given to you at the transmitter's level -1.
items.quest.escapecrystal.leaving_yes=Leave the Vault
items.quest.escapecrystal.leaving_no=Stay Here
items.quest.escapecrystal.error_start=It looks like you aren't in the Vault level! This might have happened due to a bug or crash.
items.quest.escapecrystal.error_no_items=None of your items are being stored, so the crystal has been removed from your inventory.
items.quest.escapecrystal.error_with_items=Your items are currently being stored, so you should attempt to descend into the vault again to begin the quest. Your stored items will be returned to you when the quest ends.

items.quest.gooblob.name=chunk of the Matrix
items.quest.gooblob.desc=A piece of living tissue that came loose from the Swarm Matrix as it died. It still pulses, slowly. Maybe it is good for something.
items.quest.gooblob.discover_hint=You can get this item as a drop from certain enemies.

items.quest.impstatue.name=obsidian statuette
items.quest.impstatue.desc=A small jet-black figurine carved from obsidian. It looks like the smuggler who sent you here, down to the same glowing green eyes. There is an inscription on its base in a language you have never seen.
items.quest.impstatue.discover_hint=You can find this item during a specific quest.

items.quest.vaultbeacon.name=vault beacon
items.quest.vaultbeacon.desc=This return beacon seems to already have a location set, probably to the entry room you found it in.\n\nYou could use it to save time while exploring, or as a way to escape if you're in danger.
items.quest.vaultbeacon.discover_hint=You can find this item during a specific quest.

items.quest.metalshard.name=corrupted metal shard
items.quest.metalshard.desc=A shard of rusted corrupted metal, which broke off the drill rig as it was destroyed. You can feel inactive corrupted code within it.\n\nIt does nothing on its own, but it might be useful when combined with certain cartridges, or a bomb. At the very least it should convert into a decent amount of energy.
items.quest.metalshard.discover_hint=You can get this item as a drop from certain enemies.

items.quest.pickaxe.name=pickaxe
items.quest.pickaxe.ability_name=pierce
items.quest.pickaxe.ability_desc=The Duelist can _pierce_ an enemy with a pickaxe. This is guaranteed to hit, applies vulnerable for 3 turns, and deals _%1$d-%2$d damage_ to enemies with rigid skin.
items.quest.pickaxe.upgrade_ability_stat_name=Ability Damage
items.quest.pickaxe.desc=This is a sturdy and heavy tool for breaking rocks. You don't need to equip the pickaxe to mine with it, but it can probably be equipped as a weapon in a pinch.
items.quest.pickaxe.discover_hint=You can find this item during a specific quest.



###remains
items.remains.remainsitem.ac_use=USE
items.remains.remainsitem.discover_hint=You can find this item in the remains of a specific hero from a previous lost run.

items.remains.bowfragment.name=cannon fragment
items.remains.bowfragment.desc=This piece of metal was once part of the pulse cannon of an Exoskeleton Pilot who never came back. There are still spores stuck in the barrel, which you can use to grow some tall vegetation around you. Doing this will destroy the fragment however.

items.remains.brokenhilt.name=broken hilt
items.remains.brokenhilt.desc=This broken hilt looks like it came from a defeated Renegade's weapon. A little of the symbiote is still stuck to it, which you can use to get a little bonus damage on your next two melee hits. Doing this will destroy the hilt however.

items.remains.brokenstaff.name=broken transmitter
items.remains.brokenstaff.desc=This orbital transmitter broke in half when the Exterminator carrying it fell. There is still some charge left in it, which you can use to give your special weapons a little charge boost. Doing this will destroy the transmitter however.

items.remains.cloakscrap.name=scrap of fabric
items.remains.cloakscrap.desc=A scrap of translucent fabric that seems to have come from the active camo module of a Special Forces operator who never made it back. A little energy is left in it, enough to give your modules some extra charge. The scrap falls apart in the process.

items.remains.sealshard.name=generator shards
items.remains.sealshard.desc=These bits of casing look like they came from the shield generator of a fallen Marine. There is still a little charge left in the cells, which you can use to give yourself a bit of shielding. Doing this will destroy the generator shards however.

items.remains.tornpage.name=memory board
items.remains.tornpage.desc=This board looks like it was ripped out of the core of a deactivated Synthetic. There are still a few nanomedics in the circuit, which you can use to regain a little bit of health. Doing this will destroy the memory board however.



###rings
items.rings.ring.diamond=white-LED implant
items.rings.ring.opal=pearl-LED implant
items.rings.ring.garnet=maroon-LED implant
items.rings.ring.ruby=red-LED implant
items.rings.ring.amethyst=violet-LED implant
items.rings.ring.topaz=amber-LED implant
items.rings.ring.onyx=black-LED implant
items.rings.ring.tourmaline=pink-LED implant
items.rings.ring.emerald=green-LED implant
items.rings.ring.sapphire=blue-LED implant
items.rings.ring.quartz=frosted-LED implant
items.rings.ring.agate=orange-LED implant
items.rings.ring.equip_cursed=The implant digs into your arm painfully!
items.rings.ring.unknown_desc=A metal implant with an LED that blinks in the dark. Who knows what it does once installed?
items.rings.ring.known=This is a %s
items.rings.ring.identify=You are now familiar enough with your implant to identify it.
items.rings.ring.cursed_worn=Because this implant is corrupted, you are powerless to remove it.
items.rings.ring.curse_known=You detect malicious code hidden in this implant.
items.rings.ring.not_cursed=This implant is free of malicious code.

items.rings.ringofaccuracy.name=targeting implant
items.rings.ringofaccuracy.stats=When worn, this implant will increase your accuracy by _%s%%._
items.rings.ringofaccuracy.typical_stats=When worn, this implant will typically increase your accuracy by _%s%%._
items.rings.ringofaccuracy.combined_stats=Your equipped implants are combining their power, increasing your accuracy by _%s%%_ in total.
items.rings.ringofaccuracy.upgrade_stat_name_1=Accuracy Boost
items.rings.ringofaccuracy.desc=This implant increases your focus, making it easier for your attacks to find their mark. A corrupted implant will instead make it harder for your attacks to connect.

items.rings.ringofarcana.name=synergy implant
items.rings.ringofarcana.stats=When worn, this implant will increase the power of modifications and platings by _%s%%._
items.rings.ringofarcana.typical_stats=When worn, this implant will typically increase the power of modifications and platings by _%s%%._
items.rings.ringofarcana.combined_stats=Your equipped implants are combining their power, increasing the power of modifications and platings by _%s%%_ in total.
items.rings.ringofarcana.upgrade_stat_name_1=Synergy Boost
items.rings.ringofarcana.desc=This implant syncs your suit with the modifications on weapons and the platings on armor, including corruptions! It first increases activation chance, and then increases the strength of the effect once activation chance is 100%. A corrupted implant will instead weaken modifications, platings, and corruptions.

items.rings.ringofelements.name=resistance implant
items.rings.ringofelements.stats=When worn, this implant will provide _%s%%_ elemental resistance.
items.rings.ringofelements.typical_stats=When worn, this implant will typically provide _%s%%_ elemental resistance.
items.rings.ringofelements.combined_stats=Your equipped implants are combining their power, providing _%s%%_ elemental resistance in total.
items.rings.ringofelements.upgrade_stat_name_1=Resistance
items.rings.ringofelements.desc=This implant provides resistance to most elemental and energy effects, decreasing damage and debuff duration. Naturally a corrupted implant will instead worsen these effects.

items.rings.ringofenergy.name=energy implant
items.rings.ringofenergy.stats=When worn, this implant will increase special weapon, module, and heroic armor charge speed by _%s%%._
items.rings.ringofenergy.typical_stats=When worn, this implant will typically increase special weapon, module, and heroic armor charge speed by _%s%%._
items.rings.ringofenergy.combined_stats=Your equipped implants are combining their power, increasing charge speed by _%s%%_ in total.
items.rings.ringofenergy.upgrade_stat_name_1=Charge Boost
items.rings.ringofenergy.desc=This implant diverts extra power to your equipment, which recharges more quickly. A corrupted implant will instead slow recharge.

items.rings.ringofevasion.name=reflex implant
items.rings.ringofevasion.stats=When worn, this implant will increase your evasion by _%s%%._
items.rings.ringofevasion.typical_stats=When worn, this implant will typically increase your evasion by _%s%%._
items.rings.ringofevasion.combined_stats=Your equipped implants are combining their power, increasing your evasion by _%s%%_ in total.
items.rings.ringofevasion.upgrade_stat_name_1=Evasion Boost
items.rings.ringofevasion.desc=This implant quickens the wearer's reactions, making it harder to land blows on them. A corrupted implant will instead make the user easier to strike.

items.rings.ringofforce.name=brute force implant
items.rings.ringofforce.stats=When unarmed, at your current strength, this implant will deal _%1$d-%2$d damage._ With a weapon equipped, this implant will increase damage by _%3$d._
items.rings.ringofforce.typical_stats=When unarmed, at your current strength, typically this implant will deal _%1$d-%2$d damage._ With a weapon equipped, typically this implant will increase damage by _%3$d._
items.rings.ringofforce.combined_stats=Your equipped implants are combining their power, dealing a total of _%1$d-%2$d damage_ without a weapon, or increasing damage by _%3$d_ with one.
items.rings.ringofforce.upgrade_stat_name_1=Unarmed Damage
items.rings.ringofforce.upgrade_stat_name_2=Armed Damage Boost
items.rings.ringofforce.upgrade_stat_name_3=Ability Damage
items.rings.ringofforce.ability_name=brawler's stance
items.rings.ringofforce.typical_ability_desc=The Duelist can adopt a _brawler's stance_ with this implant, causing her regular attacks to always use this implant even with a weapon equipped. These attacks will typically deal _%1$d-%2$d damage_ and will also inherit the weapon's modification and augmentation. This stance slows weapon recharging speed by 50%%.
items.rings.ringofforce.ability_desc=The Duelist can adopt a _brawler's stance_ with this implant, causing her regular attacks to always use this implant even with a weapon equipped. These attacks will deal _%1$d-%2$d damage_ and will also inherit the weapon's modification and augmentation. This stance slows weapon recharging speed by 50%%.
items.rings.ringofforce.desc=This implant enhances the force of the wearer's melee blows. This extra power is fairly weak when wielding weapons, but an unarmed attack will be made much stronger. A corrupted implant will instead weaken the wearer's blows.
items.rings.ringofforce$brawlersstance.name=brawler's stance
items.rings.ringofforce$brawlersstance.desc=While in this stance the Duelist's regular attacks will use an equipped brute force implant even when she has a weapon equipped. These attacks gain bonus damage and will still use the weapon's augmentation and modification.\n\nMaintaining this stance takes focus however, reducing weapon ability recharge speed by 50%.\n\nThis stance can be toggled on or off by using a brute force implant, but the reduction in charge speed will persist for a little while if the stance is quickly activated and deactivated.

items.rings.ringoffuror.name=frenzy implant
items.rings.ringoffuror.stats=When worn, this implant will increase the speed of your attacks by _%s%%._
items.rings.ringoffuror.typical_stats=When worn, this implant will typically increase the speed of your attacks by _%s%%._
items.rings.ringoffuror.combined_stats=Your equipped implants are combining their power, increasing the speed of your attacks by _%s%%_ in total.
items.rings.ringoffuror.upgrade_stat_name_1=Attack Speed Boost
items.rings.ringoffuror.desc=This implant grants the wearer an inner fury, allowing them to attack more rapidly. A corrupted implant will instead slow the wearer's speed of attack.

items.rings.ringofhaste.name=locomotor implant
items.rings.ringofhaste.stats=When worn, this implant will increase your movement speed by _%s%%._
items.rings.ringofhaste.typical_stats=When worn, this implant will typically increase your movement speed by _%s%%._
items.rings.ringofhaste.combined_stats=Your equipped implants are combining their power, increasing your movement speed by _%s%%_ in total.
items.rings.ringofhaste.upgrade_stat_name_1=Move Speed Boost
items.rings.ringofhaste.desc=This implant reduces the stress of movement on the wearer, allowing them to run at superhuman speeds. A corrupted implant will instead weigh the wearer down.

items.rings.ringofmight.name=muscle implant
items.rings.ringofmight.stats=When worn, this implant will increase your strength by _%1$d_ and your max HP by _%2$s%%._
items.rings.ringofmight.typical_stats=When worn, this implant will typically increase your strength by _%1$d_ and your max HP by _%2$s%%._
items.rings.ringofmight.combined_stats=Your equipped implants are combining their power, boosting your strength by _%1$d_ and max HP by _%2$s%%_ in total.
items.rings.ringofmight.upgrade_stat_name_1=Strength Boost
items.rings.ringofmight.upgrade_stat_name_2=Max HP Boost
items.rings.ringofmight.desc=This implant enhances the physical traits of the wearer, granting them greater physical strength and constitution. A corrupted implant will weaken the wearer.

items.rings.ringofsharpshooting.name=ballistic implant
items.rings.ringofsharpshooting.stats=When worn, this implant will boost the damage of your thrown weapons as if their level was increased by _%1$d_, and will increase their durability by _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=When worn, this implant will typically boost the damage of your thrown weapons as if their level was increased by _%1$d_ and will increase their durability by _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Your equipped implants are combining their power, boosting effective thrown weapon level by _%1$d_ and increasing their durability by _%2$s%%_ in total.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Level Damage Boost
items.rings.ringofsharpshooting.upgrade_stat_name_2=Durability Boost
items.rings.ringofsharpshooting.desc=This implant enhances the wearer's precision and aim, which will make all projectile weapons more damaging and durable. A corrupted implant will have the opposite effect.

items.rings.ringoftenacity.name=subdermal plating
items.rings.ringoftenacity.stats=When worn, this implant will reduce the damage you take by up to _%s%%._
items.rings.ringoftenacity.typical_stats=When worn, this implant will typically reduce the damage you take by up to _%s%%._
items.rings.ringoftenacity.combined_stats=Your equipped implants are combining their power, reducing the damage you take by up to _%s%%_ in total.
items.rings.ringoftenacity.upgrade_stat_name_1=Max Damage Resist
items.rings.ringoftenacity.desc=When worn, this implant will allow the wearer to resist normally mortal strikes. The more injured the user is, the more resistant they will be to damage. A corrupted implant will instead make it easier for enemies to execute the wearer.

items.rings.ringofwealth.name=scavenging implant
items.rings.ringofwealth.stats=When worn, this implant will increase your luck by _%s%%._
items.rings.ringofwealth.typical_stats=When worn, this implant will typically increase your luck by _%s%%._
items.rings.ringofwealth.combined_stats=Your equipped implants are combining their power, increasing your luck by _%s%%_ in total.
items.rings.ringofwealth.upgrade_stat_name_1=Luck Boost
items.rings.ringofwealth.desc=This implant acts like a magnet for treasure, increasing the likelihood that enemies and containers will be carrying valuable items. A corrupted implant will instead reduce your chance of receiving loot.



###scrolls
items.scrolls.scroll.ac_read=RUN
items.scrolls.scroll.kaunan=cartridge of KAUNAN
items.scrolls.scroll.sowilo=cartridge of SOWILO
items.scrolls.scroll.laguz=cartridge of LAGUZ
items.scrolls.scroll.yngvi=cartridge of YNGVI
items.scrolls.scroll.gyfu=cartridge of GYFU
items.scrolls.scroll.raido=cartridge of RAIDO
items.scrolls.scroll.isaz=cartridge of ISAZ
items.scrolls.scroll.mannaz=cartridge of MANNAZ
items.scrolls.scroll.naudiz=cartridge of NAUDIZ
items.scrolls.scroll.berkanan=cartridge of BERKANAN
items.scrolls.scroll.odal=cartridge of ODAL
items.scrolls.scroll.tiwaz=cartridge of TIWAZ
items.scrolls.scroll.unknown_desc=A Vigil-7 data cartridge with an unreadable code on its label. Who knows what happens when your suit runs it?
items.scrolls.scroll.blinded=You can't run a cartridge while blinded.
items.scrolls.scroll.no_magic=You can't run a cartridge while energy immune.
items.scrolls.scroll.cursed=Your corrupted database prevents you from running this cartridge's program! A cartridge of remove corruption might be strong enough to still work though...
items.scrolls.scroll$placeholder.name=cartridge

items.scrolls.inventoryscroll.warning=Do you really want to cancel this cartridge usage? The cartridge wasn't previously identified, so it will be consumed anyway.
items.scrolls.inventoryscroll.yes=Yes, I'm positive
items.scrolls.inventoryscroll.no=No, I changed my mind

items.scrolls.scrollofidentify.name=analysis cartridge
items.scrolls.scrollofidentify.inv_title=Identify an item
items.scrolls.scrollofidentify.it_is=Your item has been identified: %s.
items.scrolls.scrollofidentify.desc=This cartridge permanently reveals all of the secrets of a single item.

items.scrolls.scrolloflullaby.name=sleep pulse cartridge
items.scrolls.scrolloflullaby.sooth=The cartridge utters a soothing melody. You feel very sleepy.
items.scrolls.scrolloflullaby.desc=Reading this cartridge emits a soothing melody which will lull all who hear it into a deep induced sleep. For the reader and their allies the sleep is restorative.

items.scrolls.scrollofmagicmapping.name=sector map cartridge
items.scrolls.scrollofmagicmapping.layout=You are now aware of the level layout.
items.scrolls.scrollofmagicmapping.desc=When this cartridge is run, an image of crystal clarity will be etched into your memory, alerting you to the precise layout of the level and revealing all hidden secrets. The locations of items and creatures will remain unknown.

items.scrolls.scrollofmirrorimage.name=hologram cartridge
items.scrolls.scrollofmirrorimage.copies=The cartridge forms mirror images of you.
items.scrolls.scrollofmirrorimage.no_copies=The cartridge attempts to create mirror images of you, but they have nowhere to go.
items.scrolls.scrollofmirrorimage.desc=The incantation on this cartridge will create two illusory twins of the reader. These mirror images act as weaker clones of the reader, and will chase down their enemies. They have no durability however, and will fade upon taking damage.

items.scrolls.scrollofretribution.name=discharge cartridge
items.scrolls.scrollofretribution.blast=A burst of energy erupts from the cartridge!
items.scrolls.scrollofretribution.desc=This cartridge contains destructive energy which channels the reader's suffering outward into a blast of power. The weaker the reader is, the more damage they will deal. At very low health this cartridge can kill most enemies instantly.\n\nUsing the cartridge takes a toll on the user however, blinding and weakening them.

items.scrolls.scrollofrage.name=taunt cartridge
items.scrolls.scrollofrage.roar=The cartridge emits an enraging roar that echoes throughout the sector!
items.scrolls.scrollofrage.desc=When run, this cartridge will unleash a great roar that draws all enemies to the reader, and enrages nearby ones.

items.scrolls.scrollofrecharging.name=recharge cartridge
items.scrolls.scrollofrecharging.surge=A surge of energy courses through your body, invigorating your special weapons!
items.scrolls.scrollofrecharging.desc=The energy charge stored in this cartridge will charge up all the user's special weapons over time when released.

items.scrolls.scrollofremovecurse.name=purge cartridge
items.scrolls.scrollofremovecurse.inv_title=Cleanse an item
items.scrolls.scrollofremovecurse.cleansed=Your item glows with a cleansing light, and a malevolent energy disperses!
items.scrolls.scrollofremovecurse.not_cleansed=Your item glows with a cleansing light, but nothing happens.
items.scrolls.scrollofremovecurse.spirit=Your cartridge purges the crew hologram!
items.scrolls.scrollofremovecurse.desc=The incantation on this cartridge will instantly strip any corruptions from a single weapon, implant, special weapon, armor, or module.

items.scrolls.scrollofteleportation.name=teleport cartridge
items.scrolls.scrollofteleportation.tele=In a blink of an eye you were teleported to another location of the level.
items.scrolls.scrollofteleportation.no_tele=The teleport fails.
items.scrolls.scrollofteleportation.cant_reach=You can't teleport there.
items.scrolls.scrollofteleportation.prompt=Choose a location to teleport
items.scrolls.scrollofteleportation.desc=The program on this cartridge instantly transports the reader to a different location on the sector. The cartridge prioritizes areas the reader hasn't been to before, though it is not able to teleport past locked doors or barricades. It can, however, reveal hidden doors that lead to new areas.

items.scrolls.scrollofterror.name=panic cartridge
items.scrolls.scrollofterror.none=The cartridge emits a brilliant flash of red light.
items.scrolls.scrollofterror.one=The cartridge emits a brilliant flash of red light and the %s flees!
items.scrolls.scrollofterror.many=The cartridge emits a brilliant flash of red light and the monsters flee!
items.scrolls.scrollofterror.desc=When run, this cartridge will emit a flash of red light that will overwhelm all enemies in your field of view with terror, and they will turn and flee. Attacking a fleeing enemy will shorten the effect.

items.scrolls.scrolloftransmutation.name=reprogramming cartridge
items.scrolls.scrolloftransmutation.inv_title=Transmute an item
items.scrolls.scrolloftransmutation.nothing=Nothing interesting happens.
items.scrolls.scrolloftransmutation.morph=Your item morphs into something different!
items.scrolls.scrolloftransmutation.desc=This cartridge contains a powerful transmutation program. When used on an eligible item it will transform it into a different item of the same type. The program will even preserve upgrades, modifications, and platings. Cartridges and injectors will be transmuted into their exotic equivalent, and vice-versa.

items.scrolls.scrollofupgrade.name=modification kit
items.scrolls.scrollofupgrade.inv_title=Upgrade an item
items.scrolls.scrollofupgrade.weaken_curse=The modification kit weakens the corruption on your item.
items.scrolls.scrollofupgrade.remove_curse=The modification kit cleanses the corruption on your item!
items.scrolls.scrollofupgrade.desc=This cartridge will upgrade a single item or set of thrown weapons. Special weapons will increase in power and number of charges, weapons and armor will deal and block more damage, thrown weapon sets will be fully repaired and more durable, and the effects of implants will intensify.\n\nIt can even weaken or sometimes totally dispel corruptions, though it is not as potent as a cartridge of remove corruption. Unfortunately, the upgrading program can also erase modifications or platings on higher level gear.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=exotic cartridge of KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=exotic cartridge of SOWILO
items.scrolls.exotic.exoticscroll.laguz=exotic cartridge of LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=exotic cartridge of YNGVI
items.scrolls.exotic.exoticscroll.gyfu=exotic cartridge of GYFU
items.scrolls.exotic.exoticscroll.raido=exotic cartridge of RAIDO
items.scrolls.exotic.exoticscroll.isaz=exotic cartridge of ISAZ
items.scrolls.exotic.exoticscroll.mannaz=exotic cartridge of MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotic cartridge of NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=exotic cartridge of BERKANAN
items.scrolls.exotic.exoticscroll.odal=exotic cartridge of ODAL
items.scrolls.exotic.exoticscroll.tiwaz=exotic cartridge of TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=A glowing indecipherable code is written on this black cartridge. It seems to be foreign to this land, who knows what it will do when run?
items.scrolls.exotic.exoticscroll.discover_hint=You can craft this item via synthesis.

items.scrolls.exotic.scrollofsirenssong.name=cartridge of siren's song
items.scrolls.exotic.scrollofsirenssong.prompt=Choose a target
items.scrolls.exotic.scrollofsirenssong.no_target=The cartridge activates without a target.
items.scrolls.exotic.scrollofsirenssong.cancel=You must choose a target.
items.scrolls.exotic.scrollofsirenssong.desc=Reading this cartridge emits an alluring melody which will enthrall a targeted enemy, permanently turning them into an ally! Other enemies who hear it will be entranced for a while.\n\nParticularly strong enemies can resist the enthrall effect, and will be entranced instead.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=enthralled
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=This creature has been dominated by the signal of a cartridge of siren's song.\n\nAn enthralled character is permanently your ally, and will fight any enemies they encounter.

items.scrolls.exotic.scrollofantimagic.name=cartridge of anti-energy
items.scrolls.exotic.scrollofantimagic.desc=The program on this cartridge will surround you with an isolation field that temporarily blocks all energy effects, harmful or helpful. This includes most item effects such as special weapons, cartridges, implants, modules, modifications, and corruptions. Heroic armor abilities are strong enough to work regardless however.

items.scrolls.exotic.scrollofchallenge.name=cartridge of challenge
items.scrolls.exotic.scrollofchallenge.desc=When run, this cartridge will unleash a great roar that draws enemies to the user while simultaneously creating a small arena around them.\n\nAs long as the reader stays in this arena they will take 33% less damage from all sources (this is applied before other forms of damage reduction), and they will not lose satiety.\n\nThe size of the arena will scale with the size of the area the reader is in. It will be particularly small in some boss areas.
items.scrolls.exotic.scrollofchallenge$challengearena.name=challenge arena
items.scrolls.exotic.scrollofchallenge$challengearena.desc=A containment arena has appeared around you, denoted by a billowing red fog.\n\nWhile standing in the fog, your hunger will not increase and you will take 33%% less damage from all sources. If you have any other sources of damage reduction (such as armor), they will apply after the 33%% reduction.\n\nTurns remaining: %d.

items.scrolls.exotic.scrollofdivination.name=cartridge of cataloging
items.scrolls.exotic.scrollofdivination.nothing_left=There is nothing left to identify!
items.scrolls.exotic.scrollofdivination.desc=This cartridge will randomly identify four types of item that you don't currently know. The types identified can be a injector's color, a cartridge's code, or an implant's LED. The items identified won't necessarily be ones you're carrying.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Your cartridge of divination has identified the following items:

items.scrolls.exotic.scrollofdread.name=cartridge of dread
items.scrolls.exotic.scrollofdread.desc=When run, this cartridge will emit a flash of red light that will instill incredible terror in all enemies in your field of view. So great is this effect that they will rapidly try to flee from the whole sector, never to be seen again!\n\nJust like with terror, this effect can expire with time, or if the enemy is attacked.\n\nStrong-willed enemies, such as bosses, will be inflicted with regular terror instead.

items.scrolls.exotic.scrollofenchantment.name=cartridge of modification
items.scrolls.exotic.scrollofenchantment.inv_title=Modify an item
items.scrolls.exotic.scrollofenchantment.weapon=Select a modification to apply to your weapon.
items.scrolls.exotic.scrollofenchantment.armor=Select a plating to apply to your armor.
items.scrolls.exotic.scrollofenchantment.cancel=cancel
items.scrolls.exotic.scrollofenchantment.cancel_warn=Cancelling will still consume your cartridge of modification, are you sure?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Yes, I'm sure
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, I changed my mind
items.scrolls.exotic.scrollofenchantment.desc=This cartridge will infuse a weapon or armor with a powerful modification package. The reader even has some degree of control over which modification is applied.

items.scrolls.exotic.scrollofforesight.name=cartridge of foresight
items.scrolls.exotic.scrollofforesight.desc=After running this cartridge, the detail of nearby terrain will be constantly fed to the reader's mind in crystal clarity. This effect lasts for a considerable amount of time, and will reveal all hidden doors or traps, making searching unnecessary.

items.scrolls.exotic.scrollofmetamorphosis.name=cartridge of metamorphosis
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Choose a talent to metamorphose.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Choose a new talent to replace your metamorphosed talent with.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Cancelling will still consume your cartridge of metamorphosis, are you sure?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorphose talent
items.scrolls.exotic.scrollofmetamorphosis.desc=This cartridge contains a powerful transmutation program, which will apply to the user instead of to an item. The program on this cartridge will let you select one talent, and replace it with one of five talents of the same tier from different hero classes!\n\nThis effect can only apply to class talents, not talents gained from subclasses or armor abilities. Talents that you cannot use will not be given as options.

items.scrolls.exotic.scrollofmysticalenergy.name=cartridge of mystical energy
items.scrolls.exotic.scrollofmysticalenergy.desc=The energy charge stored in this cartridge will, when released, charge a user's equipped modules over time.

items.scrolls.exotic.scrollofpassage.name=cartridge of passage
items.scrolls.exotic.scrollofpassage.desc=The program on this cartridge instantly transports the reader to the first sector of the nearest region above them. Very handy for quickly getting to a shop.

items.scrolls.exotic.scrollofprismaticimage.name=cartridge of prismatic image
items.scrolls.exotic.scrollofprismaticimage.desc=The incantation on this cartridge will create a colorful illusory twin of the reader. This prismatic image acts as a weaker clone of the reader, with similar defence but lower hp and damage.\n\nThe prismatic image will show itself when enemies are present, and will attempt to defend the reader.\n\nIf a prismatic image already exists, using this cartridge will fully heal it.

items.scrolls.exotic.scrollofpsionicblast.name=cartridge of psionic blast
items.scrolls.exotic.scrollofpsionicblast.ondeath=The Psionic Blast tears your mind apart...
items.scrolls.exotic.scrollofpsionicblast.desc=This cartridge contains incredible destructive energy that can be channeled to destroy the minds of all visible creatures.\n\nThere is significant feedback however, and the reader will also be damaged, blinded, and weakened. The more targets the cartridge hits, the less self-damage will be taken.



###spells
items.spells.alchemize.name=matter converter
items.spells.alchemize.prompt=Convert an item
items.spells.alchemize.desc=A portable converter built on the same technology as the synthesis bench. Each use turns an item, or a stack of items, into Laztro or synthesis energy. Converting injectors or cartridges into energy will even identify them!\n\nShops sell a few converters, and many more can be made at the synthesis bench with a seed, a tactical capsule and a bit of synthesis energy.
items.spells.alchemize$wndalchemizeitem.sell=Turn into %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Turn 1 into %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Turn all into %dg
items.spells.alchemize$wndalchemizeitem.energize=Turn into %d energy
items.spells.alchemize$wndalchemizeitem.energize_1=Turn 1 into %d energy
items.spells.alchemize$wndalchemizeitem.energize_all=Turn all into %d energy

items.spells.beaconofreturning.name=return beacon
items.spells.beaconofreturning.preventing=The strong interference in this place prevents you from using the device!
items.spells.beaconofreturning.creatures=The Psychic aura of neighbouring creatures doesn't allow you to teleport at this moment.
items.spells.beaconofreturning.set=The beacon was set at your current location.
items.spells.beaconofreturning.wnd_body=Setting will override the location the beacon was previously set to.\n\nReturning will return to your last set location and consume one use of the device.
items.spells.beaconofreturning.wnd_set=Set
items.spells.beaconofreturning.wnd_return=Return
items.spells.beaconofreturning.desc_set=This beacon was set somewhere on sector %d.
items.spells.beaconofreturning.desc=This intricate device grants the user the ability to return to a set location, regardless of distance. The device will only be consumed by returning, it can be set as many times as you like, but it will only remember the most recent location it was set to.

items.spells.curseinfusion.name=corruption virus
items.spells.curseinfusion.inv_title=Corruption an item
items.spells.curseinfusion.desc=This device infuses a piece of equipment with the same powerful corrupted code running in the drill rig. The item it is used on will immediately be corrupted, and any modification or plating it may have had will be overridden.\n\nIn the case of weapons, armor, and special weapons, the item will gain upgrades in addition to being corrupted. Corruption infusion upgrades do not stack, and the upgrades are lost if the item becomes uncorrupted.\n\nMultiple corruption infusions can also be used to change the corruption on a weapon or armor.

items.spells.spell.ac_cast=ACTIVATE
items.spells.spell.no_magic=You can't use devices while energy immune.
items.spells.spell.discover_hint=You can craft this item via synthesis.

items.spells.magicalinfusion.name=nano-infusion
items.spells.magicalinfusion.inv_title=Infuse an item
items.spells.magicalinfusion.infuse=Your item is infused with nanobots!
items.spells.magicalinfusion.desc=This device possesses the same power as a modification kit, but in a more stable form.\n\nIn addition to upgrading an item as normal it will never erase a modification, plating, or corruption.

items.spells.magicalporter.name=cargo drone
items.spells.magicalporter.inv_title=Port an item
items.spells.magicalporter.nowhere=There is nowhere for you to port an item to.
items.spells.magicalporter.desc=This device will transport any item it is cast on. Unlike a merchant's beacon however, the items will be transported to the entrance of the next boss sector.

items.spells.phaseshift.name=phase emitter
items.spells.phaseshift.no_target=There is nothing to teleport there.
items.spells.phaseshift.desc=This chaotic device will teleport any character it is aimed at to a random location on the current sector, and stun them for a significant amount of time. Powerful foes will be able to resist the stunning effect. This device can be directed at a target or at the user themselves.

items.spells.reclaimtrap.name=trap collector
items.spells.reclaimtrap.no_trap=There is no trap there.
items.spells.reclaimtrap.desc_trap=The device is currently ready to trigger a _%s._
items.spells.reclaimtrap.desc=This device contains remnants of the mechanical energy of the drill rig. When cast on an active trap, the power of the trap will become attached to you, allowing you to use the device again to expel this power and trigger the trap's effect at any location you like.\n\nHowever, some traps may not function in all places, and only one trap can be stored at a time.

items.spells.recycle.name=molecular recycler
items.spells.recycle.inv_title=Recycle an item
items.spells.recycle.recycled=Your item was recycled into: %s.
items.spells.recycle.desc=This device contains a lesser form of the transmutation program. While it won't work on equipment, this device will transform a cartridge, injector, seed, tactical capsule, or tipped dart into a random item of the same type.

items.spells.summonelemental.name=spore incubator
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.imbue_prompt=Imbue an item
items.spells.summonelemental.desc=This device channels the energy of the elemental embers used to make it, and will allow you to summon a friendly elemental to fight with you! Only one elemental can be summoned at a time, but the device can be re-cast to return the elemental to you at no cost.
items.spells.summonelemental.desc_newborn=The device is currently unimbued, and will summon a _newborn elemental_ without a ranged attack. You can imbue an identified injector of liquid flame, injector of frost, cartridge of recharging, or cartridge of transmutation to power the device up, causing future summons to be a full power elemental!
items.spells.summonelemental.desc_fire=The device is currently hot to the touch, it will summon a _fire elemental_. You can imbue a different item, but the device will lose its current imbue.
items.spells.summonelemental.desc_frost=The device is currently cold to the touch, it will summon a _frost elemental_. You can imbue a different item, but the device will lose its current imbue.
items.spells.summonelemental.desc_shock=The device is currently radiating static energy, it will summon a _shock elemental_. You can imbue a different item, but the device will lose its current imbue.
items.spells.summonelemental.desc_chaos=The device is currently radiating chaotic energy, it will summon a _chaos elemental_. You can imbue a different item, but the device will lose its current imbue.

items.spells.targetedspell.prompt=Choose a target
items.spells.targetedspell.inv_title=Infuse an item

items.spells.telekineticgrab.name=magnetic grabber
items.spells.telekineticgrab.cant_grab=You can't grab that.
items.spells.telekineticgrab.no_target=There's nothing to grab there.
items.spells.telekineticgrab.desc=This device allows the caster to remotely grab all items at a location, or all thrown weapons stuck to an enemy!\n\nIt can't be used to grab items that someone else owns, or to grab containers like chests.

items.spells.unstablespell.name=unstable device
items.spells.unstablespell.desc=This small black square crystal shows shifting code on each of its surfaces.\n\nWhen activated, it will trigger the effect of a random cartridge. The cartridge effect will always be combat focused if there are enemies in your field of view, and will always be non-combat focused otherwise.

items.spells.wildenergy.name=overload
items.spells.wildenergy.desc=This device contains some of the corrupted energy which powered the drill rig. When cast, it will recharge your special weapons and worn modules, while also triggering a random corrupted special weapon effect. You are able to choose a direction for this corrupted energy to shoot in, however.


###runestones
items.stones.inventorystone.ac_use=USE

items.stones.runestone$placeholder.name=tactical capsule
items.stones.runestone.discover_hint=You can find this item randomly during the mission, or craft it via synthesis.

items.stones.stoneofaggression.name=pheromone capsule
items.stones.stoneofaggression.desc=When this capsule is thrown at an ally or enemy, all nearby enemies will prefer to attack that character for a short time.\n\nBoss enemies cannot be targeted by this effect directly, but it does work on their minions.
items.stones.stoneofaggression$aggression.name=targeted
items.stones.stoneofaggression$aggression.desc=The pheromone is making all nearby enemies prefer to attack this character.\n\nTurns remaining: %s.

items.stones.stoneofaugmentation.name=adjustment capsule
items.stones.stoneofaugmentation.inv_title=Augment an item
items.stones.stoneofaugmentation.desc=This tactical capsule holds nanobots which can augment equipment to enhance one property at the cost of another.\n\nUsing on a weapon will allow you to enhance either speed or damage. Thrown weapons will also gain or lose durability in proportion with their speed.\n\nUsing on armor will allow you to enhance either defense or evasion.
items.stones.stoneofaugmentation.discover_hint=You can buy this item in a shop, or craft it via synthesis.
items.stones.stoneofaugmentation$wndaugment.choice=Augmenting for one property will reduce the other. What property would you like to enhance?
items.stones.stoneofaugmentation$wndaugment.already=This item is already augmented, you can swap the augment or remove it.
items.stones.stoneofaugmentation$wndaugment.speed=+Speed -Damage
items.stones.stoneofaugmentation$wndaugment.damage=+Damage -Speed
items.stones.stoneofaugmentation$wndaugment.evasion=+Evasion -Defense
items.stones.stoneofaugmentation$wndaugment.defense=+Defense -Evasion
items.stones.stoneofaugmentation$wndaugment.none=Remove Augmentation
items.stones.stoneofaugmentation$wndaugment.cancel=Never mind

items.stones.stoneofblast.name=explosive capsule
items.stones.stoneofblast.desc=This tactical capsule will instantly explode at the location it is thrown to. Just like a bomb, the explosion will deal damage to anything nearby.

items.stones.stoneofblink.name=jump capsule
items.stones.stoneofblink.desc=This tactical capsule will teleport the user to the location it is thrown to.

items.stones.stoneofclairvoyance.name=scan capsule
items.stones.stoneofclairvoyance.desc=This capsule will instantly reveal all tiles in a very wide area around where it is thrown. Its effect will even reach through walls.

items.stones.stoneofdeepsleep.name=sleep capsule
items.stones.stoneofdeepsleep.desc=When this capsule is thrown at an enemy, it will put them into a deep induced sleep. Enemies in induced sleep will sleep forever until disturbed.

items.stones.stoneofdetectmagic.name=diagnostic capsule
items.stones.stoneofdetectmagic.inv_title=Detect an item
items.stones.stoneofdetectmagic.detected_none=You don't detect any alteration on this item.
items.stones.stoneofdetectmagic.detected_both=You detect both positive alterations and corruption on this item!
items.stones.stoneofdetectmagic.detected_good=You detect positive alterations on this item!
items.stones.stoneofdetectmagic.detected_bad=You detect corruption on this item!
items.stones.stoneofdetectmagic.desc=This tactical capsule is able to detect alterations on an item. Using this capsule on an unidentified item will tell you if it is affected by a malevolent corruption and whether it is has positive alterations such as a modification or upgrades.

items.stones.stoneofdisarming.name=disarm capsule
items.stones.stoneofdisarming.desc=This tactical capsule emits a pulse that disables the hidden traps around it. It will disarm up to 9 traps around the area it is thrown at.

items.stones.stoneofenchantment.name=modification capsule
items.stones.stoneofenchantment.inv_title=Modify an item
items.stones.stoneofenchantment.weapon=Your weapon glows in the darkness!
items.stones.stoneofenchantment.armor=Your armor glows in the darkness!
items.stones.stoneofenchantment.desc=This tactical capsule holds modification power. Unlike a modification kit, it will not increase the direct power of an item, but will instead imbue a weapon or armor with a modification, granting it a new power.

items.stones.stoneoffear.name=panic capsule
items.stones.stoneoffear.desc=When this capsule is thrown onto a character they will be overwhelmed with terror, and will turn and flee. Attacking a fleeing character will shorten the effect.

items.stones.stoneofflock.name=decoy capsule
items.stones.stoneofflock.desc=This tactical capsule projects holographic sheep for a short time around the location it is thrown to.

items.stones.stoneofintuition.name=analysis capsule
items.stones.stoneofintuition.inv_title=Select an item
items.stones.stoneofintuition.desc=This tactical capsule holds a weaker version of the program found in cartridges of identification. Rather than directly identifying an item, it will work on your intuition, allowing you to attempt to identify the type of a injector, cartridge, or implant by guessing.
items.stones.stoneofintuition.break_info=You can use capsules of intuition twice before one breaks, _your next use won't consume a capsule_.
items.stones.stoneofintuition.break_warn=You've used a capsule of intuition previously, so _your next use will consume a capsule_.
items.stones.stoneofintuition$wndguess.text=Guess what the type of the unidentified item is. If you guess correctly, the type will be identified!
items.stones.stoneofintuition$wndguess.correct=Correct. The item's type has been identified!
items.stones.stoneofintuition$wndguess.incorrect=Your guess was incorrect.
items.stones.stoneofintuition$wndguess.break=Your capsule of intuition crumbles to dust...

items.stones.stoneofshock.name=shock capsule
items.stones.stoneofshock.desc=This tactical capsule unleashes a blast of electrical energy which briefly stuns all nearby targets, and grants the thrower special weapon charge for each target hit.


###trinkets
items.trinkets.chaoticcenser.name=chaotic censer
items.trinkets.chaoticcenser.spew=Your censer is about to spew: %s.
items.trinkets.chaoticcenser.desc=After some time in the synthesis bench this incense-burning censer appears to be producing smoke all on its own! These gasses build up and will spew forth from the censer toward enemies at semi-random intervals. It seems capable of producing all sorts of gasses, but you'll get a moment of warning just before the censer activates.
items.trinkets.chaoticcenser.typical_stats_desc=Typically this trinket will spawn a harmful gas near an enemy roughly every _%d_ turns. Gasses will only appear when enemies are present. At higher levels these gases are more likely to be exotic and powerful.
items.trinkets.chaoticcenser.stats_desc=At its current level, this trinket will spawn a harmful gas near an enemy roughly every _%d_ turns. Gasses will only appear when enemies are present. At higher levels these gases are more likely to be exotic and powerful.

items.trinkets.crackedspyglass.name=cracked spyglass
items.trinkets.crackedspyglass.desc=This handheld telescope would be a demonstration of great and precise workmanship, if it weren't for the crack along its front lens. The spyglass seems to be helping you by revealing new items in the sectors, but due to its flaw the revealed items are quite hard to see!
items.trinkets.crackedspyglass.typical_stats_desc=Typically this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss sector.
items.trinkets.crackedspyglass.stats_desc=At its current level, this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss sector.
items.trinkets.crackedspyglass.stats_desc_upgraded=At its current level, this trinket has a _100%% chance_ to create an extra hidden item on each non-boss sector, and a _%1$s%% chance_ to create a second extra hidden item.

items.trinkets.dimensionalsundial.name=dimensional sundial
items.trinkets.dimensionalsundial.warning=Your sundial isn't casting a shadow, you feel uneasy.
items.trinkets.dimensionalsundial.desc=This small handheld sundial is somehow able to cast a shadow in the depths of the planet, even if you aren't holding it upright. Even more strangely, the shadow's position seems to have no relation to the sun in this world. When no shadow is cast, the sundial seems to attract danger.
items.trinkets.dimensionalsundial.typical_stats_desc=Typically this trinket will reduce the spawning rate of enemies by _%1$d%%_ during the daytime in real life (8am-8pm), and increase the spawning rate of enemies by _%2$d%%_ at nighttime (8pm-8am).
items.trinkets.dimensionalsundial.stats_desc=At its current level, this trinket will reduce the spawning rate of enemies by _%1$d%%_ during the daytime in real life (8am-8pm), and increase the spawning rate of enemies by _%2$d%%_ at nighttime (8pm-8am).

items.trinkets.exoticcrystals.name=exotic crystals
items.trinkets.exoticcrystals.desc=These small pink crystals have the same shape as crystals of synthesis energy. While they can't be used for energy directly, they seem to be somehow influencing the injectors and cartridges you find.
items.trinkets.exoticcrystals.typical_stats_desc=Typically this trinket will replace _%s%%_ of injector or cartridge drops with their exotic equivalents. This does not affect injectors of strength, modification kits, or items that are generated to help solve hazard rooms.
items.trinkets.exoticcrystals.stats_desc=At its current level this trinket will replace _%s%%_ of injector or cartridge drops with their exotic equivalents. This does not affect injectors of strength, modification kits, or items that are generated to help solve hazard rooms.

items.trinkets.eyeofnewt.name=eye of newt
items.trinkets.eyeofnewt.desc=This golden and black newt's eye is a common ingredient, now enhanced into a trinket. The eye seems to be reducing your vision in exchange for letting you see things in other ways.
items.trinkets.eyeofnewt.typical_stats_desc=Typically this trinket will reduce your vision range by _%1$s%%_, but will also grant you mind vision on enemies within _%2$d_ tiles.
items.trinkets.eyeofnewt.stats_desc=At its current level this trinket will reduce your vision range by _%1$s%%_, but will also grant you mind vision on enemies within _%2$d_ tiles.

items.trinkets.ferrettuft.name=ferret tuft
items.trinkets.ferrettuft.desc=A tuft of silky white ferret fur, held together by a Lime green ribbon tied into a bow. Ferrets are known for their agility, mischievousness, and lack of integrity. Some of that power seems to radiate from the trinket, enhancing the evasion of anything nearby.
items.trinkets.ferrettuft.typical_stats_desc=Typically this trinket will increase the evasion of all characters by _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=At its current level this trinket will increase the evasion of all characters by _%1$s%%_.

items.trinkets.mimictooth.name=mimicker tooth
items.trinkets.mimictooth.desc=This large sharp tooth must have been pulled from a very unhappy mimicker. It seems to be influencing the mimickers on this planet, making them more frequent and dangerous.
items.trinkets.mimictooth.typical_stats_desc=Typically this trinket will make all kinds of mimicker _%1$sx_ more common and much more difficult to detect, but will also increase the amount of loot they drop. Each sector will also have a _%2$s%%_ chance to contain an extra shadow mimicker.
items.trinkets.mimictooth.stats_desc=At its current level this trinket will make all kinds of mimicker _%1$sx_ more common and much more difficult to detect, but will also increase the amount of loot they drop. Each sector will also have a _%2$s%%_ chance to contain an extra shadow mimicker.

items.trinkets.mossyclump.name=mossy clump
items.trinkets.mossyclump.desc=This clump of wet moss seems to hold onto its moisture no matter how hard you squeeze it. It seems to be somehow tied to the planet's flora, making grass and water more likely to appear.
items.trinkets.mossyclump.typical_stats_desc=Typically this trinket will make _%d%%_ of unthemed sectors become filled with either water or grass instead.\n\nThis trinket costs a larger amount of energy to upgrade.
items.trinkets.mossyclump.stats_desc=At its current level this trinket will make _%d%%_ of unthemed sectors become filled with either water or grass instead.\n\nThis trinket costs a larger amount of energy to upgrade.

items.trinkets.parchmentscrap.name=parchment scrap
items.trinkets.parchmentscrap.desc=This little scrap of cartridge looks like it came from a cartridge. It still holds part of its program, and it seems to be influencing weapons and armor found in the sectors.
items.trinkets.parchmentscrap.typical_stats_desc=Typically this trinket will make modifications and platings _%dx_ as common, and corruptions on weapons and armor _%sx_ as common. Corruptions on special weapons, implants, or modules are not affected.\n\nThis trinket costs a larger amount of energy to upgrade.
items.trinkets.parchmentscrap.stats_desc=At its current level this trinket will make modifications and platings _%dx_ as common, and corruptions on weapons and armor _%sx_ as common. Corruptions on special weapons, implants, or modules are not affected.\n\nThis trinket costs a larger amount of energy to upgrade.

items.trinkets.petrifiedseed.name=petrified seed
items.trinkets.petrifiedseed.desc=This seed has been fossilised, either by slow geological processes or by Laztro. The seed seems to be influencing the flora of the planet, occasionally replacing plant seeds with tactical capsules.
items.trinkets.petrifiedseed.typical_stats_desc=Typically this trinket will cause trampled grass to drop tactical capsules instead of seeds _%1$s%%_ of the time, and will also cause high grass to drop items _%2$s%%_ more often.
items.trinkets.petrifiedseed.stats_desc=At its current level this trinket will cause trampled grass to drop tactical capsules instead of seeds _%1$s%%_ of the time, and will also cause high grass to drop items _%2$s%%_ more often.

items.trinkets.ratskull.name=rat skull
items.trinkets.ratskull.desc=This macabre trinket isn't much larger than the skull of a normal rat, which is somehow a rarity on this planet. The skull seems to attract the more rare denizens of the planet, making them appear far more often.
items.trinkets.ratskull.typical_stats_desc=Typically this trinket will make rare exotic enemies _%dx_ as likely to appear. The skull is only half as effective at attracting Laztro mimickers and armored automatons, however.
items.trinkets.ratskull.stats_desc=At its current level this trinket will make rare exotic enemies _%dx_ as likely to appear. The skull is only half as effective at attracting Laztro mimickers and armored automatons, however.

items.trinkets.saltcube.name=salt cube
items.trinkets.saltcube.desc=This large salt crystal was cut into an almost perfect cube shape, and it somehow managed to drain half the water from the synthesis bench instead of dissolving. It seems to be dehydrating and preserving the food you eat, extending the satiety you get, but also lessening your health restoration when not starving.
items.trinkets.saltcube.typical_stats_desc=Typically this trinket will increase the amount of time before you grow hungry by _%1$s%%_, but will also reduce your rate of health regeneration by _%2$s%%_ unless the sector is locked.
items.trinkets.saltcube.stats_desc=At its current level this trinket will increase the amount of time before you grow hungry by _%1$s%%_, but will also reduce your rate of health regeneration by _%2$s%%_ unless the sector is locked.

items.trinkets.shardofoblivion.name=shard of oblivion
items.trinkets.shardofoblivion.desc=After stewing in the synthesis bench, this small shard of corrupted metal has changed to be made of... nothing? Light seems to bend around it, and it hovers in place when you aren't holding it. The shard seems to be drawing power from your ignorance, so it's probably best to not think about it too much.
items.trinkets.shardofoblivion.typical_stats_desc=Typically this trinket will increase the rate that enemies drop loot by 20%% for each piece of unidentified equipment you have equipped or recently used, to a max of _%d item(s)_. The shard will also prevent you from identifying equipment, but can be used to manually identify items that are ready for it.
items.trinkets.shardofoblivion.stats_desc=At its current level this trinket will increase the rate that enemies drop loot by 20%% for each piece of unidentified equipment you have equipped or recently used, to a max of _%d item(s)_. The shard will also prevent you from identifying equipment, but can be used to manually identify items that are ready for it.
items.trinkets.shardofoblivion.ac_identify=IDENTIFY
items.trinkets.shardofoblivion.identify_prompt=Identify an Item
items.trinkets.shardofoblivion.identify_ready=An item is ready to identify: %s. Use your Shard of Oblivion on it to identify it.
items.trinkets.shardofoblivion.identify_ready_worn=Your worn items are now all ready to identify. Use your Shard of Oblivion on items to identify them.
items.trinkets.shardofoblivion.identify_not_yet=That item isn't ready to be identified yet.
items.trinkets.shardofoblivion.identify=You identify the item!
items.trinkets.shardofoblivion$wandusetracker.name=Unidentified Special weapon Used
items.trinkets.shardofoblivion$wandusetracker.desc=You have recently used an unidentified special weapon, which counts as one piece of used unidentified equipment for the shard of oblivion for a little while.\n\nTurns remaining: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Unidentified Thrown Weapon Used
items.trinkets.shardofoblivion$thrownusetracker.desc=You have recently used an unidentified thrown weapon, which counts as one piece of used unidentified equipment for the shard of oblivion for a little while.\n\nTurns remaining: %s.

items.trinkets.thirteenleafclover.name=thirteen leaf clover
items.trinkets.thirteenleafclover.desc=Somehow stewing in the synthesis bench has caused this clover to grow a bunch of extra leaves! It's not really clear if this trinket is lucky or unlucky, perhaps this trinket will make your luck more chaotic?
items.trinkets.thirteenleafclover.typical_stats_desc=Typically this trinket will cause you to deal maximum damage _%1$d%%_ of the time, and minimum damage _%2$d%%_ of the time.
items.trinkets.thirteenleafclover.stats_desc=At its current level this trinket will cause you to deal maximum damage _%1$d%%_ of the time, and minimum damage _%2$d%%_ of the time.

items.trinkets.trapmechanism.name=trap mechanism
items.trinkets.trapmechanism.desc=The core mechanism of one of the sectors' pitfall traps, carefully carved out of the floor so it can be carried. It seems to be somehow tied to the sectors themselves, making hazardous terrain more common but also increasing your affinity towards it.
items.trinkets.trapmechanism.typical_stats_desc=Typically this trinket will make _%1$d%%_ of unthemed sectors become filled with either traps or chasms instead. Additionally, _%2$d%%_ of the sectors' hidden traps will instead be visible.
items.trinkets.trapmechanism.stats_desc=At its current level this trinket will make _%1$d%%_ of unthemed sectors become filled with either traps or chasms instead. Additionally, _%2$d%%_ of the sectors' hidden traps will instead be visible.

items.trinkets.vialofblood.name=vial of blood
items.trinkets.vialofblood.desc=This thin vial contains the blood of some denizen of the planet, it moves slowly as you rotate the vial. It seems to be enhancing stronger healing effects, but also delaying them.
items.trinkets.vialofblood.typical_stats_desc=Typically this trinket will increase the overall health you gain from injecting injectors of healing, med kits, or medical stations by _%1$s%%_. However, these healing effects will also occur more slowly, regenerating a maximum of _%2$s_ HP per turn (this scales with hero level).
items.trinkets.vialofblood.stats_desc=At its current level this trinket will increase the overall health you gain from injecting injectors of healing, med kits, or medical stations by _%1$s%%_. However, these healing effects will also occur more slowly, regenerating a maximum of _%2$s_ HP per turn (this scales with hero level).

items.trinkets.wondrousresin.name=wondrous resin
items.trinkets.wondrousresin.desc=This shimmering blue resin appears to have the distilled essence of a corrupted special weapon. The synthesis bench has seemed to stabilize it somewhat, and it's now affecting your special weapons.
items.trinkets.wondrousresin.typical_stats_desc=Typically this trinket will force corrupted special weapon effects to become neutral or positive _%1$s%%_ of the time, and will cause uncorrupted special weapons to fire an additional neutral or positive corrupted zap _%2$s%%_ of the time.\n\nThis trinket costs a larger amount of energy to upgrade.
items.trinkets.wondrousresin.stats_desc=At its current level this trinket will force corrupted special weapon effects to become neutral or positive _%1$s%%_ of the time, and will cause uncorrupted special weapons to fire an additional neutral or positive corrupted zap _%2$s%%_ of the time.\n\nThis trinket costs a larger amount of energy to upgrade.

items.trinkets.trinketcatalyst.name=trinket catalyst
items.trinkets.trinketcatalyst.window_title=create a trinket
items.trinkets.trinketcatalyst.window_text=The water begins to glow as you add the catalyst. There are a few nearby items you could imbue with energy to turn into a trinket.
items.trinkets.trinketcatalyst.desc=This ball of reactive golden dust glimmers in the darkness of the sectors. This catalyst can be used at a synthesis bench with a little synthesis energy to produce a unique trinket item.\n\nTrinkets provide various different effects that slightly alter the sectors or their inhabitants. Trinkets can be upgraded with more energy to make their effect more powerful, or dropped to forego the effect entirely.
items.trinkets.trinketcatalyst$randomtrinket.name=random trinket
items.trinkets.trinketcatalyst$randomtrinket.desc=One nearby item is stuck inside a pouch that you can't get open.\n\nThe synthesis process will dissolve the pouch away, but you won't know what trinket you'll get until you do it!

items.trinkets.trinket.discover_hint=This item has a chance to be an option whenever you craft a trinket via synthesis.
items.trinkets.trinket$placeholder.name=trinket

###wands
items.wands.cursedwand.ondeath=You were killed by your own %s.
items.wands.cursedwand.nothing=Nothing happens.
items.wands.cursedwand.mass_invuln=Brilliant light erupts from your special weapon!
items.wands.cursedwand.petrify=You suddenly freeze in place!
items.wands.cursedwand.grass=Grass erupts around you!
items.wands.cursedwand.fire=You smell burning...
items.wands.cursedwand.transmogrify_wand=Your special weapon transmogrifies into a different item!
items.wands.cursedwand.transmogrify_other=Your item transmogrifies into something different!
items.wands.cursedwand.disguise=Your appearance changes before your eyes!
items.wands.cursedwand.supernova=A blazing ball of energy starts to grow. You might want to run!
items.wands.cursedwand.supernova_positive=A blazing ball of energy starts to grow, but it feels safe somehow.
items.wands.cursedwand.sinkhole=The ground starts to give way around you!
items.wands.cursedwand.sinkhole_positive=The ground starts to give way, but feels solid enough beneath you.
items.wands.cursedwand.gravity=Gravity suddenly starts to pull in random directions!
items.wands.cursedwand.gravity_positive=Gravity suddenly starts to pull in random directions, but this doesn't seem to affect you.
items.wands.cursedwand.gravity_end=The gravity chaos ends.

items.wands.damagewand.upgrade_stat_name_1=Energy Damage

items.wands.wand.ac_zap=ZAP
items.wands.wand.fizzles=Your special weapon fizzles; it must not have enough charge.
items.wands.wand.no_magic=Your special weapon fizzles; you cannot use special weapons while energy immune.
items.wands.wand.self_target=You can't target yourself!
items.wands.wand.identify=You are now familiar enough with your special weapon to identify it.
items.wands.wand.resin_one=This special weapon has gained _1 level_ from conductive resin.
items.wands.wand.resin_many=This special weapon has gained _%d levels_ from conductive resin.
items.wands.wand.cursed=This special weapon is corrupted, making its shots chaotic and random.
items.wands.wand.not_cursed=This special weapon is free of corruption.
items.wands.wand.curse_discover=This %s is corrupted!
items.wands.wand.prompt=Choose a location to zap
items.wands.wand$placeholder.name=special weapon

items.wands.wandofblastwave.name=impact emitter
items.wands.wandofblastwave.staff_name=transmitter with impact emitter
items.wands.wandofblastwave.ondeath=You killed yourself with your own impact emitter...
items.wands.wandofblastwave.knockback_ondeath=The collision killed you...
items.wands.wandofblastwave.desc=An impact wave emitter used to clear a path through wreckage. It is heavy in the hand and kicks hard.
items.wands.wandofblastwave.typical_stats_desc=This special weapon shoots a bolt which violently detonates at a target location. The force of this blast typically deals _%1$d-%2$d damage_ and is strong enough to send most enemies flying.
items.wands.wandofblastwave.stats_desc=This special weapon shoots a bolt which violently detonates at a target location. The force of this blast deals _%1$d-%2$d damage_ and is strong enough to send most enemies flying.
items.wands.wandofblastwave.upgrade_stat_name_2=Knockback
items.wands.wandofblastwave.bmage_desc=When _the Battlemage_ strikes a paralyzed enemy with a staff of blast wave, it will consume the paralysis to deal a burst of bonus magic damage. This has a short cooldown per-enemy.
items.wands.wandofblastwave.eleblast_desc=An elemental blast with a staff of blast wave deals 67% damage and knocks all enemies outside of the blast area.

items.wands.wandofcorrosion.name=acid projector
items.wands.wandofcorrosion.staff_name=transmitter with acid projector
items.wands.wandofcorrosion.desc=An industrial acid projector made to cut through derelict hulls. The orange tank bubbles when you shake it.
items.wands.wandofcorrosion.stats_desc=This special weapon shoots a bolt which explodes into a cloud of highly corrosive gas at a targeted location. Anything caught inside this cloud will take increasing damage over time, starting at _%d damage._
items.wands.wandofcorrosion.upgrade_stat_name_1=Corrosion Damage
items.wands.wandofcorrosion.upgrade_stat_name_2=Gas Volume
items.wands.wandofcorrosion.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of corrosion, the enemy has a chance to become oozed.
items.wands.wandofcorrosion.eleblast_desc=An elemental blast with a staff of corrosion inflicts enemies with 4 turns of corrosion, starting at 6 damage.

items.wands.wandofcorruption.name=neural control emitter
items.wands.wandofcorruption.staff_name=transmitter with neural control emitter
items.wands.wandofcorruption.already_corrupted=That character cannot be influenced further.
items.wands.wandofcorruption.desc=A prototype seized from the Murky Claw. It emits pulses that scramble the nervous system and, in time, bring the target under your command.
items.wands.wandofcorruption.stats_desc=This special weapon will release a blast of corrupting energy which will debuff enemies and eventually bend them to your will. Enemies are able to resist the corruption, but weakened enemies are much easier to corrupt than healthy ones.
items.wands.wandofcorruption.upgrade_stat_name_1=Control power
items.wands.wandofcorruption.upgrade_stat_name_2=Debuff Duration
items.wands.wandofcorruption.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of corruption, the enemy has a chance to become amoked.
items.wands.wandofcorruption.eleblast_desc=An elemental blast with a staff of corruption inflicts enemies with 5 turns of amok.

items.wands.wandofdisintegration.name=particle cannon
items.wands.wandofdisintegration.staff_name=transmitter with particle cannon
items.wands.wandofdisintegration.desc=A heavy particle cannon torn from one of the Vigil-7's defense towers. A violet light runs along the barrel, waiting to fire.
items.wands.wandofdisintegration.stats_desc=This special weapon shoots a beam that pierces any obstacle, and will go farther the more it is upgraded. The beam deals _%1$d-%2$d damage,_ and will also deal bonus damage for each enemy and wall it penetrates.
items.wands.wandofdisintegration.upgrade_stat_name_2=Max Range
items.wands.wandofdisintegration.bmage_desc=When wielded by _the Battlemage_, a staff of disintegration has increased attack range, as if it had a projecting modification.
items.wands.wandofdisintegration.eleblast_desc=An elemental blast with a staff of disintegration deals 100% damage and pierces through walls.

items.wands.wandoffireblast.name=flamethrower
items.wands.wandoffireblast.staff_name=transmitter with flamethrower
items.wands.wandoffireblast.desc=A compact flamethrower from the damage control team, built to clear swarm nests out of the ducts. The blue pilot flame never goes out.
items.wands.wandoffireblast.stats_desc=This special weapon blasts out a cone of fire when used. Its next attack will consume _%1$d charges_ and deal _%2$d-%3$d damage._ The more charges the special weapon uses, the larger and stronger the effect.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Charge Damage
items.wands.wandoffireblast.upgrade_stat_name_2=2 Charge Damage
items.wands.wandoffireblast.upgrade_stat_name_3=3 Charge Damage
items.wands.wandoffireblast.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of fireblast, there is a chance for it to produce an explosion that damages enemies and consumes all nearby fire! This chance increases the more fire is adjacent to the enemy.
items.wands.wandoffireblast.eleblast_desc=An elemental blast with a staff of fireblast deals 100% damage, bursts open doors, and sets enemies and terrain on fire.

items.wands.wandoffrost.name=cryo projector
items.wands.wandoffrost.staff_name=transmitter with cryo projector
items.wands.wandoffrost.desc=A liquid nitrogen projector used for reactor maintenance. The barrel is always covered in frost, but the insulated grip keeps your hand warm.
items.wands.wandoffrost.stats_desc=This special weapon shoots blasts of icy energy toward your foes, dealing _%1$d-%2$d damage_ and chilling. The effect seems stronger in water. Enemies that are already chilled or frozen take less damage from this special weapon.
items.wands.wandoffrost.upgrade_stat_name_2=Chill Duration
items.wands.wandoffrost.bmage_desc=When _the Battlemage_ strikes a chilled enemy with a staff of frost, they have a chance to instantly freeze. This chance becomes greater the more chilled they are.
items.wands.wandoffrost.eleblast_desc=An elemental blast with a staff of frost deals 100% damage, freezes enemies, and puts out fires.

items.wands.wandoflightning.name=arc coil
items.wands.wandoflightning.staff_name=transmitter with arc coil
items.wands.wandoflightning.ondeath=You killed yourself with your own arc coil...
items.wands.wandoflightning.desc=Two copper coils fixed to a heavy battery. An electric arc crackles between the tips, ready to jump from target to target.
items.wands.wandoflightning.stats_desc=This special weapon sends powerful lightning arcing through whatever it is shot at, dealing _%1$d-%2$d damage._ This electricity will arc to nearby characters, and spreads more easily in water. The arcs from this special weapon can damage you, but won't hurt your allies.
items.wands.wandoflightning.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of lightning, he has a chance to electrically charge himself for 10 turns. While charged the Battlemage is immune to lightning damage and will arc lightning further.
items.wands.wandoflightning.eleblast_desc=An elemental blast with a staff of lightning deals 100% damage, stuns enemies for 5 turns, and electrifies water.
items.wands.wandoflightning$lightningcharge.name=Electrically charged
items.wands.wandoflightning$lightningcharge.desc=The Battlemage is currently charged with energy, granting him immunity to his staff of lightning and increasing the range that lightning can arc from it.\n\nTurns Remaining: %s.

items.wands.wandoflivingearth.name=nanobot projector
items.wands.wandoflivingearth.staff_name=transmitter with nanobot projector
items.wands.wandoflivingearth.desc=A construction nanobot projector. The bots gather around you as armor and, with enough material, assemble a guardian.
items.wands.wandoflivingearth.stats_desc=This special weapon fires clouds of nanobots at enemies, dealing _%1$d-%2$d damage._ The nanobots then return and cover the user, granting them armor in proportion to the damage dealt. If enough armor is built, they will form into a guardian when the special weapon is next zapped.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Guardian Blocking
items.wands.wandoflivingearth.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of living earth, some of the damage dealt is returned as rock armor.
items.wands.wandoflivingearth.eleblast_desc=An elemental blast with a staff of living earth deals 50% damage, and heals an active earthen guardian for each enemy hit.
items.wands.wandoflivingearth$rockarmor.name=nanobot armor
items.wands.wandoflivingearth$rockarmor.desc=Nanobots are covering your body. When you are attacked they will attempt to block for you, and will reduce the damage you take by 50%%. Each damage blocked destroys some of the bots however.\n\nRemaining Armor: %1$d.\n\nIf enough nanobots gather around you, the next zap from your nanobot projector will cause them to form up into a guardian which will fight with you.\n\nArmor needed for Guardian: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=This earthen guardian is also benefitting from Power of Many. Turns Remaining: %d.
items.wands.wandoflivingearth$earthguardian.name=nanobot guardian
items.wands.wandoflivingearth$earthguardian.desc=The rocks from your nanobot projector have formed into a protective earthen guardian! This rocky protector will attack nearby enemies, which will force them to attack the guardian instead of you. When all nearby threats are gone, the guardian will re-form around you, and will return when you next use your special weapon.
items.wands.wandoflivingearth$earthguardian.wand_info=The guardian's defensive power is tied to the level of your special weapon. It currently blocks _%1$d-%2$d damage._
items.wands.wandoflivingearth$earthguardian.discover_hint=You can find this character with a specific special weapon.

items.wands.wandofmagicmissile.name=plasma pistol
items.wands.wandofmagicmissile.staff_name=transmitter with plasma pistol
items.wands.wandofmagicmissile.desc=The Vigil-7's standard plasma pistol: light, reliable and without any special effect. It holds more charges than other special weapons and, when upgraded, briefly overcharges the other special weapons you carry.
items.wands.wandofmagicmissile.stats_desc=Each bolt from this special weapon deals _%1$d-%2$d damage,_ and will briefly empower other special weapons if it is upgraded.
items.wands.wandofmagicmissile.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of magic missile, all of his special weapons will gain charge in addition to his staff.
items.wands.wandofmagicmissile.eleblast_desc=An elemental blast with a staff of magic missile deals 50% damage, and grants the mage 15 turns of recharging.
items.wands.wandofmagicmissile.discover_hint=One of the heroes starts with this item.
items.wands.wandofmagicmissile$magiccharge.name=overcharge
items.wands.wandofmagicmissile$magiccharge.desc=Your plasma pistol has fed power back into your special weapons, boosting the effective level of the next zap they make.\n\nYour special weapons are boosted to: +%d.\n\nTurns of overcharge remaining: %s.

items.wands.wandofprismaticlight.name=prismatic emitter
items.wands.wandofprismaticlight.staff_name=transmitter with prismatic emitter
items.wands.wandofprismaticlight.desc=A signal emitter with a crystal lens. Its colored beam cuts through the darkness of the sectors and dazzles whoever stands in front of it.
items.wands.wandofprismaticlight.stats_desc=This special weapon shoots rays of light which cut through the darkness of the sectors, revealing hidden areas and traps. The beam can blind enemies, and deals _%1$d-%2$d damage._ Swarm creatures and the assimilated take extra damage from the light.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blind Chance
items.wands.wandofprismaticlight.upgrade_stat_name_3=Light Duration
items.wands.wandofprismaticlight.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of prismatic light, they will be crippled for a duration that scales with staff level.
items.wands.wandofprismaticlight.eleblast_desc=An elemental blast with a staff of prismatic light deals 67% damage, reveals all terrain in the blast, and blinds enemies for 5 turns.

items.wands.wandofregrowth.name=spore disperser
items.wands.wandofregrowth.staff_name=transmitter with spore disperser
items.wands.wandofregrowth.desc=An agricultural disperser from the Vigil-7's greenhouse, still full of live spores. Wherever the cloud lands, plants sprout within seconds.
items.wands.wandofregrowth.stats_desc=When used, this special weapon will blast a cone of spores, causing grass, roots, and rare plants to spring to life. Its next zap will consume _%1$d charges_. The more charges the special weapon uses, the larger and stronger the effect.
items.wands.wandofregrowth.degradation=After another _%d charges_ this special weapon will start failing to produce plants and fresh grass. This limit is increased by leveling up or upgrading the special weapon.
items.wands.wandofregrowth.upgrade_stat_name_1=Grass Per Charge
items.wands.wandofregrowth.upgrade_stat_name_2=Total Grass Limit
items.wands.wandofregrowth.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of regrowth, and either are standing on grass, he will gain herbal healing in proportion with the damage dealt.
items.wands.wandofregrowth.eleblast_desc=An elemental blast with a staff of regrowth roots enemies and grows grass randomly over the blasts area.
items.wands.wandofregrowth$dewcatcher.name=Biomass catcher
items.wands.wandofregrowth$dewcatcher.desc=Alien plants that fill up with biomass. They disguise themselves as grass to avoid attention, but their biomass-filled bulbs give them away.
items.wands.wandofregrowth$dewcatcher.discover_hint=You can find this plant with a specific special weapon.
items.wands.wandofregrowth$seedpod.name=Seed Pod
items.wands.wandofregrowth$seedpod.desc=Alien pods that produce seeds of other plants instead of their own.
items.wands.wandofregrowth$seedpod.discover_hint=You can find this plant with a specific special weapon.
items.wands.wandofregrowth$lotus.name=Golden lotus
items.wands.wandofregrowth$lotus.desc=The golden lotus is a mystical plant that can only be conjured by a powerful spore disperser. Its aura enhances all plants and plant effects, but it burns through its energy and dies after a short time.
items.wands.wandofregrowth$lotus.wand_info=This lotus was produced by a _+%1$d_ spore disperser. All plants in its effect will _instantly trigger_ if they are planted on a character. Plants will also have a _%2$d%% chance_ to drop their seed, and tipped darts will use _%3$d%% less durability_.
items.wands.wandofregrowth$lotus.discover_hint=You can find this plant with a specific special weapon, after upgrading it several times.

items.wands.wandoftransfusion.name=nanomedic projector
items.wands.wandoftransfusion.staff_name=transmitter with nanomedic projector
items.wands.wandoftransfusion.ondeath=You killed yourself with your own nanomedic projector...
items.wands.wandoftransfusion.charged=Your staff is charged with the life energy of your enemy!
items.wands.wandoftransfusion.desc=A medical projector that transfers nanomedics from your blood into someone else. The magenta capsule at the tip glows when full.
items.wands.wandoftransfusion.stats_desc=When used on allies or entranced enemies, this special weapon will sap _%1$d of the user's health_ to heal or shield the ally for _%2$d health._ When used on enemies, the special weapon briefly entrances them while applying _%3$d shielding_ to the user. Hostile assimilated will take _%4$d-%5$d damage_ instead of being entranced.
items.wands.wandoftransfusion.upgrade_stat_name_1=Ally Healing
items.wands.wandoftransfusion.upgrade_stat_name_2=Self-Shielding
items.wands.wandoftransfusion.upgrade_stat_name_3=Assimilated Damage
items.wands.wandoftransfusion.bmage_desc=When _the Battlemage_ strikes an entranced enemy with a staff of transfusion, he will gain shielding and his next zap with the staff will not cost any health.
items.wands.wandoftransfusion.eleblast_desc=An elemental blast with a staff of transfusion entrances enemies, heals allies, and deals 100% damage to undead enemies.

items.wands.wandofwarding.name=turret launcher
items.wands.wandofwarding.staff_name=transmitter with turret launcher
items.wands.wandofwarding.no_more_wards=Your special weapon can't sustain any more turrets.
items.wands.wandofwarding.bad_location=You can't place a turret there.
items.wands.wandofwarding.desc=A launcher for automated defense turrets. Each shot plants a turret at the chosen spot.
items.wands.wandofwarding.stats_desc=Rather than directly damaging an enemy, this special weapon will summon stationary turrets and sentries. Wards can be summoned anywhere, even through walls if you have vision. This special weapon can sustain _%d energy_ worth of turrets at a time.
items.wands.wandofwarding.upgrade_stat_name_1=Turret Damage
items.wands.wandofwarding.upgrade_stat_name_2=Turret Energy
items.wands.wandofwarding.bmage_desc=When _the Battlemage_ strikes an enemy with a staff of warding, all active turrets and sentries have a chance to be healed.
items.wands.wandofwarding.eleblast_desc=An elemental blast with a staff of warding heals all turrets and sentries in the blast area.
items.wands.wandofwarding$ward.desc_generic_ward=This turret will automatically zap any enemy which comes into its range of vision.\n\nZapping this turret with your turret launcher will upgrade it.\n\nWards have a limited number of zaps before dissipating.
items.wands.wandofwarding$ward.desc_generic_sentry=This sentry has the same firepower as a turret, but has health instead of a set number of charges. It resembles the gem at the tip of your turret launcher.\n\nZapping this sentry with your turret launcher will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your turret launcher on it.
items.wands.wandofwarding$ward.name_1=light turret
items.wands.wandofwarding$ward.desc_1=This basic turret will automatically zap any enemy which comes into its range of vision, dealing _%1$d-%2$d damage._\n\nZapping this turret with your turret launcher will upgrade it.\n\nThis turret will only zap a single time before dissipating.\n\nYour turret launcher is using _%3$d energy_ to sustain this turret.
items.wands.wandofwarding$ward.name_2=turret
items.wands.wandofwarding$ward.desc_2=This upgraded turret has a more intricate pattern, and can attack multiple times. Each zap from this turret will deal _%1$d-%2$d damage._\n\nZapping this turret with your turret launcher will upgrade it.\n\nThis turret will zap three times before dissipating.\n\nYour turret launcher is using _%3$d energy_ to sustain this turret.
items.wands.wandofwarding$ward.name_3=heavy turret
items.wands.wandofwarding$ward.desc_3=This fully upgraded turret is able to attack more times than its predecessors. Each zap from this turret will deal _%1$d-%2$d damage._\n\nZapping this turret with your turret launcher will upgrade it.\n\nThis turret will zap five times before dissipating.\n\nYour turret launcher is using _%3$d energy_ to sustain this turret.
items.wands.wandofwarding$ward.name_4=light sentry
items.wands.wandofwarding$ward.desc_4=This smaller sentry has the same firepower as a greater turret, but has health instead of a set number of charges. It resembles the gem at the tip of your turret launcher. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your turret launcher will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your turret launcher on it.\n\nYour turret launcher is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.name_5=sentry
items.wands.wandofwarding$ward.desc_5=This upgraded sentry is larger and more durable than a lesser sentry. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your turret launcher will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your turret launcher on it.\n\nYour turret launcher is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.name_6=heavy sentry
items.wands.wandofwarding$ward.desc_6=This fully upgraded sentry is significantly more durable than its predecessors. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your turret launcher will heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your turret launcher on it.\n\nYour turret launcher is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.discover_hint=You can find this character with a specific special weapon.
items.wands.wandofwarding$ward.dismiss_title=Dismiss this turret?
items.wands.wandofwarding$ward.dismiss_body=You can dispel this turret if you no longer want your special weapon to maintain it. Doing so immediately destroys the turret.\n\nDismiss this turret?
items.wands.wandofwarding$ward.dismiss_confirm=yes
items.wands.wandofwarding$ward.dismiss_cancel=no

###weapon curses
items.weapon.curses.annoying.name=annoying %s
items.weapon.curses.annoying.msg_1=OOH, ARE WE FIGHTING SOMETHING!?
items.weapon.curses.annoying.msg_2=YEAH, GET THEM!
items.weapon.curses.annoying.msg_3=HEY, LISTEN!
items.weapon.curses.annoying.msg_4=ARE WE AT THE BOSS YET!?
items.weapon.curses.annoying.msg_5=OUCH, DON'T SWING ME SO HARD!
items.weapon.curses.annoying.msg_6=DIE, INSECT!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=CAN WE TAKE A BREAK!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.msg_10=WELL STRUCK!
items.weapon.curses.annoying.msg_11=I didn't want to be a weapon, I wanted to be a lumberjack's axe.
items.weapon.curses.annoying.msg_12=Remember, overconfidence is a slow and insidious killer.
items.weapon.curses.annoying.msg_13=ALL YOUR BASE ARE BELONG TO US!
items.weapon.curses.annoying.desc=Annoying weapons are capable of speech, but they're a bit too energetic. They will often draw attention to you without meaning to.
items.weapon.curses.annoying.elestrike_desc=An elemental strike with an annoying corruption has a 20% chance to amok each enemy in range for 6 turns.

items.weapon.curses.dazzling.name=dazzling %s
items.weapon.curses.dazzling.desc=Dazzling weapons will sometimes flash with dazzling light, blinding everything that can see them.
items.weapon.curses.dazzling.elestrike_desc=An elemental strike with a dazzling corruption has a 50% chance to blind each enemy in range for 6 turns.

items.weapon.curses.displacing.name=displacing %s
items.weapon.curses.displacing.desc=Displacing weapons are infused with chaotic teleportation, possessing the ability to warp enemies around the sector randomly.
items.weapon.curses.displacing.elestrike_desc=An elemental strike with a displacing corruption has a 50% chance to teleport each enemy in range.

items.weapon.curses.explosive.name=explosive %s
items.weapon.curses.explosive.warm=Warm...
items.weapon.curses.explosive.hot=Hot!
items.weapon.curses.explosive.desc=Explosive weapons steadily build up power and explode, damaging anything nearby.
items.weapon.curses.explosive.desc_cool=Your weapon is currently cool to the touch.
items.weapon.curses.explosive.desc_warm=Your weapon is building energy and getting warm...
items.weapon.curses.explosive.desc_hot=Your weapon is hot! It's about to explode!
items.weapon.curses.explosive.elestrike_desc=An elemental strike with an explosive corruption has a 50% chance to cause an explosion to appear on a random enemy in range.

items.weapon.curses.friendly.name=friendly %s
items.weapon.curses.friendly.desc=Friendly weapons are best suited for pacifists, occasionally releasing a pheromone that makes it impossible to fight.
items.weapon.curses.friendly.elestrike_desc=An elemental strike with a friendly corruption has a 50% chance to entrance each enemy in range for 6 turns.

items.weapon.curses.polarized.name=polarized %s
items.weapon.curses.polarized.desc=A polarized weapon has a power fault that causes its attack to either deal 50% more damage, or no damage at all.
items.weapon.curses.polarized.elestrike_desc=An elemental strike with a polarized corruption has a 50% chance to deal 24-36 damage to each enemy in range.

items.weapon.curses.pressurized.name=pressurized %s
items.weapon.curses.pressurized.desc=Pressurized weapons are capable of erupting with a forceful geyser of water which knocks everything away, including you.
items.weapon.curses.pressurized.elestrike_desc=An elemental strike with a pressurized corruption will create a wave of water that destroys terrain and knocks back every enemy in range.

items.weapon.curses.sacrificial.name=sacrificial %s
items.weapon.curses.sacrificial.desc=Sacrificial weapons will demand blood from the wearer in return for attacking foes. The more healthy the wearer is, the more blood the corruption will take.
items.weapon.curses.sacrificial.elestrike_desc=An elemental strike with a sacrificial corruption causes the hero and each enemy in range to bleed for 12 HP.

items.weapon.curses.wayward.name=wayward %s
items.weapon.curses.wayward.desc=Wayward weapons will sometimes become extremely inaccurate. This fault lasts for a little while when it activates, but can be dispelled by landing a blow with the wayward weapon.
items.weapon.curses.wayward.elestrike_desc=An elemental strike with a wayward corruption has a 50% chance to hex each enemy in range for 6 turns.
items.weapon.curses.wayward$waywardbuff.name=wayward
items.weapon.curses.wayward$waywardbuff.desc=Your wayward weapon's fault has activated, making it extremely inaccurate for a short time. Note that this does not affect attacks which are guaranteed to hit, such as surprise attacks. Successfully attacking with the wayward weapon will clear this effect immediately.\n\nTurns remaining: %s.

items.weapon.curses.wondrous.name=wondrous %s
items.weapon.curses.wondrous.desc=Wondrous weapons contain the same chaotic energy found in corrupted special weapons. There's no telling what will happen when this corruption triggers!
items.weapon.curses.wondrous.elestrike_desc=An elemental strike with a wondrous corruption has a chance to apply a different corrupted special weapon effect to every enemy in range.

###enchantments
items.weapon.enchantments.blazing.name=blazing %s
items.weapon.enchantments.blazing.desc=This modification causes flames to spit forth from a weapon, igniting enemies and dealing bonus damage to enemies that are already aflame.
items.weapon.enchantments.blazing.elestrike_desc=An elemental strike with a blazing modification spreads fire to every tile in range, which lasts 8 turns.

items.weapon.enchantments.blocking.name=blocking %s
items.weapon.enchantments.blocking.desc=Blocking weapons have a chance to briefly shield you after attacking with them.
items.weapon.enchantments.blocking.elestrike_desc=An elemental strike with a blocking modification grants the Duelist an extra 6 shielding for each enemy in range.
items.weapon.enchantments.blocking$blockbuff.name=blocking
items.weapon.enchantments.blocking$blockbuff.desc=Your weapon's blocking modification has granted you a brief boost to your defensive power!\n\nShielding remaining: %d\n\nTurns remaining: %s.

items.weapon.enchantments.blooming.name=blooming %s
items.weapon.enchantments.blooming.desc=Blooming weapons contain spores which will cause vegetation to sprout on or around those struck by them.
items.weapon.enchantments.blooming.elestrike_desc=An elemental strike with a blooming modification spreads grass to up to 8 tiles in range, and roots all enemies in range for 6 turns.

items.weapon.enchantments.chilling.name=chilling %s
items.weapon.enchantments.chilling.desc=Enemies struck with this modification are chilled, slowing their movement and attacks.
items.weapon.enchantments.chilling.elestrike_desc=An elemental strike with a chilling modification spreads chilling air to every tile in range, which lasts 8 turns.

items.weapon.enchantments.crystal.name=crystal %s
items.weapon.enchantments.crystal.alert_fixed=Your crystal weapon is fully repaired!
items.weapon.enchantments.crystal.alert_fixed_ghost=Sgt. Brandt's crystal weapon is fully repaired!
items.weapon.enchantments.crystal.alert_noflaw=Your crystal weapon is no longer flawed.
items.weapon.enchantments.crystal.alert_noflaw_ghost=Sgt. Brandt's crystal weapon is no longer flawed.
items.weapon.enchantments.crystal.alert_nocrack=Your crystal weapon is no longer cracked.
items.weapon.enchantments.crystal.alert_nocrack_ghost=Sgt. Brandt's crystal weapon is no longer cracked.
items.weapon.enchantments.crystal.alert_flawed=Your crystal weapon has become slightly damaged.
items.weapon.enchantments.crystal.alert_flawed_ghost=Sgt. Brandt's crystal weapon is slightly damaged.
items.weapon.enchantments.crystal.alert_cracked=Your crystal weapon cracks, it's about to break!
items.weapon.enchantments.crystal.alert_cracked_ghost=Sgt. Brandt's crystal weapon has cracked, it's about to break!
items.weapon.enchantments.crystal.alert_shattered=Your crystal weapon shatters into pieces!
items.weapon.enchantments.crystal.alert_shattered_ghost=Sgt. Brandt's crystal weapon shatters!
items.weapon.enchantments.crystal.desc=This powerful modification deals extra energy damage and enhances a weapon's value. However, the modified weapon can shatter if the crystals aren't repaired, or given time to self-repair.
items.weapon.enchantments.crystal.desc_thrown=Crystal thrown weapons have much less durability, but regain it slowly over time.
items.weapon.enchantments.crystal.desc_perfect=This crystal weapon is currently in perfect condition.
items.weapon.enchantments.crystal.desc_fine=This crystal weapon is currently in good condition.
items.weapon.enchantments.crystal.desc_flawed=This crystal weapon has a flaw, but isn't about to break.
items.weapon.enchantments.crystal.desc_cracked=This crystal weapon is cracking, it's at risk of permanently breaking!
items.weapon.enchantments.crystal.elestrike_desc=An elemental strike with a crystal modification deals 10-20 damage and repairs the weapon for every enemy in range, except the primary target.

items.weapon.enchantments.kinetic.name=kinetic %s
items.weapon.enchantments.kinetic.desc=When an enemy is killed with a kinetic weapon, any excess force is stored in the weapon and will be applied to the next successful attack.
items.weapon.enchantments.kinetic.elestrike_desc=An elemental strike with a kinetic modification applies 40% of stored damage to each enemy in range, except the primary target.
items.weapon.enchantments.kinetic$conserveddamage.name=conserved damage
items.weapon.enchantments.kinetic$conserveddamage.desc=Your weapon has stored the excess force from a previous killing blow, and will apply it as bonus damage to your next attack. The energy will slowly fade over time, however.\n\nConserved Damage: %d.

items.weapon.enchantments.corrupting.name=mind-controlling %s
items.weapon.enchantments.corrupting.desc=This powerful modification can bend enemies to your will. When an enemy is killed with this weapon, there is a chance it will become neurally controlled instead of dying.
items.weapon.enchantments.corrupting.elestrike_desc=An elemental strike with a corrupting modification has a 5-25% chance (based on missing HP) to corrupt each enemy in range, except the primary target.

items.weapon.enchantments.eldritch.name=eldritch %s
items.weapon.enchantments.eldritch.desc=Eldritch weapons strike fear into nearby enemies that witness their strikes, causing them to flee from the attacker.
items.weapon.enchantments.eldritch.elestrike_desc=An elemental strike with a terrifying modification applies extended fear to every enemy in range, including the primary target.

items.weapon.enchantments.elastic.name=elastic %s
items.weapon.enchantments.elastic.desc=Elastic weapons have a chance to send enemies flying back short distances.
items.weapon.enchantments.elastic.elestrike_desc=An elemental strike with an elastic modification knocks all enemies in range back 5 tiles.

items.weapon.enchantments.grim.name=grim %s
items.weapon.enchantments.grim.desc=This powerful modification possesses the power to instantly execute an enemy. The effect is more likely to occur the weaker the enemy is.
items.weapon.enchantments.grim.elestrike_desc=An elemental strike with a grim modification has a 6-30% chance (based on missing HP) to kill each enemy in range, except the primary target.

items.weapon.enchantments.lucky.name=lucky %s
items.weapon.enchantments.lucky.desc=Enemies which are killed by a lucky weapon have a chance to drop extra loot.
items.weapon.enchantments.lucky.elestrike_desc=An elemental strike with a lucky modification has a 12.5% chance to spawn loot under each enemy in range. This effect can only trigger once per enemy.

items.weapon.enchantments.projecting.name=projecting %s
items.weapon.enchantments.projecting.desc=With this modification melee weapons will gain extra reach. Ranged weapons will penetrate walls when aimed at nearby targets.
items.weapon.enchantments.projecting.elestrike_desc=An elemental strike with a projecting modification deals 30% damage to each enemy in range, except the primary target.

items.weapon.enchantments.shocking.name=shocking %s
items.weapon.enchantments.shocking.desc=Electricity arcs from a shocking weapon, dealing extra damage to all nearby enemies.
items.weapon.enchantments.shocking.elestrike_desc=An elemental strike with a shocking modification spreads electricity to every tile in range, which lasts 8 turns.

items.weapon.enchantments.unstable.name=unstable %s
items.weapon.enchantments.unstable.desc=This modification radiates chaotic energy, acting as a different modification with each hit.
items.weapon.enchantments.unstable.elestrike_desc=An elemental strike with an unstable modification applies a random modification effect to each enemy in range, except the primary target.

items.weapon.enchantments.vampiric.name=vampiric %s
items.weapon.enchantments.vampiric.desc=This powerful modification leeches life force from enemies with each blow, funneling it back into the wearer. The effect is stronger the lower the wearer's health.
items.weapon.enchantments.vampiric.elestrike_desc=An elemental strike with a vampiric modification heals the Duelist for 2.5 HP for each enemy in range.

items.weapon.enchantments.venomous.name=venomous %s
items.weapon.enchantments.venomous.desc=Venomous weapons inflict a delayed but deadly poison, which becomes more severe each time it is applied.
items.weapon.enchantments.venomous.elestrike_desc=An elemental strike with a venomous modification applies additional delayed poison to every enemy in range, except the primary target.

items.weapon.enchantments.vorpal.name=vorpal %s
items.weapon.enchantments.vorpal.desc=Vorpal weapons are especially deadly, they have a chance to strike so cleanly that they inflict bleed instead of damage to enemies that can bleed.
items.weapon.enchantments.vorpal.elestrike_desc=An elemental strike with a lacerating modification applies additional bleeding to every enemy in range, except the primary target.


###melee weapons
items.weapon.melee.assassinsblade.name=monomolecular blade
items.weapon.melee.assassinsblade.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.melee.assassinsblade.ability_name=sneak
items.weapon.melee.assassinsblade.typical_ability_desc=The Duelist can _sneak_ while wielding an assassin's blade. This ability lets the Duelist instantly blink up to 3 tiles away and typically grants her _%d turns of invisibility._
items.weapon.melee.assassinsblade.ability_desc=The Duelist can _sneak_ while wielding an assassin's blade. This ability lets the Duelist instantly blink up to 3 tiles away and grants her _%d turns of invisibility._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.assassinsblade.desc=A short, razor-thin blade. Difficult to use despite being lightweight, but deadly if it finds the right mark.

items.weapon.melee.battleaxe.name=demolition axe
items.weapon.melee.battleaxe.stats_desc=This is a rather accurate weapon.
items.weapon.melee.battleaxe.ability_name=heavy blow
items.weapon.melee.battleaxe.typical_ability_desc=The Duelist can perform a _heavy blow_ with a battle axe. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.battleaxe.ability_desc=The Duelist can perform a _heavy blow_ with a battle axe. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.battleaxe.desc=The enormous head of this demolition axe puts considerable heft behind each wide stroke.

items.weapon.melee.crossbow.name=harpoon launcher
items.weapon.melee.crossbow.typical_stats_desc=Typically this weapon enhances thrown darts to deal _%1$d-%2$d damage_ when it is equipped, and will even grant its modification to them.
items.weapon.melee.crossbow.stats_desc=This weapon enhances thrown darts to deal _%1$d-%2$d damage_ when it is equipped, and will even grant its modification to them.
items.weapon.melee.crossbow.ability_name=charged shot
items.weapon.melee.crossbow.typical_ability_desc=The Duelist can _charge_ her crossbow, causing her next regular attack with it to always hit and apply one of three effects: melee attacks will knock enemies away, untipped darts will typically deal _+%1$d damage_, and tipped darts will apply their effect in a 7x7 area and typically last for _%2$d more uses_.
items.weapon.melee.crossbow.ability_desc=The Duelist can _charge_ her crossbow, causing her next regular attack with it to always hit and apply one of three effects: melee attacks will knock enemies away, untipped darts will deal _+%1$d damage_, and tipped darts will apply their effect in a 7x7 area and last for _%2$d more uses_.
items.weapon.melee.crossbow.desc=A compact launcher that fires darts at exceptional speed. While it isn't designed for it, its heft and sturdy construction make it a decent melee weapon as well.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Ability Boost
items.weapon.melee.crossbow$chargedshot.name=charged
items.weapon.melee.crossbow$chargedshot.desc=The Duelist is focusing power into her crossbow. The next attack she makes with it will always hit and apply one of three effects:\n- Melee attacks will knock enemies a few tiles away.\n- Untipped darts will deal bonus damage.\n- Tipped darts will gain extra uses and apply their effect in a 7x7 area. Positive dart effects will only affect allies, and harmful effects will only apply to enemies. The Duelist cannot use this ability to apply positive dart effects to herself.

items.weapon.melee.cudgel.name=torque wrench
items.weapon.melee.cudgel.stats_desc=This is a rather accurate weapon.
items.weapon.melee.cudgel.ability_name=heavy blow
items.weapon.melee.cudgel.typical_ability_desc=The Duelist can perform a _heavy blow_ with a cudgel. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.cudgel.ability_desc=The Duelist can perform a _heavy blow_ with a cudgel. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces accuracy and evasion by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.cudgel.desc=A heavy torque wrench from the maintenance crew. Not made for fighting, but it gets the job done.
items.weapon.melee.cudgel.discover_hint=One of the heroes starts with this item.

items.weapon.melee.dagger.name=combat knife
items.weapon.melee.dagger.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.melee.dagger.ability_name=sneak
items.weapon.melee.dagger.typical_ability_desc=The Duelist can _sneak_ while wielding a dagger. This ability lets the Duelist instantly blink up to 5 tiles away and typically grants her _%d turns of invisibility._
items.weapon.melee.dagger.ability_desc=The Duelist can _sneak_ while wielding a dagger. This ability lets the Duelist instantly blink up to 5 tiles away and grants her _%d turns of invisibility._
items.weapon.melee.dagger.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.dagger.desc=A standard Brigade combat knife, its handle worn from use.
items.weapon.melee.dagger.discover_hint=One of the heroes starts with this item.

items.weapon.melee.dirk.name=boarding knife
items.weapon.melee.dirk.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.melee.dirk.ability_name=sneak
items.weapon.melee.dirk.typical_ability_desc=The Duelist can _sneak_ while wielding a dirk. This ability lets the Duelist instantly blink up to 4 tiles away and typically grants her _%d turns of invisibility._
items.weapon.melee.dirk.ability_desc=The Duelist can _sneak_ while wielding a dirk. This ability lets the Duelist instantly blink up to 4 tiles away and grants her _%d turns of invisibility._
items.weapon.melee.dirk.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.dirk.desc=A longer-bladed knife designed to thrust through armor joints.

items.weapon.melee.flail.name=cargo chain
items.weapon.melee.flail.stats_desc=This is a rather inaccurate weapon.\nThis weapon cannot surprise attack.
items.weapon.melee.flail.ability_name=spin
items.weapon.melee.flail.spin_warn=You can't spin the flail any more.
items.weapon.melee.flail.typical_ability_desc=The Duelist can _spin_ a flail to build up power for a short time. Each turn the flail is spun it will typically deal _+%d damage_ on its next regular attack, to a max of 3 times. A spinning flail is also guaranteed to hit. Only starting to spin the flail costs a charge.
items.weapon.melee.flail.ability_desc=The Duelist can _spin_ a flail to build up power for a short time. Each turn the flail is spun it will deal _+%d damage_ on its next regular attack, to a max of 3 times. A spinning flail is also guaranteed to hit. Only starting to spin the flail costs a charge.
items.weapon.melee.flail.desc=A cargo tie-down chain with a heavy latch on the end. Very unwieldy, but devastating if it lands a solid hit.
items.weapon.melee.flail$spinabilitytracker.name=spinning
items.weapon.melee.flail$spinabilitytracker.desc=The Duelist is spinning her flail, building damage for her next regular attack with it. Each spin takes one turn but increases damage, to a max of three spins. The flail is also guaranteed to hit while spinning.\n\nCurrent spins: %1$d%%.\nTurns remaining: %2$s.

items.weapon.melee.gauntlet.name=exosuit fist
items.weapon.melee.gauntlet.stats_desc=This is a very fast weapon.
items.weapon.melee.gauntlet.ability_name=combo strike
items.weapon.melee.gauntlet.typical_ability_desc=The Duelist can perform a _combo strike_ with a stone gauntlet. This attack is guaranteed to hit and typically deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns (15 after a kill) resets this combo.
items.weapon.melee.gauntlet.ability_desc=The Duelist can perform a _combo strike_ with a stone gauntlet. This attack is guaranteed to hit and deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns (15 after a kill) resets this combo.
items.weapon.melee.gauntlet.desc=A fist torn from a cargo exosuit and fitted to the arm. Swinging it takes strength, but adds tremendous force to your blows.

items.weapon.melee.glaive.name=saw lance
items.weapon.melee.glaive.stats_desc=This is a rather slow weapon.\nThis weapon has extra reach.
items.weapon.melee.glaive.ability_name=spike
items.weapon.melee.glaive.typical_ability_desc=The Duelist can use the tip of a glaive to _spike_ an enemy that is in range but not adjacent. This typically deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.weapon.melee.glaive.ability_desc=The Duelist can use the tip of a glaive to _spike_ an enemy that is in range but not adjacent. This deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.weapon.melee.glaive.desc=A long pole with a cutting saw on the end. It reaches far and cuts deep.

items.weapon.melee.gloves.name=impact gloves
items.weapon.melee.gloves.stats_desc=This is a very fast weapon.
items.weapon.melee.gloves.ability_name=combo strike
items.weapon.melee.gloves.typical_ability_desc=The Duelist can perform a _combo strike_ with studded gloves. This attack is guaranteed to hit and typically deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns (15 after a kill) resets this combo.
items.weapon.melee.gloves.ability_desc=The Duelist can perform a _combo strike_ with studded gloves. This attack is guaranteed to hit and deals _+%d damage_ for each time the Duelist has hit with a regular melee or thrown weapon attack. Not hitting for 5 turns (15 after a kill) resets this combo.
items.weapon.melee.gloves.desc=Tactical gloves with impact plates over the knuckles. They provide no real protection, but they work as a weapon while keeping the hands free.
items.weapon.melee.gloves.discover_hint=One of the heroes starts with this item.

items.weapon.melee.greataxe.name=cutting axe
items.weapon.melee.greataxe.stats_desc=This weapon is incredibly heavy.
items.weapon.melee.greataxe.ability_name=retribution
items.weapon.melee.greataxe.typical_ability_desc=The Duelist can perform a _retribution_ attack with a greataxe if she is below 50%% health. This devastating attack typically deals _%1$d-%2$d damage,_ is guaranteed to hit, and is instantaneous if it kills an enemy.
items.weapon.melee.greataxe.ability_desc=The Duelist can perform a _retribution_ attack with a greataxe if she is below 50%% health. This devastating attack deals _%1$d-%2$d damage,_ is guaranteed to hit, and is instantaneous if it kills an enemy.
items.weapon.melee.greataxe.desc=Meant to be wielded over the shoulder, this cutting axe is as powerful as it is heavy.

items.weapon.melee.greatshield.name=assault tower shield
items.weapon.melee.greatshield.typical_stats_desc=Typically this weapon blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.greatshield.stats_desc=This weapon blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.greatshield.ability_name=guard
items.weapon.melee.greatshield.typical_ability_desc=The Duelist can _guard_ herself with a greatshield, completely negating all physical or magical attacks made against her typically for _%d turns_. Once the Duelist has blocked an attack, attacking back or using magic will end guarding.
items.weapon.melee.greatshield.ability_desc=The Duelist can _guard_ herself with a greatshield, completely negating all physical or magical attacks made against her for _%d turns_. Once the Duelist has blocked an attack, attacking back or using magic will end guarding.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.greatshield.desc=More like a mobile wall than a shield, this huge plate aids defense, but doesn't leave much room for attacking.

items.weapon.melee.greatsword.name=hull cutter
items.weapon.melee.greatsword.ability_name=cleave
items.weapon.melee.greatsword.typical_ability_desc=The Duelist can _cleave_ an enemy with a greatsword. This typically deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Duelist can use cleave again within 5 turns for free.
