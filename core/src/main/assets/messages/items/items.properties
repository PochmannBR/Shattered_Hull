items.hull.suppressedpistol.already_full=The inserted magazine is already full.
items.hull.suppressedpistol.no_magazines=You have no magazines in your backpack.
items.hull.suppressedpistol.no_better_magazine=No magazine in your backpack has more rounds than the inserted one.
