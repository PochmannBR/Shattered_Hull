items.artifacts.hornofplenty.desc_hint=Perhaps there is a way to increase the synthesizer's power by giving it food energy.
items.artifacts.hornofplenty.desc_cursed=The corrupted synthesizer has bound itself to your side, it seems to be eager to take food rather than produce it.

