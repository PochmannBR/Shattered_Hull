items.hull.suppressedpistol.ammo=Ammo: _%1$d/%2$d_ in the inserted magazine.
items.hull.suppressedpistol.discover_hint=One of the heroes starts with this item.
items.hull.suppressedpistol$bullet.name=shot
items.hull.suppressedpistol$bullet.desc=A subsonic pistol round.
