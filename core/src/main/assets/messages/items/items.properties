items.armor.clericarmor.name=hero's armored chassis
items.armor.clericarmor.desc=With this armored chassis fitted to his body, the Synthetic can perform a special ability.

items.armor.clotharmor.name=standard uniform
items.armor.clotharmor.desc=The Orbital Brigade service uniform, with light ballistic fabric reinforcement. It protects little, but it does not get in the way.
items.armor.clotharmor.discover_hint=One of the heroes starts with this item.

items.armor.duelistarmor.name=hero's carapace
items.armor.duelistarmor.desc=While wearing this armor overgrown with swarm tissue, the Renegade can perform a special ability.

items.armor.huntressarmor.name=hero's cloak
items.armor.huntressarmor.no_enemies=No enemies in sight
items.armor.huntressarmor.desc=While wearing this cloak, the Huntress can perform a special ability.

items.armor.leatherarmor.name=combat uniform
items.armor.leatherarmor.desc=A field uniform with flexible plates on the shoulders and thighs. Heavier than the standard uniform, and it protects better.

items.armor.magearmor.name=hero's campaign armor
items.armor.magearmor.desc=While wearing this campaign armor with its comms antenna, the Exterminator can perform a special ability.

items.armor.mailarmor.name=ballistic vest
items.armor.mailarmor.desc=A layered ballistic fiber vest worn over the uniform. Tough and still flexible enough to run in.

items.armor.platearmor.name=assault armor
items.armor.platearmor.desc=The full armor of boarding teams, sealed and armored from head to toe. It offers unmatched protection to anyone strong enough to carry its weight.

items.armor.roguearmor.name=hero's operator suit
items.armor.roguearmor.desc=While wearing this dark infiltration suit, the Special Forces operator can perform a special ability.

items.armor.scalearmor.name=plate carrier
items.armor.scalearmor.desc=Ceramic plates fitted into a heavy vest. They take a lot of punishment without restricting movement too much.

items.armor.warriorarmor.name=hero's assault armor
items.armor.warriorarmor.desc=While wearing this heavy assault armor, the Marine can perform a special ability.



###artifacts
items.artifacts.alchemiststoolkit.name=portable lab
items.artifacts.alchemiststoolkit.ac_brew=BREW
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZE
items.artifacts.alchemiststoolkit.not_ready=Your lab has not finished warming up.
items.artifacts.alchemiststoolkit.cursed=Your corrupted lab prevents you from using synthesis!
items.artifacts.alchemiststoolkit.need_energy=You need at least 6 energy for that.
items.artifacts.alchemiststoolkit.energize_desc=Every 6 energy crystals will give the lab enough energy to gain a level, which increases the rate that the lab generates energy over time, and how quickly it warms up.\n\nHow much energy would you like to use?
items.artifacts.alchemiststoolkit.energize_1=6 energy: +1 level
items.artifacts.alchemiststoolkit.energize_all=%1$d energy: +%2$d levels
items.artifacts.alchemiststoolkit.desc=A portable lab that lets you mix compounds anywhere, as long as it has energy.
items.artifacts.alchemiststoolkit.desc_cursed=The corrupted lab has bound itself to your side, and refuses to let you use synthesis.
items.artifacts.alchemiststoolkit.desc_warming=The lab is currently warming up, and will be ready to use after a little while.
items.artifacts.alchemiststoolkit.desc_hint=The equipped lab is slowly generating synthesis energy as you gain experience. It looks like the mixture in the vial could be enhanced by adding energy crystals to it.

items.artifacts.artifact.cannot_wear_two=You cannot wear two of the same module.
items.artifacts.artifact.equip_cursed=The module painfully binds itself to you.
items.artifacts.artifact.curse_known=You can feel corrupted code running within the module.
items.artifacts.artifact.not_cursed=This module is free of corruption.
items.artifacts.artifact.need_to_equip=You need to equip your module to do that.

items.artifacts.capeofthorns.name=reactive plating
items.artifacts.capeofthorns.desc=Reactive plates fixed to your armor. They build charge from the damage you take and, when active, deflect part of it back at attackers.
items.artifacts.capeofthorns.desc_inactive=The plating feels reassuringly heavy on your shoulders, it seems to be gaining energy from the damage you take.
items.artifacts.capeofthorns.desc_active=The plating seems to be releasing stored energy, it is radiating a protective power.
items.artifacts.capeofthorns$thorns.inert=Your Plating becomes inert again.
items.artifacts.capeofthorns$thorns.radiating=Your Plating begins radiating energy, you feel protected!
items.artifacts.capeofthorns$thorns.levelup=Your Plating grows stronger!
items.artifacts.capeofthorns$thorns.name=thorns
items.artifacts.capeofthorns$thorns.desc=Your plating is radiating energy, surrounding you in a field of deflective force!\n\nAll damage you receive is reduced while the thorns effect is active. Additionally, if the attacker is next to you, the reduced amount is deflected back at the attacker.\n\nTurns of thorns remaining: %s.

items.artifacts.chaliceofblood.name=blood reactor
items.artifacts.chaliceofblood.ac_prick=PRICK
items.artifacts.chaliceofblood.yes=Yes, I know what I'm doing
items.artifacts.chaliceofblood.no=No, I changed my mind
items.artifacts.chaliceofblood.prick_warn=Each time you use the reactor it will drain more of your life energy, but will further enhance your natural health regeneration in exchange.\n\nCurrently pricking yourself will deal _%1$d-%2$d damage_, although this damage can be reduced by _both physical and energy blocking or damage reduction._ Without considering damage reduction effects, pricking yourself currently has a _%3$s%% chance_ to drain your life force completely.\n\nAre you sure you want to offer the reactor more life energy?
items.artifacts.chaliceofblood.onprick=You prick yourself, and your life essence drains into the reactor.
items.artifacts.chaliceofblood.ondeath=The Reactor sucks your life essence dry...
items.artifacts.chaliceofblood.desc=A reactor that feeds on your own blood. Each dose hurts, but it greatly speeds up your regeneration.
items.artifacts.chaliceofblood.desc_cursed=The corrupted reactor has bound itself to your hand, and is inhibiting your ability to regenerate health.
items.artifacts.chaliceofblood.desc_1=As you hold the reactor, you feel oddly compelled to prick yourself on the sharp gems.
items.artifacts.chaliceofblood.desc_2=Some of your blood is pooled into the reactor, you can subtly feel the reactor feeding life energy into you, increasing your natural health regeneration. You still want to cut yourself on the reactor, even though you know it will hurt.
items.artifacts.chaliceofblood.desc_3=The reactor is filled to the brim with your life essence. You can feel the reactor pouring life energy back into you.

items.artifacts.cloakofshadows.name=active camo module
items.artifacts.cloakofshadows.ac_stealth=STEALTH
items.artifacts.cloakofshadows.cooldown=Your camo needs %d more rounds to re-energize.
items.artifacts.cloakofshadows.cursed=You cannot use a corrupted camo.
items.artifacts.cloakofshadows.no_charge=Your camo hasn't recharged enough to be usable yet.
items.artifacts.cloakofshadows.desc=An active camo module that bends light around your body. While it has charge, you stay invisible.
items.artifacts.cloakofshadows.discover_hint=One of the heroes starts with this item.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Your camo has run out of energy.
items.artifacts.cloakofshadows$cloakstealth.levelup=Your camo grows stronger!
items.artifacts.cloakofshadows$cloakstealth.name=cloaked
items.artifacts.cloakofshadows$cloakstealth.desc=Your active camo module is granting you invisibility while you are shrouded by it. You will remain cloaked until it is cancelled or your camo runs out of charge.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and energy effects (such as cartridges and special weapons) will immediately cancel invisibility.\n\nTurns until charge use: %d.

items.artifacts.driedrose.name=Sgt. Brandt's echo
items.artifacts.driedrose.ac_summon=ACTIVATE
items.artifacts.driedrose.ac_direct=COMMAND
items.artifacts.driedrose.ac_outfit=OUTFIT
items.artifacts.driedrose.spawned=Sgt. Brandt's echo is already active.
items.artifacts.driedrose.no_charge=The module isn't fully charged yet.
items.artifacts.driedrose.cursed=You can't use a corrupted module.
items.artifacts.driedrose.no_space=There is no free space near you.
items.artifacts.driedrose.charged=Sgt. Brandt's echo is fully charged!
items.artifacts.driedrose.desc=A memory module pulled from Sgt. Ivo Brandt's suit. His consciousness still runs inside and can fight beside you as a hologram.
items.artifacts.driedrose.desc_no_quest=A memory module with Sgt. Ivo Brandt's name engraved on the casing.\n\nSomething still runs inside, but you don't know how to activate it right now.
items.artifacts.driedrose.desc_hint=Some memory fragments are missing. Reinstalling them should strengthen the echo.
items.artifacts.driedrose.desc_cursed=The corrupted module is stuck to your hand and gives off a strange chill.
items.artifacts.driedrose.desc_weapon=Sgt. Brandt's weapon: %s
items.artifacts.driedrose.desc_armor=Sgt. Brandt's armor: %s
items.artifacts.driedrose.desc_strength=Sgt. Brandt's strength: %s
items.artifacts.driedrose$petal.name=memory fragment
items.artifacts.driedrose$petal.no_rose=You don't have Sgt. Brandt's module to install this fragment in.
items.artifacts.driedrose$petal.no_room=There's no more room for this fragment, so you discard it.
items.artifacts.driedrose$petal.maxlevel=Sgt. Brandt's echo is complete!
items.artifacts.driedrose$petal.levelup=You install the fragment in the module.
items.artifacts.driedrose$petal.desc=A chip holding a piece of Sgt. Brandt's memories, which somehow survived all the way here.
items.artifacts.driedrose$wndghosthero.title=Sgt. Brandt's Gear
items.artifacts.driedrose$wndghosthero.desc=Sgt. Brandt is weak on his own, but his projection is solid enough to hold a weapon and armor. He can use these items just like you.\n\nSgt. Brandt can equip items that require up to _%d strength._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Select a weapon
items.artifacts.driedrose$wndghosthero.armor_prompt=Select an armor
items.artifacts.driedrose$wndghosthero.cant_unique=Sgt. Brandt can't use unique items
items.artifacts.driedrose$wndghosthero.cant_cursed=Sgt. Brandt can only use gear you know isn't corrupted.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Sgt. Brandt may not be strong enough to use this.
items.artifacts.driedrose$wndghosthero.cant_strength=Sgt. Brandt isn't strong enough to use this.

##ghost hero
items.artifacts.driedrose$ghosthero.name=Sgt. Brandt's echo
items.artifacts.driedrose$ghosthero.def_verb=dodged
items.artifacts.driedrose$ghosthero.discover_hint=You can find this character with a specific module.

items.artifacts.driedrose$ghosthero.hello=Ready for another one, %s.
items.artifacts.driedrose$ghosthero.introduce=It's me, Brandt. Or a good enough copy. The module kept my memory and your suit has the power to project me.\n\nI won't see my family again, but I can help you get out of here. When the module charges, I'll answer your call and fight beside you.\n\nAs long as you carry the module, I hear your orders, even from far away.\n\nFinish what I couldn't.

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=I patrolled this corridor every night. It was always clean.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=What happened to the rest of my squad? Did anyone make it to the pods?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=My family is on Nova Aurora. I hope nobody has told them yet.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=The crew couldn't hold these things off. Maybe the two of us can.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=If the ship is like this, I don't even want to think about what's outside.
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=These crawlers grew too fast. The swarm is eating well.
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Purple sky and falling ash. Never thought I'd see this planet up close.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=The pirates got here fast. They knew we were coming.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Half the ship is scattered across these plains.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Pirates and crew, all turning into the same thing. The swarm doesn't pick sides.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=So many bodies... How long has the Murky Claw been grounded here?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Nobody deserved to end up like this.
items.artifacts.driedrose$ghosthero.dialogue_caves_1=The sensor picks up nothing down here. Not even us.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Those purple veins in the walls... Is that raw Laztro?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=With the Laztro in these caves you could buy a fleet. And nobody's getting out to spend it.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=The creatures down here are twisted, just like the ones on the ship.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Even the fliers down here want blood.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Abandoned mining gear. Someone left here in a hurry.
items.artifacts.driedrose$ghosthero.dialogue_city_1=The hive is made of ships. Look at that, there's a whole hull in the wall.
items.artifacts.driedrose$ghosthero.dialogue_city_2=How many ships did this swarm swallow before ours?
items.artifacts.driedrose$ghosthero.dialogue_city_3=I hope no inhabited planet ends up like this.
items.artifacts.driedrose$ghosthero.dialogue_city_4=These warriors learn. Every fight makes them smarter.
items.artifacts.driedrose$ghosthero.dialogue_city_5=I don't know what's worse, the swarm or what it builds.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Everything here pulses. It's like the hive is breathing.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=What is this place?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=This place gives me the creeps, and I don't even have skin anymore.
items.artifacts.driedrose$ghosthero.dialogue_halls_3=The queen is close. You can feel it in the air.
items.artifacts.driedrose$ghosthero.dialogue_halls_4=These creatures aren't from this planet. Where did this swarm come from?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Do you feel that? Something is watching us.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Good thing the suit has a light. It's pitch black down here.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Why is this happening? I thought we'd won.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=How is that thing still in charge of anything?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=I hope you know what you're doing with that heart.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Looks like the mission isn't over yet.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=We made it this far. We can do this!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Just a little more. We're getting off this planet!

items.artifacts.driedrose$ghosthero.seen_goo_1=Beware the Matrix!
items.artifacts.driedrose$ghosthero.seen_goo_2=That thing killed half my squad. Payback time!
items.artifacts.driedrose$ghosthero.seen_goo_3=That thing can't be allowed to live!
items.artifacts.driedrose$ghosthero.seen_tengu_1=Captain Kell. She shoots better than anyone in the Brigade.
items.artifacts.driedrose$ghosthero.seen_tengu_2=She's got us surrounded!
items.artifacts.driedrose$ghosthero.seen_tengu_3=I've heard stories about this woman. None of them end well.
items.artifacts.driedrose$ghosthero.seen_dm300_1=An armed mining machine. Someone didn't want visitors.
items.artifacts.driedrose$ghosthero.seen_dm300_2=That thing is huge...
items.artifacts.driedrose$ghosthero.seen_dm300_3=How is that thing still running after all this time?
items.artifacts.driedrose$ghosthero.seen_king_1=A Brigade uniform... Is that the commander of the Vigil-3?
items.artifacts.driedrose$ghosthero.seen_king_2=That isn't a person anymore.
items.artifacts.driedrose$ghosthero.seen_king_3=Even dead, they obey.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, this doesn't look good at all.
items.artifacts.driedrose$ghosthero.seen_yog_2=So this is what's at the bottom of everything?
items.artifacts.driedrose$ghosthero.seen_yog_3=This is going to hurt...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Good luck...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Signal weak... for now...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=I'll be back...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Sorry... good luck...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finish it off... without me...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=No... not yet...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=How did you survive that?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Wish I'd had one of those in the crash...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=You're still standing!
items.artifacts.driedrose$ghosthero.player_killed_1=No!...
items.artifacts.driedrose$ghosthero.player_killed_2=I couldn't protect you...
items.artifacts.driedrose$ghosthero.player_killed_3=Not like this...

items.artifacts.driedrose$ghosthero.direct_prompt=Orders?
items.artifacts.driedrose$ghosthero.directed_follow_1=Copy, I'm with you.
items.artifacts.driedrose$ghosthero.directed_follow_2=Covering the rear.
items.artifacts.driedrose$ghosthero.directed_follow_3=Following...
items.artifacts.driedrose$ghosthero.directed_follow_4=Right, let's go!
items.artifacts.driedrose$ghosthero.directed_follow_5=I've got your back.
items.artifacts.driedrose$ghosthero.directed_attack_1=Copy, target marked.
items.artifacts.driedrose$ghosthero.directed_attack_2=That one's mine.
items.artifacts.driedrose$ghosthero.directed_attack_3=Engaging...
