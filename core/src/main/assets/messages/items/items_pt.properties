items.armor.classarmor.transfer_title=Transferir Armadura
items.armor.classarmor.transfer_desc=O circuito da insígnia pode ser passado para outra armadura. Isso destrói a armadura original.
items.armor.classarmor.transfer_prompt=Selecione uma armadura
items.armor.classarmor.transfer_cancel=Cancelar
items.armor.classarmor.transfer_complete=As propriedades da sua armadura heroica foram transferidas!
items.armor.classarmor.discover_hint=Você pode encontrar este item após derrotar o chefe do setor 20 com um herói específico.
items.armor.clericarmor.name=chassi blindado do herói
items.armor.clericarmor.desc=Com este chassi blindado acoplado ao corpo, o Sintético pode executar uma habilidade especial.
items.armor.clotharmor.name=uniforme padrão
items.armor.clotharmor.desc=O uniforme de serviço da Brigada Orbital, com reforços leves de tecido balístico. Protege pouco, mas não atrapalha.
items.armor.clotharmor.discover_hint=Um dos heróis inicia com este item.
items.armor.duelistarmor.name=carapaça do herói
items.armor.duelistarmor.desc=Usando esta armadura tomada pelo tecido do enxame, o Renegado pode executar uma habilidade especial.
items.armor.huntressarmor.name=capa do herói
items.armor.huntressarmor.no_enemies=Nenhum inimigo à vista
items.armor.huntressarmor.desc=Enquanto estiver usando esta capa, a Caçadora poderá executar uma habilidade especial.
items.armor.leatherarmor.name=uniforme de combate
items.armor.leatherarmor.desc=Um uniforme de campanha com placas flexíveis nos ombros e nas coxas. Mais pesado que o uniforme padrão, e protege melhor.
items.armor.magearmor.name=armadura de campanha do herói
items.armor.magearmor.desc=Usando esta armadura de campanha com antena de comunicação, o Exterminador pode executar uma habilidade especial.
items.armor.mailarmor.name=colete balístico
items.armor.mailarmor.desc=Um colete de fibra balística em camadas sobre o uniforme. Resistente e ainda flexível o bastante para correr.
items.armor.platearmor.name=armadura de assalto
items.armor.platearmor.desc=A armadura completa das equipes de abordagem, selada e blindada da cabeça aos pés. Oferece proteção sem igual a quem tiver força para carregar o peso.
items.armor.roguearmor.name=traje de operador do herói
items.armor.roguearmor.desc=Usando este traje escuro de infiltração, o operador das Forças especiais pode executar uma habilidade especial.
items.armor.scalearmor.name=colete de placas
items.armor.scalearmor.desc=Placas de cerâmica encaixadas num colete pesado. Aguentam muito castigo sem prender demais os movimentos.
items.armor.warriorarmor.name=armadura de assalto do herói
items.armor.warriorarmor.desc=Enquanto estiver usando esta armadura de assalto pesada, o Fuzileiro poderá executar uma habilidade especial.
###artifacts
items.artifacts.alchemiststoolkit.name=laboratório portátil
items.artifacts.alchemiststoolkit.ac_brew=MISTURAR
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZAR
items.artifacts.alchemiststoolkit.not_ready=Seu laboratório ainda não terminou de se aquecer.
items.artifacts.alchemiststoolkit.cursed=Seu laboratório corrompido impede que você use síntese!
items.artifacts.alchemiststoolkit.need_energy=Você precisa de pelo menos 6 energias para isso.
items.artifacts.alchemiststoolkit.energize_desc=Cada 6 cristais de energia darão ao laboratório energia suficiente para ganhar um nível, o que aumenta a taxa com que o laboratório gera energia ao longo do tempo e a rapidez com que aquece.\n\nQuanta energia você gostaria de usar?
items.artifacts.alchemiststoolkit.energize_1=6 energias: +1 nível
items.artifacts.alchemiststoolkit.energize_all=%1$d energias: +%2$d níveis
items.artifacts.alchemiststoolkit.desc=Um laboratório portátil que deixa você misturar compostos em qualquer lugar, desde que tenha energia.
items.artifacts.alchemiststoolkit.desc_cursed=O laboratório corrompido se prendeu ao seu corpo e se recusa a deixar você praticar síntese.
items.artifacts.alchemiststoolkit.desc_warming=O laboratório está aquecendo e ficará pronto para uso depois de um tempo.
items.artifacts.alchemiststoolkit.desc_hint=O laboratório equipado está lentamente gerando energia de síntese à medida que você ganha experiência. Parece que a mistura no reator pode ser melhorada adicionando-se cristais de energia.
items.artifacts.artifact.cannot_wear_two=Você não pode usar dois módulos iguais.
items.artifacts.artifact.equip_cursed=Este módulo se prendeu dolorosamente a você.
items.artifacts.artifact.curse_known=Você sente um código corrompido rodando neste módulo.
items.artifacts.artifact.not_cursed=Este módulo está livre de corrupção.
items.artifacts.artifact.need_to_equip=Você precisa equipar o seu módulo para fazer isso.
items.artifacts.capeofthorns.name=couraça reativa
items.artifacts.capeofthorns.desc=Placas reativas presas à armadura. Elas acumulam carga com o dano que você recebe e, quando ativadas, devolvem parte dele a quem atacou.
items.artifacts.capeofthorns.desc_inactive=Você sente a couraça tranquilamente pesada em seus ombros, parece estar ganhando energia com os danos que você recebe.
items.artifacts.capeofthorns.desc_active=A couraça parece estar liberando energia armazenada, ela está irradiando um poder protetor.
items.artifacts.capeofthorns$thorns.inert=Sua Couraça se torna inerte novamente.
items.artifacts.capeofthorns$thorns.radiating=Sua Couraça começa a irradiar energia, você se sente protegido!
items.artifacts.capeofthorns$thorns.levelup=Sua Couraça se torna mais forte!
items.artifacts.capeofthorns$thorns.name=espinhos
items.artifacts.capeofthorns$thorns.desc=Sua couraça está irradiando energia, cercando você com um campo de força defletora!\n\nTodo o dano recebido é reduzido enquanto o efeito dos espinhos esta ativado. Adicionalmente, se o atacante está próximo a você, o dano reduzido é defletido de volta ao atacante!\n\nTurnos de espinhos restantes: %s.
items.artifacts.chaliceofblood.name=reator sanguíneo
items.artifacts.chaliceofblood.ac_prick=FURAR
items.artifacts.chaliceofblood.yes=Sim, sei o que faço
items.artifacts.chaliceofblood.no=Não, eu mudei de ideia
items.artifacts.chaliceofblood.prick_warn=A cada vez que usa o reator, ele drena mais da sua energia vital, mas, em troca, potencializa mais sua regeneração natural de vida.\n\nAtualmente, espetar-se causará _%1$d-%2$d de dano_, embora esse dano possa ser reduzido por _bloqueios tanto físicos quanto de energia, ou por redução de dano. Sem considerar os efeitos de redução de dano, espetar-se tem uma chance de _%3$s%%_ de drenar completamente sua energia vital.\n\nTem certeza de que deseja oferecer mais energia vital ao reator?
items.artifacts.chaliceofblood.onprick=Você se fura e sua essência vital é drenada para dentro do reator.
items.artifacts.chaliceofblood.ondeath=O Reator drenou completamente a sua essência vital...
items.artifacts.chaliceofblood.desc=Um reator que se alimenta do seu próprio sangue. Cada dose dói, mas acelera muito a sua regeneração.
items.artifacts.chaliceofblood.desc_cursed=O reator corrompido se prendeu à sua mão e está inibindo a sua habilidade de regenerar vida.
items.artifacts.chaliceofblood.desc_1=Enquanto segura o reator, você se sente estranhamente compelido a se furar nas agulhas do reator.
items.artifacts.chaliceofblood.desc_2=Um pouco do seu sangue está acumulado dentro do reator, você sente o reator sutilmente nutrindo você com energia vital, potencializando sua regeneração natural de vida. Você ainda quer se cortar no reator, mesmo sabendo que irá doer.
items.artifacts.chaliceofblood.desc_3=O reator está cheio até a borda com a sua essência vital. Você pode sentir o reator transbordando energia vital de volta para você.
items.artifacts.cloakofshadows.name=módulo de camuflagem ativa
items.artifacts.cloakofshadows.ac_stealth=INVISÍVEL
items.artifacts.cloakofshadows.cooldown=Sua camuflagem precisa de mais %d para se reenergizar.
items.artifacts.cloakofshadows.cursed=Você não pode usar uma camuflagem corrompida.
items.artifacts.cloakofshadows.no_charge=Sua camuflagem ainda não carregou o suficiente para ser utilizada.
items.artifacts.cloakofshadows.desc=Um módulo de camuflagem ativa que desvia a luz em volta do corpo. Enquanto tiver carga, você fica invisível.
items.artifacts.cloakofshadows.discover_hint=Um dos heróis inicia com este item.
items.artifacts.cloakofshadows$cloakstealth.no_charge=A camuflagem ficou sem energia
items.artifacts.cloakofshadows$cloakstealth.levelup=Sua camuflagem cresceu em força
items.artifacts.cloakofshadows$cloakstealth.name=encoberto
items.artifacts.cloakofshadows$cloakstealth.desc=Seu módulo de camuflagem ativa está lhe garantindo invisibilidade enquanto você está encoberto por ela. Você permanecerá invisível até que a invisibilidade seja interrompida ou sua camuflagem fique sem carga.\n\nEnquanto você estiver invisível, inimigos são incapazes de atacar ou segui-lo . Ataques físicos e efeitos de energia (tais como cartuchos e armas especiais) irão interromper imediatamente a invisibilidade.\n\nTurnos até o uso de carga: %d.
items.artifacts.driedrose.name=eco do Sgt. Brandt
items.artifacts.driedrose.ac_summon=ATIVAR
items.artifacts.driedrose.ac_direct=COMANDAR
items.artifacts.driedrose.ac_outfit=EQUIPAMENTO
items.artifacts.driedrose.spawned=O eco do Sgt. Brandt já está ativo.
items.artifacts.driedrose.no_charge=O módulo ainda não está totalmente carregado.
items.artifacts.driedrose.cursed=Você não pode usar um módulo corrompido.
items.artifacts.driedrose.no_space=Não há espaço suficiente ao seu redor.
items.artifacts.driedrose.charged=O eco do Sgt. Brandt está totalmente carregado!
items.artifacts.driedrose.desc=É este o módulo que o Sgt. Brandt mencionou antes de desligar? A memória dele ainda roda aqui dentro. Talvez dê para projetar o eco dele de novo.
items.artifacts.driedrose.desc_no_quest=Um módulo de memória com o nome do Sgt. Ivo Brandt gravado na carcaça.\n\nAlgo ainda roda lá dentro, mas você não sabe como ativá-lo agora.
items.artifacts.driedrose.desc_hint=Faltam alguns fragmentos de memória. Reinstalar os fragmentos deve fortalecer o eco.
items.artifacts.driedrose.desc_cursed=O módulo corrompido está preso à sua mão e solta um frio estranho.
items.artifacts.driedrose.desc_weapon=Arma do Sgt. Brandt: %s
items.artifacts.driedrose.desc_armor=Armadura do Sgt. Brandt: %s
items.artifacts.driedrose.desc_strength=Força do Sgt. Brandt: %s
items.artifacts.driedrose$petal.name=fragmento de memória
items.artifacts.driedrose$petal.no_rose=Você não tem o módulo do Sgt. Brandt para instalar este fragmento.
items.artifacts.driedrose$petal.no_room=Não há mais espaço para este fragmento, então você o descarta.
items.artifacts.driedrose$petal.maxlevel=O eco do Sgt. Brandt está completo!
items.artifacts.driedrose$petal.levelup=Você instala o fragmento no módulo.
items.artifacts.driedrose$petal.desc=Um chip com um pedaço das memórias do Sgt. Brandt, que de algum jeito sobreviveu até aqui.
items.artifacts.driedrose$wndghosthero.title=Equipamento do Sgt. Brandt
items.artifacts.driedrose$wndghosthero.desc=O Sgt. Brandt é fraco sozinho, porém sua forma é sólida o suficiente para se equipar com arma e armadura. Ele será capaz de usar esses itens assim como você.\n\nO Sgt. Brandt pode equipar itens que requeiram até _%d de força._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Selecione uma arma
items.artifacts.driedrose$wndghosthero.armor_prompt=Escolha uma armadura
items.artifacts.driedrose$wndghosthero.cant_unique=O Sgt. Brandt não pode usar itens únicos
items.artifacts.driedrose$wndghosthero.cant_cursed=O Sgt. Brandt só pode usar equipamentos que você tem certeza de que não estão corrompidos.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=O Sgt. Brandt pode não ser forte o suficiente para usar isto.
items.artifacts.driedrose$wndghosthero.cant_strength=O Sgt. Brandt não é forte o suficiente para usar isto.
##ghost hero
items.artifacts.driedrose$ghosthero.name=eco do Sgt. Brandt
items.artifacts.driedrose$ghosthero.def_verb=desviou
items.artifacts.driedrose$ghosthero.discover_hint=Você pode encontrar este personagem com um módulo específico.
items.artifacts.driedrose$ghosthero.hello=Pronto para mais uma, %s.
items.artifacts.driedrose$ghosthero.introduce=Sou eu, o Brandt. Ou uma cópia boa o bastante. O módulo guardou minha memória e o seu traje tem energia para me projetar.\n\nNão vou ver minha família de novo, mas posso ajudar você a sair daqui. Quando o módulo carregar, eu respondo ao seu chamado e luto ao seu lado.\n\nEnquanto o módulo estiver com você, eu ouço suas ordens, mesmo de longe.\n\nTermine o que eu não consegui.
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Eu fazia a ronda deste corredor toda noite. Estava sempre limpo.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=O que aconteceu com o resto do meu esquadrão? Alguém conseguiu chegar às cápsulas?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Minha família está em Nova Aurora. Espero que ninguém tenha contado a eles ainda.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=A tripulação não segurou esses bichos. Nós dois talvez seguremos.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se a nave já está assim, nem quero pensar no que tem lá fora.
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Esses rastejadores cresceram rápido demais. O enxame está se alimentando bem.
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Céu roxo e cinza caindo. Nunca achei que veria este planeta de perto.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Os piratas chegaram rápido. Eles sabiam que a gente vinha.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Metade da nave está espalhada por estas planícies.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Piratas e tripulantes, todos virando a mesma coisa. O enxame não escolhe lado.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Quantos corpos... Quanto tempo a Garra Turva está pousada aqui?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ninguém merecia acabar assim.
items.artifacts.driedrose$ghosthero.dialogue_caves_1=O sensor não pega nada aqui embaixo. Nem a gente.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Essas veias roxas nas paredes... É Laztro bruto?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Com o Laztro destas cavernas dava para comprar uma frota. E ninguém vai sair para gastar.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Os bichos aqui são deformados, igual aos da nave.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Até os voadores daqui querem sangue.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Equipamento de mineração abandonado. Alguém fugiu daqui com pressa.
items.artifacts.driedrose$ghosthero.dialogue_city_1=A colmeia é feita de nave. Olha aquilo, é um casco inteiro na parede.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Quantas naves esse enxame já engoliu antes da nossa?
items.artifacts.driedrose$ghosthero.dialogue_city_3=Espero que nenhum planeta habitado acabe assim.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Esses guerreiros aprendem. Cada luta deixa eles mais espertos.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Não sei o que é pior, o enxame ou o que ele constrói.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Tudo aqui pulsa. Parece que a colmeia respira.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Que lugar é este?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Este lugar me dá arrepios, e eu nem tenho mais pele.
items.artifacts.driedrose$ghosthero.dialogue_halls_3=A rainha está perto. Dá para sentir no ar.
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Essas criaturas não são deste planeta. De onde veio esse enxame?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Consegue sentir? Tem alguma coisa observando a gente.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Ainda bem que o traje tem lanterna. É muito escuro aqui.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Por que isso está acontecendo? Achei que tínhamos vencido.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Como aquela coisa ainda manda em alguma coisa?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Espero que você saiba o que está fazendo com esse coração.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Pelo jeito a missão ainda não acabou.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Chegamos até aqui. A gente consegue!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Só mais um pouco. A gente vai sair deste planeta!
items.artifacts.driedrose$ghosthero.seen_goo_1=Cuidado com a Matriz!
items.artifacts.driedrose$ghosthero.seen_goo_2=Essa coisa matou metade do meu esquadrão. Hora da vingança!
items.artifacts.driedrose$ghosthero.seen_goo_3=Isso não pode continuar vivo!
items.artifacts.driedrose$ghosthero.seen_tengu_1=A Capitã Kell. Ela atira melhor do que qualquer um da Brigada.
items.artifacts.driedrose$ghosthero.seen_tengu_2=Ela cercou a gente!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Já ouvi histórias sobre essa mulher. Nenhuma termina bem.
items.artifacts.driedrose$ghosthero.seen_dm300_1=Uma máquina de mineração armada. Alguém não queria visitas.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Essa coisa é enorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Como isso ainda funciona depois de tanto tempo?
items.artifacts.driedrose$ghosthero.seen_king_1=Uma farda da Brigada... É o comandante da Vigília-3?
items.artifacts.driedrose$ghosthero.seen_king_2=Aquilo não é mais gente.
items.artifacts.driedrose$ghosthero.seen_king_3=Até mortos eles obedecem.
items.artifacts.driedrose$ghosthero.seen_yog_1=Ah, isso não parece nada bom.
items.artifacts.driedrose$ghosthero.seen_yog_2=Então é isso que está no fundo de tudo?
items.artifacts.driedrose$ghosthero.seen_yog_3=Isso vai doer...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Boa sorte...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Sinal fraco... por enquanto...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Eu volto...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Desculpe... boa sorte...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Termine... sem mim...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Não... ainda não...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Como você sobreviveu a isso?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Queria ter tido um desses na queda...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Você ainda está de pé!
items.artifacts.driedrose$ghosthero.player_killed_1=Não!...
items.artifacts.driedrose$ghosthero.player_killed_2=Não consegui proteger você...
items.artifacts.driedrose$ghosthero.player_killed_3=Assim não...
items.artifacts.driedrose$ghosthero.direct_prompt=Ordens?
items.artifacts.driedrose$ghosthero.directed_follow_1=Entendido, vou com você.
items.artifacts.driedrose$ghosthero.directed_follow_2=Cobrindo a retaguarda.
items.artifacts.driedrose$ghosthero.directed_follow_3=Seguindo...
items.artifacts.driedrose$ghosthero.directed_follow_4=Certo, vamos!
items.artifacts.driedrose$ghosthero.directed_follow_5=Estou nas suas costas.
items.artifacts.driedrose$ghosthero.directed_attack_1=Entendido, alvo marcado.
items.artifacts.driedrose$ghosthero.directed_attack_2=Esse é meu.
items.artifacts.driedrose$ghosthero.directed_attack_3=Atacando...
items.artifacts.driedrose$ghosthero.directed_attack_4=Vamos pegá-los!
items.artifacts.driedrose$ghosthero.directed_attack_5=Deixa comigo.
items.artifacts.driedrose$ghosthero.directed_position_1=Certo, vou segurar essa posição.
items.artifacts.driedrose$ghosthero.directed_position_2=Vou até lá e defendo.
items.artifacts.driedrose$ghosthero.directed_position_3=Reposicionando...
items.artifacts.driedrose$ghosthero.directed_position_4=A caminho!
items.artifacts.driedrose$ghosthero.directed_position_5=Indo para lá.
items.artifacts.driedrose$ghosthero.desc=Um holograma do Sgt. Ivo Brandt, falhando nas bordas. A força dele depende do módulo que você carrega.\n\nNão é muito, mas é o único aliado que você tem aqui embaixo.
