items.rings.ring.equip_cursed=O implante se crava no seu braço e dói!
items.rings.ring.unknown_desc=Um implante de metal com um LED que pisca no escuro. Quem sabe o que ele faz quando instalado?
items.rings.ring.known=Isto é um %s
items.rings.ring.identify=Você agora está familiarizado o suficiente com o seu implante para identificá-lo.
