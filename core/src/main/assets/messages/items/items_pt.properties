items.artifacts.timekeepershourglass.prompt=Como você quer usar o estabilizador?\n\nNa estase, o tempo corre normalmente enquanto você fica congelado e completamente invulnerável, consumindo até 2 cargas por vez.\n\nCom o tempo congelado, você pode se mover como se suas ações não levassem tempo. Isso pode ser desativado a qualquer momento usando o estabilizador outra vez.
items.artifacts.timekeepershourglass.desc=Um estabilizador temporal experimental. Ele pode congelar você fora do tempo ou acelerar o seu tempo em relação ao resto do setor.
items.artifacts.timekeepershourglass.desc_hint=O estabilizador perdeu várias células temporais. Se você encontrasse mais...
items.artifacts.timekeepershourglass.desc_cursed=O estabilizador corrompido está preso ao seu corpo, e você sente que ele mexe com o seu fluxo de tempo.
items.artifacts.timekeepershourglass$timefreeze.name=Congelamento de tempo
items.artifacts.timekeepershourglass$timefreeze.desc=O tempo está congelado ao seu redor, e suas ações acontecem instantaneamente. O efeito dura até ser cancelado ou até o estabilizador ficar sem carga. Atacar ou usar uma arma especial também quebra o efeito.\n\nTurnos até gastar carga: %s.
items.artifacts.timekeepershourglass$sandbag.name=célula temporal
items.artifacts.timekeepershourglass$sandbag.levelup=Você encaixou a célula no seu estabilizador.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Seu estabilizador está com todas as células!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Você não tem um estabilizador para usar esta célula.
items.artifacts.timekeepershourglass$sandbag.desc=Uma célula de energia temporal que encaixa perfeitamente no seu estabilizador.\n\nÉ muita sorte o mercador ter justo esta peça quando você precisa...
