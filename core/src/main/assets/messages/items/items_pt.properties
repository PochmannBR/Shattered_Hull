items.hull.servicerifle.name=fuzil de serviço
items.hull.servicerifle.desc=O fuzil padrão da Brigada Orbital. Pesado, confiável e feio. Cada carregador leva 12 disparos.\n\nO disparo é barulhento: _acorda e atrai os inimigos_ num raio de 6 quadrados até o lugar do tiro.\n\nAtacar um inimigo ao lado com o fuzil é uma _coronhada_: não gasta munição, mas bate fraco.
