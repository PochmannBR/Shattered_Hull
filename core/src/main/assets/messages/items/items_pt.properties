items.scrolls.scroll.unknown_desc=Um cartucho de dados da Vigília-7 com um código ilegível na etiqueta. Quem sabe o que acontece quando ele é executado no traje?
items.scrolls.scroll.blinded=Você não pode executar um cartucho enquanto estiver cego.
items.scrolls.scroll.no_magic=Você não pode executar um cartucho enquanto está imune a energia.
items.scrolls.scroll.cursed=O banco de dados corrompido impede que você rode o programa deste cartucho! Um cartucho de remoção de corrupção, porém, talvez seja forte o suficiente para funcionar...
items.scrolls.scroll$placeholder.name=cartucho
items.scrolls.inventoryscroll.warning=Você deseja realmente cancelar o uso deste cartucho? Ele não foi identificado anteriormente, então será consumido de qualquer forma.
items.scrolls.inventoryscroll.yes=Sim, eu tenho certeza
items.scrolls.inventoryscroll.no=Não, eu mudei de ideia
items.scrolls.scrollofidentify.name=cartucho de análise
items.scrolls.scrollofidentify.inv_title=Identificar um item
items.scrolls.scrollofidentify.it_is=Seu item foi identificado: %s.
items.scrolls.scrollofidentify.desc=Este cartucho revela todos os segredos de um único item permanentemente.
items.scrolls.scrolloflullaby.name=cartucho de pulso sonífero
items.scrolls.scrolloflullaby.sooth=O cartucho emite uma melodia suave. Você se sente muito sonolento.
items.scrolls.scrolloflullaby.desc=A leitura deste cartucho emite uma melodia suave que irá colocar todos os que a ouvirem num sono induzido profundo. Para o leitor e seus aliados, o sono é restaurador.
items.scrolls.scrollofmagicmapping.name=cartucho de mapa do setor
items.scrolls.scrollofmagicmapping.layout=Você agora sabe o formato deste setor.
items.scrolls.scrollofmagicmapping.desc=Quando este cartucho for executado, uma imagem de clareza cristalina será entalhada em sua memória, alertando você sobre a configuração precisa deste nível e revelando todos os seus segredos ocultos. A localização de itens e de criaturas permanecerão desconhecidos.
items.scrolls.scrollofmirrorimage.name=cartucho holográfico
items.scrolls.scrollofmirrorimage.copies=O cartucho forma imagens espelhadas de você.
items.scrolls.scrollofmirrorimage.no_copies=O cartucho tenta criar imagens espelhadas de você, mas elas não têm para aonde ir.
items.scrolls.scrollofmirrorimage.desc=A modificação neste cartucho criará dois gêmeos ilusórios do leitor. Essas imagens espelhadas agem como clones mais fracos do leitor e perseguem seus inimigos. No entanto, eles não têm durabilidade e irão desaparecer ao sofrer dano.
items.scrolls.scrollofretribution.name=cartucho de descarga
items.scrolls.scrollofretribution.blast=Uma descarga de energia irrompe do cartucho!
items.scrolls.scrollofretribution.desc=Este cartucho contém energia destrutiva que canaliza o sofrimento do leitor para o exterior numa explosão de poder. Quanto mais fraco o leitor estiver, mais danos ele irá causar. Com a saúde muito baixa, este cartucho pode matar a maioria dos inimigos instantaneamente.\n\nNo entanto, o uso do cartucho afeta o usuário, cegando-o e enfraquecendo-o.
items.scrolls.scrollofrage.name=cartucho de provocação
items.scrolls.scrollofrage.roar=O cartucho emite um rugido enfurecedor que ecoa pelo setor!
items.scrolls.scrollofrage.desc=Ao ser executado , este cartucho irá liberar um grande rugido que atrairá a atenção de todos os inimigos para o leitor, e colocará em estado de cólera aqueles que estiverem próximos.
items.scrolls.scrollofrecharging.name=cartucho de recarga
items.scrolls.scrollofrecharging.surge=Um surto de energia percorre seu corpo, revigorando suas armas especiais!
items.scrolls.scrollofrecharging.desc=A carga de energia guardada neste cartucho irá, quando liberado, carregar todas as armas especiais do usuário ao longo do tempo.
items.scrolls.scrollofremovecurse.name=cartucho de purga
items.scrolls.scrollofremovecurse.inv_title=Purifique um item
items.scrolls.scrollofremovecurse.cleansed=O seu item brilha com uma luz purificante e a energia maléfica dissipa-se!
items.scrolls.scrollofremovecurse.not_cleansed=O seu item brilha com uma luz purificadora, mas nada acontece.
items.scrolls.scrollofremovecurse.spirit=Seu cartucho limpa o holograma de tripulante!
items.scrolls.scrollofremovecurse.desc=A modificação neste cartucho removerá instantaneamente quaisquer corrupções de uma arma, implante, arma especial, armadura ou módulo.
items.scrolls.scrollofteleportation.name=cartucho de teletransporte
items.scrolls.scrollofteleportation.tele=Em um piscar de olhos, você foi teletransportado para outro lugar no setor.
items.scrolls.scrollofteleportation.no_tele=O teletransporte falhou.
items.scrolls.scrollofteleportation.cant_reach=Você não pode se teletransportar para lá.
items.scrolls.scrollofteleportation.prompt=Escolha uma localização para se teletransportar
items.scrolls.scrollofteleportation.desc=O programa deste cartucho transporta instantaneamente o leitor para um local diferente no setor. O cartucho prioriza áreas para as quais o leitor não esteve antes, porém não é capaz de se teletransportar através de portas trancadas ou barricadas. Ele pode, no entanto, revelar portas escondidas que levam a novas áreas.
items.scrolls.scrollofterror.name=cartucho de pânico
items.scrolls.scrollofterror.none=O cartucho emite uma brilhante luz vermelha.
items.scrolls.scrollofterror.one=O cartucho emite uma brilhante luz vermelha e %s foge!
items.scrolls.scrollofterror.many=O cartucho emite uma brilhante luz vermelha e os monstros fogem!
items.scrolls.scrollofterror.desc=Quando executado, este cartucho emitirá um flash de luz vermelho que irá envolver todos os inimigos em seu campo de visão com terror, fazendo-os fugir. Atacar um inimigo em fuga encurtará o efeito.
items.scrolls.scrolloftransmutation.name=cartucho de reprogramação
items.scrolls.scrolloftransmutation.inv_title=Transmutar um item
items.scrolls.scrolloftransmutation.nothing=Nada de interessante acontece.
items.scrolls.scrolloftransmutation.morph=Seu item se transforma em algo diferente!
items.scrolls.scrolloftransmutation.desc=Este cartucho contém um poderoso programa de transmutação. Quando usado em um item elegível, irá transformá-lo em um item diferente do mesmo tipo. O programa preservará até mesmo aprimoramentos, modificações e revestimentos. Cartuchos e injetores serão transmutados em suas variantes exóticas e vice-versa.
items.scrolls.scrollofupgrade.name=kit de modificação
items.scrolls.scrollofupgrade.inv_title=Aprimorar um item
items.scrolls.scrollofupgrade.weaken_curse=O kit de modificação enfraquece a corrupção em seu item.
items.scrolls.scrollofupgrade.remove_curse=O kit de modificação purificou seu item da corrupção!
items.scrolls.scrollofupgrade.desc=Este cartucho aprimorará um único item ou um conjunto de armas de arremesso. Armas especiais aumentarão em poder e número de cargas, armas e armaduras causarão e bloquearão mais dano, conjuntos de armas de arremesso serão completamente reparados e serão mais duráveis e os efeitos dos implantes se intensificarão.\n\nSua modificação pode até enfraquecer ou às vezes dissipar totalmente corrupções, embora não seja tão potente quanto um cartucho de remover corrupção. Infelizmente, o programa de aprimoramento também pode interferir e apagar modificações de armas e revestimentos nas armaduras de níveis altos.
