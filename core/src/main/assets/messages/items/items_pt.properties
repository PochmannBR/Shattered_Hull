items.artifacts.unstablespellbook.desc_cursed=O banco de dados corrompido se prendeu a você e está inibindo a sua habilidade de usar cartuchos.
items.artifacts.unstablespellbook.desc_index=Este banco de dados está incompleto. Seu índice está atualmente apontando para as seguintes setores vazios:
items.artifacts.unstablespellbook.desc_empowered=Os cartuchos que você adicionou ao banco de dados estão brilhando com poder. Você poderá escolher a versão exótica dos efeitos desses cartuchos, mas ao custo de uma carga adicional.
items.artifacts.unstablespellbook.read_empowered=O cartucho que você adicionou ao banco de dados surge com energia. Você pode canalizar a versão regular ou exótica do efeito desse cartucho.\n\nA escolha da variante exótica custará 2 cargas ao invés de 1.
