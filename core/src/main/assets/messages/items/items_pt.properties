items.scrolls.exotic.exoticscroll.discover_hint=Você pode fabricar este item através de síntese.
items.scrolls.exotic.scrollofsirenssong.name=Cartucho do canto da sereia
items.scrolls.exotic.scrollofsirenssong.prompt=Escolha um alvo
items.scrolls.exotic.scrollofsirenssong.no_target=O cartucho é ativado sem um alvo.
items.scrolls.exotic.scrollofsirenssong.cancel=Você deve escolher um alvo.
items.scrolls.exotic.scrollofsirenssong.desc=A leitura deste cartucho emitirá uma melodia sedutora que dominará o inimigo visado, transformando-o permanentemente em um aliado! Outros inimigos que ouvirem ficarão fascinados por um tempo.\n\nInimigos particularmente fortes podem resistir ao efeito de dominação e, em vez disso, ficarão fascinados.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=dominado
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Esta criatura foi dominada pelo sinal do cartucho do canto da sereia.\n\nUm personagem dominado é seu aliado permanentemente e irá lutar com qualquer inimigo que encontre.
items.scrolls.exotic.scrollofantimagic.name=cartucho antienergia
items.scrolls.exotic.scrollofantimagic.desc=O programa deste cartucho envolve você num campo de isolamento que o deixa imune, por um tempo, a todos os efeitos de energia, sejam prejudiciais ou benéficos. Isso inclui a maioria dos efeitos de itens, como armas especiais, cartuchos, implantes, módulos, modificações e corrupções. Mesmo assim, as habilidades de armadura heroica ainda são fortes o suficiente para funcionar.
items.scrolls.exotic.scrollofchallenge.name=Cartucho do desafio
items.scrolls.exotic.scrollofchallenge.desc=Quando executado , este cartucho desencadeará um grande rugido que atrairá os inimigos até o usuário, ao mesmo tempo em que cria uma pequena arena em volta dele.\n\nEnquanto o leitor permanecer nesta arena, irá receber 33% a menos de dano de qualquer fonte (isso é aplicado antes de outras formas de redução de dano) e não irá perder saciedade.\n\nO tamanho da arena será dimensionado com a área em que o leitor se encontra. Será particularmente pequena em algumas áreas de chefões.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena de desafio
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Uma arena de contenção apareceu ao seu redor, indicada pela névoa vermelha ondulante.\n\nEnquanto estando nesta névoa, sua fome não aumentará e você receberá 33%% a menos de dano de todas as fontes. Se você tiver qualquer fonte de redução de dano (como uma armadura), ela será aplicada após a redução de 33%%. \n\nTurnos restantes: %d.
items.scrolls.exotic.scrollofdivination.name=cartucho de catalogação
items.scrolls.exotic.scrollofdivination.nothing_left=Não há mais nada para identificar!
items.scrolls.exotic.scrollofdivination.desc=Este cartucho identificará aleatoriamente quatro tipos de itens que você não conhece atualmente. Os tipos identificados podem ser a cor de um injetor, o código de um cartucho ou o LED de um implante. Os itens identificados não serão necessariamente aqueles que você está carregando.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Seu cartucho de catalogação identificou os seguintes itens:
items.scrolls.exotic.scrollofdread.name=Cartucho do pavor
items.scrolls.exotic.scrollofdread.desc=Quando executado, este cartucho emitirá um flash de luz vermelho que introduzirá um incrível terror em todos os inimigos no seu campo de visão. Tão grande é esse efeito que eles tentarão fugir rapidamente do setor inteiro, para nunca mais serem vistos!\n\nAssim como o terror, este efeito pode expirar com o tempo ou quando o inimigo for atacado.\n\nInimigos obstinados, como os chefões, porém, serão afligidos com terror normal.
items.scrolls.exotic.scrollofenchantment.name=cartucho de modificação
items.scrolls.exotic.scrollofenchantment.inv_title=Modifique um item
items.scrolls.exotic.scrollofenchantment.weapon=Selecione uma modificação para aplicar em sua arma.
items.scrolls.exotic.scrollofenchantment.armor=Selecione um revestimento para aplicar à sua armadura.
items.scrolls.exotic.scrollofenchantment.cancel=cancelar
items.scrolls.exotic.scrollofenchantment.cancel_warn=O cancelamento ainda consumirá seu cartucho de modificação, tem certeza?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sim, tenho certeza.
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Não, mudei de ideia
items.scrolls.exotic.scrollofenchantment.desc=Este cartucho infundirá uma arma ou armadura com um pacote poderoso de modificações. O leitor ainda tem algum grau de controle sobre qual modificação será aplicada.
items.scrolls.exotic.scrollofforesight.name=cartucho da vidência
items.scrolls.exotic.scrollofforesight.desc=Após executar este cartucho, os detalhes de terrenos próximos serão constantemente alimentados à mente do leitor com clareza cristalina. Este efeito dura por uma quantidade considerável de tempo e revelará todas as portas e armadilhas escondidas, fazendo a procura desnecessária.
items.scrolls.exotic.scrollofmetamorphosis.name=cartucho da metamorfose
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Escolha um talento para metamorfosear.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Escolha um novo talento para repor o seu talento metamorfoseado.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=O cancelamento ainda consumirá seu cartucho da metamorfose, tem certeza?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=talento de metamorfose
items.scrolls.exotic.scrollofmetamorphosis.desc=Este cartucho contém um poderoso programa de transmutação, que será aplicado a quem o roda ao invés de a um item. O programa deste cartucho permitirá que você selecione um talento e o substitua por um dos cinco talentos de mesmo tier de diferente classes de herói!\n\nEste efeito somente pode ser aplicado a talentos de classe e não a talentos ganhos de subclasses ou habilidades de armadura. Talentos que você não pode usar não serão dados como opções.
items.scrolls.exotic.scrollofmysticalenergy.name=cartucho da energia mística
items.scrolls.exotic.scrollofmysticalenergy.desc=A carga de energia guardada neste cartucho irá, quando liberado, carregar os módulos equipados do usuário ao longo do tempo.
items.scrolls.exotic.scrollofpassage.name=cartucho da passagem
items.scrolls.exotic.scrollofpassage.desc=O programa deste cartucho transporta instantaneamente o leitor para o primeiro setor da região mais próxima acima dele. Muito útil para chegar rapidamente a uma loja.
items.scrolls.exotic.scrollofprismaticimage.name=cartucho da imagem prismática
items.scrolls.exotic.scrollofprismaticimage.desc=A modificação neste cartucho criará um gêmeo ilusório colorido do leitor. Esta imagem prismática atua como um clone mais fraco do leitor, com defesa semelhante, mas menos PV e dano.\n\nA imagem prismática se mostrará quando os inimigos estiverem presentes e tentará defender o leitor.\n\nSe uma imagem prismática já existir, o uso desse cartucho irá curar a imagem.
items.scrolls.exotic.scrollofpsionicblast.name=cartucho da explosão psiônica
items.scrolls.exotic.scrollofpsionicblast.ondeath=A Explosão Psiônica explode sua mente...
items.scrolls.exotic.scrollofpsionicblast.desc=Este cartucho contém incrível energia destrutiva que pode ser canalizada para destruir as mentes de todas as criaturas visíveis.\n\nNo entanto, rodar este programa poderoso cobra um preço de quem o usa e o leitor também sofrerá dano, será cegado e enfraquecido. Quanto mais alvos o cartucho acertar, menor será o dano ao leitor.
###spells
items.spells.alchemize.name=conversor de matéria
items.spells.alchemize.prompt=Converter um item
items.spells.alchemize.desc=Um conversor portátil com a mesma tecnologia da bancada de síntese. Cada uso transforma um item, ou uma pilha de itens, em Laztro ou em energia de síntese. Converter injetores ou cartuchos em energia ainda os identifica!\n\nAs lojas vendem alguns conversores, e muitos outros podem ser feitos na bancada de síntese com uma semente, uma cápsula tática e um pouco de energia de síntese.
items.spells.alchemize$wndalchemizeitem.sell=Torne em %d moedas
items.spells.alchemize$wndalchemizeitem.sell_1=Torne 1 em %d moedas
items.spells.alchemize$wndalchemizeitem.sell_all=Torne tudo em %d moedas
items.spells.alchemize$wndalchemizeitem.energize=Torne em %d energias
items.spells.alchemize$wndalchemizeitem.energize_1=Torne 1 em %d energias
items.spells.alchemize$wndalchemizeitem.energize_all=Torne tudo em %d energias
items.spells.beaconofreturning.name=baliza de retorno
items.spells.beaconofreturning.preventing=A forte interferência deste lugar impede você de usar o dispositivo!
items.spells.beaconofreturning.creatures=A aura psíquica das criaturas vizinhas não permite que você se teletransporte neste momento.
items.spells.beaconofreturning.set=O sinalizador foi definido em sua localização atual.
items.spells.beaconofreturning.wnd_body=A configuração substituirá o local em que o sinalizador foi definido anteriormente.\n\nRetornar retornará ao seu último local definido e consumirá um uso do dispositivo.
items.spells.beaconofreturning.wnd_set=Definir
items.spells.beaconofreturning.wnd_return=Retorna
items.spells.beaconofreturning.desc_set=Este sinalizador foi definido em algum lugar no chão %d.
items.spells.beaconofreturning.desc=Este dispositivo intrincado concede ao usuário a capacidade de retornar a um local definido, independentemente da distância. O dispositivo só será consumido ao retornar, então ele pode ser definido quantas vezes quiser, mas ele só se lembrará do local mais recente para o qual ele foi definido.
items.spells.curseinfusion.name=vírus de corrupção
items.spells.curseinfusion.inv_title=Corromper um item
items.spells.curseinfusion.desc=Este dispositivo infunde um equipamento com o mesmo código corrompido e poderoso que roda na perfuratriz da Garra Turva. O item em que é usado será imediatamente corrompido e qualquer modificação ou revestimento que possa ter será sobreposto.\n\nNo caso de armas, armaduras e armas especiais, além de ser corrompido, o item será aprimorado. Aprimoramentos por infusão de corrupção não se acumulam e serão perdidos se o item se tornar não-corrompido.\n\nMúltiplas infusões de corrupção também podem ser usadas para alterar a corrupção de uma arma ou armadura.
items.spells.spell.ac_cast=ATIVAR
items.spells.spell.no_magic=Você não pode usar dispositivos enquanto está imune a energia.
items.spells.spell.discover_hint=Você pode fabricar este item através de síntese.
items.spells.magicalinfusion.name=nanoinfusão
items.spells.magicalinfusion.inv_title=Infundir um item
items.spells.magicalinfusion.infuse=Seu item é infundido com nanorrobôs!
items.spells.magicalinfusion.desc=Este dispositivo possui o mesmo poder de um kit de modificação, mas em uma forma mais estável.\n\nAlém de aprimorar um item normalmente, nunca apagará uma modificação, revestimento ou corrupção.
items.spells.magicalporter.name=drone de carga
items.spells.magicalporter.inv_title=Transportar um item
items.spells.magicalporter.nowhere=Não há nenhum lugar para que você possa transportar um item.
items.spells.magicalporter.desc=Este dispositivo irá transportar qualquer item em que for lançado. Ao contrário do transmissor de um comerciante, no entanto, os itens serão transportados para a entrada do próximo setor do chefe.
items.spells.phaseshift.name=emissor de fase
items.spells.phaseshift.no_target=Não há nada para teleportar aqui.
items.spells.phaseshift.desc=Este dispositivo caótico irá teleportar qualquer personagem para um local aleatório no setor atual e atordoá-lo por um período significativo de tempo. Inimigos poderosos serão capazes de resistir ao efeito atordoante. Este dispositivo pode ser direcionado a um alvo ou ao próprio usuário.
items.spells.reclaimtrap.name=coletor de armadilhas
items.spells.reclaimtrap.no_trap=Não há armadilha lá.
items.spells.reclaimtrap.desc_trap=O dispositivo está atualmente pronto para ativar uma _%s._
items.spells.reclaimtrap.desc=Este dispositivo contém resquícios da energia mecânica da perfuratriz da Garra Turva. Quando lançado em uma armadilha ativa, o poder da armadilha será preso a você, permitindo que você use o dispositivo de novo para expelir esse poder e ativar o efeito da armadilha em qualquer lugar que queira.\n\nNo entanto, algumas armadilhas podem não funcionar em todos os lugares, e apenas uma armadilha por vez pode ser armazenada.
items.spells.recycle.name=reciclador molecular
items.spells.recycle.inv_title=Reciclar um item
items.spells.recycle.recycled=Seu item foi reciclado para: %s.
items.spells.recycle.desc=Este dispositivo possui uma forma simples do programa de transmutação. Embora não funcione em equipamentos, este dispositivo irá transformar cartuchos, injetores, sementes, cápsulas táticas ou dardos embebidos em um item aleatório do mesmo tipo.
items.spells.summonelemental.name=incubadora de esporos
items.spells.summonelemental.ac_imbue=IMBUIR
items.spells.summonelemental.imbue_prompt=Imbuir um item
items.spells.summonelemental.desc=Este dispositivo canaliza a energia das brasas elementais e permite que você invoque um elemental para lutar ao seu lado! Apenas um elemental pode ser invocado por vez, mas o dispositivo pode ser relançado, retornando o elemental para você sem nenhum custo.
items.spells.summonelemental.desc_newborn=Este dispositivo não está atualmente imbuído e irá invocar um _elemental recém-invocado_ sem habilidade de ataque a distância. Você pode imbuir um injetor identificado de chama líquida, injetor gélido, cartucho de recarga ou cartucho de transmutação para aumentar o poder do dispositivo, fazendo com que futuras invocações sejam um elemental de poder total!
items.spells.summonelemental.desc_fire=O dispositivo está quente ao toque, irá invocar um _elemental de fogo_. Você pode imbuir um item diferente, mas o dispositivo perderá seu elemento atual.
items.spells.summonelemental.desc_frost=O dispositivo está gelado ao toque, irá invocar um _elemental de gelo_. Você pode imbuir um item diferente, mas o dispositivo perderá seu elemento atual.
items.spells.summonelemental.desc_shock=O dispositivo está irradiando energia estática, irá invocar um _elemental elétrico_. Você pode imbuir um item diferente, mas o dispositivo perderá seu elemento atual.
items.spells.summonelemental.desc_chaos=O dispositivo está irradiando energia caótica, irá invocar um _elemental caótico_. Você pode imbuir um item diferente, mas o dispositivo perderá seu elemento atual.
items.spells.targetedspell.prompt=Escolha um alvo
items.spells.targetedspell.inv_title=Infundir um item
items.spells.telekineticgrab.name=garra magnética
items.spells.telekineticgrab.cant_grab=Você não pode pegar isso.
items.spells.telekineticgrab.no_target=Não há nada para pegar aqui.
items.spells.telekineticgrab.desc=Este dispositivo permite que o conjurador pegue remotamente todos os itens em um local ou todas as armas lançadas presas a um inimigo!\n\nNão pode ser usado para pegar itens que pertencem a outros ou para pegar recipientes como baús.
items.spells.unstablespell.name=dispositivo instável
items.spells.unstablespell.desc=Este pequeno cristal quadrado preto mostra códigos em constante mudança em cada uma de suas superfícies.\n\nQuando ativado, irá desencadear o efeito de um cartucho aleatório. O efeito do cartucho sempre será focado em combate se houver inimigos no seu campo de visão e, do contrário, sempre será focado em efeitos de não-combate.
items.spells.wildenergy.name=sobrecarga
items.spells.wildenergy.desc=Este dispositivo contém uma porção da energia corrompida que alimentava a perfuratriz da Garra Turva. Quando lançado, ele recarregará suas armas especiais e módulos usados, ao mesmo tempo em que acionará um efeito de arma especial corrompida aleatório. No entanto, você pode escolher a direção para onde atirar esta energia corrompida.
###runestones
items.stones.inventorystone.ac_use=USAR
items.stones.runestone$placeholder.name=cápsula tática
items.stones.runestone.discover_hint=Você pode encontrar este item aleatoriamente durante a missão ou criá-lo por meio de síntese.
items.stones.stoneofaggression.name=cápsula de feromônio
items.stones.stoneofaggression.desc=Quando esta cápsula é jogada em um aliado ou inimigo, todos os inimigos próximos preferirão atacar esse personagem por um curto período.\n\nNo entanto, chefões não podem ser afetados por esse efeito diretamente, mas ele funciona nos seus lacaios
items.stones.stoneofaggression$aggression.name=Alvo
items.stones.stoneofaggression$aggression.desc=O feromônio está fazendo com que todos os inimigos próximos prefiram atacar este personagem.\n\nTurnos restantes: %s.
items.stones.stoneofaugmentation.name=cápsula de ajuste
items.stones.stoneofaugmentation.inv_title=Alterar um item
items.stones.stoneofaugmentation.desc=Esta cápsula tática tem nanorrobôs que podem alterar o equipamento para melhorar uma propriedade à custa de outra.\n\nUsar em uma arma permitirá aumentar a velocidade ou o dano. Armas de arremesso também ganharão ou perderão durabilidade em proporção a sua velocidade.\n\nUsar em uma armadura permitirá que você aprimore a defesa ou a evasão.
items.stones.stoneofaugmentation.discover_hint=Você pode comprar este item em uma loja ou criá-lo por meio de síntese.
items.stones.stoneofaugmentation$wndaugment.choice=Aumentar uma propriedade reduzirá a outra. Qual propriedade você gostaria de aumentar?
items.stones.stoneofaugmentation$wndaugment.already=Este item já teve uma propriedade aumentada, você pode trocar o aumento ou removê-lo.
items.stones.stoneofaugmentation$wndaugment.speed=+Velocidade -Dano
items.stones.stoneofaugmentation$wndaugment.damage=+Dano -Velocidade
items.stones.stoneofaugmentation$wndaugment.evasion=+Evasão -Defesa
items.stones.stoneofaugmentation$wndaugment.defense=+Defesa -Evasão
items.stones.stoneofaugmentation$wndaugment.none=Remover alteração
items.stones.stoneofaugmentation$wndaugment.cancel=Deixa pra lá
items.stones.stoneofblast.name=cápsula explosiva
items.stones.stoneofblast.desc=Esta cápsula tática explodirá instantaneamente no local para onde for lançada. Assim como uma bomba, a explosão causará dano a qualquer coisa próxima.
items.stones.stoneofblink.name=cápsula de salto
items.stones.stoneofblink.desc=Esta cápsula tática irá teletransportar o usuário para o local onde for lançada.
items.stones.stoneofclairvoyance.name=cápsula de varredura
items.stones.stoneofclairvoyance.desc=Esta cápsula revelará instantaneamente todos os quadrados em uma área muito extensa em torno de onde for jogada. Seu efeito alcançará até mesmo através das paredes.
items.stones.stoneofdeepsleep.name=cápsula sonífera
items.stones.stoneofdeepsleep.desc=Quando esta cápsula for atirada em um inimigo, irá colocá-lo num sono induzido profundo. Inimigos em sono induzido dormirão para sempre até que sejam perturbados.
items.stones.stoneofdetectmagic.name=cápsula de diagnóstico
items.stones.stoneofdetectmagic.inv_title=Detectar um item
items.stones.stoneofdetectmagic.detected_none=Você não detecta nenhuma alteração neste item.
items.stones.stoneofdetectmagic.detected_both=Você detecta alterações benéficas e corrupção neste item!
items.stones.stoneofdetectmagic.detected_good=Você detecta alterações benéficas neste item!
items.stones.stoneofdetectmagic.detected_bad=Você detecta corrupção neste item!
items.stones.stoneofdetectmagic.desc=Esta cápsula tática é capaz de detectar alterações num item. Usar esta cápsula em um item não identificado dirá se ele é afetado por uma corrupção maléfica e se ele é tem alterações benéficas, como uma modificação ou melhorias.
items.stones.stoneofdisarming.name=cápsula de desarme
items.stones.stoneofdisarming.desc=Esta cápsula tática emite um pulso que desabilita as armadilhas escondidas em volta. Desarmará até 9 armadilhas ao redor da área em que for lançada.
items.stones.stoneofenchantment.name=cápsula de modificação
items.stones.stoneofenchantment.inv_title=Modifique um item
items.stones.stoneofenchantment.weapon=Sua arma brilha na escuridão!
items.stones.stoneofenchantment.armor=Sua armadura brilha na escuridão!
items.stones.stoneofenchantment.desc=Esta cápsula tática contém poder de modificação. Ao contrário de um kit de modificação, não aumentará o poder direto de um item, em vez disso, imbuirá uma arma ou armadura com uma modificação, concedendo-lhes um novo poder.
items.stones.stoneoffear.name=cápsula de pânico
items.stones.stoneoffear.desc=Quando esta cápsula for atirada em um personagem, irá envolvê-lo com um terror avassalador, fazendo-o fugir de você. Atacar um inimigo em fuga irá encurtar o efeito.
items.stones.stoneofflock.name=cápsula de chamarizes
items.stones.stoneofflock.desc=Esta cápsula tática projeta ovelhas holográficas por um curto período de tempo em torno do local onde é lançada.
items.stones.stoneofintuition.name=cápsula de análise
items.stones.stoneofintuition.inv_title=Selecione um item
items.stones.stoneofintuition.desc=Esta cápsula tática contém uma versão mais fraca do programa dos cartuchos de identificação. Ao invés de identificar um item diretamente, ela irá trabalhar usando sua intuição, permitindo que você tente identificar o tipo de um cartucho, implante ou injetor por palpite.
items.stones.stoneofintuition.break_info=Você pode usar cápsulas de intuição duas vezes antes que elas quebrem. _Seu próximo uso não consumirá a cápsula_.
items.stones.stoneofintuition.break_warn=Você já usou a cápsula de intuição anteriormente, então _seu próximo uso irá consumi-la_.
items.stones.stoneofintuition$wndguess.text=Dê um palpite sobre que tipo o item não identificado é. Se você acertar corretamente, ele será identificado!
items.stones.stoneofintuition$wndguess.correct=Correto. O tipo de item foi identificado!
items.stones.stoneofintuition$wndguess.incorrect=Seu palpite está incorreto.
items.stones.stoneofintuition$wndguess.break=Sua cápsula de intuição se desintegra e vira pó...
items.stones.stoneofshock.name=cápsula de choque
items.stones.stoneofshock.desc=Esta cápsula tática desencadeia uma explosão de energia elétrica que atordoa brevemente todos os alvos próximos e concede carga às armas especiais do lançador para cada alvo atingido.
###trinkets
items.trinkets.chaoticcenser.name=incensário caótico
items.trinkets.chaoticcenser.spew=Seu incensário está prestes a liberar: %s.
items.trinkets.chaoticcenser.desc=Depois de algum tempo na bancada de síntese, este incensário parece estar produzindo fumaça sozinho! Os gases se acumulam e serão expelidos do incensário em direção aos inimigos em intervalos semi-aleatórios. Parece capaz de produzir todos os tipos de gases, mas você receberá um momento de aviso antes de o incensário ser ativado.
items.trinkets.chaoticcenser.typical_stats_desc=Normalmente, este acessório gerará um gás nocivo próximo a um inimigo a cada _%d_ turnos. O gás apenas aparece quando inimigos estão presentes. Em níveis mais altos, os gases têm mais probabilidade de serem exóticos e poderosos.
items.trinkets.chaoticcenser.stats_desc=No nível atual, este acessório gerará um gás nocivo próximo a um inimigo a cada _%d_ turnos. O gás apenas aparece quando inimigos estão presentes. Em níveis mais altos, os gases têm mais probabilidade de serem exóticos e poderosos.
items.trinkets.crackedspyglass.name=luneta trincada
items.trinkets.crackedspyglass.desc=Este telescópio de mão seria a demonstração de um formidável e preciso trabalho artesanal, não fosse sua lente frontal trincada. A luneta parece estar ajudando você, revelando novos itens nos setores, mas devido à sua falha, os itens revelados são bastante difíceis de enxergar!
items.trinkets.crackedspyglass.typical_stats_desc=Normalmente, este acessório tem uma _chance de %1$s%%_ de criar um item oculto extra em cada setor que não seja de chefe.
items.trinkets.crackedspyglass.stats_desc=No nível atual, este acessório tem uma _chance de %1$s%%_ de criar um item oculto extra em cada setor que não seja de chefe.
items.trinkets.crackedspyglass.stats_desc_upgraded=No nível atual, este acessório tem _100%%_ de chance de criar um item oculto extra em cada setor que não seja de chefe, e _%1$s%% de chance_ de criar um segundo item oculto extra.
items.trinkets.dimensionalsundial.name=relógio de sol dimensional
items.trinkets.dimensionalsundial.warning=Seu relógio de sol não está projetando sombra, você se sente apreensivo.
items.trinkets.dimensionalsundial.desc=Este pequeno relógio de sol de mão é de alguma forma capaz de projetar uma sombra nas profundezas do planeta, mesmo se você não o estiver segurando na posição vertical.  Ainda mais estranho é que a posição da sombra parece não ter relação com o sol deste mundo. Quando nenhuma sombra é projetada, o relógio de sol parece atrair o perigo.
items.trinkets.dimensionalsundial.typical_stats_desc=Normalmente, este acessório reduzirá a taxa de geração de inimigos em _%1$d%%_ durante o dia na vida real (8h-20h) e aumentará a taxa de geração de inimigos em _%2$d%%_ durante a noite (20h-8h).
items.trinkets.dimensionalsundial.stats_desc=No nível atual, este acessório reduzirá a taxa de geração de inimigos em _%1$d%%_ durante o dia na vida real (8h-20h) e aumentará a taxa de geração de inimigos em _%2$d%%_ durante a noite (20h-8h).
items.trinkets.exoticcrystals.name=cristais exóticos
items.trinkets.exoticcrystals.desc=Estes pequenos cristais rosa têm o mesmo formato dos cristais de energia de síntese. Embora eles não possam ser usados diretamente para obter energia, eles parecem estar influenciando de alguma forma os injetores e cartuchos que você encontra.
items.trinkets.exoticcrystals.typical_stats_desc=Normalmente, este acessório substituirá _%s%%_ dos injetores ou dos cartuchos dropados por seus equivalentes exóticos. Este efeito não afeta injetores de força, kits de modificação ou itens que são gerados para ajudar a resolver salas puzzles.
items.trinkets.exoticcrystals.stats_desc=No nível atual, este acessório substituirá _%s%%_ dos injetores ou dos cartuchos dropados por seus equivalentes exóticos. Este efeito não afeta injetores de força, kits de modificação ou itens que são gerados para ajudar a resolver salas puzzles.
items.trinkets.eyeofnewt.name=Olho de salamandra
items.trinkets.eyeofnewt.desc=Este olho de salamandra dourado e preto é um ingrediente comum, agora transformado em um acessório. O olho parece estar reduzindo a sua visão em troca de permitir que você veja as coisas de outras maneiras.
items.trinkets.eyeofnewt.typical_stats_desc=Normalmente, este acessório reduzirá seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental de inimigos dentro de _%2$d_ quadrados.
items.trinkets.eyeofnewt.stats_desc=No nível atual, este acessório reduzirá seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental de inimigos dentro de _%2$d_ quadrados.
items.trinkets.ferrettuft.name=tufo de furão
items.trinkets.ferrettuft.desc=Um tufo de pelo branco e sedoso de furão, preso por uma fita verde-limão amarrada em um laço. Os furões são conhecidos por sua agilidade, travessura e falta de integridade. Parte desse poder parece irradiar do acessório, aumentando a capacidade de evasão de qualquer coisa por perto.
items.trinkets.ferrettuft.typical_stats_desc=Normalmente, este acessório aumentará a evasão de todos os personagens em _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=No seu nível atual, este acessório aumentará a evasão de todos os personagens em _%1$s%%_.
items.trinkets.mimictooth.name=dente de mimetizador
items.trinkets.mimictooth.desc=Este dente grande e afiado deve ter sido arrancado de um mimetizador muito contrariado. Ele parece influenciar os mimetizadores do planeta, que ficam mais frequentes e perigosos.
items.trinkets.mimictooth.typical_stats_desc=Normalmente, este acessório deixa todos os tipos de mimetizador _%1$sx_ mais comuns e muito mais difíceis de detectar, mas também aumenta a quantidade de itens que eles deixam. Cada setor também terá _%2$s%%_ de chance de ter um mimetizador sombrio a mais.
items.trinkets.mimictooth.stats_desc=No nível atual, este acessório deixa todos os tipos de mimetizador _%1$sx_ mais comuns e muito mais difíceis de detectar, mas também aumenta a quantidade de itens que eles deixam. Cada setor também terá _%2$s%%_ de chance de ter um mimetizador sombrio a mais.
items.trinkets.mossyclump.name=moita de musgo
items.trinkets.mossyclump.desc=Este aglomerado de musgo úmido parece reter sua umidade, não importa o quão forte você o aperte. Parece estar ligado de algum jeito à flora do planeta, tornando mais provável o aparecimento de grama e água.
items.trinkets.mossyclump.typical_stats_desc=Normalmente, este acessório fará com que _%d%%_ dos setores comuns fiquem cheios de água ou grama.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.trinkets.mossyclump.stats_desc=No nível atual, este acessório fará com que _%d%%_ dos setores comuns fiquem cheios de água ou grama.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.trinkets.parchmentscrap.name=pedaço de papiro
items.trinkets.parchmentscrap.desc=Este pequeno pedaço de papiro parece ter saído de um cartucho. Ele ainda guarda um pedaço do programa e parece estar influenciando as armas e armaduras encontradas nos setores.
items.trinkets.parchmentscrap.typical_stats_desc=Normalmente, este acessório tornará modificações e revestimentos _%dx_ mais comuns e corrupções em armas e armaduras _%sx_ mais comuns. Corrupções em armas especiais, implantes ou módulos não são afetados.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.trinkets.parchmentscrap.stats_desc=No nível atual, este acessório tornará modificações e revestimentos _%dx_ mais comuns, e corrupções em armas e armaduras _%sx_ mais comuns. Corrupções em armas especiais, implantes ou módulos não são afetados.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.trinkets.petrifiedseed.name=semente petrificada
items.trinkets.petrifiedseed.desc=Esta semente foi fossilizada, seja por processos geológicos lentos ou seja pelo Laztro. A semente parece estar influenciando a flora do planeta, ocasionalmente substituindo sementes de plantas por cápsulas táticas.
items.trinkets.petrifiedseed.typical_stats_desc=Normalmente, este acessório fará com que a grama pisoteada solte cápsulas táticas em vez de sementes _%1$s%%_ das vezes, e também fará com que a grama alta solte itens com _%2$s%%_ mais frequência.
items.trinkets.petrifiedseed.stats_desc=No nível atual, este acessório fará com que a grama pisoteada solte cápsulas táticas em vez de sementes _%1$s%%_ das vezes, e também fará com que a grama alta solte itens com _%2$s%%_ mais frequência.
items.trinkets.ratskull.name=crânio de rato
items.trinkets.ratskull.desc=Este acessório macabro não é muito maior que o crânio de um rato normal, o que é de alguma forma uma raridade neste planeta. A caveira parece atrair os habitantes mais raros do planeta, fazendo-os aparecer com muito mais frequência.
items.trinkets.ratskull.typical_stats_desc=Normalmente, este acessório deixa os inimigos raros _%dx_ mais prováveis de aparecer. O crânio, porém, tem só metade do efeito sobre mimetizadores de Laztro e autômatos blindados.
items.trinkets.ratskull.stats_desc=No nível atual, este acessório deixa os inimigos raros _%dx_ mais prováveis de aparecer. O crânio, porém, tem só metade do efeito sobre mimetizadores de Laztro e autômatos blindados.
items.trinkets.saltcube.name=cubo de sal
items.trinkets.saltcube.desc=Este grande cristal de sal foi cortado em um formato de cubo quase perfeito, e de alguma forma conseguiu drenar metade da água da bancada de síntese em vez de dissolver. Parece estar desidratando e preservando a comida que você come, estendendo a saciedade que você obtém, mas também diminuindo sua regeneração de vida quando não está morrendo de fome.
items.trinkets.saltcube.typical_stats_desc=Normalmente, este acessório aumentará o tempo até que fique com fome em _%1$s%%_, mas também reduzirá sua taxa de regeneração de vida em _%2$s%%_, a não ser que o setor esteja trancado.
items.trinkets.saltcube.stats_desc=No nível atual, este acessório aumentará o tempo até que fique com fome em _%1$s%%_, mas também reduzirá sua taxa de regeneração de vida em _%2$s%%_, a não ser que o setor esteja trancado.
items.trinkets.shardofoblivion.name=fragmento do esquecimento
items.trinkets.shardofoblivion.desc=Depois de cozinhar na bancada de síntese, este pequeno fragmento de metal corrompido mudou para ser feito de... nada? A luz parece se curvar ao redor dele, e ele flutua estático no lugar quando você não o está segurando. O fragmento parece estar extraindo poder da sua ignorância, então provavelmente é melhor não pensar muito sobre isso.
items.trinkets.shardofoblivion.typical_stats_desc=Normalmente, este acessório aumentará a taxa que os inimigos dropam loot em 20%% para cada equipamento não identificado que você equipou ou usou recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que você identifique equipamentos, mas pode ser usado para identificar manualmente os itens que estão prontos para isso.
items.trinkets.shardofoblivion.stats_desc=No nível atual, este acessório aumentará a taxa que os inimigos dropam loot em 20%% para cada equipamento não identificado que você equipou ou usou recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que você identifique equipamentos, mas pode ser usado para identificar manualmente os itens que estão prontos para isso.
items.trinkets.shardofoblivion.ac_identify=IDENTIFICAR
items.trinkets.shardofoblivion.identify_prompt=Identificar um item
items.trinkets.shardofoblivion.identify_ready=Um item está pronto para ser identificado: %s. Use seu Fragmento do Esquecimento para identificá-lo.
items.trinkets.shardofoblivion.identify_ready_worn=Seus itens equipados estão prontos para serem identificados, use seu Fragmento do Esquecimento neles para identificá-los.
items.trinkets.shardofoblivion.identify_not_yet=Este item ainda não está pronto para ser identificado.
items.trinkets.shardofoblivion.identify=Você identifica o item!
items.trinkets.shardofoblivion$wandusetracker.name=Arma especial não identificada utilizada
items.trinkets.shardofoblivion$wandusetracker.desc=Você usou recentemente uma arma especial não identificada, que por um período de tempo conta como uma peça de equipamento não identificada usada para o fragmento do esquecimento.\n\nTurnos restantes: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Arma de arremesso não identificada usada
items.trinkets.shardofoblivion$thrownusetracker.desc=Você usou recentemente uma arma de arremesso não identificada, que conta, por um tempo, como uma peça de equipamento não identificado usada para o Fragmento do Esquecimento.\n\nTurnos restantes: %s.
items.trinkets.thirteenleafclover.name=Trevo de treze folhas
items.trinkets.thirteenleafclover.desc=De alguma forma, cozinhar na bancada de síntese fez com que este trevo crescesse um monte de folhas extras!  Não está muito claro se este acessório dá sorte ou azar, talvez torne sua sorte mais caótica?
items.trinkets.thirteenleafclover.typical_stats_desc=Normalmente, este acessório fará com que você cause dano máximo _%1$d%%_ do tempo e dano mínimo _%2$d%%_ do tempo.
items.trinkets.thirteenleafclover.stats_desc=No nível atual, este acessório fará com que você cause dano máximo _%1$d%%_ do tempo e dano mínimo _%2$d%%_ do tempo.
items.trinkets.trapmechanism.name=mecanismo de armadilha
items.trinkets.trapmechanism.desc=O mecanismo central de uma das armadilhas de queda dos setores, cuidadosamente escavado do chão para que possa ser carregado. Parece estar ligado de algum jeito aos próprios setores, tornando os terrenos perigosos mais comuns, mas também aumentando a sua afinidade com eles.
items.trinkets.trapmechanism.typical_stats_desc=Normalmente, este acessório fará com que _%1$d%%_ dos setores comuns fiquem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas dos setores estarão visíveis.
items.trinkets.trapmechanism.stats_desc=No nível atual, este acessório fará com que _%1$d%%_ dos setores comuns fiquem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas dos setores estarão visíveis.
items.trinkets.vialofblood.name=frasco de sangue
items.trinkets.vialofblood.desc=Este frasco fino contém o sangue de algum habitante do planeta, ele se move lentamente conforme você gira o frasco. Parece estar aumentando efeitos de cura mais fortes, mas também os retardando.
items.trinkets.vialofblood.typical_stats_desc=Normalmente, este acessório aumentará a vida geral que você ganha ao aplicar injetores de cura, kits de saúde ou estações médicas em _%1$s%%_. No entanto, esses efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (aumentando de acordo com o nível do herói).
items.trinkets.vialofblood.stats_desc=No nível atual, este acessório aumentará a saúde geral que você ganha ao aplicar injetores de cura, kits de saúde ou estações médicas em _%1$s%%_. No entanto, esses efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (a quantidade aumenta com o nível do herói).
items.trinkets.wondrousresin.name=resina maravilhosa
items.trinkets.wondrousresin.desc=Esta resina azul cintilante parece ter a essência destilada de uma arma especial corrompida. A bancada de síntese parece ter estabilizado essa essência e ela agora está afetando suas armas especiais.
items.trinkets.wondrousresin.typical_stats_desc=Normalmente, este acessório forçará os efeitos de arma especial corrompida a se tornarem neutros ou positivos _%1$s%%_ do tempo, e fará com que as armas especiais não corrompidas façam um disparo corrompido neutro ou positivo adicional _%2$s%%_ do tempo.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.trinkets.wondrousresin.stats_desc=No nível atual, este acessório forçará os efeitos de arma especial corrompida a se tornarem neutros ou positivos _%1$s%%_ do tempo, e fará com que as armas especiais não corrompidas façam um disparo corrompido neutro ou positivo adicional _%2$s%%_ do tempo.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.trinkets.trinketcatalyst.name=catalisador de acessórios
items.trinkets.trinketcatalyst.window_title=criar acessório
items.trinkets.trinketcatalyst.window_text=A água começa a brilhar conforme você adiciona o catalisador.  Existem alguns itens próximos que você pode imbuir com energia para transformá-los em um acessório.
items.trinkets.trinketcatalyst.desc=Esta bola de pó dourado e reativo brilha na escuridão dos setores.  Este catalisador pode ser usado numa bancada de síntese com um pouco de energia de síntese para produzir um acessório único.\n\nOs acessórios fornecem vários efeitos diferentes que alteram um pouco os setores ou seus habitantes. Os acessórios podem ser aprimorados com mais energia para tornar seus efeitos mais poderosos ou descartados para renunciar totalmente ao efeito.
items.trinkets.trinketcatalyst$randomtrinket.name=Acessório aleatório
items.trinkets.trinketcatalyst$randomtrinket.desc=Um item próximo está preso dentro de uma bolsa que você não consegue abrir.\n\nO processo de síntese dissolverá a bolsa, mas você não saberá qual acessório receberá até fazê-lo!
items.trinkets.trinket.discover_hint=Este item tem a chance de ser uma opção sempre que você criar um acessório por meio de síntese.
items.trinkets.trinket$placeholder.name=acessório
###wands
items.wands.cursedwand.ondeath=Você causou sua própria morte com %s.
