items.wands.cursedwand.mass_invuln=Uma luz brilhante irrompe de sua arma especial!
items.wands.cursedwand.petrify=Subitamente, você congela no lugar!
items.wands.cursedwand.grass=Grama cresce descontroladamente ao seu redor!
items.wands.cursedwand.fire=Você sente cheiro de queimado...
items.wands.cursedwand.transmogrify_wand=Sua arma especial foi metamorfoseada para um item diferente!
items.wands.cursedwand.transmogrify_other=Seu item metamorfoseia em algo diferente!
items.wands.cursedwand.disguise=Sua aparência muda diante de seus olhos!
items.wands.cursedwand.supernova=Uma esfera de energia incandescente começa a crescer. Talvez você queira correr!
items.wands.cursedwand.supernova_positive=Uma esfera de energia incandescente começa a crescer, mas de alguma forma parece segura.
items.wands.cursedwand.sinkhole=O chão começa a ceder em torno de você!
items.wands.cursedwand.sinkhole_positive=O chão começa a ceder, mas parece sólido o suficiente embaixo de você.
items.wands.cursedwand.gravity=A gravidade repentinamente começa a atuar em direções aleatórias!
items.wands.cursedwand.gravity_positive=A gravidade de repente começa a atuar em direções aleatórias, mas não parece afetar você.
items.wands.cursedwand.gravity_end=O caos gravitacional termina.
items.wands.damagewand.upgrade_stat_name_1=Dano de energia
items.wands.wand.ac_zap=ATIRAR
items.wands.wand.fizzles=Sua arma especial chiou; ela não deve ter cargas suficiente.
items.wands.wand.no_magic=Sua arma especial chiou; você não pode usar armas especiais enquanto está imune a energia.
items.wands.wand.self_target=Você não consegue mirar em si mesmo!
items.wands.wand.identify=Agora você está familiarizado o suficiente com sua arma especial para identificá-la.
items.wands.wand.resin_one=Esta arma especial ganhou _1 nível_ através da resina condutora.
items.wands.wand.resin_many=Esta arma especial ganhou _%d níveis_ através da resina condutora.
items.wands.wand.cursed=Esta arma especial está corrompida, fazendo seus disparos saírem caóticos e aleatórios.
items.wands.wand.not_cursed=Esta arma especial está livre de corrupção.
items.wands.wand.curse_discover=Este item %s está corrompido!
items.wands.wand.prompt=Escolha uma direção para atirar
items.wands.wand$placeholder.name=arma especial
items.wands.wandofblastwave.name=emissor de impacto
items.wands.wandofblastwave.staff_name=transmissor com emissor de impacto
items.wands.wandofblastwave.ondeath=Você se matou com o seu próprio emissor de impacto...
items.wands.wandofblastwave.knockback_ondeath=A colisão matou você...
items.wands.wandofblastwave.desc=Um emissor de ondas de impacto, usado para abrir caminho entre destroços. Ele pesa na mão e dá um coice forte.
items.wands.wandofblastwave.typical_stats_desc=Esta arma especial atira um raio que detona violentamente ao chegar ao destino. A força desta explosão normalmente inflige _%1$d-%2$d de dano_ e é poderosa o suficiente para lançar a maioria dos inimigos voando.
items.wands.wandofblastwave.stats_desc=Esta arma especial atira um raio que detona violentamente ao chegar ao destino. A força desta explosão inflige _%1$d-%2$d de dano_ e é poderosa o suficiente para mandar a maioria dos inimigos voando para trás.
items.wands.wandofblastwave.upgrade_stat_name_2=Empurrão
items.wands.wandofblastwave.bmage_desc=Quando _o Intendente_ atinge um inimigo paralisado com um cajado de onda de choque, ele consome a paralisia para causar uma explosão de dano mágico adicional. Tem um curto tempo de recarga por inimigo.
items.wands.wandofblastwave.eleblast_desc=Uma explosão elementar com o cajado de onda de choque causa 67% de dano e arremessa todos os inimigos para fora da área de explosão.
items.wands.wandofcorrosion.name=projetor ácido
items.wands.wandofcorrosion.staff_name=transmissor com projetor ácido
items.wands.wandofcorrosion.desc=Um projetor de ácido industrial, feito para cortar cascos de naves abandonadas. O tanque laranja borbulha quando você o sacode.
items.wands.wandofcorrosion.stats_desc=Esta arma especial dispara uma rajada que explode em uma nuvem de gás altamente corrosivo no local escolhido. Qualquer coisa dentro desta nuvem sofrerá dano crescente ao longo do tempo, começando em _%d de dano_
items.wands.wandofcorrosion.upgrade_stat_name_1=Dano de corrosão
items.wands.wandofcorrosion.upgrade_stat_name_2=Volume de gás
items.wands.wandofcorrosion.bmage_desc=Quando _o Intendente_ atinge um inimigo com um cajado da corrosão, o inimigo tem chance de ser encoberto com muco corrosivo.
items.wands.wandofcorrosion.eleblast_desc=Uma explosão elementar com um cajado da corrosão afeta os inimigos com 4 turnos de corrosão, iniciando em 6 de dano.
items.wands.wandofcorruption.name=emissor de controle neural
items.wands.wandofcorruption.staff_name=transmissor com emissor de controle neural
items.wands.wandofcorruption.already_corrupted=O personagem não pode ser mais influenciado.
items.wands.wandofcorruption.desc=Um protótipo confiscado da Garra Turva. Ele emite pulsos que embaralham o sistema nervoso e, com o tempo, colocam o alvo sob o seu comando.
items.wands.wandofcorruption.stats_desc=Esta arma especial dispara pulsos neurais que enfraquecem os inimigos e, com o tempo, os colocam sob o seu controle. Os inimigos resistem, mas os feridos cedem muito mais rápido do que os saudáveis.
items.wands.wandofcorruption.upgrade_stat_name_1=Poder de controle
items.wands.wandofcorruption.upgrade_stat_name_2=Duração do debuff
items.wands.wandofcorruption.bmage_desc=Quando _o Intendente_ atinge um inimigo com um cajado da corrupção, o inimigo tem chance de entrar em estado de cólera.
items.wands.wandofcorruption.eleblast_desc=Uma explosão elementar com o cajado de corrupção afeta os inimigos com 5 turnos de cólera.
items.wands.wandofdisintegration.name=canhão de partículas
items.wands.wandofdisintegration.staff_name=transmissor com canhão de partículas
items.wands.wandofdisintegration.desc=Um canhão de partículas pesado, arrancado de uma torre de defesa da Vigília-7. Uma luz roxa corre pelo cano, esperando o disparo.
items.wands.wandofdisintegration.stats_desc=Esta arma especial atira um raio que atravessa qualquer obstáculo, e irá mais longe cada vez que for aprimorada. O raio inflige _%1$d-%2$d  de dano,_ e também infligirá dano extra para cada inimigo e parede que penetrar.
items.wands.wandofdisintegration.upgrade_stat_name_2=Alcance máx
items.wands.wandofdisintegration.bmage_desc=Quando empunhado pelo _Intendente_, um cajado da desintegração tem distância de ataque aumentada, como se tivesse a modificação projetante.
items.wands.wandofdisintegration.eleblast_desc=Uma explosão elementar com o cajado de desintegração causa 100% de dano e atravessa paredes.
items.wands.wandoffireblast.name=lança-chamas
items.wands.wandoffireblast.staff_name=transmissor com lança-chamas
items.wands.wandoffireblast.desc=Um lança-chamas compacto da equipe de controle de danos, feito para limpar ninhos do enxame nos dutos. A chama-piloto azul nunca apaga.
items.wands.wandoffireblast.stats_desc=Esta arma especial produz uma labareda em formato de cone. Seu próximo ataque irá consumir _%1$d de sua carga_ e irá causar _%2$d-%3$d de dano._ Quanto mais cargas a arma especial usar, maior e mais forte será o efeito.
items.wands.wandoffireblast.upgrade_stat_name_1=Dano de 1 carga
items.wands.wandoffireblast.upgrade_stat_name_2=Dano de 2 cargas
items.wands.wandoffireblast.upgrade_stat_name_3=Dano de 3 cargas
items.wands.wandoffireblast.bmage_desc=Quando o _Intendente_ atinge um inimigo com um cajado de rajada de fogo, há uma chance dele produzir uma explosão que causa dano aos inimigos e consome todo o fogo nas proximidades! Essa chance aumenta quanto mais fogo estiver adjacente ao inimigo.
items.wands.wandoffireblast.eleblast_desc=Uma explosão elementar com o cajado de rajada de fogo causa 100% de dano, arromba portas e ateia fogo em inimigos e terrenos.
items.wands.wandoffrost.name=projetor criogênico
items.wands.wandoffrost.staff_name=transmissor com projetor criogênico
items.wands.wandoffrost.desc=Um projetor de nitrogênio líquido usado na manutenção dos reatores. O cano vive coberto de gelo, mas a empunhadura isolada mantém sua mão quente.
items.wands.wandoffrost.stats_desc=Esta arma especial atira rajadas de energia gelada em direção aos seus inimigos, causando _%1$d-%2$d de dano_ e os resfriando. Esse efeito é mais forte na água. Inimigos que já estão gelados ou congelados levam menos dano desta arma especial.
items.wands.wandoffrost.upgrade_stat_name_2=Duração de resfriamento
items.wands.wandoffrost.bmage_desc=Quando _o Intendente_ atinge um inimigo gelado com um cajado da geada, ele tem uma chance de instantaneamente congelar. Essa chance é maior quanto mais gelado o inimigo estiver.
items.wands.wandoffrost.eleblast_desc=Uma explosão elementar com o cajado da geada causa 100% de dano, congela inimigos, e apaga incêndios.
items.wands.wandoflightning.name=bobina de arco
items.wands.wandoflightning.staff_name=transmissor com bobina de arco
items.wands.wandoflightning.ondeath=Você se matou com a sua própria bobina de arco...
items.wands.wandoflightning.desc=Duas bobinas de cobre presas a uma bateria pesada. Um arco elétrico estala entre as pontas, pronto para saltar de alvo em alvo.
items.wands.wandoflightning.stats_desc=Esta arma especial dispara arcos elétricos na direção escolhida, causando _%1$d-%2$d de dano._ A descarga pode pular para outros inimigos próximos e se espalha mais fácil na água. Você pode ser atingido pelo arco, mas seus aliados não.
items.wands.wandoflightning.bmage_desc=Quando _o Intendente_ atinge um inimigo com um cajado de relâmpago, ele tem a chance de se carregar eletricamente por 10 turnos. Enquanto estiver carregado, o Intendente é imune a danos elétricos e os arcos de eletricidade irão ainda mais longe.
items.wands.wandoflightning.eleblast_desc=Uma explosão elementar com o cajado de relâmpago causa 100% de dano, atordoa inimigos por 5 turnos e deixa a água eletrificada.
items.wands.wandoflightning$lightningcharge.name=Eletricamente carregado
items.wands.wandoflightning$lightningcharge.desc=O Intendente está atualmente carregado de energia, o que lhe concede imunidade ao seu cajado de relâmpagos e aumenta o alcance do arco de eletricidade.\n\nTurnos Restantes: %s.
items.wands.wandoflivingearth.name=projetor de nanorrobôs
items.wands.wandoflivingearth.staff_name=transmissor com projetor de nanorrobôs
items.wands.wandoflivingearth.desc=Um projetor de nanorrobôs de construção. Os robôs se juntam em volta de você como blindagem e, com material suficiente, montam um guardião.
items.wands.wandoflivingearth.stats_desc=Esta arma especial dispara nuvens de nanorrobôs nos inimigos, causando _%1$d-%2$d de dano._ Os robôs voltam e cobrem você, dando armadura proporcional ao dano causado. Com armadura suficiente, no próximo disparo eles se juntam em um guardião.
items.wands.wandoflivingearth.upgrade_stat_name_2=PV Máx. do Guardião
items.wands.wandoflivingearth.upgrade_stat_name_3=Bloqueio do guardião
items.wands.wandoflivingearth.bmage_desc=Quando _o Intendente_ atinge um inimigo com um cajado da terra viva, parte do dano é retornado como armadura de pedra.
items.wands.wandoflivingearth.eleblast_desc=Uma explosão elementar com o cajado de terra viva causa 50% de dano, e cura o guardião de terra para cada inimigo atingido.
items.wands.wandoflivingearth$rockarmor.name=blindagem de nanorrobôs
items.wands.wandoflivingearth$rockarmor.desc=Nanorrobôs estão cobrindo seu corpo. Quando você for atacado, eles vão tentar defender você e irão reduzir o dano causado a você em 50%%. No entanto, cada dano bloqueado destrói alguns robôs.\n\nArmadura restante: %1$d.\n\nSe nanorrobôs suficientes se juntarem em volta de você, o próximo disparo do seu projetor de nanorrobôs fará com que eles formem um guardião que irá lutar junto a você.\n\nArmadura necessária para o Guardião: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=O guardião de terra também está se beneficiando do Poder de Muitos. Turnos restantes: %d.
items.wands.wandoflivingearth$earthguardian.name=guardião de nanorrobôs
items.wands.wandoflivingearth$earthguardian.desc=Os nanorrobôs do seu projetor se juntaram em um guardião! Ele ataca os inimigos próximos e os obriga a lutar com ele em vez de você. Quando não houver mais ameaças por perto, ele se desfaz e volta a cobrir você como blindagem.
items.wands.wandoflivingearth$earthguardian.wand_info=O poder defensivo do guardião está vinculado ao nível da sua arma especial. Atualmente, ele bloqueia _%1$d-%2$d de dano._
items.wands.wandoflivingearth$earthguardian.discover_hint=Você pode encontrar este personagem com uma arma especial específica.
items.wands.wandofmagicmissile.name=pistola de plasma
items.wands.wandofmagicmissile.staff_name=transmissor com pistola de plasma
items.wands.wandofmagicmissile.desc=A pistola de plasma padrão da Vigília-7: leve, confiável e sem efeito especial. Ela tem mais cargas que as outras armas especiais e, quando aprimorada, sobrecarrega por pouco tempo as outras armas especiais que você carrega.
items.wands.wandofmagicmissile.stats_desc=Cada raio desta arma especial causa de _%1$d-%2$d danos,_ e se for aprimorada, dará um breve poder as outras armas especiais.
items.wands.wandofmagicmissile.bmage_desc=Quando _o Intendente_ atinge um inimigo com o cajado de míssil mágico, todas as suas armas especiais irão ganhar cargas além do seu cajado.
items.wands.wandofmagicmissile.eleblast_desc=Uma explosão elementar com o cajado de míssil mágico causa 50% de dano e concede 15 turnos de recarga.
items.wands.wandofmagicmissile.discover_hint=Um dos heróis inicia com este item.
items.wands.wandofmagicmissile$magiccharge.name=sobrecarga
items.wands.wandofmagicmissile$magiccharge.desc=Sua pistola de plasma sobrecarregou suas armas especiais, aumentando o nível efetivo do próximo disparo de cada uma.\n\nNível das armas especiais: +%d.\n\nTurnos de sobrecarga restantes: %s.
items.wands.wandofprismaticlight.name=emissor prismático
items.wands.wandofprismaticlight.staff_name=transmissor com emissor prismático
items.wands.wandofprismaticlight.desc=Um emissor de sinalização com lente de cristal. O feixe colorido corta a escuridão dos setores e ofusca quem estiver na frente.
items.wands.wandofprismaticlight.stats_desc=Esta arma especial dispara feixes de luz que cortam a escuridão dos setores, revelando áreas escondidas e armadilhas. O feixe pode cegar inimigos e causa _%1$d-%2$d de dano._ Criaturas do enxame e assimilados sofrem dano extra com a luz.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Chance de cegar
items.wands.wandofprismaticlight.upgrade_stat_name_3=Duração de luz
items.wands.wandofprismaticlight.bmage_desc=Quando _o Intendente_ atinge um inimigo com um cajado da luz prismática, ele será aleijado por uma duração que aumenta de acordo com o nível do cajado.
items.wands.wandofprismaticlight.eleblast_desc=Um disparo elementar com o cajado de luz prismática causa 67% de dano, revela todo o terreno por onde o disparo passa e cega inimigos por 5 turnos.
items.wands.wandofregrowth.name=dispersor de esporos
items.wands.wandofregrowth.staff_name=transmissor com dispersor de esporos
items.wands.wandofregrowth.desc=Um dispersor agrícola da estufa da Vigília-7, ainda cheio de esporos vivos. Onde a nuvem cai, a vegetação brota em segundos.
items.wands.wandofregrowth.stats_desc=Esta arma especial lança uma nuvem de esporos em forma de cone, que faz brotar grama, raízes e plantas raras. O próximo disparo vai consumir _%1$d cargas_. Quanto mais cargas consumir, maior a área coberta e mais forte o efeito.
items.wands.wandofregrowth.degradation=Depois de _%d cargas_ esta arma especial começa a falhar em produzir plantas e grama. Esse limite aumenta quando você sobe de nível ou aprimora a arma.
items.wands.wandofregrowth.upgrade_stat_name_1=Grama por carga
items.wands.wandofregrowth.upgrade_stat_name_2=Limite de grama total
items.wands.wandofregrowth.bmage_desc=Quando _o Intendente_ atinge o inimigo com um cajado da maturação, e também estando em cima da grama, ele ganha cura herbácea em proporção ao dano dado.
items.wands.wandofregrowth.eleblast_desc=Uma explosão elementar com o cajado da maturação enraíza inimigos e cresce grama aleatoriamente na área da explosão.
items.wands.wandofregrowth$dewcatcher.name=Coletora de biomassa
items.wands.wandofregrowth$dewcatcher.desc=Plantas alienígenas que se enchem de biomassa. Elas se disfarçam de grama para não chamar atenção, mas os bulbos cheios de biomassa as entregam.
items.wands.wandofregrowth$dewcatcher.discover_hint=Você pode encontrar esta planta com uma arma especial específica.
items.wands.wandofregrowth$seedpod.name=Vagem de Sementes
items.wands.wandofregrowth$seedpod.desc=Vagens alienígenas que produzem sementes de outras plantas em vez das próprias.
items.wands.wandofregrowth$seedpod.discover_hint=Você pode encontrar esta planta com uma arma especial específica.
items.wands.wandofregrowth$lotus.name=Lótus dourado
items.wands.wandofregrowth$lotus.desc=A lótus dourada é uma planta mística que só pode ser conjurada por uma poderosa dispersor de esporos. Sua aura melhora todas as plantas e os efeitos delas, mas queima sua energia e morre após um curto período de tempo.
items.wands.wandofregrowth$lotus.wand_info=Esta lótus foi produzida por um dispersor de esporos _+%1$d_. Todas as plantas em seu efeito _desencadearão instantaneamente_ se forem plantadas sob um personagem. As plantas também terão _%2$d%%de chance_ de dropar suas sementes, e os dardos embebidos usarão _%3$d%% menos durabilidade_.
items.wands.wandofregrowth$lotus.discover_hint=Você pode encontrar esta planta com uma arma especial específica, após aprimorá-la diversas vezes.
items.wands.wandoftransfusion.name=projetor de nanomédicos
items.wands.wandoftransfusion.staff_name=transmissor com projetor de nanomédicos
items.wands.wandoftransfusion.ondeath=Você se matou com o seu próprio projetor de nanomédicos...
items.wands.wandoftransfusion.charged=O seu cajado está carregado com energia vital de seu inimigo!
items.wands.wandoftransfusion.desc=Um projetor médico que transfere nanomédicos do seu sangue para outra pessoa. A cápsula magenta na ponta brilha quando está cheia.
items.wands.wandoftransfusion.stats_desc=Quando usada em aliados ou inimigos fascinados, esta arma especial irá drenar _%1$d da vida do usuário_ para curar ou dar um escudo ao aliado em _%2$d de vida._ Quando usada em inimigos, esta arma especial os fascina brevemente e concede _%3$d de escudo_ ao usuário. Assimilados hostis irão receber _%4$d-%5$d de dano_ ao invés de serem fascinados.
items.wands.wandoftransfusion.upgrade_stat_name_1=Cura a aliados
items.wands.wandoftransfusion.upgrade_stat_name_2=Auto-Blindagem
items.wands.wandoftransfusion.upgrade_stat_name_3=Dano a assimilados
items.wands.wandoftransfusion.bmage_desc=Quando _o Intendente_ atinge um inimigo fascinado com um cajado de transfusão, ele ganha escudo e seu próximo disparo com o cajado não irá custar vida.
items.wands.wandoftransfusion.eleblast_desc=Uma explosão elementar com o cajado de transfusão fascina inimigos, cura aliados, e causa 100% de dano em inimigos mortos-vivos.
items.wands.wandofwarding.name=lançador de torretas
items.wands.wandofwarding.staff_name=transmissor com lançador de torretas
items.wands.wandofwarding.no_more_wards=Seu lançador não suporta mais torretas.
items.wands.wandofwarding.bad_location=Você não pode colocar uma torreta aí.
items.wands.wandofwarding.desc=Um lançador de torretas automáticas de defesa. Cada disparo crava uma torreta no ponto escolhido.
items.wands.wandofwarding.stats_desc=Em vez de causar danos diretos a um inimigo, esta arma especial irá invocar torretas e sentinelas estacionários. As torretas podem ser invocadas em qualquer lugar, mesmo através de paredes, se você tiver visão. Esta arma especial pode suportar energia equivalente a _ %d torretas de cada vez._
items.wands.wandofwarding.upgrade_stat_name_1=Dano da torreta
items.wands.wandofwarding.upgrade_stat_name_2=Energia da torreta
items.wands.wandofwarding.bmage_desc=Quando _o Intendente_ atinge um inimigo com um cajado da proteção, todas as torretas e sentinelas ativas têm uma chance de serem curadas.
items.wands.wandofwarding.eleblast_desc=Uma explosão elementar com o cajado de proteção cura todas as torretas e sentinelas na área da explosão.
items.wands.wandofwarding$ward.desc_generic_ward=Esta torreta irá automaticamente disparar em qualquer inimigo que entre em seu alcance de visão.\n\nDisparar nesta torreta com seu lançador de torretas irá aprimorá-la.\n\nAs torretas têm um número limitado de disparos antes de se desligarem.
items.wands.wandofwarding$ward.desc_generic_sentry=Esta sentinela tem o mesmo poder de fogo de uma torreta, mas tem vida em vez de um determinado número de cargas.\n\nAtirar nesta sentinela com seu lançador de torretas irá aprimorá-la e curá-la.\n\nEsta sentinela gastará um pouco de vida cada vez que atingir um inimigo, mas pode ser curada usando sua arma especial de proteção nela.
items.wands.wandofwarding$ward.name_1=torreta leve
items.wands.wandofwarding$ward.desc_1=Esta torreta básica irá automaticamente atacar qualquer inimigo que entre em seu alcance de visão, causando _%1$d-%2$d danos._\n\nAtirar nesta torreta com sua arma especial fará com que ela seja melhorada.\n\nEsta torreta só fará um único disparo antes de se desligar.\n\nSeu lançador de torretas está usando _%3$d de energia_ para manter esta torreta.
items.wands.wandofwarding$ward.name_2=torreta
items.wands.wandofwarding$ward.desc_2=Esta torreta melhorada tem um padrão mais complexo, podendo atacar várias vezes. Cada tiro desta torreta irá causar _%1$d-%2$d de dano._\n\nAtirar nesta torreta com sua arma especial fará com que ela seja melhorada.\n\nEsta torreta fará três disparos antes de se desligar.\n\nSeu lançador de torretas está usando _%3$d de energia_ para manter esta torreta.
items.wands.wandofwarding$ward.name_3=torreta pesada
items.wands.wandofwarding$ward.desc_3=Esta torreta totalmente aprimorada é capaz de atacar mais vezes do que suas antecessoras. Cada disparo desta torreta irá causar _%1$d-%2$d de dano._\n\nAtirar nesta torreta com sua arma especial fará com que ela seja melhorada.\n\nEsta torreta fará cinco disparos antes de se desligar.\n\nSeu lançador de torretas está usando _%3$d de energia_ para manter esta torreta.
items.wands.wandofwarding$ward.name_4=sentinela leve
items.wands.wandofwarding$ward.desc_4=Esta sentinela menor tem o mesmo poder de fogo de uma torreta superior, mas possui vida ao invés de um número definido de cargas. Cada disparo desta sentinela irá causar _%1$d-%2$d de dano._\n\nAtirar nesta sentinela com sua arma especial de proteção irá aprimorá-la e curá-la.\n\nEsta sentinela irá gastar um pouco de vida a cada vez que atirar em um inimigo, mas pode ser curada usando sua arma especial de proteção nela.\n\nSua arma especial de proteção está utilizando _%3$d de energia_ para sustentar esta sentinela.
items.wands.wandofwarding$ward.name_5=sentinela
items.wands.wandofwarding$ward.desc_5=Esta sentinela melhorada é maior e mais durável do que uma sentinela menor. Cada disparo desta sentinela irá causar _%1$d-%2$d de dano._\n\nAtirar nesta sentinela com sua arma especial fará com que ela seja curada e melhorada.\n\nEsta sentinela gastará um pouco de vida cada vez que fizer um disparo num inimigo, mas pode ser curada usando sua arma especial.\n\nSeu lançador de torretas está usando _%3$d de energia_ para manter esta sentinela.
items.wands.wandofwarding$ward.name_6=sentinela pesada
items.wands.wandofwarding$ward.desc_6=Esta sentinela totalmente atualizada é significativamente mais durável do que suas antecessoras. Cada disparo desta sentinela irá causar _%1$d-%2$d de dano._\n\nAtirar nesta sentinela com sua arma especial fará com que ela seja curada.\n\nEsta sentinela gastará um pouco de vida cada vez que atirar em um inimigo, mas pode ser curada usando sua arma especial.\n\nSeu lançador de torretas está usando _%3$d de energia_ para manter esta sentinela.
items.wands.wandofwarding$ward.discover_hint=Você pode encontrar este personagem com uma arma especial específica.
items.wands.wandofwarding$ward.dismiss_title=Desligar esta torreta?
items.wands.wandofwarding$ward.dismiss_body=Você pode desligar esta torreta se não quiser mais mantê-la. Ela será destruída na hora.\n\nDesligar esta torreta?
items.wands.wandofwarding$ward.dismiss_confirm=sim
items.wands.wandofwarding$ward.dismiss_cancel=não
###weapon curses
items.weapon.curses.annoying.name=%s irritante
items.weapon.curses.annoying.msg_1=OOH, ESTAMOS LUTANDO COM ALGO!?
items.weapon.curses.annoying.msg_2=ISSO, PEGA ELES!
items.weapon.curses.annoying.msg_3=EI, ESCUTA!
items.weapon.curses.annoying.msg_4=JÁ CHEGAMOS NO CHEFÃO?!
items.weapon.curses.annoying.msg_5=AI, NÃO ME BALANÇA TÃO FORTE!
items.weapon.curses.annoying.msg_6=MORRA, INSETO!
items.weapon.curses.annoying.msg_7=IUPIIIIIIIIIIIIII!
items.weapon.curses.annoying.msg_8=A GENTE PODE DESCANSAR!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.msg_10=ESSE FOI CERTEIRO!
items.weapon.curses.annoying.msg_11=Eu não queria ser uma arma, queria ser um machado de um lenhador.
items.weapon.curses.annoying.msg_12=Lembre-se, o excesso de confiança é um assassino lento e insidioso.
items.weapon.curses.annoying.msg_13=VOCÊ É UM COCÔ E NÓS VAMOS MATAR VOCÊ!
items.weapon.curses.annoying.desc=Armas irritantes são capazes de falar, mas são empolgadas até demais. Elas frequentemente atrairão atenção indesejada até você, mesmo que sem a intenção.
items.weapon.curses.annoying.elestrike_desc=Um ataque elementar com uma corrupção irritante tem 20% de chance de encolerizar todos os inimigos no alcance por 6 turnos.
items.weapon.curses.dazzling.name=%s ofuscante
items.weapon.curses.dazzling.desc=Armas ofuscantes às vezes emitirão clarões de luz ofuscantes, cegando tudo o que pode vê-las.
items.weapon.curses.dazzling.elestrike_desc=Um ataque elementar com uma corrupção ofuscante tem 50% de chance de cegar todos os inimigos no alcance por 6 turnos.
items.weapon.curses.displacing.name=%s de deslocamento
items.weapon.curses.displacing.desc=Armas de deslocamento são infundidas com um teletransporte caótico, possuindo a habilidade de mudar os inimigos de lugar pelo setor aleatoriamente.
items.weapon.curses.displacing.elestrike_desc=Um ataque elementar com uma corrupção de deslocamento tem 50% de chance de teleportar todos os inimigos no alcance.
items.weapon.curses.explosive.name=%s de explosão
items.weapon.curses.explosive.warm=Morno...
items.weapon.curses.explosive.hot=Quente!
items.weapon.curses.explosive.desc=Armas explosivas acumulam poder constantemente e explodem, causando dano a tudo que esteja por perto.
items.weapon.curses.explosive.desc_cool=Sua arma está fria ao toque.
items.weapon.curses.explosive.desc_warm=Sua arma está acumulando energia e esquentando...
items.weapon.curses.explosive.desc_hot=Sua arma está quente! Está prestes a explodir!
items.weapon.curses.explosive.elestrike_desc=Um ataque elementar com uma corrupção de explosão tem 50% de chance de causar uma explosão em um inimigo aleatório no alcance.
items.weapon.curses.friendly.name=%s amigável
items.weapon.curses.friendly.desc=Armas amigáveis são mais adequadas para pacifistas, ocasionalmente soltando um feromônio que torna impossível lutar.
items.weapon.curses.friendly.elestrike_desc=Um ataque elementar com uma corrupção amigável tem 50% de chance de fascinar todos os inimigos no alcance por 6 turnos.
items.weapon.curses.polarized.name=%s polarizante
items.weapon.curses.polarized.desc=Uma arma polarizada tem uma falha de energia que faz com que seu ataque cause 50% a mais de dano ou que não cause dano algum.
items.weapon.curses.polarized.elestrike_desc=Um ataque elementar com uma corrupção polarizante tem 50% de chance de causar 24-36 de dano a todos os inimigos no alcance.
items.weapon.curses.pressurized.name=%s pressurizante
items.weapon.curses.pressurized.desc=Armas pressurizadas são capazes de disparar um jato de água poderoso, como um gêiser, que empurra tudo para longe, inclusive você.
items.weapon.curses.pressurized.elestrike_desc=Um ataque elementar com uma corrupção pressurizante vai criar uma onda de água que destrói terreno e empurra todos os inimigos no alcance para longe.
items.weapon.curses.sacrificial.name=%s sacrificante
items.weapon.curses.sacrificial.desc=Armas sacrificantes exigirão sangue do usuário em troca de atacar inimigos. Quanto mais saudável o usuário for, mais sangue a corrupção tomará.
items.weapon.curses.sacrificial.elestrike_desc=Um ataque elementar com uma corrupção sacrificante causa sangramento de 12 PV ao herói e a todos os inimigos no alcance.
items.weapon.curses.wayward.name=%s inconstante
items.weapon.curses.wayward.desc=Armas inconstantes às vezes se tornam extremamente imprecisas. Essa falha dura por um tempo quando ativada, mas pode ser dissipada acertando um golpe com a arma inconstante.
items.weapon.curses.wayward.elestrike_desc=Um ataque elementar com uma corrupção inconstante tem 50% de chance de desorientar todos os inimigos no alcance por 6 turnos.
items.weapon.curses.wayward$waywardbuff.name=inconstante
items.weapon.curses.wayward$waywardbuff.desc=A falha da sua arma inconstante foi ativada, tornando-a extremamente imprecisa por um curto período de tempo. Observe que isso não afeta os ataques que são garantidos, como ataques surpresa. Atacar com sucesso com a arma inconstante eliminará esse efeito imediatamente.\n\nTurnos restantes: %s.
items.weapon.curses.wondrous.name=%s mirabolante
items.weapon.curses.wondrous.desc=Armas mirabolantes contêm a mesma energia caótica encontrada em armas especiais corrompidas. É impossível prever o que acontecerá quando esta corrupção for ativada!
items.weapon.curses.wondrous.elestrike_desc=Um ataque elementar com uma corrupção mirabolante tem a chance de aplicar um efeito de arma especial corrompida diferente para cada inimigo no alcance.
###enchantments
items.weapon.enchantments.blazing.name=%s flamejante
items.weapon.enchantments.blazing.desc=Esta modificação faz com que saiam chamas de uma arma, incendiando inimigos e causando dano adicional aos que já estão em chamas.
items.weapon.enchantments.blazing.elestrike_desc=Um ataque elementar com uma modificação flamejante espalha fogo em todo os espaços no alcance, dura 8 turnos.
items.weapon.enchantments.blocking.name=%s bloqueante
items.weapon.enchantments.blocking.desc=Armas bloqueantes têm a chance de protegê-lo brevemente após atacar com elas.
items.weapon.enchantments.blocking.elestrike_desc=Um ataque elementar com uma modificação bloqueante garante o Renegado 6 de escudo extra para cada inimigo no alcance.
items.weapon.enchantments.blocking$blockbuff.name=proteção
items.weapon.enchantments.blocking$blockbuff.desc=A modificação bloqueante da sua arma concedeu a você um breve impulso ao seu poder defensivo!\n\nProteção restante: %d\n\nTurnos restantes: %s.
items.weapon.enchantments.blooming.name=%s florescente
items.weapon.enchantments.blooming.desc=Armas florescentes contêm esporos que farão com que a vegetação brote sobre ou em torno daqueles atingidos por elas.
items.weapon.enchantments.blooming.elestrike_desc=Um ataque elementar com uma modificação florescente espalha grama alta em 8 espaços no alcance e enraíza todos os inimigos no alcance por 6 turnos.
items.weapon.enchantments.chilling.name=%s congelante
items.weapon.enchantments.chilling.desc=Inimigos atingidos com esta modificação são resfriados, diminuindo seus movimentos e ataques.
items.weapon.enchantments.chilling.elestrike_desc=Um ataque elementar com uma modificação congelante espalha ar frio em todos os espaços no alcance, dura 8 turnos.
items.weapon.enchantments.crystal.name=%s de cristal
items.weapon.enchantments.crystal.alert_fixed=Sua arma de cristal está totalmente reparada!
items.weapon.enchantments.crystal.alert_fixed_ghost=A arma de cristal do Sgt. Brandt está totalmente reparada!
items.weapon.enchantments.crystal.alert_noflaw=Sua arma de cristal não tem mais falhas.
items.weapon.enchantments.crystal.alert_noflaw_ghost=A arma de cristal do Sgt. Brandt não tem mais falhas.
items.weapon.enchantments.crystal.alert_nocrack=Sua arma de cristal não está mais rachada.
items.weapon.enchantments.crystal.alert_nocrack_ghost=A arma de cristal do Sgt. Brandt não está mais rachada.
items.weapon.enchantments.crystal.alert_flawed=Sua arma de cristal ficou um pouco danificada.
items.weapon.enchantments.crystal.alert_flawed_ghost=A arma de cristal do Sgt. Brandt ficou um pouco danificada.
items.weapon.enchantments.crystal.alert_cracked=Sua arma de cristal rachou, está prestes a quebrar!
items.weapon.enchantments.crystal.alert_cracked_ghost=A arma de cristal do Sgt. Brandt rachou, está prestes a quebrar!
items.weapon.enchantments.crystal.alert_shattered=Sua arma de cristal se estilhaça!
items.weapon.enchantments.crystal.alert_shattered_ghost= A arma de cristal do Sgt. Brandt se estilhaça!
items.weapon.enchantments.crystal.desc=Esta modificação poderosa causa dano de energia adicional e aumenta o valor da arma. No entanto, a arma modificada pode se estilhaçar se os cristais não forem reparados ou se não tiverem tempo para se autorreparar.
items.weapon.enchantments.crystal.desc_thrown=Armas de arremesso de cristal têm muito menos durabilidade, mas se recuperam lentamente com o tempo.
items.weapon.enchantments.crystal.desc_perfect=Esta arma de cristal está atualmente em perfeitas condições.
items.weapon.enchantments.crystal.desc_fine=Esta arma de cristal está atualmente em boas condições.
items.weapon.enchantments.crystal.desc_flawed=Esta arma de cristal tem falhas, mas não está prestes a quebrar.
items.weapon.enchantments.crystal.desc_cracked=Esta arma de cristal está rachando, corre o risco de quebrar permanentemente!
items.weapon.enchantments.crystal.elestrike_desc=Um ataque elementar com uma arma de cristal causa 10-20 de dano e repara a arma para cada inimigo no alcance, exceto o alvo primário.
items.weapon.enchantments.kinetic.name=%s inercial
items.weapon.enchantments.kinetic.desc=Quando um inimigo é morto por uma arma com modificação inercial, qualquer dano em excesso é conservado na arma e será aplicado ao próximo ataque bem-sucedido.
items.weapon.enchantments.kinetic.elestrike_desc=Um ataque elementar com uma modificação inercial aplica 40% do dano conservado a cada inimigo no alcance, exceto ao alvo primário.
items.weapon.enchantments.kinetic$conserveddamage.name=dano conservado
items.weapon.enchantments.kinetic$conserveddamage.desc=Sua arma armazenou o excesso de força de um golpe fatal anterior e o aplicará como dano adicional ao seu próximo ataque. No entanto, a energia irá diminuir lentamente ao longo do tempo.\n\nDano Conservado: %d.
items.weapon.enchantments.corrupting.name=%s de controle neural
items.weapon.enchantments.corrupting.desc=Esta modificação poderosa consegue dobrar os inimigos à sua vontade. Quando um inimigo morre por esta arma, há uma chance de ele ficar sob controle neural em vez de morrer.
items.weapon.enchantments.corrupting.elestrike_desc=Um ataque elementar com uma modificação de corrupção possui 5-25% de chance (baseado no PV perdido) de corromper inimigos no alcance, exceto o alvo primário.
items.weapon.enchantments.eldritch.name=%s eldritch
items.weapon.enchantments.eldritch.desc=Armas eldritch incutem medo aos inimigos próximos que testemunham seus ataques, fazendo com que fujam do atacante.
items.weapon.enchantments.eldritch.elestrike_desc=Um ataque elementar com a modificação eldritch aplica medo prolongado para cada inimigo no alcance, incluindo o alvo primário.
items.weapon.enchantments.elastic.name= %s de elasticidade
items.weapon.enchantments.elastic.desc=Armas elásticas têm a chance de lançar inimigos para trás por curtas distâncias.
items.weapon.enchantments.elastic.elestrike_desc=Um ataque elementar com uma modificação de elasticidade arremessa todos os inimigos no alcance 5 espaços para longe.
items.weapon.enchantments.grim.name=%s mortal
items.weapon.enchantments.grim.desc=Esta poderosa modificação possui o poder de instantaneamente executar um inimigo. O efeito é mais comum de ocorrer quanto mais fraco o inimigo estiver.
items.weapon.enchantments.grim.elestrike_desc=Um ataque elementar com uma modificação mortal possui 6-30% de chance (baseado no PV perdido) de executar todos os inimigos no alcance, exceto o alvo primário.
items.weapon.enchantments.lucky.name=%s da sorte
items.weapon.enchantments.lucky.desc=Inimigos que são mortos por uma arma da sorte têm a chance de soltar itens extras.
items.weapon.enchantments.lucky.elestrike_desc=Um ataque elementar com uma modificação da sorte tem 12,5% de chance de gerar itens sob todos os inimigos no alcance. Esse efeito é ativado apenas uma vez por inimigo.
items.weapon.enchantments.projecting.name=%s projetante
items.weapon.enchantments.projecting.desc=Com esta modificação, armas de combate corpo a corpo ganharão alcance extra. Armas de longo alcance penetrarão paredes quando miradas em alvos próximos.
items.weapon.enchantments.projecting.elestrike_desc=Um ataque elementar com uma modificação projetante aplica 30% de dano a todos os inimigo no alcance, exceto ao alvo primário.
items.weapon.enchantments.shocking.name=%s chocante
items.weapon.enchantments.shocking.desc=Arcos de eletricidade de uma arma chocante, causando dano extra a todos os inimigos próximos.
items.weapon.enchantments.shocking.elestrike_desc=Um ataque elementar com uma modificação chocante espalha eletricidade em todos os espaços no alcance, dura 8 turnos.
items.weapon.enchantments.unstable.name=%s instável
items.weapon.enchantments.unstable.desc=Esta modificação irradia energia caótica, ativando uma modificação diferente a cada golpe.
items.weapon.enchantments.unstable.elestrike_desc=Um ataque elementar com uma modificação instável aplica um efeito de modificação aleatória a todos os inimigos no alcance, exceto ao alvo primário.
items.weapon.enchantments.vampiric.name=%s do vampirismo
items.weapon.enchantments.vampiric.desc=Esta poderosa modificação drena a força vital dos inimigos a cada golpe, canalizando-a de volta para o usuário. O efeito é mais forte quanto menor a vida atual do usuário.
items.weapon.enchantments.vampiric.elestrike_desc=Um ataque elementar com uma modificação de vampirismo cura o Renegado em 2,5 PV para cada inimigo no alcance.
items.weapon.enchantments.venomous.name=%s pestilente
items.weapon.enchantments.venomous.desc=Armas pestilentes infligem um veneno de efeito retardado, porém letal, que se torna mais severo a cada aplicação.
items.weapon.enchantments.venomous.elestrike_desc=Um ataque elementar com a modificação pestilente aplica efeito venenoso retardado adicional para todo inimigo no alcance, exceto o alvo primário.
items.weapon.enchantments.vorpal.name=%s vorpal
items.weapon.enchantments.vorpal.desc=Armas vorpal são especialmente letais, elas têm a chance de desferir um golpe tão preciso que infligem sangramento, em vez de dano comum, a inimigos suscetíveis a essa condição.
items.weapon.enchantments.vorpal.elestrike_desc=Um ataque elementar com uma modificação vorpal aplica sangramento adicional a cada inimigo no alcance, exceto ao alvo primário.
###melee weapons
items.weapon.melee.assassinsblade.name=lâmina monomolecular
items.weapon.melee.assassinsblade.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.weapon.melee.assassinsblade.ability_name=furtivo
items.weapon.melee.assassinsblade.typical_ability_desc=O Renegado pode entrar em modo _furtivo_ enquanto empunha uma lâmina assassina. Esta habilidade permite que o Renegado lampeje instantaneamente até 3 espaços de distância e normalmente concede a ela _%d turnos de invisibilidade._
items.weapon.melee.assassinsblade.ability_desc=O Renegado pode entrar em modo _furtivo_ enquanto empunha uma lâmina assassina. Esta habilidade permite que o Renegado lampeje instantaneamente até 3 espaços de distância e concede a ela _%d turnos de invisibilidade._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Duração de habilidade
items.weapon.melee.assassinsblade.desc=Uma lâmina curta e finíssima. É difícil de usar apesar de leve, mas letal quando acerta o ponto certo.
items.weapon.melee.battleaxe.name=machado de demolição
items.weapon.melee.battleaxe.stats_desc=Está é uma arma precisa.
items.weapon.melee.battleaxe.ability_name=Golpe pesado
items.weapon.melee.battleaxe.typical_ability_desc=O Renegado pode realizar um _golpe pesado_ com um machado de batalha. Esse ataque concentrado normalmente causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.weapon.melee.battleaxe.ability_desc=O Renegado pode realizar um _golpe pesado_ com um machado de batalha. Esse ataque concentrado causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.weapon.melee.battleaxe.desc=A cabeça enorme deste machado de demolição põe muito peso em cada golpe largo.
items.weapon.melee.crossbow.name=lançador de arpão
items.weapon.melee.crossbow.typical_stats_desc=Normalmente, esta arma aumenta a potência dos dardos arremessados para causar _%1$d-%2$d de dano_ quando equipada, e até mesmo concede sua modificação a eles.
items.weapon.melee.crossbow.stats_desc=Esta arma aumenta a potência dos dardos arremessados para causar _%1$d-%2$d de dano_ quando equipada, e ainda concede sua modificação a eles.
items.weapon.melee.crossbow.ability_name=tiro carregado
items.weapon.melee.crossbow.typical_ability_desc=O Renegado pode _carregar_ sua besta, fazendo com que seu próximo ataque regular sempre acerte e aplique um dos três efeitos: ataques corpo a corpo lançarão os inimigos para trás, dardos não embebidos normalmente causarão _+%1$d de dano_ e dardos embebidos aplicarão seus efeitos em um formato 7x7 de área e normalmente duram por _mais %2$d usos_.
items.weapon.melee.crossbow.ability_desc=O Renegado pode _carregar_ sua besta, fazendo com que seu próximo ataque regular sempre acerte e aplique um dos três efeitos: ataques corpo a corpo lançarão inimigos para trás, dardos não embebidos causarão _+%1$d de dano_ e dardos embebidos aplicarão seu efeito em uma área de 7x7 e durarão por _mais %2$d usos _.
items.weapon.melee.crossbow.desc=Um lançador compacto que dispara dardos em velocidade excepcional. Não foi feito para isso, mas o peso e a construção robusta o tornam uma boa arma corpo a corpo também.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Impulso de habilidade
items.weapon.melee.crossbow$chargedshot.name=Carregado
items.weapon.melee.crossbow$chargedshot.desc=O Renegado está concentrando poder em sua besta. O próximo ataque que ela fizer sempre acertará e aplicará um dos três efeitos:\n- Ataques corpo a corpo lançarão os inimigos a alguns espaços de distância. \n- Dardos não embebidos causarão dano adicional.\n- Dardos embebidos ganharão usos extras e aplicarão seus efeitos em uma área 7x7. Os efeitos positivos dos dardos afetarão apenas aliados e efeitos prejudiciais só afetarão inimigos. O Renegado não pode usar esta habilidade para aplicar efeitos positivos de dardos a si mesma.
items.weapon.melee.cudgel.name=chave de torque
items.weapon.melee.cudgel.stats_desc=Esta é uma arma precisa.
items.weapon.melee.cudgel.ability_name=Golpe pesado
items.weapon.melee.cudgel.typical_ability_desc=O Renegado pode realizar um _golpe pesado_ com uma maça. Esse ataque concentrado normalmente causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.weapon.melee.cudgel.ability_desc=O Renegado pode realizar um _golpe pesado_ com uma maça. Esse ataque concentrado causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.weapon.melee.cudgel.desc=Uma chave de torque pesada da equipe de manutenção. Não foi feita para lutar, mas resolve.
items.weapon.melee.cudgel.discover_hint=Um dos heróis inicia com este item.
items.weapon.melee.dagger.name=faca de combate
items.weapon.melee.dagger.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.weapon.melee.dagger.ability_name=furtivo
items.weapon.melee.dagger.typical_ability_desc=O Renegado pode entrar em modo _furtivo_ enquanto empunha uma adaga. Esta habilidade permite que o Renegado lampeje instantaneamente até 5 espaços de distância e normalmente concede a ela _%d turnos de invisibilidade._
items.weapon.melee.dagger.ability_desc=O Renegado pode entrar em modo _furtivo_ enquanto empunha uma adaga. Esta habilidade permite que o Renegado lampeje instantaneamente até 5 espaços de distância e concede a ela _%d turnos de invisibilidade._
items.weapon.melee.dagger.upgrade_ability_stat_name=Duração de habilidade
items.weapon.melee.dagger.desc=Uma faca de combate padrão da Brigada, com o cabo gasto de tanto uso.
items.weapon.melee.dagger.discover_hint=Um dos heróis inicia com este item.
items.weapon.melee.dirk.name=faca de abordagem
items.weapon.melee.dirk.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.weapon.melee.dirk.ability_name=furtivo
items.weapon.melee.dirk.typical_ability_desc=O Renegado pode entrar em modo _furtivo_ enquanto empunha um punhal. Esta habilidade permite que o Renegado lampeje instantaneamente até 4 espaços de distância e normalmente concede a ela _%d turnos de invisibilidade._
items.weapon.melee.dirk.ability_desc=O Renegado pode entrar em modo _furtivo_ enquanto empunha um punhal. Esta habilidade permite que o Renegado lampeje instantaneamente até 4 espaços de distância e concede a ela _%d turnos de invisibilidade._
items.weapon.melee.dirk.upgrade_ability_stat_name=Duração de habilidade
items.weapon.melee.dirk.desc=Uma faca de lâmina mais longa, pensada para estocar através das juntas de uma armadura.
items.weapon.melee.flail.name=corrente de amarração
items.weapon.melee.flail.stats_desc=Esta é uma arma pouco precisa. Ataques surpresas não podem ser efetuados com ela.
items.weapon.melee.flail.ability_name=Girar
items.weapon.melee.flail.spin_warn=Você não pode mais girar o mangual.
items.weapon.melee.flail.typical_ability_desc=O Renegado pode _girar_ um mangual para aumentar o seu poder por um curto período de tempo. Cada vez que o mangual for girado, normalmente causará _+%d de dano_, no seu próximo ataque regular, até um máximo de 3 vezes. Girar o mangual também garante o acerto. Apenas para começar a girar o mangual é que custará uma carga.
items.weapon.melee.flail.ability_desc=O Renegado pode _girar_ um mangual para aumentar o seu poder por um curto período de tempo. Cada vez que o mangual for girado, causará _+%d de dano_, no seu próximo ataque regular, até um máximo de 3 vezes. Girar o mangual também garante o acerto. Apenas para começar a girar o mangual é que custará uma carga.
items.weapon.melee.flail.desc=Uma corrente de amarração da carga com uma trava pesada na ponta. Muito desajeitada, mas devastadora quando acerta em cheio.
items.weapon.melee.flail$spinabilitytracker.name=Girando
items.weapon.melee.flail$spinabilitytracker.desc=O Renegado está girando seu mangual, acumulando dano para seu próximo ataque regular com ele.  Cada giro leva um turno e aumenta o dano, até um máximo de três giros. O mangual também tem garantia de acertar enquanto gira.\n\nGiro atual: %1$d%%.\nTurnos restantes: %2$s.
items.weapon.melee.gauntlet.name=punho de exoesqueleto
items.weapon.melee.gauntlet.stats_desc=Esta é uma arma muito rápida.
items.weapon.melee.gauntlet.ability_name=combinação de ataques
items.weapon.melee.gauntlet.typical_ability_desc=O Renegado pode executar uma _combinação de ataques_ com uma manopla de pedra. Este ataque tem garantia de acerto e normalmente causa _+%d de dano_ para cada vez que o Renegado tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos (15 depois de uma morte) reinicia este combo.
items.weapon.melee.gauntlet.ability_desc=O Renegado pode executar uma _combinação de ataques_ com uma manopla de pedra. Este ataque tem garantia de acerto e causa _+%d de dano_ para cada vez que o Renegado tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos (15 depois de uma morte) reinicia este combo.
items.weapon.melee.gauntlet.desc=Um punho arrancado de um exoesqueleto de carga e adaptado ao braço. Movê-lo exige força, mas cada golpe sai com uma força tremenda.
items.weapon.melee.glaive.name=lança-serra
items.weapon.melee.glaive.stats_desc=Esta arma é lenta.\nEsta arma tem alcance estendido.
items.weapon.melee.glaive.ability_name=Espetar
items.weapon.melee.glaive.typical_ability_desc=O Renegado pode usar a ponta de uma gládio para _espetar_ um inimigo que esteja dentro do alcance, mas não adjacente. Isso normalmente causa _%1$d-%2$d de dano_, empurra o inimigo para trás e garante o acerto.
items.weapon.melee.glaive.ability_desc=O Renegado pode usar a ponta de uma gládio para _espetar_ um inimigo que esteja dentro do alcance, mas não adjacente. Isso causa _%1$d-%2$d de dano_, empurra o inimigo para trás e garante o acerto.
items.weapon.melee.glaive.desc=Uma haste longa com uma serra de corte na ponta. Alcança longe e corta fundo.
items.weapon.melee.gloves.name=luvas de impacto
items.weapon.melee.gloves.stats_desc=Esta é uma arma muito rápida.
items.weapon.melee.gloves.ability_name=combinação de ataques
items.weapon.melee.gloves.typical_ability_desc=O Renegado pode realizar uma _combinação de ataques_ com luvas cravejadas. Este ataque tem garantia de acerto e normalmente causa _+%d de dano_ para cada vez que o Renegado tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5  turnos (15 após uma morte) reinicia este combo.
items.weapon.melee.gloves.ability_desc=O Renegado pode realizar uma _combinação de ataques_ com luvas cravejadas. Este ataque tem garantia de acerto e causa _+%d de dano_ para cada vez que o Renegado tiver acertado com um ataque corpo a corpo regular ou com uma arma de arremesso. Não acertar nada em 5 turnos (15 após uma morte) reinicia este combo.
items.weapon.melee.gloves.desc=Luvas táticas com placas de impacto nos nós dos dedos. Não protegem de verdade, mas servem como arma e deixam as mãos livres.
items.weapon.melee.gloves.discover_hint=Um dos heróis inicia com este item.
items.weapon.melee.greataxe.name=machado de corte
items.weapon.melee.greataxe.stats_desc=Esta arma é incrivelmente pesada.
items.weapon.melee.greataxe.ability_name=Retribuição
items.weapon.melee.greataxe.typical_ability_desc=O Renegado pode realizar um ataque de _retribuição_ com um machado grande se estiver com menos de 50%% de vida. Este ataque devastador tem acerto garantido e normalmente causa _%1$d-%2$d de dano_ e é instantâneo se matar o inimigo.
