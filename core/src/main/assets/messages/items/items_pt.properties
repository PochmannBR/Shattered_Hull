items.energycrystal.desc=Uma coleção de pequenos cristais de Laztro, cheios de energia de síntese.\n\nEstes cristais são os ingredientes mais comuns em receitas de síntese e podem ser produzidos numa bancada de síntese reciclando itens consumíveis.
items.gold.name=Laztro
items.gold.desc=Fragmentos de Laztro, a matéria programável que só existe a bordo das naves de guerra. Os fabricadores da Vigília-7 transformam LZ em munição, remédios e peças. Os piratas também querem.
