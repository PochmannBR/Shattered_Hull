items.artifacts.talismanofforesight.levelup=Seu sensor ficou mais forte!
items.artifacts.talismanofforesight.full_charge=Seu sensor está totalmente carregado!
items.artifacts.talismanofforesight.desc=Um sensor de movimento de capacete, ligado ao traje. Ele avisa quando há armadilhas ou passagens escondidas por perto e, carregado, faz uma varredura da área.
items.artifacts.talismanofforesight.desc_worn=Com o sensor ligado, você sente como se seus sentidos estivessem mais aguçados. O sensor está lentamente acumulando cargas à medida que o tempo passa e quando você descobre portas ou armadilhas escondidas.\n\nO sensor pode gastar sua carga para 'revelar' em forma de cone, fazendo com que todos os azulejos e segredos na área analisada sejam expostos. Também lhe concederá visão dos inimigos e itens por um curto período de tempo.
items.artifacts.talismanofforesight.desc_cursed=O sensor corrompido emite um chiado constante, enfraquecendo os seus sentidos.
