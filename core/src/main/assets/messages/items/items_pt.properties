items.armor.armor$glyph.rankings_desc=Morto por um revestimento
items.armor.armor$glyph.discover_hint=Você pode encontrar um item com este efeito aleatoriamente durante a missão ou tentar aplicá-lo a um item você mesmo.
items.armor.classarmor.ac_ability=ESCOLHA A HABILIDADE
items.armor.classarmor.ac_transfer=TRANSFERIR
