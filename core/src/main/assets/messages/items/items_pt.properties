items.kingscrown.name=Insígnia do Comodoro
items.kingscrown.ac_wear=VESTIR
items.kingscrown.naked=A insígnia precisa de uma armadura para se acoplar.
items.kingscrown.upgraded=A insígnia brilha forte e se desfaz enquanto a sua armadura se transforma!
items.kingscrown.ratgraded=As patas do Rei Rato brilham enquanto sua armadura se transforma!
items.kingscrown.desc=A insígnia de comando do Comodoro Varga, com um circuito que a rainha alterou para ele.\n\nAcoplada à armadura que você veste, ela a transforma numa _armadura única, com habilidades especiais._ A nova armadura mantém todas as propriedades da original.
items.kingscrown.discover_hint=Você pode obter este item como um saque de certos inimigos.
items.liquidmetal.name=metal líquido
items.liquidmetal.ac_apply=APLICAR
items.liquidmetal.prompt=Selecione uma arma de arremesso
items.liquidmetal.already_fixed=Esta arma de arremesso já está em perfeitas condições!
items.liquidmetal.apply=Você utiliza %d metal líquido para reparar sua arma de arremesso.
items.liquidmetal.desc=Este metal líquido pode preencher rachaduras e trincados em uma arma de arremesso, restaurando-a à condição perfeita! Se um conjunto de armas estiver com armas a menos, mas totalmente reparado, o metal líquido pode até ser usado para substituir uma arma faltante do conjunto!\n\nUma arma de tier 1 requer 10 de metal líquido para ser totalmente reparada, uma arma de tier 5 requer 30. Cada aprimoramento também aumenta a quantidade de metal necessária em 35%.\n\nO metal líquido não pode ser usado para reparar as pontas de dardos embebidos.
items.liquidmetal.discover_hint=Você pode fabricar este item através de síntese.
items.lostbackpack.name=mochila perdida
items.lostbackpack.desc=Este é o seu inventário perdido. Colete-o para recuperar todos os itens que você perdeu!
items.merchantsbeacon.name=transmissor do mercante
items.merchantsbeacon.ac_use=USAR
items.merchantsbeacon.desc=Esta velha peça de tecnologia permite a você se comunicar a grandes distancias.\n\nAo ser ativado, esse farol irá permitir que você venda itens para a loja do sucateiro em qualquer setor.\n\nPorém a bateria do transmissor só dura uma sessão, então use sabiamente.
items.stylus.name=aplicador de revestimento
items.stylus.ac_inscribe=GRAVAR
items.stylus.prompt=Escolha uma armadura
items.stylus.identify=Primeiro você deve identificar se essa armadura está corrompida.
items.stylus.cursed=O aplicador não funciona em armaduras corrompidas.
items.stylus.inscribed=Você inscreveu a sua armadura com o aplicador de revestimento.
items.stylus.desc=Um gravador de precisão da Brigada, com ponta de Laztro. Com ele você grava um revestimento no circuito da sua armadura, mas não tem como escolher qual. O gravador decide sozinho.
items.tengusmask.name=chip de comando da capitã
items.tengusmask.ac_wear=INSTALAR
items.tengusmask.used=O chip se integra ao seu traje e libera novos protocolos de combate!
items.tengusmask.desc=O chip de comando que a Capitã Rasha Kell carregava no implante neural. Ele guarda protocolos de combate que a Brigada nunca liberou para soldados comuns.\n\nInstalado no seu traje, ele permite _escolher uma especialização para o seu herói._\n\nQual especialização você vai escolher?
items.tengusmask.discover_hint=Você pode obter este item como um saque de certos inimigos.
items.torch.name=tocha
items.torch.ac_light=ACENDER
items.torch.desc=Item básico de qualquer combatente: quando o setor fica escuro, uma tocha química ajuda a mostrar o caminho.
items.waterskin.name=kit de saúde
items.waterskin.ac_drink=USAR
items.waterskin.collected=Você guarda a biomassa no kit de saúde.
items.waterskin.full=Seu kit de saúde está cheio!
items.waterskin.empty=Seu kit de saúde está vazio!
items.waterskin.desc=O kit de saúde padrão da Brigada Orbital. Ele processa biomassa recolhida no caminho e a converte em gel de regeneração.
items.waterskin.desc_water=No momento o kit de saúde está vazio. Andar pelo crescimento violeta do enxame solta biomassa que ele pode processar.
items.waterskin.desc_heal=O kit de saúde está guardando gel de regeneração. Quanto mais cheio ele estiver, mais vida você recupera na hora ao usá-lo. Ele só aplica o quanto você precisa.
items.waterskin.desc_full=O kit de saúde cheio parece irradiar energia. Talvez ele consiga reforçar outro item de sobrevivência?
items.waterskin.discover_hint=Um dos heróis inicia com este item.
