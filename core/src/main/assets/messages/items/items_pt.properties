items.artifacts.skeletonkey.discard=Você descarta os cartões em excesso.
items.artifacts.skeletonkey.levelup=Seu cartão mestre cresce em força!
items.artifacts.skeletonkey.desc=Um cartão mestre de oficial, com um chip que reescreve a própria credencial. O código muda cada vez que você olha para ele.
items.artifacts.skeletonkey.desc_worn=Este cartão mestre parece ganhar poder conforme você a usa em vez de usar os cartões comuns da nave. Ela pode ser inserida em quase todas as fechaduras dos setores para abri-las ou fechá-las, incluindo portas que nunca foram trancadas antes.\n\nO cartão pode até ser usada em um espaço vazio em uma direção cardinal ou diagonal para "trancar" o ar à sua frente, criando uma parede sólida de 3 quadrados de largura que dura 10 turnos. Travar o ar repelirá os inimigos se houver espaço para isso.
items.artifacts.skeletonkey.desc_cursed=O cartão corrompido parece estar deliberadamente evitando entrar em qualquer fechadura, e até mesmo dificultando (mas não impossibilitando) o uso de suas outros cartões.
items.artifacts.skeletonkey$keywall.desc=Uma barreira de força temporária foi colocada aqui pelo cartão mestre.
items.artifacts.talismanofforesight.name=sensor de movimento
