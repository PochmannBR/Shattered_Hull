items.kindofweapon.which_equip_msg=Em qual slot de arma você gostaria de equipar este item?\n\nO Híbrido ataca diretamente com sua arma primária, mas pode usar a habilidade de qualquer uma das armas. Ambas as armas compartilham a mesma contagem de carga.\n\nO Híbrido também pode trocar sua arma primária e secundária instantaneamente.
