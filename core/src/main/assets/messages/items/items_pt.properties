items.bags.bag.discover_hint=Você pode comprar este item em uma loja.
items.bags.potionbandolier.name=bandoleira de injetores
items.bags.potionbandolier.desc=Esta bandoleira grossa se encaixa em torno de seu peito como um cinto, ela tem várias tiras isoladas para armazenar injetores de injetor, seu kit de saúde de água ou injetores de metal líquido.\n\nEnquanto estiverem dentro da bandoleira, seus injetores estarão protegidas do frio.
items.bags.scrollholder.name=canudo de cartuchos
items.bags.scrollholder.desc=Um estojo tubular de campanha, feito para guardar cartuchos de dados. Os compartimentos laterais também comportam dispositivos, aplicadores de revestimento e resina condutora.\n\nO estojo não parece inflamável, então seus cartuchos ficam protegidos do fogo dentro dele.
items.bags.velvetpouch.name=bolsa de veludo
items.bags.velvetpouch.desc=Esta pequena bolsa de veludo pode armazenar muitos itens pequenos, como sementes, cápsulas táticas e alguns ingredientes de síntese.
items.bags.velvetpouch.discover_hint=Um dos heróis inicia com este item.
items.bags.magicalholster.name=coldre magnético
items.bags.magicalholster.desc=Este coldre fino é feito de couro sintético e tem travas magnéticas que permitem armazenar uma grande quantidade de armas de longo alcance.\n\nVocê pode simplesmente colocar a mão no coldre e sempre pegar o item que estava procurando.\n\nGraças às travas e aos contatos de carga do coldre, as armas especiais carregam um pouco mais rápido e as armas de longo alcance duram um pouco mais dentro dele.
###bombs
items.bombs.arcanebomb.name=bomba de pulso
items.bombs.arcanebomb.desc=Esta bomba recebeu um núcleo de pulso de energia. Ela irá detonar em uma explosão poderosa semelhante ao ataque carregado da Matriz do Enxame, causando _%1$d-%2$d de dano de energia_ a qualquer coisa dentro de 2 quadrados.
items.bombs.arcanebomb.discover_hint=Você pode fabricar este item através de síntese.
items.bombs.bomb.name=bomba
items.bombs.bomb.ac_lightthrow=ACENDER & JOGAR
items.bombs.bomb.snuff_fuse=Você rapidamente apaga o pavio da bomba.
items.bombs.bomb.ondeath=A explosão matou você...
items.bombs.bomb.rankings_desc=Morto por uma explosão
items.bombs.bomb.desc=Uma bomba de pólvora preta bem pesada. Uma explosão desta bomba causa _%1$d-%2$d de dano_ a qualquer coisa adjacente a ela e irá destruir itens ou terrenos adjacentes.
items.bombs.bomb.desc_fuse=Parece que o fusível levará algumas rodadas para queimar quando estiver aceso.
items.bombs.bomb.desc_burning=O fusível da bomba está queimando, mantenha distância ou apague-o!
items.bombs.bomb$doublebomb.name=duas bombas
items.bombs.bomb$doublebomb.desc=Um par de bombas pretas e pesadas. Parece que você vai ganhar uma de graça!
items.bombs.firebomb.name=bomba de fogo
items.bombs.firebomb.desc=Esta bomba foi modificada para explodir em uma área extensa, causando _%1$d-%2$d de dano_ e espalhando chamas de longa duração em 2 blocos.
items.bombs.firebomb.discover_hint=Você pode fabricar este item através de síntese.
items.bombs.flashbangbomb.name=bomba de luz
items.bombs.flashbangbomb.desc=Esta bomba personalizada irá irromper em um clarão de luz, som e eletricidade quando explodir. Qualquer coisa dentro de 2 quadrados receberá _%1$d-%2$d de dano_ da explosão, um dano adicional de 25%% da eletricidade e ficará atordoado por 10 turnos.
items.bombs.flashbangbomb.discover_hint=Você pode fabricar este item através de síntese.
items.bombs.frostbomb.name=bomba de gelo
items.bombs.frostbomb.desc=Esta bomba foi modificada para explodir em uma área extensa, causando _%1$d-%2$d de dano_ e espalhando uma rajada de ar congelante de longa duração dentro de 2 quadrados ao seu redor.
items.bombs.frostbomb.discover_hint=Você pode fabricar este item através de síntese.
items.bombs.holybomb.name=bomba ultravioleta
items.bombs.holybomb.desc=Esta bomba foi modificada para produzir um clarão ultravioleta numa área maior quando explode. Qualquer coisa dentro de 2 quadrados receberá _%1$d-%2$d de dano_ da explosão, e assimilados e criaturas da colmeia receberão 50%% de dano adicional da luz ultravioleta.
items.bombs.holybomb.discover_hint=Você pode fabricar este item através de síntese.
items.bombs.noisemaker.name=barulhenta
items.bombs.noisemaker.desc=Esta bomba personalizada emitirá ruídos repetidamente quando o fusível queimar. Quando algo tocar na bomba, ela explodirá e causará _%1$d-%2$d de dano_ a qualquer coisa dentro de 2 quadrados!
items.bombs.noisemaker.desc_burning=A barulhenta está fazendo tic-toc. Ela vai explodir quando algo se aproximar!
items.bombs.noisemaker.discover_hint=Você pode fabricar este item através de síntese.
items.bombs.smokebomb.name=Bomba de fumaça
items.bombs.smokebomb.desc=Esta bomba foi modificada para expelir uma espessa nuvem de gás ao mesmo tempo em que explode. Ela causará _%1$d-%2$d de dano_ e espalhará névoa dentro de 2 quadrados.
items.bombs.smokebomb.discover_hint=Você pode fabricar este item através de síntese.
items.bombs.regrowthbomb.name=bomba de maturação
items.bombs.regrowthbomb.desc=Esta bomba personalizada irá espalhar líquido que dá vida a tudo dentro de 3 quadrados ao invés de explodir. A área atingida pelo impacto rapidamente brotará grama e plantas. Você e quaisquer aliados pegos na zona de impacto serão curados, como se tivessem tomado um injetor de cura.
items.bombs.regrowthbomb.discover_hint=Você pode fabricar este item através de síntese.
items.bombs.shrapnelbomb.name=bomba de estilhaços
items.bombs.shrapnelbomb.desc=Esta bomba foi modificada com restos de metal da perfuratriz da Garra Turva, que se fragmentarão e voarão para todos os lados quando explodirem, causando _%1$d-%2$d de dano_ em uma área muito extensa ao redor da bomba. É melhor se abrigar atrás de algo ao usá-la...
items.bombs.shrapnelbomb.discover_hint=Você pode fabricar este item através de síntese.
items.bombs.woollybomb.name=bomb-á-á
items.bombs.woollybomb.desc=Esta bomba personalizada criará um extenso rebanho de ovelhas holográficas após explodir. A explosão causará _%1$d-%2$d de dano_ a qualquer coisa dentro de 2 quadrados. As ovelhas bloquearão o movimento e persistirão por muito tempo! Porém, as ovelhas não durarão muito na presença de inimigos poderosos. Podem ser dissipadas manualmente mais cedo interagindo-se com elas.
items.bombs.woollybomb.discover_hint=Você pode fabricar este item através de síntese.
###food
items.food.berry.name=baga alienígena
items.food.berry.eat_msg=A baga estava saborosa!
items.food.berry.desc=Uma pequena baga que cresce entre a vegetação alienígena. Pode ser comida rápido, sacia um pouco e pode conter uma semente utilizável!
items.food.berry.discover_hint=Você pode encontrar este item usando um talento de herói específico.
items.food.blandfruit.name=fruta alienígena
items.food.blandfruit.cooked=fruta alienígena cozida
items.food.blandfruit.sunfruit=fruta-solar
items.food.blandfruit.rotfruit=podre-fruta
items.food.blandfruit.earthfruit=fruta-terra
items.food.blandfruit.blindfruit=fruta-cegante
items.food.blandfruit.firefruit=fruta-fogo
items.food.blandfruit.icefruit=fruta-gelo
items.food.blandfruit.fadefruit=fruta-fantasma
items.food.blandfruit.sorrowfruit=sofrifruta
items.food.blandfruit.stormfruit=fruta-tempestuosa
items.food.blandfruit.dreamfruit=fruta-magi
items.food.blandfruit.starfruit=fruta-estrela
items.food.blandfruit.swiftfruit=fruta-ligeira
items.food.blandfruit.raw=Você não suporta comer isto cru.
items.food.blandfruit.desc=Uma fruta alienígena seca e sem gosto. Talvez cozinhá-la com outro ingrediente melhore o sabor.
items.food.blandfruit.desc_cooked=A fruta inchou no tempo em que ficou na bancada de síntese e até absorveu as propriedades da semente com a qual foi cozida. Terá o efeito de qualquer injetor à qual a semente corresponda.
items.food.blandfruit.desc_eat=Parece pronto para comer!
items.food.blandfruit.desc_throw=Parece muito volátil, talvez seja melhor arremessar.
items.food.blandfruit$chunks.name=pedaços de fruta alienígena
items.food.blandfruit$chunks.desc=A fruta alienígena explodiu no impacto, deixando pedaços inertes para trás.\n\nApesar de um pouco sujos, estes grandes pedaços de fruta alienígena cozida parecem perfeitamente comestíveis.
items.food.chargrilledmeat.name=carne do enxame grelhada
items.food.chargrilledmeat.desc=Carne do enxame bem passada na chama. O gosto ainda é estranho, mas é segura.
items.food.chargrilledmeat.discover_hint=Você pode criar isto usando outro alimento.
items.food.food.name=ração de combate
items.food.food.ac_eat=COMER
items.food.food.eat_msg=A comida estava deliciosa!
items.food.food.desc=Ração de combate padrão da Brigada: carne desidratada, biscoitos e um tablete de proteína.
items.food.frozencarpaccio.name=carne do enxame congelada
items.food.frozencarpaccio.invis=Você vê suas mãos tornarem-se invisíveis!
items.food.frozencarpaccio.hard=Você sente sua pele endurecer!
items.food.frozencarpaccio.refresh=Revigorante!
items.food.frozencarpaccio.better=Você se sente melhor!
items.food.frozencarpaccio.desc=Carne do enxame congelada até endurecer. Cortada em fatias finas, fica surpreendentemente boa.
items.food.frozencarpaccio.discover_hint=Você pode criar isto usando outro alimento.
items.food.meatpie.name=empadão de campanha
items.food.meatpie.eat_msg=A comida estava incrível!
items.food.meatpie.desc=Um empadão de campanha recheado de carne. Sacia muito mais do que qualquer outra refeição.
items.food.meatpie.discover_hint=Você pode fabricar este item através de síntese.
items.food.mysterymeat.name=carne do enxame
items.food.mysterymeat.eat_msg=A comida estava com um gosto... esquisito.
items.food.mysterymeat.hot=Ah! Está quente!
items.food.mysterymeat.legs=Você não sente suas pernas!
items.food.mysterymeat.not_well=Você não se sente bem.
items.food.mysterymeat.stuffed=Você está estufado.
items.food.mysterymeat.desc=Um pedaço de carne arrancado de uma criatura do enxame. Coma por sua conta e risco.
items.food.mysterymeat.discover_hint=Você pode obter este item como um saque de certos inimigos.
items.food.mysterymeat$placeholder.name=carne
items.food.phantommeat.name=carne translúcida
items.food.phantommeat.desc=Um bife grande, brilhante e translúcido, cortado de uma lampreia translúcida. Esta carne estranha não precisa ser cozida, sacia por completo e traz uma série de benefícios defensivos. Ao ser comida, ela dá invisibilidade e pele arbórea, recupera um pouco de PV e cura muitos efeitos nocivos.
items.food.phantommeat.discover_hint=Você pode obter este item como um saque de certos inimigos.
items.food.pasty.name=lanche de bordo
items.food.pasty.fish_name=peixe ao vapor
items.food.pasty.amulet_name=coração da rainha?
items.food.pasty.egg_name=ovo de páscoa
items.food.pasty.rainbow_name=injetor arco-íris
items.food.pasty.shattered_name=bolo verde
items.food.pasty.pie_name=torta de abóbora
items.food.pasty.vanilla_name=bolo azul
items.food.pasty.cane_name=bengala doce
items.food.pasty.sparkling_name=injetor espumante
items.food.pasty.desc=Um pastel de forno com recheio de carne e batata, direto do refeitório da Vigília-7. Delicioso!
items.food.pasty.fish_desc=Um peixe inteiro cozido ao vapor, preservado a vácuo em uma cama de verduras. É tradição guardar um pouco de peixe para mais tarde nesta época do ano, então você vai guardar algumas sobras em vez de comer tudo de uma vez.\n\nFeliz Ano Novo Lunar!
items.food.pasty.amulet_desc=Você finalmente encontrou o Coração da Rainha... espera um minuto, isto é só um chocolate embrulhado em papel alumínio para parecer o coração!
items.food.pasty.egg_desc=Um ovo bem grande de chocolate, envolto em papel alumínio amarelo colorido. Há chocolate de sobra aqui para deixá-lo cheio e o açúcar pode dar aos seus módulos um pouquinho de carga extra.\n\nFeliz Páscoa!
items.food.pasty.rainbow_desc=Este injetor colorido é uma espécie de alimento líquido. Além de satisfazer sua fome, contém um calmante que acalmará um inimigo adjacente que não seja chefe, fazendo-o temporariamente hesitante em lutar contra você.\n\nFeliz Orgulho Gay!
items.food.pasty.shattered_desc=Esta fatia grande de bolo de baunilha tem granulados coloridos e cobertura verde. O bolo foi feito para comemorar anos de experiência e vai lhe conceder um pouco dessa experiência quando comido.\n\nShattered Pixel Dungeon foi lançado pela primeira vez em 5 de agosto de 2014. Feliz aniversário, Shattered Pixel Dungeon!
items.food.pasty.pie_desc=Um pedaço bem grande de torta de abóbora! Seu sabor doce e apimentado irá deixar você cheio e lhe dará um pouco de cura.\n\nFeliz Dia das Bruxas!
items.food.pasty.vanilla_desc=Esta fatia grande de bolo de baunilha tem granulados coloridos e cobertura azul. O bolo foi feito para comemorar anos de experiência e vai lhe conceder um pouco dessa experiência quando comido.\n\nO Pixel Dungeon original foi lançado em 4 de dezembro de 2012. Feliz aniversário, Pixel Dungeon!
items.food.pasty.cane_desc=Uma enorme e açucarada bengala doce! É grande o suficiente para matar sua fome, e o açúcar pode dar à suas armas especiais um pouquinho de carga extra também.\n\nFeliz Natal!
items.food.pasty.sparkling_desc=Este injetor espumante é uma espécie de alimento líquido. Sacia a fome e simula vinho espumante, mas na verdade não é alcoólico.  A sensação de calor na barriga lhe dará um pouco de proteção.\n\nFeliz Ano Novo!
items.food.pasty$fishleftover.name=Sobras de peixe
items.food.pasty$fishleftover.eat_msg=A comida estava razoável.
items.food.pasty$fishleftover.desc=Algum peixe que sobrou da sua refeição anterior. Você pode comer a qualquer momento para saciar um pouco de fome.
items.food.smallration.name=ração compacta
items.food.smallration.eat_msg=A comida estava razoável.
items.food.smallration.desc=Igual a uma ração de combate, só que menor.
items.food.smallration.discover_hint=Você pode comprar este item em uma loja.
items.food.stewedmeat.name=carne do enxame cozida
items.food.stewedmeat.eat_msg=A comida estava razoável.
items.food.stewedmeat.desc=Ferver a carne do enxame matou os parasitas. Deve ser seguro comer.
items.food.stewedmeat.discover_hint=Você pode fabricar este item através de síntese.
items.food.supplyration.name=ração de emergência
items.food.supplyration.desc=Uma ração das cápsulas de fuga da Vigília-7, feita para comer andando e sair de enrascadas.\n\nEla sacia menos que uma ração de combate, mas pode ser comida rápido, cura um pouco e restaura uma carga do módulo de camuflagem ativa das Forças especiais.
items.food.supplyration.discover_hint=Você pode encontrar este item usando um talento de herói específico.
##journal items
items.journal.documentpage.name=página rasgada
items.journal.documentpage.desc=Uma página solta, provavelmente arrancada de algum caderno. É preciso pegá-la para ler.
items.journal.alchemypage.name=página rasgada do arquivo de receitas
items.journal.alchemypage.desc=Uma página rasgada do arquivo de receitas da bancada de síntese.\n\nQuase todo o texto é pequeno demais para ler de longe, mas o título dá para ver:\n\n_"%s"_
items.journal.guidebook.name=manual do combatente espacial
items.journal.guidebook.hint_mobile=O manual tem uma dica para você! Toque no botão do diário, que pisca no canto superior direito, para ler.
items.journal.guidebook.hint_desktop=O manual tem uma dica para você! Selecione o botão do diário (%s), que pisca no canto superior direito, para ler.
items.journal.guidebook.hint_status=Manual
items.journal.guidebook.desc=O manual de bolso que todo recruta da Brigada Orbital recebe no primeiro dia. Este exemplar veio no kit de sobrevivência da cápsula e se conecta ao diário para mostrar a página certa na hora certa.\n\nNa capa, em letras grandes, está o primeiro mandamento da Brigada: "Respire. Depois atire."
items.journal.guidepage.name=página solta do manual
items.journal.guidepage.desc=Uma página que se soltou do Manual do Combatente Espacial.\n\nQuase todo o texto é pequeno demais para ler de longe, mas o título dá para ver:\n\n_"%s"_
items.journal.regionlorepage$sewers.name=registro de bordo
items.journal.regionlorepage$sewers.desc=Um registro de áudio de um tripulante da Vigília-7, num gravador amassado pela queda. Pegue-o para ouvir.
items.journal.regionlorepage$prison.name=página de diário pirata
items.journal.regionlorepage$prison.desc=Uma página arrancada de um diário, com o símbolo de uma garra no canto. Pegue-a para ler.
items.journal.regionlorepage$caves.name=registro de capacete
items.journal.regionlorepage$caves.desc=O módulo de memória de um capacete da Brigada Orbital, ainda funcionando. Pegue-o para ouvir.
items.journal.regionlorepage$city.name=tabuleta enferrujada
items.journal.regionlorepage$city.desc=Uma pequena e enferrujada tabuleta de metal com uma mensagem gravada a laser nela. As letras ainda estão claras mesmo tendo sido escritas anos atrás, mas você precisa pegá-la para ler o que está escrito.
items.journal.regionlorepage$halls.name=tabuleta brilhante
items.journal.regionlorepage$halls.desc=Uma pequena tabuleta preta, com letras verdes brilhantes entalhadas nela. As brilhantes letras juntas formam um borrão quando vistas de longe. Você precisa pegar a tabuleta para lê-la.
###keys
items.keys.goldenkey.name=cartão de acesso dourado
items.keys.goldenkey.desc=Um cartão de acesso com a faixa dourada dos contêineres de carga. Ele abre um baú trancado deste setor.
items.keys.crystalkey.name=cartão de acesso ciano
items.keys.crystalkey.desc=Um cartão de acesso com a faixa ciano dos compartimentos blindados. Ele abre uma porta ou um baú de cristal deste setor.
items.keys.ironkey.name=cartão de acesso cinza
items.keys.ironkey.desc=Um cartão de acesso da Vigília-7 com a faixa cinza das portas comuns. Ele abre uma porta trancada deste setor.
items.keys.wornkey.name=cartão de acesso danificado
items.keys.wornkey.desc=Um cartão de acesso rachado e queimado, mas que ainda responde. Deve abrir alguma porta importante por perto.
###potions
items.potions.potion.ac_drink=INJETAR
items.potions.potion.turquoise=injetor turquesa
items.potions.potion.crimson=injetor escarlate
items.potions.potion.azure=injetor azul
items.potions.potion.jade=injetor verde
items.potions.potion.golden=injetor dourado
items.potions.potion.magenta=injetor magenta
items.potions.potion.charcoal=injetor grafite
items.potions.potion.ivory=injetor marfim
items.potions.potion.amber=injetor âmbar
items.potions.potion.bistre=injetor marrom
items.potions.potion.indigo=injetor roxo
items.potions.potion.silver=injetor prateado
items.potions.potion.unknown_desc=Um injetor de campo da Brigada, sem rótulo. O líquido dentro é colorido e se agita. Quem sabe o que faz quando aplicado ou arremessado?
items.potions.potion.harmful=Injetor nocivo!
items.potions.potion.beneficial=Injetor benéfico!
items.potions.potion.yes=Sim, sei o que faço
items.potions.potion.no=Não, mudei de ideia
items.potions.potion.sure_drink=Tem certeza de que quer aplicar isso em você? Na maioria dos casos, injetores assim devem ser arremessados nos inimigos.
items.potions.potion.sure_throw=Tem certeza de que quer arremessar isso? Na maioria dos casos, faria mais sentido aplicar em você.
items.potions.potion.shatter=O injetor se quebra e o líquido escorre sem efeito.
items.potions.potion.discover_hint=Você pode encontrar este item aleatoriamente durante a missão ou criá-lo por meio de síntese.
items.potions.potion$placeholder.name=injetor
items.potions.potion$seedtopotion.name=Injetor Aleatória
items.potions.potionofexperience.name=injetor neural
items.potions.potionofexperience.desc=As experiências célebres de muitas batalhas reduzidas à forma líquida, este líquido vai aumentar instantaneamente o seu nível de experiência.
items.potions.potionoffrost.name=injetor criogênico
items.potions.potionoffrost.desc=O produto químico contido neste injetor evaporará em uma nuvem congelante após ser exposta ao ar.
items.potions.potionofhaste.name=injetor de adrenalina
items.potions.potionofhaste.energetic=Você se sente enérgico!
items.potions.potionofhaste.desc=Aplicar este líquido estranhamente doce vai imbuir você com uma tremenda energia por um curto período de tempo, permitindo que você corra em alta velocidade.
items.potions.potionofhealing.name=injetor de regeneração
items.potions.potionofhealing.heal=Suas feridas começam a fechar.
items.potions.potionofhealing.desc=Este elixir irá restaurar rapidamente sua vida e curar instantaneamente muitos efeitos negativos.
items.potions.potionofinvisibility.name=injetor de camuflagem
items.potions.potionofinvisibility.invisible=Você vê as suas mãos ficarem invisíveis!
items.potions.potionofinvisibility.desc=Aplicar este injetor irá torná-lo temporariamente invisível. Enquanto estiver invisível, os inimigos não serão capazes de enxergar você. Ataques físicos e efeitos de energia (como cartuchos e armas especiais) irão imediatamente cancelar a invisibilidade.
items.potions.potionoflevitation.name=injetor antigravidade
items.potions.potionoflevitation.float=Você flutua no ar!
items.potions.potionoflevitation.desc=Aplicar este líquido curioso fará com que você flutue no ar, sendo capaz de pairar sem esforço sobre armadilhas e buracos. Jogar este injetor irá criar uma nuvem de gás bruto, desorientando qualquer coisa que for pego nela.
items.potions.potionofliquidflame.name=injetor incendiário
items.potions.potionofliquidflame.desc=Este injetor contém um composto instável que vai estourar violentamente em chamas ao ser exposto ao ar.
items.potions.potionofmindvision.name=injetor de percepção
items.potions.potionofmindvision.see_mobs=De alguma forma, você consegue sentir a presença das mentes de outras criaturas!
items.potions.potionofmindvision.see_none=De alguma maneira, você tem certeza de que está sozinho neste nível no momento.
items.potions.potionofmindvision.desc=Após aplicar isto, sua mente se tornará sintonizada à assinatura psíquica de criaturas distantes, possibilitando a você pressentir presenças biológicas através de paredes. Além disso, este injetor te permitirá ver através de paredes e portas próximas.
items.potions.potionofparalyticgas.name=injetor paralisante
items.potions.potionofparalyticgas.desc=Após ser exposto ao ar, o líquido deste injetor irá vaporizar em uma névoa amarela entorpecente. Qualquer um que inale da nuvem será paralisado instantaneamente, incapaz de se mover por algum tempo. Este item pode ser jogado em inimigos distantes para envolvê-los no efeito do gás.
items.potions.potionofpurity.name=injetor de antitoxina
items.potions.potionofpurity.freshness=Você sente um frescor incomum no ar.
items.potions.potionofpurity.protected=Uma película protetora te envolve!
items.potions.potionofpurity.desc=Este reagente neutralizará rapidamente todos os efeitos nocivos em uma grande área. Aplicar isso lhe dará imunidade temporária a tais efeitos.
items.potions.potionofstrength.name=injetor de força
items.potions.potionofstrength.msg=Uma nova força surge em seu corpo, agora você tem %d de força!
items.potions.potionofstrength.desc=Este líquido poderoso vai percorrer seus músculos, permanentemente aumentando sua força em um ponto.
items.potions.potionoftoxicgas.name=injetor tóxico
items.potions.potionoftoxicgas.desc=Removendo a rolha ou quebrando este vidro pressurizado irá fazer com que seu conteúdo exploda numa nuvem mortal de gás tóxico esverdeado. Você pode optar por arremessar este injetor em inimigos distantes em vez de abri-la manualmente.
###brews
items.potions.brews.brew.discover_hint=Você pode fabricar este item através de síntese.
items.potions.brews.aquabrew.name=composto aquático
items.potions.brews.aquabrew.desc=Quando quebrado, este composto liberará uma explosão de água pressurizada no local. Só é forte o suficiente para causar danos a inimigos de fogo, mas também espalha água em terrenos próximos, desabilita armadilhas, apaga incêndios e arremessa personagens próximos à explosão.
items.potions.brews.blizzardbrew.name=composto nevado
items.potions.brews.blizzardbrew.desc=Quando quebrada, esta mistura desencadeará uma nevasca rodopiante que se espalhará rapidamente como um gás.
items.potions.brews.causticbrew.name=composto cáustico
items.potions.brews.causticbrew.desc=Esta mistura espalhará muco corrosivo em uma ampla área ao redor do local em que se estilhaçar. Qualquer coisa pega pelo muco derreterá lentamente se não puder lavá-lo na água.
items.potions.brews.infernalbrew.name=composto Infernal
items.potions.brews.infernalbrew.desc=Quando quebrada, esta mistura desencadeará um inferno em chamas que se espalhará rapidamente como um gás.
items.potions.brews.shockingbrew.name=composto eletrizado
items.potions.brews.shockingbrew.desc=Quando quebrada, esta mistura desencadeará uma tempestade elétrica em uma ampla área ao redor do local de impacto.
items.potions.brews.unstablebrew.name=composto instável
items.potions.brews.unstablebrew.desc=Este composto brilha alternando entre as cores do arco-íris.\n\nQuando aplicado ou jogado, ativará o efeito de um injetor aleatório. O efeito do injetor sempre será benéfico se for aplicada e sempre será prejudicial se for jogada.
###elixirs
items.potions.elixirs.elixir.discover_hint=Você pode fabricar este item através de síntese.
items.potions.elixirs.elixirofarcanearmor.name=elixir de campo de dispersão
items.potions.elixirs.elixirofarcanearmor.desc=Este elixir proporcionará, àquele que o aplicar, resistência duradoura a dano de energia.
items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir de rejuvenescimento aquático
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Este elixir contém os restos da Matriz do Enxame misturados junto com um injetor de cura. Embora não proporcione cura imediata, ela restaurará constantemente uma grande quantidade de vida enquanto você estiver na água.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=cura aquática
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Você ganhou temporariamente propriedades restauradoras semelhantes às da Matriz do Enxame.\n\nEnquanto estiver na água, você recuperará uma pequena quantidade de saúde por turno. O efeito é pausado quando você está com a saúde completa ou sem água.\n\nCura restante: %d.
items.potions.elixirs.elixirofdragonsblood.name=elixir de sangue ígneo
items.potions.elixirs.elixirofdragonsblood.desc=Quando consumido, este elixir enviará poder incendiário pelas veias daquele que o aplicou. Esse efeito deixará a pessoa imune ao fogo e permitirá que incendeie os inimigos com ataques físicos.
items.potions.elixirs.elixiroffeatherfall.name=elixir de queda suave
items.potions.elixirs.elixiroffeatherfall.light=Você se sente leve como uma pena!
items.potions.elixirs.elixiroffeatherfall.desc=Este elixir oferece um efeito de levitação mais fraco, porém mais controlado, permitindo àquele que aplica cair grandes distâncias sem sofrer danos por um curto período de tempo.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=queda suave
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Você está sob o efeito de um elixir de queda suave, permitindo com que caia de abismos sem sofrer danos!\n\nTurnos restantes: %s.
items.potions.elixirs.elixirofhoneyedhealing.name=elixir da cura com mel
items.potions.elixirs.elixirofhoneyedhealing.desc=Este elixir combina a cura com a doçura do mel. Quando aplicado, aplicará o mesmo efeito de um injetor de cura e irá satisfazer uma pequena quantidade de fome, também pode ser arremessado para curar um aliado.\n\nCriaturas com afinidade por mel podem ser pacificadas se este item for usado nelas.
items.potions.elixirs.elixiroficytouch.name=elixir do toque gelado
items.potions.elixirs.elixiroficytouch.desc=Quando consumido, este elixir permitirá àquele que o aplicou absorver o calor dos inimigos ao atacá-los. Esse efeito deixará o mesmo imune ao frio e permitirá que ele resfrie os inimigos com ataques físicos.
items.potions.elixirs.elixirofmight.name=elixir de poder
items.potions.elixirs.elixirofmight.msg=Uma nova força surge em seu corpo, agora você tem %d de força!
items.potions.elixirs.elixirofmight.desc=Este líquido poderoso irá correr pelos seus músculos, aumentando permanentemente a sua força em um ponto, aumentando também temporariamente a sua saúde máxima em %d pontos. O impulso de vida depende da sua vida máxima, mas diminuirá lentamente à medida em que você vai subindo de nível.
items.potions.elixirs.elixirofmight$htboost.name=aumento de saúde máximo
items.potions.elixirs.elixirofmight$htboost.desc=Você sente seu corpo anormalmente forte e saudável.\n\nA sua saúde máxima é aumentada por um longo período de tempo. À medida que você aumenta de nível, o impulso vai se dissipando constantemente.\n\nQuantidade de impulso atual: %d.\nNíveis restantes: %d.
items.potions.elixirs.elixiroftoxicessence.name=elixir da essência tóxica
items.potions.elixirs.elixiroftoxicessence.desc=Quando consumido, este elixir irá imbuir quem o aplica com energia tóxica. O mesmo espalhará continuamente gases tóxicos à medida que se move e ficará imune a gases tóxicos e venenos por um pouco mais tempo do que a duração do efeito.
###exotic potions
items.potions.exotic.exoticpotion.turquoise=injetor turquesa exótico
items.potions.exotic.exoticpotion.crimson=injetor carmesim exótico
items.potions.exotic.exoticpotion.azure=injetor azul exótico
items.potions.exotic.exoticpotion.jade=injetor de jade exótica
items.potions.exotic.exoticpotion.golden=injetor dourado exótico
items.potions.exotic.exoticpotion.magenta=injetor magenta exótico
items.potions.exotic.exoticpotion.charcoal=injetor grafite exótico
items.potions.exotic.exoticpotion.ivory=injetor marfim exótico
items.potions.exotic.exoticpotion.amber=injetor âmbar exótico
items.potions.exotic.exoticpotion.bistre=injetor marrom exótico
items.potions.exotic.exoticpotion.indigo=injetor roxa exótico
items.potions.exotic.exoticpotion.silver=injetor prata exótico
items.potions.exotic.exoticpotion.unknown_desc=Este injetor redondo contém um líquido borbulhante. Parece não ser desta terra, quem sabe o que pode fazer quando aplicado ou jogado?
items.potions.exotic.exoticpotion.warning=Você realmente quer cancelar o uso deste injetor? Ela será consumida de qualquer maneira.
items.potions.exotic.exoticpotion.yes=Sim, eu tenho certeza
items.potions.exotic.exoticpotion.no=Não, eu mudei de ideia
items.potions.exotic.exoticpotion.discover_hint=Você pode fabricar este item através de síntese.
items.potions.exotic.potionofcleansing.name=injetor da limpeza
items.potions.exotic.potionofcleansing.desc=Este poderoso reagente tornará aquele que o aplica imune a todos os efeitos prejudiciais por alguns turnos. Também pode ser jogado em um alvo para purificá-lo.
items.potions.exotic.potionofcleansing$cleanse.name=purificado
items.potions.exotic.potionofcleansing$cleanse.desc=Este personagem está temporariamente imune a todos os efeitos de status nocivos!\n\nTurnos restantes: %s.
items.potions.exotic.potionofcorrosivegas.name=injetor de gás corrosivo
items.potions.exotic.potionofcorrosivegas.desc=Tirar a rolha ou quebrar este injetor pressurizado fará com que seu conteúdo exploda em uma nuvem mortal de gás corrosivo de cor ferrugem. O gás se espalha mais rápido do que o gás tóxico e é mais mortal, mas também não durará muito.
items.potions.exotic.potionofdragonsbreath.name=injetor de sopro ígneo
items.potions.exotic.potionofdragonsbreath.prompt=Escolha um local para queimar
items.potions.exotic.potionofdragonsbreath.desc=Este injetor contém um composto incomum que se inflama logo após a mistura com a saliva. Cuspir rapidamente o líquido permitirá que o usuário cuspa chamas de sua boca!
items.potions.exotic.potionofearthenarmor.name=injetor da armadura de barro
items.potions.exotic.potionofearthenarmor.desc=Em vez de paralisar, este líquido tem um efeito endurecedor na pele, que a transforma em uma armadura natural temporária.
items.potions.exotic.potionofdivineinspiration.name=injetor de inspiração tática
items.potions.exotic.potionofdivineinspiration.no_more_points=Você não pode mais ganhar pontos de bônus de talento.
items.potions.exotic.potionofdivineinspiration.select_tier=Escolha um tier de talento para ganhar dois pontos bônus nele. Você precisa ter desbloqueado o tier para ser capaz de gastar os pontos.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Pontos de Talento!
items.potions.exotic.potionofdivineinspiration.desc=Um coquetel de nootrópicos e memória tática gravada em proteína, que concede a quem o aplica dois pontos de talento bônus em um tier de sua escolha.\n\nEste injetor só pode ser usada uma vez por tier de talento.
items.potions.exotic.potionofmagicalsight.name=injetor de visão ampliada
items.potions.exotic.potionofmagicalsight.desc=Após tomar isto, seus sentidos serão brevemente elevados a níveis incríveis, permitindo que você veja através das paredes em um raio de 12 quadrados!
items.potions.exotic.potionofmastery.name=injetor da maestria
items.potions.exotic.potionofmastery.prompt=Domine um Item
items.potions.exotic.potionofmastery.weapon_easier=Sua arma tornou-se mais fácil de empunhar!
items.potions.exotic.potionofmastery.armor_easier=Sua armadura tornou-se mais fácil de usar!
items.potions.exotic.potionofmastery.desc=Em vez de conceder força bruta, este injetor irá harmonizar os músculos do usuário a um item específico. Isso fará com que esse item fique mais fácil de usar, como se aquele que a aplicou tivesse praticado e construído memória muscular.\n\nA arma ou armadura escolhida exigirá menos 2 de força para ser usada. Este injetor só pode ser usada uma vez em cada item.
items.potions.exotic.potionofshielding.name=injetor da blindagem
items.potions.exotic.potionofshielding.desc=Ao invés de curar, este injetor irá projetar um escudo durável ao redor do corpo do usuário, bloqueando uma quantidade considerável de dano.
items.potions.exotic.potionofshroudingfog.name=injetor da neblina
items.potions.exotic.potionofshroudingfog.desc=Quando exposto ao ar, o líquido neste injetor irá produzir uma espessa névoa de fumaça que se espalhará rapidamente, bloqueando a visão dos seus inimigos.
items.potions.exotic.potionofsnapfreeze.name=injetor do congelamento instantâneo
items.potions.exotic.potionofsnapfreeze.desc=A substância química contida neste injetor reagirá rapidamente com o ar, instantaneamente congelando e enraizando tudo dentro do seu efeito.
items.potions.exotic.potionofstamina.name=injetor do vigor
items.potions.exotic.potionofstamina.desc=Aplicar este líquido estranhamente doce irá imbuir você com um aumento de energia de longa duração, permitindo que você corra em um ritmo acelerado por um longo período de tempo.
items.potions.exotic.potionofstormclouds.name=injetor de nuvens tempestuosas
items.potions.exotic.potionofstormclouds.desc=Jogar este injetor criará uma nuvem de vapor concentrado que se espalhará rapidamente, a qual se condensará e precipitará no ambiente. A maior parte do terreno será convertida em água, inimigos de fogo sofrerão dano, o fogo será apagado e as armadilhas serão esmagadas e quebradas.
###quest items
items.quest.ceremonialcandle.name=vela cerimonial
items.quest.ceremonialcandle.desc=Um conjunto de velas, derretidas e fundidas pelo uso.\n\nSozinhas são inúteis, mas se usadas com outras velas em um padrão, podem canalizar a energia para um ritual de invocação.
items.quest.ceremonialcandle.discover_hint=Você pode encontrar este item durante uma missão especifica.
items.quest.corpsedust.name=pó de cadáver
items.quest.corpsedust.chill=Um frio desce pela sua espinha.
items.quest.corpsedust.desc=Esta bola de pó de cadáver não é muito diferente de uma bola de pó normal. Mas você pode sentir algo do enxame pulsando dentro dela.\n\nLivrar-se disto o mais rápido possível é uma boa ideia.
items.quest.corpsedust.discover_hint=Você pode encontrar este item durante uma missão especifica.
items.quest.corpsedust&dustwraith.rankings_desc=Corrompido pelo Pó de Cadáver
items.quest.darkgold.name=Laztro bruto
items.quest.darkgold.you_now_have=Agora você tem %d pedras de Laztro bruto.
items.quest.darkgold.desc=Laztro ainda preso na rocha, com veias roxas que brilham no escuro. Sem refino ele não serve como moeda, mas a Cabo Moreno sabe o que fazer com ele.
items.quest.darkgold.discover_hint=Você pode encontrar este item durante uma missão especifica.
items.quest.dwarftoken.name=chip de acesso
items.quest.dwarftoken.discard=Você descarta os chips que sobraram.
items.quest.dwarftoken.desc=Um chip de acesso que um dos guardas do cofre carregava. Deve abrir alguma coisa por aqui. É melhor guardá-lo.
items.quest.dwarftoken.desc_old=Alguns guardas do enxame carregam chips de acesso arrancados de naves. Para que servem, só eles sabem.
items.quest.dwarftoken.discover_hint=Você pode encontrar este item durante uma missão especifica.
items.quest.embers.name=brasas elementais
items.quest.embers.desc=Brasas especiais que só podem ser obtidas de um elemental de fogo jovem. Elas irradiam energia térmica.
items.quest.embers.discover_hint=Você pode encontrar este item durante uma missão especifica.
items.quest.escapecrystal.name=cristal de escape
items.quest.escapecrystal.ac_use=USAR
items.quest.escapecrystal.prompt=Selecione um item
items.quest.escapecrystal.desc=Um cristal fino que guarda uma carga de teletransporte. Você pode usá-lo a qualquer momento para sair do cofre, mas, se sair antes da hora, não recebe a recompensa inteira!
items.quest.escapecrystal.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.escapecrystal.injure_warning_1=O tempo parece desacelerar e você ouve a voz do contrabandista:\n\n"Ei, você parece ter se ferido bastante, está tudo bem aí em baixo? Eu quero a minha estatueta, mas não a ponto de querer que você morra tentando consegui-la!"
items.quest.escapecrystal.injure_warning_2="Se você estiver preso em uma situação complicada, pode usar um daqueles _itens de teletransporte da sala inicial_ para escapar de volta para lá e tentar novamente."
items.quest.escapecrystal.injure_warning_3="Se a situação ficar realmente crítica, você pode _escapar usando aquele cristal que eu lhe dei_. Não vou dar a você a recompensa inteira, mas certamente é melhor do que morrer!"
items.quest.escapecrystal.leaving_start=O tempo parece desacelerar enquanto você ouve a voz do contrabandista:\n\n"Escute, eu entendo se você está nervoso, mas por favor, saia pelo menos da primeira sala!"\n\n"Você não precisa se preocupar com seu equipamento, eu sou um pirata de palavra, prometo que tudo estará esperando por você quando voltar. Também prometo que deixarei você usar o cristal para escapar se estiver realmente em perigo."
items.quest.escapecrystal.leaving_early=O tempo parece desacelerar quando você ouve a voz do contrabandista:\n\n"Sério, já está fugindo!? Você sabe que dá para escapar da maioria dos inimigos desse lugar, né?"\n\n"Olha, se a sua vida estiver em perigo, eu posso tirar você daí, mas não vou te deixar trazer nada de volta consigo. Eu esperava muito mais de você =("
items.quest.escapecrystal.leaving_partly_explored=O tempo parece desacelerar e você ouve a voz do contrabandista:\n\n"Ah, você já está indo embora? Bem, suponho que você tenha ajudado a mapear o lugar, e isso é melhor do que nada."\n\n"Mesmo assim, eu esperava mais de você =(. Claro que eu vou te tirar daí se precisar. Vou deixar você levar algo como um injetor ou um cartucho, talvez."
items.quest.escapecrystal.leaving_fully_explored=O tempo parece desacelerar e você ouve a voz do contrabandista:\n\n"Precisa ir embora? Bom, pelo menos você explorou bastante o cofre. Eu esperava que você se saísse melhor saqueando, mas agora tenho uma ideia muito melhor de como o lugar funciona."\n\n"Vou deixar você levar alguma coisa, mas nada aprimorado!"
items.quest.escapecrystal.leaving_partial_victory=O tempo parece desacelerar e você ouve a voz do contrabandista:\n\n"Eu esperava que você conseguisse pegar a minha estatueta, mas fez um ótimo trabalho explorando e limpando a maior parte do cofre!"\n\n"Quer saber? Vou deixar você ficar com um item, desde que não passe de +1, e ainda vou montar minha banca alguns setores abaixo. De qualquer forma, preciso de um tempo para planejar meus próximos passos."
items.quest.escapecrystal.leaving_victory=O tempo parece desacelerar e você ouve a voz do contrabandista:\n\n"Excelente trabalho!! Pronto para ir embora? Pego a estatueta com você quando voltar."\n\n"Como prometido, vou montar minha banca alguns setores abaixo e deixar você levar o que quiser! Escolha com calma, todo o resto fica no cofre."
items.quest.escapecrystal.leaving_item=Tem certeza de que este é o item que quer levar com você?
items.quest.escapecrystal.leaving_seal=_O gerador de escudo afixado a esta armadura está vinculado ao espelho e não pode ser levado com você._ O gerador será removido automaticamente da armadura. Isso reduzirá o nível da armadura em 1, mas não removerá nenhum revestimento que ela possua.
items.quest.escapecrystal.leaving_staff=_Este transmissor orbital está vinculado ao espelho e não pode ser levado com você, mas a arma especial acoplada a ele, sim._ A arma especial será retirada do transmissor e entregue a você com o nível do transmissor -1.
items.quest.escapecrystal.leaving_yes=Sair do Cofre
items.quest.escapecrystal.leaving_no=Ficar aqui
items.quest.escapecrystal.error_start=Parece que você não está no setor do Cofre! Isso pode ter acontecido devido a um bug ou falha.
items.quest.escapecrystal.error_no_items=Nenhum dos seus itens estão sendo armazenados, então o cristal foi removido do seu inventário.
items.quest.escapecrystal.error_with_items=Seus itens estão sendo armazenados no momento, então você deveria tentar descer ao cofre de novo para começar a missão. Seus itens armazenados serão devolvidos pra você quando a missão terminar.
items.quest.gooblob.name=pedaço da Matriz
items.quest.gooblob.desc=Um pedaço de tecido vivo que se soltou da Matriz do Enxame quando ela morreu. Ainda pulsa, devagar. Talvez sirva para alguma coisa.
items.quest.gooblob.discover_hint=Você pode obter este item como um saque de certos inimigos.
items.quest.impstatue.name=Estatueta de obsidiana
items.quest.impstatue.desc=Uma pequena estatueta negra como o azeviche, esculpida em obsidiana. Ela se parece com o contrabandista que o enviou para cá, tem até os mesmos olhos verdes brilhantes. Há uma inscrição na base da estatueta, em um idioma que você nunca viu antes.
items.quest.impstatue.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.vaultbeacon.name=Sinalizador do Cofre
items.quest.vaultbeacon.desc=Esta baliza de retorno parece já ter um local definido, provavelmente a sala de entrada onde você o encontrou.\n\nVocê pode usá-lo para economizar tempo enquanto explora ou como uma forma de escapar caso esteja em perigo.
items.quest.vaultbeacon.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.metalshard.name=pedaço de metal corrompido
items.quest.metalshard.desc=Um fragmento de metal enferrujado corrompido que se soltou da perfuratriz da Garra Turva quando foi destruído. Você consegue sentir um código corrompido inativo dentro dele.\n\nPor si só não faz nada, mas pode ser útil quando combinado com certos cartuchos ou uma bomba. No mínimo, pode ser convertido em uma quantidade decente de energia.
items.quest.metalshard.discover_hint=Você pode obter este item como um saque de certos inimigos.
items.quest.pickaxe.name=picareta
items.quest.pickaxe.ability_name=perfurar
items.quest.pickaxe.ability_desc=O Renegado pode _perfurar_ um inimigo com uma picareta. O ataque é garantido, aplica vulnerabilidade por 3 turnos e causa _%1$d-%2$d de dano aos inimigos com pele rígida.
items.quest.pickaxe.upgrade_ability_stat_name=Dano de Habilidade
items.quest.pickaxe.desc=Esta é uma ferramenta pesada e robusta, utilizada para quebrar pedras. Você não precisa equipar a picareta para minerar com ela, mas, provavelmente, pode ser usada como uma arma em caso de necessidade.
items.quest.pickaxe.discover_hint=Você pode encontrar este item durante uma missão especifica.
###remains
items.remains.remainsitem.ac_use=USAR
items.remains.remainsitem.discover_hint=Você pode encontrar este item nos restos mortais de um herói específico de uma partida anterior perdida.
items.remains.bowfragment.name=fragmento do canhão
items.remains.bowfragment.desc=Este pedaço de metal já foi parte do canhão de pulso de um Piloto de exoesqueleto que não voltou. Ainda há esporos presos no cano, que você pode usar para fazer crescer um pouco de vegetação alta em volta. Isso, no entanto, destrói o fragmento.
items.remains.brokenhilt.name=cabo quebrado
items.remains.brokenhilt.desc=Este cabo quebrado parece ter vindo da arma de um Renegado derrotado. Ainda resta um pouco do simbionte preso nele, que você pode usar para ganhar um pequeno dano extra nos seus próximos dois golpes corpo a corpo. Isso, no entanto, destrói o cabo.
items.remains.brokenstaff.name=transmissor quebrado
items.remains.brokenstaff.desc=Este transmissor orbital partiu ao meio quando o Exterminador que o carregava caiu. Ainda resta alguma carga nele, que você pode usar para dar um pequeno impulso de carga nas suas armas especiais. Isso, no entanto, destrói o transmissor.
items.remains.cloakscrap.name=retalho de tecido
items.remains.cloakscrap.desc=Um retalho de tecido translúcido, que parece ter saído do módulo de camuflagem ativa de um operador das Forças especiais que não voltou. Ainda resta um pouco de energia nele, o bastante para dar uma carga extra aos seus módulos. O retalho se desfaz no processo.
items.remains.sealshard.name=fragmentos do gerador
items.remains.sealshard.desc=Estes pedaços de carcaça parecem ter vindo do gerador de escudo de um fuzileiro caído. Ainda resta um pouco de carga nas células, que você pode usar para ganhar um pouco de escudo. Isso, no entanto, destrói os fragmentos.
items.remains.tornpage.name=placa de memória
items.remains.tornpage.desc=Esta placa parece ter sido arrancada do núcleo de um Sintético desativado. Ainda resta um pouco de nanomédicos no circuito, que você pode usar para recuperar um pouco de vida. Isso, no entanto, destrói a placa.
