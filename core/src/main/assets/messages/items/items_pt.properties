items.hull.sintetico.nao_come=Você é uma máquina. A comida não serve para você, mas dá para vender.
items.hull.sintetico.economia_fim=Energia restabelecida. Modo de economia desligado.
items.artifacts.holytome.comandar_prompt=Ordem para o drone: um inimigo, um lugar ou você
items.hull.macacaomanutencao.desc=O macacão de trabalho das unidades de manutenção da Vigília-7. Protege tanto quanto um uniforme padrão, com bolsos para ferramentas em todo lugar.
