items.artifacts.masterthievesarmband.desc=Uma luva de captura de pirata, que fica mais forte com o Laztro que você junta. Ela pode tirar itens dos inimigos.
items.artifacts.masterthievesarmband.desc_cursed=A luva corrompida está presa à sua mão e, de alguma forma, sua reserva de Laztro parece estar lentamente ficando mais leve...
items.artifacts.masterthievesarmband.desc_worn=Você sente o poder aumentando na luva em seu braço à medida que ganha experiência. Você pode usar esse poder para roubar lojas ou roubar inimigos!\n\nRoubar inimigos acontece instantaneamente, desorienta-os brevemente e dá a você a chance de obter qualquer item que eles tenham! Este poder é mais efetivo contra inimigos que não tenham percebido sua presença. Roubar o mesmo inimigo várias vezes não dá mais chances de saque.
