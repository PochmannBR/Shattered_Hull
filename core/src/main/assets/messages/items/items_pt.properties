items.rings.ring.not_cursed=Este implante está livre de código malicioso.
items.rings.ringofaccuracy.name=implante de mira
items.rings.ringofaccuracy.stats=Quando usado, este implante aumentará sua precisão em _%s%%._
items.rings.ringofaccuracy.typical_stats=Quando usado, este implante normalmente aumentará sua precisão em _%s%%._
items.rings.ringofaccuracy.combined_stats=Seus implantes equipados estão combinando seus poderes, aumentando sua precisão para _%s%%_ no total.
items.rings.ringofaccuracy.upgrade_stat_name_1=Aumento de precisão
items.rings.ringofaccuracy.desc=Este implante liga a sua retina ao sistema de mira do traje e facilita acertar os inimigos. Um implante corrompido atrapalha os seus ataques.
items.rings.ringofarcana.name=implante de sinergia
items.rings.ringofarcana.stats=Quando equipado, este implante aumentará o poder de modificações e revestimentos em _%s%%._
items.rings.ringofarcana.typical_stats=Quando equipado, esse implante normalmente aumentará a potência de modificações e revestimentos em _%s%%._
items.rings.ringofarcana.combined_stats=Seus implantes equipados estão combinando seus poderes, aumentando o poder de modificações e revestimentos para _%s%%_ no total.
items.rings.ringofarcana.upgrade_stat_name_1=Impulso de sinergia
items.rings.ringofarcana.desc=Este implante sincroniza o traje com as modificações das armas e os revestimentos das armaduras, inclusive corrupções! Primeiro ele aumenta a chance de ativação e, quando ela chega a 100%, aumenta a força do efeito. Um implante corrompido enfraquece modificações, revestimentos e corrupções.
items.rings.ringofelements.name=implante de resistência
items.rings.ringofelements.stats=Quando usado, este implante fornecerá _%s%%_ de resistência elementar.
items.rings.ringofelements.typical_stats=Quando usado, este implante normalmente fornecerá _%s%%_ de resistência elementar.
items.rings.ringofelements.combined_stats=Seus implantes equipados estão combinando seus poderes, fornecendo _%s%%_ de resistência elemental no total.
items.rings.ringofelements.upgrade_stat_name_1=Resistência
items.rings.ringofelements.desc=Este implante filtra toxinas e isola o corpo contra a maioria dos efeitos elementares e de energia, reduzindo dano e duração. Um implante corrompido piora esses efeitos.
items.rings.ringofenergy.name=implante de energia
items.rings.ringofenergy.stats=Quando usado, este implante aumentará a velocidade de carregamento de armas especiais, módulos e armadura heroica em _%s%%._
items.rings.ringofenergy.typical_stats=Quando usado, este implante normalmente aumentará a velocidade de carregamento de armas especiais, módulos e armadura heroica em _%s%%._
items.rings.ringofenergy.combined_stats=Seus implantes equipados estão combinando seus poderes, aumentando a velocidade de recarga para _%s%%_ no total.
items.rings.ringofenergy.upgrade_stat_name_1=Impulso de carga
items.rings.ringofenergy.desc=Este implante desvia energia extra para o seu equipamento, que recarrega mais rápido. Um implante corrompido deixa a recarga mais lenta.
items.rings.ringofevasion.name=implante de reflexos
items.rings.ringofevasion.stats=Quando usado, este implante aumentará sua evasão em _%s%%._
items.rings.ringofevasion.typical_stats=Quando usado, este implante normalmente aumentará sua evasão em _%s%%._
items.rings.ringofevasion.combined_stats=Seus implantes equipados estão combinando seus poderes, aumentando sua evasão em _%s%%_ no total.
items.rings.ringofevasion.upgrade_stat_name_1=Aumento de evasão
items.rings.ringofevasion.desc=Este implante acelera os seus reflexos e deixa você mais difícil de acertar. Um implante corrompido deixa você mais fácil de atingir.
items.rings.ringofforce.name=implante de força bruta
items.rings.ringofforce.stats=Quando desarmado, com a sua força atual, este implante causará _%1$d-%2$d de dano._ Com uma arma equipada, este implante aumentará o dano em _%3$d_
items.rings.ringofforce.typical_stats=Quando desarmado, com a sua força atual, normalmente este implante causará _%1$d-%2$d de dano._ Com uma arma equipada, normalmente este implante aumentará o dano em _%3$d._
items.rings.ringofforce.combined_stats=Seus implantes equipados estão combinando seus poderes, causando um total de _%1$d-%2$d_ de dano sem uma arma ou aumentado o dano em  _%3$d_ com uma arma.
items.rings.ringofforce.upgrade_stat_name_1=Dano desarmado
items.rings.ringofforce.upgrade_stat_name_2=Aumento de dano armado
items.rings.ringofforce.upgrade_stat_name_3=Dano de Habilidade
items.rings.ringofforce.ability_name=postura de luta
items.rings.ringofforce.typical_ability_desc=O Renegado pode adotar uma _postura de luta_ com este implante, fazendo com que seus ataques regulares sempre usem este implante mesmo com uma arma equipada.  Esses ataques normalmente causarão _%1$d-%2$d de dano_ e também aplicarão a modificação e o melhorando da arma. Esta postura diminui a velocidade de recarga da arma em 50%%.
items.rings.ringofforce.ability_desc=O Renegado pode adotar uma _postura de luta_ com este implante, fazendo com que seus ataques regulares sempre usem este implante mesmo com uma arma equipada.  Esses ataques normalmente causarão _%1$d-%2$d de dano_ e também aplicarão a modificação e o melhorando da arma. Esta postura diminui a velocidade de recarga da arma em 50%%.
items.rings.ringofforce.desc=Este implante reforça os seus golpes corpo a corpo. O ganho é pequeno com armas, mas um soco desarmado fica muito mais forte. Um implante corrompido enfraquece os seus golpes.
items.rings.ringofforce$brawlersstance.name=postura de luta
items.rings.ringofforce$brawlersstance.desc=Enquanto estiver nesta postura, os ataques regulares do Renegado usarão um implante de força equipado, mesmo quando ela estiver com uma arma equipada. Esses ataques ganham dano adicional e ainda usarão a melhoria e a modificação da arma.\n\nNo entanto, manter essa postura exige foco, reduzindo a velocidade de recarga da habilidade da arma em 50%.\n\nEsta postura pode ser ativada ou desativada usando um implante de força, mas a redução na velocidade de carga persistirá por um tempo se a postura for ativada e desativada rapidamente.
items.rings.ringoffuror.name=implante de frenesi
items.rings.ringoffuror.stats=Quando usado, este implante aumentará a velocidade de seus ataques em _%s%%._
items.rings.ringoffuror.typical_stats=Quando usado, este implante normalmente aumentará a velocidade de seus ataques em _%s%%._
items.rings.ringoffuror.combined_stats=Seus implantes equipados estão combinando seus poderes, aumentando a velocidade do seus ataques em _%s%%_ no total.
items.rings.ringoffuror.upgrade_stat_name_1=Aumento de velocidade de ataque
items.rings.ringoffuror.desc=Este implante libera estimulantes durante o combate e acelera os seus ataques. Um implante corrompido deixa os seus ataques mais lentos.
items.rings.ringofhaste.name=implante locomotor
items.rings.ringofhaste.stats=Quando usado, este implante aumentará sua velocidade de movimento em _%s%%._
items.rings.ringofhaste.typical_stats=Quando usado, este implante normalmente aumentará sua velocidade de movimento em _%s%%._
items.rings.ringofhaste.combined_stats=Seus implantes equipados estão combinando seus poderes, aumentando a velocidade do seu movimento em _%s%%_ no total.
items.rings.ringofhaste.upgrade_stat_name_1=Aumento de velocidade de movimento
items.rings.ringofhaste.desc=Este implante reforça as articulações das pernas e deixa você muito mais rápido. Um implante corrompido deixa você pesado e lento.
items.rings.ringofmight.name=implante muscular
items.rings.ringofmight.stats=Quando usado, este implante aumentará sua força em _%1$d_ e sua vida máxima em _%2$s%%._
items.rings.ringofmight.typical_stats=Quando usado, este implante normalmente aumentará sua força em _%1$d_ e sua vida máxima em _%2$s%%._
items.rings.ringofmight.combined_stats=Seus implantes equipados estão combinando seus poderes, aumentando sua força em _%1$d_ e seu PV máximo para _%2$s%%_ no total.
items.rings.ringofmight.upgrade_stat_name_1=Aumento de Força
items.rings.ringofmight.upgrade_stat_name_2=Aumento de vida máx
items.rings.ringofmight.desc=Este implante reforça músculos e ossos, aumentando sua força e sua vida máxima. Um implante corrompido enfraquece você.
items.rings.ringofsharpshooting.name=implante balístico
items.rings.ringofsharpshooting.stats=Quando usado, este implante aumentará o dano de suas armas de arremesso como se o nível delas tivesse aumentado em _%1$d_, e aumentará sua durabilidade em _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Quando usado, este implante normalmente aumentará o dano de suas armas de arremesso como se o nível delas tivesse aumentado em _%1$d_ e aumentará sua durabilidade em _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Seus implantes equipados estão combinando seus poderes, aumentando o nível efetivo de armas de arremesso para _%1$d_ e aumentando sua durabilidade para _%2$s%%_ no total.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Aumento de dano de nível
items.rings.ringofsharpshooting.upgrade_stat_name_2=Aumento de durabilidade
items.rings.ringofsharpshooting.desc=Este implante corrige a trajetória dos seus disparos e arremessos, deixando os projéteis mais duráveis e com mais dano. Um implante corrompido tem o efeito oposto.
items.rings.ringoftenacity.name=blindagem subcutânea
items.rings.ringoftenacity.stats=Quando usado, este implante reduz o dano que você recebe em até _%s%%._
items.rings.ringoftenacity.typical_stats=Quando usado, este implante normalmente reduz o dano que você recebe em até _%s%%._
items.rings.ringoftenacity.combined_stats=Seus implantes equipados estão combinando seus poderes, reduzindo o dano sofrido em _%s%%_ no total.
items.rings.ringoftenacity.upgrade_stat_name_1=Resistência Máx a Dano
items.rings.ringoftenacity.desc=Placas finas sob a pele que ajudam você a aguentar golpes que seriam mortais. Quanto mais ferido você estiver, menos dano recebe. Uma blindagem corrompida deixa você mais fácil de abater.
items.rings.ringofwealth.name=implante de garimpo
items.rings.ringofwealth.stats=Quando usado, este implante aumentará sua sorte por _%s%%._
items.rings.ringofwealth.typical_stats=Quando usado, este implante normalmente aumentará sua sorte em _%s%%._
items.rings.ringofwealth.combined_stats=Seus implantes equipados estão combinando seus poderes, aumentando sua sorte em _%s%%_ no total.
items.rings.ringofwealth.upgrade_stat_name_1=Aumento de sorte
items.rings.ringofwealth.desc=Este implante analisa o terreno e os restos dos inimigos em busca de material valioso, aumentando a chance de encontrar itens melhores. Um implante corrompido reduz essa chance.
