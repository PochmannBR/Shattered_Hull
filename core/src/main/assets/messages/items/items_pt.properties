items.hull.renegado.hab_salto=salto
items.hull.renegado.cem_surto_log=O enxame tomou conta! Surto!
items.hull.renegado.cem_mutacao_log=O enxame tomou parte do seu corpo.
items.hull.renegado.prompt_garras=Rasgue um inimigo ao lado
items.hull.renegado.hab_estilhacos=estilhaços
items.hull.renegado.cem_surto=O medidor estourou a tolerância e o enxame tomou conta do seu corpo. Por alguns turnos você fica mais forte e mais rápido, mas ataca o que estiver mais perto, inclusive aliados, e não usa itens.\n\nDepois do surto, o medidor volta para o piso.\n\n_Da próxima vez que estourar, antes de matar um chefe, uma amostra vai se fundir ao seu corpo._
items.hull.injetorsupressor.desc=Um coquetel experimental que segura o tecido do enxame. Baixa o medidor de assimilação do Renegado, sem passar do piso.\n\nO fabricador médico monta injetores supressores para o Renegado, e a bancada de síntese faz um a partir de um injetor de cura e de carne do enxame.
items.hull.renegado.prompt_salto=Escolha onde cair
items.hull.renegado.cem_titulo=Tolerância estourada
items.hull.renegado.mutacao_escolha=O medidor estourou a tolerância de novo. Escolha qual parte do corpo o enxame toma. Uma amostra mutada fica mais forte, mas não pode mais ser trocada e traz um defeito. Um lugar vazio vira tecido do enxame, sem habilidade.
items.hull.renegado.surto_itens=O surto não deixa você usar itens nem amostras.
items.hull.renegado$surto.name=Surto
items.hull.renegado.lista=Medidor de assimilação: %d. O número ao lado de cada habilidade é quanto ela sobe o medidor.
items.hull.renegado.amostra_tunel=escavador
items.hull.renegado$formaenxame.name=Forma do enxame
items.hull.renegado.ejetar_desc=A amostra ejetada se perde, e o medidor baixa 15.
items.hull.renegado.cem_mutacao=Uma parte do seu corpo agora pertence ao enxame. Ela fica assim até o fim da missão.\n\nCabeça mutada: a feromante passa a funcionar em você. Braços: menos precisão. Tronco: fraqueza a fogo. Pernas: menos velocidade.\n\n_Cada vez que a tolerância estourar antes de você matar um chefe, outra parte muta._
items.hull.renegado.prompt_mandibulas=Morda um inimigo ao lado
items.hull.renegado.amostra_gelatinoso=gosma do enxame
items.hull.renegado.cem_quarta_log=As quatro partes do seu corpo são do enxame. A próxima é o fim.
items.hull.amostraitem.ac_instalar=INSTALAR
items.hull.renegado.ejetar=Ejetar amostra
items.hull.renegado.hab_placa=placa
items.hull.renegado.hab_proboscide=probóscide
items.hull.amostraitem.travado=Esse lugar já pertence ao enxame.
items.hull.renegado.prompt_muco=Golpeie um inimigo ao lado
items.hull.renegado.lugar_cabeca=Cabeça
items.hull.renegado$medidor.desc=O quanto do seu corpo responde ao enxame. Sobe com as habilidades das amostras, com carne do enxame e com dano de ácido ou de esporos.\n\nMedidor: %1$d. Piso: %2$d. Surto em %4$d. Vezes que a tolerância estourou desde o último chefe: %3$d.\n\nAcima de 50, mais dano e injetores de cura mais fracos. Acima de 75, dano bem maior, o enxame às vezes hesita em atacar e os assimilados vêm atrás de você.\n\nO medidor enche em 100, mas aguenta um pouco além disso. Essa tolerância cresce 3 por nível.\n
items.hull.renegado.hab_mandibulas=mandíbulas
