items.armor.armor.glyph_hardened=Foi _endurecido._
items.armor.armor.hardened_no_glyph=Esta armadura foi _endurecida_, mas atualmente não está inscrita com um revestimento.
items.armor.armor.cursed_worn=Esta armadura está corrompida. Você é incapaz de removê-la.
items.armor.armor.cursed=Você consegue sentir um código corrompido rodando dentro desta armadura.
items.armor.armor.weak_cursed=Apesar da corrupção, você é capaz de remover esta armadura.
items.armor.armor.not_cursed=Esta armadura está livre de corrupção
items.armor.armor.seal_attached=O gerador de escudo do Fuzileiro está fixado a esta armadura. Quando ele estiver prestes a ser ferido para menos da metade da sua vida, será concedido-lhe _%d de blindagem_.
items.armor.armor.seal_transfer=O gerador de escudo do Fuzileiro deve ser afixado à armadura que ele está usando para beneficiá-lo. Você gostaria de desprender automaticamente o gerador da armadura que está retirando e afixá-lo à armadura que está equipando?
