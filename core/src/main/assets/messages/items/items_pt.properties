items.armor.armor.equip_cursed=A armadura se contrai à sua volta dolorosamente.
items.armor.armor.identify=Você está acostumado com sua armadura o suficiente para identificá-la.
items.armor.armor.hardening_gone=O endurecimento desta armadura acabou!
items.armor.armor.incompatible=A interferência entre sistemas diferentes anulou o revestimento desta armadura!
items.armor.armor.curr_absorb=Esta armadura de _tier-%1$d_ bloqueia _%2$d-%3$d de dano_ e precisa de _%4$d de força_ para ser usada apropriadamente.
items.armor.armor.avg_absorb=Normalmente, esta armadura de _tier-%1$d_ bloqueia _%2$d-%3$d de dano_ e precisa de _%4$d de força_ para ser usada apropriadamente.
items.armor.armor.too_heavy=Devido à sua força inadequada, vestir esta armadura irá diminuir sua habilidade de se mover, esquivar e defender.
items.armor.armor.probably_too_heavy=Esta armadura é provavelmente muito pesada para você.
items.armor.armor.excess_str=Devido ao seu excesso de força, você é _mais evasivo_ enquanto usa esta armadura.
items.armor.armor.evasion=Possui alteração para melhorar _evasão._
items.armor.armor.defense=Possui alteração para aumentar a _defesa._
