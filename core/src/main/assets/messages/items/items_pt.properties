items.hull.suppressedpistol.name=pistola com supressor
items.hull.suppressedpistol.desc=A pistola das Forças especiais, com um supressor longo no cano. Ela usa o mesmo carregador de 12 disparos do fuzil e fica na mochila, pronta para o saque.\n\nO tiro não faz barulho. Ao contrário do fuzil, ela não atrai os inimigos em volta, e um alvo que não viu o atirador nem sabe de onde veio a bala.
