items.artifacts.sandalsofnature.desc_1=Botas de campo com um pequeno tanque de esporos no calcanhar. O tanque está quase vazio, talvez você precise alimentá-lo?
items.artifacts.sandalsofnature.desc_2=O tanque de esporos cresceu e as botas ganharam um tom esverdeado. Elas ainda podem melhorar?
items.artifacts.sandalsofnature.desc_3=As botas agora têm dois tanques cheios, e brotos surgem nas solas a cada passo. Talvez ainda possam crescer mais?
items.artifacts.sandalsofnature.desc_4=As botas chegaram ao tamanho máximo. Os tanques estão cheios e as solas parecem raízes grossas.
items.artifacts.sandalsofnature.desc_hint=Você sente os esporos se agitando nos tanques enquanto usa este módulo.
items.artifacts.sandalsofnature.desc_cursed=As botas corrompidas estão bloqueando os tanques de esporos.
items.artifacts.sandalsofnature.desc_ability=Linhas onduladas surgem nos calçados com a cor da última semente que você os alimentou. Eles podem enraizar-se brevemente no solo e produzir o efeito dessa planta em qualquer lugar em um raio de 3 quadrados.\nSemente: _%s_\nCarga necessária: _%d%%_
