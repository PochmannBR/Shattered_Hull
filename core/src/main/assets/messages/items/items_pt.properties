items.hull.sintetico.baixa_janela=Sua reserva está abaixo de 150. Ainda não há penalidade, mas se ela zerar você entra em _modo de economia_.\n\nAbata inimigos para recarregar, e evite gastar com habilidades que não sejam urgentes.
