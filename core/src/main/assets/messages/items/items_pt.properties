items.hull.sintetico$invadido.name=Invadido
items.hull.sintetico$invadido.desc=Esta máquina foi invadida pelo Sintético e luta do lado dele.\n\nTurnos restantes: %s.
items.hull.sintetico.injetor=O injetor não tem efeito no seu corpo sintético.
items.hull.sintetico$sobrecarga.fim=A sobrecarga acabou. A reserva caiu %d.
items.hull.sintetico$reserva.desc=A energia que mantém o seu corpo sintético funcionando. Cai um ponto por turno e volta com cada inimigo abatido. As habilidades do núcleo gastam daqui.\n\nEnergia: %1$d de %2$d.
items.hull.sintetico.intro=Você não sente fome. No lugar dela há uma _reserva de energia_, que cai um ponto por turno.\n\nCada inimigo abatido devolve energia: 25 por inimigo comum, 75 por campeão, e um chefe devolve metade da reserva máxima. Abates do seu drone e de máquinas invadidas valem a metade.\n\nAs habilidades do _núcleo sintético_ gastam da mesma reserva. Se ela zerar, você entra em _modo de economia_: fica mais lento, sem habilidades e sem regenerar a vida, até voltar a abater inimigos.
items.artifacts.holytome.ac_comandar=DRONE
items.hull.sintetico.intro_titulo=Protocolo do Sintético
items.hull.sintetico.economia=Reserva esgotada! Modo de economia ativado.
items.hull.sintetico.economia_descanso=Sem energia, descansar não repara o seu corpo. Recupere a reserva antes.
items.hull.sintetico$reserva.desc_economia=Com a reserva zerada, você anda mais devagar, não usa habilidades e não regenera a vida.
items.hull.sintetico.baixa_titulo=Reserva baixa
items.hull.sintetico$sobrecarga.desc=O núcleo está acima do limite. As habilidades custam metade e você se move mais rápido. No fim, a reserva cai de uma vez.\n\nTurnos restantes: %s.
items.waterskin.desc_reparos=Selante, fita condutora e uma pistola de solda, abastecidos com a biomassa que você recolhe pelo caminho. É assim que o Sintético conserta o próprio corpo.
items.hull.sintetico$reparo.desc=Seus sistemas estão consertando o corpo, recuperando 3% da vida máxima por turno.\n\nTurnos restantes: %d.
items.hull.renegado.sem_espaco=Não há espaço ali.
items.hull.renegado.prompt_bote=Escolha o alvo do bote
items.hull.renegado.prompt_pinca=Agarre um inimigo ao lado
