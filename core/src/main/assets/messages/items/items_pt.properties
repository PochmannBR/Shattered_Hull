items.honeypot$shatteredpot.name=casulo rompido
items.honeypot$shatteredpot.desc=Este casulo está rompido, e só a resina pegajosa ainda o mantém inteiro. Ele se desfaz aos poucos.\n\nMesmo assim, a vespa ainda quer proteger o casulo.
