#warrior
actors.hero.talent.hearty_meal.title=reinforced ration
actors.hero.talent.hearty_meal.desc=_+1:_ Eating food heals the Marine for _4 HP_ when he is at or below 33% health.\n\n_+2:_ Eating food heals the Marine for _6 HP_ when he is at or below 33% health.
actors.hero.talent.veterans_intuition.title=veteran's eye
actors.hero.talent.veterans_intuition.desc=_+1:_ The Marine identifies weapons _1.75x faster_ and armor _2.5x faster_.\n\n_+2:_ The Marine identifies weapons _2.5x faster_ and armor _when he equips it_.
actors.hero.talent.provoked_anger.title=provoked anger
actors.hero.talent.provoked_anger.desc=_+1:_ When any shielding buff applied to the Marine is broken by damage, his next physical attack will deal _3 bonus damage_.\n\n_+2:_ When any shielding buff applied to the Marine is broken by damage, his next physical attack will deal _5 bonus damage_.
actors.hero.talent.iron_will.title=reinforced shield
actors.hero.talent.iron_will.desc=_+1:_ The shield provided by the Marine's generator is _increased by 1_.\n\n_+2:_ The shield provided by the Marine's generator is _increased by 2_.
actors.hero.talent.iron_will.meta_desc=_If this talent is gained by a different hero_ it will passively grant a 1 or 2 max shield version of the Marine's shield generator effect.

actors.hero.talent.iron_stomach.title=iron stomach
actors.hero.talent.iron_stomach.desc=_+1:_ Eating food takes the Marine 1 turn and grants him _75% damage resistance_ while eating.\n\n_+2:_ Eating food takes the Marine 1 turn and grants him _100% damage resistance_ while eating.
actors.hero.talent.liquid_willpower.title=courage shot
actors.hero.talent.liquid_willpower.desc=_+1:_ The Marine gains _6.5% of his max HP in shielding_ when injecting or throwing a injector, brew, or elixir.\n\n_+2:_ The Marine gains _10% of his max HP in shielding_ when injecting or throwing a injector, brew, or elixir.\n\nThe shield amount is doubled when using injectors of strength, experience, or alchemy items that must be crafted using those injectors.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.runic_transference.title=glyph transfer
actors.hero.talent.runic_transference.desc=_+1:_ The Marine's shield generator can transfer _regular glyphs_ in the same way it transfers an upgrade.\n\n_+2:_ The Marine's shield generator can transfer _regular, powerful, and corruption glyphs_ in the same way it transfers an upgrade.\n\nThe generator can only transfer glyphs if they were applied to the armor when the generator was attached.
actors.hero.talent.runic_transference.meta_desc=_If this talent is gained by a different hero_ it will instead help glyphs on your armor resist being removed by modification kits. Glyphs will begin to be lost when upgrading from level 6(up from 4) at +1, or level 7(up from 4) at +2. The level where glyphs are guaranteed to be lost is unchanged at +8.
actors.hero.talent.lethal_momentum.title=lethal momentum
actors.hero.talent.lethal_momentum.desc=_+1:_ When the Marine lands a killing blow on an enemy with a physical weapon, it has a _67% chance_ to take 0 turns.\n\n_+2:_ When the Marine lands a killing blow on an enemy with a physical weapon, it has a _100% chance_ to take 0 turns.
actors.hero.talent.improvised_projectiles.title=improvised projectiles
actors.hero.talent.improvised_projectiles.desc=_+1:_ The Marine can blind an enemy for _2 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.\n\n_+2:_ The Marine can blind an enemy for _3 turns_ by throwing any item that isn’t a thrown weapon at them. This has a 50 turn cooldown.

actors.hero.talent.hold_fast.title=hold fast
actors.hero.talent.hold_fast.desc=_+1:_ When the Marine waits with his generator equipped he gains _1-2 armor_ and slows the decay of combo and shielding buffs by _50%_ until he moves.\n\n_+2:_ When the Marine waits with his generator equipped he gains _2-4 armor_ and slows the decay of combo and shielding buffs by _75%_ until he moves.\n\n_+3:_ When the Marine waits with his generator equipped he gains _3-6 armor_ and slows the decay of combo and shielding buffs by _100%_ until he moves.
actors.hero.talent.hold_fast.meta_desc=_If this talent is gained by a different hero_ it does not require the marine's generator, but cannot grant more armor than the tier of your equipped armor plus its level.
actors.hero.talent.strongman.title=brute strength
actors.hero.talent.strongman.desc=_+1:_ The Marine's strength is _increased by 8%_, rounded down.\n\n_+2:_ The Marine's strength is _increased by 13%_, rounded down.\n\n_+3:_ The Marine's strength is _increased by 18%_, rounded down.

actors.hero.talent.endless_rage.title=endless rage
actors.hero.talent.endless_rage.desc=_+1:_ The Vanguard can reach a max of _116% rage_.\n\n_+2:_ The Vanguard can reach a max of _133% rage_.\n\n_+3:_ The Vanguard can reach a max of _150% rage_.\n\nEach point of rage above 100% increases berserk shielding by 1% and reduces cooldown by 1%, but does not increase the damage bonus beyond +50%.
actors.hero.talent.deathless_fury.title=deathless fury
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk automatically triggers if the Vanguard is about to die and rage is at or above 100%, but it has a cooldown of _3 hero levels_ when this happens.\n\n_+2:_ Berserk automatically triggers if the Vanguard is about to die and rage is at or above 100%, but it has a cooldown of _2 hero levels_ when this happens.\n\n_+3:_ Berserk automatically triggers if the Vanguard is about to die and rage is at or above 100%, but it has a cooldown of _1 hero level_ when this happens.\n\nNote that the Vanguard will still die if he has 0 HP when berserking ends.
actors.hero.talent.enraged_catalyst.title=rage catalyst
actors.hero.talent.enraged_catalyst.desc=_+1:_ Enchantments and corruptions on the Vanguard's weapon trigger more often the more rage he has, to a maximum of _15% more often_ at 100% rage.\n\n_+2:_ Enchantments and corruptions on the Vanguard's weapon trigger more often the more rage he has, to a maximum of _30% more often_ at 100% rage.\n\n_+3:_ Enchantments and corruptions on the Vanguard's weapon trigger more often the more rage he has, to a maximum of _45% more often_ at 100% rage.

actors.hero.talent.cleave.title=next target
actors.hero.talent.cleave.desc=_+1:_ The extra time the Marksman gets on a kill is increased to _30 turns_, from 15.\n\n_+2:_ The extra time the Marksman gets on a kill is increased to _45 turns_, from 15.\n\n_+3:_ The extra time the Marksman gets on a kill is increased to _60 turns_, from 15.
actors.hero.talent.lethal_defense.title=lethal defense
actors.hero.talent.lethal_defense.desc=_+1:_ When the Marksman kills an enemy with a combo move, the cooldown on his shield generator shielding is _reduced by 50 turns_.\n\n_+2:_ When the Marksman kills an enemy with a combo move, the cooldown on his shield generator shielding is _reduced by 100 turns_.\n\n_+3:_ When the Marksman kills an enemy with a combo move, the cooldown on his shield generator shielding is _reduced by 150 turns_.\n\nThe shield cooldown can be reduced to as low as -150 turns by this talent, which means it will immediately be available again once it is activated.
actors.hero.talent.enhanced_combo.title=enhanced combo
actors.hero.talent.enhanced_combo.desc=_+1:_ When the Marksman's combo is 7 or higher, Clobber's knockback range increases to 3, it inflicts vertigo, and it can knock enemies into pits.\n\n_+2:_ In addition to the benefits of +1, when the Marksman's combo is 9 or higher Parry works on multiple attacks.\n\n_+3:_ In addition to the benefits of +1 and +2, the Marksman can leap up to combo/3 tiles when using Slam, Crush, or Fury.

actors.hero.talent.body_slam.title=body slam
actors.hero.talent.body_slam.desc=_+1:_ When the Marine lands after jumping, all adjacent enemies take damage equal to _1-4 plus 25%_ of his damage blocking power.\n\n_+2:_ When the Marine lands after jumping, all adjacent enemies take damage equal to _2-8 plus 50%_ of his damage blocking power.\n\n_+3:_ When the Marine lands after jumping, all adjacent enemies take damage equal to _3-12 plus 75%_ of his damage blocking power.\n\n_+4:_ When the Marine lands after jumping, all adjacent enemies take damage equal to _4-16 plus 100%_ of his damage blocking power.
actors.hero.talent.impact_wave.title=impact wave
actors.hero.talent.impact_wave.desc=_+1:_ When the Marine lands after jumping, all adjacent enemies are knocked _2 tiles_ back and have a _25% chance_ of becoming vulnerable for 5 turns.\n\n_+2:_ When the Marine lands after jumping, all adjacent enemies are knocked _3 tiles_ back and have a _50% chance_ of becoming vulnerable for 5 turns.\n\n_+3:_ When the Marine lands after jumping, all adjacent enemies are knocked _4 tiles_ back and have a _75% chance_ of becoming vulnerable for 5 turns.\n\n_+4:_ When the Marine lands after jumping, all adjacent enemies are knocked _5 tiles_ back and have a _100% chance_ of becoming vulnerable for 5 turns.
actors.hero.talent.double_jump.title=double jump
actors.hero.talent.double_jump.desc=_+1:_ If the Marine performs a second leap within 3 turns, that leap has a _16% reduced_ charge cost.\n\n_+2:_ If the Marine performs a second leap within 3 turns, that leap has a _30% reduced_ charge cost.\n\n_+3:_ If the Marine performs a second leap within 3 turns, that leap has a _40% reduced_ charge cost.\n\n_+4:_ If the Marine performs a second leap within 3 turns, that leap has a _50% reduced_ charge cost.

actors.hero.talent.expanding_wave.title=expanding wave
actors.hero.talent.expanding_wave.desc=_+1:_ Shockwave's range is increased to _6 tiles_ from 5, and its width is increased to _75 degrees_ from 60.\n\n_+2:_ Shockwave's range is increased to _7 tiles_ from 5, and its width is increased to _90 degrees_ from 60.\n\n_+3:_ Shockwave's range is increased to _8 tiles_ from 5, and its width is increased to _105 degrees_ from 60.\n\n_+4:_ Shockwave's range is increased to _9 tiles_ from 5, and its width is increased to _120 degrees_ from 60.
actors.hero.talent.striking_wave.title=striking wave
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave has a _30% chance_ to also use on-hit effects like enchantments and combo.\n\n_+2:_ Shockwave has a _60% chance_ to also use on-hit effects like enchantments and combo.\n\n_+3:_ Shockwave has a _90% chance_ to also use on-hit effects like enchantments and combo.\n\n_+4:_ Shockwave has a _100% chance_ to also use on-hit effects like enchantments and combo, and it gives enchantments _+20% power_.
actors.hero.talent.shock_force.title=shock force
actors.hero.talent.shock_force.desc=_+1:_ Shockwave deals _20% more damage_ and has a _25% chance_ to stun instead of cripple.\n\n_+2:_ Shockwave deals _40% more damage_ and has a _50% chance_ to stun instead of cripple.\n\n_+3:_ Shockwave deals _60% more damage_ and has a _75% chance_ to stun instead of cripple.\n\n_+4:_ Shockwave deals _80% more damage_ and has a _100% chance_ to stun instead of cripple.

actors.hero.talent.sustained_retribution.title=sustained retribution
actors.hero.talent.sustained_retribution.desc=_+1:_ The Marine deals _115% bonus damage_ spread over _2 hits_, instead of 100% bonus damage in 1 hit.\n\n_+2:_ The Marine deals _130% bonus damage_ spread over _3 hits_, instead of 100% bonus damage in 1 hit.\n\n_+3:_ The Marine deals _145% bonus damage_ spread over _4 hits_, instead of 100% bonus damage in 1 hit.\n\n_+4:_ The Marine deals _160% bonus damage_ spread over _5 hits_, instead of 100% bonus damage in 1 hit.
actors.hero.talent.shrug_it_off.title=shrug it off
actors.hero.talent.shrug_it_off.desc=_+1:_ The Marine's damage reduction while enduring is _increased to 60%_, from 50%.\n\n_+2:_ The Marine's damage reduction while enduring is _increased to 68%_, from 50%.\n\n_+3:_ The Marine's damage reduction while enduring is _increased to 74%_, from 50%.\n\n_+4:_ The Marine's damage reduction while enduring is _increased to 80%_, from 50%.
actors.hero.talent.even_the_odds.title=even the odds
actors.hero.talent.even_the_odds.desc=_+1:_ The Marine deals an additional _5% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+2:_ The Marine deals an additional _10% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+3:_ The Marine deals an additional _15% bonus damage_ for every enemy within 2 tiles when enduring ends.\n\n_+4:_ The Marine deals an additional _20% bonus damage_ for every enemy within 2 tiles when enduring ends.

#mage
actors.hero.talent.empowering_meal.title=empowering meal
actors.hero.talent.empowering_meal.desc=_+1:_ Eating food grants the Mage _2 bonus damage_ on the next 3 times he deals damage with a special weapon.\n\n_+2:_ Eating food grants the Mage _3 bonus damage_ on the next 3 times he deals damage with a special weapon.
actors.hero.talent.scholars_intuition.title=scholar's intuition
actors.hero.talent.scholars_intuition.desc=_+1:_ The Mage identifies special weapons _3x faster_.\n\n_+2:_ The Mage identifies special weapons _when he uses them_.
actors.hero.talent.lingering_magic.title=lingering magic
actors.hero.talent.lingering_magic.desc=_+1:_ When the Mage zaps with a special weapon or staff, his next physical attack deals _1-2 bonus damage_.\n\n_+2:_ When the Mage zaps with a special weapon or staff, his next physical attack deals _2 bonus damage_.
actors.hero.talent.backup_barrier.title=backup barrier
actors.hero.talent.backup_barrier.desc=_+1:_ The Mage gains _3 shielding_ whenever he spends the last charge in his staff.\n\n_+2:_ The Mage gains _5 shielding_ whenever he spends the last charge in his staff.
actors.hero.talent.backup_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead trigger from the hero's highest level special weapon.

actors.hero.talent.energizing_meal.title=energizing meal
actors.hero.talent.energizing_meal.desc=_+1:_ Eating food takes the Mage 1 turn and grants him _5 turns of special weapon recharging_.\n\n_+2:_ Eating food takes the Mage 1 turn and grants him _8 turns of special weapon recharging_.
actors.hero.talent.inscribed_power.title=inscribed power
actors.hero.talent.inscribed_power.desc=_+1:_ When the Mage runs a cartridge or uses a spell item, his _next 2 special weapon zaps_ get +2 levels.\n\n_+2:_ When the Mage runs a cartridge or uses a spell item, his _next 3 special weapon zaps_ get +2 levels.\n\nThe number of enhanced special weapon zaps is doubled when using a modification kit, transmutation, or alchemy items that must be crafted using those cartridges.\n\nFor alchemy items with higher output quantities (e.g. most spells), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.wand_preservation.title=special weapon preservation
actors.hero.talent.wand_preservation.desc=_+1:_ When the Mage imbues a new special weapon into his staff, the old special weapon is returned at +0, _but this can only be done once._\n\n_+2:_ When the Mage imbues a new special weapon into his staff, the old special weapon is returned at +0, _this can be repeated with a one hero level cooldown._
actors.hero.talent.wand_preservation.meta_desc=_If this talent is gained by a different hero_ it will instead increase the amount of arcane resin gained when putting a special weapon into an alchemy pot by 1 at +1, or by 2 at +2.
actors.hero.talent.arcane_vision.title=arcane vision
actors.hero.talent.arcane_vision.desc=_+1:_ When the Mage zaps an enemy, he gains mind vision on them for _10 turns_.\n\n_+2:_ When the Mage zaps an enemy, he gains mind vision on them for _15 turns_.
actors.hero.talent.shield_battery.title=shield battery
actors.hero.talent.shield_battery.desc=_+1:_ The Mage can self-target with a special weapon to convert all of its charges into shielding at a rate of _4% max HP per charge_.\n\n_+2:_ The Mage can self-target with a special weapon to convert all of its charges into shielding at a rate of _6% max HP per charge_.

actors.hero.talent.desperate_power.title=desperate power
actors.hero.talent.desperate_power.desc=_+1:_ The Mage's special weapons and staff gain _+1 level_ on their final zap when they are down to their last charge.\n\n_+2:_ The Mage's special weapons and staff gain _+2 levels_ on their final zap when they are down to their last charge.\n\n_+3:_ The Mage's special weapons and staff gain _+3 levels_ on their final zap when they are down to their last charge.
actors.hero.talent.ally_warp.title=ally warp
actors.hero.talent.ally_warp.desc=_+1:_ The Mage can select an ally to instantly swap places with them, with a _2 tile range_.\n\n_+2:_ The Mage can select an ally to instantly swap places with them, with a _4 tile range_.\n\n_+3:_ The Mage can select an ally to instantly swap places with them, with a _6 tile range_.\n\nThe Mage cannot swap places with immobile allies.

actors.hero.talent.empowered_strike.title=empowered strike
actors.hero.talent.empowered_strike.desc=_+1:_ The Battlemage's first melee strike with his staff after zapping with it deals _+16% damage_ and the staff's bonus effect gets _+50% power_.\n\n_+2:_ The Battlemage's first melee strike with his staff after zapping with it deals _+33% damage_ and the staff's bonus effect gets _+100% power_.\n\n_+3:_ The Battlemage's first melee strike with his staff after zapping with it deals _+50% damage_ and the staff's bonus effect gets _+150% power_.
actors.hero.talent.mystical_charge.title=mystical charge
actors.hero.talent.mystical_charge.desc=_+1:_ Striking with his staff grants the Battlemage _0.5 turns_ worth of module recharging.\n\n_+2:_ Striking with his staff grants the Battlemage _1 turn_ worth of module recharging.\n\n_+3:_ Striking with his staff grants the Battlemage _1.5 turns_ worth of module recharging.
actors.hero.talent.excess_charge.title=excess charge
actors.hero.talent.excess_charge.desc=_+1:_ When the Battlemage's staff is fully charged, its next zap will grant him _0.67 shielding_ per level of the staff.\n\n_+2:_ When the Battlemage's staff is fully charged, its next zap will grant him _1.33 shielding_ per level of the staff.\n\n_+3:_ When the Battlemage's staff is fully charged, its next zap will grant him _2 shielding_ per level of the staff.

actors.hero.talent.soul_siphon.title=soul siphon
actors.hero.talent.soul_siphon.desc=_+1:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _13% effectiveness_.\n\n_+2:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _27% effectiveness_.\n\n_+3:_ Physical damage dealt by other characters triggers the Warlock's soul mark at _40% effectiveness_.
actors.hero.talent.soul_eater.title=soul eater
actors.hero.talent.soul_eater.desc=_+1:_ Soul mark grants _0.33 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _10% chance_ to trigger on-eat effects when they die.\n\n_+2:_ Soul mark grants _0.67 turns_ of satiety for each physical damage dealt. Soul marked enemies have a _20% chance_ to trigger on-eat effects when they die.\n\n_+3:_ Soul mark grants _1 turn_ of satiety for each physical damage dealt. Soul marked enemies have a _30% chance_ to trigger on-eat effects when they die.
actors.hero.talent.necromancers_minions.title=necromancer's minions
actors.hero.talent.necromancers_minions.desc=_+1:_ When a soul marked enemy dies, the Warlock has a _13% chance_ to raise them as a corrupted wraith.\n\n_+2:_ When a soul marked enemy dies, the Warlock has a _27% chance_ to raise them as a corrupted wraith.\n\n_+3:_ When a soul marked enemy dies, the Warlock has a _40% chance_ to raise them as a corrupted wraith.

actors.hero.talent.blast_radius.title=blast radius
actors.hero.talent.blast_radius.desc=_+1:_ Elemental blast's radius is increased to _5 tiles_, from 4.\n\n_+2:_ Elemental blast's radius is increased to _6 tiles_, from 4.\n\n_+3:_ Elemental blast's radius is increased to _7 tiles_, from 4.\n\n_+4:_ Elemental blast's radius is increased to _8 tiles_, from 4.
actors.hero.talent.elemental_power.title=elemental power
actors.hero.talent.elemental_power.desc=_+1:_ The power of elemental blast is increased by _25%_.\n\n_+2:_ The power of elemental blast is increased by _50%_.\n\n_+3:_ The power of elemental blast is increased by _75%_.\n\n_+4:_ The power of elemental blast is increased by _100%_.
actors.hero.talent.reactive_barrier.title=reactive barrier
actors.hero.talent.reactive_barrier.desc=_+1:_ The Mage gains _2.5 shielding_ for every character affected by elemental blast, to a max of 5 characters.\n\n_+2:_ The Mage gains _5 shielding_ for every character affected by elemental blast, to a max of 6 characters.\n\n_+3:_ The Mage gains _7.5 shielding_ for every character affected by elemental blast, to a max of 7 characters.\n\n_+4:_ The Mage gains _10 shielding_ for every character affected by elemental blast, to a max of 8 characters.

actors.hero.talent.wild_power.title=wild power
actors.hero.talent.wild_power.desc=_+1:_ When using wild magic, special weapons will be boosted by either _2 or 3, up to +4_.\n\n_+2:_ When using wild magic, special weapons will be boosted by _3, up to +5_.\n\n_+3:_ When using wild magic, special weapons will be boosted by either _3 or 4, up to +6_.\n\n_+4:_ When using wild magic, special weapons will be boosted by _4, up to +7_.
actors.hero.talent.fire_everything.title=fire everything
actors.hero.talent.fire_everything.desc=_+1:_ Wild magic now fires _5 times_ up from 4, and each special weapon has a _25% chance_ to be usable 3 times.\n\n_+2:_ Wild magic now fires _6 times_ up from 4, and each special weapon has a _50% chance_ to be usable 3 times.\n\n_+3:_ Wild magic now fires _7 times_ up from 4, and each special weapon has a _75% chance_ to be usable 3 times.\n\n_+4:_ Wild magic now fires _8 times_ up from 4, and each special weapon has a _100% chance_ to be usable 3 times.
actors.hero.talent.conserved_magic.title=conserved magic
actors.hero.talent.conserved_magic.desc=_+1:_ Each zap from wild magic now uses _0.33 charges_ instead of 0.5, and wild magic has a _25% chance_ to not spend a turn.\n\n_+2:_ Each zap from wild magic now uses _0.225 charges_ instead of 0.5, and wild magic has a _50% chance_ to not spend a turn.\n\n_+3:_ Each zap from wild magic now uses _0.15 charges_ instead of 0.5, and wild magic has a _75% chance_ to not spend a turn.\n\n_+4:_ Each zap from wild magic now uses _0.1 charges_ instead of 0.5, and wild magic has a _100% chance_ to not spend a turn.

actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.telefrag.desc=_+1:_ If the Mage warps into another character he deals _10-15 damage_ to it, but also takes _5 damage_.\n\n_+2:_ If the Mage warps into another character he deals _20-30 damage_ to it, but also takes _10 damage_.\n\n_+3:_ If the Mage warps into another character he deals _30-45 damage_ to it, but also takes _15 damage_.\n\n_+4:_ If the Mage warps into another character he deals _40-60 damage_ to it, but also takes _20 damage_.\n\nThe hero cannot be killed by this talent, the self damage can be reduced by magic resisting effects.
actors.hero.talent.remote_beacon.title=Remote Beacon
actors.hero.talent.remote_beacon.desc=_+1:_ The Mage can place a beacon at any location within _4 tiles_.\n\n_+2:_ The Mage can place a beacon at any location within _8 tiles_.\n\n_+3:_ The Mage can place a beacon at any location within _12 tiles_.\n\n_+4:_ The Mage can place a beacon at any location within _16 tiles_.\n\nThe Mage cannot place beacons in locations that are inaccessible.
actors.hero.talent.longrange_warp.title=Longrange Warp
actors.hero.talent.longrange_warp.desc=_+1:_ The Mage can now warp between floors, at _150% charge cost_.\n\n_+2:_ The Mage can now warp between floors, at _117% charge cost_.\n\n_+3:_ The Mage can now warp between floors, at _83% charge cost_.\n\n_+4:_ The Mage can now warp between floors, at _50% charge cost_.\n\nThe Mage cannot use longrange warp to leave a locked floor.

#rogue
actors.hero.talent.cached_rations.title=reserve rations
actors.hero.talent.cached_rations.desc=_+1:_ The operator can find _2 emergency rations_ hidden in chests over the next few sectors.\n\n_+2:_ The operator can find _3 emergency rations_ hidden in chests over the next few sectors.\n\nEmergency rations are eaten quickly, restore some satiety, heal 5 HP and restore 1 charge to the active camo module.
actors.hero.talent.thiefs_intuition.title=field intuition
actors.hero.talent.thiefs_intuition.desc=_+1:_ The operator identifies implants _2x faster_, and learns the type of an implant _when he installs it_.\n\n_+2:_ The operator identifies implants _when he installs them_, and learns the type of an implant _when he picks it up_.
actors.hero.talent.sucker_punch.title=sucker punch
actors.hero.talent.sucker_punch.desc=_+1:_ The operator deals _1-2 bonus damage_ the first time he surprise attacks an enemy.\n\n_+2:_ The operator deals _2 bonus damage_ the first time he surprise attacks an enemy.
actors.hero.talent.protective_shadows.title=protective camo
actors.hero.talent.protective_shadows.desc=_+1:_ The operator gains one shielding _every other turn_ he is invisible, _to a max of 3_.\n\n_+2:_ The operator gains one shielding _every turn_ he is invisible, _to a max of 5_.

actors.hero.talent.mystical_meal.title=energy ration
actors.hero.talent.mystical_meal.desc=_+1:_ Eating takes the operator 1 turn, and emergency rations are instant. The meal grants _3 turns of module recharging_.\n\n_+2:_ Eating takes the operator 1 turn, and emergency rations are instant. The meal grants _5 turns of module recharging_.\n\nThis talent cannot make the ration synthesizer recharge itself.
actors.hero.talent.inscribed_stealth.title=stealth cartridge
actors.hero.talent.inscribed_stealth.desc=_+1:_ The operator gains _3 turns_ of invisibility after running a data cartridge or using an effect item.\n\n_+2:_ The operator gains _5 turns_ of invisibility after running a data cartridge or using an effect item.\n\nThe invisibility lasts twice as long with the modification kit, the cartridge of transmutation, and lab items crafted from them.\n\nFor lab items produced in larger quantities, this talent has a chance to trigger based on how many are made.
actors.hero.talent.wide_search.title=wide sweep
actors.hero.talent.wide_search.desc=_+1:_ The operator's search radius grows from a 5x5 square to a _7x7 circle_.\n\n_+2:_ The operator's search radius grows from a 5x5 square to a _7x7 square_.
actors.hero.talent.wide_search.meta_desc=_If this talent is gained by a different hero_ it will instead increase their search radius from a 3x3 square to a 5x5 circle at +1, or a 5x5 square at +2.
actors.hero.talent.silent_steps.title=silent steps
actors.hero.talent.silent_steps.desc=_+1:_ The operator will not wake sleeping enemies while he is _3 or more tiles away from them_.\n\n_+2:_ The operator will not wake sleeping enemies while he is _not adjacent to them_.
actors.hero.talent.rogues_foresight.title=operator's instinct
actors.hero.talent.rogues_foresight.desc=_+1:_ On a sector with a secret room, the operator has a _75% chance to notice_ that the sector holds a secret.\n\n_+2:_ On a sector with a secret room, the operator has a _100% chance to notice_ that the sector holds a secret.

actors.hero.talent.light_cloak.title=portable camo
actors.hero.talent.light_cloak.desc=_+1:_ The operator can use his active camo module without installing it, but it recharges at _25% speed_ when not installed.\n\n_+2:_ The operator can use his active camo module without installing it, but it recharges at _50% speed_ when not installed.\n\n_+3:_ The operator can use his active camo module without installing it, but it recharges at _75% speed_ when not installed.
actors.hero.talent.light_cloak.meta_desc=_If this talent is gained by a different hero_ it will instead increase the charging speed of all modules by 7/13/20% at +1/+2/+3.

actors.hero.talent.enhanced_lethality.title=enhanced lethality
actors.hero.talent.enhanced_lethality.desc=_+1:_ The Eliminator can eliminate enemies below _4/13/27/67% health_ per level of preparation, up from 3/10/20/50%.\n\n_+2:_ The Eliminator can eliminate enemies below _5/17/33/83% health_ per level of preparation, up from 3/10/20/50%.\n\n_+3:_ The Eliminator can eliminate enemies below _6/20/40/100% health_ per level of preparation, up from 3/10/20/50%.
actors.hero.talent.assassins_reach.title=eliminator's reach
actors.hero.talent.assassins_reach.desc=_+1:_ The Eliminator's blink range per level of preparation increases to _1/3/4/6 tiles_, from 1/2/3/4.\n\n_+2:_ The Eliminator's blink range per level of preparation increases to _2/4/6/8 tiles_, from 1/2/3/4.\n\n_+3:_ The Eliminator's blink range per level of preparation increases to _2/5/7/10 tiles_, from 1/2/3/4.\n\nThis blink can pass over hazards and enemies, but not through walls.
actors.hero.talent.bounty_hunter.title=bounty hunter
actors.hero.talent.bounty_hunter.desc=_+1:_ When the Eliminator kills an enemy with a prepared strike, its item drop chance increases by _2/4/8/16%_ per level of preparation.\n\n_+2:_ When the Eliminator kills an enemy with a prepared strike, its item drop chance increases by _4/8/16/32%_ per level of preparation.\n\n_+3:_ When the Eliminator kills an enemy with a prepared strike, its item drop chance increases by _6/12/24/48%_ per level of preparation.

actors.hero.talent.evasive_armor.title=evasive armor
actors.hero.talent.evasive_armor.desc=_+1:_ While sprinting, the Scout gains _+1 evasion_ per excess point of strength on his armor.\n\n_+2:_ While sprinting, the Scout gains _+2 evasion_ per excess point of strength on his armor.\n\n_+3:_ While sprinting, the Scout gains _+3 evasion_ per excess point of strength on his armor.
actors.hero.talent.projectile_momentum.title=shooting on the move
actors.hero.talent.projectile_momentum.desc=_+1:_ While sprinting, the Scout gains _+50% accuracy and +15% damage_ with the pistol and thrown weapons.\n\n_+2:_ While sprinting, the Scout gains _+100% accuracy and +30% damage_ with the pistol and thrown weapons.\n\n_+3:_ While sprinting, the Scout gains _+150% accuracy and +45% damage_ with the pistol and thrown weapons.
actors.hero.talent.speedy_stealth.title=speedy stealth
actors.hero.talent.speedy_stealth.desc=_+1:_ The Scout gains 2 momentum charges per turn while invisible.\n\n_+2:_ In addition to the +1 effect, sprinting does not count down while the Scout is invisible.\n\n_+3:_ In addition to the +1 and +2 effects, the Scout moves at double speed while invisible, sprinting or not.

actors.hero.talent.hasty_retreat.title=hasty retreat
actors.hero.talent.hasty_retreat.desc=_+1:_ After jumping, the operator gains _1 turn_ of haste and invisibility.\n\n_+2:_ After jumping, the operator gains _2 turns_ of haste and invisibility.\n\n_+3:_ After jumping, the operator gains _3 turns_ of haste and invisibility.\n\n_+4:_ After jumping, the operator gains _4 turns_ of haste and invisibility.
actors.hero.talent.body_replacement.title=decoy
actors.hero.talent.body_replacement.desc=_+1:_ After jumping, the operator leaves behind an inflatable decoy with _20 health and 1-3 armor_.\n\n_+2:_ After jumping, the operator leaves behind an inflatable decoy with _40 health and 2-6 armor_.\n\n_+3:_ After jumping, the operator leaves behind an inflatable decoy with _60 health and 3-9 armor_.\n\n_+4:_ After jumping, the operator leaves behind an inflatable decoy with _80 health and 4-12 armor_.\n\nOnly one decoy can be active at a time.
actors.hero.talent.shadow_step.title=smoke step
actors.hero.talent.shadow_step.desc=_+1:_ If the operator uses the smoke grenade while invisible, the jump is instant and costs _16% less_ charge, but it does not blind enemies or trigger other talents.\n\n_+2:_ If the operator uses the smoke grenade while invisible, the jump is instant and costs _30% less_ charge, but it does not blind enemies or trigger other talents.\n\n_+3:_ If the operator uses the smoke grenade while invisible, the jump is instant and costs _41% less_ charge, but it does not blind enemies or trigger other talents.\n\n_+4:_ If the operator uses the smoke grenade while invisible, the jump is instant and costs _50% less_ charge, but it does not blind enemies or trigger other talents.

actors.hero.talent.fear_the_reaper.title=panic
actors.hero.talent.fear_the_reaper.desc=_+1:_ When a designated enemy reaches 0 HP, it becomes _crippled_.\n\n_+2:_ When a designated enemy reaches 0 HP, it becomes _terrified and crippled_.\n\n_+3:_ When a designated enemy reaches 0 HP, it becomes _terrified and crippled_, and enemies within 3 tiles become _crippled_.\n\n_+4:_ When a designated enemy reaches 0 HP, it becomes _terrified and crippled_, and enemies within 3 tiles become _terrified and crippled_.
actors.hero.talent.deathly_durability.title=combat adrenaline
actors.hero.talent.deathly_durability.desc=_+1:_ Enemies killed by target designation give the operator shielding equal to _13%_ of the HP they had when designated.\n\n_+2:_ Enemies killed by target designation give the operator shielding equal to _25%_ of the HP they had when designated.\n\n_+3:_ Enemies killed by target designation give the operator shielding equal to _38%_ of the HP they had when designated.\n\n_+4:_ Enemies killed by target designation give the operator shielding equal to _50%_ of the HP they had when designated.
actors.hero.talent.double_mark.title=double designation
actors.hero.talent.double_mark.desc=_+1:_ Designating a second target together with the first costs _30% less_ charge.\n\n_+2:_ Designating a second target together with the first costs _50% less_ charge.\n\n_+3:_ Designating a second target together with the first costs _65% less_ charge.\n\n_+4:_ Designating a second target together with the first costs _75% less_ charge.

actors.hero.talent.shadow_blade.title=armed projection
actors.hero.talent.shadow_blade.desc=_+1:_ The holographic decoy gains _8%_ of the hero's damage per turn and has a _25% chance_ to use the enchantment on the hero's weapon.\n\n_+2:_ The holographic decoy gains _16%_ of the hero's damage per turn and has a _50% chance_ to use the enchantment on the hero's weapon.\n\n_+3:_ The holographic decoy gains _24%_ of the hero's damage per turn and has a _75% chance_ to use the enchantment on the hero's weapon.\n\n_+4:_ The holographic decoy gains _32%_ of the hero's damage per turn and has a _100% chance_ to use the enchantment on the hero's weapon.
actors.hero.talent.cloned_armor.title=projected armor
actors.hero.talent.cloned_armor.desc=_+1:_ The holographic decoy gains _12%_ of the hero's armor and has a _25% chance_ to use the glyph on the hero's armor.\n\n_+2:_ The holographic decoy gains _24%_ of the hero's armor and has a _50% chance_ to use the glyph on the hero's armor.\n\n_+3:_ The holographic decoy gains _36%_ of the hero's armor and has a _75% chance_ to use the glyph on the hero's armor.\n\n_+4:_ The holographic decoy gains _48%_ of the hero's armor and has a _100% chance_ to use the glyph on the hero's armor.
actors.hero.talent.perfect_copy.title=perfect copy
actors.hero.talent.perfect_copy.desc=_+1:_ The holographic decoy gains _10%_ of the hero's max HP and can instantly swap places with him up to _1 tile_ away.\n\n_+2:_ The holographic decoy gains _20%_ of the hero's max HP and can instantly swap places with him up to _2 tiles_ away.\n\n_+3:_ The holographic decoy gains _30%_ of the hero's max HP and can instantly swap places with him up to _3 tiles_ away.\n\n_+4:_ The holographic decoy gains _40%_ of the hero's max HP and can instantly swap places with him up to _4 tiles_ away.

#huntress
actors.hero.talent.natures_bounty.title=nature's bounty
actors.hero.talent.natures_bounty.desc=_+1:_ The Huntress can find _4 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\n_+2:_ The Huntress can find _6 berries_ hidden in tall grass as she explores the next few floors of the dungeon.\n\nBerries are eaten quickly, restore a small amount of satiety, and might contain a usable seed.
actors.hero.talent.survivalists_intuition.title=survivalist's intuition
actors.hero.talent.survivalists_intuition.desc=_+1:_ The Huntress identifies thrown weapons _3x faster_.\n\n_+2:_ The Huntress identifies thrown weapons _when she hits with them_.
actors.hero.talent.followup_strike.title=followup strike
actors.hero.talent.followup_strike.desc=_+1:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _2 bonus damage_.\n\n_+2:_ When the Huntress hits an enemy with her bow or a thrown weapon, her next melee attack against that enemy deals _3 bonus damage_.
actors.hero.talent.natures_aid.title=nature's aid
actors.hero.talent.natures_aid.desc=_+1:_ The Huntress gains 0-2 armor of barkskin, which fades every _3 turns_ when a plant's effect is activated in her vision.\n\n_+2:_ The Huntress gains 0-2 armor of barkskin, which fades every _5 turns_ when a plant's effect is activated in her vision.

actors.hero.talent.invigorating_meal.title=invigorating meal
actors.hero.talent.invigorating_meal.desc=_+1:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _1 turn of haste_.\n\n_+2:_ Eating food takes the Huntress 1 turn (berries are eaten instantly) and grants her _2 turns of haste_.
actors.hero.talent.liquid_nature.title=liquid nature
actors.hero.talent.liquid_nature.desc=_+1:_ When the Huntress injects or throws a injector, brew, or elixir, _up to 4 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _1 turn_.\n\n_+2:_ When the Huntress injects or throws a injector, brew, or elixir, _up to 6 grass tiles_ sprout in the surrounding area, and adjacent enemies are rooted for _2 turns_.\n\nThe amount of grass and root duration are doubled when using injectors of strength, experience, or alchemy items that must be crafted using those injectors.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.rejuvenating_steps.title=rejuvenating steps
actors.hero.talent.rejuvenating_steps.desc=_+1:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _10 turn cooldown_.\n\n_+2:_ When the Huntress steps on short grass or embers, they spring up into tall grass which the Huntress immediately furrows. This has a _5 turn cooldown_.\n\nThis talent will produce furrowed grass if passive regeneration effects are disabled or the hero has not gained exp in a long time.
actors.hero.talent.heightened_senses.title=heightened senses
actors.hero.talent.heightened_senses.desc=_+1:_ The Huntress gains mind vision on characters within _2 tiles of her position_.\n\n_+2:_ The Huntress gains mind vision on characters within _3 tiles of her position_.
actors.hero.talent.durable_projectiles.title=durable projectiles
actors.hero.talent.durable_projectiles.desc=_+1:_ Thrown weapons have _+50% durability_ when used by the Huntress.\n\n_+2:_ Thrown weapons have _+75% durability_ when used by the Huntress.

actors.hero.talent.point_blank.title=point blank
actors.hero.talent.point_blank.desc=_+1:_ When the Huntress uses her bow or a thrown weapon at melee range it has _-25% accuracy,_ instead of -50%.\n\n_+2:_ When the Huntress uses her bow or a thrown weapon at melee range it has _normal accuracy,_ instead of -50%.\n\n_+3:_ When the Huntress uses her bow or a thrown weapon at melee range it has _+25% accuracy,_ instead of -50%.\n\nNote that thrown weapons or the spirit bow always have +50% accuracy when used at a distance.
actors.hero.talent.seer_shot.title=seer shot
actors.hero.talent.seer_shot.desc=_+1:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _5 turns_. This has a 20 turn cooldown.\n\n_+2:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _10 turns_. This has a 20 turn cooldown.\n\n_+3:_ When the Huntress fires an arrow at the ground, it grants vision in a 3x3 area around it for _15 turns_. This has a 20 turn cooldown.
actors.hero.talent.seer_shot.meta_desc=_If this talent is gained by a different hero_ it will trigger from any thrown weapon.

actors.hero.talent.farsight.title=farsight
actors.hero.talent.farsight.desc=_+1:_ The Sniper's vision range is _increased by 25%_.\n\n_+2:_ The Sniper's vision range is _increased by 50%_.\n\n_+3:_ The Sniper's vision range is _increased by 75%_.
actors.hero.talent.shared_enchantment.title=shared enchantment
actors.hero.talent.shared_enchantment.desc=_+1:_ Thrown weapons have a _33% chance_ to use the enchantment on the Sniper's bow.\n\n_+2:_ Thrown weapons have a _67% chance_ to use the enchantment on the Sniper's bow.\n\n_+3:_ Thrown weapons have a _100% chance_ to use the enchantment on the Sniper's bow.\n\nThe bow's enchantment can trigger in addition to whatever enchantment the thrown weapon already has.
actors.hero.talent.shared_upgrades.title=shared upgrades
actors.hero.talent.shared_upgrades.desc=_+1:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by 16%, to a max of _2 turns and +33% damage at +2_.\n\n_+2:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by 16%, to a max of _4 turns and +67% damage at +4_.\n\n_+3:_ When the Sniper attacks with an upgraded thrown weapon, each level increases the duration of sniper's mark by 1 turn and the damage of her special attack by 16%, to a max of _6 turns and +100% damage at +6_.

actors.hero.talent.durable_tips.title=durable tips
actors.hero.talent.durable_tips.desc=_+1:_ Tipped darts have _2x durability_ when the Warden uses them.\n\n_+2:_ Tipped darts have _3x durability_ when the Warden uses them.\n\n_+3:_ Tipped darts have _4x durability_ when the Warden uses them.
actors.hero.talent.barkskin.title=barkskin
actors.hero.talent.barkskin.desc=_+1:_ When stepping on unfurrowed high grass or plants, the Warden gains _0-33% of her level_ in barkskin armor which fades every turn.\n\n_+2:_ When stepping on unfurrowed high grass or plants, the Warden gains _0-67% of her level_ in barkskin armor which fades every turn.\n\n_+3:_ When stepping on unfurrowed high grass or plants, the Warden gains _0-100% of her level_ in barkskin armor which fades every turn.
actors.hero.talent.shielding_dew.title=shielding dew
actors.hero.talent.shielding_dew.desc=_+1:_ Biomass can shield the Warden when her health is full, up to _20% of her max HP_.\n\n_+2:_ Biomass can shield the Warden when her health is full, up to _40% of her max HP_.\n\n_+3:_ Biomass can shield the Warden when her health is full, up to _60% of her max HP_.

actors.hero.talent.fan_of_blades.title=fan of blades
actors.hero.talent.fan_of_blades.desc=_+1:_ Spectral blades can hit up to _1 additional target_ for 50% damage. The target must be visible and within a _30 degree_ cone AOE.\n\n_+2:_ Spectral blades can hit up to _2 additional targets_ for 50% damage. The targets must be visible and within a _60 degree_ cone AOE.\n\n_+3:_ Spectral blades can hit up to _3 additional targets_ for 50% damage. The targets must be visible and within a _90 degree_ cone AOE.\n\n_+4:_ Spectral blades can hit up to _4 additional targets_ for 50% damage. The targets must be visible and within a _120 degree_ cone AOE.
actors.hero.talent.projecting_blades.title=projecting blades
actors.hero.talent.projecting_blades.desc=_+1:_ Spectral blades has _+25% accuracy_, and can penetrate up to _2 solid tiles_.\n\n_+2:_ Spectral blades has _+50% accuracy_, and can penetrate up to _4 solid tiles_.\n\n_+3:_ Spectral blades has _+75% accuracy_, and can penetrate up to _6 solid tiles_.\n\n_+4:_ Spectral blades has _+100% accuracy_, and can penetrate up to _8 solid tiles_.
actors.hero.talent.spirit_blades.title=spirit blades
actors.hero.talent.spirit_blades.desc=_+1:_ Spectral blades has a _30% chance_ to also use the enchantment on the spirit bow.\n\n_+2:_ Spectral blades has a _60% chance_ to also use the enchantment on the spirit bow.\n\n_+3:_ Spectral blades has a _90% chance_ to also use the enchantment on the spirit bow.\n\n_+4:_ Spectral blades has a _100% chance_ to also use the enchantment on the spirit bow, and it gives each enchantment _+10% power_.

actors.hero.talent.growing_power.title=growing power
actors.hero.talent.growing_power.desc=_+1:_ The attack and movespeed boosts from nature's power are increased to _38% and 125%_, from 33% and 100%.\n\n_+2:_ The attack and movespeed boosts from nature's power are increased to _42% and 150%_, from 33% and 100%.\n\n_+3:_ The attack and movespeed boosts from nature's power are increased to _46% and 175%_, from 33% and 100%.\n\n_+4:_ The attack and movespeed boosts from nature's power are increased to _50% and 200%_, from 33% and 100%.
actors.hero.talent.natures_wrath.title=nature's wrath
actors.hero.talent.natures_wrath.desc=_+1:_ While nature's power is active, shots from the spirit bow have an _8% chance_ to trigger a random harmful plant effect.\n\n_+2:_ While nature's power is active, shots from the spirit bow have a _17% chance_ to trigger a random harmful plant effect.\n\n_+3:_ While nature's power is active, shots from the spirit bow have an _25% chance_ to trigger a random harmful plant effect.\n\n_+4:_ While nature's power is active, shots from the spirit bow have a _33% chance_ to trigger a random harmful plant effect.\n\nThe plants that can be triggered are: blindweed, firebloom, icecap, sorrowmoss, and stormvine.
actors.hero.talent.wild_momentum.title=wild momentum
actors.hero.talent.wild_momentum.desc=_+1:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _1 turn_. The duration can be extended by a max of _2 turns_.\n\n_+2:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _2 turns_. The duration can be extended by a max of _4 turns_.\n\n_+3:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _3 turns_. The duration can be extended by a max of _6 turns_.\n\n_+4:_ Killing an enemy with the spirit bow prolongs the duration of nature's power by _4 turns_. The duration can be extended by a max of _8 turns_.

actors.hero.talent.eagle_eye.title=eagle eye
actors.hero.talent.eagle_eye.desc=_+1:_ The spirit hawk's vision range is increased to _7 tiles_ from 6.\n\n_+2:_ The spirit hawk's vision range is increased to _8 tiles_ from 6.\n\n_+3:_ The spirit hawk's vision range is increased to _9 tiles_ from 6, and it gets _2 tiles_ of mind vision.\n\n_+4:_ The spirit hawk's vision range is increased to _10 tiles_ from 6, and it gets _3 tiles_ of mind vision.
actors.hero.talent.go_for_the_eyes.title=go for the eyes
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Attacks from the spirit hawk blind enemies for _2 turns_.\n\n_+2:_ Attacks from the spirit hawk blind enemies for _5 turns_.\n\n_+3:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _2 turns_.\n\n_+4:_ Attacks from the spirit hawk blind enemies for _5 turns_ and cripple them for _5 turns_.
actors.hero.talent.swift_spirit.title=swift spirit
actors.hero.talent.swift_spirit.desc=_+1:_ The spirit hawk's movement speed is increased to _2.5 tiles_ from 2, and it is guaranteed to dodge the first _2 attacks_ made against it.\n\n_+2:_ The spirit hawk's movement speed is increased to _3 tiles_ from 2, and it is guaranteed to dodge the first _4 attacks_ made against it.\n\n_+3:_ The spirit hawk's movement speed is increased to _3.5 tiles_ from 2, and it is guaranteed to dodge the first _6 attacks_ made against it.\n\n_+4:_The spirit hawk's movement speed is increased to _4 tiles_ from 2, and it is guaranteed to dodge the first _8 attacks_ made against it.

#duelist
actors.hero.talent.strengthening_meal.title=strengthening meal
actors.hero.talent.strengthening_meal.desc=_+1:_ Eating food grants the Duelist 3 bonus damage the next _2 times_ she hits an enemy with a physical attack.\n\n_+2:_ Eating food grants the Duelist 3 bonus damage the next _3 times_ she hits an enemy with a physical attack.
actors.hero.talent.adventurers_intuition.title=adventurer's intuition
actors.hero.talent.adventurers_intuition.desc=_+1:_ The Duelist identifies weapons _2.5x faster_ and armor _1.75x faster_.\n\n_+2:_ The Duelist identifies weapons _when she equips them_ and armor _2.5x faster_.
actors.hero.talent.patient_strike.title=patient strike
actors.hero.talent.patient_strike.desc=_+1:_ If the Duelist waits before performing a melee attack, she will deal _1-2 bonus damage_.\n\n_+2:_ If the Duelist waits before performing a melee attack, she will deal _2 bonus damage_.
actors.hero.talent.aggressive_barrier.title=aggressive barrier
actors.hero.talent.aggressive_barrier.desc=_+1:_ The Duelist gains _3 shielding_ when she uses a weapon ability and is at or below 50% health.\n\n_+2:_ The Duelist gains _5 shielding_ when she uses a weapon ability and is at or below 50% health.
actors.hero.talent.aggressive_barrier.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding when making a melee attack at low health, with a 50 turn cooldown.

actors.hero.talent.focused_meal.title=focused meal
actors.hero.talent.focused_meal.desc=_+1:_ Eating food takes the Duelist 1 turn and grants her _0.67 charges_ on her weapons.\n\n_+2:_ Eating food takes the Duelist 1 turn and grants her _1 charge_ on her weapons.
actors.hero.talent.focused_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant bonus damage to their next hit equal to their level/3 at +1, or level/2 at +2.
actors.hero.talent.liquid_agility.title=liquid agility
actors.hero.talent.liquid_agility.desc=_+1:_ When injecting or throwing a injector, brew, or elixir, the Duelist has _3x evasion_, and has _3x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When injecting or throwing a injector, brew, or elixir, the Duelist has _infinite evasion_, and has _infinite accuracy_ on her next melee attack within 5 turns.\n\nThis bonus lasts for one additional turn and attack when using injectors of strength, experience, or alchemy items that must be crafted using those injectors.\n\nFor alchemy items with higher output quantities (e.g. aqua brew), this talent has a chance to trigger based on how many of that item is produced.
actors.hero.talent.weapon_recharging.title=weapon recharging
actors.hero.talent.weapon_recharging.desc=_+1:_ The Duelist gains one weapon charge every _15 turns_ when under the effect of special weapon or module recharging buffs.\n\n_+2:_ The Duelist gains one weapon charge every _10 turns_ when under the effect of special weapon or module recharging buffs.
actors.hero.talent.weapon_recharging.meta_desc=_If this talent is gained by a different hero_ it will instead cause them to deal +5% melee damage while recharging at +1, or +7.5% melee damage while recharging at +2.
actors.hero.talent.lethal_haste.title=lethal haste
actors.hero.talent.lethal_haste.desc=_+1:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _3 turns_ worth of instant movement.\n\n_+2:_ When the Duelist lands a killing blow on an enemy with a weapon ability, she gains _5 turns_ worth of instant movement.
actors.hero.talent.lethal_haste.meta_desc=_If this talent is gained by a different hero_ it will instead trigger with regular weapon attacks, with a 100 turn cooldown.
actors.hero.talent.swift_equip.title=swift equip
actors.hero.talent.swift_equip.desc=_+1:_ The Duelist can switch her equipped weapon instantly _one time_ every 20 turns.\n\n_+2:_ The Duelist can switch her equipped weapon instantly _two times_ every 20 turns.\n\nIf the Duelist has this talent and it is not on cooldown, quick-using an unequipped weapon will equip it.

actors.hero.talent.precise_assault.title=precise assault
actors.hero.talent.precise_assault.desc=_+1:_ When the Duelist uses a weapon ability, she gains _2x accuracy_ on her next melee attack within 5 turns.\n\n_+2:_ When the Duelist uses a weapon ability, she gains _5x accuracy_ on her next melee attack within 5 turns.\n\n_+3:_ When the Duelist uses a weapon ability, she gains _infinite accuracy_ on her next melee attack within 5 turns.
actors.hero.talent.precise_assault.meta_desc=_If this talent is gained by a different hero_ it will instead increase melee accuracy by 10% at +1, 20% at +2, or 30% at +3.
actors.hero.talent.deadly_followup.title=deadly followup
actors.hero.talent.deadly_followup.desc=_+1:_ When the Duelist hits an enemy with a thrown weapon, she will deal _10% more melee damage_ to them for 5 turns.\n\n_+2:_ When the Duelist hits an enemy with a thrown weapon, she will deal _20% more melee damage_ to them for 5 turns.\n\n_+3:_ When the Duelist hits an enemy with a thrown weapon, she will deal _30% more melee damage_ to them for 5 turns.

actors.hero.talent.varied_charge.title=varied charge
actors.hero.talent.varied_charge.desc=_+1:_ The Champion instantly regains _0.17 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+2:_ The Champion instantly regains _0.33 weapon charges_ when she uses two different weapon abilities, with no time limit.\n\n_+3:_ The Champion instantly regains _0.5 weapon charges_ when she uses two different weapon abilities, with no time limit.
actors.hero.talent.twin_upgrades.title=twin upgrades
actors.hero.talent.twin_upgrades.desc=_+1:_ If one of the Champion's two equipped weapons has a lower level and is _2 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+2:_ If one of the Champion's two equipped weapons has a lower level and is _1 or more tiers lower_ than the other weapon, it will be boosted to the other weapon's level.\n\n_+3:_ If one of the Champion's two equipped weapons has a lower level and is _the same tier or lower_ than the other weapon, it will be boosted to the other weapon's level.
actors.hero.talent.combined_lethality.title=combined lethality
actors.hero.talent.combined_lethality.desc=_+1:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 13% HP_.\n\n_+2:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 27% HP_.\n\n_+3:_ If the Champion attacks with a melee weapon immediately after using a different weapon's ability, that attack will execute any non-boss enemy left at _below 40% HP_.\n\nThis attack can be a regular melee weapon attack, or part of a weapon ability.

actors.hero.talent.unencumbered_spirit.title=unencumbered spirit
actors.hero.talent.unencumbered_spirit.desc=_+1:_ The Monk gains _50% more energy_ for each piece of _tier 3 or lower_ equipment she is using.\n\n_+2:_ The Monk gains _75% more energy_ for each piece of _tier 2 or lower_ equipment she is using. The tier 3 benefit is unchanged.\n\n_+3:_ The Monk gains _100% more energy_ for each piece of _tier 1 or lower_ equipment she is using. The tier 2 and 3 benefits are unchanged. She also gains a free standard uniform and studded gloves.\n\nNote that this talent gives no benefit from being unarmed or attacking with a Implant of Force.
actors.hero.talent.monastic_vigor.title=monastic vigor
actors.hero.talent.monastic_vigor.desc=_+1:_ If the Monk has _100% energy_, her abilities are empowered.\n\n_+2:_ If the Monk has _80% or more energy_, her abilities are empowered.\n\n_+3:_ If the Monk has _60% or more energy_, her abilities are empowered.\n\nWhen empowered:\n- Flurry applies your weapon's enchantment\n- Focus is instantaneous\n- Dash gains +4 range\n- Dragon Kick deals +50% damage and applies its knock back and stun effect to all adjacent enemies\n- Meditate slowly heals 20% of missing HP and grants 80% damage resistance.
actors.hero.talent.combined_energy.title=combined energy
actors.hero.talent.combined_energy.desc=_+1:_ If the Monk uses a weapon ability and a _4+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+2:_ If the Monk uses a weapon ability and a _3+ energy_ ability within 5 turns of each other, she regains 1 spent energy.\n\n_+3:_ If the Monk uses a weapon ability and a _2+ energy_ ability within 5 turns of each other, she regains 1 spent energy.

actors.hero.talent.close_the_gap.title=close the gap
actors.hero.talent.close_the_gap.desc=_+1:_ The Duelist blinks _up to two tiles_ toward her target when starting a duel.\n\n_+2:_ The Duelist blinks _up to three tiles_ toward her target when starting a duel.\n\n_+3:_ The Duelist blinks _up to four tiles_ toward her target when starting a duel.\n\n_+4:_ The Duelist blinks _up to five tiles_ toward her target when starting a duel.\n\nThis blink can go through hazards and enemies, but not solid terrain like walls. The blink is taken into account when determining if an enemy is in range to be challenged.
actors.hero.talent.invigorating_victory.title=invigorating victory
actors.hero.talent.invigorating_victory.desc=_+1:_ If the Duelist defeats her target before the duel ends, she heals for _5 HP plus 30% of the damage_ she took during the duel.\n\n_+2:_ If the Duelist defeats her target before the duel ends, she heals for _10 HP plus 50% of the damage_ she took during the duel.\n\n_+3:_ If the Duelist defeats her target before the duel ends, she heals for _15 HP plus 65% of the damage_ she took during the duel.\n\n_+4:_ If the Duelist defeats her target before the duel ends, she heals for _20 HP plus 75% of the damage_ she took during the duel.
actors.hero.talent.elimination_match.title=elimination match
actors.hero.talent.elimination_match.desc=_+1:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _16% reduced_ charge cost.\n\n_+2:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _30% reduced_ charge cost.\n\n_+3:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _40% reduced_ charge cost.\n\n_+4:_ If the Duelist challenges again within 3 turns of a duel ending, that challenge has a _50% reduced_ charge cost.

actors.hero.talent.elemental_reach.title=elemental reach
actors.hero.talent.elemental_reach.desc=_+1:_ Elemental strike's range is increased to _5 tiles_ from 4, and its width is increased to _75 degrees_ from 65.\n\n_+2:_ Elemental strike's range is increased to _6 tiles_ from 4, and its width is increased to _85 degrees_ from 65.\n\n_+3:_ Elemental strike's range is increased to _7 tiles_ from 4, and its width is increased to _95 degrees_ from 65.\n\n_+4:_ Elemental strike's range is increased to _8 tiles_ from 4, and its width is increased to _105 degrees_ from 65.
actors.hero.talent.striking_force.title=striking force
actors.hero.talent.striking_force.desc=_+1:_ The power of elemental strike's effect is increased by _30%_.\n\n_+2:_ The power of elemental strike's effect is increased by _60%_.\n\n_+3:_ The power of elemental strike's effect is increased by _90%_.\n\n_+4:_ The power of elemental strike's effect is increased by _120%_.
actors.hero.talent.directed_power.title=directed power
actors.hero.talent.directed_power.desc=_+1:_ The direct attack from elemental strike gains _+30% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+2:_ The direct attack from elemental strike gains _+60% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+3:_ The direct attack from elemental strike gains _+90% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.\n\n_+4:_ The direct attack from elemental strike gains _+120% enchantment power_ for each enemy in range of elemental strike's effect, including the attack target.

actors.hero.talent.feigned_retreat.title=feigned retreat
actors.hero.talent.feigned_retreat.desc=_+1:_ If an enemy attacks the Duelist's afterimage, she gains _2 turns_ of haste.\n\n_+2:_ If an enemy attacks the Duelist's afterimage, she gains _4 turns_ of haste.\n\n_+3:_ If an enemy attacks the Duelist's afterimage, she gains _6 turns_ of haste.\n\n_+4:_ If an enemy attacks the Duelist's afterimage, she gains _8 turns_ of haste.
actors.hero.talent.expose_weakness.title=expose weakness
actors.hero.talent.expose_weakness.desc=_+1:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _2 turns_.\n\n_+2:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _4 turns_.\n\n_+3:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _6 turns_.\n\n_+4:_ Enemies that attack the Duelist's afterimage become weak and vulnerable for _8 turns_.
actors.hero.talent.counter_ability.title=counter ability
actors.hero.talent.counter_ability.desc=_+1:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.38 charges_.\n\n_+2:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _0.77 charges_.\n\n_+3:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.13 charges_.\n\n_+4:_ If the Duelist uses a weapon ability within 3 turns of her afterimage being attacked, she will instantly regain _1.5 charges_.

#cleric
actors.hero.talent.satiated_spells.title=Satiated Spells
actors.hero.talent.satiated_spells.desc=_+1:_ Eating food causes the Cleric to gain _3 shielding_ the next time they cast a spell.\n\n_+2:_ Eating food causes the Cleric to gain _5 shielding_ the next time they cast a spell.
actors.hero.talent.satiated_spells.meta_desc=_If this talent is gained by a different hero_ it will instead grant shielding immediately, which will start to decay normally after 10 turns.
actors.hero.talent.holy_intuition.title=holy intuition
actors.hero.talent.holy_intuition.desc=_+1:_ The Cleric can cast _Holy Intuition,_ a spell that reveals whether an item is corrupted at the cost of _3 charges._\n\n_+2:_ The Cleric can cast _Holy Intuition,_ a spell that reveals whether an item is corrupted at the cost of _2 charges._
actors.hero.talent.holy_intuition.meta_desc=_If this talent is gained by a different hero_ it will instead let the hero identify the corruption status on a corrupted item just before equipping it, 15% of the time at +1 or 25% of the time at +2.
actors.hero.talent.searing_light.title=searing light
actors.hero.talent.searing_light.desc=_+1:_ The Cleric's physical attacks on enemies illuminated by _Guiding Light_ deal _+3 damage._\n\n_+2:_ The Cleric's physical attacks on enemies illuminated by _Guiding Light_ deal _+5 damage._
actors.hero.talent.searing_light.meta_desc=_If this talent is gained by a different hero_ it will instead grant its bonus damage after a special weapon or module is used on an enemy, with a 20 turn cooldown.
actors.hero.talent.shield_of_light.title=shield of light
actors.hero.talent.shield_of_light.desc=_+1:_ The Cleric can cast _Shield of Light,_ a spell that is cast instantly and grants them _2-4 armor_ against a target for 5 turns at the cost of 1 charge.\n\n_+2:_ The Cleric can cast _Shield of Light,_ a spell that is cast instantly and grants them _3-6 armor_ against a target for 5 turns at the cost of 1 charge.
actors.hero.talent.shield_of_light.meta_desc=_If this talent is gained by a different hero_ it will instead reduce physical damage taken from your targeted enemy by 1, 33% of the time at +1 or 50% of the time at +2.

actors.hero.talent.enlightening_meal.title=Enlightening Meal
actors.hero.talent.enlightening_meal.desc=_+1:_ Eating food takes the Cleric 1 turn and grants them _0.67 charges_ on their synthetic core.\n\n_+2:_ Eating food takes the Cleric 1 turn and grants them _1 charge_ on their synthetic core.
actors.hero.talent.enlightening_meal.meta_desc=_If this talent is gained by a different hero_ it will instead grant 2 turns of special weapon and module recharging at +1, or 3 turns at +2. This cannot be used to let the ration synthesizer recharge itself.
actors.hero.talent.recall_inscription.title=Recall Inscription
actors.hero.talent.recall_inscription.refunded=Your item was refunded!
actors.hero.talent.recall_inscription.desc=_+1:_ The Cleric can cast _Recall Inscription,_ a spell that lets them repeat the effect of the last runestone or cartridge they used within _10 turns._\n\n_+2:_ The Cleric can cast _Recall Inscription,_ a spell that lets them repeat the effect of the last runestone or cartridge they used within _300 turns._\n\nRecall Inscription cannot be used with modification kits. This spell's charge cost varies based on which item was used recently: 2 for a runestone, 3 for a cartridge, 4 for an exotic cartridge. This charge cost is also doubled when used with a cartridge of transmutation, or alchemy items that must be crafted using transmutation or upgrade.
actors.hero.talent.recall_inscription.meta_desc=_If this talent is gained by a different hero_ it will instead refund any cartridge or runestone 10% of the time at +1 or 15% of the time at +2. Modification Kits are exempt from this effect.
actors.hero.talent.sunray.title=Sunray
actors.hero.talent.sunray.desc=_+1:_ The Cleric can cast _Sunray,_ a spell that deals _4-8 damage_ and blinds the target for _4 turns,_ at the cost of 1 charge.\n\n_+2:_ The Cleric can cast _Sunray,_ a spell that deals _6-12 damage_ and blinds the target for _6 turns,_ at the cost of 1 charge.\n\nSunray can only blind each target once, but if the target is already blinded by Sunray then it paralyses instead. Sunray always deals maximum damage to demonic and undead foes.
actors.hero.talent.sunray.meta_desc=_If this talent is gained by a different hero_ it will instead cause special weapons and modules to blind enemies for 4 turns, 15% of the time at +1 or 25% of the time at +2.
actors.hero.talent.divine_sense.title=Divine Sense
actors.hero.talent.divine_sense.desc=_+1:_ The Cleric can cast _Divine Sense,_ a spell that grants them _8 tiles_ of Mind Vision for 50 turns and takes no time to cast, at the cost of 2 charges.\n\n_+2:_ The Cleric can cast _Divine Sense,_ a spell that grants them _12 tiles_ of Mind Vision for 50 turns and takes no time to cast, at the cost of 2 charges.
actors.hero.talent.divine_sense.meta_desc=_If this talent is gained by a different hero_ it will instead grant them mind vision for a brief moment after using a special weapon or module with a range of 3 tiles at +1 or 5 tiles at +2.
actors.hero.talent.bless.title=Bless
actors.hero.talent.bless.desc=_+1:_ The Cleric can cast _Bless,_ a spell that grants _6 turns of bless and 10 shielding_ when cast on themselves or _10 turns of bless and 10 healing_ when cast on another character, at the cost of 1 charge.\n\n_+2:_ The Cleric can cast _Bless,_ a spell that grants _10 turns of bless and 15 shielding_ when cast on themselves or _15 turns of bless and 15 healing_ when cast on another character, at the cost of 1 charge.\n\nExcess healing from this spell is converted into shielding.
actors.hero.talent.bless.meta_desc=_If this talent is gained by a different hero_ it will instead boost accuracy and evasion for the hero and all allies by 3% at +1 or 5% at +2.

actors.hero.talent.cleanse.title=Cleanse
actors.hero.talent.cleanse.desc=_+1:_ The Cleric can cast _Cleanse,_ a spell which _removes negative status effects_ from the Cleric and any nearby allies, and grants them _10 shielding,_ at the cost of 2 charges.\n\n_+2:_ The Cleric can cast _Cleanse,_ a spell which _grants 3 turns of negative status immunity_ to the Cleric and any nearby allies, and grants them _20 shielding,_ at the cost of 2 charges.\n\n_+3:_ The Cleric can cast _Cleanse,_ a spell which _grants 5 turns of negative status immunity_ to the Cleric and any nearby allies, and grants them _30 shielding,_ at the cost of 2 charges.
actors.hero.talent.cleanse.meta_desc=_If this talent is gained by a different hero_ it will instead cleanse negative status effects on the hero after using a special weapon or module, 10/20/30% of the time at +1/+2/+3.
actors.hero.talent.light_reading.title=Light Reading
actors.hero.talent.light_reading.desc=_+1:_ The Cleric can use their synthetic core when it is not equipped, but it recharges at _25% speed_ when unequipped.\n\n_+2:_ The Cleric can use their synthetic core when it is not equipped, but it recharges at _50% speed_ when unequipped.\n\n_+3:_ The Cleric can use their synthetic core when it is not equipped, but it recharges at _75% speed_ when unequipped.
actors.hero.talent.light_reading.meta_desc=_If this talent is gained by a different hero_ it will instead increase the recharging speed of all special weapons by 7/13/20% at +1/+2/+3.

actors.hero.talent.holy_lance.title=Holy Lance
actors.hero.talent.holy_lance.desc=_+1:_ The Priest can cast _Holy Lance,_ a devastating spell that deals _30-55 damage_ at the cost of 4 charges.\n\n_+2:_ The Priest can cast _Holy Lance,_ a devastating spell that deals _45-83 damage_ at the cost of 4 charges.\n\n_+3:_ The Priest can cast _Holy Lance,_ a devastating spell that deals _60-110 damage_ at the cost of 4 charges.\n\nHoly Lance always deals maximum damage to demonic and undead foes. Holy Lance has a 30 turn cooldown before it can be cast again.
actors.hero.talent.hallowed_ground.title=Hallowed Ground
actors.hero.talent.hallowed_ground.desc=_+1:_ The Priest can cast _Hallowed Ground,_ a spell that hallows terrain in a _3x3 area_ for 20 turns, at the cost of 2 charges.\n\n_+2:_ The Priest can cast _Hallowed Ground,_ a spell that hallows terrain in a _5x5 area_ for 20 turns, at the cost of 2 charges.\n\n_+3:_ The Priest can cast _Hallowed Ground,_ a spell that hallows terrain in a _7x7 area_ for 20 turns, at the cost of 2 charges.\n\nWhen it is cast, Hallowed Ground heals allies for 15 HP, briefly roots enemies, and spreads short grass. Afterward, it slowly heals allies, cripples enemies, and causes tall grass to randomly grow. Hallowed ground grants shielding to the Priest instead of healing and is destroyed by fire.
actors.hero.talent.mnemonic_prayer.title=Mnemonic Prayer
actors.hero.talent.mnemonic_prayer.desc=_+1:_ The Priest can cast _Mnemonic Prayer,_ a spell that extends buffs/debuffs on an ally/enemy for _3 turns_ at 1 charge cost.\n\n_+2:_ The Priest can cast _Mnemonic Prayer,_ a spell that extends buffs/debuffs on an ally/enemy for _4 turns_ at 1 charge cost.\n\n_+3:_ The Priest can cast _Mnemonic Prayer,_ a spell that extends buffs/debuffs on an ally/enemy for _5 turns_ at 1 charge cost.\n\nMnemonic prayer takes no time to cast. Mnemonic Prayer can only extend a particular instance of a buff/debuff once, and cannot extend buffs from armor abilities.

actors.hero.talent.lay_on_hands.title=lay on hands
actors.hero.talent.lay_on_hands.desc=_+1:_ The Paladin can cast _Lay on Hands,_ a spell that instantly heals a nearby character for _15 HP,_ or grants the Paladin _15 shielding,_ at the cost of 1 charge.\n\n_+2:_ The Paladin can cast _Lay on Hands,_ a spell that instantly heals a nearby character for _20 HP,_ or grants the Paladin _20 shielding,_ at the cost of 1 charge.\n\n_+3:_ The Paladin can cast _Lay on Hands,_ a spell that instantly heals a nearby character for _25 HP,_ or grants the Paladin _25 shielding,_ at the cost of 1 charge.\n\nExcess healing from this spell is converted into shielding. Lay on Hands can be cast repeatedly, but cannot apply more than three casts worth of shielding at once.
actors.hero.talent.aura_of_protection.title=aura of protection
actors.hero.talent.aura_of_protection.desc=_+1:_ The Paladin can cast _Aura of Protection,_ a spell that grants the Paladin and all allies within 2 tiles _20% damage resistance_ and the effect of the Paladin's armor glyph at _+50% power_ for 20 turns, at the cost of 2 charges.\n\n_+2:_ The Paladin can cast _Aura of Protection,_ a spell that grants the Paladin and all allies within 2 tiles _30% damage resistance_ and the effect of the Paladin's armor glyph at _+75% power_ for 20 turns, at the cost of 2 charges.\n\n_+3:_ The Paladin can cast _Aura of Protection,_ a spell that grants the Paladin and all allies within 2 tiles _40% damage resistance_ and the effect of the Paladin's armor glyph at _+100% power_ for 20 turns, at the cost of 2 charges.
actors.hero.talent.wall_of_light.title=wall of light
actors.hero.talent.wall_of_light.desc=_+1:_ The Paladin can cast _Wall of Light,_ a spell that creates a _3 tile wide_ solid wall in front of the Paladin that pushes away enemies and lasts for 20 turns, at the cost of 3 charges.\n\n_+2:_ The Paladin can cast _Wall of Light,_ a spell that creates a _5 tile wide_ solid wall in front of the Paladin that pushes away enemies and lasts for 20 turns, at the cost of 3 charges.\n\n_+3:_ The Paladin can cast _Wall of Light,_ a spell that creates a _7 tile wide_ solid wall in front of the Paladin that pushes away enemies and lasts for 20 turns, at the cost of 3 charges.\n\nThe wall can be placed cardinally or diagonally, only one wall can exist at a time.

actors.hero.talent.divine_intervention.title=divine intervention
actors.hero.talent.divine_intervention.desc=_+1:_ While in Ascended Form, the Cleric can cast _Divine Intervention,_ which boosts the Cleric and all allies up to _150 shielding_ and extends Ascended Form by _3 turns._\n\n_+2:_ While in Ascended Form, the Cleric can cast _Divine Intervention,_ which boosts the Cleric and all allies up to _200 shielding_ and extends Ascended Form by _4 turns._\n\n_+3:_ While in Ascended Form, the Cleric can cast _Divine Intervention,_ which boosts the Cleric and all allies up to _250 shielding_ and extends Ascended Form by _5 turns._\n\n_+4:_ While in Ascended Form, the Cleric can cast _Divine Intervention,_ which boosts the Cleric and all allies up to _300 shielding_ and extends Ascended Form by _6 turns._\n\nDivine Intervention costs a whopping 5 tome charges, and can only be cast once in the same ascended form.
actors.hero.talent.judgement.title=judgement
actors.hero.talent.judgement.desc=_+1:_ While in Ascended Form, the Cleric can cast _Judgement,_ which deals _10-20 damage_ to all visible enemies.\n\n_+2:_ While in Ascended Form, the Cleric can cast _Judgement,_ which deals _15-30 damage_ to all visible enemies.\n\n_+3:_ While in Ascended Form, the Cleric can cast _Judgement,_ which deals _20-40 damage_ to all visible enemies.\n\n_+4:_ While in Ascended Form, the Cleric can cast _Judgement,_ which deals _25-50 damage_ to all visible enemies.\n\nJudgement costs 3 tome charges. Judgement deals +33% damage for every spell the Cleric has cast since entering ascended form or since the last cast of Judgement.
actors.hero.talent.flash.title=flash
actors.hero.talent.flash.desc=_+1:_ While in Ascended Form, the Cleric can cast _Flash_ to teleport up to _3 tiles_ away.\n\n_+2:_ While in Ascended Form, the Cleric can cast _Flash_ to teleport up to _4 tiles_ away.\n\n_+3:_ While in Ascended Form, the Cleric can cast _Flash_ to teleport up to _5 tiles_ away.\n\n_+4:_ While in Ascended Form, the Cleric can cast _Flash_ to teleport up to _6 tiles_ away.\n\nFlash costs 2 tome charges initially, and 1 more charge for each use in the same ascended form.

actors.hero.talent.body_form.title=body form
actors.hero.talent.body_form.desc=The Cleric can cast _Body Form_, which imbues Trinity with the power of an enchantment or glyph that the Cleric has identified this run, at the cost of 2 charges.\n\n_+1:_ When Trinity is used, the Cleric gains the chosen effect for _20 turns._\n\n_+2:_ When Trinity is used, the Cleric gains the chosen effect for _27 turns._\n\n_+3:_ When Trinity is used, the Cleric gains the chosen effect for _33 turns._\n\n_+4:_ When Trinity is used, the Cleric gains the chosen effect for _40 turns._\n\nTrinity can only be imbued with one body effect at a time. Trinity's armor charge cost is higher if the chosen glyph is rare and powerful.
actors.hero.talent.mind_form.title=mind form
actors.hero.talent.mind_form.desc=The Cleric can cast _Mind Form_, which imbues Trinity with the power of a special weapon or thrown weapon that the Cleric has used this run, at the cost of 3 charges.\n\n_+1:_ When Trinity is used, the Cleric uses the zap or throw effect of the chosen item, as if it were _+3._\n\n_+2:_ When Trinity is used, the Cleric uses the zap or throw effect of the chosen item, as if it were _+4._\n\n_+3:_ When Trinity is used, the Cleric uses the zap or throw effect of the chosen item, as if it were _+5._\n\n_+4:_ When Trinity is used, the Cleric uses the zap or throw effect of the chosen item, as if it were _+6._\n\nTrinity can only be imbued with one mind effect at a time.
actors.hero.talent.spirit_form.title=spirit form
actors.hero.talent.spirit_form.desc=The Cleric can cast _Spirit Form_, which imbues Trinity with the power of an implant or module that the Cleric has identified this run (except the synthetic core), at the cost of 4 charges.\n\n_+1:_ When Trinity is used, the Cleric will gain an implant's effect at _+1_ for 20 turns, or will trigger a module's effect at _+4._\n\n_+2:_ When Trinity is used, the Cleric will gain an implant's effect at _+2_ for 20 turns, or will trigger a module's effect at _+6._\n\n_+3:_ When Trinity is used, the Cleric will gain an implant's effect at _+3_ for 20 turns, or will trigger a module's effect at _+8._\n\n_+4:_ When Trinity is used, the Cleric will gain an implant's effect at _+4_ for 20 turns, or will trigger a module's effect at _+10._\n\nTrinity can only be imbued with one spirit effect at a time. Modules have varied effects and armor charge costs when triggered by Trinity.

actors.hero.talent.beaming_ray.title=beaming ray
actors.hero.talent.beaming_ray.desc=The Cleric can cast _Beaming Ray_ from an empowered ally at the cost of 1 charge. This ray can go through walls and teleports the ally to a targeted location. If an enemy is at that location, the ally appears next to the enemy and will target them. Beaming Ray can even teleport normally immobile allies, but has half range when doing so.\n\n_+1:_ Beaming Ray has a max range of _4 tiles,_ and increases Power of Many's bonus to _+35% damage_ against the closest enemy for 10 turns.\n\n_+2:_ Beaming Ray has a max range of _8 tiles,_ and increases Power of Many's bonus to _+40% damage_ against the closest enemy for 10 turns.\n\n_+3:_ Beaming Ray has a max range of _12 tiles,_ and increases Power of Many's bonus to _+45% damage_ against the closest enemy for 10 turns.\n\n_+4:_ Beaming Ray has a max range of _16 tiles,_ and increases Power of Many's bonus to _+50% damage_ against the closest enemy for 10 turns.
actors.hero.talent.life_link.title=life link
actors.hero.talent.life_link.desc=The Cleric can cast _Life Link_ between themselves and an empowered ally at the cost of 2 charges. This spell causes damage to be shared between the Cleric and their ally, and causes beneficial cleric spells of tier 3 or lower to apply to both if either is being affected.\n\n_+1:_ Life Link lasts for _10 turns_ and increases Power of Many's bonus to _-35% damage taken._\n\n_+2:_ Life Link lasts for _13 turns_ and increases Power of Many's bonus to _-40% damage taken._\n\n_+3:_ Life Link lasts for _17 turns_ and increases Power of Many's bonus to _-45% damage taken._\n\n_+4:_ Life Link lasts for _20 turns_ and increases Power of Many's bonus to _-50% damage taken._
actors.hero.talent.stasis.title=Stasis
actors.hero.talent.stasis.desc=The Cleric can cast _Stasis_ on an empowered ally at the cost of 2 charges. Stasis temporarily removes the ally from the dungeon and preserves the remaining time on all buffs, including Power of Many. The ally will reappear next to you when the effect ends. Stasis can be re-cast instantly and at no cost to end the effect early. Stasis works on immobile allies, but cannot move them between dungeon floors.\n\n_+1:_ Stasis lasts for a max of _60 turns._\n\n_+2:_ Stasis lasts for a max of _90 turns._\n\n_+3:_ Stasis lasts for a max of _120 turns._\n\n_+4:_ Stasis lasts for a max of _150 turns._\n\nThe Cleric can also cast Beaming Ray when an ally is in stasis to resummon them, or cast Life Link to pre-emptively apply its effect. Allies do not benefit from Life Link while in stasis however.


#universal
actors.hero.talent.heroic_energy.title=heroic energy
actors.hero.talent.heroic_energy.rat_title=ratroic energy
actors.hero.talent.heroic_energy.desc=_+1:_ The hero's armor ability has a _12% reduced_ charge cost.\n\n_+2:_ The hero's armor ability has a _23% reduced_ charge cost.\n\n_+3:_ The hero's armor ability has a _32% reduced_ charge cost.\n\n_+4:_ The hero's armor ability has a _40% reduced_ charge cost.

actors.hero.talent.ratsistance.title=ratsistance
actors.hero.talent.ratsistance.desc=_+1:_ Hostile ratmogrified enemies deal _-10% damage_.\n\n_+2:_ Hostile ratmogrified enemies deal _-19% damage_.\n\n_+3:_ Hostile ratmogrified enemies deal _-27% damage_.\n\n_+4:_ Hostile ratmogrified enemies deal _-35% damage_.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratlomacy.desc=_+1:_ Using ratmogrify on a ratmogrified enemy makes them friendly and makes the transformation permanent.\n\n_+2:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _2 turns_ of adrenaline.\n\n_+3:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _4 turns_ of adrenaline.\n\n_+4:_ Using ratmogrify on a ratmogrified enemy makes them friendly, makes the transformation permanent, and gives them _6 turns_ of adrenaline.
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratforcements.desc=_+1:_ Using ratmogrify on yourself _spawns 1_ ally marsupial rat next to you.\n\n_+2:_ Using ratmogrify on yourself _spawns 2_ ally marsupial rats next to you.\n\n_+3:_ Using ratmogrify on yourself _spawns 3_ ally marsupial rats next to you.\n\n_+4:_ Using ratmogrify on yourself _spawns 4_ ally marsupial rats next to you.



###npcs
actors.mobs.npcs.blacksmith.name=Cpl. Lia Moreno
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey, marine! You look strong.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey, exterminator! You look like you know what you're doing.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey, special forces! You look clever.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey, pilot! That exosuit can still handle heavy work.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey, renegade! You look brave.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey, synthetic! You look important.
actors.mobs.npcs.blacksmith.intro_quest_start=Want to help? Great, I have a job. I set up this workshop on top of an old mine, the way down is that ladder. Take this pickaxe and bring me _raw Laztro. 40 chunks_ should do. The rock down there is soft, so _you can dig through the walls with a bit of effort._\n\nWhat do you mean "how will I pay you"? So mercenary...\n\nFine, fine. I'm an engineer, I can work on your gear in exchange. Consider yourself lucky, I'm the only workshop on this planet.
actors.mobs.npcs.blacksmith.intro_quest_crystal=But be careful, the mine is dangerous. It's been abandoned a long time and crystals have started growing down there. They shine, but they're too brittle to be worth anything, and something protects them. They're strong, so _watch where you dig_ or you'll draw their attention.\n\nThere's a _giant crystal_ somewhere down there. It's much tougher, so be ready to fight if you start breaking it. I bet the other crystals stop growing without it. I'll pay extra if you destroy it.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=But be careful, the mine is dangerous. Some assimilated went after the Laztro too and they're tearing the place apart. They dig without thinking and have caused several cave-ins. You'll still have to dig, so _look for freshly dug rock._\n\nI think one of them is doing most of the damage, probably some _seismic_ freak or something like it. I'll pay extra if you find it and kill it, but it will fight back.
actors.mobs.npcs.blacksmith.intro_quest_fungi=But be careful, the mine is dangerous. There's an alien fungus growing down there. It has spore towers that kill anything they see, but they can't move. _Stay out of their line of sight_ if you want to live.\n\nI'll pay extra if you destroy the _spore core_, but it'll take work. It's linked to several mycelium nodes hidden in the walls. You'll have to break most of them before you can hurt the core.
actors.mobs.npcs.blacksmith.reminder=Still here? The mine entrance is right over there.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring me all the raw Laztro you can, and try to break the big crystal too.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring me all the raw Laztro you can, and try to kill that seismic one too.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring me all the raw Laztro you can, and try to destroy the spore core too.
actors.mobs.npcs.blacksmith.lost_pick=Are you kidding me? Where's my pickaxe?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Ready to go down? Leave room in your pack for the Laztro.\n\n_I only let you go down once!_
actors.mobs.npcs.blacksmith.enter_yes=I'm Ready
actors.mobs.npcs.blacksmith.enter_no=Not Yet
actors.mobs.npcs.blacksmith.exit_warn_none=Already? You barely brought any Laztro! There's enough down there for _40 chunks._\n\n_Remember, once you come up, I won't let you go back._
actors.mobs.npcs.blacksmith.exit_warn_low=Already? Doesn't look like you got much Laztro. There's enough for _40 chunks_.\n\n_Remember, once you come up, I won't let you go back._
actors.mobs.npcs.blacksmith.exit_warn_med=Done? You brought a fair amount, but there's still plenty down there. There's enough for _40 chunks._\n\n_Remember, once you come up, I won't let you go back._
actors.mobs.npcs.blacksmith.exit_warn_high=Done? You brought a lot, but I need a little more. There's enough for _40 chunks._\n\n_Remember, once you come up, I won't let you go back._
actors.mobs.npcs.blacksmith.exit_warn_full=Done? You brought plenty of Laztro, just make sure you didn't leave any of your gear down there.\n\n_Remember, once you come up, I won't let you go back._
actors.mobs.npcs.blacksmith.exit_warn_crystal=That giant crystal is still down there. I'll pay extra if you destroy it.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=That seismic one is still down there. I'll pay extra if you kill it.
actors.mobs.npcs.blacksmith.exit_warn_fungi=That spore core is still down there. I'll pay extra if you destroy it.
actors.mobs.npcs.blacksmith.exit_yes=I'm Done
actors.mobs.npcs.blacksmith.exit_no=Not Yet
actors.mobs.npcs.blacksmith.get_lost=I'm busy. Get lost!
actors.mobs.npcs.blacksmith.entrance_blocked=The way down is blocked.
actors.mobs.npcs.blacksmith.cant_enter_old=That area is not accessible on this run. Play a new game to try the new quest!
actors.mobs.npcs.blacksmith.def_verb=blocked
actors.mobs.npcs.blacksmith.desc=Corporal Lia Moreno, field engineer of the Vigil-7. She set up a makeshift workshop from ship scrap and works with tools that have seen better days.

actors.mobs.npcs.ghost.name=Sgt. Brandt's echo
actors.mobs.npcs.ghost.rat_1=%s... this is Sgt. Ivo Brandt, or what's left of him in the suit... I was the first one into the ducts after the crash... A _putrid crawler_ got me...\n\nIt's still roaming this sector... I can't shut down while it's alive... _Watch out for the toxic mist and the acid bite. The acid washes off in water..._
actors.mobs.npcs.ghost.rat_2=Please... finish it...\n\n_Fight near water... Stay out of the mist..._
actors.mobs.npcs.ghost.gnoll_1=%s... this is Sgt. Ivo Brandt, or what's left of him in the suit... It wasn't the swarm that killed me... It was one of ours... An assimilated crewman who can still use his hands... Take out the _assimilated saboteur_...\n\nHe doesn't fight like the others... He hides and throws things... _Watch out for the incendiary and poison darts. Don't trade shots with him at range..._
actors.mobs.npcs.ghost.gnoll_2=Please... take out the saboteur...\n\n_Don't let him hit you... Get close..._
actors.mobs.npcs.ghost.crab_1=%s... this is Sgt. Ivo Brandt, or what's left of him in the suit... Something big came up from under the hull and got me... Kill the _giant burrower_...\n\nIt's old, with a huge claw and a thick shell... _It blocks everything it sees coming with that claw. You need to catch it by surprise..._
actors.mobs.npcs.ghost.crab_2=Please... destroy the burrower...\n\n_It always blocks... when it sees you coming..._
actors.mobs.npcs.ghost.find_me=Thank you... come to my suit...
actors.mobs.npcs.ghost.desc=A glitching hologram of Sgt. Ivo Brandt, projected by his own fallen suit nearby. The image flickers and vanishes for moments at a time, but the voice stays steady.

actors.mobs.npcs.imp.name=Murky Claw smuggler
actors.mobs.npcs.imp.old_intro=Are you an adventurer? I love adventurers! You can always rely on them if something needs to be killed, am I right? For a bounty of course ;)
actors.mobs.npcs.imp.old_golems_1=In my case, it is the _colossi_ that need to die. I want to set up shop here, but those colossi scare off the customers! So please, kill... let us say _4 of them_ and the reward is yours.
actors.mobs.npcs.imp.old_monks_1=In my case, it is the _mantids_ that need to die. I want to set up shop here, but they buy nothing and scare off the other customers. So please, kill... let us say _5 of them_ and the reward is yours.
actors.mobs.npcs.imp.old_golems_2=How is the colossus hunt going? Do not forget to collect the chips.
actors.mobs.npcs.imp.old_monks_2=You are still alive! I knew you could handle it ;). Do not forget to collect the chips.
actors.mobs.npcs.imp.cya=See you, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.quest_intro_1=Well, well! A Brigade marine! I love marines. You can always count on you lot when you need a hand. For fair pay, of course ;).\n\nThere's a ship the hive swallowed right up ahead, and its vault is full of rare modules. I'm something of a collector, and there's a figurine in there I really want.\n\nBut the vault is full of guards, and I'm not much of a fighter. That's where you come in!
actors.mobs.npcs.imp.quest_intro_2=The vault is sealed. I can teleport you inside with a device I've been fixing up, but _it won't take your gear along._ There must be plenty of useful stuff in there! _Best to start by avoiding enemies and looking for less guarded items._\n\nI can bring you back with two items from the vault. One is my figurine, and the other can be _anything you like!_\n\nI've also gathered some wares you might like! If you help me, _I'll set up a stall a few sectors down_ and we can trade.
actors.mobs.npcs.imp.quest_in_progress=Just stand in the middle of the vault entrance when you're ready and I'll teleport you.
actors.mobs.npcs.imp.enter_text=All set? I'll keep your things here with me, _you get everything back when you return._\n\nTake this _standard uniform_ and the _teleport crystal._ Use the crystal once you have my figurine. ...I suppose _you can use it earlier in a pinch_, but don't expect full pay!\n\nThe vault has been sitting idle a long time, so the guards inside should be dormant. Good luck!
actors.mobs.npcs.imp.quest_completed_bad=Well, thanks for trying.\n\nThe teleporter will take a long time to recharge, so you'd better be on your way.
actors.mobs.npcs.imp.quest_completed_good=Thanks for the help!\n\nThe teleporter will take a while to recharge, and I need to plan around what you told me.\n\nI'll pack up and see you further down. I still need Laztro, so don't expect a discount ;).
actors.mobs.npcs.imp.quest_completed_great=Great work in there, thank you so much!\n\nI already have everything I needed here, so I'll pack up and see you further down. I still need Laztro, so don't expect a discount ;).\n\nWhat's so special about the figurine? Nothing, really. It's a pretty common trinket. It comes from a planet that doesn't exist anymore, maybe it's the last of its kind. If the swarm hadn't swallowed that ship, I'd never have found it...
actors.mobs.npcs.imp.enter_yes=Enter the vault
actors.mobs.npcs.imp.enter_no=Stay here
actors.mobs.npcs.imp.desc=A short Murky Claw pirate with a patched jacket and an easy grin. He deserted before the swarm took the ship and now lives off selling whatever he finds.\n\nYou wouldn't trust him for a second, but he seems very happy to see you.

actors.mobs.npcs.impshopkeeper.name=Murky Claw smuggler
actors.mobs.npcs.impshopkeeper.greetings=Hello, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=What did you do %s? Shop quickly, I've got to get out of here!
actors.mobs.npcs.impshopkeeper.thief=I thought I could trust you!
actors.mobs.npcs.impshopkeeper.buyback=The smuggler hands your item back with a grin.
actors.mobs.npcs.impshopkeeper.desc=The smuggler has set up a stall at the entrance to the queen's chamber. It's nice to see a friendly face, but his prices are anything but friendly.

actors.mobs.npcs.mirrorimage.name=mirror image
actors.mobs.npcs.mirrorimage.desc=This illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nMirror images will seek and attack enemies using their mimicked weapon, which behaves the same as yours, but deals less damage. They start out nearly invisible, but must take on a form that's more easily seen in order to attack.\n\nWhile their offensive power can be potent, mirror images have no durability, and will fade the moment they take damage.
actors.mobs.npcs.mirrorimage.discover_hint=You can find this character with a specific cartridge.

actors.mobs.npcs.npc.discover_hint=You can find this character in a specific region of the dungeon.

actors.mobs.npcs.prismaticimage.name=prismatic image
actors.mobs.npcs.prismaticimage.desc=This shimmering illusion bears a close resemblance to you, even seeming to wield your current weapon and armor.\n\nPrismatic images will attempt to seek and draw focus from enemies, using their enhanced defense and health to protect you. While they do not have the same offensive power as mirror images, they have enhanced durability, including receiving benefits from your armor.\n\nWhen reduced to 0 hp, prismatic images will fade over several turns, and can still be healed during this time. When no enemies are present, prismatic images will fade and rejoin their master.
actors.mobs.npcs.prismaticimage.discover_hint=You can find this character with a specific cartridge.

actors.mobs.npcs.ratking.name=crawler king
actors.mobs.npcs.ratking.not_sleeping=I'm not sleeping!
actors.mobs.npcs.ratking.what_is_it=What? I have no time for this. My nest won't run itself!
actors.mobs.npcs.ratking.confused=Wha... where am I? My nest needs me!
actors.mobs.npcs.ratking.crown_clothes=Put something on! Is that any way to address royalty?
actors.mobs.npcs.ratking.crown_desc=Oooh, is that crown for me!? It looks much shinier than mine, so I graciously accept!\n\nIn fact, I think I can offer you something as a reward for this crown. A tremendous power befitting a hero such as yourself! Would you like that?
actors.mobs.npcs.ratking.crown_yes=Of course!
actors.mobs.npcs.ratking.crown_info=Tell me more first.
actors.mobs.npcs.ratking.crown_no=I'd rather not...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, thank you! Now go and make your king proud!
actors.mobs.npcs.ratking.crown_fine=Fine! It's not like I wanted it anyway...
actors.mobs.npcs.ratking.crown_after=Enjoying your new armor? No take-backsies!
actors.mobs.npcs.ratking.desc_crown=This crawler is a little bigger than the others. Now it wears a real crown, which it keeps adjusting.
actors.mobs.npcs.ratking.desc_birthday=This crawler is a little bigger than the others. Today it swapped its crown for a green party hat. Happy birthday, crawler king!
actors.mobs.npcs.ratking.desc_winter=This crawler is a little bigger than the others. Today it swapped its crown for a festive cap. Happy holidays!
actors.mobs.npcs.ratking.desc=This crawler is a little bigger than the others and struts around with its chest puffed out. On its head it balances a small crown made of scrap.
actors.mobs.npcs.ratking.discover_hint=You can find this character at the end of a specific region of the dungeon.

actors.mobs.npcs.sheep.name=sheep
actors.mobs.npcs.sheep.baa!=Baa!
actors.mobs.npcs.sheep.baa?=Baa?
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.def_verb=blocked
actors.mobs.npcs.sheep.desc=This is a magic sheep. What's so magical about it? You can't kill it. It will stand there until it magically fades away, all the while chewing cud with a blank stare.
actors.mobs.npcs.sheep.discover_hint=You can find this character with a specific item or trap.

actors.mobs.npcs.shopkeeper.name=shopkeeper
actors.mobs.npcs.shopkeeper.thief=Thief, Thief!
actors.mobs.npcs.shopkeeper.warn=Watch it! I won't warn you again.
actors.mobs.npcs.shopkeeper.flee=The shopkeeper flees!
actors.mobs.npcs.shopkeeper.sell=Sell an item
actors.mobs.npcs.shopkeeper.talk=Talk
actors.mobs.npcs.shopkeeper.buyback=The shopkeeper reluctantly returns your item.
actors.mobs.npcs.shopkeeper.talk_prison_intro=I have everything you need for a successful adventure!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=That's an interesting generator you've got there, they're usually in one piece. You a disgraced hero or something? Well whatever you've done is none of my business, your coins are still good.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, I think I've seen a wanted poster with your name on it somewhere in the city. On the run are we? Oh you're innocent are you? Of course, of course... Don't fret, I've got better things to do than report on you, but perhaps you should buy something to be sure?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Special Forces down here? Then things are worse than I thought. Feel free to look around, but don't expect a discount. Your lot never pays for anything, and you always leave without a sound.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=You seem to be out of your element miss. Tight dungeon corridors aren't as spacious as grand halls or the forests surrounding the city are they? Hehe, oh don't mind my rambling, why not buy something?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Well if it isn't the travelling hero! If you're trying to save another town then good luck, the dangers here are much worse than petty bandit gangs. I'm sure you'll do better than anyone else could, just try to not die right outside my store.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Well hello there Your Highness, or is it Your Holiness now? Hehe, either way this is no place for you, a lot of people would be quite distraught if you wound up dead. Surely you have some coins though, why not buy something to help prevent that?
actors.mobs.npcs.shopkeeper.talk_caves=Spend Laztro, live longer.\n\nOh, and say hello to Corporal Moreno for me if you run into her. Remind her she still owes me for that drill I sold her last week!
actors.mobs.npcs.shopkeeper.talk_city=My wares can keep you alive down here.\n\n...And please do not linger. It took forever for the workers to stop bothering me, I do not want you attracting trouble!
actors.mobs.npcs.shopkeeper.talk_halls=Hello there! I have special prices for anyone going up against the queen!\n\nAnd be careful down there! What waits in the chamber is worse than anything you saw in the vault, and there is no escape crystal to save you. You cannot come back and spend more Laztro if you are dead! ;)\n\nAm I afraid of the swarm? Hehe, I am too small for them to care about. The queen wants Brigade folk... well... just be careful down there.
actors.mobs.npcs.shopkeeper.talk_ascent=I do not know what you plan to do with that heart, but I want no part of it. Buy something and move on, we both need to get out of here!
actors.mobs.npcs.shopkeeper.desc=This stout guy looks more appropriate for a trade district in some large city than for a dungeon. His prices explain why he prefers to do business here.

actors.mobs.npcs.wandmaker.name=weapons technician
actors.mobs.npcs.wandmaker.intro_warrior=A marine! Thank goodness. I thought I was the only one from the Vigil-7 still walking without a limp. If you have a minute, I have a job for you.
actors.mobs.npcs.wandmaker.intro_rogue=Whoa! You scared me. I haven't seen anyone with their head still on straight in days. If you can help, I have a task for you.
actors.mobs.npcs.wandmaker.intro_mage=Ah, hello, %s! Did heavy weapons command finally send someone? Never mind, they never do. If you can, I have a task for you.
actors.mobs.npcs.wandmaker.intro_huntress=Hey, pilot! I calibrated that exosuit before the mission, you know? Doesn't matter. If you can help, I have a task for you.
actors.mobs.npcs.wandmaker.intro_duelist=Well, a familiar face in a place like this! If you're willing to help a lost technician, I have a task for you.
actors.mobs.npcs.wandmaker.intro_cleric=A synthetic unit still running! What a relief. I hate to ask, but I have a task for you.
actors.mobs.npcs.wandmaker.intro_1=\n\nI left the ship to find a rare component for the special weapons, but I got lost and my shield generator is running low. I need to get back soon, but I'm not going back without what I came for.
actors.mobs.npcs.wandmaker.intro_dust=I need some _corpse dust._ It's what's left when the swarm finishes consuming a body, and it conducts energy like nothing I know. There should be a barricaded room around here, and that's where the dust builds up. But careful, it attracts bad things. _Bring it to me quickly_ and I'll neutralize it.
actors.mobs.npcs.wandmaker.intro_ember=I need _fresh embers_ from a newly formed igneous spore. They show up when someone meddles with what they shouldn't, so look for some candles and a ritual marking and you can make one appear. _Avoid melee_ or _have something that freezes on hand._ Young spores are strong and unstable, but they can't stand the cold.
actors.mobs.npcs.wandmaker.intro_berry=The pirates grew a _rotberry plant_ around here, and I need a seed. The plant must have grown out of control, so getting a seed out of it will take work. The garden is somewhere in this sector. _Stay away from the roots_ if you want to come back in one piece. And no fire, please, or the plant dies and the seeds burn with it.
actors.mobs.npcs.wandmaker.intro_2=\n\nIf you bring me that, I'll pay you with one of my best special weapons! I have two here, you pick the one you like.
actors.mobs.npcs.wandmaker.reminder_dust=Found the corpse dust, %s? Look for a barricaded room.
actors.mobs.npcs.wandmaker.reminder_ember=Found the embers, %s? You'll need four candles and a place for the ritual.
actors.mobs.npcs.wandmaker.reminder_berry=Found the rotberry seed, %s? Look for a room full of plants.
actors.mobs.npcs.wandmaker.def_verb=blocked
actors.mobs.npcs.wandmaker.desc=The Vigil-7's weapons technician. She looks tired and a little lost, but the shield generator on her belt can still hold off whatever comes.



##vault quest
actors.mobs.quest.vault.vaultbosselemental.name=colossal spore
actors.mobs.quest.vault.vaultbosselemental.rankings_desc=Overwhelmed by the colossal spore
actors.mobs.quest.vault.vaultbosselemental.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultbosselemental.desc=This ship's crew was studying the swarm, and this was the most valuable specimen in the lab: a spore the size of a room, held in a containment matrix in the floor. The matrix still works and lets it _switch forms!_ Each form has its own attacks, resistances and weaknesses.
actors.mobs.quest.vault.vaultbosselemental.desc_fire=The spore has taken its _igneous form_. In this form it fires fireballs and sends waves of flame across the arena. It aims the fireballs where you are heading, and the waves always leave a gap. If you are hit, you _catch fire_.\n\nIn this form it _resists special weapons_, which only feed the flames. Its exposed core should be easy to hit with _thrown weapons_, though.
actors.mobs.quest.vault.vaultbosselemental.fire_resist=The flames grow as the spore absorbs most of the shot!
actors.mobs.quest.vault.vaultbosselemental.fire_weak=Your thrown weapon strikes the spore's core for extra damage!
actors.mobs.quest.vault.vaultbosselemental.desc_frost=The spore has cooled into its _cryogenic form_. In this form it fires freezing energy in a wide cone and creates a vortex of icy air that moves across the arena. You can dodge both with good timing, but the freezing energy is especially dangerous at range. If you are hit, you are _frozen solid_.\n\nIn this form it _resists thrown weapons_, which get stuck in its icy shell. The shell does not look very sturdy, so a hit with a _melee weapon_ should do serious damage.
actors.mobs.quest.vault.vaultbosselemental.frost_resist=Your thrown weapon gets stuck in the spore's icy shell!
actors.mobs.quest.vault.vaultbosselemental.frost_weak=Your strike breaks part of the icy shell for extra damage!
actors.mobs.quest.vault.vaultbosselemental.desc_shock=The spore has charged up into its _electric form_. In this form it fires a bolt at you or sends lines of sparks in from the sides of the arena. These attacks are easier to dodge, but they come more often. If you are hit, you are _stunned_ for a moment.\n\nIn this form it _resists melee attacks_, and anyone who touches it gets shocked. The electric field around it is disrupted by _special weapons_, though, which deal extra damage.
actors.mobs.quest.vault.vaultbosselemental.shock_resist=You get a painful shock as you try to strike the spore!
actors.mobs.quest.vault.vaultbosselemental.shock_weak=Your shot disrupts the spore's electric field for extra damage!

actors.mobs.quest.vault.vaultdm100.name=reprogrammed security drone
actors.mobs.quest.vault.vaultdm100.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultdm100.desc=Security drones just like the ones on the Vigil-7, but with their sensor lights a strong blue-green. This ship's crew must have swapped their power source for a more modern one.\n\nThey behave like ordinary security drones and still fire electric bolts from range. Being in better condition, they are a little tougher.

actors.mobs.quest.vault.vaultdm200.name=reprogrammed mining drone
actors.mobs.quest.vault.vaultdm200.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultdm200.desc=Mining drones just like the ones in the caves, but with their sensor lights a strong blue-green. They must have been fitted with a more modern power source.\n\nLike the ones in the caves, they are too wide for tight spaces and can still vent gas.

actors.mobs.quest.vault.vaultrat.desc=This rat has some behaviour changes to test out new vault enemy AI:\n_-_ Its movement can be 'heard' through walls\n_-_ It will wander along a pre-set patrol\n_-_ While wandering it has sharply reduced detection range behind the direction it moves in.\n_-_ While sleeping its detection range is also reduced\n_-_ When it detects you it will 'investigate' before swapping to hunting. Investigating enemies move toward you but don't attack and are easier to lose behind doors and corners.

actors.mobs.quest.vault.vaultskeleton.name=armored husk
actors.mobs.quest.vault.vaultskeleton.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultskeleton.desc=Husks of this ship's crew, still wrapped in the remains of their security armor. The lab kept these husks for study, and something woke them.\n\nThey act like ordinary husks and also burst into shards when they fall. The armor protects them a little more.

actors.mobs.quest.vault.vaultshaman.name=restrained psionic
actors.mobs.quest.vault.vaultshaman.discover_hint=You can find this enemy during a specific quest.
actors.mobs.quest.vault.vaultshaman.desc=Psionic assimilated the lab captured and restrained with a containment helmet. The helmet is far too tight, and they move in a stiff, strange way. Perhaps the helmet is what controls them.
actors.mobs.quest.vault.vaultshaman.spell_desc=They can still hit you with psionic bolts, but the helmet covers their node and there is no way to tell what effect each bolt will have. The helmet also protects them a little more, and their bolts are much stronger than an ordinary psionic's.



###mobs
actors.mobs.acidic.name=acidic stinger
actors.mobs.acidic.desc=A large caste with a segmented tail that fires serrated stingers. It avoids melee and prefers to cripple its prey from afar. This one is dripping corrosive mucus.

actors.mobs.albino.name=pale crawler
actors.mobs.albino.desc=A crawler with no pigment and an almost transparent shell. Rare, and its bite makes wounds bleed longer.
actors.mobs.albino.discover_hint=You can rarely find this enemy in a specific region of the dungeon.

actors.mobs.armoredstatue.name=armored automaton
actors.mobs.armoredstatue.desc=It looks like just another of the ship's inactive security robots, but its glowing red eyes give it away.\n\nThe armor it is wearing keeps it in great condition, and it may be very hard to bring down.
actors.mobs.armoredstatue.desc_arm_wep=Its chassis is cheap alloy, but the _%1$s_ and _%2$s_ it is using look real.

actors.mobs.bandit.name=raider pirate
actors.mobs.bandit.desc=A veteran pirate with a pricier coat and better reflexes. When it steals, it leaves you dazed before running off.

actors.mobs.bat.name=winged leech
actors.mobs.bat.desc=A swarm insect the size of a dog, with membrane wings and a hollow proboscis. It heals with every hit it lands, which lets it bring down prey far larger than itself.

actors.mobs.bee.name=golden wasp
actors.mobs.bee.desc_honey=A native wasp with a golden carapace that does not belong to the swarm. Despite its size, it defends its nest fiercely. This one has calmed down and seems to want to follow you.
actors.mobs.bee.desc=A native wasp with a golden carapace that does not belong to the swarm. Despite its size, it defends its nest fiercely. This one is angry, better keep your distance.
actors.mobs.bee.discover_hint=You can find this character with a specific item.

actors.mobs.brute.name=assimilated brute
actors.mobs.brute.enraged=enraged
actors.mobs.brute.def_verb=blocked
actors.mobs.brute.desc=A large crew member that the swarm thickened with carapace plates. When it is close to death it flies into a rage, gaining temporary shielding and dealing far more damage.
actors.mobs.brute$bruterage.name=brute rage
actors.mobs.brute$bruterage.desc=This assimilated is dying, but it wants to take you with it!\n\nIt dies when its shielding runs out, from time or from damage. Until then it deals far more damage than usual.\n\nShielding remaining: %d.

actors.mobs.causticslime.name=caustic ooze
actors.mobs.causticslime.desc=This swarm ooze has been tainted by something rising from the depths. It has lost its usual green color and drips with caustic mucus.
actors.mobs.causticslime.discover_hint=You can rarely find this enemy in a specific region of the dungeon.

actors.mobs.crab.name=digger
actors.mobs.crab.desc=An armored swarm form that tunnels through soil and wreckage. It is very fast, its shell can take heavy blows, and when you back away it burrows and bursts out beside you.

actors.mobs.crystalguardian.name=Laztro sentinel
actors.mobs.crystalguardian.def_verb=blocked
actors.mobs.crystalguardian.desc=A creature of hardened Laztro that would look like a statue if not for its glowing eyes. The crystal makes it slow but very tough, so _it is best to leave it asleep in its nest for as long as possible._\n\nBecause of its size, it moves much slower in tight spaces. It is so durable it cannot be killed. You can knock it down for a while, but it always gets back up.
actors.mobs.crystalguardian.discover_hint=You can find this enemy during a specific quest.

actors.mobs.crystalmimic.name=Laztro mimicker
actors.mobs.crystalmimic.ate=The mimicker ate your %s!
actors.mobs.crystalmimic.escaped=The Laztro mimicker has escaped!
actors.mobs.crystalmimic.desc=Mimickers are native creatures that can copy the shape of any object. Among the wreckage they almost always imitate a supply chest to lure in careless survivors.\n\nLaztro mimickers have crystal-covered carapaces and would rather steal than fight. Once discovered they try to run away, and their attacks shove aside whoever is in the way.

actors.mobs.crystalspire.name=Laztro spire
actors.mobs.crystalspire.warning=The Laztro hums when you strike it. Keeping this up will draw attention...
actors.mobs.crystalspire.alert=The humming swells and echoes through the whole cave!
actors.mobs.crystalspire.rankings_desc=Impaled by the Laztro spire
actors.mobs.crystalspire.desc=A huge spire of raw Laztro, most likely the source of every crystal creature in this cave. Your normal weapons do nothing to it, so you will need your pickaxe to break it.\n\n_Get ready before you start._ A crystal this size takes a while to extract, and you are unlikely to manage it undisturbed. The spire itself may have ways to defend itself. _Perhaps its attacks can be turned against the other creatures._
actors.mobs.crystalspire.discover_hint=You can find this enemy during a specific quest.

actors.mobs.crystalwisp.name=Laztro shard
actors.mobs.crystalwisp.beam_kill=The beam of light killed you...
actors.mobs.crystalwisp.desc=A small floating piece of Laztro that glows brightly. It is not especially strong, but it fires a beam of light at you whenever it has a clear line.\n\nShards slip easily between crystal formations, but cannot shoot through them.
actors.mobs.crystalwisp.discover_hint=You can find this enemy during a specific quest.

actors.mobs.demonspawner.name=brooder
actors.mobs.demonspawner.on_death=The hum of the chamber weakens as the brooder dies.
actors.mobs.demonspawner.desc=A mass of flesh and resin fixed to the floor, full of eggs that hatch rippers. The swarm feeds it with the bodies of those who die here.\n\nThe brooder cannot move or defend itself, but it is large and slow to kill. When threatened, it hatches rippers faster.\n\n_The brooders seem linked to the queen. Killing them should weaken her._

actors.mobs.dm100.name=security drone
actors.mobs.dm100.zap_kill=The electric discharge killed you...
actors.mobs.dm100.desc=A Vigil-7 security drone. The crash corrupted its identification system, and now it treats every crew member as an intruder.\n\nIt fires electric discharges from range and is hard to catch in the open.

actors.mobs.dm200.name=mining drone
actors.mobs.dm200.vent=The mining drone vents a jet of toxic gas!
actors.mobs.dm200.desc=A heavy drone the Murky Claw brought down to dig tunnels for Laztro. The swarm took over its circuits, and now it attacks with its hydraulic drilling arms.\n\nThe drone is too wide to fit through doors and narrow corridors. To make up for it, it vents its toxic exhaust at anyone out of reach.

actors.mobs.dm201.name=corroded mining drone
actors.mobs.dm201.vent=The corroded drone lobs a corrosive grenade!
actors.mobs.dm201.desc=A mining drone the swarm coated in resin and fixed to the floor as a sentry. It cannot move, but it takes and deals far more punishment than the others.\n\nWithout an exhaust, the swarm put the drone's demolition charges to use. It only lobs these corrosive grenades when attacked from range.

actors.mobs.dm300.name=Murky Claw Drill Rig
actors.mobs.dm300.notice=INTRUDER IN THE MINING ZONE!
actors.mobs.dm300.shield=The drill rig pulls power from the exposed cables and shields itself!
actors.mobs.dm300.charging=HULL DAMAGE! ACTIVATING POWER PYLON!
actors.mobs.dm300.charging_hint=The drill rig is invulnerable while a pylon is energizing it!
actors.mobs.dm300.supercharged=DESTROY! DESTROY! DESTROY!
actors.mobs.dm300.charge_lost=PYLON LOST! REVERTING TO LOCAL POWER!
actors.mobs.dm300.pylons_destroyed=ALERT! POWER GRID UNSTABLE!
actors.mobs.dm300.rankings_desc=Crushed by the Murky Claw drill rig
actors.mobs.dm300.def_verb=blocked
actors.mobs.dm300.defeated=CRITICAL DAMAGE! BEGINNING SHUTDO-
actors.mobs.dm300.desc=The mining machine the Murky Claw lowered into the caves to tear Laztro out of the rock. When the swarm took the pirate ship, it took the drill rig as well, and now the machine guards the way into the hive.\n\nIt vents toxic exhaust and uses its drill both to attack and to bore through the ground. It can also plug into the power grid the pirates set up and grow even stronger.
actors.mobs.dm300.desc_supercharged=The drill rig is charged full of energy. In this state it takes no damage and moves at double speed! Its drill also spins fast enough to _bore through solid rock,_ though it moves much slower while doing so.\n\nAttacking the drill rig now is useless, but _something nearby is supplying this power._ Destroying the source should weaken it.

actors.mobs.dwarfking.name=Commodore Elias Varga
actors.mobs.dwarfking.notice=Another one from the Vigil class. You have no idea what you are interfering with!
actors.mobs.dwarfking.lifelink_1=Your life belongs to the hive, crewman!
actors.mobs.dwarfking.lifelink_2=Bleed for your commander!
actors.mobs.dwarfking.teleport_1=Hold the intruder, crew!
actors.mobs.dwarfking.teleport_2=Keep the marine busy!
actors.mobs.dwarfking.wave_1=Enough! On your feet, crew!
actors.mobs.dwarfking.wave_2=More! Bleed for your commodore!
actors.mobs.dwarfking.wave_3=Useless! KILL THE MARINE! NOW!!
actors.mobs.dwarfking.enraged=You cannot kill me, %s. THE QUEEN. WILL NOT. ALLOW IT!
actors.mobs.dwarfking.losing=No! You cannot... you do not know what waits below...
actors.mobs.dwarfking.defeated=You have doomed... the next ship...
actors.mobs.dwarfking.rankings_desc=Fell before Commodore Varga
actors.mobs.dwarfking.desc=Commodore Elias Varga commanded the Vigil-3, a ship of the same class as the Vigil-7, which crashed on this planet years ago following the same route. He did not die in the crash. He went down into the hive, offered his own crew to the queen, and in return was given command of the outer hive.\n\nThe commodore is aggressive and tries to surround and overwhelm his enemies with the assimilated crew who obey him.
actors.mobs.dwarfking$dkghoul.rankings_desc=Fell before Commodore Varga
actors.mobs.dwarfking$dkmonk.rankings_desc=Fell before Commodore Varga
actors.mobs.dwarfking$dkwarlock.rankings_desc=Fell before Commodore Varga
actors.mobs.dwarfking$dkgolem.rankings_desc=Fell before Commodore Varga

actors.mobs.ebonymimic.name=shadow mimicker
actors.mobs.ebonymimic.reveal=There was a mimicker there!
actors.mobs.ebonymimic.hidden_name=suspicious outline
actors.mobs.ebonymimic.hidden_desc=There seems to be something here, but it's almost totally transparent.
actors.mobs.ebonymimic.desc=Mimickers are native creatures that can copy the shape of any object. Among the wreckage they almost always imitate a supply chest to lure in careless survivors.\n\nShadow mimickers can make themselves almost invisible. They hide on things a soldier is likely to use, and carry loot of their own as well. Once discovered they are no tougher than a regular mimicker, but their surprise bite is devastating.
actors.mobs.ebonymimic.discover_hint=You can find this enemy with a specific trinket.

actors.mobs.elemental$fireelemental.name=igneous spore
actors.mobs.elemental$fireelemental.desc=Spores are living sacs that drift through the hive, filled with chemicals the swarm produces. They barely think, and each one carries a single kind of payload.\n\nThe igneous spore is the most common. It sets its target on fire in melee and sometimes spits fireballs.
actors.mobs.elemental$newbornfireelemental.name=immature igneous spore
actors.mobs.elemental$newbornfireelemental.charging=The spore is swelling!
actors.mobs.elemental$newbornfireelemental.desc=Spores are living sacs that drift through the hive, filled with chemicals the swarm produces. They barely think, and each one carries a single kind of payload.\n\nThis igneous spore has only just formed, but it is already dangerous!
actors.mobs.elemental$newbornfireelemental.rankings_desc=Burned to a crisp by an immature igneous spore
actors.mobs.elemental$newbornfireelemental.desc_boss=Because it is so young, this spore can only spread fire in inaccurate bursts, and it must swell for a turn before each one.
actors.mobs.elemental$newbornfireelemental.desc_ally=You created this spore, and it controls its flames a little better. It cannot attack from range, but it sets enemies on fire in melee.
actors.mobs.elemental$newbornfireelemental.discover_hint=You can find this enemy during a specific quest.
actors.mobs.elemental$frostelemental.name=cryogenic spore
actors.mobs.elemental$frostelemental.desc=Spores are living sacs that drift through the hive, filled with chemicals the swarm produces. They barely think, and each one carries a single kind of payload.\n\nThe cryogenic spore releases a freezing fluid that slows its target, in melee and now and then from range. The effect is much stronger in water.
actors.mobs.elemental$shockelemental.name=electric spore
actors.mobs.elemental$shockelemental.desc=Spores are living sacs that drift through the hive, filled with chemicals the swarm produces. They barely think, and each one carries a single kind of payload.\n\nThe electric spore is rarer. In melee, arcs of electricity strike anyone nearby and deal extra damage if the target is in water. It sometimes fires a flash that blinds for a few turns.
actors.mobs.elemental$chaoselemental.name=unstable spore
actors.mobs.elemental$chaoselemental.desc=Spores are living sacs that drift through the hive, filled with chemicals the swarm produces. They barely think, and each one carries a single kind of payload.\n\nThe unstable spore is rare and dangerous. Its chemistry never settled on a single payload, and every attack has an unpredictable effect.

actors.mobs.eye.name=ocellus
actors.mobs.eye.deathgaze_kill=The ocellus beam killed you...
actors.mobs.eye.desc=Ocelli are simple eyes the size of a person, floating beneath a gas sac. The queen sees through them. In melee they barely fight.\n\nAfter charging for a moment, the ocellus fires a devastating beam. Everything in its line of sight takes tremendous damage. _Find cover as soon as you see it glow._

actors.mobs.fetidrat.name=putrid crawler
actors.mobs.fetidrat.rankings_desc=Dissolved by the Fetid Rat
actors.mobs.fetidrat.desc=Something is very wrong with this crawler. Its dark carapace leaks an oily fluid and the flesh beneath is rotting. Its pale green eyes look even more menacing.\n\nIt gives off a toxic mist and its bite corrodes armor.
actors.mobs.fetidrat.discover_hint=You can find this enemy during a specific quest.

actors.mobs.fungalcore.name=spore core
actors.mobs.fungalcore.desc=This gigantic mass of spores must be the source of the whole infestation in this cave.

actors.mobs.fungalsentry.name=spore tower
actors.mobs.fungalsentry.desc=This tall tower of spores defends the mycelium network covering the cave.\n\nIt is immobile, but will shoot precise blasts of poison at anything that gets within its line of sight. The impact is fairly weak, but _the poison stacks up to deadly amounts very quickly._ It can be destroyed, but it is probably best avoided.

actors.mobs.fungalspinner.name=infested weaver
actors.mobs.fungalspinner.desc=This weaver appears to be controlled by a parasitic fungus. The fungus has also changed its abilities, replacing its webs and venom with fungal growth.\n\nThe infested weaver spits fungus at you instead of webs, spreading vegetation and potentially rooting you. It cannot poison, but gains substantial damage resistance while next to tall vegetation.

actors.mobs.ghoul.name=hive worker
actors.mobs.ghoul.desc=Workers build and repair the hive with resin and with metal from the ships the swarm has brought down. Alone they are weak, but they always move in groups.\n\n_When a worker falls, it gets back up after a few turns, as long as another worker is nearby._

actors.mobs.gnoll.name=assimilated
actors.mobs.gnoll.desc=This used to be a Vigil-7 crew member. The swarm took the body and left the uniform. It still walks like a person and still holds whatever it found on the floor, but it does not answer to its name.

actors.mobs.gnollexile.name=stray assimilated
actors.mobs.gnollexile.desc=This assimilated has a cracked carapace at the nape, where the swarm attaches. It still follows the swarm, but from a distance, and seems to think for itself. Surviving like that takes strength and cunning, and it knows how to use the spear it carries.
actors.mobs.gnollexile.desc_passive=_The stray assimilated is not moving to attack._ It does not seem as aggressive as the others and probably thinks fighting you is not worth it. You could let it pass, but it carries a pack that may hold useful items...
actors.mobs.gnollexile.desc_aggro=_The stray assimilated looks around in anger._ Something made it decide to fight. Watch out for the spear!
actors.mobs.gnollexile.seen_passive=The assimilated with the spear watches you warily, but does not attack.
actors.mobs.gnollexile.seen_aggro=The assimilated with the spear moves to attack!

actors.mobs.gnollgeomancer.name=seismic assimilated
actors.mobs.gnollgeomancer.warning=The seismic assimilated begins to stir. Make sure you are ready before you continue!
actors.mobs.gnollgeomancer.alert=The seismic assimilated awakens! The whole cave shakes as it leaps away!
actors.mobs.gnollgeomancer.rock_kill=The thrown rock killed you...
actors.mobs.gnollgeomancer.rockfall_kill=The rockfall killed you...
actors.mobs.gnollgeomancer.rankings_desc=Buried by the seismic assimilated
actors.mobs.gnollgeomancer.desc=A tall assimilated with two psionic nodes at the base of its skull. It is the one moving the rock and directing every assimilated in the dig. Unlike the sappers, it is in full control and is not hurt by the stones it throws or drops. It has no way to fight in melee, though.
actors.mobs.gnollgeomancer.desc_armor=The seismic assimilated is covered in a layer of rock. _You need to get close and break it with your pickaxe before you can damage it._
actors.mobs.gnollgeomancer.desc_armor_sapper=_A nearby assimilated sapper is using a device that reinforces the seismic assimilated's rock armor. You cannot deal any damage right now!_
actors.mobs.gnollgeomancer.desc_sleeping=A tall assimilated, encased in rock like a statue. Up close you can see the stone rise and fall with its breathing. Like this, it cannot be harmed.\n\nYour pickaxe should break the rock, but _be ready to fight when you do._ This is the one moving the earth and directing the assimilated in the dig. _Defeating the other assimilated in the mine first may be a good idea._
actors.mobs.gnollgeomancer.discover_hint=You can find this enemy during a specific quest.

actors.mobs.gnollguard.name=assimilated foreman
actors.mobs.gnollguard.def_verb=blocked
actors.mobs.gnollguard.spear_warn=The foreman draws back and thrusts hard with its spear!
actors.mobs.gnollguard.desc=A large assimilated with a shield and a spear made from mine rail. The swarm set it to protect the ones working the Laztro dig.\n\nIt wields the spear one handed, but without much skill. _It needs open space to attack from range and deals much less damage if you stay right next to it._
actors.mobs.gnollguard.desc_armor=_A nearby assimilated sapper is using a device that covers this foreman in rock armor, greatly reducing the damage it takes._
actors.mobs.gnollguard.discover_hint=You can find this enemy during a specific quest.

actors.mobs.gnollsapper.name=assimilated sapper
actors.mobs.gnollsapper.desc=A small, weak assimilated with a bag full of Murky Claw charges and tools. It is here to find and extract raw Laztro, with foremen nearby to protect it. Its attacks barely hurt.\n\nInstead of fighting, the sapper uses its devices to make the rock attack for it. It does not control them well, so _there should be ways to turn those attacks against it or its foremen._
actors.mobs.gnollsapper.discover_hint=You can find this enemy during a specific quest.

actors.mobs.gnolltrickster.name=assimilated saboteur
actors.mobs.gnolltrickster.rankings_desc=Outwitted by the assimilated saboteur
actors.mobs.gnolltrickster.desc=An assimilated crewman who kept a piece of his old cunning. He walks hunched over with a crooked grin, clutching a bag of darts like a baby. His wide eyes never blink.
actors.mobs.gnolltrickster.discover_hint=You can find this enemy during a specific quest.

actors.mobs.goldenmimic.name=golden mimicker
actors.mobs.goldenmimic.desc=Mimickers are native creatures that can copy the shape of any object. Among the wreckage they almost always imitate a supply chest to lure in careless survivors.\n\nGolden mimickers are tougher and try to lure in the strongest soldiers. They hold better loot, but are also much stronger than regular mimickers.

actors.mobs.golem.name=carapace colossus
actors.mobs.golem.def_verb=blocked
actors.mobs.golem.desc=A huge caste bred to hold the hive's passages. Its thick carapace can take almost anything, but it is too large for narrow corridors.\n\nTo make up for it, the colossus folds space with an organ no one has lived long enough to study. It jumps between rooms and pulls enemies that are out of reach right up to it.

actors.mobs.goo.name=Swarm Matrix
actors.mobs.goo.notice=KRRRRSSSH!
actors.mobs.goo.defeated=krrsh... krrsh...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=The Matrix is swelling up!
actors.mobs.goo.enraged=enraged
actors.mobs.goo.gluuurp=KRRRRAAASSSH!
actors.mobs.goo.rankings_desc=Dissolved by the Swarm Matrix
actors.mobs.goo.desc=The Matrix is the first nest the swarm built inside the Vigil-7: a mass of living tissue that grew between the reactor cooling tanks. The crawlers are born from it.\n\nIt swells before it attacks, and when it lets go the blow knocks anyone down. If you see the Matrix swelling, get away. The reactor water helps its tissue regenerate.

actors.mobs.greatcrab.name=giant burrower
actors.mobs.greatcrab.noticed=The crab blocks with its massive claw.
actors.mobs.greatcrab.def_verb=blocked
actors.mobs.greatcrab.rankings_desc=Snipped by the Great Crab
actors.mobs.greatcrab.desc=This burrower is huge, even compared to the others. Its blue shell is full of cracks and crust, the mark of many years underground. It moves slowly, almost losing its balance under its giant claw.
actors.mobs.greatcrab.discover_hint=You can find this enemy during a specific quest.

actors.mobs.guard.name=harpoon pirate
actors.mobs.guard.scorpion=Get over here!
actors.mobs.guard.def_verb=blocked
actors.mobs.guard.desc=A Murky Claw pirate armed with a boarding harpoon. It hooks anyone at range and pulls them close before striking. Its improvised assault armor can take a lot.

actors.mobs.hermitcrab.name=plated burrower
actors.mobs.hermitcrab.def_verb=blocked
actors.mobs.hermitcrab.desc=This burrower has wedged a curved piece of hull plating onto its back. The extra weight has slowed it down, but its defense is far greater. You think you can hear something rattling around under the plate...

actors.mobs.mimic.name=mimicker
actors.mobs.mimic.reveal=That chest is a mimicker!
actors.mobs.mimic.hidden_hint=Something about this chest feels off... Walking up and trying to open it might be a bad idea.
actors.mobs.mimic.desc=Mimickers are native creatures that can copy the shape of any object. Among the wreckage they almost always imitate a supply chest to lure in careless survivors.\n\nMimickers have a nasty bite, but often hold more loot than a regular chest.
actors.mobs.mimic.discover_hint=You can find this enemy in any sector.

actors.mobs.necromancer.name=incubator
actors.mobs.necromancer.desc=A swarm form carrying an egg sac on its back. It does not fight up close: it raises the dead husks around it and sends them ahead.\n\nKilling the incubator drops the husks it controls.
actors.mobs.necromancer$necroskeleton.name=raised husk
actors.mobs.necromancer$necroskeleton.desc=This husk was raised by an incubator. It acts like a regular husk and falls along with the incubator that controls it.

actors.mobs.mob.died=You hear something die in the distance.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Slain by: %s
actors.mobs.mob.discover_hint=You can find this enemy in a specific region of the dungeon.

actors.mobs.monk.name=mantid
actors.mobs.monk.def_verb=blocked
actors.mobs.monk.parried=parried
actors.mobs.monk.desc=A warrior caste with scythe-shaped forelimbs. Mantids study how each prey fights and learn to anticipate its blows.\n\nThey only fight in melee. When focused, they parry the next physical attack, even one that was certain to hit. Focus builds faster while the mantid moves and slower while it fights.
actors.mobs.monk$focus.name=focused
actors.mobs.monk$focus.desc=This mantid is completely focused on its target and seems to predict every move.\n\nWhile focused, the next physical attack against it misses no matter what. Parrying that attack spends the focus, and it must build it up again. Focus builds faster while it moves.

actors.mobs.phantompiranha.name=translucent lamprey
actors.mobs.phantompiranha.teleport_away=The translucent lamprey teleports away...
actors.mobs.phantompiranha.desc=Translucent lampreys are a rare variant with almost transparent bodies. They teleport when attacked, either to escape or to suddenly get close to their target!\n\nWhile they are annoying to fight, their meat is prized for its strange properties.

actors.mobs.piranha.name=swarm lamprey
actors.mobs.piranha.desc=The swarm breeds these lampreys to guard flooded areas. Their bite is deadly, so it is best not to confront them directly.
actors.mobs.piranha.discover_hint=You can find this enemy in any sector.

actors.mobs.pylon.name=power pylon
actors.mobs.pylon.desc_inactive=A pylon the pirates set up to distribute power to the mining machines.\n\nThe pylon is switched off and immune to damage.
actors.mobs.pylon.desc_active=A pylon the pirates set up to distribute power to the mining machines. It is now full of charge, and that is what is supercharging the drill rig!\n\nIn this state the pylon can be damaged, but it throws electricity at nearby tiles, rotating clockwise. Its heavy metal frame makes it very durable.

actors.mobs.rat.name=crawler
actors.mobs.rat.desc=The most common form of the Vortex Swarm. A dog sized bug with six legs and mandibles that cut hull plating. Alone it is weak. The problem is that it almost never comes alone.

actors.mobs.ripperdemon.name=ripper
actors.mobs.ripperdemon.leap=The ripper prepares to leap!
actors.mobs.ripperdemon.desc=A lean caste made for hunting, with leaping hind legs and claws as long as blades. It hatches ready to fight in the chamber's brooders.\n\nThe ripper cannot take much damage, but it is fast and dangerous. It leaps great distances to reach its target and strike with its claws.

actors.mobs.rotheart.name=rot heart
actors.mobs.rotheart.desc=A Rotberry's fruit is very unique. Instead of rotting away and providing nutrients, the fruit grows, hardens, and encompasses the seed. It provides protection for the internal organs which grow inside the fruit. This giant orb is referred to as the heart of an adult rotberry plant.
actors.mobs.rotheart.discover_hint=You can find this enemy during a specific quest.

actors.mobs.rotlasher.name=rot lasher
actors.mobs.rotlasher.rankings_desc=Whipped by a rot lasher
actors.mobs.rotlasher.desc=The rot lasher is a part of a mature rotberry plant's root structure, and also their primary means of defense. Lashers are blind and stuck into the ground, but will violently assault any nearby threat after taking a moment to detect them. When there is no nearby enemies, they stand motionless, attempting to blend in with surrounding vegetation.
actors.mobs.rotlasher.discover_hint=You can find this enemy during a specific quest.

actors.mobs.scorpio.name=stinger
actors.mobs.scorpio.desc=A large caste with a segmented tail that fires serrated stingers. It avoids melee and prefers to cripple its prey from afar.

actors.mobs.senior.name=veteran mantid
actors.mobs.senior.desc=An older mantid with a scar-covered carapace. It has learned from many fights and builds focus while moving much faster than the others.\n\nWhen focused, it parries the next physical attack, even one that was certain to hit. Focus builds faster while it moves and slower while it fights.

actors.mobs.shaman.name=psionic assimilated
actors.mobs.shaman.bolt_kill=The psionic bolt killed you...
actors.mobs.shaman.desc=The swarm opened this crew member's skull and planted a node that glows under the skin. It is weak in melee, but it fires psionic bolts from a distance.
actors.mobs.shaman$redshaman.spell_desc=This one's node glows red, and its bolt _temporarily weakens your attacks._
actors.mobs.shaman$blueshaman.spell_desc=This one's node glows blue, and its bolt _temporarily increases the damage you take._
actors.mobs.shaman$purpleshaman.spell_desc=This one's node glows purple, and its bolt _temporarily reduces your accuracy and evasion._

actors.mobs.armoredbrute.name=armored assimilated
actors.mobs.armoredbrute.desc=A brute still wearing the combat armor from its days as a soldier, now fused to the carapace. It resists physical damage far better and can stay enraged much longer before it falls.

actors.mobs.skeleton.name=husk
actors.mobs.skeleton.explo_kill=You were killed by the shards of a husk...
actors.mobs.skeleton.def_verb=blocked
actors.mobs.skeleton.desc=What is left of an assimilated once the swarm is done with the body: a hard, hollow shell that still moves.\n\nWhen a husk falls it bursts and throws shards at anyone next to it.

actors.mobs.slime.name=swarm ooze
actors.mobs.slime.def_verb=blocked
actors.mobs.slime.desc=A lump of living tissue the swarm leaves wherever it settles. Rubbery outside, liquid inside. Very strong blows lose force passing through the ooze.

actors.mobs.snake.name=stalker
actors.mobs.snake.hint=Try using the examine button on a stalker to learn how to fight it.
actors.mobs.snake.desc=A long, smooth predator that waits in the ducts. It dodges blows absurdly fast, which makes it hard to hit. If it reaches you unseen, its first blow deals double damage. Surprise attacks and attacks that never miss can still catch it.

actors.mobs.spectralnecromancer.name=pale incubator
actors.mobs.spectralnecromancer.desc=An older, almost transparent incubator. Instead of raising husks, it releases flying larvae that pass through any cover.

actors.mobs.spinner.name=weaver
actors.mobs.spinner.desc=A swarm caste that avoids direct fights. It shoots webbing over long distances to block its prey's path, then waits at range for its venomous bite to take effect.

actors.mobs.statue.name=guard automaton
actors.mobs.statue.def_verb=blocked
actors.mobs.statue.desc=It looks like just another of the ship's inactive security robots, but its glowing red eyes give it away.
actors.mobs.statue.desc_weapon=Its chassis is cheap alloy, but the _%s_ it is wielding looks real.
actors.mobs.statue.discover_hint=You can find this enemy in any sector.

actors.mobs.succubus.name=pheromancer
actors.mobs.succubus.desc=A slender caste that releases a mist of pheromones when it attacks. Anyone who breathes it in is charmed for a while and cannot attack it.\n\nWhen the pheromancer strikes a charmed victim, it drains part of their life.

actors.mobs.swarm.name=larva cloud
actors.mobs.swarm.desc=A buzzing cloud of flying swarm larvae. Every non magical attack splits it into two smaller clouds that are just as dangerous.

actors.mobs.tengu.name=Captain Rasha Kell
actors.mobs.tengu.notice_gotcha=Found you, %s!
actors.mobs.tengu.interesting=Let's make this more interesting...
actors.mobs.tengu.notice_have=You are not getting away now, %s!
actors.mobs.tengu.defeated=The Laztro... was mine...
actors.mobs.tengu.rankings_desc=Shot down by Captain Rasha Kell
actors.mobs.tengu.desc=Captain of the Murky Claw, the pirate freighter that landed after the Vigil-7 wreckage. The swarm took her ship engines, and now she wants off the planet with all the Laztro she can carry.\n\nShe is fast, blinks around with a personal transporter and fights with throwing knives, smoke bombs and improvised traps.

actors.mobs.tengu$bombability$bombblob.desc=A cloud of superheated smoke is billowing here. Watch out, it's going to explode!
actors.mobs.tengu$bombability$bombitem.name=smoke bomb
actors.mobs.tengu$bombability$bombitem.cant_pickup=It's stuck to the ground, you can't move it!
actors.mobs.tengu$bombability$bombitem.desc=The captain threw a smoke bomb here that is pouring out thick, hot vapor. It is about to explode!

actors.mobs.tengu$fireability$fireblob.desc=The captain scattered a flammable powder here, and it is already starting to catch fire!

actors.mobs.tengu$shockerability$shockerblob.desc=Electrical energy is building here, anything standing on this tile will be shocked next turn!
actors.mobs.tengu$shockerability$shockeritem.name=shocker
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=It's putting out too much electricity, you can't grab it!
actors.mobs.tengu$shockerability$shockeritem.desc=The captain threw a machine built from security drone parts here. It sends electric discharges into the surrounding tiles.

actors.mobs.thief.name=scavenger pirate
actors.mobs.thief.stole=The pirate took your %s!
actors.mobs.thief.carries=\n\nThe pirate is carrying a _%s._ Stolen, obviously.
actors.mobs.thief.escapes=The pirate got away with your %s!
actors.mobs.thief.desc=A crew member of the Murky Claw. The pirates came for the Vigil-7 wreckage and they scavenge anything of value, including what you carry. They do not bargain. They grab and run.

actors.mobs.tormentedspirit.name=crew hologram
actors.mobs.tormentedspirit.desc=Crew holograms hold the memory of someone who served well, but a virus has taken over the projection. While infected it attacks just like a corrupted hologram, and is more powerful as well!\n\nIt may be possible to purge the virus by using the right item next to the projection. If it works, the crew member will surely be grateful...
actors.mobs.tormentedspirit.thank_you=Thank you...

actors.mobs.npcs.vaultlaser.name=disintegration sentry
actors.mobs.npcs.vaultlaser.ondeath=You were killed by the disintegration ray...
actors.mobs.npcs.vaultlaser.desc=These sentries fire disintegration beams at regular or semi-random intervals. The beams are very dangerous, but at least they always hit the same spot. Nothing can resist them, so _you will have to avoid them somehow_.

actors.mobs.npcs.vaultsentry.name=scanning sentry
actors.mobs.npcs.vaultsentry.ondeath=The lightning bolt killed you...
actors.mobs.npcs.vaultsentry.desc=These sentries scan the area in a pre-set pattern. They look quite hazardous, you'll surely be zapped if you are detected by the scan. The pattern can often be avoided, but the sentries also have to visually see you in order to detect you, so _anything that obscures vision is effective against them_.

actors.mobs.npcs.vaulttokendoor.name=Vault door
actors.mobs.npcs.vaulttokendoor.def_verb=blocked
actors.mobs.npcs.vaulttokendoor.desc=This door has no lock, but it will not budge. There is a reader in its center with ten slots the size of an access chip.
actors.mobs.npcs.vaulttokendoor.no_tokens=_Perhaps something you can find in the vault might fit here?_
actors.mobs.npcs.vaulttokendoor.too_few_tokens=_Your access chips fit the reader perfectly_, but you do not have enough of them yet.
actors.mobs.npcs.vaulttokendoor.enough_tokens=_You have enough access chips to fill every slot_. Do you want to insert them?
actors.mobs.npcs.vaulttokendoor.open=Open the Door
actors.mobs.npcs.vaulttokendoor.not_yet=Not Yet
actors.mobs.npcs.vaulttokendoor.unlocked=The reader accepts the chips and you hear the door's bolts slide free.

actors.mobs.npcs.vaultmirror.name=Holographic projector
actors.mobs.npcs.vaultmirror.def_verb=blocked
actors.mobs.npcs.vaultmirror.desc=A large projector surrounded by lit status lights. It hums softly, but projects nothing for now.
actors.mobs.npcs.vaultmirror.approach=In front of you stands a large holographic projector with a thick metal frame. The projection field stays dark until you come close. When you lean in, the lights on the frame flare and a strangely familiar scene appears in the air.
actors.mobs.npcs.vaultmirror.scene_warrior=You see your dented _shield generator_, half buried in the planet's ash. The scene feels like a memory, but the details are wrong. You could never bring yourself to get rid of the generator, keeping the broken device felt like part of your punishment. You have also spent a long time looking at it, and the crack is at a slightly different angle.
actors.mobs.npcs.vaultmirror.scene_mage=You see your _orbital transmitter_ in its rack in the Vigil-7's comms room. The scene feels like a memory, but the details are wrong. The panel shows every Brigade satellite answering, something you have not seen since the crash. The duty operator's chair is occupied too, and he died on impact.
actors.mobs.npcs.vaultmirror.scene_rogue=You see the _active camo module_ hanging in your team's locker on the Vigil-7. The scene feels like a memory, but the details are wrong. The lockers next to it are full, each with a teammate's name on the door. You emptied almost all of them with your own hands after the last mission.
actors.mobs.npcs.vaultmirror.scene_huntress=You see your _pulse cannon_ mounted on the exoskeleton's arm in the Vigil-7's hangar. The scene feels like a memory, but the details are wrong. The suit is intact, without a single combat mark, and the chief mechanic calmly checks the arm's joints. You have never seen the hangar this quiet.
actors.mobs.npcs.vaultmirror.scene_duelist=You see a tall figure in an Orbital Brigade uniform standing before you: yourself, before the swarm. The scene feels like a memory, but the details are wrong. His skin is still entirely human, without a single carapace plate. He holds out the _symbiote blade_ for you to take, as if it had always been his.
actors.mobs.npcs.vaultmirror.scene_cleric=You see the _synthetic core_ seated on the maintenance bench in the Vigil-7's infirmary. The scene feels like a memory, but the details are wrong. You never left that bench with the core exposed, only with it already installed. The energy coming from it feels unusual too, as though it draws on a different source.
actors.mobs.npcs.vaultmirror.scene_final=The projection field has become completely solid. Nothing stops you from reaching out and taking the item.
actors.mobs.npcs.vaultmirror.take=Take the Item
actors.mobs.npcs.vaultmirror.scene_take=You take the item, and the scene stays the same, as if it existed in two places at once.\n\nThe projection fades, and the object in your hand pulses slowly in time with the lights on the frame.\n\nYou are not sure what just happened, but the item seems tied to the projector. You probably will not be able to take it out of the vault.
actors.mobs.npcs.vaultmirror.scene_nothing=You approach the projector again, but nothing happens. The field stays dark.
actors.mobs.npcs.vaultmirror$mirrorsword.name=symbiote blade
actors.mobs.npcs.vaultmirror$mirrorsword.desc=A broad blade of living carapace, bound to the forearm by swarm tendons. It answers to your muscles as if it were part of your arm.

actors.mobs.warlock.name=hive gunner
actors.mobs.warlock.bolt_kill=The corrosive shot killed you...
actors.mobs.warlock.desc=A swarm caste with a huge gland in its abdomen that hangs back and fires globs of acid. The acid eats into metal and temporarily weakens the upgrades on your gear. The more upgraded an item is, the harder it is hit.

actors.mobs.wraith.name=corrupted hologram
actors.mobs.wraith.desc=The projection of a crew member trapped in a loop of corrupted data, attacking anything that moves. Being made of light, it is very hard to hit with a regular weapon.
actors.mobs.wraith.discover_hint=You can find this enemy in any sector.

actors.mobs.yogdzewa.name=Swarm Queen
actors.mobs.yogdzewa.notice=I. SEE. YOU.
actors.mobs.yogdzewa.darkness=The humming closes in...
actors.mobs.yogdzewa.hope=YOUR. SHIP. IS. MINE!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devoured by the Swarm Queen
actors.mobs.yogdzewa.desc=The Swarm Queen is the mind that commands the Vortex Swarm. Every insectoid on the planet obeys her, and every assimilated crew member is another pair of eyes and hands in her service.\n\nShe is too large to leave her chamber and never moves. Instead, she fires energy beams through her ocelli and calls the castes that guard the chamber to fight for her.
actors.mobs.yogdzewa.desc_spawners=You can feel the humming from the sectors above running through the walls to the queen. Something you left alive up there is feeding the chamber. _She will use that strength to summon stronger castes!_
actors.mobs.yogdzewa$larva.name=royal larva
actors.mobs.yogdzewa$larva.rankings_desc=Devoured by the Swarm Queen
actors.mobs.yogdzewa$larva.desc=The queen's newborn brood. One alone is weak, but she produces them very quickly, and in large numbers they can overwhelm anyone.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devoured by the Swarm Queen
actors.mobs.yogdzewa$yogeye.rankings_desc=Devoured by the Swarm Queen
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devoured by the Swarm Queen

actors.mobs.yogfist.invuln_warn=The claw is invulnerable while it is near the queen!
actors.mobs.yogfist.rankings_desc=Devoured by the Swarm Queen
actors.mobs.yogfist.desc=This claw is a royal guard, bred only to defend the queen. While it stays near her, it takes no damage at all.
actors.mobs.yogfist$burningfist.name=igneous claw
actors.mobs.yogfist$burningfist.desc=This claw burns from the inside. The ground catches fire wherever it goes, and it fires blasts that spread flames.\n\nNear water it cannot spread fire, but it is so hot that any water around it evaporates before long!
actors.mobs.yogfist$soiledfist.name=earthen claw
actors.mobs.yogfist$soiledfist.desc=This claw is covered in spores. Vegetation sprouts wherever it goes, and it fires blasts that trap its target in fast-growing roots!\n\nIt draws strength from the plants and resists more damage the more tall or trampled vegetation is near it!
actors.mobs.yogfist$rottingfist.name=rotting claw
actors.mobs.yogfist$rottingfist.desc=This claw is a mass of rotting flesh. It spreads caustic mucus around it and releases toxic gas when attacking from range. Worse still, its mass makes it bleed instead of taking damage all at once.\n\nWater washes away the mucus, but the claw can also absorb water to heal! Hurting it while it bleeds renews the bleeding, but does not stack it!
actors.mobs.yogfist$rustedfist.name=corroded claw
actors.mobs.yogfist$rustedfist.desc=This claw grew around a ship's hull and became a mass of living metal. It hits hard in melee and cripples targets from range. Because of its mass, it takes damage over time instead of all at once.\n\nThe claw is rigid and cannot fit through tight spaces. Even though it takes damage slowly, the deferred damage keeps growing if it is hit many times.
actors.mobs.yogfist$brightfist.name=luminous claw
actors.mobs.yogfist$brightfist.teleport=The claw vanishes in a flash that blinds you!
actors.mobs.yogfist$brightfist.desc=This claw is full of bioluminescent organs. It fires bright beams every turn that deal heavy damage and blind for a while. It can also flood the area with light to escape!\n\nIt has no special abilities in melee.
actors.mobs.yogfist$darkfist.name=shadow claw
actors.mobs.yogfist$darkfist.teleport=The claw vanishes in a cloud of ink that snuffs out your light!
actors.mobs.yogfist$darkfist.desc=This claw releases a dark ink that drinks in light. It fires blasts every turn that deal heavy damage and weaken your light source. It can also darken the area to escape!\n\nIt has no special abilities in melee.


