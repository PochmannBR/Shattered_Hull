actors.mobs.spitter.name=spitter
actors.mobs.spitter.desc=A swarm form with an acid sac where its chest should be. It spits from range every turn, and the acid keeps eating after impact. Close the distance or stay out of its line of fire.
actors.mobs.spitter.spit_kill=The spitter acid dissolved you...
actors.mobs.npcs.fabricator.name_ammo=ammo fabricator
actors.mobs.npcs.fabricator.name_medical=medical fabricator
actors.mobs.npcs.fabricator.name_armory=armory fabricator
actors.mobs.npcs.fabricator.desc=A Vigil-7 fabricator that survived the crash. It turns Laztro into useful matter, but its core is damaged: it can only build one kind of item and has power for just a few jobs.\n\nThe recycler still works: anything you _dismantle_ here turns into Laztro, even with the core out of power.
actors.mobs.npcs.fabricator.desc_ammo=This one builds ammunition.
actors.mobs.npcs.fabricator.desc_medical=This one builds medicine.
actors.mobs.npcs.fabricator.desc_armory=This one builds armor.
actors.mobs.npcs.fabricator.panel=Laztro available: _%d LZ_\nJobs left: _%d_
actors.mobs.npcs.fabricator.not_enough=You need _%d more LZ_ to build this.
actors.mobs.npcs.fabricator.depleted=The core is out of power. This fabricator will not build anything else.
actors.mobs.npcs.fabricator.craft=Build %s (%d LZ)
actors.mobs.npcs.fabricator.leave=Leave
actors.mobs.npcs.fabricator.crafted=The fabricator built: %s.
actors.mobs.npcs.fabricator.now_depleted=The fabricator light goes dark. Its power is spent.
