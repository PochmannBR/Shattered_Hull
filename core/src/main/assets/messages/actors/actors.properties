actors.mobs.npcs.fabricator.product_medical=injector of healing
actors.mobs.npcs.fabricator.product_armor=armor
actors.mobs.crab.burrow=The digger vanishes into the ground and bursts out beside you!
actors.mobs.snake.ambush=The stalker leaps out of the shadows!
actors.mobs.snake.ambush_status=ambush
actors.mobs.thief.grabbed=The pirate grabbed %d LZ off the floor!
actors.hero.hero.continue_revive=Your suit restarts your vital signs at the start of the sector. That was your only continue.
actors.mobs.npcs.fabricator.dismantle=Dismantle an item
actors.mobs.npcs.fabricator.dismantle_prompt=Dismantle which item?
actors.mobs.npcs.fabricator.dismantle_confirm=Dismantling the _%s_ yields _%d LZ_. The item is destroyed for good.
