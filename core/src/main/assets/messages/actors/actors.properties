actors.mobs.npcs.fabricator.dismantle_no=Cancel
actors.mobs.npcs.fabricator.dismantled=You dismantled the %s and recovered %d LZ.
actors.hero.talent.quick_reload.title=quick reload
actors.hero.talent.quick_reload.desc=_+1:_ Reloading the rifle takes _0.75 turns_ instead of 1.\n\n_+2:_ Reloading the rifle takes _half a turn_ instead of 1.
actors.hero.talent.ammo_reserve.title=ammo reserve
actors.hero.talent.ammo_reserve.desc=_+1:_ The chance of finding a second magazine in each sector rises from 50% to _75%_.\n\n_+2:_ The Marine _always_ finds a second magazine in each sector.\n\nApplies to sectors not yet visited.
actors.hero.talent.stunning_butt.title=stunning butt strike
actors.hero.talent.stunning_butt.desc=_+1:_ Melee hits with the rifle have a _10% chance_ to stun the enemy for 2 turns.\n\n_+2:_ Melee hits with the rifle have a _20% chance_ to stun the enemy for 2 turns.\n\n_+3:_ Melee hits with the rifle have a _30% chance_ to stun the enemy for 2 turns.\n\nDoes not work on bosses.
actors.hero.talent.deep_recon.title=deep recon
actors.hero.talent.deep_recon.desc=_+1:_ Each stealth kill reveals the map in a _4 tile_ radius, up from 3.\n\n_+2:_ Each stealth kill reveals the map in a _5 tile_ radius, up from 3.
actors.hero.talent.vanish_in_chaos.title=vanish in the chaos
actors.hero.talent.vanish_in_chaos.desc=_+1:_ After a stealth kill, the operator becomes invisible for _2 turns_.\n\n_+2:_ After a stealth kill, the operator becomes invisible for _3 turns_.
actors.hero.talent.enhanced_rings.title=enhanced implants
actors.hero.talent.enhanced_rings.desc=_+1:_ When the operator uses a module, his implants gain +1 level for _3 turns_.\n\n_+2:_ When the operator uses a module, his implants gain +1 level for _6 turns_.\n\n_+3:_ When the operator uses a module, his implants gain +1 level for _9 turns_.
actors.hero.talent.silent_headshot.title=silent headshot
actors.hero.talent.silent_headshot.desc=_+1:_ Pistol shots against an unaware enemy deal _15% more damage_.\n\n_+2:_ Pistol shots against an unaware enemy deal _30% more damage_.\n\n_+3:_ Pistol shots against an unaware enemy deal _45% more damage_.
actors.buffs.recondata.name=recon
actors.buffs.recondata.desc=Recon data from a test version.
actors.buffs.recondata.abate=Stealth kill. Recon reveals the map around it.
