##classes
actors.hero.heroclass.warrior=marine
actors.hero.heroclass.warrior_desc_short=The Marine endures extra damage with shielding granted by his _broken generator._ The generator can be moved between armors and _transfers a single upgrade._
actors.hero.heroclass.warrior_desc=The Marine starts with a _unique broken seal_ that grants him a burst of shielding when he is below half health. The generator can be moved between armors, and can _transfer a single upgrade_ with it.\n\nThe Marine also starts with a loaded _service rifle_, _one spare magazine_, standard uniform, a med kit, and a velvet pouch.\n\nThe Marine automatically identifies:\n_-_ Cartridges of Identify\n_-_ Injectors of Healing\n_-_ Cartridges of Rage
actors.hero.heroclass.warrior_unlock=The Marine is automatically unlocked.

actors.hero.heroclass.mage=exterminator
actors.hero.heroclass.mage_desc_short=The Exterminator calls in strikes and scans from the Brigade _orbital satellites_. Calls recharge by turn, and in the deep caverns the signal fails.
actors.hero.heroclass.mage_desc=The Exterminator talks directly to the satellite network still orbiting the planet. He marks targets for _orbital strikes_ and requests _scans_ that reveal the surrounding sector.\n\nEach call recharges over turns. Under the rock of the deep caverns the signal fails and he has to manage without the sky.\n\nPlanned specializations: _Purifier_ and _Seer_.
actors.hero.heroclass.mage_unlock=_Class in development._ It cannot be played in this version yet.

actors.hero.heroclass.rogue=special forces
actors.hero.heroclass.rogue_desc_short=Special Forces fight unseen. The _suppressed pistol_ makes no noise, and every _stealth kill_ reveals part of the sector map.
actors.hero.heroclass.rogue_desc=Operators trained to go where the rest of the Brigade cannot. The Marine takes the hits and trades fire. The operator chooses when the fight begins.\n\nHe starts with a _combat knife_, a loaded _suppressed pistol_, _a spare magazine_ and the _active camo module_, which erases him from the swarm's sight for a few turns. The pistol takes the same magazine as the rifle and, unlike the rifle, does not draw nearby enemies.\n\nKilling an enemy that had not seen the operator is a _stealth kill_, which reveals the map around the enemy.\n\nSpecializations:\n_Eliminator:_ prepares a deadly strike while invisible, blinks to the target and instantly eliminates enemies who are weak enough.\n_Scout:_ builds momentum as he moves and breaks into a sprint, with double speed and extra evasion.
actors.hero.heroclass.rogue_unlock=Without buying the class, you can try the Special Forces until the end of sector 5.

actors.hero.heroclass.huntress=exosuit pilot
actors.hero.heroclass.huntress_desc_short=The Pilot fights inside an _exoskeleton_ with its own integrity. Outside it the pilot is fragile and needs _ship scrap_ to repair it.
actors.hero.heroclass.huntress_desc=The Pilot goes into combat inside an _assault exoskeleton_. The suit has its own integrity, which absorbs damage before the pilot does.\n\nWhen the suit goes down the pilot is fragile and must gather _Vigil-7 scrap_ to repair it. Managing the suit is the heart of the class.\n\nPlanned specializations: _Assault Frame_ and _Siege Frame_.
actors.hero.heroclass.huntress_unlock=_Class in development._ It cannot be played in this version yet.

actors.hero.heroclass.duelist=renegade
actors.hero.heroclass.duelist_desc_short=The Renegade is a _partially assimilated_ soldier. He absorbs parts of enemies to gain abilities, but too much assimilation brings side effects.
actors.hero.heroclass.duelist_desc=He survived the swarm, but not in one piece. Part of his body already answers to the hive, and the Renegade uses it: he _absorbs parts of slain enemies_ to gain new abilities.\n\nThe more he assimilates, the stronger he gets, and the closer he comes to losing control. Past a certain level the _side effects_ arrive.\n\nPlanned specializations: _Symbiote_ and _Purged_.
actors.hero.heroclass.duelist_unlock=_Class in development._ It cannot be played in this version yet.

actors.hero.heroclass.cleric=synthetic
actors.hero.heroclass.cleric_desc_short=The Synthetic is a _shipboard android_. It feels no hunger, runs on _ship batteries_ and hacks terminals and turrets, but suffers from electric damage.
actors.hero.heroclass.cleric_desc=A synthetic unit from the Vigil-7 crew. It neither eats nor sleeps, but burns through _ship batteries_ to stay active.\n\nIt can _hack terminals and turrets_ and turn the ship systems in its favor. In exchange, it is _vulnerable to electric damage_.\n\nPlanned specializations: _Systems Intruder_ and _Combat Unit_.
actors.hero.heroclass.cleric_unlock=_Class in development._ It cannot be played in this version yet.

actors.hero.herosubclass.berserker=vanguard
actors.hero.herosubclass.berserker_short_desc=The _Frontliner_ builds rage while taking damage. Rage boosts his damage and, at 100%, can be released for extra protection.
actors.hero.herosubclass.berserker_desc=The Vanguard gains rage as he takes physical damage, including damage that gets blocked by his armor! Rage steadily fades away over time, but fades more slowly if he is at low HP.\n\nRage can cause the Vanguard to deal up to +50% damage. At max rage he can go berserk, gaining a burst of shielding and keeping his rage as long as he has shielding left. The shielding scales with the level of the vanguard's armor, and can be massively boosted if he is at low health. The Vanguard needs time to recover after he goes berserk.
actors.hero.herosubclass.gladiator=marksman
actors.hero.herosubclass.gladiator_short_desc=The _Marksman_ builds combo with every hit, including rifle shots. He spends combo on finishers such as the headshot and the burst.
actors.hero.herosubclass.gladiator_desc=The Marksman builds one point of combo every time he makes a successful attack with a melee or thrown weapon. If the Marksman does not make a successful attack within 5 turns (15 turns after a kill), his combo is reset.\n\nAs he builds combo the Marksman can use a variety of abilities that are guaranteed to hit:\n2 Combo: knock enemy back, preserves combo\n4 Combo: deal damage based on armor\n6 Combo: parry, preserves combo\n8 Combo: damage target and nearby enemies\n10 Combo: attack once for each combo
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_short_desc=The _Battlemage_ conjures bonus effects when fighting in melee with his staff. These effects depend on the special weapon his staff is imbued with.
actors.hero.herosubclass.battlemage_desc=The Battlemage gains a bonus effect whenever he strikes in melee with his staff, as if his staff had an additional enchantment. These effects depend on the special weapon his staff is imbued with, every special weapon has its own effect. In addition to the special weapon effects, the Battlemage's staff will also gain 0.5 charges when he strikes with it.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_short_desc=The _Warlock_ has a chance to soul mark enemies with his special weapons. He will heal whenever he deals physical damage to marked enemies.
actors.hero.herosubclass.warlock_desc=The Warlock has a chance to inflict a soul mark on characters when he uses special weapons on them. The chance to apply a soul mark and its duration increase with special weapon level.\n\nWhen an enemy is soul marked, the Warlock will heal 2 hp for every 5 damage he deals to them, but only with attacks from melee or thrown weapons, not from special weapons!
actors.hero.herosubclass.assassin=eliminator
actors.hero.herosubclass.assassin_short_desc=The _Eliminator_ prepares a deadly strike while he is invisible. The longer he waits, the stronger the strike.
actors.hero.herosubclass.assassin_desc=The Eliminator starts preparing his next strike when he becomes invisible. The longer he prepares, the stronger the strike, up to 9 turns.\n\nAfter preparing, the Eliminator deals bonus damage on his next attack, can blink to the target before striking, and can instantly eliminate enemies who are weak enough.
actors.hero.herosubclass.freerunner=scout
actors.hero.herosubclass.freerunner_short_desc=The _Scout_ builds momentum as he moves and can spend it to break into a sprint, gaining speed and evasion for a few turns.
actors.hero.herosubclass.freerunner_desc=The Scout builds momentum as he moves, up to 10 charges after 10 turns of movement, and loses it quickly when he stops. Each charge is worth 2 turns of sprinting.\n\nWhile sprinting, the Scout moves at double speed and gains evasion based on his level. When the sprint ends, he needs some time before building momentum again.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_short_desc=The _Sniper_ can pierce armor with her ranged attacks. After striking with a thrown weapon she can follow up with a special attack from her bow.
actors.hero.herosubclass.sniper_desc=The Sniper is a master of ranged combat, whose ranged attacks pierce enemy armor. When she attacks an enemy with a thrown weapon, she places a sniper's mark on them, which lets her follow up with a special attack from her bow. This special attack varies based on how her bow is augmented.\n\nAn unaugmented bow will fire a snapshot which deals reduced damage but fires instantly. A speed bow will fire a volley of three arrows which deal reduced damage, can still activate enchantments, and take 1 turn to fire. A damage bow will fire a sniper shot which is guaranteed to hit, deals bonus damage based on distance, and takes 2 turns to fire.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_short_desc=The _Warden_ can see through tall grass and gains bonus effects when she plants seeds and tramples plants.
actors.hero.herosubclass.warden_desc=The Warden has a strong connection to nature which grants her a variety of bonus effects relating to grass and plants. She is able to see through tall and furrowed grass as if it were empty space.\n\nThe Warden causes grass to sprout up around any seed she throws or plants, and gains special effects when trampling plants. These special effects replace the regular plant effects, meaning that no plant is harmful for her to step on.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_short_desc=The _Champion_ can wield two weapons and gets more weapon charges. Her regular attacks use her primary weapon, but she can swap weapons and use either weapon's ability.
actors.hero.herosubclass.champion_desc=The Champion is a master of melee weapons who can equip a secondary weapon in addition to her primary one. Her regular attacks use her primary weapon, but she can swap her primary weapon instantly and use either weapon's ability.\n\nShe also gains 2 more max weapon ability charges and +50% weapon ability recharge speed.
actors.hero.herosubclass.monk=monk
actors.hero.herosubclass.monk_short_desc=The _Monk_ builds energy while fighting. This energy can be spent on a variety of unique abilities.
actors.hero.herosubclass.monk_desc=The Monk is a master of physical technique. As she defeats enemies, she gains energy which can be used on a variety of defensive and utility-focused abilities. This energy does not fade over time, but has a cap based on the Monk's level.\n\n1 Energy: quickly strike with fists\n2 Energy: focus to dodge next attack\n3 Energy: instantly dash nearby\n4 Energy: kick an enemy away\n5 Energy: meditate to clear statuses and restore special weapon & module charge
actors.hero.herosubclass.priest=priest
actors.hero.herosubclass.priest_short_desc=The _Priest_ gains new long-range spells and an empowered version of guiding light.
actors.hero.herosubclass.priest_desc=The Priest gains a variety of new and upgraded spells that emphasize ranged combat and synergy with magical items.\n\nThe Priest can cast _Guiding Light_ for free once every 50 turns, illuminates enemies directly targeted by any of their spells, and can consume the illumination debuff with allies, special weapons, and some modules for bonus damage equal to their level + 5.\n\nThe Priest also gains the _Radiance_ spell, which dispels darkness and affects all visible enemies, triggering and applying illuminate and briefly stunning them at the cost of 2 charges.
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_short_desc=The _Paladin_ gains new short-range spells and empowered versions of holy weapon and ward.
actors.hero.herosubclass.paladin_desc=The Paladin gains a variety of new and upgraded spells that emphasize melee combat and synergy with weapons and armor.\n\nThe Paladin's _Holy Weapon_ and _Holy Ward_ spells grant larger bonuses, no longer override existing enchantments and glyphs, and can be extended by casting other spells.\n\nThe Paladin also gains the _Smite_ spell, which lets them perform a guaranteed melee hit with bonus damage and enchantment power.

