actors.mobs.spitter.name=cuspidor
actors.mobs.spitter.desc=Uma forma do enxame com uma bolsa de ácido no lugar do tórax. Cospe de longe a cada turno e o ácido continua corroendo depois do impacto. Chegue perto ou fique fora da linha de tiro.
actors.mobs.spitter.spit_kill=O ácido do cuspidor dissolveu você...
actors.mobs.npcs.fabricator.name_ammo=fabricador de munição
actors.mobs.npcs.fabricator.name_medical=fabricador médico
actors.mobs.npcs.fabricator.name_armory=fabricador de armaria
actors.mobs.npcs.fabricator.desc=Um fabricador da Vigília-7 que sobreviveu à queda. Ele converte Laztro em matéria útil, mas o núcleo está danificado: só monta uma linha de itens e tem energia para poucas fabricações. Quanto mais fundo no planeta, mais projetos sobreviveram no banco de dados, e mais coisas ele sabe montar.\n\nO reciclador continua funcionando: qualquer item que você _desmontar_ aqui vira Laztro, mesmo com o núcleo sem energia.
actors.mobs.npcs.fabricator.desc_ammo=Este aqui monta munição, dardos e bombas.
actors.mobs.npcs.fabricator.desc_medical=Este aqui monta injetores, biomassa e rações. Para o Renegado, também injetores supressores.
actors.mobs.npcs.fabricator.desc_armory=Este aqui monta armaduras e armas corpo a corpo.
actors.mobs.npcs.fabricator.panel=Laztro disponível: _%d LZ_\nFabricações restantes: _%d_
actors.mobs.npcs.fabricator.depleted=O núcleo está sem energia. Este fabricador não vai montar mais nada.
