##classes
actors.hero.heroclass.warrior=fuzileiro
actors.hero.heroclass.warrior_desc_short=O Fuzileiro suporta dano extra com a proteção concedida pelo seu _gerador de escudo._ O gerador pode ser movido entre armaduras e _transfere um único aprimoramento._
actors.hero.heroclass.warrior_desc=O Fuzileiro começa com um _Selo Quebrado Único_, que concede um impulso de proteção quando sua vida estiver abaixo da metade. O gerador pode ser movido entre armaduras e pode _transferir um único aprimoramento_ com ele.\n\nO Fuzileiro também começa com um _fuzil de serviço_ carregado, _um carregador de reserva_, uniforme padrão, um kit de saúde e uma bolsa de veludo.\n\nO Fuzileiro automaticamente identifica:\n_-_ Cartuchos de Identificação\n_-_ Injetores de Cura\n_-_ Cartuchos da Fúria
actors.hero.heroclass.warrior_unlock=O Fuzileiro é desbloqueado automaticamente.

actors.hero.heroclass.mage=exterminador
actors.hero.heroclass.mage_desc_short=O Exterminador pede _suprimentos orbitais_ pelo transmissor. As cápsulas caem onde ele marcar, ferindo quem estiver embaixo e deixando munição, torretas, escudos e granadas.
actors.hero.heroclass.mage_desc=O Exterminador carrega um _transmissor orbital_ com a pistola de plasma acoplada. Pelo transmissor ele faz _pedidos de suprimento_: escolhe um item do catálogo, marca um ponto e a cápsula cai ali, ferindo quem estiver no caminho.\n\nCada pedido gasta cargas, e as cargas voltam com o tempo. O catálogo cresce a cada região alcançada.\n\nEle come normalmente e começa com armadura de tecido.
actors.hero.heroclass.mage_unlock=Sem a compra da classe, dá para testar o Exterminador até o fim do setor 5.

actors.hero.heroclass.rogue=forças especiais
actors.hero.heroclass.rogue_desc_short=As Forças especiais lutam sem ser vistas. A _pistola com supressor_ não faz barulho, e cada _abate furtivo_ revela parte do mapa do setor.
actors.hero.heroclass.rogue_desc=Operadores treinados para entrar onde o resto da Brigada não passa. O Fuzileiro aguenta o tranco e troca tiro. O operador escolhe a hora de começar a luta.\n\nEle começa com uma _faca de combate_, a _pistola com supressor_ carregada, _um carregador de reserva_ e o _módulo de camuflagem ativa_, que o apaga da visão do enxame por alguns turnos. A pistola usa o mesmo carregador do fuzil e, ao contrário dele, não atrai os inimigos em volta.\n\nMatar um inimigo que não tinha visto o operador é um _abate furtivo_, que revela o mapa em volta do inimigo.\n\nEspecializações:\n_Eliminador:_ prepara um golpe mortal enquanto está invisível, salta até o alvo e elimina de uma vez os inimigos que estiverem fracos o bastante.\n_Batedor:_ ganha impulso enquanto se move e dispara em corrida, com o dobro da velocidade e mais esquiva.
actors.hero.heroclass.rogue_unlock=Sem a compra da classe, dá para testar as Forças especiais até o fim do setor 5.

actors.hero.heroclass.huntress=piloto de exoesqueleto
actors.hero.heroclass.huntress_desc_short=O Piloto luta dentro de um _exoesqueleto_ com integridade própria. Fora dele fica frágil e precisa de _sucata da nave_ para consertá-lo.
actors.hero.heroclass.huntress_desc=O Piloto entra em combate dentro de um _exoesqueleto de assalto_. O traje tem integridade própria, que absorve o dano antes do piloto.\n\nQuando o traje cai, o piloto fica frágil e precisa juntar _sucata da Vigília-7_ para repará-lo. Administrar o traje é o centro da classe.\n\nEspecializações previstas: _Couraça de Assalto_ e _Couraça de Cerco_.
actors.hero.heroclass.huntress_unlock=_Classe em desenvolvimento._ Ela ainda não pode ser jogada nesta versão.

actors.hero.heroclass.duelist=renegado
actors.hero.heroclass.duelist_desc_short=O Renegado é um soldado _parcialmente assimilado_. Instala amostras do enxame no corpo para usar as habilidades delas, enchendo um _medidor de assimilação_ a cada uso.
actors.hero.heroclass.duelist_desc=Ele sobreviveu ao enxame, mas não saiu inteiro. O corpo do Renegado tem quatro lugares para _amostras do enxame_: cabeça, braços, tronco e pernas. Cada amostra empresta uma habilidade da criatura de onde veio.\n\nUsar uma habilidade enche o _medidor de assimilação_. Acima de 50 e de 75, ele fica mais forte, com efeitos colaterais. O medidor enche em 100, mas aguenta um pouco além disso, e essa _tolerância_ cresce a cada nível. Quando ela estoura, vem um surto e, depois, mutações. Os _injetores supressores_ baixam o medidor.\n\nEle começa com a faca de abordagem, dois injetores e uma amostra de rastejador instalada.
actors.hero.heroclass.duelist_unlock=Sem a compra da classe, dá para testar o Renegado até o fim do setor 5.

actors.hero.heroclass.cleric=sintético
actors.hero.heroclass.cleric_desc_short=O Sintético é uma _unidade de bordo_. Não come, gasta uma _reserva de energia_ que recarrega com abates e usa o núcleo para abrir portas, desligar armadilhas e invadir máquinas.
actors.hero.heroclass.cleric_desc=Uma unidade sintética da tripulação da Vigília-7. No lugar da fome, ele tem uma _reserva de energia_ que cai um ponto por turno e volta a cada inimigo abatido.\n\nO _núcleo sintético_ guarda as habilidades dele, todas pagas com a mesma reserva: dar choques, desligar armadilhas, abrir fechaduras, se reparar e, mais adiante, chamar um drone e invadir máquinas.\n\nInjetores e plantas de cura não funcionam nele, mas a estação médica sim. Ele é imune a veneno, sangramento e controle mental, e sofre mais com dano elétrico.
actors.hero.heroclass.cleric_unlock=Sem a compra da classe, dá para testar o Sintético até o fim do setor 5.

actors.hero.herosubclass.berserker=linha de frente
actors.hero.herosubclass.berserker_short_desc=O _Linha de Frente_ acumula fúria enquanto recebe dano. A fúria aumenta seu dano e, em 100%, pode ser liberada para ganhar proteção extra.
actors.hero.herosubclass.berserker_desc=O Linha de Frente acumula fúria conforme recebe dano físico, incluindo dano bloqueado por sua armadura! Fúria diminui lentamente com o tempo, mas diminui mais lentamente se ele está com pouco PV.\n\nO Linha de Frente pode causar até +50% de dano de fúria. Com a fúria no máximo, ele pode enfurecer, ganhando um impulso de blindagem e mantendo sua fúria enquanto tiver blindagem sobrando. A blindagem aumenta de acordo com o nível da armadura do linha de frente e pode ser significativamente aumentada se ele estiver com pouca vida. O linha de frente precisa de tempo para se recuperar após enfurecer.
actors.hero.herosubclass.gladiator=atirador de elite
actors.hero.herosubclass.gladiator_short_desc=O _Atirador de Elite_ acumula combo a cada ataque certeiro, inclusive os tiros do fuzil. Ele gasta o combo em finalizadores como o tiro na cabeça e a rajada.
actors.hero.herosubclass.gladiator_desc=O Atirador de Elite acumula um ponto de combo toda vez que realiza um ataque bem sucedido com uma arma corpo a corpo ou de arremesso. Se o Atirador de Elite não acertar um ataque em 5 turnos (15 turnos após uma morte), seu combo é reiniciado.\n\nÀ medida que acumula combo, o Atirador de Elite pode usar uma variedade de habilidades que têm acerto garantido:\n2 Combos: empurra o inimigo para trás e preserva o combo\n4 Combos: causa dano baseado na armadura \n6 Combos: bloqueia e preserva o combo\n8 Combos: causa dano ao alvo e aos inimigos próximos\n10 Combos: um ataque por cada combo acumulado
actors.hero.herosubclass.battlemage=intendente
actors.hero.herosubclass.battlemage_short_desc=O _Intendente_ paga uma carga a menos nos itens de 2 e 3 cargas, e as cargas do transmissor voltam mais rápido.
actors.hero.herosubclass.battlemage_desc=O _Intendente_ conhece a burocracia da Brigada por dentro. Os itens de 2 e 3 cargas custam uma carga a menos, e cada carga do transmissor volta em 75 turnos em vez de 100.
actors.hero.herosubclass.warlock=observador avançado
actors.hero.herosubclass.warlock_short_desc=No _Observador avançado_, as cápsulas causam 50% a mais de dano, e ele pode pedir um ataque orbital que atinge uma área de 3 por 3.
actors.hero.herosubclass.warlock_desc=O _Observador avançado_ marca alvos para a artilharia orbital. Suas cápsulas causam 50% a mais de dano.\n\nO catálogo dele ganha o _ataque orbital_, que custa uma carga, não entrega nada, causa o dobro do dano e atinge uma área de 3 por 3.
actors.hero.herosubclass.assassin=eliminador
actors.hero.herosubclass.assassin_short_desc=O _Eliminador_ prepara um golpe mortal enquanto está invisível. Quanto mais ele espera, mais forte o golpe.
actors.hero.herosubclass.assassin_desc=O Eliminador começa a preparar o próximo golpe quando fica invisível. Quanto mais tempo de preparo, mais forte o golpe, até o limite de 9 turnos.\n\nDepois de se preparar, o Eliminador causa dano extra no próximo ataque, pode saltar até o alvo antes de golpear e consegue eliminar de uma vez os inimigos que estiverem fracos o bastante.
actors.hero.herosubclass.freerunner=batedor
actors.hero.herosubclass.freerunner_short_desc=O _Batedor_ ganha impulso enquanto se move e pode gastá-lo para disparar em corrida, com mais velocidade e esquiva por alguns turnos.
actors.hero.herosubclass.freerunner_desc=O Batedor acumula impulso enquanto se move, até 10 cargas depois de 10 turnos andando, e perde tudo rápido quando para. Cada carga vale 2 turnos de corrida.\n\nCorrendo, o Batedor se move com o dobro da velocidade e ganha esquiva conforme o nível. Quando a corrida acaba, ele precisa de um tempo antes de voltar a acumular impulso.
actors.hero.herosubclass.sniper=atiradora
actors.hero.herosubclass.sniper_short_desc=A _Atiradora_ pode perfurar a armadura com seus ataques a distância. Após golpear o inimigo com uma arma de arremesso ela pode seguir com um ataque especial de seu arco.
actors.hero.herosubclass.sniper_desc=A Atiradora é uma mestra no combate à distância, cujos ataques podem perfurar a armadura do inimigo. Ao atacar com uma arma de arremesso, ela coloca uma marca de atiradora neles, o que a permite seguir com um ataque especial de seu arco. Esse ataque especial varia dependendo de como seu arco está modificado.\n\nUm arco não modificado irá disparar um tiro rápido que possui dano reduzido, porém atira instantaneamente. Um Arco Veloz disparará uma sequência de três flechas com dano reduzido, ainda pode ativar modificações e levará 1 turno para atirar. Um Arco de Dano disparará uma flecha da atiradora que possui acerto garantido, dá dano extra baseado na distância e levará 2 turnos para atirar.
actors.hero.herosubclass.warden=Guardiã
actors.hero.herosubclass.warden_short_desc=A _Guardiã_ pode ver através de grama alta e ganha efeitos bônus quando planta sementes e pisoteia plantas.
actors.hero.herosubclass.warden_desc=A Guardiã possui uma forte conexão com a natureza que concede a ela uma variedade de efeitos bônus relacionados a plantas e grama. Ela é capaz de ver através de grama alta e rugosa como se fossem um espaço vazio.\n\nA Guardiã faz grama brotar em volta de qualquer semente que ela jogue ou plante e ganha efeitos especiais ao pisotear plantas. Esses efeitos especiais substituem os efeitos regulares da planta, significando que nenhuma planta é prejudicial para ela pisar.
actors.hero.herosubclass.champion=híbrido
actors.hero.herosubclass.champion_short_desc=O _Híbrido_ abraça o enxame: o bônus da faixa alta fica maior, e no surto ele escolhe os alvos.
actors.hero.herosubclass.champion_desc=O _Híbrido_ parou de lutar contra o que está virando. O bônus de dano da faixa alta do medidor fica 50% maior, e durante o surto ele escolhe os alvos e não ataca aliados.
actors.hero.herosubclass.monk=disciplinado
actors.hero.herosubclass.monk_short_desc=O _Disciplinado_ controla o enxame: os injetores rendem mais, e abaixo de 50 ele luta melhor.
actors.hero.herosubclass.monk_desc=O _Disciplinado_ mantém o enxame na rédea curta. O injetor supressor tira 60 do medidor em vez de 40, e com o medidor abaixo de 50 ele ganha 10% de dano e de precisão.
actors.hero.herosubclass.priest=controlador
actors.hero.herosubclass.priest_short_desc=O _Controlador_ mantém as invasões por mais tempo e tem um drone mais resistente.
actors.hero.herosubclass.priest_desc=O _Controlador_ é especialista em tomar sistemas alheios. As máquinas invadidas ficam do lado dele por 50% a mais de tempo, e o drone tem 25% a mais de vida.\n\nOs talentos dele levam a invadir mais de uma máquina de uma vez.
actors.hero.herosubclass.paladin=couraçado
actors.hero.herosubclass.paladin_short_desc=O _Couraçado_ transforma energia gasta em escudo, se repara mais barato e sofre menos com dano elétrico.
actors.hero.herosubclass.paladin_desc=O _Couraçado_ foi reforçado para a linha de frente. 30% de toda energia que ele gasta vira escudo, o autorreparo custa 30 em vez de 40 e a fraqueza elétrica cai de 50% para 25%.

##talents
actors.hero.talent$provokedangertracker.name=Raiva provocada
actors.hero.talent$provokedangertracker.desc=O Fuzileiro perdeu recentemente sua blindagem, seu próximo ataque físico causará dano adicional.\n\nTurnos restantes: %s.
actors.hero.talent$lingeringmagictracker.name=Magia prolongada
actors.hero.talent$lingeringmagictracker.desc=O Mago usou recentemente um cajado ou uma arma especial, seu próximo ataque físico causará dano adicional.\n\nTurnos restantes: %s.
actors.hero.talent$followupstriketracker.name=ataque consecutivo
actors.hero.talent$followupstriketracker.desc=A Caçadora atacou recentemente um inimigo com uma arma de arremesso, seu próximo ataque corpo a corpo contra o mesmo alvo aumentará o dano.\n\nTurnos restantes: %s
actors.hero.talent$patientstriketracker.name=Golpe paciente
actors.hero.talent$patientstriketracker.desc=A Duelista acabou de passar um turno esperando, seu próximo ataque corpo a corpo causará dano adicional.
actors.hero.talent$improvisedprojectilecooldown.name=Tempo de recarga do projéteis improvisados
actors.hero.talent$improvisedprojectilecooldown.desc=Você usou este talento recentemente e precisa esperar antes de usá-lo de novo.\n\nTurnos restantes: %s
actors.hero.talent$rejuvenatingstepscooldown.name=Tempo de recarga de passos rejuvenescedores
actors.hero.talent$rejuvenatingstepscooldown.desc=Você usou este talento recentemente e precisa esperar antes de usá-lo de novo.\n\nTurnos restantes: %s
actors.hero.talent$seershotcooldown.name=Tempo de recarga do tiro da vidência
actors.hero.talent$seershotcooldown.desc=Você usou este talento recentemente e precisa esperar antes de usá-lo de novo.\n\nTurnos restantes: %s
actors.hero.talent$aggressivebarriercooldown.name=tempo de recarga de barreira agressiva
actors.hero.talent$aggressivebarriercooldown.desc=Você usou este talento recentemente e precisa esperar antes de usá-lo de novo.\n\nTurnos restantes: %s.
actors.hero.talent$liquidagilacctracker.name=Agilidade líquida
actors.hero.talent$liquidagilacctracker.desc=O próximo ataque regular corpo a corpo da Duelista ganhará precisão adicional.\n\nTurnos restantes: %s.
actors.hero.talent$lethalhastecooldown.name=tempo de recarga de pressa letal
actors.hero.talent$lethalhastecooldown.desc=Você usou este talento recentemente e precisa esperar antes de usá-lo de novo.\n\nTurnos restantes: %s.
actors.hero.talent$swiftequipcooldown.name=tempo de recarga do empunhar ágil
actors.hero.talent$swiftequipcooldown.desc=Você usou este talento recentemente e precisa esperar antes de usá-lo de novo.\n\nTurnos restantes: %s.
actors.hero.talent$preciseassaulttracker.name=investida precisa
actors.hero.talent$preciseassaulttracker.desc=O próximo ataque regular corpo a corpo da Duelista ganhará precisão adicional.\n\nTurnos restantes: %s.
actors.hero.talent$deadlyfollowuptracker.name=Acompanhamento mortal
actors.hero.talent$deadlyfollowuptracker.desc=A Duelista recentemente atacou um inimigo com uma arma de arremesso, seus ataques corpo a corpo contra o mesmo alvo terão o dano aumentado.\n\nTurnos restantes: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=executado
actors.hero.talent$satiatedspellstracker.name=Feitiço de Blindagem
actors.hero.talent$satiatedspellstracker.desc=O próximo feitiço que o Clérigo lançar concederá a ele uma pequena quantidade de blindagem.
actors.hero.talent$searinglightcooldown.name=Luz abrasadora
actors.hero.talent$searinglightcooldown.desc=Você usou este talento recentemente e precisa esperar antes de usá-lo de novo.\n\nTurnos restantes: %s.

#warrior
actors.hero.talent.hearty_meal.title=ração reforçada
actors.hero.talent.hearty_meal.desc=_+1:_ Comer cura o Fuzileiro em _4 PV_ quando sua vida está abaixo ou igual a 33%.\n\n_+2:_ Comer cura o Fuzileiro em _6 PV_ quando sua vida está abaixo ou igual a 33%.
actors.hero.talent.veterans_intuition.title=olho de veterano
actors.hero.talent.veterans_intuition.desc=_+1:_ O Fuzileiro identifica armas _1,75x mais rápido_ e armaduras _2,5x mais rápido_.\n\n_+2:_ O Fuzileiro identifica armas _2,5x mais rápido_ e armaduras _quando as equipa_.
actors.hero.talent.provoked_anger.title=raiva provocada
actors.hero.talent.provoked_anger.desc=_+1:_ Quando blindagem de qualquer fonte aplicada ao fuzileiro é quebrada por dano, seu próximo ataque físico terá _3 de dano adicional_.\n\n_+2:_ Quando blindagem de qualquer fonte aplicada ao fuzileiro é quebrada por dano, seu próximo ataque físico terá _5 de dano adicional_.
actors.hero.talent.iron_will.title=escudo reforçado
actors.hero.talent.iron_will.desc=_+1:_ A blindagem provida pelo gerador do fuzileiro é _aumentada em 1_.\n\n_+2:_ A blindagem provida pelo gerador do fuzileiro é _aumentada em 2_.
actors.hero.talent.iron_will.meta_desc=_Se este talento for adquirido por um herói diferente_ ele concederá passivamente uma versão do efeito do gerador de escudo do Fuzileiro, garantindo 1 ou 2 de blindagem.

actors.hero.talent.iron_stomach.title=estômago de ferro
actors.hero.talent.iron_stomach.desc=_+1:_ O Fuzileiro leva apenas 1 turno para comer e garante a ele _75%  de resistência a dano_ enquanto come.\n\n_+2:_ O Fuzileiro leva apenas 1 turno para comer e garante a ele _100% de resistência a dano_ enquanto come.
actors.hero.talent.liquid_willpower.title=injeção de coragem
actors.hero.talent.liquid_willpower.desc=_+1:_ O Fuzileiro ganha _6,5% de seu PV máximo em blindagem_ ao aplicar ou lançar um injetor, composto ou elixir.\n\n_+2:_ O Fuzileiro ganha _10% de seu PV máximo em blindagem_ ao aplicar ou lançar um injetor, composto ou elixir.\n\nA quantidade de blindagem é dobrada ao usar injetores de força, experiência ou itens de síntese que precisam desses injetores para serem criados.\n\nPara itens de síntese com quantidades maiores de produção (por exemplo, composto aquático), este talento tem uma chance de ser ativado com base na quantidade produzida desse item.
actors.hero.talent.runic_transference.title=transferência de revestimento
actors.hero.talent.runic_transference.desc=_+1:_ O gerador de escudo do Fuzileiro pode transferir _revestimentos comuns_ da mesma maneira que transfere um aprimoramento.\n\n_+2:_ O gerador de escudo do Fuzileiro pode transferir _revestimentos comuns, poderosos e corrompidos_ da mesma maneira que transfere um aprimoramento.\n\nO gerador só pode transferir revestimentos se eles tiverem sido aplicados à armadura quando o gerador estava afixado.
actors.hero.talent.runic_transference.meta_desc=_Se este talento for adquirido por um herói diferente_, ajudará os revestimentos em sua armadura a resistir à remoção por kits de modificação. Os revestimentos começarão a ser perdidos ao aprimorar a partir do nível 6 (em vez de 4) em +1, ou nível 7 (em vez de 4) em +2. O nível em que os revestimentos são garantidos para serem perdidos permanece inalterado em +8.
actors.hero.talent.lethal_momentum.title=ímpeto letal
actors.hero.talent.lethal_momentum.desc=_+1:_ Quando o fuzileiro desfere um golpe mortal em um inimigo com uma arma física, há _67% de chance_ de levar 0 turnos.\n\n_+2:_ Quando o fuzileiro desfere um golpe mortal em um inimigo com uma arma física, há _100% de chance_ de levar 0 turnos.
actors.hero.talent.improvised_projectiles.title=projéteis improvisados
actors.hero.talent.improvised_projectiles.desc=_+1:_ O Fuzileiro pode cegar um inimigo por _2 turnos_ ao arremessar qualquer item que não seja uma arma de arremesso. Este talento tem um tempo de recarga de 50 turnos.\n\n_+2:_ O Fuzileiro pode cegar um inimigo por _3 turnos_ ao arremessar qualquer item que não seja uma arma de arremesso. Este talento tem um tempo de recarga de 50 turnos.

actors.hero.talent.hold_fast.title=posição firme
actors.hero.talent.hold_fast.desc=_+1:_ Quando o Fuzileiro espera com seu gerador equipado, ele ganha _1-2 de armadura_ e retarda a decadência de buffs de combo e blindagem em _50%_ até que ele se mova.\n\n_+2:_ Quando o Fuzileiro espera com seu gerador equipado, ele ganha _2-4 de armadura_ e retarda a decadência de buffs de combo e blindagem em _75%_ até que ele se mova.\n\n_+3:_ Quando o Fuzileiro espera com seu gerador equipado, ele ganha _3-6 de armadura_ e retarda a decadência de buffs de combo e blindagem em _100%_ até que ele se mova.
actors.hero.talent.hold_fast.meta_desc=_Se este talento for obtido por um herói diferente_, não irá requerer o gerador do fuzileiro, mas não pode conceder mais blindagem do que o tier da sua armadura equipada mais o nível dela.
actors.hero.talent.strongman.title=força bruta
actors.hero.talent.strongman.desc=_+1:_ A força do fuzileiro é  _aumentada em 8%_, arredondada para baixo.\n\n_+2:_ A força do fuzileiro é _aumentada em 13%_, arredondada para baixo.\n\n_+3:_ A força do fuzileiro é _aumentada em 18%_, arredondada para baixo.

actors.hero.talent.endless_rage.title=fúria sem fim
actors.hero.talent.endless_rage.desc=_+1:_ O Linha de Frente pode atingir um máximo de _116% de fúria_.\n\n_+2:_ O Linha de Frente pode atingir um máximo de _133% de fúria_.\n\n_+3:_ O Linha de Frente pode atingir um máximo de _150% de fúria_.\n\nCada ponto de fúria acima de 100% aumenta a proteção do enfurecer em 1% e reduz a recarga em 1%, mas não aumenta o bônus de dano além de +50%.
actors.hero.talent.deathless_fury.title=fúria imortal
actors.hero.talent.deathless_fury.desc=_+1:_ Enfurecer é acionado automaticamente se o Linha de Frente estiver prestes a morrer e a fúria estiver em 100% ou acima, mas tem um tempo de recarregamento de _3 níveis de herói_ quando isso acontece.\n\n_+2:_ Enfurecer é acionado automaticamente se o Linha de Frente estiver prestes a morrer e a fúria estiver em 100% ou acima, mas tem um tempo de recarregamento de _2 níveis de herói_ quando isso acontece.\n\n_+3:_ Enfurecer é acionado automaticamente se o Linha de Frente estiver prestes a morrer e a fúria estiver em 100% ou acima, mas tem um tempo de recarregamento de _1 nívei de herói_ quando isso acontece.\n\nObserve que o Linha de Frente ainda morrerá se tiver 0 PV quando o enfurecer acabar.
actors.hero.talent.enraged_catalyst.title=catalisador de raiva
actors.hero.talent.enraged_catalyst.desc=_+1:_ Modificações e corrupções na arma do Linha de Frente são acionados com mais frequência quanto mais fúria ele tiver, até um máximo de _15% mais frequência_ com 100% de fúria.\n\n_+2:_ Modificações e corrupções na arma do Linha de Frente são acionados com mais frequência quanto mais fúria ele tiver, até um máximo de _30% mais frequência_ com 100% de fúria.\n\n_+3:_ Modificações e corrupções na arma do Linha de Frente são acionados com mais frequência quanto mais fúria ele tiver, até um máximo de _45% mais frequência_ com 100% de fúria.

actors.hero.talent.cleave.title=próximo alvo
actors.hero.talent.cleave.desc=_+1:_ O tempo extra que o Atirador de Elite ganha em uma morte é aumentado de 15 para _30 turnos_.\n\n_+2:_ O tempo extra que o Atirador de Elite ganha em uma morte é aumentado de 15 para _45 turnos_.\n\n_+3:_ O tempo extra que o Atirador de Elite ganha em uma morte é aumentado de 15 para _60 turnos_.
actors.hero.talent.lethal_defense.title=defesa letal
actors.hero.talent.lethal_defense.desc=_+1:_ Quando o Atirador de Elite mata um inimigo com um ataque de combo, o tempo de recarga da blindagem do gerador de escudo é _reduzido em 50 turnos_.\n\n_+2:_ Quando o Atirador de Elite mata um inimigo com um ataque de combo, o tempo de recarga da blindagem do gerador de escudo é _reduzido em 100 turnos_.\n\n_+3:_ Quando o Atirador de Elite mata um inimigo com um ataque de combo, o tempo de recarga da blindagem do gerador de escudo é _reduzido em 150 turnos_.\n\nO tempo de recarga da blindagem pode ser reduzido para até -150 turnos com este talento, o que significa que ele estará disponível novamente imediatamente após ser ativado.
actors.hero.talent.enhanced_combo.title=combo aprimorado
actors.hero.talent.enhanced_combo.desc=_+1:_ Quando o combo do Atirador de Elite é 7 ou maior, a distância de Surrar aumenta em 3, causa vertigem e pode derrubar os inimigos em abismos.\n\n_+2:_ Além dos benefícios do +1, quando o combo do Atirador de Elite é 9 ou maior Bloquear funciona em múltiplos ataques.\n\n_+3:_ Além dos benefícios de +1 e +2, O Atirador de Elite pode saltar até 3 espaços para combar quando usar Trombar, Esmagar ou Fúria.

actors.hero.talent.body_slam.title=Encontrão
actors.hero.talent.body_slam.desc=_+1:_ Quando o Fuzileiro aterrissa após saltar, todos os inimigos adjacentes levarão dano igual a _1-4 mais 25%_ de seu poder de bloqueio de dano.\n\n_+2:_ Quando o Fuzileiro aterrissa após saltar, todos os inimigos adjacentes levarão dano igual a _2-8 mais 50%_ de seu poder de bloqueio de dano.\n\n_+3:_ Quando o Fuzileiro aterrissa após saltar, todos os inimigos adjacentes levarão dano igual a _3-12 mais 75%_ de seu poder de bloqueio de dano.\n\n_+4:_ Quando o Fuzileiro aterrissa após saltar, todos os inimigos adjacentes levarão dano igual a _4-16 mais 100%_ de seu poder de bloqueio de dano.
actors.hero.talent.impact_wave.title=onda de impacto
actors.hero.talent.impact_wave.desc=_+1:_ Quando o Fuzileiro aterrissa após saltar, todos os inimigos adjacentes são empurrados _2 quadrados_ para longe e têm _25% de chance_ de se tornarem vulneráveis por 5 turnos.\n\n_+2:_ Quando o Fuzileiro aterrissa após saltar, todos os inimigos adjacentes são empurrados _3 quadrados_ para longe e têm _50% de chance_ de se tornarem vulneráveis por 5 turnos.\n\n_+3:_ Quando o Fuzileiro aterrissa após saltar, todos os inimigos adjacentes são empurrados _4 quadrados_ para longe e têm _75% de chance_ de se tornarem vulneráveis por 5 turnos.\n\n_+4:_ Quando o Fuzileiro aterrissa após saltar, todos os inimigos adjacentes são empurrados _5 quadrados_ para longe e têm _100% de chance_ de se tornarem vulneráveis por 5 turnos.
actors.hero.talent.double_jump.title=Pulo duplo
actors.hero.talent.double_jump.desc=_+1:_ Se o Fuzileiro executar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _16% reduzido_.\n\n_+2:_ Se o Fuzileiro executar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _30% reduzido_ .\n\n_+3:_ Se o Fuzileiro executar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _40% reduzido_ .\n\n_+4:_ Se o Fuzileiro executar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _50% reduzido_.

actors.hero.talent.expanding_wave.title=Onda expansiva
actors.hero.talent.expanding_wave.desc=_+1:_ O alcance da Onda de Choque é aumentada de 5 para _6 espaços_, e sua largura é aumentada de 60 para _75 graus_.\n\n_+2:_ O alcance da Onda de Choque é aumentada de 5 para _7 espaços_, e sua largura é aumentada de 60 para _90 graus_.\n\n_+3:_ O alcance da Onda de Choque é aumentada de 5 para _8 espaços_, e sua largura é aumentada de 60 para _105 graus_.\n\n_+4:_ O alcance da Onda de Choque é aumentada de 5 para _9 espaços_, e sua largura é aumentada de 60 para _120 graus_.
actors.hero.talent.striking_wave.title=Onda destrutiva
actors.hero.talent.striking_wave.desc=_+1:_ Onda de Choque tem _30% de chance_ de também utilizar efeitos de acerto como modificações e combo.\n\n_+2:_ Onda de Choque tem _60% de chance_ de também utilizar efeitos de acerto como modificações e combo.\n\n_+3:_ Onda de Choque tem _90% de chance_ de também utilizar efeitos de acerto como modificações e combo.\n\n_+4:_ Onda de Choque tem _100% de chance_ de também utilizar efeitos de acerto como modificações e combo, e dá a modificações _+20% de poder_.
actors.hero.talent.shock_force.title=Força de choque
actors.hero.talent.shock_force.desc=_+1:_ Onda de Choque causa _ 20% a mais de dano_ e tem _25% de chance_ de atordoar em vez de aleijar.\n\n_+2:_ Onda de Choque causa _40% a mais de dano_ e tem _50% de chance_ de atordoar em vez de aleijar.\n\n_+3:_ Onda de Choque causa _60% a mais de dano_ e tem _75% de chance_ de atordoar em vez de aleijar..\n\n_+4:_ Onda de Choque causa _80% a mais de dano_ e tem _100% de chance_ de atordoar em vez de aleijar.

actors.hero.talent.sustained_retribution.title=Retribuição sustentada
actors.hero.talent.sustained_retribution.desc=_+1:_ O Fuzileiro causa _115% de dano bônus_ distribuídos em _2 acertos_, em vez de 100% de dano bônus em 1 acerto.\n\n_+2:_ O Fuzileiro causa _130% de dano bônus_ distribuídos em _3 acertos_, em vez de 100% de dano bônus em 1 acerto.\n\n_+3:_ O Fuzileiro causa _145% de dano bônus_ distribuídos em _4 acertos_, em vez de 100% de dano bônus em 1 acerto.\n\n_+4:_ O Fuzileiro causa _160% de dano bônus_ distribuídos em _5 acertos_, em vez de 100% de dano bônus em 1 acerto.
actors.hero.talent.shrug_it_off.title=Dar de ombros
actors.hero.talent.shrug_it_off.desc=_+1:_ A redução de dano ao Fuzileiro enquanto resiste é _aumentada de 50% para 60%_.\n\n_+2:_ A redução de dano ao Fuzileiro enquanto resiste é _aumentada de 50% para 68%_.\n\n_+3:_ A redução de dano ao Fuzileiro enquanto resiste é _aumentada de 50% para 74%_.\n\n_+4:_ A redução de dano ao Fuzileiro enquanto resiste é _aumentada de 50% para 80%_.
actors.hero.talent.even_the_odds.title=Equilibrar as chances
actors.hero.talent.even_the_odds.desc=_+1:_ O Fuzileiro causa um adicional de _5% de dano bônus_ para cada inimigo dentro de 2 espaços quando a resistência termina.\n\n_+2:_ O Fuzileiro causa um adicional de _10% de dano bônus_ para cada inimigo dentro de 2 espaços quando a resistência termina.\n\n_+3:_ O Fuzileiro causa um adicional de _15% de dano bônus_ para cada inimigo dentro de 2 espaços quando a resistência termina.\n\n_+4:_ O Fuzileiro causa um adicional de _20% de dano bônus_ para cada inimigo dentro de 2 espaços quando a resistência termina.

#mage
actors.hero.talent.empowering_meal.title=refeição empoderadora
actors.hero.talent.empowering_meal.desc=_+1:_ Comer garante ao Mago _2 de dano bônus_ nas próximas 3 vezes que causar dano com uma arma especial.\n\n_+2:_ Comer garante ao Mago _3 de dano bônus_ nas próximas 3 vezes que causar dano com uma arma especial.
actors.hero.talent.scholars_intuition.title=intuição do estudioso
actors.hero.talent.scholars_intuition.desc=_+1:_ O Mago identifica armas especiais _3x mais rápido_.\n\n_+2:_ O Mago identifica armas especiais _ao usá-las_.
actors.hero.talent.lingering_magic.title=Magia prolongada
actors.hero.talent.lingering_magic.desc=_+1:_ Quando o Mago dispara com uma arma especial ou cajado, seu próximo ataque físico causará _1-2 de dano adicional_.\n\n_+2:_ Quando o Mago dispara com uma arma especial ou cajado, seu próximo ataque físico causará _2 de dano adicional_.
actors.hero.talent.backup_barrier.title=barreira de apoio
actors.hero.talent.backup_barrier.desc=_+1:_ O Mago ganha _3 de escudo_ toda vez que dispara a última carga do seu cajado.\n\n_+2:_ O Mago ganha _5 de escudo_ toda vez que dispara a última carga do seu cajado.
actors.hero.talent.backup_barrier.meta_desc=Se este talento for adquirido por um herói diferente, ele será acionado pela arma especial de nível mais alto do herói.

actors.hero.talent.energizing_meal.title=refeição energética
actors.hero.talent.energizing_meal.desc=_+1:_ Comer leva apenas 1 turno para o Mago e lhe concede _5 turnos de recarga de varinha_.\n\n_+2:_ Comer leva apenas 1 turno para o Mago e lhe concede _8 turnos de recarga de varinha_.
actors.hero.talent.inscribed_power.title=poder inscrito
actors.hero.talent.inscribed_power.desc=_+1:_ Quando o Mago executa um cartucho ou usa um item de feitiço, seus _próximos 2 disparos de varinha_ ganham +2 níveis.\n\n_+2:_ Quando o Mago executa um cartucho ou usa um item de feitiço, seus _próximos 3 disparos de varinha_ ganham +2 níveis.\n\nO número de disparos aprimorados de arma especial é dobrado se for usado um kit de modificação, transmutação ou itens de síntese que precisam desses cartuchos para serem produzidos.\n\nPara itens de síntese com maiores quantidades de retorno (ex. a maioria dos feitiços), esse talento tem chance de ser ativado com base em quantos itens são produzidos.
actors.hero.talent.wand_preservation.title=preservação de arma especial
actors.hero.talent.wand_preservation.desc=_+1:_ Quando o Mago imbui uma nova arma especial em seu cajado, a antiga arma especial é devolvida com +0. _Só pode ser feito uma vez._\n\n_+2:_ Quando o Mago imbui uma nova arma especial em seu cajado, a antiga arma especial é devolvida com +0. _Pode ser repetido com um tempo de recarga de um nível de herói._
actors.hero.talent.wand_preservation.meta_desc=_Se este talento for obtido por um herói diferente_, aumentará a quantidade de resina arcana obtida ao se colocar uma arma especial numa bancada de síntese em 1 em +1 ou em 2 em +2.
actors.hero.talent.arcane_vision.title=visão arcana
actors.hero.talent.arcane_vision.desc=_+1:_ Quando o Mago atira em um inimigo, ele ganha visão mental neles por _10 turnos_.\n\n_+2:_ Quando o Mago atira em um inimigo, ele ganha visão mental neles por _15 turnos_.
actors.hero.talent.shield_battery.title=bateria de escudo
actors.hero.talent.shield_battery.desc=_+1:_ O Mago pode mirar em si mesmo com uma arma especial para converter todas as suas cargas em escudo a uma taxa de _4% do PV máximo por carga_.\n\n_+2:_ O Mago pode mirar em si mesmo com uma arma especial para converter todas as suas cargas em escudo a uma taxa de _6% do PV máximo por carga_.

actors.hero.talent.desperate_power.title=Poder desesperado
actors.hero.talent.desperate_power.desc=_+1:_ As armas especiais e o cajado do mago ganham _+1 nível_ quando estão com sua última carga.\n\n_+2:_ As armas especiais e o cajado do mago ganham _+2 níveis_ quando estão com sua última carga.\n\n_+3:_ As armas especiais e o cajado do mago ganham _+3 níveis_ quando estão com sua última carga.
actors.hero.talent.ally_warp.title=Troca com aliado
actors.hero.talent.ally_warp.desc=_+1:_ O Mago pode selecionar um aliado para instantaneamente trocar de lugar com ele, com um _alcance de 2 espaços_.\n\n_+2:_ O Mago pode selecionar um aliado para instantaneamente trocar de lugar com ele, com um _alcance de 4 espaços_.\n\n_+3:_ O Mago pode selecionar um aliado para instantaneamente trocar de lugar com ele, com um _alcance de 6 espaços_.\n\nO Mago não pode trocar de lugar com aliados imóveis.

actors.hero.talent.empowered_strike.title=Ataque empoderado
actors.hero.talent.empowered_strike.desc=_+1:_ O primeiro ataque corpo a corpo do Mago de Batalha, após disparar com o seu cajado, irá causar _+16% de dano_ e o efeito bônus do cajado receberá _+50% de poder_.\n\n_+2:_ O primeiro ataque corpo a corpo do Mago de Batalha, após disparar com o seu cajado, irá causar _+33% de dano_ e o efeito bônus do cajado receberá _+100% de poder_.\n\n_+3:_ O primeiro ataque corpo a corpo do Mago de Batalha, após disparar com o seu cajado, irá causar _+50% de dano_ e o efeito bônus do cajado receberá _+150% de poder_.
actors.hero.talent.mystical_charge.title=Carregamento místico
actors.hero.talent.mystical_charge.desc=_+1:_ Atingir com seu cajado garante ao Mago de Batalha _0.5 turnos_ de carregamento de módulo.\n\n_+2:_ Atingir com seu cajado garante ao Mago de Batalha _1 turno_ de carregamento de módulo.\n\n_+3:_ Atingir com seu cajado garante ao Mago de Batalha _1.5 turnos_ de carregamento de módulo.
actors.hero.talent.excess_charge.title=Excesso de carga
actors.hero.talent.excess_charge.desc=_+1:_ Quando o cajado do Mago de Batalha estiver totalmente carregado, seu próximo disparo concederá a ele _0,67 de proteção_ por nível do cajado.\n\n_+2:_ Quando o cajado do Mago de Batalha estiver totalmente carregado, seu próximo disparo concederá a ele _1,33 de proteção_ por nível do cajado.\n\n_+3:_ Quando o cajado do Mago de Batalha estiver totalmente carregado, seu próximo disparo concederá a ele _2 de proteção_ por nível do cajado.

actors.hero.talent.soul_siphon.title=Sifão da alma
actors.hero.talent.soul_siphon.desc=_+1:_ Dano físico causado por outros personagens ativa a marca da alma do Bruxo em _13% de eficácia_.\n\n_+2:_ Dano físico causado por outros personagens ativa a marca da alma do Bruxo em _27% de eficácia_.\n\n_+3:_ Dano físico causado por outros personagens ativa a marca da alma do Bruxo em _40% de eficácia_.
actors.hero.talent.soul_eater.title=Devorador de Almas
actors.hero.talent.soul_eater.desc=_+1:_ Marca da alma concede _0.33 turnos_ de saciedade para cada dano físico causado. Inimigos de alma marcada tem _10% de chance_ de ativar efeitos de alimentação quando morrem.\n\n_+2:_ Marca da alma concede _0.67 turnos_ de saciedade para cada dano físico causado. Inimigos com alma marcada tem _20% de chance_ de ativar efeitos de alimentação quando morrem.\n\n_+3:_ Marca da alma concede _1 turno_ de saciedade para cada dano físico causado. Inimigos com alma marcada tem _30% de chance_ de ativar efeitos de alimentação quando morrem.
actors.hero.talent.necromancers_minions.title=Lacaios do necromante
actors.hero.talent.necromancers_minions.desc=_+1:_ Quando um inimigo com alma marcada morre, o Bruxo tem _13% de chance_ de trazê-lo de volta como um espectro corrompido.\n\n_+2:_ Quando um inimigo com alma marcada morre, o Bruxo tem _27% de chance_ de trazê-lo de volta como um espectro corrompido.\n\n_+3:_ Quando um inimigo com alma marcada morre, o Bruxo tem _40% de chance_ de trazê-lo de volta como um espectro corrompido.

actors.hero.talent.blast_radius.title=Raio de explosão
actors.hero.talent.blast_radius.desc=_+1:_ O alcance da explosão elementar é aumentado de 4 para _5 espaços_.\n\n_+2:_ O alcance da explosão elementar é aumentado de 4 para _6 espaços_.\n\n_+3:_ O alcance da explosão elementar é aumentado de 4 para _7 espaços_.\n\n_+4:_ O alcance da explosão elementar é aumentado de 4 para _8 espaços_.
actors.hero.talent.elemental_power.title=Poder elementar
actors.hero.talent.elemental_power.desc=_+1:_ O poder da explosão elementar é aumentado em _25%_.\n\n_+2:_ O poder da explosão elementar é aumentado em _50%_.\n\n_+3:_ O poder da explosão elementar é aumentado em _75%_.\n\n_+4:_ O poder da explosão elementar é aumentado em _100%_.
actors.hero.talent.reactive_barrier.title=Barreira reativa
actors.hero.talent.reactive_barrier.desc=_+1:_ O Mago ganha _2,5 de blindagem_ para cada personagem afetado pela explosão elementar, até um máximo de 5 personagens.\n\n_+2:_ O Mago ganha _5 de blindagem_ para cada personagem afetado pela explosão elementar, até um máximo de 6 personagens.\n\n_+3:_ O Mago ganha _7,5 de blindagem_ para cada personagem afetado pela explosão elementar, até um máximo de 7 personagens.\n\n_+4:_ O Mago ganha _10 de blindagem_ para cada personagem afetado pela explosão elementar, até um máximo de 8 personagens.

actors.hero.talent.wild_power.title=Poder selvagem
actors.hero.talent.wild_power.desc=_+1:_ Ao usar magia selvagem, as armas especiais serão impulsionadas em _2 ou 3, até +4_.\n\n_+2:_ Ao usar magia selvagem, as armas especiais serão impulsionadas em _3, até +5_.\n\n_+3:_ Ao usar magia selvagem, as armas especiais serão impulsionadas em _3 ou 4, até +6_.\n\n_+4:_ Ao usar magia selvagem, as armas especiais serão impulsionadas em _4, até +7_.
actors.hero.talent.fire_everything.title=Atire tudo
actors.hero.talent.fire_everything.desc=_+1:_ A magia selvagem agora dispara _5 vezes_ em vez de 4, e cada arma especial tem _25% de chance_ de ser usada 3 vezes.\n\n_+2:_ A magia selvagem agora dispara _6 vezes_ em vez de 4, e cada arma especial tem _50% de chance_ de ser usada 3 vezes.\n\n_+3:_ A magia selvagem agora dispara _7 vezes_ em vez de 4, e cada arma especial tem _75% de chance_ de ser usada 3 vezes.\n\n_+4:_ A magia selvagem agora dispara _8 vezes_ em vez de 4, e cada arma especial tem _100% de chance_ de ser usada 3 vezes.
actors.hero.talent.conserved_magic.title=Magia conservada
actors.hero.talent.conserved_magic.desc=_+1:_ Cada disparo da magia selvagem agora usa _0,33 cargas_ em vez de 0,5, e a magia selvagem tem _25% de chance_ de não gastar um turno.\n\n_+2:_ Cada disparo da magia selvagem agora usa _0,225 cargas_ em vez de 0,5, e a magia selvagem tem _50% de chance_ de não gastar um turno.\n\n_+3:_ Cada disparo da magia selvagem agora usa _0,15 cargas_ em vez de 0,5, e a magia selvagem tem _75% de chance_ de não gastar um turno.\n\n_+4:_ Cada disparo da magia selvagem agora usa _0,1 cargas_ em vez de 0,5, e a magia selvagem tem _100% de chance_ de não gastar um turno.

actors.hero.talent.telefrag.title=chegada de impacto
actors.hero.talent.telefrag.desc=_+1:_ Se o Exterminador for extraído para cima de outro personagem, causa _10-15 de dano_ a ele, mas também sofre _5 de dano_.\n\n_+2:_ Causa _20-30 de dano_ e sofre _10 de dano_.\n\n_+3:_ Causa _30-45 de dano_ e sofre _15 de dano_.\n\n_+4:_ Causa _40-60 de dano_ e sofre _20 de dano_.\n\nEste talento não mata o herói, e efeitos de resistência a energia reduzem o dano que ele sofre.
actors.hero.talent.remote_beacon.title=baliza remota
actors.hero.talent.remote_beacon.desc=_+1:_ O Exterminador pode colocar a baliza em qualquer ponto a até _4 quadrados_.\n\n_+2:_ O Exterminador pode colocar a baliza em qualquer ponto a até _8 quadrados_.\n\n_+3:_ O Exterminador pode colocar a baliza em qualquer ponto a até _12 quadrados_.\n\n_+4:_ O Exterminador pode colocar a baliza em qualquer ponto a até _16 quadrados_.\n\nEle não pode colocar a baliza em lugares inacessíveis.
actors.hero.talent.longrange_warp.title=extração entre setores
actors.hero.talent.longrange_warp.desc=_+1:_ O Exterminador pode ser extraído entre setores, com _150% do custo de carga_.\n\n_+2:_ O Exterminador pode ser extraído entre setores, com _117% do custo de carga_.\n\n_+3:_ O Exterminador pode ser extraído entre setores, com _83% do custo de carga_.\n\n_+4:_ O Exterminador pode ser extraído entre setores, com _50% do custo de carga_.\n\nEle não pode usar a extração para sair de um setor trancado.

#rogue
actors.hero.talent.cached_rations.title=rações de reserva
actors.hero.talent.cached_rations.desc=_+1:_ O operador pode encontrar _2 rações de emergência_ escondidas em baús nos próximos setores.\n\n_+2:_ O operador pode encontrar _3 rações de emergência_ escondidas em baús nos próximos setores.\n\nRações de emergência são comidas rápido, matam uma parte da fome, curam 5 de vida e devolvem 1 carga ao módulo de camuflagem ativa.
actors.hero.talent.thiefs_intuition.title=intuição de campo
actors.hero.talent.thiefs_intuition.desc=_+1:_ O operador identifica implantes _2x mais rápido_ e descobre o tipo de um implante _ao instalá-lo_.\n\n_+2:_ O operador identifica implantes _ao instalá-los_ e descobre o tipo de um implante _ao pegá-lo_.
actors.hero.talent.sucker_punch.title=golpe surpresa
actors.hero.talent.sucker_punch.desc=_+1:_ O operador causa _1 a 2 de dano extra_ na primeira vez que ataca um inimigo de surpresa.\n\n_+2:_ O operador causa _2 de dano extra_ na primeira vez que ataca um inimigo de surpresa.
actors.hero.talent.protective_shadows.title=camuflagem protetora
actors.hero.talent.protective_shadows.desc=_+1:_ O operador ganha um ponto de escudo _a cada dois turnos_ invisível, _até 3_.\n\n_+2:_ O operador ganha um ponto de escudo _a cada turno_ invisível, _até 5_.

actors.hero.talent.mystical_meal.title=ração energética
actors.hero.talent.mystical_meal.desc=_+1:_ Comer leva 1 turno para o operador, e a ração de emergência é instantânea. A refeição dá _3 turnos de recarga dos módulos_.\n\n_+2:_ Comer leva 1 turno para o operador, e a ração de emergência é instantânea. A refeição dá _5 turnos de recarga dos módulos_.\n\nEste talento não faz o sintetizador de rações recarregar a si mesmo.
actors.hero.talent.inscribed_stealth.title=cartucho furtivo
actors.hero.talent.inscribed_stealth.desc=_+1:_ O operador fica _3 turnos_ invisível depois de rodar um cartucho de dados ou usar um item de efeito.\n\n_+2:_ O operador fica _5 turnos_ invisível depois de rodar um cartucho de dados ou usar um item de efeito.\n\nA invisibilidade dura o dobro com o kit de modificação, o cartucho de transmutação e os itens do laboratório feitos com eles.\n\nNos itens do laboratório que saem em várias unidades, o talento tem uma chance de agir conforme a quantidade produzida.
actors.hero.talent.wide_search.title=varredura ampla
actors.hero.talent.wide_search.desc=_+1:_ O raio de busca do operador passa de um quadrado de 5x5 para um _círculo de 7x7_.\n\n_+2:_ O raio de busca do operador passa de um quadrado de 5x5 para um _quadrado de 7x7_.
actors.hero.talent.wide_search.meta_desc=_Se este talento for obtido por um herói diferente_, aumentará seu raio de busca de um quadrado de 3x3 para um círculo de 5x5 em +1, ou um quadrado de 5x5 em +2.
actors.hero.talent.silent_steps.title=passos silenciosos
actors.hero.talent.silent_steps.desc=_+1:_ O operador não acorda inimigos adormecidos enquanto estiver _a 3 quadrados ou mais_ deles.\n\n_+2:_ O operador não acorda inimigos adormecidos enquanto _não estiver ao lado_ deles.
actors.hero.talent.rogues_foresight.title=faro de operador
actors.hero.talent.rogues_foresight.desc=_+1:_ Num setor com sala secreta, o operador tem _75% de chance de perceber_ que existe um segredo.\n\n_+2:_ Num setor com sala secreta, o operador tem _100% de chance de perceber_ que existe um segredo.

actors.hero.talent.light_cloak.title=camuflagem portátil
actors.hero.talent.light_cloak.desc=_+1:_ O operador pode usar o módulo de camuflagem ativa sem instalá-lo, mas fora da armadura ele recarrega a _25% da velocidade_.\n\n_+2:_ O operador pode usar o módulo de camuflagem ativa sem instalá-lo, mas fora da armadura ele recarrega a _50% da velocidade_.\n\n_+3:_ O operador pode usar o módulo de camuflagem ativa sem instalá-lo, mas fora da armadura ele recarrega a _75% da velocidade_.
actors.hero.talent.light_cloak.meta_desc=Se este talento for ganho por um herói diferente, aumentará a velocidade de carregamento de todos os módulos em 7/13/20% em +1/+2/+3.
actors.hero.talent.enhanced_rings.title=implantes aprimorados
actors.hero.talent.enhanced_rings.desc=_+1:_ Quando o operador usa um módulo, os implantes ganham +1 nível por _3 turnos_.\n\n_+2:_ Quando o operador usa um módulo, os implantes ganham +1 nível por _6 turnos_.\n\n_+3:_ Quando o operador usa um módulo, os implantes ganham +1 nível por _9 turnos_.

actors.hero.talent.enhanced_lethality.title=letalidade aprimorada
actors.hero.talent.enhanced_lethality.desc=_+1:_ O Eliminador elimina inimigos com menos de _4/13/27/67% de vida_ por nível de preparo, em vez de 3/10/20/50%.\n\n_+2:_ O Eliminador elimina inimigos com menos de _5/17/33/83% de vida_ por nível de preparo, em vez de 3/10/20/50%.\n\n_+3:_ O Eliminador elimina inimigos com menos de _6/20/40/100% de vida_ por nível de preparo, em vez de 3/10/20/50%.
actors.hero.talent.assassins_reach.title=alcance do eliminador
actors.hero.talent.assassins_reach.desc=_+1:_ O salto do Eliminador por nível de preparo sobe para _1/3/4/6 quadrados_, em vez de 1/2/3/4.\n\n_+2:_ O salto do Eliminador por nível de preparo sobe para _2/4/6/8 quadrados_, em vez de 1/2/3/4.\n\n_+3:_ O salto do Eliminador por nível de preparo sobe para _2/5/7/10 quadrados_, em vez de 1/2/3/4.\n\nO salto passa por cima de perigos e inimigos, mas não atravessa paredes.
actors.hero.talent.bounty_hunter.title=caçador de recompensas
actors.hero.talent.bounty_hunter.desc=_+1:_ Quando o Eliminador mata um inimigo com um golpe preparado, a chance de o inimigo deixar um item sobe _2/4/8/16%_ por nível de preparo.\n\n_+2:_ Quando o Eliminador mata um inimigo com um golpe preparado, a chance de o inimigo deixar um item sobe _4/8/16/32%_ por nível de preparo.\n\n_+3:_ Quando o Eliminador mata um inimigo com um golpe preparado, a chance de o inimigo deixar um item sobe _6/12/24/48%_ por nível de preparo.

actors.hero.talent.evasive_armor.title=armadura evasiva
actors.hero.talent.evasive_armor.desc=_+1:_ Em disparada, o Batedor ganha _+1 de esquiva_ para cada ponto de força que sobra na armadura.\n\n_+2:_ Em disparada, o Batedor ganha _+2 de esquiva_ para cada ponto de força que sobra na armadura.\n\n_+3:_ Em disparada, o Batedor ganha _+3 de esquiva_ para cada ponto de força que sobra na armadura.
actors.hero.talent.projectile_momentum.title=disparo em movimento
actors.hero.talent.projectile_momentum.desc=_+1:_ Em disparada, o Batedor ganha _+50% de precisão e +15% de dano_ com a pistola e as armas de arremesso.\n\n_+2:_ Em disparada, o Batedor ganha _+100% de precisão e +30% de dano_ com a pistola e as armas de arremesso.\n\n_+3:_ Em disparada, o Batedor ganha _+150% de precisão e +45% de dano_ com a pistola e as armas de arremesso.
actors.hero.talent.speedy_stealth.title=rapidez furtiva
actors.hero.talent.speedy_stealth.desc=_+1:_ O Batedor ganha 2 cargas de impulso por turno enquanto está invisível.\n\n_+2:_ Além do efeito de +1, a disparada não diminui enquanto o Batedor está invisível.\n\n_+3:_ Além dos efeitos de +1 e +2, o Batedor anda com o dobro da velocidade enquanto está invisível, em disparada ou não.

actors.hero.talent.hasty_retreat.title=retirada rápida
actors.hero.talent.hasty_retreat.desc=_+1:_ Depois do salto, o operador ganha _1 turno_ de pressa e invisibilidade.\n\n_+2:_ Depois do salto, o operador ganha _2 turnos_ de pressa e invisibilidade.\n\n_+3:_ Depois do salto, o operador ganha _3 turnos_ de pressa e invisibilidade.\n\n_+4:_ Depois do salto, o operador ganha _4 turnos_ de pressa e invisibilidade.
actors.hero.talent.body_replacement.title=chamariz
actors.hero.talent.body_replacement.desc=_+1:_ Depois do salto, o operador deixa para trás um chamariz inflável com _20 de vida e 1 a 3 de armadura_.\n\n_+2:_ Depois do salto, o operador deixa para trás um chamariz inflável com _40 de vida e 2 a 6 de armadura_.\n\n_+3:_ Depois do salto, o operador deixa para trás um chamariz inflável com _60 de vida e 3 a 9 de armadura_.\n\n_+4:_ Depois do salto, o operador deixa para trás um chamariz inflável com _80 de vida e 4 a 12 de armadura_.\n\nSó pode haver um chamariz de cada vez.
actors.hero.talent.shadow_step.title=passo na fumaça
actors.hero.talent.shadow_step.desc=_+1:_ Se o operador usar a granada de fumaça enquanto está invisível, o salto é instantâneo e custa _16% menos_ de carga, mas não cega os inimigos nem ativa outros talentos.\n\n_+2:_ Se o operador usar a granada de fumaça enquanto está invisível, o salto é instantâneo e custa _30% menos_ de carga, mas não cega os inimigos nem ativa outros talentos.\n\n_+3:_ Se o operador usar a granada de fumaça enquanto está invisível, o salto é instantâneo e custa _41% menos_ de carga, mas não cega os inimigos nem ativa outros talentos.\n\n_+4:_ Se o operador usar a granada de fumaça enquanto está invisível, o salto é instantâneo e custa _50% menos_ de carga, mas não cega os inimigos nem ativa outros talentos.

actors.hero.talent.fear_the_reaper.title=pânico
actors.hero.talent.fear_the_reaper.desc=_+1:_ Quando um alvo designado chega a 0 de vida, ele fica _aleijado_.\n\n_+2:_ Quando um alvo designado chega a 0 de vida, ele fica _apavorado e aleijado_.\n\n_+3:_ Quando um alvo designado chega a 0 de vida, ele fica _apavorado e aleijado_, e os inimigos a até 3 quadrados ficam _aleijados_.\n\n_+4:_ Quando um alvo designado chega a 0 de vida, ele fica _apavorado e aleijado_, e os inimigos a até 3 quadrados ficam _apavorados e aleijados_.
actors.hero.talent.deathly_durability.title=adrenalina de combate
actors.hero.talent.deathly_durability.desc=_+1:_ Inimigos mortos pela designação dão ao operador um escudo igual a _13%_ da vida que tinham quando foram designados.\n\n_+2:_ Inimigos mortos pela designação dão ao operador um escudo igual a _25%_ da vida que tinham quando foram designados.\n\n_+3:_ Inimigos mortos pela designação dão ao operador um escudo igual a _38%_ da vida que tinham quando foram designados.\n\n_+4:_ Inimigos mortos pela designação dão ao operador um escudo igual a _50%_ da vida que tinham quando foram designados.
actors.hero.talent.double_mark.title=marcação dupla
actors.hero.talent.double_mark.desc=_+1:_ Designar um segundo alvo junto com o primeiro custa _30% menos_ de carga.\n\n_+2:_ Designar um segundo alvo junto com o primeiro custa _50% menos_ de carga.\n\n_+3:_ Designar um segundo alvo junto com o primeiro custa _65% menos_ de carga.\n\n_+4:_ Designar um segundo alvo junto com o primeiro custa _75% menos_ de carga.

actors.hero.talent.shadow_blade.title=projeção armada
actors.hero.talent.shadow_blade.desc=_+1:_ A isca holográfica ganha _8%_ do dano do herói por turno e tem _25% de chance_ de usar a modificação da arma do herói.\n\n_+2:_ A isca holográfica ganha _16%_ do dano do herói por turno e tem _50% de chance_ de usar a modificação da arma do herói.\n\n_+3:_ A isca holográfica ganha _24%_ do dano do herói por turno e tem _75% de chance_ de usar a modificação da arma do herói.\n\n_+4:_ A isca holográfica ganha _32%_ do dano do herói por turno e tem _100% de chance_ de usar a modificação da arma do herói.
actors.hero.talent.cloned_armor.title=blindagem projetada
actors.hero.talent.cloned_armor.desc=_+1:_ A isca holográfica ganha _12%_ da armadura do herói e tem _25% de chance_ de usar o revestimento da armadura do herói.\n\n_+2:_ A isca holográfica ganha _24%_ da armadura do herói e tem _50% de chance_ de usar o revestimento da armadura do herói.\n\n_+3:_ A isca holográfica ganha _36%_ da armadura do herói e tem _75% de chance_ de usar o revestimento da armadura do herói.\n\n_+4:_ A isca holográfica ganha _48%_ da armadura do herói e tem _100% de chance_ de usar o revestimento da armadura do herói.
actors.hero.talent.perfect_copy.title=cópia perfeita
actors.hero.talent.perfect_copy.desc=_+1:_ A isca holográfica ganha _10%_ da vida máxima do herói e pode trocar de lugar com ele na hora, a até _1 quadrado_.\n\n_+2:_ A isca holográfica ganha _20%_ da vida máxima do herói e pode trocar de lugar com ele na hora, a até _2 quadrados_.\n\n_+3:_ A isca holográfica ganha _30%_ da vida máxima do herói e pode trocar de lugar com ele na hora, a até _3 quadrados_.\n\n_+4:_ A isca holográfica ganha _40%_ da vida máxima do herói e pode trocar de lugar com ele na hora, a até _4 quadrados_.

#huntress
actors.hero.talent.natures_bounty.title=recompensa da natureza
actors.hero.talent.natures_bounty.desc=_+1:_ A Caçadora pode encontrar _4 bagas_ escondidas entre a grama alta enquanto explora os próximos setores.\n\n_+2:_ A Caçadora pode encontrar _6 bagas_ escondidas entre a grama alta enquanto explora os próximos setores.\n\nAs bagas são consumidas rapidamente, restauram uma pequena quantidade de saciedade e podem conter uma semente utilizável.
actors.hero.talent.survivalists_intuition.title=intuição de sobrevivente
actors.hero.talent.survivalists_intuition.desc=_+1:_ A Caçadora identifica armas de arremesso  _3x mais rápido_. \n\n_+2:_ A Caçadora identifica armas de arremesso _quando acerta um inimigo com elas_.
actors.hero.talent.followup_strike.title=ataque consecutivo
actors.hero.talent.followup_strike.desc=_+1:_ Quando a Caçadora atinge um inimigo com seu arco ou com uma arma de arremesso, seu próximo ataque corpo a corpo contra esse inimigo causará _um bônus de 2 de dano_.\n\n_+2:_ Quando a Caçadora atinge um inimigo com seu arco ou com uma arma de arremesso, seu próximo ataque corpo a corpo contra esse inimigo causará _um bônus de 3 de dano_.
actors.hero.talent.natures_aid.title=auxílio da natureza
actors.hero.talent.natures_aid.desc=_+1:_ A Caçadora ganha 0-2 armadura de pele arbórea, que diminui a cada _3 turnos_ quando o efeito de uma planta é ativado em sua visão.\n\n_+2:_ A Caçadora ganha 0-2 armadura de pele arbórea, que diminui a cada _5 turnos_ quando o efeito de uma planta é ativado em sua visão.

actors.hero.talent.invigorating_meal.title=refeição revigorante
actors.hero.talent.invigorating_meal.desc=_+1:_ A Caçadora leva apenas 1 turno para comer (bagas são comidas instantaneamente) e dá a ela _1 turno de pressa_.\n\n_+2:_ A Caçadora leva apenas 1 turno para comer (bagas são comidas instantaneamente) e dá a ela _2 turnos de pressa_.
actors.hero.talent.liquid_nature.title=Natureza líquida
actors.hero.talent.liquid_nature.desc=_+1:_ Quando a caçadora aplica ou arremessa um injetor, composto ou elixir,_até 4 quadrados de grama_ surgem ao redor dela e inimigos adjacentes são enraizados por _1 turno_.\n\n_+2:_ Quando a caçadora aplica ou arremessa um injetor, composto ou elixir, _até 6 quadrados de grama_ surgem ao redor dela e inimigos adjacentes são enraizados por _2 turnos_.\n\nA quantidade de grama e duração do enraizamento são dobrados se for usada um injetor de força, experiência, ou itens de síntese que devem ser criados com esses injetores.\n\nPara itens de síntese com maiores quantidades de retorno (ex. composto aquático), este talento tem chance de ser ativado com base em quantos itens são produzidos.
actors.hero.talent.rejuvenating_steps.title=passos rejuvenescedores
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Quando a Caçadora pisa em grama baixa ou em cinzas, elas florescem em grama alta, que a caçadora enruga automaticamente. Tem _10 turnos de recarga_.\n\n_+2:_ Quando a Caçadora pisa em grama baixa ou em cinzas, elas florescem em grama alta, que a caçadora enruga automaticamente. Tem _5 turnos de recarga_.\n\nEste talento produzirá vegetação rugosa se os efeitos de regeneração passiva estiverem desativados ou caso o herói não tenha ganhado experiência em um longo tempo.
actors.hero.talent.heightened_senses.title=sentidos apurados
actors.hero.talent.heightened_senses.desc=_+1:_ A Caçadora ganha visão mental de personagens a _2 quadrados de distância dela_.\n\n_+2:_ A Caçadora ganha visão mental de personagens a _3 quadrados de distância dela_.
actors.hero.talent.durable_projectiles.title=projéteis duráveis
actors.hero.talent.durable_projectiles.desc=_+1:_ Armas de arremesso têm _+50% de durabilidade_ quando usadas pela Caçadora.\n\n_+2:_ Armas de arremesso têm _+75% de durabilidade_ quando usadas pela Caçadora.

actors.hero.talent.point_blank.title=À queima roupa
actors.hero.talent.point_blank.desc=_+1:_ Quando a Caçadora usa uma arma de arremesso ou seu arco a uma distância corpo a corpo, ela tem _-25% de precisão_ em vez de -50%.\n\n_+2:_ Quando a Caçadora usa uma arma de arremesso ou seu arco a uma distância corpo a corpo, ela tem _precisão normal_ em vez de -50%.\n\n_+3:_ Quando a Caçadora usa uma arma de arremesso ou seu arco a uma distância corpo a corpo, ela tem _+25% de precisão_ em vez de -50%.\n\nObserve que seu arco espiritual ou armas de arremesso sempre têm +50% de precisão quando usadas a distância.
actors.hero.talent.seer_shot.title=Tiro de vidência
actors.hero.talent.seer_shot.desc=_+1:_ Quando a Caçadora atira uma flecha no chão, ela concede visão em uma área de 3x3 ao seu redor por _5 turnos_. Tem 20 turnos de recarga.\n\n_+2:_ Quando a Caçadora atira uma flecha no chão, ela concede visão em uma área de 3x3 ao seu redor por _10 turnos_. Tem 20 turnos de recarga.\n\n_+3:_ Quando a Caçadora atira uma flecha no chão, ela concede visão em uma área de 3x3 ao seu redor por _15 turnos_. Tem 20 turnos de recarga.
actors.hero.talent.seer_shot.meta_desc=Se este talento for ganho por um herói diferente, ele será desencadeado por qualquer arma de arremesso.

actors.hero.talent.farsight.title=Visão longínqua.
actors.hero.talent.farsight.desc=_+1:_ O alcance de visão da Atiradora é _aumentado em 25%_.\n\n_+2:_ O alcance de visão da Atiradora é _aumentado em 50%_.\n\n_+3:_ O alcance de visão da Atiradora é _aumentado em 75%_.
actors.hero.talent.shared_enchantment.title=Modificação compartilhado
actors.hero.talent.shared_enchantment.desc=_+1:_ Armas de arremesso têm _33% de chance_ de usar a modificação do arco da Atiradora.\n\n_+2:_ Armas de arremesso têm _67% de chance_ de usar a modificação do arco da Atiradora\n\n_+3_ Armas de arremesso têm _100% de chance_ de usar a modificação do arco da Atiradora.\n\nA modificação do arco pode ser ativado junto a qualquer modificação que a arma de arremesso já tenha.
actors.hero.talent.shared_upgrades.title=Aprimoramento compartilhado
actors.hero.talent.shared_upgrades.desc=_+1:_ Quando a Atiradora ataca com uma arma de arremesso aprimorada, cada nível aumenta a duração da marca da atiradora em 1 turno e o dano de seu ataque especial em 16% até o máximo de _2 turnos e +33% de dano em +2_.\n\n_+2:_ Quando a Atiradora ataca com uma arma de arremesso aprimorada, cada nível aumenta a duração da marca da atiradora em 1 turno e o dano de seu ataque especial em 16% até o máximo de _4 turnos e +67% de dano em +4_.\n\n_+3_ Quando a Atiradora ataca com uma arma de arremesso aprimorada, cada nível aumenta a duração da marca da atiradora em 1 turno e o dano de seu ataque especial em _16%_ até o máximo de _6 turnos e +100% de dano em +6_.

actors.hero.talent.durable_tips.title=Pontas duráveis
actors.hero.talent.durable_tips.desc=_+1:_  Dardos embebidos têm _2X mais durabilidade_ quando usados pela Guardiã.\n\n_+2:_ Dardos embebidos têm _3X mais durabilidade_ quando usados pela Guardiã.\n\n_+3:_ Dardos embebidos têm _4X mais durabilidade_ quando usados pela Guardiã.
actors.hero.talent.barkskin.title=pele arbórea
actors.hero.talent.barkskin.desc=_+1:_ Ao pisar em grama alta não rugosa ou em plantas, a Guardiã ganha armadura de pele arbórea equivalente a _0-33% de seu nível_ que diminui a cada turno.\n\n_+2:_ Ao pisar em grama alta não rugosa ou em plantas, a Guardiã ganha armadura de pele arbórea equivalente a _0-67% de seu nível_ que diminui a cada turno.\n\n_+3:_ Ao pisar em grama alta não rugosa ou em plantas, a Guardiã ganha armadura de pele arbórea equivalente a _0-100% de seu nível_ que diminui a cada turno.
actors.hero.talent.shielding_dew.title=Orvalho Protetor
actors.hero.talent.shielding_dew.desc=_+1:_ As porções de biomassa podem proteger a Guardiã quando sua saúde está cheia, até _20% de seu PV máximo_.\n\n_+2:_ Porções de biomassa podem proteger a Guardiã quando sua saúde está cheia, até _40% de seu PV máximo_.\n\n_+3:_ As porções de biomassa podem proteger a Guardiã quando sua saúde está cheia, até _60% de seu PV máximo_.

actors.hero.talent.fan_of_blades.title=Leque de lâminas
actors.hero.talent.fan_of_blades.desc=_ +1: _ As lâminas espectrais podem atingir até _1 alvo adicional_ causando 50% de dano. O alvo deve ser visível e dentro de um cone de ADE de _30 graus_.\n\n_ +2: _ As lâminas espectrais podem atingir até _2 alvos adicionais_ causando 50% de dano. Os alvos devem ser visíveis e dentro de um cone de ADE de _60 graus_.\n\n_ +3: _ As lâminas espectrais podem atingir até _3 alvos adicionais_ causando 50% de dano. Os alvos devem ser visíveis e dentro de um cone de ADE de _90 graus_.\n\n_ +4: _ As lâminas espectrais podem atingir até _4 alvos adicionais_ causando 50% de dano. Os alvos devem ser visíveis e dentro de um cone de ADE de _120 graus_.
actors.hero.talent.projecting_blades.title=Lâminas projetantes
actors.hero.talent.projecting_blades.desc=_+1:_ As lâminas espectrais têm _+25% de precisão_ e podem penetrar até _2 quadrados sólidos_.\n\n_+2:_ As lâminas espectrais têm _+50% de precisão_ e podem penetrar até _4 quadrados sólidos_.\n\n_+3:_ As lâminas espectrais têm _+75% de precisão_ e podem penetrar até _6 quadrados sólidos_.\n\n_+4:_ As lâminas espectrais têm _+100% de precisão_ e podem penetrar até _8 quadrados sólidos_.
actors.hero.talent.spirit_blades.title=Lâminas espirituais
actors.hero.talent.spirit_blades.desc=_+1:_ Lâminas espectrais têm _30% de chance_ de também usar a modificação do arco espiritual.\n\n_+2:_ Lâminas espectrais têm _60% de chance_ de também usar a modificação do arco espiritual.\n\n_+3:_ Lâminas espectrais têm _90% de chance_ de também usar a modificação do arco espiritual.\n\n_+4:_ Lâminas espectrais têm _100% de chance_ de também usar a modificação do arco espiritual e dá a cada modificação _+10% de poder_.

actors.hero.talent.growing_power.title=Poder crescente
actors.hero.talent.growing_power.desc=_+1:_ Os impulsos no ataque e velocidade de movimento do poder da natureza são aumentados para _38% e 125% _, de 33% e 100%.\n\n_+2:_ Os impulsos no ataque e velocidade de movimento do poder da natureza são aumentados para _42% e 150% _, de 33% e 100%.\n\n_+3:_ Os impulsos no ataque e velocidade de movimento do poder da natureza são aumentados para _46% e 175% _, de 33% e 100%.\n\n_+4:_ Os impulso no ataque e velocidade de movimento do poder da natureza são aumentados para _50% e 200% _, de 33% e 100%.
actors.hero.talent.natures_wrath.title=Ira da natureza
actors.hero.talent.natures_wrath.desc=_+1:_Enquanto o poder da natureza está ativo, tiros do arco espiritual têm _8% de chance_ de ativar um efeito danoso aleatório de planta.\n\n_+2:_Enquanto o poder da natureza está ativo, tiros do arco espiritual têm _17% de chance_ de ativar um efeito danoso aleatório de planta.\n\n_+3:_Enquanto o poder da natureza está ativo, tiros do arco espiritual têm _25% de chance_ de ativar um efeito danoso aleatório de planta.\n\n_+4:_Enquanto o poder da natureza está ativo, tiros do arco espiritual têm _33% de chance_ de ativar um efeito danoso aleatório de planta.\n\nAs plantas que podem ser ativadas são: Ceguerva, Flor de fogo, Muda de Gelo, Sofrimusgo e Vinha Tempestuosa.
actors.hero.talent.wild_momentum.title=ímpeto selvagem
actors.hero.talent.wild_momentum.desc=_+1:_ Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em _1 turno_. A duração pode ser estendida até no máximo _2 turnos_.\n\n_+2:_ Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em _2 turnos_. A duração pode ser estendida até no máximo _4 turnos_.\n\n_+3:_ Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em _3 turnos_. A duração pode ser estendida até no máximo _6 turnos_.\n\n_+4:_ Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em _4 turnos_. A duração pode ser estendida até no máximo _8 turnos_.

actors.hero.talent.eagle_eye.title=Olhos de Falcão
actors.hero.talent.eagle_eye.desc=_+1:_ O alcance de visão do Falcão Espiritual aumenta de 6 para _7 espaços_.\n\n_+2:_ O alcance de visão do Falcão Espiritual aumenta de 6 para _8 espaços_.\n\n_+3:_ O alcance de visão do Falcão Espiritual aumenta de 6 para _9 espaços_ e ganha _2 espaços_ de visão mental.\n\n_+4:_ O alcance de visão do Falcão Espiritual aumenta de 6 para _10 espaços_ e ganha _3 espaços_ de visão mental.
actors.hero.talent.go_for_the_eyes.title=Mire nos olhos
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Ataques do falcão espiritual cegam os inimigos por _2 turnos_.\n\n_+2:_ Ataques do falcão espiritual cegam os inimigos por _5 turnos_.\n\n_+3:_ Ataques do falcão espiritual cegam os inimigos por _5 turnos_ e os aleijam por _2 turnos_.\n\n_+4:_  Ataques do falcão espiritual cegam os inimigos por _5 turnos_ e os aleijam por _5 turnos_.
actors.hero.talent.swift_spirit.title=Espírito veloz
actors.hero.talent.swift_spirit.desc=_+1:_ A velocidade de movimento do Falcão Espiritual aumenta de 2 para _2,5 espaços_ e tem garantida sua esquiva contra os primeiros _2 ataques_ recebidos.\n\n_+2:_ A velocidade de movimento do Falcão Espiritual  aumenta de 2 para _3 espaços_ e tem garantida sua esquiva contra os primeiros _4 ataques_ recebidos.\n\n_+3:_ A velocidade de movimento do Falcão Espiritual aumenta de 2 para _3,5 espaços_ e tem garantida sua esquiva contra os primeiros _6 ataques_ recebidos.\n\n_+4:_ A velocidade de movimento do Falcão Espiritual aumenta de 2 para _4 espaços_ e tem garantida sua esquiva contra os primeiros _8 ataques_ recebidos.

#duelist
actors.hero.talent.strengthening_meal.title=Refeição fortalecedora
actors.hero.talent.strengthening_meal.desc=_+1:_ Comer garante a Duelista 3 de dano adicional nas próximas _2 vezes_ que ela acertar um inimigo com um ataque físico.\n\n_+2:_ Comer garante a Duelista 3 de dano adicional nas próximas _3 vezes_ que ela acertar um inimigo com um ataque físico.
actors.hero.talent.adventurers_intuition.title=Intuição de aventureiro
actors.hero.talent.adventurers_intuition.desc=_+1:_ A Duelista identifica armas _2,5x mais rápido_ e armaduras _1,75x mais rápido_.\n\n_+2:_ A Duelista identifica armas _quando são equipadas_ e armaduras _2,5x mais rápido.
actors.hero.talent.patient_strike.title=Golpe paciente
actors.hero.talent.patient_strike.desc=_+1:_ Se a Duelista esperar antes de realizar um ataque corpo a corpo, ela causará _1-2 de dano adicional_.\n\n_+2:_ Se a Duelista esperar antes de realizar um ataque corpo a corpo, ela causará _2 de dano adicional_.
actors.hero.talent.aggressive_barrier.title=Barreira agressiva
actors.hero.talent.aggressive_barrier.desc=_+1:_ A Duelista ganha _3 de escudo_ quando usa uma habilidade de arma e está com 50% ou menos de vida.\n\n_+2:_ A Duelista ganha _5 de escudo_ quando usa uma habilidade de arma e está com 50% ou menos de vida.
actors.hero.talent.aggressive_barrier.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá escudo quando o mesmo realizar ataque corpo a corpo estando com pouca vida, com um tempo de recarga de 50 turnos.

actors.hero.talent.focused_meal.title=Refeição focada
actors.hero.talent.focused_meal.desc=_+1:_ Comer leva apenas 1 turno para a Duelista e concede _0,67 de carga_ a suas armas.\n\n_+2:_ Comer leva apenas 1 turno para a Duelista e concede _1 de carga_ a suas armas.
actors.hero.talent.focused_meal.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá bônus de dano ao próximo golpe igual ao seu nível/3 em +1 ou nível/2 em +2.
actors.hero.talent.liquid_agility.title=Agilidade líquida
actors.hero.talent.liquid_agility.desc=_+1:_ Ao aplicar ou jogar um injetor, composto ou elixir, a Duelista tem _3x mais evasão_ e tem _3x mais precisão_ em seu próximo ataque corpo a corpo em 5 turnos.\n\n_+2:_ Ao aplicar ou jogar um injetor, composto ou elixir, a Duelista tem _evasão infinita_ e tem _precisão infinita_ em seu próximo ataque corpo a corpo em 5 turnos.\n\nEste bônus dura por um turno e ataque adicionais ao usar injetores de força, de experiência ou itens de síntese que usam desses injetores para serem criados.\n\nPara itens de síntese com maiores quantidades de produção (ex. composto aquático), este talento tem uma chance de ser ativado com base em quantos itens são produzidos.
actors.hero.talent.weapon_recharging.title=Recarga de arma
actors.hero.talent.weapon_recharging.desc=_+1:_ A Duelista ganha uma carga de arma a cada _15 turnos_ quando estiver sob efeito de bônus de recarga de arma especial ou módulo.\n\n_+2:_ A Duelista ganha uma carga de arma a cada _10 turnos_ quando estiver sob efeito de bônus de recarga de arma especial ou módulo.
actors.hero.talent.weapon_recharging.meta_desc=_Se este talento for adquirido por um herói diferente_, fará com que o mesmo cause, quando sob o efeito de recarga, +5% de dano corpo a corpo em +1 ou +7,5% de dano corpo a em +2.
actors.hero.talent.lethal_haste.title=Pressa letal
actors.hero.talent.lethal_haste.desc=_+1:_ Quando a Duelista desfere um golpe mortal em um inimigo com uma habilidade de arma, ela ganha _3 turnos_ de movimento instantâneo.\n\n_+2:_ Quando a Duelista desfere um golpe mortal em um inimigo com uma habilidade de arma, ela ganha _5 turnos_ de movimento instantâneo.
actors.hero.talent.lethal_haste.meta_desc=_Se esse talento for adquirido por um herói diferente_, será acionado com ataques de armas regulares, com um tempo de recarga de 100 turnos.
actors.hero.talent.swift_equip.title=empunhar ágil
actors.hero.talent.swift_equip.desc=_+1:_ A Duelista pode trocar sua arma equipada instantaneamente _uma vez_ a cada 20 turnos.\n\n_+2:_ A Duelista pode trocar sua arma equipada instantaneamente _duas vezes_ a cada 20 turnos.\n\nSe a Duelista tiver este talento e não estiver em tempo de recarga, o uso rápido de uma arma não equipada irá equipá-la.

actors.hero.talent.precise_assault.title=investida precisa
actors.hero.talent.precise_assault.desc=_+1:_ Quando a Duelista usa uma habilidade de arma, ela ganha _2x mais precisão_ em seu próximo ataque corpo a corpo em 5 turnos.\n\n_+2:_ Quando a Duelista usa uma habilidade de arma, ela ganha _5x mais precisão_ em seu próximo ataque corpo a corpo em 5 turnos.\n\n_+3:_ Quando a Duelista usa uma habilidade de arma, ela ganha _precisão infinita_ em seu próximo ataque corpo a corpo em 5 turnos.
actors.hero.talent.precise_assault.meta_desc=_Se este talento for adquirido por um herói diferente_, aumentará a precisão corpo a corpo em 10% em +1, 20% em +2 ou 30% em +3.
actors.hero.talent.deadly_followup.title=Acompanhamento mortal
actors.hero.talent.deadly_followup.desc=_+1:_ Quando a Duelista atingir um inimigo com uma arma de arremesso, causará _10% a mais de dano corpo a corpo_ a ele por 5 turnos.\n\n_+2:_ Quando a Duelista atingir um inimigo com uma arma de arremesso, causará _20% a mais de dano corpo a corpo_ a ele por 5 turnos.\n\n_+3:_ Quando a Duelista atingir um inimigo com uma arma de arremesso, causará _30% a mais de dano corpo a corpo_ a ele por 5 turnos.

actors.hero.talent.varied_charge.title=Carga variada
actors.hero.talent.varied_charge.desc=_+1:_ A Campeã recupera instantaneamente _0,17 carga de arma_ quando usa duas habilidades de arma diferentes, sem limite de tempo.\n\n_+2:_ A Campeã recupera instantaneamente _0,33 carga de arma_ quando usa duas habilidades de arma diferentes, sem limite de tempo.\n\n_+3:_ A Campeã recupera instantaneamente _0,5 carga de arma_ quando usa duas habilidades de arma diferentes, sem limite de tempo.
actors.hero.talent.twin_upgrades.title=Aprimoramentos gêmeos
actors.hero.talent.twin_upgrades.desc=_+1:_ Se uma das duas armas equipadas da Campeã tiver um nível inferior e for _2 ou mais tiers menores_ à outra arma, ela será aumentada para o nível da outra arma.\n\n_+2:_ Se uma das duas armas equipadas da Campeã tiver um nível inferior e for _1 ou mais tiers menores_ à outra arma, ela será aumentada para o nível da outra arma.\n\n_+3:_ Se uma das duas armas equipadas da Campeã tiver um nível inferior e for _do mesmo tier ou menor_ à outra arma, ela será aumentada para o nível da outra arma.
actors.hero.talent.combined_lethality.title=Letalidade combinada
actors.hero.talent.combined_lethality.desc=_+1:_ Se a Campeã atacar com uma arma corpo a corpo imediatamente após usar uma habilidade de arma diferente, esse ataque executará qualquer inimigo não-chefe que tenha sido deixado _com menos de 13% PV_.\n\n_+2:_ Se a Campeã atacar com uma arma corpo a corpo imediatamente após usar uma habilidade de arma diferente, esse ataque executará qualquer inimigo não-chefe que tenha sido deixado _com menos de 27% PV_.\n\n_+3:_ Se a Campeã atacar com uma arma corpo a corpo imediatamente após usar uma habilidade de arma diferente, esse ataque executará qualquer inimigo não-chefe que tenha sido deixado _com menos de 40% PV_.\n\nEste ataque pode ser um ataque corpo a corpo regular com arma ou parte de uma habilidade de arma.

actors.hero.talent.unencumbered_spirit.title=espírito livre
actors.hero.talent.unencumbered_spirit.desc=_+1:_ A Monja ganha _50% mais energia_ para cada peça de equipamento de _tier 3 ou inferior_ que estiver usando.\n\n_+2:_ A Monja ganha _75% mais energia_ para cada peça de equipamento de _tier 2 ou inferior_ que estiver usando. O benefício de tier 3 permanece inalterado.\n\n_+3:_ A Monja ganha _100% mais energia_ para cada peça de equipamento de _tier 1 ou inferior_ que estiver usando. Os benefícios de tier 2 e 3 permanecem inalterados. Ela também ganha uma armadura de tecido e luvas cravejadas sem custo.\n\nObserve que este talento não concede benefício por estar desarmado ou atacar com um Implante de Força.
actors.hero.talent.monastic_vigor.title=vigor monástico
actors.hero.talent.monastic_vigor.desc=_+1:_ Se a Monja tiver _100% de energia_, suas habilidades serão fortalecidas.\n\n_+2:_ Se a Monja tiver _80% ou mais de energia_, suas habilidades serão fortalecidas.\n\n_+3:_ Se a Monja tiver _60% ou mais de energia_, suas habilidades serão fortalecidas.\n\nQuando fortalecida:\n- Rajada de golpes aplica a modificação da arma\n- Foco é instantâneo\n- Dash ganha +4 de alcance\n- Chute do Dragão causa +50% de dano e aplica seu efeito de empurrão e atordoamento a todos os inimigos adjacentes\n- Meditar cura lentamente 20% de PV perdidos e concede 80% de resistência a danos.
actors.hero.talent.combined_energy.title=energia combinada
actors.hero.talent.combined_energy.desc=_+1:_ Se a Monja usar uma habilidade de arma e uma habilidade de _4+ energia_ dentro de 5 turnos uma da outra, ela recupera 1 energia gasta.\n\n_+2:_ Se a Monja usar uma habilidade de arma e uma habilidade de _3+ energia_ dentro de 5 turnos uma da outra, ela recupera 1 energia gasta.\n\n_+3:_ Se a Monja usar uma habilidade de arma e uma habilidade de _2+ energia_ dentro de 5 turnos uma da outra, ela recupera 1 energia gasta.

actors.hero.talent.close_the_gap.title=diminuindo a distância
actors.hero.talent.close_the_gap.desc=_+1:_ A Duelista lampeja _até 2 espaços_ em direção ao seu alvo ao iniciar um duelo.\n\n_+2:_ A Duelista lampeja _até 3 espaços_ em direção ao seu alvo ao iniciar um duelo.\n\n_+3:_ A Duelista lampeja _até 4 espaços_ em direção ao seu alvo ao iniciar um duelo.\n\n_+4:_ A Duelista lampeja _até 5 espaços_ em direção ao seu alvo ao iniciar um duelo.\n\nO lampejo pode atravessar por efeitos nocivos e inimigos, mas não por terreno sólido como paredes. O lampejo é levado em consideração ao determinar se o inimigo está ao alcance para ser desafiado.
actors.hero.talent.invigorating_victory.title=Vitória revigorante
actors.hero.talent.invigorating_victory.desc=_+1:_ Se a Duelista derrotar seu alvo antes do final do duelo, ela se cura em _5 PV mais 30% do dano_ que sofreu durante o duelo.\n\n_+2:_ Se a Duelista derrotar seu alvo antes do final do duelo, ela se cura em _10 PV mais 50% do dano_ que sofreu durante o duelo.\n\n_+3:_ Se a Duelista derrotar seu alvo antes do final do duelo, ela se cura em _15 PV mais 65% do dano_ que sofreu durante o duelo.\n\n_+4:_ Se a Duelista derrotar seu alvo antes do final do duelo, ela se cura em _20 PV mais 75% do dano_ que sofreu durante o duelo.
actors.hero.talent.elimination_match.title=Jogo de eliminação
actors.hero.talent.elimination_match.desc=_+1:_ Se a Duelista desafiar novamente dentro de 3 turnos após o final de um duelo, esse desafio terá um custo de carga _16% reduzido_. \n\n_+2:_ Se a Duelista desafiar novamente dentro de 3 turnos após o final do duelo, esse desafio terá um custo de carga _30% reduzido_. \n\n_+3:_ Se a Duelista desafiar novamente dentro de 3 turnos após o final de um duelo, esse desafio terá um custo de carga _40% reduzido_. \n\n_+4:_ Se a Duelista desafiar novamente dentro de 3 turnos após o final de um duelo, esse desafio terá um custo de carga _50% reduzido_.

actors.hero.talent.elemental_reach.title=Alcance elementar
actors.hero.talent.elemental_reach.desc=_+1:_ O alcance do ataque elementar é aumentado de 4 para _5 espaços_ e sua largura de 65 para _75 graus_.\n\n_+2:_ O alcance do ataque elementar é aumentado de 4 para _6 espaços_ e sua largura de 65 para _85 graus_.\n\n_+3:_ O alcance do ataque elementar é aumentado de 4  para _7 espaços_ e sua largura de 65 para _95 graus_.\n\n_+4:_ O alcance do ataque elementar é aumentado de 4 para _8 espaços_ e sua largura de 65 para _105 graus_.
actors.hero.talent.striking_force.title=Força de impacto
actors.hero.talent.striking_force.desc=_+1:_ O poder de efeito do ataque elementar é aumentado em _30%_.\n\n_+2:_ O poder de efeito do ataque elementar é aumentado em _60%_.\n\n_+3:_ O poder de efeito do ataque elementar é aumentado em _90%_.\n\n_+4:_ O poder de efeito do ataque elementar é aumentado em _120%_.
actors.hero.talent.directed_power.title=Poder direcionado
actors.hero.talent.directed_power.desc=_+1:_ O ataque direto do ataque elementar ganha _+30% de poder de modificação_ para cada inimigo no alcance do efeito do ataque elementar, incluindo o alvo do ataque.\n\n_+2:_ O ataque direto do ataque elementar ganha _+60% de poder de modificação_ para cada inimigo no alcance do efeito do ataque elementar, incluindo o alvo do ataque.\n\n_+3:_ O ataque direto do ataque elementar ganha _+90% de poder de modificação_ para cada inimigo no alcance do efeito do ataque elementar, incluindo o alvo do ataque.\n\n_+4:_ O ataque direto do ataque elementar ganha _+120% de poder de modificação_ para cada inimigo no alcance do efeito do ataque elementar, incluindo o alvo do ataque.

actors.hero.talent.feigned_retreat.title=retirada simulada
actors.hero.talent.feigned_retreat.desc=_+1:_ Se um inimigo atacar a pós-imagem da Duelista, ela ganha _2 turnos_ de pressa.\n\n_+2:_ Se um inimigo atacar a pós-imagem da Duelista, ela ganha _4 turnos_ de pressa.\n\n_+3:_ Se um inimigo atacar a pós-imagem da Duelista, ela ganha _6 turnos_ de pressa.\n\n_+4:_ Se um inimigo atacar a pós-imagem do Duelista, ela ganha _8 turnos_ de pressa.
actors.hero.talent.expose_weakness.title=expor fraqueza
actors.hero.talent.expose_weakness.desc=_+1:_ Inimigos que atacam a pós-imagem da Duelista sofrem fraqueza e ficam vulneráveis por _2 turnos_.\n\n_+2:_ Inimigos que atacam a pós-imagem da Duelista sofrem fraqueza e ficam vulneráveis por _4 turnos_.\n\n_+3:_ Inimigos que atacam a pós-imagem da Duelista sofrem fraqueza e ficam vulneráveis por _6 turnos_.\n\n_+4:_ Inimigos que atacam a pós-imagem da Duelista sofrem fraqueza e ficam vulneráveis por _8 turnos_.
actors.hero.talent.counter_ability.title=contra-habilidade
actors.hero.talent.counter_ability.desc=_+1:_ Se a Duelista usar uma habilidade de arma dentro de 3 turnos após sua pós-imagem ser atacada, ela recuperará instantaneamente _0,38 cargas_.\n\n_+2:_ Se a Duelista usar uma habilidade de arma dentro de 3 turnos após sua pós-imagem ser atacada, ela recuperará instantaneamente _0,77 cargas_.\n\n_+3:_ Se a Duelista usar uma habilidade de arma dentro de 3 turnos após sua pós-imagem ser atacada, ela recuperará instantaneamente _1,13 cargas_.\n\n_+4:_ Se a Duelista usar uma habilidade de arma dentro de 3 turnos após sua pós-imagem ser atacada, ela recuperará instantaneamente _1,5 cargas_.

#cleric
actors.hero.talent.satiated_spells.title=Magias Saciadas
actors.hero.talent.satiated_spells.desc=_+1:_ Comer faz com que o Clérigo ganhe _3 de blindagem_ na próxima vez que lançar uma magia.\n\n_+2:_ Comer faz com que o Clérigo ganhe _5 de blindagem_ na próxima vez que lançar uma magia.
actors.hero.talent.satiated_spells.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá imediatamente blindagem, a qual começará a decair normalmente após 10 turnos.
actors.hero.talent.holy_intuition.title=Intuição divina
actors.hero.talent.holy_intuition.desc=_+1:_ O Clérigo pode lançar _Intuição Divina,_ uma magia que revela se um item está corrompido ao custo de _3 cargas._\n\n_+2:_ O Clérigo pode lançar _Intuição Divina,_ um magia que revela se um item está corrompido ao custo de _2 cargas._
actors.hero.talent.holy_intuition.meta_desc=_Se este talento for adquirido por um herói diferente_, permitirá que o herói identifique o status da corrupção em um item corrompido quando prestes a equipá-lo, 15% das vezes com +1 ou 25% das vezes com +2.
actors.hero.talent.searing_light.title=Luz abrasadora
actors.hero.talent.searing_light.desc=_+1:_ Os ataques físicos do Clérigo contra inimigos iluminados pela _Luz Guia_ causam _+3 de dano._\n\n_+2:_ Os ataques físicos do Clérigo contra inimigos iluminados pela _Luz Guia_ causam _+5 de dano._
actors.hero.talent.searing_light.meta_desc=_Se este talento for adquirido por um herói diferente_, ele concederá dano extra depois que uma arma especial ou módulo for usado em um inimigo, com um tempo de recarga de 20 turnos.
actors.hero.talent.shield_of_light.title=Escudo de luz
actors.hero.talent.shield_of_light.desc=_+1:_ O Clérigo pode conjurar _Escudo de Luz_, uma magia que é conjurada instantaneamente e concede _2-4 de armadura_ contra um alvo por 5 turnos ao custo de 1 carga.\n\n_+2:_ O Clérigo pode conjurar _Escudo de Luz_, uma magia que é conjurada instantaneamente e concede _3-6 de armadura_ contra um alvo por 5 turnos ao custo de 1 carga.
actors.hero.talent.shield_of_light.meta_desc=_Se esse talento for adquirido por um herói diferente_, reduzirá o dano físico recebido do inimigo alvo em 1, 33% das vezes com +1 ou 50% das vezes com +2.

actors.hero.talent.enlightening_meal.title=Refeição Iluminada
actors.hero.talent.enlightening_meal.desc=_+1:_ Comer leva 1 turno para o Clérigo e concede _0,67 cargas_ ao seu tomo sagrado.\n\n_+2:_ Comer leva 1 turno para o Clérigo e concede _1 carga_ ao seu tomo sagrado.
actors.hero.talent.enlightening_meal.meta_desc=_Se esse talento for adquirido por um herói diferente_, concederá 2 turnos de recarga de arma especial e módulo em +1, ou 3 turnos em +2. Não pode ser usado para fazer o sintetizador de rações se recarregar.
actors.hero.talent.recall_inscription.title=Recuperar Inscrição
actors.hero.talent.recall_inscription.refunded=Seu item foi reembolsado!
actors.hero.talent.recall_inscription.desc=_+1:_ O Clérigo pode lançar _Recuperar Inscrição,_ um feitiço que permite repetir o efeito da última cápsula tática ou cartucho que usou em _10 turnos._\n\n_+2:_ O Clérigo pode lançar _Recuperar inscrição,_ um feitiço que permite repetir o efeito da última cápsula tática ou cartucho que usou em _300 turnos._\n\nRecuperar Inscrição não pode ser usado com kits de modificação. O custo de carga desta magia varia de acordo com o item usado recentemente: 2 para uma cápsula tática, 3 para um cartucho, 4 para um cartucho exótico. Este custo de carga também é duplicado quando usado com um cartucho de transmutação ou itens de síntese que precisam de cartuchos de transmutação ou de aprimoramento para serem criados.
actors.hero.talent.recall_inscription.meta_desc=_Se este talento for ganho por um herói diferente_, reembolsará qualquer cartucho ou cápsula tática 10% das vezes em +1 ou 15% das vezes em +2. kits de modificação são isentos desse efeito.
actors.hero.talent.sunray.title=Raio solar
actors.hero.talent.sunray.desc=_+1:_ O Clérigo pode conjurar _Raio Solar_, uma magia que causa _4-8 de dano_ e cega o alvo por _4 turnos,_ ao custo de 1 carga.\n\n_+2:_ O Clérigo pode conjurar _Raio Solar_, uma magia que causa _6-12 de dano_ e cega o alvo por _6 turnos,_ ao custo de 1 carga.\n\nRaio Solar só pode cegar cada alvo uma vez, mas se o alvo já estiver cegado pelo Raio Solar, então será paralisado. Raio Solar sempre causa o máximo de dano a inimigos demoníacos e mortos-vivos.
actors.hero.talent.sunray.meta_desc=_Se esse talento for adquirido por um herói diferente_, fará com que armas especiais e módulos ceguem os inimigos por 4 turnos, 15% das vezes em +1 ou 25% das vezes em +2.
actors.hero.talent.divine_sense.title=Sentido divino
actors.hero.talent.divine_sense.desc=_+1:_ O Clérigo pode conjurar _Sentido Divino_, uma magia que concede a ele _8 espaços_ de Visão Mental por 50 turnos e não leva tempo para lançar, ao custo de 2 cargas.\n\n_+2:_ O Clérigo pode conjurar _Sentido Divino_, uma magia que concede a ele _12 espaços_ de Visão Mental por 50 turnos e não leva tempo para lançar, ao custo de 2 cargas.
actors.hero.talent.divine_sense.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá visão mental, por um breve momento após usar uma arma especial ou módulo, com um alcance de 3 espaços em +1 ou 5 espaços em +2.
actors.hero.talent.bless.title=Benção
actors.hero.talent.bless.desc=_+1:_ O Clérigo pode lançar _Benção_, um feitiço que concede _6 turnos de bênção e 10 de blindagem_ quando lançado em si mesmo ou _10 turnos de bênção e 10 de cura_ quando lançado em outro personagem, ao custo de 1 carga.\n\n_+2:_ O Clérigo pode lançar _Benção_, um feitiço que concede _10 turnos de bênção e 15 de blindagem_ quando lançado em si mesmo ou _15 turnos de bênção e 15 de cura_ quando lançado em outro personagem, ao custo de 1 carga.\n\nO excesso de cura deste feitiço é convertido em blindagem.
actors.hero.talent.bless.meta_desc=_Se este talento for adquirido por um herói diferente_, aumentará a precisão e a evasão do herói e de todos os aliados em 3% em +1 ou 5% em +2.

actors.hero.talent.cleanse.title=Purificar
actors.hero.talent.cleanse.desc=_+1:_ O Clérigo pode lançar _Purificar,_ um feitiço que _remove efeitos de status negativos_ do Clérigo e de quaisquer aliados próximos e concede a eles _10 de blindagem,_ ao custo de 2 cargas.\n\n_+2:_ O Clérigo pode lançar _Purificar,_ um feitiço que _concede 3 turnos de imunidade a status negativos_ ao Clérigo e a quaisquer aliados próximos, e concede a eles _20 de blindagem,_ ao custo de 2 cargas.\n\n_+3:_ O Clérigo pode lançar _Purificar,_ um feitiço que _concede 5 turnos de imunidade a status negativos_ ao Clérigo e a quaisquer aliados próximos, e concede a eles _30 de blindagem,_ ao custo de 2 cargas.
actors.hero.talent.cleanse.meta_desc=_Se este talento for adquirido por um herói diferente_, dissipará efeitos de status negativos no herói após o uso de uma arma especial ou módulo, 10/20/30% das vezes em +1/+2/+3.
actors.hero.talent.light_reading.title=Leitura da Luz
actors.hero.talent.light_reading.desc=_+1:_ O Clérigo pode usar seu tomo sagrado quando não estiver equipado, mas ele recarrega a _25% da velocidade_ quando não estiver equipado.\n\n_+2:_ O Clérigo pode usar seu tomo sagrado quando não estiver equipado, mas ele recarrega a _50% da velocidade_ quando não estiver equipado.\n\n_+3:_ O Clérigo pode usar seu tomo sagrado quando não estiver equipado, mas ele recarrega a _75% da velocidade_ quando não estiver equipado.
actors.hero.talent.light_reading.meta_desc=_Se este talento for adquirido por um herói diferente_, aumentará a velocidade de recarga de todas as armas especiais em 7/13/20% em +1/+2/+3.

actors.hero.talent.holy_lance.title=Lança Sagrada
actors.hero.talent.holy_lance.desc=_+1:_ O Sacerdote pode conjurar _Lança Sagrada_, uma magia devastadora que causa _30-55 de dano_ ao custo de 4 cargas.\n\n_+2:_ O Sacerdote pode conjurar _Lança Sagrada_, uma magia devastadora que causa _45-83 de dano_ ao custo de 4 cargas.\n\n_+3:_ O Sacerdote pode conjurar _Lança Sagrada_, uma magia devastadora que causa _60-110 de dano_ ao custo de 4 cargas.\n\nLança Sagrada sempre causa dano máximo a inimigos demoníacos e mortos-vivos. A Lança Sagrada tem um tempo de recarga de 30 turnos antes de poder ser conjurada novamente.
actors.hero.talent.hallowed_ground.title=Solo santificado
actors.hero.talent.hallowed_ground.desc=_+1:_ O Sacerdote pode lançar _Solo Santificado,_ um feitiço que santifica o terreno em uma área _3x3_ por 20 turnos, ao custo de 2 cargas.\n\n_+2:_ O Sacerdote pode lançar _Solo Santificado,_ um feitiço que santifica o terreno em uma área _5x5_ por 20 turnos, ao custo de 2 cargas.\n\n_+3:_ O Sacerdote pode lançar _Solo Santificado,_ um feitiço que santifica o terreno em uma área _7x7_ por 20 turnos, ao custo de 2 cargas.\n\nQuando lançado, Solo Santificado cura aliados em 15 PV, enraíza brevemente os inimigos e espalha grama curta. Depois disso, cura lentamente os aliados, aleija os inimigos e faz com que a grama alta cresça aleatoriamente. Solo santificado concede blindagem ao Sacerdote ao invés de cura e é destruído por fogo.
actors.hero.talent.mnemonic_prayer.title=Oração Mnemônica
actors.hero.talent.mnemonic_prayer.desc=_+1:_ O Sacerdote pode lançar _Oração Mnemônica,_ uma magia que estende buffs/debuffs em um aliado/inimigo por _3 turnos_ ao custo de 1 carga.\n\n_+2:_ O Sacerdote pode lançar _Oração Mnemônica,_ uma magia que estende buffs/debuffs em um aliado/inimigo por _4 turnos_ ao custo de 1 carga.\n\n_+3:_ O Sacerdote pode lançar _Oração Mnemônica,_ uma magia que estende buffs/debuffs em um aliado/inimigo por _5 turnos_ ao custo de 1 carga.\n\nA Oração Mnemônica não leva tempo para ser lançada. A Oração Mnemônica só pode estender uma instância específica de um buff/debuff uma vez e não pode estender buffs de habilidades de armadura.

actors.hero.talent.lay_on_hands.title=Cura pelas mãos
actors.hero.talent.lay_on_hands.desc=_+1:_ O Paladino pode lançar _Cura pelas mãos,_ um magia que cura instantaneamente um personagem próximo em _15 PV,_ ou concede ao Paladino _15 de blindagem,_ ao custo de 1 carga.\n\n_+2:_ O Paladino pode lançar _Cura pelas mãos,_ um magia que cura instantaneamente um personagem próximo em _20 PV,_ ou concede ao Paladino _20 de blindagem,_ ao custo de 1 carga.\n\n_+3:_ O Paladino pode lançar _Cura pelas mãos,_ um magia que cura instantaneamente um personagem próximo em _25 PV,_ ou concede ao Paladino _25 de blindagem,_ ao custo de 1 carga.\n\nO excesso de cura desta magia é convertido em proteção. Cura pelas mãos pode ser lançado repetidamente, mas não pode aplicar mais do que três lançamentos de escudo de uma só vez.
actors.hero.talent.aura_of_protection.title=Aura de proteção
actors.hero.talent.aura_of_protection.desc=_+1:_ O Paladino pode lançar _Aura de Proteção,_ um magia que concede ao Paladino e a todos os aliados dentro de 2 quadrados _20% de resistência a dano_ e o efeito do revestimento de armadura do Paladino com _+50% de poder_ por 20 turnos, ao custo de 2 cargas.\n\n_+2:_ O Paladino pode lançar _Aura de Proteção,_ um magia que concede ao Paladino e a todos os aliados dentro de 2 quadrados _30% de resistência a dano_ e o efeito do revestimento de armadura do Paladino com _+75% de poder_ por 20 turnos, ao custo de 2 cargas.\n\n_+3:_ O Paladino pode lançar _Aura de Proteção,_ um magia que concede ao Paladino e a todos os aliados dentro de 2 quadrados _40% de resistência a danos_ e o efeito do revestimento de armadura do Paladino em _+100% de poder_ por 20 turnos, ao custo de 2 cargas.
actors.hero.talent.wall_of_light.title=Parede de luz
actors.hero.talent.wall_of_light.desc=_+1:_ O Paladino pode conjurar _Parede de Luz_, uma magia que cria uma parede sólida de _3 espaços de largura_ na frente dele que empurra os inimigos para trás e dura por 20 turnos, ao custo de 3 cargas.\n\n_+2:_ O Paladino pode conjurar _Parede de Luz_, uma magia que cria uma parede sólida de _5 espaços de largura_ na frente dele que empurra os inimigos para trás e dura 20 turnos, ao custo de 3 cargas.\n\n_+3:_ O Paladino pode conjurar _Parede de Luz_, uma magia que cria uma parede sólida de _7 espaços de largura_ na frente dele que empurra os inimigos e dura 20 turnos, ao custo de 3 cargas.\n\nA parede pode ser colocada cardinalmente ou diagonalmente, apenas uma parede pode existir por vez.

actors.hero.talent.divine_intervention.title=Intervenção divina
actors.hero.talent.divine_intervention.desc=_+1:_ Enquanto estiver na Forma Ascendida, o Clérigo pode lançar _Intervenção Divina,_ que concede ao Clérigo e a todos os aliados até _150 de blindagem_ e estende a Forma Ascendida por _3 turnos_.\n\n_+2:_ Enquanto estiver na Forma Ascendida, o Clérigo pode lançar _Intervenção Divina,_ que concede ao Clérigo e a todos os aliados até _200 de blindagem_ e estende a Forma Ascendida por _4 turnos._\n\n_+3:_ Enquanto estiver na Forma Ascendida, o Clérigo pode lançar _Intervenção Divina,_ que concede ao Clérigo e a todos os aliados até _250 de blindagem_ e estende a Forma Ascendida por _5 turnos._\n\n_+4:_ Enquanto estiver na Forma Ascendida, o Clérigo pode lançar _Intervenção Divina,_ que concede ao Clérigo e a todos os aliados até _300 de blindagem_ e estende a Forma Ascendida por _6 turnos._\n\nIntervenção Divina custa incríveis 5 cargas do tomo e só pode ser lançada uma vez na mesma forma ascendida.
actors.hero.talent.judgement.title=Julgamento
actors.hero.talent.judgement.desc=_+1:_ Enquanto estiver na Forma Ascendida, o Clérigo pode lançar _Julgamento_, que causa _10-20 de dano_ a todos os inimigos visíveis.\n\n_+2:_ Enquanto estiver na Forma Ascendida, o Clérigo pode lançar _Julgamento_, que causa _15-30 de dano_ a todos os inimigos visíveis.\n\n_+3:_ Enquanto estiver na Forma Ascendida, o Clérigo pode lançar _Julgamento_, que causa _20-40 de dano_ a todos os inimigos visíveis.\n\n_+4:_ Enquanto estiver na Forma Ascendida, o Clérigo pode lançar _Julgamento_, que causa _25-50 de dano_ a todos os inimigos visíveis.\n\nO Julgamento custa 3 cargas do tomo. Julgamento causa +33% de dano adicional para cada magia que o Clérigo lançou desde que entrou na forma ascendida ou desde o último lançamento de Julgamento.
actors.hero.talent.flash.title=Lampejo
actors.hero.talent.flash.desc=_+1:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Lampejo_ para se teletransportar até _3 espaços_ de distância.\n\n_+2:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Lampejo_ para se teletransportar até _4 espaços_ de distância.\n\n_+3:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Lampejo_ para se teletransportar até _5 espaços_ de distância.\n\n_+4:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Lampejo_ para se teletransportar até _6 espaços_ de distância.\n\nLampejo custa inicialmente 2 cargas do tomo e mais 1 carga para cada uso na mesma forma ascendida.

actors.hero.talent.body_form.title=Forma corporal
actors.hero.talent.body_form.desc=O Clérigo pode conjurar _Forma Corporal_, que imbui a Trindade com o poder de uma modificação ou revestimento que o Clérigo identificou nesta partida, ao custo de 2 cargas.\n\n_+1:_ Quando a Trindade é usada, o Clérigo ganha o efeito escolhido por _20 turnos._\n\n_+2:_ Quando a Trindade é usada, o Clérigo ganha o efeito escolhido por _27 turnos._\n\n_+3:_ Quando a Trindade é usada, o Clérigo ganha o efeito escolhido por _33 turnos._\n\n_+4:_ Quando a Trindade é usada, o Clérigo ganha o efeito escolhido por _40 turnos._\n\nA Trindade só pode ser imbuída com um efeito corporal por vez. O custo de carga de armadura da Trindade é maior se o revestimento escolhido for raro e poderoso.
actors.hero.talent.mind_form.title=Forma mental
actors.hero.talent.mind_form.desc=O Clérigo pode conjurar _Forma Mental_, que imbui a Trindade com o poder de uma arma especial ou arma de arremesso que o Clérigo usou nesta partida, ao custo de 3 cargas.\n\n_+1:_ Quando a Trindade é usada, o Clérigo usa o efeito de disparo da arma especial ou arremesso do item escolhido, como se fosse _+3._\n\n_+2:_ Quando Trindade é usada, o Clérigo usa o efeito de disparo da arma especial ou arremesso do item escolhido, como se fosse _+4._\n\n_+3:_ Quando Trindade é usada, o Clérigo usa o efeito de disparo da arma especial ou arremesso do item escolhido, como se fosse _+5._\n\n_+4:_ Quando Trindade é usada, o Clérigo usa o efeito de disparo da arma especial ou arremesso do item escolhido, como se fosse _+6._\n\nA Trindade só pode ser imbuída com um efeito mental por vez.
actors.hero.talent.spirit_form.title=Forma espiritual
actors.hero.talent.spirit_form.desc=O Clérigo pode conjurar _Forma Espiritual_, que imbui a Trindade com o poder de um implante ou módulo que o Clérigo identificou nesta partida (exceto o tomo sagrado), ao custo de 4 cargas.\n\n_+1:_ Quando a Trindade é usada, o Clérigo ganhará um efeito de implante em _+1_ por 20 turnos ou acionará um efeito de módulo em _+4._\n\n_+2:_ Quando a Trindade é usada, o Clérigo ganhará um efeito de implante em _+2_ por 20 turnos ou acionará um efeito de módulo em _+6._\n\n_+3:_ Quando a Trindade é usada, o Clérigo ganhará um efeito de implante em _+3_ por 20 turnos ou acionará um efeito de módulo em _+8._\n\n_+4:_ Quando a Trindade é usada, o Clérigo ganhará um efeito de implante em  _+4_ por 20 turnos ou acionará o efeito de um módulo em _+10._\n\nA Trindade só pode ser imbuída com um efeito espiritual por vez. Módulos têm variados efeitos e custos de carga de armadura quando acionados pela Trindade.

actors.hero.talent.beaming_ray.title=Raio radiante
actors.hero.talent.beaming_ray.desc=O Clérigo pode lançar _Raio Radiante_ de um aliado fortalecido ao custo de 1 carga. Este raio pode atravessar paredes e teletransportar o aliado para um local específico. Se um inimigo estiver naquele local, o aliado aparecerá próximo ao inimigo e irá atacá-lo. O Raio Radiante pode até teletransportar aliados normalmente imóveis, mas tem metade do alcance ao fazê-lo.\n\n_+1:_ Raio Radiante tem um alcance máximo de _4 espaços_ e aumenta o bônus de Poder de Muitos para _+35% de dano_ contra o inimigo mais próximo por 10 turnos.\n\n_+2:_ Raio Radiante tem um alcance máximo de _8 espaços_ e aumenta o bônus de Poder de Muitos para _+40% de dano_ contra o inimigo mais próximo por 10 turnos.\n\n_+3:_ Raio Radiante tem um alcance máximo de _12 espaços_ e aumenta o bônus de Poder de Muitos para _+45% de dano_ contra o inimigo mais próximo por 10 turnos.\n\n_+4:_ Raio Radiante tem um alcance máximo de _16 espaços_ e aumenta o bônus de Poder de Muitos para _+50% de dano_ contra o inimigo mais próximo por 10 turnos.
actors.hero.talent.life_link.title=elo de vida
actors.hero.talent.life_link.desc=O Clérigo pode lançar _Elo da Vida_ em si e um aliado fortalecido ao custo de 2 cargas. Esta magia faz com que o dano seja compartilhado entre o Clérigo e seu aliado, e faz com que magias benéficas do Clérigo de nível 3 ou inferior sejam aplicadas a ambos se um deles estiver sendo afetado.\n\n_+1:_ Elo da Vida dura _10 turnos_ e aumenta o bônus de Poder de Muitos para _-35% do dano sofrido._\n\n_+2:_ Elo da Vida dura _13 turnos_ e aumenta o bônus de Poder de Muitos para _-40% do dano sofrido._\n\n_+3:_ Elo da Vida dura _17 turnos_ e aumenta o bônus de Poder de Muitos para _-45% do dano sofrido._\n\n_+4:_ Elo da Vida dura _20 turnos_ e aumenta o bônus de Poder de Muitos para _-50% do dano sofrido._
actors.hero.talent.stasis.title=Estase
actors.hero.talent.stasis.desc=O Clérigo pode conjurar _Estase_ em um aliado fortificado pelo custo de 2 cargas. Estase remove o aliado da masmorra temporariamente e preserva a duração de todos os buffs, incluindo Poder de Muitos. O aliado irá reaparecer próximo a você quando o efeito acabar. Estase pode ser conjurado instantaneamente e sem custo para encerrar o efeito mais cedo. Estase funciona em aliados imóveis, mas não pode movê-los entre os setores.\n\n_+1:_ Estase dura por um máximo de _60 turnos._\n\n_+2:_ Estase dura por um máximo de _90 turnos._\n\n_+3:_ Estase dura por um máximo de _120 turnos._\n\n_+4:_ Estase dura por um máximo de _150 turnos._\n\nO Clérigo também pode conjurar Raio Radiante quando um aliado está em estase para invocá-lo novamente, ou conjurar Elo de Vida para aplicar o efeito preventivamente. Aliados não irão se beneficiar de Elo de Vida enquanto estiverem em Estase.


#universal
actors.hero.talent.heroic_energy.title=energia heroica
actors.hero.talent.heroic_energy.rat_title=energia ratroica
actors.hero.talent.heroic_energy.desc=_+1:_ A habilidade de armadura do herói tem custo de carga _12% reduzido_.\n\n_+2:_ A habilidade de armadura do herói tem custo de carga _23% reduzido_.\n\n_+3:_ A habilidade de armadura do herói tem custo de carga _32% reduzido_.\n\n_+4:_ A habilidade de armadura do herói tem custo de carga _40% reduzido_.

actors.hero.talent.ratsistance.title=ratosistência
actors.hero.talent.ratsistance.desc=_+1:_ Inimigos hostis ratransmutados dão _-10% de dano_.\n\n_+2:_ Inimigos hostis  ratransmutados dão _-19% de dano_.\n\n_+3:_ Inimigos hostis  ratransmutados dão _-27% de dano_.\n\n_+4:_ Inimigos hostis  ratransmutados dão _-35% de dano_.
actors.hero.talent.ratlomacy.title=Ratomancia
actors.hero.talent.ratlomacy.desc=_+ 1:_ Usar ratransmutar em um inimigo ratransmutado torna-o amigável e torna a transformação permanente.\n\n_+2:_ Usar ratransmutar em um inimigo ratransmutado torna-o amigável, torna a transformação permanente e dá a ele _2 turnos_ de adrenalina.\n\n_+3:_ Usar ratransmutar em um inimigo ratransmutado torna-o amigável, torna a transformação permanente e dá a ele _4 turnos_ de adrenalina.\n\n_+4:_ Usar ratransmutar em um inimigo ratransmutado torna-o amigável, torna a transformação permanente e dá a ele _6 turnos_ de adrenalina.
actors.hero.talent.ratforcements.title=ratouxílio
actors.hero.talent.ratforcements.desc=_+1:_ Usando ratransmutar em você mesmo _invoca 1_ rato marsupial aliado próximo a você.\n\n_+2:_ Usando ratransmutar em você mesmo _invoca 2_ ratos marsupiais aliados próximos a você.\n\n_+3:_ Usando ratransmutar em você mesmo _invoca 3_ ratos marsupiais aliados próximos a você.\n\n_+4:_ Usando ratransmutar em você mesmo _invoca 4_ ratos marsupiais aliados próximos a você.



###npcs
actors.mobs.npcs.blacksmith.name=Cabo Lia Moreno
actors.mobs.npcs.blacksmith.intro_quest_warrior=Ei, fuzileiro! Você parece forte.
actors.mobs.npcs.blacksmith.intro_quest_mage=Ei, exterminador! Você parece saber o que faz.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Ei, forças especiais! Você parece esperto.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Ei, piloto! Esse exoesqueleto ainda aguenta trabalho pesado.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Ei, renegada! Você parece corajosa.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Ei, sintético! Você parece importante.
actors.mobs.npcs.blacksmith.intro_quest_start=Quer ajudar? Ótimo, tenho serviço. Montei esta oficina em cima de uma mina antiga, a descida é por aquela escada. Leve esta picareta e me traga _Laztro bruto. 40 pedras_ devem bastar. A rocha lá embaixo é mole, então _dá para cavar através das paredes com um pouco de esforço._\n\nComo assim "como você vai me pagar"? Que interesse...\n\nTá bom, tá bom. Eu sou engenheira, posso mexer no seu equipamento em troca. Considere-se com sorte, sou a única oficina deste planeta.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Mas cuidado, a mina é perigosa. Ela está abandonada faz tempo e cristais começaram a crescer por lá. Eles brilham, mas são frágeis demais para valer alguma coisa, e têm algo que os protege. São fortes, então _cuidado onde você cava_ ou vai chamar a atenção deles.\n\nTem um _cristal gigante_ em algum lugar lá embaixo. Ele é bem mais resistente, então esteja pronto para lutar se começar a quebrá-lo. Aposto que, sem ele, os outros cristais param de crescer. Pago a mais se você destruir.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Mas cuidado, a mina é perigosa. Alguns assimilados também foram atrás do Laztro e estão destruindo o lugar. Eles cavam sem pensar e causaram vários desmoronamentos. Mesmo assim, você vai ter que cavar, então _procure rochas escavadas há pouco tempo._\n\nAcho que um deles está causando a maior parte do estrago, provavelmente um _sísmico_ ou algo parecido. Pago a mais se você achar e matar ele, mas ele vai revidar.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Mas cuidado, a mina é perigosa. Tem um fungo alienígena crescendo lá embaixo. Ele tem torres de esporos que matam o que virem, mas não conseguem sair do lugar. _Fique fora da linha de visão_ se quiser continuar vivo.\n\nPago a mais se você destruir o _núcleo de esporos_, mas vai dar trabalho. Ele está ligado a vários nós de micélio escondidos nas paredes. Você vai ter que quebrar quase todos antes de conseguir ferir o núcleo.
actors.mobs.npcs.blacksmith.reminder=Ainda aqui? A entrada da mina é logo ali.
actors.mobs.npcs.blacksmith.reminder_crystal=Me traga todo o Laztro bruto que puder e tente quebrar o cristal grande também.
actors.mobs.npcs.blacksmith.reminder_gnoll=Me traga todo o Laztro bruto que puder e tente matar o sísmico também.
actors.mobs.npcs.blacksmith.reminder_fungi=Me traga todo o Laztro bruto que puder e tente destruir o núcleo de esporos também.
actors.mobs.npcs.blacksmith.lost_pick=Tá de brincadeira? Cadê a minha picareta?!
actors.mobs.npcs.blacksmith.quest_start_prompt=Pronto para descer? Deixe espaço na mochila para o Laztro.\n\n_Eu só deixo você descer uma vez!_
actors.mobs.npcs.blacksmith.enter_yes=Tudo pronto
actors.mobs.npcs.blacksmith.enter_no=Ainda não
actors.mobs.npcs.blacksmith.exit_warn_none=Já? Você quase não trouxe Laztro! Dá para juntar _40 pedras._\n\n_Lembre, depois que subir, não deixo você voltar._
actors.mobs.npcs.blacksmith.exit_warn_low=Já? Não parece que você pegou muito Laztro. Dá para juntar _40 pedras_.\n\n_Lembre, depois que subir, não deixo você voltar._
actors.mobs.npcs.blacksmith.exit_warn_med=Terminou? Até que você trouxe uma quantidade razoável, mas ainda tem muito lá embaixo. Dá para juntar _40 pedras._\n\n_Lembre, depois que subir, não deixo você voltar._
actors.mobs.npcs.blacksmith.exit_warn_high=Terminou? Você trouxe bastante, mas preciso de um pouco mais. Dá para juntar _40 pedras._\n\n_Lembre, depois que subir, não deixo você voltar._
actors.mobs.npcs.blacksmith.exit_warn_full=Terminou? Você trouxe muito Laztro, só confira se não esqueceu nada do seu equipamento lá embaixo.\n\n_Lembre, depois que subir, não deixo você voltar._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Aquele cristal gigante ainda está lá embaixo. Pago a mais se você destruir.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Aquele sísmico ainda está lá embaixo. Pago a mais se você matar.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Aquele núcleo de esporos ainda está lá embaixo. Pago a mais se você destruir.
actors.mobs.npcs.blacksmith.exit_yes=Terminei
actors.mobs.npcs.blacksmith.exit_no=Ainda não
actors.mobs.npcs.blacksmith.get_lost=Tô ocupada. Some daqui!
actors.mobs.npcs.blacksmith.entrance_blocked=A mina está bloqueada.
actors.mobs.npcs.blacksmith.cant_enter_old=Esta área não é acessível nesta partida. Jogue um novo jogo para tentar a nova missão!
actors.mobs.npcs.blacksmith.def_verb=bloqueou
actors.mobs.npcs.blacksmith.desc=A Cabo Lia Moreno, engenheira de campo da Vigília-7. Ela montou uma oficina improvisada com sucata da nave e trabalha com ferramentas que já viram dias melhores.

actors.mobs.npcs.ghost.name=eco do Sgt. Brandt
actors.mobs.npcs.ghost.rat_1=%s... aqui é o Sgt. Ivo Brandt, ou o que sobrou dele no traje... Fui o primeiro a descer nos dutos depois da queda... Um _rastejador pútrido_ me pegou...\n\nEle ainda anda por este setor... Não consigo desligar enquanto ele estiver vivo... _Cuidado com a névoa tóxica e a mordida ácida. O ácido se dissolve na água..._
actors.mobs.npcs.ghost.rat_2=Por favor... acabe com ele...\n\n_Lute perto da água... Fique longe da névoa..._
actors.mobs.npcs.ghost.gnoll_1=%s... aqui é o Sgt. Ivo Brandt, ou o que sobrou dele no traje... Não foi o enxame que me matou... Foi um dos nossos... Um tripulante assimilado que ainda sabe usar as mãos... Elimine o _assimilado sabotador_...\n\nEle não luta como os outros... Ele se esconde e arremessa coisas... _Cuidado com os dardos incendiários e venenosos. Não troque tiros com ele à distância..._
actors.mobs.npcs.ghost.gnoll_2=Por favor... elimine o sabotador...\n\n_Não deixe ele acertar você... Chegue perto..._
actors.mobs.npcs.ghost.crab_1=%s... aqui é o Sgt. Ivo Brandt, ou o que sobrou dele no traje... Fui pego por algo grande que veio de baixo do casco... Mate o _escavador gigante_...\n\nEle é velho e tem uma garra enorme e uma carapaça grossa... _Ele bloqueia com a garra tudo o que vê chegando. Você precisa pegá-lo de surpresa..._
actors.mobs.npcs.ghost.crab_2=Por favor... destrua o escavador...\n\n_Ele sempre bloqueia... quando vê você chegando..._
actors.mobs.npcs.ghost.find_me=Obrigado... venha até o meu traje...
actors.mobs.npcs.ghost.desc=Um holograma falhado do Sgt. Ivo Brandt, projetado pelo próprio traje caído ali perto. A imagem treme e some por instantes, mas a voz continua firme.

actors.mobs.npcs.imp.name=contrabandista da Garra Turva
actors.mobs.npcs.imp.old_intro=Você é da Brigada? Eu adoro gente da Brigada! Você sempre pode contar com eles caso algo precise ser morto, estou certo? Por uma recompensa, é claro ;)
actors.mobs.npcs.imp.old_golems_1=No meu caso, são os _colossos_ que precisam morrer. Eu quero montar um negócio aqui, mas esses colossos espantam a freguesia! Então, por favor, mate... digamos _4 deles_ e a recompensa é sua.
actors.mobs.npcs.imp.old_monks_1=No meu caso, são os _mantídeos_ que precisam morrer. Eu quero montar um negócio aqui, mas eles não compram nada e assustam os outros clientes. Então, por favor, mate... digamos _5 deles_ e a recompensa é sua.
actors.mobs.npcs.imp.old_golems_2=Como vai a caçada aos colossos? Não esqueça de pegar os chips.
actors.mobs.npcs.imp.old_monks_2=Você ainda está vivo! Eu sabia que você aguentava ;). Não esqueça de pegar os chips.
actors.mobs.npcs.imp.cya=Te vejo por aí, %s!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.quest_intro_1=Ora, ora! Um fuzileiro da Brigada! Eu adoro fuzileiros. Sempre dá para contar com vocês quando precisa de uma mãozinha. Com pagamento justo, claro ;).\n\nTem uma nave engolida pela colmeia bem aqui na frente, e o cofre dela está cheio de módulos raros. Eu sou meio que um colecionador, e tem uma estatueta lá dentro que eu quero muito.\n\nMas o cofre está cheio de guardas e armadilhas, então achei que uma ajudinha cairia bem!
actors.mobs.npcs.imp.quest_intro_2=O cofre está selado. Posso teletransportar você para dentro com um aparelho que venho consertando, mas _ele não leva o seu equipamento junto._ Deve ter muita coisa útil lá dentro! _É melhor começar evitando inimigos e procurando itens menos protegidos._\n\nConsigo trazer você de volta com dois itens do cofre. Um é a minha estatueta, e o outro pode ser _qualquer coisa que você quiser!_\n\nTambém juntei umas mercadorias que podem te interessar! Se me ajudar, _monto uma banca alguns setores abaixo_ e a gente negocia.
actors.mobs.npcs.imp.quest_in_progress=É só ficar no centro da entrada do cofre quando estiver pronto que eu teletransporto você.
actors.mobs.npcs.imp.enter_text=Tudo pronto? Guardo seus itens aqui comigo, _você recebe tudo de volta quando voltar._\n\nLeve este _uniforme padrão_ e o _cristal de teletransporte._ Use o cristal quando estiver com a minha estatueta. ...Acho que _você pode usar antes, se apertar_, mas não espere o pagamento inteiro!\n\nO cofre está parado há muito tempo, então os guardas lá dentro devem estar lentos. Deve ser fácil passar sem ser visto, principalmente se _você ficar atrás de quem está andando._ Se alguém vir você, _não vai perseguir se tiver visto só por um instante._ Preste atenção e você vai _ouvir passos por perto._
actors.mobs.npcs.imp.quest_completed_bad=É, valeu a tentativa.\n\nO teletransportador vai levar muito tempo para recarregar, então é melhor você seguir seu caminho.
actors.mobs.npcs.imp.quest_completed_good=Valeu pela ajuda!\n\nO teletransportador vai levar um tempo para recarregar, e eu preciso planejar com o que você me contou.\n\nVou arrumar minhas coisas e a gente se vê mais embaixo. Ainda preciso de Laztro, então não espere desconto ;).
actors.mobs.npcs.imp.quest_completed_great=Ótimo trabalho lá dentro, muito obrigado!\n\nJá tenho tudo o que precisava aqui, então vou arrumar minhas coisas e a gente se vê mais embaixo. Ainda preciso de Laztro, então não espere desconto ;).\n\nO que a estatueta tem de tão especial? Nada, na verdade. É um enfeite bem comum. Vem de um planeta que não existe mais, talvez seja a última do tipo. Se o enxame não tivesse engolido aquela nave, eu nunca teria achado...
actors.mobs.npcs.imp.enter_yes=Entrar no cofre
actors.mobs.npcs.imp.enter_no=Ficar aqui
actors.mobs.npcs.imp.desc=Um pirata baixinho da Garra Turva, de jaqueta remendada e sorriso fácil. Ele desertou antes do enxame tomar a nave e agora vive de vender o que encontra.\n\nVocê não confiaria nele nem por um segundo, mas ele parece muito feliz em ver você.

actors.mobs.npcs.impshopkeeper.name=contrabandista da Garra Turva
actors.mobs.npcs.impshopkeeper.greetings=Olá, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=O que você fez %s? Compre logo, eu tenho que sair daqui!
actors.mobs.npcs.impshopkeeper.thief=Eu pensei que podia confiar em você!
actors.mobs.npcs.impshopkeeper.buyback=O contrabandista devolve o seu item, com um sorriso.
actors.mobs.npcs.impshopkeeper.desc=O contrabandista montou uma banca na entrada da câmara da rainha. É bom ver um rosto amigo, mas os preços dele não têm nada de amigáveis.

actors.mobs.npcs.mirrorimage.name=cópia espelhada
actors.mobs.npcs.mirrorimage.desc=Esta ilusão possui uma semelhança próxima a você, até mesmo parecendo utilizar sua arma e armadura atual.\n\nImagens espelhadas procurarão e atacarão inimigos usando sua arma imitada, que funciona da mesma forma que a sua, mas causa menos dano. Elas começam praticamente invisíveis, mas devem assumir uma forma mais corpórea para atacar.\n\nEnquanto seu poder ofensivo pode ser potente, imagens espelhadas não possuem durabilidade e irão desaparecer no momento em que receberem dano.
actors.mobs.npcs.mirrorimage.discover_hint=Você pode encontrar este personagem com um cartucho específico.

actors.mobs.npcs.npc.discover_hint=Você pode encontrar este personagem em uma região específica do planeta.

actors.mobs.npcs.prismaticimage.name=imagem prismática
actors.mobs.npcs.prismaticimage.desc=Esta ilusão cintilante tem uma grande semelhança com você, até parecendo usar sua arma e armadura atuais.\n\nAs imagens prismáticas buscarão tirar o foco dos inimigos, usando sua defesa e saúde aprimoradas para proteger você. Embora não tenham o mesmo poder ofensivo que as imagens espelhadas, imagens prismáticas possuem durabilidade aprimorada, incluindo o recebimento de benefícios da sua armadura.\n\nQuando reduzidas a 0 PV, as imagens prismáticas desaparecerão gradualmente ao longo de vários turnos e ainda poderão ser curadas durante esse tempo. Quando não houver inimigos, as imagens prismáticas desaparecerão e voltarão ao seu mestre.
actors.mobs.npcs.prismaticimage.discover_hint=Você pode encontrar este personagem com um cartucho específico.

actors.mobs.npcs.ratking.name=rastejador-rei
actors.mobs.npcs.ratking.not_sleeping=Eu não estou dormindo!
actors.mobs.npcs.ratking.what_is_it=O quê? Não tenho tempo para isso. Meu ninho não se governa sozinho!
actors.mobs.npcs.ratking.confused=Que... onde estou? Meu ninho precisa de mim!
actors.mobs.npcs.ratking.crown_clothes=Vista alguma coisa! Isso é jeito de falar com a realeza?
actors.mobs.npcs.ratking.crown_desc=Oooh, essa coroa é para mim!? É bem mais brilhante do que a minha, então eu aceito de bom grado!\n\nNa verdade, creio que eu possa oferecer algo como recompensa por essa coroa. Um tremendo poder que virá a calhar a um herói como você! Gostaria disso?
actors.mobs.npcs.ratking.crown_yes=Mas é claro!
actors.mobs.npcs.ratking.crown_info=Conte-me mais primeiro.
actors.mobs.npcs.ratking.crown_no=Eu prefiro não...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, obrigado! Agora vá e deixe seu rei orgulhoso!
actors.mobs.npcs.ratking.crown_fine=Tudo bem! Não é como se eu quisesse mesmo...
actors.mobs.npcs.ratking.crown_after=Gostando da sua nova armadura? Não aceitamos devoluções!
actors.mobs.npcs.ratking.desc_crown=Este rastejador é um pouco maior que os outros. Agora ele usa uma coroa de verdade, que não para de ajeitar.
actors.mobs.npcs.ratking.desc_birthday=Este rastejador é um pouco maior que os outros. Hoje ele trocou a coroa por um chapéu de festa verde. Feliz aniversário, rastejador-rei!
actors.mobs.npcs.ratking.desc_winter=Este rastejador é um pouco maior que os outros. Hoje ele trocou a coroa por um gorro de festa. Boas festas!
actors.mobs.npcs.ratking.desc=Este rastejador é um pouco maior que os outros e anda de peito estufado. Na cabeça ele equilibra uma pequena coroa feita de sucata.
actors.mobs.npcs.ratking.discover_hint=Você pode encontrar este personagem no final de uma região específica do planeta.

actors.mobs.npcs.sheep.name=ovelha
actors.mobs.npcs.sheep.baa!=Bééé!
actors.mobs.npcs.sheep.baa?=Béé?
actors.mobs.npcs.sheep.baa.=Béé.
actors.mobs.npcs.sheep.baa...=Béé...
actors.mobs.npcs.sheep.def_verb=bloqueou
actors.mobs.npcs.sheep.desc=Esta é uma ovelha holográfica, projetada para distrair. Você não consegue destruí-la. Ela fica aí até a projeção se desfazer, o tempo todo ruminando com um olhar vazio.
actors.mobs.npcs.sheep.discover_hint=Você pode encontrar este personagem com um item ou armadilha específica.

actors.mobs.npcs.shopkeeper.name=sucateiro
actors.mobs.npcs.shopkeeper.thief=Ladrão, Ladrão!
actors.mobs.npcs.shopkeeper.warn=Tome cuidado! Não vou avisar de novo.
actors.mobs.npcs.shopkeeper.flee=O mercador foge!
actors.mobs.npcs.shopkeeper.sell=Vender um item
actors.mobs.npcs.shopkeeper.talk=Falar
actors.mobs.npcs.shopkeeper.buyback=O lojista devolve seu item com relutância.
actors.mobs.npcs.shopkeeper.talk_prison_intro=Eu tenho tudo o que você precisa para ter sucesso na missão!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=É um gerador interessante que você tem aí, geralmente eles estão inteiros. Você é um herói desonrado ou algo do tipo? Bom, seja lá o que tenha feito não é da minha conta, suas moedas ainda são bem-vindas.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, acho que vi um cartaz de procurado com seu nome em algum lugar da cidade. Em fuga, hein? Ah, você é inocente, é? Claro, claro... Não se preocupe, tenho coisas melhores a fazer do que relatar sobre você, mas talvez deva comprar algo para ter certeza?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Forças especiais por aqui? Então a coisa está pior do que eu pensava. Pode olhar à vontade, mas não espere desconto. Vocês nunca pagam nada e ainda saem sem fazer barulho.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Você parece estar fora do seu ambiente, senhorita. Corredores apertados de masmorras não são tão espaçosos quanto os grandes salões ou as florestas que cercam a cidade, são? Hehe. Ah, não se importe com minhas divagações, por que não compra alguma coisa?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Mas ora se não é o herói viajante! Se estiver tentando salvar outra cidade, então boa sorte, os perigos aqui são muito piores do que gangues de bandidos insignificantes. Tenho certeza de que você se sairá melhor do que qualquer outra pessoa, só tente não morrer do lado de fora da minha loja.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Oh, olá, Sua Reverência, ou é Sua Santidade agora? Hehe, de qualquer forma, este não é lugar para você, muitas pessoas ficariam devastadas se você acabasse morto. Porém, certamente você tem algumas moedas, por que não comprar algo para ajudar a evitar esse infortúnio?
actors.mobs.npcs.shopkeeper.talk_caves=Gaste Laztro, viva mais.\n\nAh, e mande um oi para a Cabo Moreno se encontrar com ela. Lembre que ela ainda me deve pela broca que vendi na semana passada!
actors.mobs.npcs.shopkeeper.talk_city=O que eu vendo pode manter você vivo aqui embaixo.\n\n...E não demore, por favor. Levei uma eternidade para os operários pararem de me incomodar, não quero você atraindo problema!
actors.mobs.npcs.shopkeeper.talk_halls=Olá! Tenho preços especiais para quem vai encarar a rainha!\n\nE cuidado lá embaixo! O que tem na câmara é pior do que qualquer coisa que você viu no cofre, e lá não tem cristal de escape para salvar você. Morto, você não volta para gastar mais Laztro! ;)\n\nSe eu tenho medo do enxame? Hehe, eu sou pequeno demais para eles se interessarem. A rainha quer gente da Brigada... bem... só tome cuidado lá embaixo.
actors.mobs.npcs.shopkeeper.talk_ascent=Não sei o que você vai fazer com esse coração, mas não quero participar. Compre alguma coisa e siga em frente, nós dois precisamos sair daqui!
actors.mobs.npcs.shopkeeper.desc=Um sobrevivente que aprendeu a viver do que o enxame deixa para trás. Ele junta peças, armas e suprimentos dos destroços e vende a quem tiver Laztro. Os preços explicam por que ele ainda não saiu do planeta.

actors.mobs.npcs.wandmaker.name=técnica de armamentos
actors.mobs.npcs.wandmaker.intro_warrior=Um fuzileiro! Graças aos céus. Achei que era a única da Vigília-7 que ainda andava sem mancar. Se você tiver um minuto, tenho um trabalho para você.
actors.mobs.npcs.wandmaker.intro_rogue=Opa! Você me assustou. Faz dias que não vejo ninguém que ainda tenha a cabeça no lugar. Se puder ajudar, tenho uma tarefa para você.
actors.mobs.npcs.wandmaker.intro_mage=Ah, olá, %s! O comando de armas pesadas finalmente mandou alguém? Deixa para lá, eles nunca mandam. Se você puder, tenho uma tarefa para você.
actors.mobs.npcs.wandmaker.intro_huntress=Ei, piloto! Eu calibrei esse exoesqueleto antes da missão, sabia? Não importa. Se você puder ajudar, tenho uma tarefa para você.
actors.mobs.npcs.wandmaker.intro_duelist=Ora, uma cara conhecida em um lugar desses! Se estiver disposta a ajudar uma técnica perdida, tenho uma tarefa para você.
actors.mobs.npcs.wandmaker.intro_cleric=Uma unidade sintética ainda funcionando! Que alívio. Odeio pedir, mas tenho uma tarefa para você.
actors.mobs.npcs.wandmaker.intro_1=\n\nEu saí da nave para buscar um componente raro para as armas especiais, mas me perdi e meu gerador de escudo está fraco. Preciso voltar logo, só que não volto sem o que vim buscar.
actors.mobs.npcs.wandmaker.intro_dust=Eu preciso de um pouco de _pó de cadáver._ É o que sobra quando o enxame termina de consumir um corpo, e ele conduz energia como nada que eu conheço. Deve ter uma sala barricada por aqui, e é lá que esse pó se acumula. Mas cuidado, ele atrai coisas ruins. _Traga para mim o quanto antes_ e eu neutralizo.
actors.mobs.npcs.wandmaker.intro_ember=Eu preciso de _brasas frescas_ de um esporo ígneo recém-formado. Eles aparecem quando alguém mexe no que não devia, então procure umas velas e uma marca de ritual que você consegue fazer um aparecer. _Evite o corpo a corpo_ ou _tenha algo que congele à mão._ Esporos novos são fortes e instáveis, mas não aguentam frio.
actors.mobs.npcs.wandmaker.intro_berry=Os piratas cultivavam uma _planta putrifruta_ por aqui, e eu preciso de uma semente. A planta deve ter crescido sem controle, então tirar uma semente dela vai dar trabalho. O jardim fica em algum lugar deste setor. _Fique longe das raízes_ se quiser voltar inteiro. E nada de fogo, por favor, ou a planta morre e as sementes queimam junto.
actors.mobs.npcs.wandmaker.intro_2=\n\nSe você me trouxer isso, eu pago com uma das minhas melhores armas especiais! Estou com duas aqui, você escolhe a que preferir.
actors.mobs.npcs.wandmaker.reminder_dust=Achou o pó de cadáver, %s? Procure uma sala barricada.
actors.mobs.npcs.wandmaker.reminder_ember=Achou as brasas, %s? Você vai precisar de quatro velas e um lugar para o ritual.
actors.mobs.npcs.wandmaker.reminder_berry=Achou a semente de putrifruta, %s? Procure uma sala cheia de vegetação.
actors.mobs.npcs.wandmaker.def_verb=bloqueou
actors.mobs.npcs.wandmaker.desc=A técnica de armamentos da Vigília-7. Ela parece cansada e um pouco perdida, mas o gerador de escudo no cinto ainda segura o que vier.



##vault quest
actors.mobs.quest.vault.vaultbosselemental.name=esporo colossal
actors.mobs.quest.vault.vaultbosselemental.rankings_desc=Desfeito pelo esporo colossal
actors.mobs.quest.vault.vaultbosselemental.discover_hint=Você pode encontrar este inimigo durante uma missão específica.
actors.mobs.quest.vault.vaultbosselemental.desc=A tripulação desta nave estudava o enxame, e este era o exemplar mais valioso do laboratório: um esporo do tamanho de uma sala, preso numa matriz de contenção no chão. A matriz ainda funciona e permite que ele _troque de forma!_ Cada forma tem ataques, resistências e fraquezas próprios.
actors.mobs.quest.vault.vaultbosselemental.desc_fire=O esporo assumiu a _forma ígnea_. Assim ele dispara bolas de fogo e solta ondas de chamas que varrem a arena. Ele mira as bolas de fogo para onde você está indo, e as ondas sempre deixam uma abertura. Se for atingido, você _pega fogo_.\n\nNesta forma ele _resiste às armas especiais_, que só alimentam as chamas. Por outro lado, o núcleo exposto deve ser fácil de acertar com _armas de arremesso_.
actors.mobs.quest.vault.vaultbosselemental.fire_resist=As chamas crescem enquanto o esporo absorve quase todo o disparo!
actors.mobs.quest.vault.vaultbosselemental.fire_weak=Sua arma de arremesso acerta o núcleo do esporo e causa dano extra!
actors.mobs.quest.vault.vaultbosselemental.desc_frost=O esporo esfriou e assumiu a _forma criogênica_. Assim ele dispara energia gelada num cone largo e cria um vórtice de ar congelante que se move pela arena. Dá para desviar dos dois com reflexo, mas a energia gelada é especialmente perigosa à distância. Se for atingido, você fica _congelado_.\n\nNesta forma ele _resiste às armas de arremesso_, que ficam presas na casca de gelo. A casca não parece muito firme, então um golpe com _arma corpo a corpo_ deve causar bastante dano.
actors.mobs.quest.vault.vaultbosselemental.frost_resist=Sua arma de arremesso fica presa na casca de gelo do esporo!
actors.mobs.quest.vault.vaultbosselemental.frost_weak=Seu golpe quebra parte da casca de gelo e causa dano extra!
actors.mobs.quest.vault.vaultbosselemental.desc_shock=O esporo se carregou e assumiu a _forma elétrica_. Assim ele dispara um raio em você ou faz linhas de faíscas saírem das laterais da arena. Esses ataques são mais fáceis de desviar, mas vêm com mais frequência. Se for atingido, você fica _atordoado_ por um instante.\n\nNesta forma ele _resiste ao corpo a corpo_, e quem encosta leva um choque. Por outro lado, o campo elétrico em volta dele é desestabilizado pelas _armas especiais_, que causam dano extra.
actors.mobs.quest.vault.vaultbosselemental.shock_resist=Você leva um choque doloroso ao tentar acertar o esporo!
actors.mobs.quest.vault.vaultbosselemental.shock_weak=O disparo desestabiliza o campo elétrico do esporo e causa dano extra!

actors.mobs.quest.vault.vaultdm100.name=drone de segurança reprogramado
actors.mobs.quest.vault.vaultdm100.discover_hint=Você pode encontrar este inimigo durante uma missão específica.
actors.mobs.quest.vault.vaultdm100.desc=Drones de segurança iguais aos da Vigília-7, mas com as luzes dos sensores num verde-azulado forte. A tripulação desta nave deve ter trocado a fonte de energia por uma mais moderna.\n\nEles se comportam como os drones de segurança comuns e continuam disparando descargas elétricas de longe. Por estarem mais conservados, aguentam um pouco mais.

actors.mobs.quest.vault.vaultdm200.name=drone minerador reprogramado
actors.mobs.quest.vault.vaultdm200.discover_hint=Você pode encontrar este inimigo durante uma missão específica.
actors.mobs.quest.vault.vaultdm200.desc=Drones mineradores iguais aos das cavernas, mas com as luzes dos sensores num verde-azulado forte. Devem ter recebido uma fonte de energia mais moderna.\n\nComo os das cavernas, são largos demais para lugares apertados e ainda soltam gás.

actors.mobs.quest.vault.vaultrat.desc=Este rato apresenta algumas mudanças de comportamento para testar a nova IA dos inimigos do Cofre:\n_-_ Seus movimentos podem ser "ouvidos" através das paredes.\n_-_ Ele irá percorrer uma rota de patrulha predefinida.\n_-_ Enquanto estiver vagando, seu alcance de detecção é drasticamente reduzido na direção oposta em que se move.\n_-_ Enquanto estiver dormindo, seu alcance de detecção também é reduzido.\n_-_ Quando detectar você, ele irá "investigar" antes de começar a te perseguir. Inimigos investigando se movem em sua direção, mas não atacam e são mais fáceis de despistar atrás de portas e cantos.

actors.mobs.quest.vault.vaultskeleton.name=casca blindada
actors.mobs.quest.vault.vaultskeleton.discover_hint=Você pode encontrar este inimigo durante uma missão específica.
actors.mobs.quest.vault.vaultskeleton.desc=Cascas de tripulantes desta nave, ainda presas aos restos da armadura de segurança. O laboratório guardava estas cascas para estudo, e alguma coisa as acordou.\n\nElas agem como cascas comuns e também estouram em estilhaços quando caem. A armadura as protege um pouco mais.

actors.mobs.quest.vault.vaultshaman.name=psiônico contido
actors.mobs.quest.vault.vaultshaman.discover_hint=Você pode encontrar este inimigo durante uma missão específica.
actors.mobs.quest.vault.vaultshaman.desc=Assimilados psiônicos que o laboratório capturou e prendeu com um capacete de contenção. O capacete está apertado demais, e eles se movem de um jeito rígido e estranho. Talvez o capacete sirva para controlá-los.
actors.mobs.quest.vault.vaultshaman.spell_desc=Eles ainda conseguem atingir você com descargas psiônicas, mas o capacete cobre o nódulo e não dá para saber que efeito a descarga vai ter. O capacete também os protege um pouco mais, e as descargas deles são bem mais fortes que as de um psiônico comum.



###mobs
actors.mobs.acidic.name=lança-ferrões ácido
actors.mobs.acidic.desc=Uma casta grande com uma cauda segmentada que dispara ferrões serrilhados. Ela evita o corpo a corpo e prefere aleijar a presa de longe. Este pinga um muco corrosivo.

actors.mobs.albino.name=rastejador pálido
actors.mobs.albino.desc=Um rastejador sem pigmento, de carapaça quase transparente. Raro, e a mordida dele faz o ferimento sangrar por mais tempo.
actors.mobs.albino.discover_hint=Você poderá raramente encontrar esse inimigo em uma região específica do planeta.

actors.mobs.armoredstatue.name=autômato blindado
actors.mobs.armoredstatue.desc=Parece só mais um robô de segurança desligado da nave, mas os olhos vermelhos acesos o denunciam.\n\nA armadura que ele veste o mantém em ótimo estado, e ele pode ser muito difícil de derrubar.
actors.mobs.armoredstatue.desc_arm_wep=O chassi é de liga barata, mas a arma _%1$s_ que ele empunha e a _%2$s_ que veste parecem de verdade.

actors.mobs.bandit.name=pirata saqueador
actors.mobs.bandit.desc=Um pirata veterano, de casaco mais caro e reflexos melhores. Quando rouba, ainda deixa você tonto antes de fugir.

actors.mobs.bat.name=sugador alado
actors.mobs.bat.desc=Um inseto do enxame do tamanho de um cão, com asas membranosas e uma probóscide oca. Ele recupera vida a cada ataque que acerta, e por isso derruba presas muito maiores do que ele.

actors.mobs.bee.name=vespa dourada
actors.mobs.bee.desc_honey=Uma vespa do planeta, de carapaça dourada, que não pertence ao enxame. Apesar do tamanho, ela defende o ninho com fúria. Esta se acalmou e parece querer seguir você.
actors.mobs.bee.desc=Uma vespa do planeta, de carapaça dourada, que não pertence ao enxame. Apesar do tamanho, ela defende o ninho com fúria. Esta está irritada, é melhor manter distância.
actors.mobs.bee.discover_hint=Você pode encontrar este personagem com um item específico.

actors.mobs.brute.name=assimilado brutamontes
actors.mobs.brute.enraged=Enfurecido
actors.mobs.brute.def_verb=bloqueou
actors.mobs.brute.desc=Um tripulante grande que o enxame engrossou com placas de carapaça. Quando está para morrer, ele entra em fúria, ganha blindagem temporária e passa a causar muito mais dano.
actors.mobs.brute$bruterage.name=fúria do brutamontes
actors.mobs.brute$bruterage.desc=Este assimilado está morrendo, mas quer levar você junto!\n\nEle morre quando a blindagem acaba, pelo tempo ou pelo dano recebido. Até lá, causa muito mais dano que o normal.\n\nBlindagem restante: %d.

actors.mobs.causticslime.name=gosma cáustica
actors.mobs.causticslime.desc=Esta gosma do enxame foi contaminada por alguma coisa que sobe das profundezas. Ela perdeu o verde de costume e escorre um muco cáustico.
actors.mobs.causticslime.discover_hint=Você poderá raramente encontrar este inimigo em uma região específica do planeta.

actors.mobs.crab.name=escavador
actors.mobs.crab.desc=Uma forma blindada do enxame que abre caminho pelo solo e pelos destroços. É muito rápido, a carapaça aguenta golpes pesados e, quando você se afasta, ele se enterra e brota ao seu lado.

actors.mobs.crystalguardian.name=sentinela de Laztro
actors.mobs.crystalguardian.def_verb=bloqueou
actors.mobs.crystalguardian.desc=Uma criatura de Laztro endurecido que parece uma estátua, se não fosse pelos olhos que brilham. O cristal a deixa lenta, mas muito resistente, então _é melhor deixá-la dormindo no ninho pelo maior tempo possível._\n\nPelo tamanho, ela anda bem mais devagar em lugares apertados. É tão resistente que não pode ser morta. Dá para derrubá-la por um tempo, mas ela sempre volta.
actors.mobs.crystalguardian.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.crystalmimic.name=mimetizador de Laztro
actors.mobs.crystalmimic.ate=O mimetizador abocanhou seu item %s!
actors.mobs.crystalmimic.escaped=O mimetizador de Laztro escapou!
actors.mobs.crystalmimic.desc=Os mimetizadores são criaturas do planeta que copiam o formato de qualquer objeto. Entre os destroços, quase sempre imitam um baú de suprimentos para atrair sobreviventes desatentos.\n\nOs mimetizadores de Laztro têm a carapaça coberta de cristal e preferem roubar a lutar. Quando descobertos, tentam fugir, e seus golpes empurram quem estiver no caminho.

actors.mobs.crystalspire.name=pináculo de Laztro
actors.mobs.crystalspire.warning=O Laztro vibra quando você o atinge. Continuar com isso vai chamar atenção...
actors.mobs.crystalspire.alert=A vibração cresce e ecoa por toda a caverna!
actors.mobs.crystalspire.rankings_desc=Perfurado pelo pináculo de Laztro
actors.mobs.crystalspire.desc=Um pináculo enorme de Laztro bruto, provavelmente a origem de todas as criaturas cristalinas desta caverna. Suas armas comuns não fazem efeito, então você vai precisar da picareta para quebrá-lo.\n\n_Prepare-se antes de começar._ Um cristal desse tamanho leva tempo para ser extraído, e você dificilmente vai conseguir sem ser incomodado. O próprio pináculo pode ter como se defender. _Talvez os ataques dele possam ser usados contra as outras criaturas._
actors.mobs.crystalspire.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.crystalwisp.name=estilhaço de Laztro
actors.mobs.crystalwisp.beam_kill=O feixe de luz matou você...
actors.mobs.crystalwisp.desc=Um pedaço pequeno de Laztro que flutua e brilha forte. Não é especialmente forte, mas dispara um feixe de luz em você sempre que tiver linha de tiro.\n\nOs estilhaços passam com facilidade entre as formações de cristal, mas não conseguem atirar através delas.
actors.mobs.crystalwisp.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.demonspawner.name=chocadeira
actors.mobs.demonspawner.on_death=O zumbido da câmara diminui com a morte da chocadeira.
actors.mobs.demonspawner.desc=Uma massa de carne e resina presa ao chão, cheia de ovos que eclodem estripadores. O enxame aproveita os corpos de quem morre aqui para alimentá-la.\n\nA chocadeira não se move nem se defende, mas é grande e demora a morrer. Quando se sente ameaçada, choca estripadores mais rápido.\n\n_As chocadeiras parecem ligadas à rainha. Matá-las deve enfraquecê-la._

actors.mobs.dm100.name=drone de segurança
actors.mobs.dm100.zap_kill=A descarga elétrica matou você...
actors.mobs.dm100.desc=Um drone de segurança da Vigília-7. A queda corrompeu o sistema de identificação e agora ele trata qualquer tripulante como invasor.\n\nDispara descargas elétricas de longe e é difícil de pegar em campo aberto.

actors.mobs.dm200.name=drone minerador
actors.mobs.dm200.vent=O drone minerador solta um jato de gás tóxico!
actors.mobs.dm200.desc=Um drone pesado que a Garra Turva trouxe para abrir túneis atrás de Laztro. O enxame tomou os circuitos, e agora ele ataca com os braços hidráulicos de perfuração.\n\nO drone é largo demais para passar por portas e corredores estreitos. Para compensar, ele solta o gás tóxico do escapamento em quem estiver fora do alcance.

actors.mobs.dm201.name=drone minerador corroído
actors.mobs.dm201.vent=O drone corroído lança uma granada corrosiva!
actors.mobs.dm201.desc=Um drone minerador que o enxame cobriu de resina e prendeu ao chão como sentinela. Ele não se move, mas aguenta e bate muito mais que os outros.\n\nSem o escapamento, o enxame aproveitou as cargas de demolição do drone. Ele só lança essas granadas corrosivas quando é atacado à distância.

actors.mobs.dm300.name=Perfuratriz da Garra Turva
actors.mobs.dm300.notice=INTRUSO NA ÁREA DE LAVRA!
actors.mobs.dm300.shield=A perfuratriz puxa energia dos cabos expostos e se cobre com um escudo!
actors.mobs.dm300.charging=DANO NO CHASSI! ATIVANDO TORRE DE ENERGIA!
actors.mobs.dm300.charging_hint=A perfuratriz é invulnerável enquanto uma torre a energiza!
actors.mobs.dm300.supercharged=DESTRUIR! DESTRUIR! DESTRUIR!
actors.mobs.dm300.charge_lost=TORRE PERDIDA! VOLTANDO À ENERGIA LOCAL!
actors.mobs.dm300.pylons_destroyed=ALERTA! REDE ELÉTRICA INSTÁVEL!
actors.mobs.dm300.rankings_desc=Esmagado pela perfuratriz da Garra Turva
actors.mobs.dm300.def_verb=bloqueou
actors.mobs.dm300.defeated=DANO CRÍTICO! INICIANDO DESLIGAM-
actors.mobs.dm300.desc=A máquina de lavra que a Garra Turva desceu às cavernas para arrancar Laztro da rocha. Quando o enxame tomou a nave pirata, tomou também a perfuratriz, e ela passou a guardar a passagem para a colmeia.\n\nEla solta gás tóxico pelo escapamento e usa a broca tanto para atacar quanto para abrir caminho no chão. Também consegue se ligar à rede de energia montada pelos piratas e ficar ainda mais forte.
actors.mobs.dm300.desc_supercharged=A perfuratriz está carregada de energia. Assim ela não sofre dano e se move com o dobro da velocidade! A broca também gira rápido o bastante para _atravessar rocha sólida,_ embora fique bem mais lenta quando faz isso.\n\nAtacar a perfuratriz agora não adianta, mas _alguma coisa por perto está fornecendo essa energia._ Destruir a fonte deve enfraquecê-la.

actors.mobs.dwarfking.name=Comodoro Elias Varga
actors.mobs.dwarfking.notice=Mais um da classe Vigília. Você não sabe o que está atrapalhando!
actors.mobs.dwarfking.lifelink_1=Sua vida pertence à colmeia, tripulante!
actors.mobs.dwarfking.lifelink_2=Sangre pelo seu comandante!
actors.mobs.dwarfking.teleport_1=Segurem o intruso, tripulação!
actors.mobs.dwarfking.teleport_2=Mantenham o fuzileiro ocupado!
actors.mobs.dwarfking.wave_1=Chega! De pé, tripulação!
actors.mobs.dwarfking.wave_2=Mais! Sangrem pelo seu comodoro!
actors.mobs.dwarfking.wave_3=Inúteis! MATEM O FUZILEIRO! AGORA!!
actors.mobs.dwarfking.enraged=Você não pode me matar, %s. A RAINHA. NÃO. PERMITE!
actors.mobs.dwarfking.losing=Não! Você não pode... não sabe o que espera lá embaixo...
actors.mobs.dwarfking.defeated=Você condenou... a próxima nave...
actors.mobs.dwarfking.rankings_desc=Caiu diante do Comodoro Varga
actors.mobs.dwarfking.desc=O Comodoro Elias Varga comandava a Vigília-3, nave da mesma classe da Vigília-7, que caiu neste planeta anos atrás seguindo a mesma rota. Ele não morreu na queda. Desceu até a colmeia, ofereceu a própria tripulação à rainha e em troca recebeu o comando da colmeia exterior.\n\nO comodoro é agressivo e tenta cercar e sufocar os inimigos com a tripulação assimilada que obedece a ele.
actors.mobs.dwarfking$dkghoul.rankings_desc=Caiu diante do Comodoro Varga
actors.mobs.dwarfking$dkmonk.rankings_desc=Caiu diante do Comodoro Varga
actors.mobs.dwarfking$dkwarlock.rankings_desc=Caiu diante do Comodoro Varga
actors.mobs.dwarfking$dkgolem.rankings_desc=Caiu diante do Comodoro Varga

actors.mobs.ebonymimic.name=mimetizador sombrio
actors.mobs.ebonymimic.reveal=Era um mimetizador ali!
actors.mobs.ebonymimic.hidden_name=traços suspeitos
actors.mobs.ebonymimic.hidden_desc=Parece haver algo aqui, mas é quase totalmente transparente.
actors.mobs.ebonymimic.desc=Os mimetizadores são criaturas do planeta que copiam o formato de qualquer objeto. Entre os destroços, quase sempre imitam um baú de suprimentos para atrair sobreviventes desatentos.\n\nOs mimetizadores sombrios conseguem ficar quase invisíveis. Eles se escondem em coisas que um soldado provavelmente vai usar e também carregam itens próprios. Depois de descobertos, não aguentam mais que um mimetizador comum, mas a mordida de surpresa é devastadora.
actors.mobs.ebonymimic.discover_hint=Você pode encontrar este inimigo com um acessório específico.

actors.mobs.elemental$fireelemental.name=esporo ígneo
actors.mobs.elemental$fireelemental.desc=Os esporos são bolsas vivas que flutuam pela colmeia, cheias da química que o enxame produz. Eles quase não pensam e cada um carrega um tipo de carga.\n\nO esporo ígneo é o mais comum. Ele incendeia o alvo no corpo a corpo e às vezes cospe bolas de fogo.
actors.mobs.elemental$newbornfireelemental.name=esporo ígneo imaturo
actors.mobs.elemental$newbornfireelemental.charging=O esporo está inchando!
actors.mobs.elemental$newbornfireelemental.desc=Os esporos são bolsas vivas que flutuam pela colmeia, cheias da química que o enxame produz. Eles quase não pensam e cada um carrega um tipo de carga.\n\nEste esporo ígneo acabou de se formar, mas já é perigoso!
actors.mobs.elemental$newbornfireelemental.rankings_desc=Carbonizado por um esporo ígneo imaturo
actors.mobs.elemental$newbornfireelemental.desc_boss=Por ser tão novo, este esporo só consegue espalhar fogo em rajadas imprecisas, e precisa inchar por um turno antes de cada uma.
actors.mobs.elemental$newbornfireelemental.desc_ally=Este esporo foi criado por você e controla um pouco melhor as chamas. Não ataca à distância, mas incendeia os inimigos no corpo a corpo.
actors.mobs.elemental$newbornfireelemental.discover_hint=Você pode encontrar este inimigo durante uma missão específica.
actors.mobs.elemental$frostelemental.name=esporo criogênico
actors.mobs.elemental$frostelemental.desc=Os esporos são bolsas vivas que flutuam pela colmeia, cheias da química que o enxame produz. Eles quase não pensam e cada um carrega um tipo de carga.\n\nO esporo criogênico solta um fluido gelado que deixa o alvo lento, no corpo a corpo e de vez em quando à distância. O efeito é muito mais forte na água.
actors.mobs.elemental$shockelemental.name=esporo elétrico
actors.mobs.elemental$shockelemental.desc=Os esporos são bolsas vivas que flutuam pela colmeia, cheias da química que o enxame produz. Eles quase não pensam e cada um carrega um tipo de carga.\n\nO esporo elétrico é mais raro. No corpo a corpo, arcos de eletricidade atingem quem estiver perto e causam dano extra se o alvo estiver na água. Às vezes ele também dispara um clarão que cega por alguns turnos.
actors.mobs.elemental$chaoselemental.name=esporo instável
actors.mobs.elemental$chaoselemental.desc=Os esporos são bolsas vivas que flutuam pela colmeia, cheias da química que o enxame produz. Eles quase não pensam e cada um carrega um tipo de carga.\n\nO esporo instável é raro e perigoso. A química dele nunca se firmou numa carga só, e cada ataque tem um efeito imprevisível.

actors.mobs.eye.name=ocelo
actors.mobs.eye.deathgaze_kill=O raio do ocelo matou você...
actors.mobs.eye.desc=Os ocelos são olhos simples do tamanho de uma pessoa, que flutuam presos a uma bolsa de gás. A rainha vê através deles. No corpo a corpo eles lutam pouco.\n\nDepois de carregar por um instante, o ocelo dispara um raio devastador. Tudo o que estiver na linha de visão dele recebe um dano enorme. _Procure cobertura assim que o ver brilhar._

actors.mobs.fetidrat.name=rastejador pútrido
actors.mobs.fetidrat.rankings_desc=Dissolvido pelo Rato Fétido
actors.mobs.fetidrat.desc=Algo está muito errado com este rastejador. A carapaça escura vaza um líquido oleoso e a carne por baixo apodrece. Os olhos verde-claros parecem ainda mais ameaçadores.\n\nEle solta uma névoa tóxica e a mordida dele corrói armadura.
actors.mobs.fetidrat.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.fungalcore.name=núcleo de esporos
actors.mobs.fungalcore.desc=Esta massa gigante de esporos deve ser a origem de toda a infestação desta caverna.

actors.mobs.fungalsentry.name=torre de esporos
actors.mobs.fungalsentry.desc=Esta torre alta de esporos defende a rede de micélio que cobre a caverna.\n\nEla não se mexe, mas dispara jatos precisos de veneno em qualquer coisa que entre na linha de visão. O impacto é fraco, mas _o veneno se acumula em doses mortais muito rápido._ Dá para destruí-la, mas talvez seja melhor evitá-la.

actors.mobs.fungalspinner.name=tecelã infestada
actors.mobs.fungalspinner.desc=Esta tecelã parece controlada por um fungo parasita. O fungo também mudou as habilidades dela e trocou as teias e o veneno por crescimento de fungos.\n\nA tecelã infestada cospe fungos em vez de teias, espalha vegetação e pode prender você no lugar. Ela não envenena, mas ganha muita resistência a dano quando está ao lado de vegetação alta.

actors.mobs.ghoul.name=operário da colmeia
actors.mobs.ghoul.desc=Os operários constroem e consertam a colmeia com resina e com o metal das naves que o enxame derrubou. Sozinhos são fracos, mas andam sempre em grupo.\n\n_Quando um operário cai, ele se levanta de novo depois de alguns turnos, desde que outro operário esteja por perto._

actors.mobs.gnoll.name=assimilado
actors.mobs.gnoll.desc=Já foi tripulante da Vigília-7. O enxame tomou o corpo e deixou o uniforme. Ainda anda como gente e ainda segura o que achou no chão, mas não responde ao nome.

actors.mobs.gnollexile.name=assimilado desgarrado
actors.mobs.gnollexile.desc=Este assimilado tem a carapaça rachada na altura da nuca, onde o enxame se prende. Ele ainda segue o enxame, mas de longe, e parece pensar por conta própria. Sobreviver assim exige força e esperteza, e ele sabe usar a lança que carrega.
actors.mobs.gnollexile.desc_passive=_O assimilado desgarrado não está vindo atacar._ Ele não parece agressivo como os outros e provavelmente acha que lutar com você não vale a pena. Você pode deixá-lo passar, mas ele carrega uma mochila que pode ter itens úteis...
actors.mobs.gnollexile.desc_aggro=_O assimilado desgarrado olha em volta com raiva._ Algo o fez decidir lutar. Cuidado com a lança!
actors.mobs.gnollexile.seen_passive=O assimilado com a lança observa você com cautela, mas não ataca.
actors.mobs.gnollexile.seen_aggro=O assimilado com a lança parte para o ataque!

actors.mobs.gnollgeomancer.name=assimilado sísmico
actors.mobs.gnollgeomancer.warning=O assimilado sísmico começa a se mexer. Esteja pronto antes de continuar!
actors.mobs.gnollgeomancer.alert=O assimilado sísmico desperta! A caverna inteira treme enquanto ele salta para longe!
actors.mobs.gnollgeomancer.rock_kill=A rocha arremessada matou você...
actors.mobs.gnollgeomancer.rockfall_kill=O desmoronamento matou você...
actors.mobs.gnollgeomancer.rankings_desc=Soterrado pelo assimilado sísmico
actors.mobs.gnollgeomancer.desc=Um assimilado alto, com dois nódulos psiônicos na nuca. É ele quem move a rocha e coordena todos os assimilados da lavra. Ao contrário dos sapadores, ele domina o que faz e não é ferido pelas pedras que lança ou derruba. Por outro lado, não tem como lutar corpo a corpo.
actors.mobs.gnollgeomancer.desc_armor=O assimilado sísmico está coberto por uma camada de rocha. _Você precisa chegar perto e quebrá-la com a picareta antes de causar dano a ele._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Um assimilado sapador por perto está usando um dispositivo que reforça a armadura de rocha do assimilado sísmico. Agora você não consegue causar dano nenhum!_
actors.mobs.gnollgeomancer.desc_sleeping=Um assimilado alto, envolto em rocha como uma estátua. De perto, dá para ver a pedra subir e descer com a respiração dele. Assim ele não sofre dano.\n\nA picareta deve quebrar essa rocha, mas _esteja pronto para lutar quando fizer isso._ É ele quem move a terra e coordena os assimilados da lavra. _Derrotar os outros assimilados da mina antes pode ser uma boa ideia._
actors.mobs.gnollgeomancer.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.gnollguard.name=assimilado capataz
actors.mobs.gnollguard.def_verb=bloqueou
actors.mobs.gnollguard.spear_warn=O capataz recua e dá uma estocada forte com a lança!
actors.mobs.gnollguard.desc=Um assimilado grande, com escudo e uma lança improvisada de trilho de mina. O enxame o colocou para proteger os que trabalham na lavra de Laztro.\n\nEle maneja a lança com uma mão só, mas sem muita técnica. _Precisa de espaço aberto para atacar de longe e causa bem menos dano se você ficar colado nele._
actors.mobs.gnollguard.desc_armor=_Um assimilado sapador por perto está usando um dispositivo que cobre este capataz com uma armadura de rocha, reduzindo muito o dano que ele sofre._
actors.mobs.gnollguard.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.gnollsapper.name=assimilado sapador
actors.mobs.gnollsapper.desc=Um assimilado pequeno e fraco, com uma bolsa cheia de cargas e ferramentas da Garra Turva. Ele está aqui para achar e extrair Laztro bruto, e tem capatazes por perto para protegê-lo. Os ataques dele quase não machucam.\n\nEm vez de lutar, o sapador usa os dispositivos para fazer a rocha atacar por ele. Ele não controla bem o que faz, então _deve haver jeitos de virar esses ataques contra ele mesmo ou contra os capatazes._
actors.mobs.gnollsapper.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.gnolltrickster.name=assimilado sabotador
actors.mobs.gnolltrickster.rankings_desc=Enganado pelo assimilado sabotador
actors.mobs.gnolltrickster.desc=Um tripulante assimilado que manteve um pedaço da antiga esperteza. Ele anda curvado, com um sorriso torto, abraçado a uma bolsa de dardos como se fosse um bebê. Os olhos arregalados não piscam.
actors.mobs.gnolltrickster.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.goldenmimic.name=mimetizador dourado
actors.mobs.goldenmimic.desc=Os mimetizadores são criaturas do planeta que copiam o formato de qualquer objeto. Entre os destroços, quase sempre imitam um baú de suprimentos para atrair sobreviventes desatentos.\n\nOs mimetizadores dourados são mais resistentes e tentam atrair os soldados mais fortes. Guardam itens melhores, mas também são bem mais fortes que os comuns.

actors.mobs.golem.name=colosso de carapaça
actors.mobs.golem.def_verb=bloqueou
actors.mobs.golem.desc=Uma casta enorme, criada para segurar as passagens da colmeia. A carapaça grossa aguenta quase tudo, mas é grande demais para os corredores estreitos.\n\nPara compensar, o colosso dobra o espaço com um órgão que o enxame ainda não deixou ninguém estudar. Ele salta entre as salas e puxa para perto os inimigos que estão fora de alcance.

actors.mobs.goo.name=Matriz do Enxame
actors.mobs.goo.notice=KRRRRSSSH!
actors.mobs.goo.defeated=krrsh... krrsh...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=A Matriz está inchando!
actors.mobs.goo.enraged=furiosa
actors.mobs.goo.gluuurp=KRRRRAAASSSH!
actors.mobs.goo.rankings_desc=Dissolvido pela Matriz do Enxame
actors.mobs.goo.desc=A Matriz é o primeiro ninho que o enxame montou dentro da Vigília-7: uma massa de tecido vivo que cresceu entre os tanques de resfriamento do reator. Os rastejadores nascem dela.\n\nEla incha antes de atacar e, quando descarrega, a pancada derruba qualquer um. Se você ver a Matriz inchando, saia de perto. A água do reator ajuda o tecido dela a se regenerar.

actors.mobs.greatcrab.name=escavador gigante
actors.mobs.greatcrab.noticed=O caranguejo bloqueia com sua enorme garra.
actors.mobs.greatcrab.def_verb=bloqueou
actors.mobs.greatcrab.rankings_desc=Partido pelo Grande Carangueijo
actors.mobs.greatcrab.desc=Este escavador é enorme, mesmo comparado aos outros. A carapaça azul está cheia de rachaduras e incrustações, sinal de muitos anos debaixo da terra. Ele se move devagar, quase perdendo o equilíbrio com a garra gigante.
actors.mobs.greatcrab.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.guard.name=pirata arpoador
actors.mobs.guard.scorpion=Vem cá!
actors.mobs.guard.def_verb=bloqueou
actors.mobs.guard.desc=Um pirata da Garra Turva armado com um arpão de abordagem. Ele prende quem estiver longe e puxa para perto antes de bater. A armadura de assaltos improvisadas aguenta bastante.

actors.mobs.hermitcrab.name=escavador encouraçado
actors.mobs.hermitcrab.def_verb=bloqueou
actors.mobs.hermitcrab.desc=Este escavador encaixou nas costas um pedaço curvado da blindagem do casco. O peso extra o deixou mais lento, mas a defesa ficou muito maior. Você tem a impressão de ouvir alguma coisa chacoalhando embaixo da placa...

actors.mobs.mimic.name=mimetizador
actors.mobs.mimic.reveal=Esse baú é um mimetizador!
actors.mobs.mimic.hidden_hint=Algo nesse baú parece estar errado... Aproximar-se e tentar abri-lo pode ser uma má ideia.
actors.mobs.mimic.desc=Os mimetizadores são criaturas do planeta que copiam o formato de qualquer objeto. Entre os destroços, quase sempre imitam um baú de suprimentos para atrair sobreviventes desatentos.\n\nOs mimetizadores têm uma mordida feia, mas costumam guardar mais itens que um baú comum.
actors.mobs.mimic.discover_hint=Você pode encontrar este inimigo em qualquer setor.

actors.mobs.necromancer.name=incubadora
actors.mobs.necromancer.desc=Uma forma do enxame que carrega uma bolsa de ovos nas costas. Ela não luta de perto: reanima as cascas mortas ao redor e as manda na frente.\n\nMatar a incubadora derruba as cascas que ela controla.
actors.mobs.necromancer$necroskeleton.name=casca reanimada
actors.mobs.necromancer$necroskeleton.desc=Esta casca foi reanimada por uma incubadora. Ela age como uma casca comum e cai junto com a incubadora que a controla.

actors.mobs.mob.died=Você ouve algo morrer a distância.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Morto por: %s
actors.mobs.mob.discover_hint=Você pode encontrar este inimigo em uma região específica do planeta.

actors.mobs.monk.name=mantídeo
actors.mobs.monk.def_verb=bloqueou
actors.mobs.monk.parried=bloqueou
actors.mobs.monk.desc=Uma casta de guerreiros com braços em forma de foice. Os mantídeos observam o jeito de lutar de cada presa e aprendem a antecipar os golpes.\n\nEles só lutam corpo a corpo. Quando estão focados, aparam o próximo ataque físico, mesmo que fosse acertar com certeza. O foco aumenta mais rápido quando o mantídeo se move e mais devagar quando está lutando.
actors.mobs.monk$focus.name=focado
actors.mobs.monk$focus.desc=Este mantídeo está totalmente concentrado no alvo e parece prever cada movimento.\n\nEnquanto estiver focado, o próximo ataque físico contra ele erra, aconteça o que acontecer. Aparar esse ataque gasta o foco, e ele precisa acumular de novo. O foco aumenta mais rápido quando ele se move.

actors.mobs.phantompiranha.name=lampreia translúcida
actors.mobs.phantompiranha.teleport_away=A lampreia translúcida se teletransporta...
actors.mobs.phantompiranha.desc=As lampreias translúcidas são uma variação rara, de corpo quase transparente. Elas se teletransportam quando são atacadas, para fugir ou para chegar de repente perto do alvo!\n\nSão chatas de enfrentar, mas a carne delas é valorizada pelas propriedades estranhas.

actors.mobs.piranha.name=lampreia do enxame
actors.mobs.piranha.desc=O enxame cria estas lampreias para guardar as áreas alagadas. A mordida é mortal, então é melhor não enfrentá-las de frente.
actors.mobs.piranha.discover_hint=Você pode encontrar este inimigo em qualquer setor.

actors.mobs.pylon.name=torre de energia
actors.mobs.pylon.desc_inactive=Uma torre que os piratas montaram para distribuir energia às máquinas de lavra.\n\nA torre está desligada e imune a dano.
actors.mobs.pylon.desc_active=Uma torre que os piratas montaram para distribuir energia às máquinas de lavra. Agora ela está cheia de carga, e é isso que está sobrecarregando a perfuratriz!\n\nNesse estado a torre pode ser danificada, mas lança eletricidade nas casas vizinhas, girando em sentido horário. A estrutura de metal pesado a torna muito resistente.

actors.mobs.rat.name=rastejador
actors.mobs.rat.desc=A forma mais comum do Enxame Vórtice. Um bicho do tamanho de um cachorro, com seis patas e mandíbulas que cortam placa de casco. Sozinho é fraco. O problema é que quase nunca vem sozinho.

actors.mobs.ripperdemon.name=estripador
actors.mobs.ripperdemon.leap=O estripador se prepara para saltar!
actors.mobs.ripperdemon.desc=Uma casta magra feita para caçar, com pernas traseiras de saltador e garras longas como lâminas. Nasce já pronta para lutar nas chocadeiras da câmara.\n\nO estripador não aguenta muito dano, mas é rápido e perigoso. Ele salta grandes distâncias para chegar ao alvo e atacar com as garras.

actors.mobs.rotheart.name=coração pútrido
actors.mobs.rotheart.desc=O fruto de Putrifruta é peculiar. Ao invés de apodrecer e fornecer nutrientes, o fruto cresce, endurece e engloba a semente. Ele fornece proteção para os órgãos internos que crescem no interior do fruto. Esta esfera gigante é conhecida como o coração de uma planta putrifruta adulta.
actors.mobs.rotheart.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.rotlasher.name=chicoteadora pútrida
actors.mobs.rotlasher.rankings_desc=Açoitado por uma chicoteadora pútrida
actors.mobs.rotlasher.desc=A chicoteadora pútrida é uma parte da estrutura da raiz de uma planta madura de putrifruta, e também seu principal meio de defesa. Chicoteadoras são cegas e estão presas ao chão, mas atacam violentamente qualquer ameaça que se aproxime delas após terem um momento para detecta-lá. Quando não há inimigos próximos, elas ficam imóveis, tentando se mesclar com a vegetação em volta.
actors.mobs.rotlasher.discover_hint=Você pode encontrar este inimigo durante uma missão específica.

actors.mobs.scorpio.name=lança-ferrões
actors.mobs.scorpio.desc=Uma casta grande com uma cauda segmentada que dispara ferrões serrilhados. Ela evita o corpo a corpo e prefere aleijar a presa de longe.

actors.mobs.senior.name=mantídeo veterano
actors.mobs.senior.desc=Um mantídeo mais velho, com a carapaça marcada de cicatrizes. Ele já aprendeu com muitas lutas e ganha foco andando muito mais rápido que os outros.\n\nQuando está focado, apara o próximo ataque físico, mesmo que fosse acertar com certeza. O foco aumenta mais rápido quando ele se move e mais devagar quando está lutando.

actors.mobs.shaman.name=assimilado psiônico
actors.mobs.shaman.bolt_kill=A descarga psiônica matou você...
actors.mobs.shaman.desc=O enxame abriu o crânio deste tripulante e plantou um nódulo que brilha por baixo da pele. Ele é fraco no corpo a corpo, mas dispara descargas psiônicas à distância.
actors.mobs.shaman$redshaman.spell_desc=O nódulo deste brilha em vermelho, e a descarga dele _enfraquece temporariamente o seu ataque._
actors.mobs.shaman$blueshaman.spell_desc=O nódulo deste brilha em azul, e a descarga dele _aumenta temporariamente o dano que você recebe._
actors.mobs.shaman$purpleshaman.spell_desc=O nódulo deste brilha em roxo, e a descarga dele _reduz temporariamente a sua precisão e evasão._

actors.mobs.armoredbrute.name=assimilado blindado
actors.mobs.armoredbrute.desc=Um brutamontes que ainda veste a armadura de combate de quando era soldado, agora fundida à carapaça. Ele resiste muito mais ao dano físico e aguenta a fúria por bem mais tempo antes de cair.

actors.mobs.skeleton.name=casca
actors.mobs.skeleton.explo_kill=Você foi morto pelos estilhaços de uma casca...
actors.mobs.skeleton.def_verb=bloqueou
actors.mobs.skeleton.desc=O que sobra de um assimilado depois que o enxame termina de usar o corpo: uma carapaça dura, oca e ainda em movimento.\n\nQuando a casca cai, ela estoura e lança estilhaços em quem estiver ao lado.

actors.mobs.slime.name=gosma do enxame
actors.mobs.slime.def_verb=bloqueou
actors.mobs.slime.desc=Um bolo de tecido vivo que o enxame deixa nos lugares onde se instala. É borrachudo por fora e líquido por dentro. Golpes muito fortes perdem força ao atravessar a gosma.

actors.mobs.snake.name=emboscador
actors.mobs.snake.hint=Tente usar o botão examinar em um emboscador para aprender como combatê-lo.
actors.mobs.snake.desc=Um predador comprido e liso que espera nos dutos. Ele se desvia dos golpes com uma rapidez absurda, então é difícil de acertar. Se chegar sem ser visto, o primeiro golpe dele causa dano dobrado. Ataques surpresa e ataques que nunca erram conseguem pegá-lo.

actors.mobs.spectralnecromancer.name=incubadora pálida
actors.mobs.spectralnecromancer.desc=Uma incubadora mais antiga, quase transparente. Em vez de reanimar cascas, ela solta larvas voadoras que atravessam qualquer cobertura.

actors.mobs.spinner.name=tecelã
actors.mobs.spinner.desc=Uma casta do enxame que evita a luta direta. Ela atira teia a grande distância para fechar o caminho da presa e espera de longe o veneno da picada fazer efeito.

actors.mobs.statue.name=autômato de guarda
actors.mobs.statue.def_verb=bloqueou
actors.mobs.statue.desc=Parece só mais um robô de segurança desligado da nave, mas os olhos vermelhos acesos o denunciam.
actors.mobs.statue.desc_weapon=O chassi é de liga barata, mas a arma _%s_ que ele empunha parece de verdade.
actors.mobs.statue.discover_hint=Você pode encontrar este inimigo em qualquer setor.

actors.mobs.succubus.name=feromante
actors.mobs.succubus.desc=Uma casta esguia que solta uma névoa de feromônios ao atacar. Quem respira a névoa fica fascinado por um tempo e não consegue atacá-la.\n\nQuando a feromante ataca alguém fascinado, ela suga parte da vida da vítima.

actors.mobs.swarm.name=nuvem de larvas
actors.mobs.swarm.desc=Uma nuvem zumbindo de larvas voadoras do enxame. Cada ataque físico a divide em duas nuvens menores, tão perigosas quanto a primeira.

actors.mobs.tengu.name=Capitã Rasha Kell
actors.mobs.tengu.notice_gotcha=Te achei, %s!
actors.mobs.tengu.interesting=Vamos deixar isso mais interessante...
actors.mobs.tengu.notice_have=Agora você não escapa, %s!
actors.mobs.tengu.defeated=O Laztro... era meu...
actors.mobs.tengu.rankings_desc=Abatido pela Capitã Rasha Kell
actors.mobs.tengu.desc=A capitã da Garra Turva, o cargueiro pirata que pousou atrás dos destroços da Vigília-7. O enxame tomou os motores da nave dela, e agora ela quer sair do planeta levando todo o Laztro que puder.\n\nÉ rápida, se teleporta com um transportador pessoal e luta com facas de arremesso, bombas de fumaça e armadilhas improvisadas.

actors.mobs.tengu$bombability$bombblob.desc=Uma nuvem de fumaça superaquecida está pairando aqui. Cuidado, vai explodir!
actors.mobs.tengu$bombability$bombitem.name=bomba de fumaça
actors.mobs.tengu$bombability$bombitem.cant_pickup=Está preso ao chão, você não pode mover!
actors.mobs.tengu$bombability$bombitem.desc=A capitã jogou aqui uma bomba de fumaça que solta um vapor quente e espesso. Vai explodir em breve!

actors.mobs.tengu$fireability$fireblob.desc=A capitã espalhou um pó inflamável aqui, que já está começando a pegar fogo!

actors.mobs.tengu$shockerability$shockerblob.desc=A energia elétrica está se acumulando aqui, qualquer coisa que esteja sobre este quadrado será eletrocutado no próximo turno!
actors.mobs.tengu$shockerability$shockeritem.name=descarregador
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Está liberando muita eletricidade, você não consegue pegar!
actors.mobs.tengu$shockerability$shockeritem.desc=A capitã jogou aqui uma máquina montada com peças de drones de segurança. Ela solta descargas elétricas nas casas ao redor.

actors.mobs.thief.name=pirata catador
actors.mobs.thief.stole=O pirata pegou %s de você!
actors.mobs.thief.carries=\n\nO pirata está carregando o item _%s._ Roubado, obviamente.
actors.mobs.thief.escapes=O pirata fugiu com seu item %s!
actors.mobs.thief.desc=Um tripulante da Garra Turva. Os piratas vieram atrás dos destroços da Vigília-7 e catam tudo que tenha valor, inclusive o que você carrega. Não negociam. Pegam e correm.

actors.mobs.tormentedspirit.name=holograma de tripulante
actors.mobs.tormentedspirit.desc=Os hologramas de tripulante guardam a memória de alguém que serviu bem, mas um vírus tomou conta da projeção. Enquanto estiver infectado, ele ataca como um holograma corrompido e fica ainda mais forte!\n\nTalvez dê para limpar o vírus usando o item certo ao lado da projeção. Se der certo, o tripulante com certeza vai agradecer...
actors.mobs.tormentedspirit.thank_you=Obrigado...

actors.mobs.npcs.vaultlaser.name=Sentinela desintegradora
actors.mobs.npcs.vaultlaser.ondeath=Você foi morto pelo raio de desintegração...
actors.mobs.npcs.vaultlaser.desc=Estas sentinelas disparam raios desintegradores em intervalos regulares ou quase aleatórios. Os raios são muito perigosos, mas pelo menos sempre caem no mesmo lugar. Nada resiste a eles, então _você precisa evitá-los de alguma forma_.

actors.mobs.npcs.vaultsentry.name=Sentinela de monitoramento
actors.mobs.npcs.vaultsentry.ondeath=O relâmpago matou você...
actors.mobs.npcs.vaultsentry.desc=Estas sentinelas vasculham a área seguindo um padrão predefinido. Elas parecem bastante perigosas. Você certamente será atingido se for detectado pela varredura. Muitas vezes é possível evitar o padrão de movimento, mas as sentinelas também precisam ver você para lhe detectar, portanto, _qualquer coisa que obstrua a visão é eficaz contra elas_.

actors.mobs.npcs.vaulttokendoor.name=Porta do cofre
actors.mobs.npcs.vaulttokendoor.def_verb=bloqueou
actors.mobs.npcs.vaulttokendoor.desc=Esta porta não está trancada por fechadura, mas não cede. Há um leitor no centro, com dez encaixes do tamanho de um chip de acesso.
actors.mobs.npcs.vaulttokendoor.no_tokens=_Talvez algo que você encontre no cofre encaixe aqui?_
actors.mobs.npcs.vaulttokendoor.too_few_tokens=_Seus chips de acesso encaixam perfeitamente no leitor_, mas você ainda não tem o suficiente.
actors.mobs.npcs.vaulttokendoor.enough_tokens=_Você tem chips de acesso suficientes para todos os encaixes_. Quer colocá-los na porta?
actors.mobs.npcs.vaulttokendoor.open=Abrir a Porta
actors.mobs.npcs.vaulttokendoor.not_yet=Ainda não
actors.mobs.npcs.vaulttokendoor.unlocked=O leitor aceita os chips e você ouve as travas da porta se soltarem.

actors.mobs.npcs.vaultmirror.name=Projetor holográfico
actors.mobs.npcs.vaultmirror.def_verb=bloqueou
actors.mobs.npcs.vaultmirror.desc=Um projetor grande, cercado de luzes de estado acesas. Ele zumbe baixo, mas não projeta nada por enquanto.
actors.mobs.npcs.vaultmirror.approach=À sua frente está um projetor holográfico grande, de moldura grossa de metal. O campo de projeção fica escuro até você chegar perto. Quando você se inclina, as luzes da moldura acendem forte e uma cena estranhamente familiar aparece no ar.
actors.mobs.npcs.vaultmirror.scene_warrior=Você vê o seu _gerador de escudo_ amassado, meio enterrado na cinza do planeta. A cena parece uma lembrança, mas os detalhes estão errados. Você nunca conseguiu se livrar do gerador, guardar o aparelho quebrado parecia parte do castigo. Você também passou muito tempo olhando para ele, e a rachadura está num ângulo um pouco diferente.
actors.mobs.npcs.vaultmirror.scene_mage=Você vê seu _transmissor orbital_ no suporte da sala de comunicações da Vigília-7. A cena parece uma lembrança, mas os detalhes estão errados. O painel mostra todos os satélites da Brigada respondendo, coisa que você não vê desde a queda. A cadeira do operador de turno também está ocupada, e ele morreu no impacto.
actors.mobs.npcs.vaultmirror.scene_rogue=Você vê o _módulo de camuflagem ativa_ pendurado no armário da sua equipe, na Vigília-7. A cena parece uma lembrança, mas os detalhes estão errados. Os armários ao lado estão cheios, com o nome de cada colega na porta. Você esvaziou quase todos eles com as próprias mãos depois da última missão.
actors.mobs.npcs.vaultmirror.scene_huntress=Você vê seu _canhão de pulso_ preso ao braço do exoesqueleto, no hangar da Vigília-7. A cena parece uma lembrança, mas os detalhes estão errados. O traje está inteiro, sem uma marca de combate, e o mecânico-chefe confere os encaixes do braço com calma. Você nunca viu o hangar tão silencioso.
actors.mobs.npcs.vaultmirror.scene_duelist=Você vê uma figura alta com a farda da Brigada Orbital parada à sua frente: você mesmo, antes do enxame. A cena parece uma lembrança, mas os detalhes estão errados. A pele dele ainda é toda humana, sem nenhuma placa de carapaça. Ele estende a _lâmina simbionte_ para você pegar, como se ela sempre tivesse sido dele.
actors.mobs.npcs.vaultmirror.scene_cleric=Você vê o _núcleo sintético_ encaixado na bancada de manutenção da enfermaria da Vigília-7. A cena parece uma lembrança, mas os detalhes estão errados. Você nunca saiu daquela bancada com o núcleo exposto, só com ele já instalado. A energia que sai dele também parece estranha, como se viesse de outra fonte.
actors.mobs.npcs.vaultmirror.scene_final=O campo de projeção se solidificou por completo. Nada impede você de estender a mão e pegar o item.
actors.mobs.npcs.vaultmirror.take=Pegar o item.
actors.mobs.npcs.vaultmirror.scene_take=Você pega o item, e a cena continua igual, como se ele existisse em dois lugares ao mesmo tempo.\n\nA projeção se apaga, e o objeto na sua mão pulsa devagar no mesmo ritmo das luzes da moldura.\n\nVocê não sabe bem o que aconteceu, mas o item parece ligado ao projetor. Provavelmente não vai conseguir tirá-lo do cofre.
actors.mobs.npcs.vaultmirror.scene_nothing=Você se aproxima do projetor de novo, mas nada acontece. O campo continua escuro.
actors.mobs.npcs.vaultmirror$mirrorsword.name=lâmina simbionte
actors.mobs.npcs.vaultmirror$mirrorsword.desc=Uma lâmina larga de carapaça viva, presa ao antebraço por tendões do enxame. Ela responde aos seus músculos como se fosse parte do braço.

actors.mobs.warlock.name=artilheiro da colmeia
actors.mobs.warlock.bolt_kill=O disparo corrosivo matou você...
actors.mobs.warlock.desc=Uma casta do enxame com uma glândula enorme no abdômen, que fica para trás e dispara bolas de ácido. O ácido corrói o metal e enfraquece por um tempo os aprimoramentos do seu equipamento. Quanto mais aprimorado o item, mais ele sofre.

actors.mobs.wraith.name=holograma corrompido
actors.mobs.wraith.desc=A projeção de um tripulante presa num laço de dados corrompidos, que ataca tudo o que se mexe. Por ser feita de luz, é muito difícil de atingir com uma arma comum.
actors.mobs.wraith.discover_hint=Você pode encontrar este inimigo em qualquer setor.

actors.mobs.yogdzewa.name=Rainha do Enxame
actors.mobs.yogdzewa.notice=EU. VEJO. VOCÊ.
actors.mobs.yogdzewa.darkness=O zumbido fica mais perto...
actors.mobs.yogdzewa.hope=SUA. NAVE. É. MINHA!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Devorado pela Rainha do Enxame
actors.mobs.yogdzewa.desc=A Rainha do Enxame é a mente que comanda o Enxame Vórtice. Todos os insetóides do planeta obedecem a ela, e cada tripulante assimilado é mais um par de olhos e mãos a seu serviço.\n\nEla é grande demais para sair da câmara e nunca se move. Em vez disso, dispara raios de energia pelos ocelos e chama as castas que guardam a câmara para lutar por ela.
actors.mobs.yogdzewa.desc_spawners=Você sente o zumbido dos setores de cima correndo pelas paredes até a rainha. Alguma coisa que você deixou viva lá em cima está alimentando a câmara. _Ela vai usar essa força para chamar castas mais fortes!_
actors.mobs.yogdzewa$larva.name=larva real
actors.mobs.yogdzewa$larva.rankings_desc=Devorado pela Rainha do Enxame
actors.mobs.yogdzewa$larva.desc=Crias recém-nascidas da rainha. Uma sozinha é fraca, mas ela as produz muito rápido, e em grande número elas sufocam qualquer um.
actors.mobs.yogdzewa$yogripper.rankings_desc=Devorado pela Rainha do Enxame
actors.mobs.yogdzewa$yogeye.rankings_desc=Devorado pela Rainha do Enxame
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devorado pela Rainha do Enxame

actors.mobs.yogfist.invuln_warn=A garra é invulnerável enquanto estiver perto da rainha!
actors.mobs.yogfist.rankings_desc=Devorado pela Rainha do Enxame
actors.mobs.yogfist.desc=Esta garra é uma guarda real, criada só para defender a rainha. Enquanto estiver perto dela, não sofre dano nenhum.
actors.mobs.yogfist$burningfist.name=garra ígnea
actors.mobs.yogfist$burningfist.desc=Esta garra queima por dentro. Por onde passa, o chão pega fogo, e ela também dispara rajadas que espalham chamas.\n\nPerto da água ela não consegue espalhar fogo, mas é tão quente que a água em volta evapora depois de pouco tempo!
actors.mobs.yogfist$soiledfist.name=garra terrosa
actors.mobs.yogfist$soiledfist.desc=Esta garra é coberta de esporos. Por onde passa, faz brotar vegetação, e dispara rajadas que prendem o alvo em raízes de crescimento rápido!\n\nEla tira força da vegetação e resiste mais ao dano quanto mais vegetação alta ou pisoteada houver perto dela!
actors.mobs.yogfist$rottingfist.name=garra pútrida
actors.mobs.yogfist$rottingfist.desc=Esta garra é uma massa de carne em decomposição. Espalha muco cáustico em volta e solta gás tóxico quando ataca à distância. Pior ainda, por causa da massa, ela sangra em vez de sofrer o dano de uma vez.\n\nA água lava o muco, mas a garra também absorve água para se curar! Ferir a garra enquanto ela sangra renova o sangramento, mas não o acumula!
actors.mobs.yogfist$rustedfist.name=garra corroída
actors.mobs.yogfist$rustedfist.desc=Esta garra cresceu em volta do casco de uma nave e virou uma massa de metal vivo. Bate forte no corpo a corpo e aleija os alvos à distância. Por causa da massa, ela recebe o dano aos poucos, e não de uma vez.\n\nA garra é rígida e não passa por lugares apertados. Mesmo levando o dano devagar, o dano adiado continua aumentando se ela for atingida várias vezes.
actors.mobs.yogfist$brightfist.name=garra luminosa
actors.mobs.yogfist$brightfist.teleport=A garra some num clarão que cega você!
actors.mobs.yogfist$brightfist.desc=Esta garra é cheia de órgãos bioluminescentes. Ela dispara feixes de luz fortes a cada turno, que causam muito dano e cegam por um tempo. Também consegue encher a área de luz para fugir!\n\nEla não tem nenhuma habilidade especial no corpo a corpo.
actors.mobs.yogfist$darkfist.name=garra sombria
actors.mobs.yogfist$darkfist.teleport=A garra some numa nuvem de tinta que apaga a sua luz!
actors.mobs.yogfist$darkfist.desc=Esta garra solta uma tinta escura que bebe a luz. Ela dispara rajadas a cada turno, que causam muito dano e enfraquecem a sua fonte de luz. Também consegue escurecer a área para fugir!\n\nEla não tem nenhuma habilidade especial no corpo a corpo.


