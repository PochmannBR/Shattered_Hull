actors.hero.talent.tecido_regenerativo.desc=_+1:_ Com o medidor abaixo de 50, você recupera 1 de vida extra a cada _10 turnos_, em média.\n\n_+2:_ Com o medidor abaixo de 50, você recupera 1 de vida extra a cada _5 turnos_, em média.
