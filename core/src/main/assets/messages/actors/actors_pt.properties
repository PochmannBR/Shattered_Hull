actors.hero.talent.vigilia.desc=_+1:_ Dormir baixa o medidor até _35%_ do valor.\n\n_+2:_ Dormir baixa o medidor até _20%_ do valor.\n\n_+3:_ Dormir baixa o medidor _até o piso_.
actors.hero.talent.raio_feromonio.title=raio do feromônio
actors.hero.talent.surto_prolongado.desc=_+1:_ O surto dura _3 turnos a mais_.\n\n_+2:_ O surto dura _6 turnos a mais_.\n\n_+3:_ O surto dura _9 turnos a mais_.
actors.hero.talent.sentido_enxame.desc=_+1:_ Você percebe os inimigos do enxame num raio de _4 quadrados_.\n\n_+2:_ Você percebe os inimigos do enxame num raio de _8 quadrados_.
actors.hero.talent.calma_combate.desc=_+1:_ As primeiras _1_ habilidades de cada setor não sobem o medidor.\n\n_+2:_ As primeiras _2_ habilidades de cada setor não sobem o medidor.\n\n_+3:_ As primeiras _3_ habilidades de cada setor não sobem o medidor.
actors.hero.talent.regeneracao_enxame.title=regeneração do enxame
actors.hero.talent.golpe_purgador.title=golpe purgador
actors.hero.talent.fome_enxame.desc=_+1:_ Comer carne do enxame cura _10% da vida máxima_.\n\n_+2:_ Comer carne do enxame cura _20% da vida máxima_.
actors.hero.talent.forma_duradoura.title=forma duradoura
actors.hero.abilities.duelist.formaenxameability.desc=Por 10 turnos, as habilidades das amostras não sobem o medidor de assimilação. Quando a forma acaba, o medidor sobe 30 de uma vez.
actors.hero.talent.tecido_regenerativo.title=tecido regenerativo
actors.hero.talent.coleta_forcada.desc=_+1:_ Matar um inimigo de fora do enxame com o golpe tem _25% de chance_ de soltar uma amostra qualquer.\n\n_+2:_ Matar um inimigo de fora do enxame com o golpe tem _50% de chance_ de soltar uma amostra qualquer.\n\n_+3:_ Matar um inimigo de fora do enxame com o golpe tem _75% de chance_ de soltar uma amostra qualquer.\n\n_+4:_ Matar um inimigo de fora do enxame com o golpe tem _100% de chance_ de soltar uma amostra qualquer.
actors.hero.abilities.duelist.formaenxameability.ativa=Você já está na forma do enxame.
actors.hero.talent.golpe_assimilador.desc=_+1:_ Com o medidor em 50 ou mais, cada golpe num inimigo do enxame cura _2 de vida_.\n\n_+2:_ Com o medidor em 50 ou mais, cada golpe num inimigo do enxame cura _3 de vida_.\n\n_+3:_ Com o medidor em 50 ou mais, cada golpe num inimigo do enxame cura _4 de vida_.
actors.hero.abilities.duelist.assimilacaoforcada.desc=O Renegado golpeia um inimigo ao lado com o dobro do dano e sem errar. Se o golpe matar um inimigo do enxame que tenha amostra, ela cai com certeza.
actors.hero.talent.faixa_alta.desc=_+1:_ O bônus da faixa alta começa em _70_ em vez de 75.\n\n_+2:_ O bônus da faixa alta começa em _65_ em vez de 75.\n\n_+3:_ O bônus da faixa alta começa em _60_ em vez de 75.
actors.hero.talent.mutacao_poderosa.desc=_+1:_ As amostras mutadas ficam _75%_ mais fortes em vez de 50%.\n\n_+2:_ As amostras mutadas ficam _100%_ mais fortes em vez de 50%.\n\n_+3:_ As amostras mutadas ficam _125%_ mais fortes em vez de 50%.
actors.hero.talent.coleta_cuidadosa.desc=_+1:_ A chance de amostra sobe para _10%_.\n\n_+2:_ A chance de amostra sobe para _13%_.
actors.hero.talent.forma_duradoura.desc=_+1:_ A forma do enxame dura _13 turnos_.\n\n_+2:_ A forma do enxame dura _16 turnos_.\n\n_+3:_ A forma do enxame dura _19 turnos_.\n\n_+4:_ A forma do enxame dura _22 turnos_.
actors.hero.talent.dano_assimilador.desc=_+1:_ O golpe causa _225% do dano_ em vez de 200%.\n\n_+2:_ O golpe causa _250% do dano_ em vez de 200%.\n\n_+3:_ O golpe causa _275% do dano_ em vez de 200%.\n\n_+4:_ O golpe causa _300% do dano_ em vez de 200%.
actors.hero.talent.uso_economico.desc=_+1:_ As habilidades emprestadas sobem o medidor _15% menos_.\n\n_+2:_ As habilidades emprestadas sobem o medidor _30% menos_.
actors.hero.talent.raio_feromonio.desc=_+1:_ O feromônio alcança _4 quadrados_ em vez de 3.\n\n_+2:_ O feromônio alcança _5 quadrados_ em vez de 3.\n\n_+3:_ O feromônio alcança _6 quadrados_ em vez de 3.\n\n_+4:_ O feromônio alcança _7 quadrados_ em vez de 3.
actors.hero.abilities.duelist.assimilacaoforcada.short_desc=O Renegado desfere uma _Assimilação forçada_: um golpe pesado que, se matar um inimigo do enxame, arranca a amostra com certeza.
actors.hero.talent.uso_economico.title=uso econômico
actors.hero.talent.feromonio_duradouro.desc=_+1:_ A fúria dura _7 turnos_ em vez de 5.\n\n_+2:_ A fúria dura _9 turnos_ em vez de 5.\n\n_+3:_ A fúria dura _11 turnos_ em vez de 5.\n\n_+4:_ A fúria dura _13 turnos_ em vez de 5.
actors.hero.talent.adaptacao_rapida.desc=_+1:_ Instalar uma amostra cura _10% da vida máxima_.\n\n_+2:_ Instalar uma amostra cura _20% da vida máxima_.
actors.hero.talent.golpe_assimilador.title=golpe assimilador
actors.hero.abilities.duelist.feromoniocomando.short_desc=O Renegado libera um _Feromônio de comando_ e os inimigos do enxame em volta lutam entre si.
