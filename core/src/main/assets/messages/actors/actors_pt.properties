actors.hero.spells.sintetico.descargaeletrica.desc=O Sintético encosta a mão num inimigo ao lado dele e descarrega o núcleo. O choque causa _%1$d a %2$d de dano_, crescendo com o nível, e deixa o alvo atordoado por 1 turno.
actors.hero.talent.golpe_energizado.desc=_+1:_ Cada golpe com a chave de torque gasta 10 de energia e causa _2 de dano_ a mais.\n\n_+2:_ Cada golpe com a chave de torque gasta 10 de energia e causa _3 de dano_ a mais.\n\nO talento para de gastar energia quando a reserva fica baixa.
actors.hero.spells.sintetico.descargaeletrica.short_desc=Dá um choque num inimigo ao lado, que fica atordoado por 1 turno.
