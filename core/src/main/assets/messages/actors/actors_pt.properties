actors.hero.talent.quick_reload.title=recarga rápida
actors.hero.talent.quick_reload.desc=_+1:_ Recarregar o fuzil leva _0,75 turno_ em vez de 1.\n\n_+2:_ Recarregar o fuzil leva _meio turno_ em vez de 1.
actors.hero.talent.ammo_reserve.title=munição de reserva
actors.hero.talent.ammo_reserve.desc=_+1:_ A chance de achar um segundo carregador em cada setor sobe de 50% para _75%_.\n\n_+2:_ O Fuzileiro _sempre_ acha um segundo carregador em cada setor.\n\nVale para setores que ainda não foram visitados.
actors.hero.talent.stunning_butt.title=coronhada atordoante
actors.hero.talent.stunning_butt.desc=_+1:_ Golpes corpo a corpo com o fuzil têm _10% de chance_ de atordoar o inimigo por 2 turnos.\n\n_+2:_ Golpes corpo a corpo com o fuzil têm _20% de chance_ de atordoar o inimigo por 2 turnos.\n\n_+3:_ Golpes corpo a corpo com o fuzil têm _30% de chance_ de atordoar o inimigo por 2 turnos.\n\nNão funciona em chefes.
actors.hero.talent.deep_recon.title=reconhecimento aprofundado
actors.hero.talent.deep_recon.desc=_+1:_ Cada abate furtivo revela o mapa num raio de _4 quadrados_, em vez de 3.\n\n_+2:_ Cada abate furtivo revela o mapa num raio de _5 quadrados_, em vez de 3.
actors.hero.talent.vanish_in_chaos.title=sumir na confusão
actors.hero.talent.vanish_in_chaos.desc=_+1:_ Depois de um abate furtivo, o operador fica _2 turnos_ invisível.\n\n_+2:_ Depois de um abate furtivo, o operador fica _3 turnos_ invisível.
actors.hero.talent.silent_headshot.title=tiro na nuca
actors.hero.talent.silent_headshot.desc=_+1:_ O tiro da pistola contra um inimigo desprevenido causa _15% a mais de dano_.\n\n_+2:_ O tiro da pistola contra um inimigo desprevenido causa _30% a mais de dano_.\n\n_+3:_ O tiro da pistola contra um inimigo desprevenido causa _45% a mais de dano_.
actors.buffs.recondata.name=reconhecimento
actors.buffs.recondata.desc=Dados de reconhecimento de uma versão de teste.
actors.buffs.recondata.abate=Abate furtivo. O reconhecimento revela o mapa em volta.
actors.hero.abilities.mage.bombardeioorbital.short_desc=O Exterminador chama um _Bombardeio orbital_: cinco cápsulas caem numa área grande depois de 3 turnos.
actors.hero.talent.retroalimentacao.desc=_+1:_ Cada inimigo morto pela rajada tem _25% de chance_ de devolver uma carga de pedido.\n\n_+2:_ Cada inimigo morto pela rajada tem _50% de chance_ de devolver uma carga de pedido.\n\n_+3:_ Cada inimigo morto pela rajada tem _75% de chance_ de devolver uma carga de pedido.\n\n_+4:_ Cada inimigo morto pela rajada tem _100% de chance_ de devolver uma carga de pedido.
actors.hero.talent.reciclagem_capsula.title=reciclagem de cápsula
actors.hero.talent.logistica.title=logística
actors.hero.talent.municao_duradoura.desc=_+1:_ Cada munição especial dura _7 disparos_ em vez de 5.\n\n_+2:_ Cada munição especial dura _9 disparos_ em vez de 5.
actors.hero.talent.municao_acoplada.title=munição acoplada
actors.hero.talent.recarga_satelite.title=recarga de satélite
actors.hero.talent.rajada_longa.desc=_+1:_ A rajada dispara _4 vezes_ em vez de 3.\n\n_+2:_ A rajada dispara _5 vezes_ em vez de 3.\n\n_+3:_ A rajada dispara _6 vezes_ em vez de 3.\n\n_+4:_ A rajada dispara _7 vezes_ em vez de 3.
actors.hero.talent.rajada_longa.title=rajada longa
actors.hero.talent.aviso_curto.desc=_+1:_ O bombardeio ainda cai em _3 turnos_. O ponto seguinte reduz a espera.\n\n_+2:_ O bombardeio cai em _2 turnos_ em vez de 3.\n\n_+3:_ O bombardeio cai em _2 turnos_ em vez de 3.\n\n_+4:_ O bombardeio cai em _1 turno_.
actors.hero.talent.refeicao_campanha.desc=_+1:_ Comer recupera _meia carga_ do transmissor.\n\n_+2:_ Comer recupera _uma carga_ do transmissor.
actors.hero.abilities.mage.bombardeioorbital.desc=O Exterminador marca um ponto ao alcance do transmissor. Depois de 3 turnos, cinco cápsulas pesadas caem num raio de 2 quadrados, uma delas no ponto marcado. Cada cápsula causa 2 de dano, mais 1 por nível.\n\nO bombardeio também fere o Exterminador e os aliados que estiverem embaixo.
actors.hero.talent.contagem_curta.desc=_+1:_ A cápsula do pedido cai em _1 turno_ em vez de 2.\n\n_+2:_ A cápsula do pedido cai _na hora_.
actors.hero.talent.perimetro_seguro.desc=_+1:_ O bombardeio causa _25% a menos de dano_ no Exterminador e nos aliados.\n\n_+2:_ O bombardeio causa _50% a menos de dano_ no Exterminador e nos aliados.\n\n_+3:_ O bombardeio causa _75% a menos de dano_ no Exterminador e nos aliados.\n\n_+4:_ O bombardeio causa _nenhum dano_ no Exterminador e nos aliados.
actors.hero.abilities.mage.bombardeioorbital.ondeath=Você ficou embaixo do próprio bombardeio...
actors.hero.talent.fogo_supressao.desc=_+1:_ A queda da cápsula atordoa os inimigos atingidos por _1 turno_.\n\n_+2:_ A queda da cápsula atordoa os inimigos atingidos por _2 turnos_.\n\n_+3:_ A queda da cápsula atordoa os inimigos atingidos por _3 turnos_.
actors.hero.talent.alcance_orbital.title=alcance orbital
actors.hero.abilities.mage.bombardeioorbital.prompt=Marque o centro do bombardeio
actors.hero.talent.sinal_emergencia.desc=_+1:_ Com a vida abaixo de 30%, o transmissor ganha _uma carga na hora_, uma vez por setor.\n\n_+2:_ Com a vida abaixo de 30%, o transmissor ganha _uma carga na hora_, até duas vezes por setor.
actors.hero.talent.fragmentacao.desc=_+1:_ Cada cápsula solta estilhaços nos quadrados em volta, com _15% do dano_.\n\n_+2:_ Cada cápsula solta estilhaços nos quadrados em volta, com _30% do dano_.\n\n_+3:_ Cada cápsula solta estilhaços nos quadrados em volta, com _45% do dano_.\n\n_+4:_ Cada cápsula solta estilhaços nos quadrados em volta, com _60% do dano_.
actors.hero.talent.capsula_dupla.title=cápsula dupla
actors.hero.talent.torreta_reforcada.title=torreta reforçada
actors.hero.talent.contagem_curta.title=contagem curta
actors.hero.talent.saturacao.title=saturação
actors.hero.talent.refeicao_campanha.title=refeição de campanha
actors.hero.talent.torreta_reforcada.desc=_+1:_ As torretas pedidas têm _25% a mais de vida_.\n\n_+2:_ As torretas pedidas têm _50% a mais de vida_.
actors.hero.talent.municao_acoplada.desc=_+1:_ Cada disparo da rajada tem _25% de chance_ de aplicar a munição especial carregada, sem gastá-la.\n\n_+2:_ Cada disparo da rajada tem _50% de chance_ de aplicar a munição especial carregada, sem gastá-la.\n\n_+3:_ Cada disparo da rajada tem _75% de chance_ de aplicar a munição especial carregada, sem gastá-la.\n\n_+4:_ Cada disparo da rajada tem _100% de chance_ de aplicar a munição especial carregada, sem gastá-la.
