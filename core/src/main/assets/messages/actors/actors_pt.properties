actors.hero.abilities.duelist.feromoniocomando.desc=Os inimigos do enxame num raio de 3 quadrados entram em fúria por 5 turnos e atacam o que estiver mais perto, inclusive uns aos outros. Assimilados e máquinas não são afetados.
actors.hero.talent.ejecao_limpa.desc=_+1:_ A amostra ejetada tem _50% de chance_ de voltar para a mochila.\n\n_+2:_ A amostra ejetada _sempre_ volta para a mochila.
actors.hero.talent.injecao_eficiente.desc=_+1:_ O injetor supressor tira _10 a mais_ do medidor.\n\n_+2:_ O injetor supressor tira _20 a mais_ do medidor.
actors.hero.talent.metabolismo_estavel.desc=_+1:_ Dormir baixa o medidor até _40%_ do valor em vez da metade.\n\n_+2:_ Dormir baixa o medidor até _30%_ do valor em vez da metade.
actors.hero.talent.dose_dupla.desc=_+1:_ O injetor supressor também cura _10% da vida máxima_.\n\n_+2:_ O injetor supressor também cura _20% da vida máxima_.\n\n_+3:_ O injetor supressor também cura _30% da vida máxima_.
