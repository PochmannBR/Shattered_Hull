journal.document.adventurers_guide.title=Manual do Combatente Espacial
journal.document.adventurers_guide.intro.title=Introdução
journal.document.adventurers_guide.intro.body=Bem-vindo à superfície, soldado. Este é o Manual do Combatente Espacial. Ele serve de consulta e avisa pelo diário quando chega a hora de ler cada página.\n\n(Quando o botão do diário piscar, toque nele para ler o que o manual tem a dizer. Algumas páginas se soltaram na queda da Vigília-7, e talvez você as encontre pelos setores.)
journal.document.adventurers_guide.examining.title=Examinar
journal.document.adventurers_guide.examining.body=Quem avança sem olhar morre cedo. Estude os inimigos e o terreno e examine tudo o que for novo.\n\n(Use o botão da lupa e escolha o que quer examinar. Os ícones dos efeitos sobre o herói também podem ser examinados.)
journal.document.adventurers_guide.surprise_attacks.title=Ataques surpresa
journal.document.adventurers_guide.surprise_attacks.body=Ataques surpresa sempre acertam, o que faz muita diferença contra inimigos ágeis, como emboscadores e hologramas corrompidos.\n\nVocê pega um inimigo de surpresa logo depois que ele passa por uma porta atrás de você, ou quando ele perde você de vista.
journal.document.adventurers_guide.identifying.title=Identificar itens
journal.document.adventurers_guide.identifying.body=As cores dos injetores e os símbolos dos cartuchos de dados mudam a cada missão. Equipamento não identificado pode vir aprimorado ou com modificação, mas também pode estar corrompido.\n\nOs cartuchos de identificação, de aprimoramento e de remover corrupção diminuem o risco de usar equipamento desconhecido.\n\n(A aba de catálogo do diário lista todos os itens que você já identificou.)
journal.document.adventurers_guide.food.title=Fome
journal.document.adventurers_guide.food.body=Saber racionar é uma das melhores formas de sobreviver. Não é preciso comer assim que a fome aparece.\n\nSem passar fome, o corpo recupera vida devagar, então comer com a vida cheia desperdiça essa recuperação.\n\nQuem come de acordo com a vida que falta faz a comida render muito mais.
journal.document.adventurers_guide.alchemy.title=Síntese e acessórios
journal.document.adventurers_guide.alchemy.body=Um item consumível sem uso pode virar ingrediente de síntese ou ser convertido em energia de síntese. Converter injetores e cartuchos também os identifica.\n\nAcessórios são equipamentos especiais criados e aprimorados por síntese, com um catalisador de acessórios e um pouco de energia de síntese.\n\n(O primeiro bancada de síntese fica no setor 3 ou 4. Perto dele costumam estar páginas do livro de receitas.)
journal.document.adventurers_guide.dieing.title=Lidar com a derrota
journal.document.adventurers_guide.dieing.body=Nem todo soldado volta da superfície, e muitos caem no meio da missão.\n\nA sorte ajuda, mas os melhores combatentes aproveitam cada pequena vantagem que encontram.\n\n(Não desanime se morrer muitas vezes. Este jogo é difícil. Pense em aprender e melhorar aos poucos, não em vencer logo de cara.)
journal.document.adventurers_guide.searching.title=Procurar
journal.document.adventurers_guide.searching.body=Os destroços e as cavernas estão cheios de passagens escondidas e de armadilhas que não aparecem à primeira vista. Se desconfiar de uma porta ou armadilha por perto, gaste um tempo procurando com cuidado.\n\n(Toque duas vezes no botão da lupa para procurar em todos os quadrados em volta. Talvez haja uma passagem escondida perto de onde esta página estava.)
journal.document.adventurers_guide.strength.title=Força
journal.document.adventurers_guide.strength.body=Não há tempo para treinar com as armas e armaduras que aparecem pelo caminho, então é a força bruta que permite usá-las bem.\n\nInjetores de força e kits de modificação são o jeito mais eficiente de atingir a força que o equipamento pesado pede.\n\nCedo ou tarde é preciso passar para o equipamento pesado, mas não despreze o que você já consegue usar.
journal.document.adventurers_guide.upgrades.title=Aprimoramentos
journal.document.adventurers_guide.upgrades.body=Quanto mais fundo no planeta, mais importa ter equipamento pesado e aprimorado, e mais força ele vai pedir.\n\nArmas especiais, implantes e módulos não pedem força, mas têm usos limitados ou ajudam menos no combate direto.\n\nEscolher bem o que aprimorar é o que mantém você vivo nos primeiros setores e prepara o caminho para os últimos.
journal.document.adventurers_guide.looting.title=Saque
journal.document.adventurers_guide.looting.body=Salas atrás de portas trancadas ou de obstáculos costumam guardar itens melhores. Quando um obstáculo bloqueia o caminho, o item que resolve o problema quase sempre está no mesmo setor.\n\nCada região de cinco setores sempre tem 2 injetores de força e 3 kits de modificação. Eles mostram se você está explorando bem.\n\n(A aba de notas do diário lista os pontos de referência e os cartões de acesso ainda não usados.)
journal.document.adventurers_guide.levelling.title=Experiência
journal.document.adventurers_guide.levelling.body=Subir de nível melhora os atributos e dá pontos de talento, o que pesa muito no combate. O ideal é ter pelo menos um nível por setor.\n\nCorrer pela missão sem explorar nem lutar é tentador, mas deixa você sem suprimentos e sem experiência.\n\n(O painel de status, no canto da tela, mostra as informações do herói, inclusive a experiência. Toque no retrato para ver mais detalhes.)
journal.document.adventurers_guide.positioning.title=Posição
journal.document.adventurers_guide.positioning.body=Tática vale tanto quanto equipamento. Ser cercado e outras situações ruins quase sempre se evitam com uma boa posição.\n\nOs corredores estreitos da nave e das cavernas obrigam os inimigos a vir um de cada vez, e muitas vezes têm portas boas para ataques surpresa.\n\nO terreno também ajuda: vegetação, água, fendas e armadilhas podem trabalhar a seu favor.
journal.document.adventurers_guide.magic.title=Ataques de energia
journal.document.adventurers_guide.magic.body=Ataques de energia atravessam a armadura e são muito difíceis de esquivar. Por isso o dano das armas especiais é tão confiável, e por isso os inimigos que usam esse tipo de ataque são tão perigosos.\n\nTodo ataque de energia tem um preço. As armas especiais têm cargas limitadas, e esses inimigos raramente conseguem atacar assim de perto.\n\nContra eles, o importante é aprender a não dar chance para o disparo.

journal.document.alchemy_guide.title=Guia de Síntese
journal.document.alchemy_guide.potions.title=Intro e Injetores
journal.document.alchemy_guide.potions.body=Bem-vindo às Aplicações Práticas de Síntese! Este livro é uma referência de receitas para criar itens numa bancada de síntese.\n\nComeçaremos com a receita mais icônica: Injetores!\n\nUse três sementes para preparar um injetor aleatório! Cada semente tem uma contraparte no injetor; use várias sementes iguais para aumentar a chance de o injetor estar relacionada às sementes que você usou.
journal.document.alchemy_guide.stones.title=Criando Cápsulas Táticas
journal.document.alchemy_guide.stones.body=Colocar um cartucho de dados na bancada de síntese grava o programa dele em duas cápsulas. Assim se fazem as cápsulas táticas, e o cartucho ainda é identificado!
journal.document.alchemy_guide.energy_food.title=Energia e Comida
journal.document.alchemy_guide.energy_food.body=Muitas receitas requerem energia de síntese cristalizada, que é feita pela desconstrução da maioria dos itens consumíveis numa bancada de síntese. Energizar um injetor ou um cartucho também os identifica.\n\nAlgumas receitas que precisam de energia são mágicas, mas estas lembram uma mistura tradicional.
journal.document.alchemy_guide.exotic_potions.title=Injetores Exóticas
journal.document.alchemy_guide.exotic_potions.body=Injetores podem ser misturadas com energia para criar injetores exóticos. Elas têm efeitos mais poderosos, mas geralmente são úteis de maneiras diferentes.
journal.document.alchemy_guide.exotic_scrolls.title=Cartuchos Exóticos
journal.document.alchemy_guide.exotic_scrolls.body=Cartuchos exóticos podem ser feitos com um pouco de energia e um cartucho. São um pouco mais fortes e mais custosos do que injetores exóticos.
journal.document.alchemy_guide.bombs.title=Bombas Aprimoradas
journal.document.alchemy_guide.bombs.body=Uma bomba de pó preto padrão pode ser misturada com um item específico para criar uma bomba aprimorada.
journal.document.alchemy_guide.weapons.title=Modificando armas
journal.document.alchemy_guide.weapons.body=Algumas das armas mais leves ou mais tecnológicas podem ser usadas na síntese!\n\nCada conjunto de armas de arremesso produz metal líquido suficiente para reparar totalmente outro conjunto do mesmo nível e tier. Converter um conjunto destrói o conjunto inteiro, mesmo que não esteja todo ali!\n\nUma arma especial produz resina arcana suficiente para aprimorar duas armas especiais do mesmo nível, até +3.
journal.document.alchemy_guide.brews_elixirs.title=Compostos e Elixires
journal.document.alchemy_guide.brews_elixirs.body=Compostos e elixires são injetores avançados com uma variedade de efeitos, normalmente com um único uso.
journal.document.alchemy_guide.spells.title=Dispositivos
journal.document.alchemy_guide.spells.body=Dispositivos estão contidos em cristais e fornecem uma variedade de efeitos, normalmente com múltiplos usos.

journal.document.intros.title=Apresentação dos setores
journal.document.intros.discover_hint=Você encontra este texto ao entrar num setor pela primeira vez.
journal.document.intros.dungeon.title=A queda da Vigília-7
journal.document.intros.dungeon.body=O transporte Vigília-7 levava uma companhia da Brigada Orbital para a fronteira quando algo atingiu o casco ainda em órbita. Não eram mísseis.\n\nA nave se partiu e caiu sobre um planeta sem nome, tomado pelo Enxame Vórtice. Você é um dos poucos que acordaram entre os destroços.\n\nOs sensores apontam a origem do enxame lá embaixo, numa colmeia escondida sob a crosta. Desça, sobreviva com o que restou da nave e destrua a rainha.
journal.document.intros.sewers.title=Destroços da nave
journal.document.intros.sewers.body=Os primeiros setores são o que sobrou da Vigília-7: corredores retorcidos, compartimentos abertos e dutos onde o enxame já fez ninho.\n\nArmas, munição e suprimentos estão espalhados pela queda. Alguns tripulantes ainda andam por aqui, mas não são mais seus colegas.
journal.document.intros.prison.title=Planícies de cinza
journal.document.intros.prison.body=Com a Matriz morta, o enxame dentro da nave perde força, e a comporta de carga cede. Pela primeira vez você pisa fora do casco.\n\nCinzas caem de um céu roxo e cobrem pedaços da Vigília-7 espalhados até o horizonte. Piratas desceram para catar o que restou, sobretudo o Laztro, e atiram em quem disputar o saque. Sob o chão, algo cava.
journal.document.intros.caves.title=Cavernas profundas
journal.document.intros.caves.body=A Capitã Kell caiu, mas a Garra Turva continua presa no chão, com o enxame nos motores. O único caminho é para baixo.\n\nAs planícies descem para um labirinto de cavernas onde a luz não chega. Veias roxas pulsam nas paredes, e o gotejar do teto nem sempre é água. O sensor do capacete enxerga menos aqui embaixo. O enxame enxerga muito bem.
journal.document.intros.city.title=Colmeia exterior
journal.document.intros.city.body=Abaixo das cavernas começa a colmeia. As paredes são feitas de resina e restos de tudo o que o enxame devorou, inclusive metal de outras naves.\n\nOs guerreiros de carapaça guardam cada passagem. Eles aprendem com cada luta.
journal.document.intros.halls.title=Câmara da rainha
journal.document.intros.halls.body=O calor úmido e o zumbido constante dizem que a rainha está perto. Aqui o enxame já se adaptou a tudo o que você usou até agora.\n\nSe ela cair, o enxame perde a voz que o comanda.
journal.document.intros.halls.discover_hint=Você encontra este texto num setor específico, mas só depois de encontrar todos os textos anteriores deste conjunto.

journal.document.sewers_guard.title=Registros do Sgt. Brandt
journal.document.sewers_guard.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.sewers_guard.new_position.title=Embarque
journal.document.sewers_guard.new_position.body=Dia 1 a bordo da Vigília-7\n\nRegistro do Sargento Ivo Brandt, 3º pelotão.\n\nEmbarcamos para a fronteira. Missão de rotina, disseram. O pessoal reclama do rancho e do aperto, mas a nave é nova e a tripulação parece boa. Doze semanas de viagem até a estação avançada.
journal.document.sewers_guard.dangerous.title=Contato no casco
journal.document.sewers_guard.dangerous.body=Dia 61\n\nContato no casco às 03h12. Os sensores registraram dezenas de impactos pequenos, como granizo. Não eram mísseis. Eram coisas vivas, grudando no metal e abrindo caminho para dentro.
journal.document.sewers_guard.crabs.title=A queda
journal.document.sewers_guard.crabs.body=Dia 61, mais tarde\n\nPerdemos os motores. O comandante mandou todos aos assentos de impacto. Se alguém achar este registro, saiba que a Vigília-7 não caiu por falha. Ela foi derrubada.
journal.document.sewers_guard.guild.title=Febre
journal.document.sewers_guard.guild.body=Dia 63\n\nSobramos onze. Três estão com febre, e a pele deles endurece como casca. O médico isolou os três no compartimento de carga. Ninguém dormiu, porque dá para ouvir eles arranhando a porta.
journal.document.sewers_guard.lost.title=A porta cedeu
journal.document.sewers_guard.lost.body=Dia 64\n\nA porta do compartimento de carga cedeu. Eles não falam mais, mas ainda vestem nossas fardas. O Cabo Moreno saiu pela escotilha de evacuação para procurar ajuda. Eu fico para segurar o corredor.
journal.document.sewers_guard.not_worth.title=Último registro
journal.document.sewers_guard.not_worth.body=Sem munição. Ouço o enxame nos dutos acima de mim.\n\nQuem estiver lendo isto: não espere resgate. A frota não sabe onde caímos. Saia daqui, desça e acabe com a coisa que manda neles.

journal.document.prison_warden.title=Diário da Capitã Kell
journal.document.prison_warden.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.prison_warden.journal.title=Achado do século
journal.document.prison_warden.journal.body=Diário da Capitã Rasha Kell, cargueiro Garra Turva.\n\nInterceptamos um pedido de socorro de uma nave de guerra da Brigada. Caiu inteira num planeta sem dono. Nave de guerra quer dizer Laztro, e Laztro quer dizer que nunca mais vamos precisar trabalhar.
journal.document.prison_warden.recruits.title=Pouso
journal.document.prison_warden.recruits.body=Pousamos nas planícies. Os destroços se espalham por quilômetros. A tripulação está eufórica: já recolhemos mais Laztro em um dia do que no último ano inteiro.
journal.document.prison_warden.mines.title=O chão se mexe
journal.document.prison_warden.mines.body=Perdemos o Doss hoje. Ele estava cavando atrás de uma célula de Laztro quando o chão se abriu embaixo dele. Ninguém viu o que o puxou. Proibi cavar sozinho.
journal.document.prison_warden.rotberry.title=Sobreviventes
journal.document.prison_warden.rotberry.body=Há soldados da Brigada vivos nos destroços. Eles atiram em nós como se fôssemos o enxame. Talvez sejamos, para eles. Ordem geral: o saque vem primeiro. Quem disputar o Laztro leva chumbo.
journal.document.prison_warden.no_support.title=Sem decolagem
journal.document.prison_warden.no_support.body=A Garra Turva não decola. Algo entrou nos motores durante a noite e fez ninho. Metade da tripulação quer fugir pelas cavernas. A outra metade quer ficar com o Laztro. Eu quero as duas coisas.
journal.document.prison_warden.letter.title=Uma voz nas cavernas
journal.document.prison_warden.letter.body=Desci sozinha. Lá embaixo, alguma coisa falou comigo sem usar palavras. Ofereceu uma saída para mim e para o Laztro, em troca de alguns favores.\n\nAceitei. Que a tripulação me perdoe.

journal.document.caves_explorer.title=Registros da Cabo Moreno
journal.document.caves_explorer.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.caves_explorer.expedition.title=Fora da nave
journal.document.caves_explorer.expedition.body=Registro da Cabo Lia Moreno.\n\nSaí pela escotilha de evacuação atrás de um sinal fraco, vindo das cavernas ao sul. Pode ser outra cápsula da Vigília-7. Pode ser qualquer coisa.
journal.document.caves_explorer.gold.title=As paredes respiram
journal.document.caves_explorer.gold.body=Entrei na caverna. As paredes têm veias roxas que pulsam devagar, como se respirassem. O sensor do capacete perde alcance aqui. Ando com a arma apontada para o teto.
journal.document.caves_explorer.troll.title=Bulbos
journal.document.caves_explorer.troll.body=Encostei num bulbo verde sem querer. Ele estourou e o pó cobriu o visor por vários minutos. Fiquei cega, ouvindo coisas se mexerem no escuro. Não encoste nos bulbos. Destrua de longe.
journal.document.caves_explorer.city.title=O sinal
journal.document.caves_explorer.city.body=Achei a origem do sinal. Não era uma cápsula. Era o transmissor de um capacete, preso na parede de resina, com o dono ainda dentro. O enxame usa nossos sinais como isca.
journal.document.caves_explorer.alive.title=Está vivo
journal.document.caves_explorer.alive.body=Mais abaixo, a caverna vira colmeia. O chão vibra num ritmo, como um coração. Tudo aqui é parte de uma coisa só, e essa coisa sabe que eu estou aqui.
journal.document.caves_explorer.report.title=Relatório final
journal.document.caves_explorer.report.body=Para quem vier depois: a rainha fica no fundo. Os guerreiros dela aprendem com cada arma que você usa, então troque de arma sempre.\n\nEu vou tentar chegar até ela. Se este for o último registro, termine o serviço.

journal.document.city_warlock.title=Registros da Ten. Irene Sousa
journal.document.city_warlock.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.city_warlock.old_king.title=A queda da Vigília-3
journal.document.city_warlock.old_king.body=Registro da Tenente Irene Sousa, engenheira da Vigília-3.\n\nCaímos há onze dias. Somos quarenta e dois, contando os feridos. O Comodoro Varga juntou todo mundo numa fenda abaixo das cavernas, onde o ar é quente e o enxame não chega. Por enquanto.
journal.document.city_warlock.resistance.title=Ordens estranhas
journal.document.city_warlock.resistance.body=O comodoro não quer pedir resgate. Diz que a frota não viria a tempo e que a nossa chance está mais abaixo, na colmeia.\n\nO Sargento Okafor se recusou a descer. Metade da tripulação ficou com ele. Eu fiquei também.
journal.document.city_warlock.failure.title=Sem transmissor
journal.document.city_warlock.failure.body=Tentei ligar o transmissor de emergência. O módulo de potência sumiu. Alguém o tirou antes de mim, com cuidado, com as ferramentas certas.\n\nSó o comodoro tinha a chave daquele compartimento.
journal.document.city_warlock.more_powerful.title=Os que voltaram
journal.document.city_warlock.more_powerful.body=Os que desceram com o comodoro voltaram hoje. Não falam. Têm placas de carapaça no pescoço e nos braços, e obedecem a ele sem que ele precise abrir a boca.\n\nOkafor sumiu durante a noite. A barraca dele estava coberta de resina.
journal.document.city_warlock.new_power.title=A voz
journal.document.city_warlock.new_power.body=O comodoro agora fala com duas vozes. A dele e outra, mais funda, que zumbe por baixo.\n\nOs operários estão desmontando a Vigília-3. As placas do casco viram parede da colmeia. Reconheço a numeração de cada uma.
journal.document.city_warlock.seen_it.title=Eu vi
journal.document.city_warlock.seen_it.body=Desci escondida atrás deles. Vi a câmara. Vi o que ele chama de rainha.\n\nVou deixar este registro gravado no meu capacete e tentar subir. Se alguém da Brigada encontrar isto: não venham por esta rota. Ela está esperando a próxima nave.

journal.document.halls_king.title=Registro de comando da Vigília-3
journal.document.halls_king.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.halls_king.rejection.title=Recusa
journal.document.halls_king.rejection.body=Registro pessoal do comandante.\n\nOs sensores encontraram uma assinatura de Laztro neste planeta maior do que qualquer jazida catalogada. O Alto Comando proibiu o desvio. Disse que a rota é da frota e que a frota tem prazo.\n\nO Alto Comando nunca comandou uma nave da classe Vigília. Vou desviar.
journal.document.halls_king.amulet.title=O coração
journal.document.halls_king.amulet.body=A assinatura não era uma jazida. Era um coração.\n\nEle pulsa no fundo da colmeia com a mesma luz roxa do Laztro, só que viva. Quando cheguei perto, ouvi uma voz que não usa palavras. Ela sabia o meu nome antes de eu dizer.
journal.document.halls_king.ritual.title=O acordo
journal.document.halls_king.ritual.body=Ela quer tripulantes. Eu quero sair deste planeta com o que ela tem.\n\nOfereci os que me seguiram até a colmeia. Ela aceitou. Disse que os outros viriam sozinhos, mais cedo ou mais tarde.
journal.document.halls_king.new_king.title=Comandante de novo
journal.document.halls_king.new_king.body=A tripulação me obedece de novo, e agora sem discutir. Não preciso de transmissor nem de ordem escrita. Penso, e eles fazem.\n\nA rainha me deu a colmeia exterior. Sou comodoro de uma frota que não precisa de naves.
journal.document.halls_king.thing.title=Quem comanda
journal.document.halls_king.thing.body=A Tenente Sousa fugiu. Mandei os operários atrás dela, mas eles pararam no meio do caminho. Não fui eu quem mandou parar.\n\nA voz que fala por baixo da minha ficou mais alta. Acho que nunca fui eu quem comandou.
journal.document.halls_king.attrition.title=A próxima nave
journal.document.halls_king.attrition.body=Entendi por que ela me deixou mandar. A rainha precisa de alguém que conheça a Brigada por dentro.\n\nA rota da Vigília-3 continua aberta nos registros da frota. A próxima nave da classe Vigília vai passar por aqui. Ela sabe disso, e eu também.\n\nElias Varga, comodoro.

