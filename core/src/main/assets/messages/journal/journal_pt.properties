journal.document.adventurers_guide.title=Tomo da Maestria de Masmorras
journal.document.adventurers_guide.intro.title=Introdução
journal.document.adventurers_guide.intro.body=Saudações, aventureiro! Você está lendo o Tomo de Maestria de Masmorras! Este guia é ideal como referência e, magicamente, lhe informará quando é melhor ler cada página.\n\n(Quando o botão do diário piscar, selecione-o para ler o que o guia tem a lhe dizer! Algumas páginas estão faltando, talvez você possa encontrá-las na masmorra?)
journal.document.adventurers_guide.examining.title=Examinando
journal.document.adventurers_guide.examining.body=É importante estudar seus inimigos e arredores em vez de avançar de forma precipitada! Adquira o hábito de examinar tudo o que for novo.\n\n(Você pode examinar usando o botão da lupa e selecionando o que deseja examinar. Você também pode examinar buffs ou debuffs selecionando seus ícones.)
journal.document.adventurers_guide.surprise_attacks.title=Ataques Surpresa
journal.document.adventurers_guide.surprise_attacks.body=Ataques surpresa têm garantia de acerto, o que se torna especialmente útil contra inimigos evasivos, como cobras e espectros.\n\nVocê pode surpreender os inimigos logo após eles entrarem por uma porta enquanto perseguem você, ou quando perdem você de vista.
journal.document.adventurers_guide.identifying.title=Identificando itens
journal.document.adventurers_guide.identifying.body=As cores das poções e os símbolos nos pergaminhos são diferentes em cada masmorra. Equipamentos não identificados podem estar aprimorados ou encantados se você tiver sorte, ou podem estar amaldiçoados! \n\nPergaminhos de identificação, aprimoramento ou remover maldição são muito úteis se você deseja reduzir o risco de usar equipamentos não identificados.\n\n(Você pode encontrar uma lista de todos os itens que identificou na aba de catálogo do seu diário)
journal.document.adventurers_guide.food.title=Lidando com a Fome
journal.document.adventurers_guide.food.body=Racionar com eficiência é uma das melhores maneiras de aumentar suas chances de sobrevivência. Você nem sempre precisa comer logo quando sente fome!\n\nQuando você não está morrendo de fome, sua saúde se regenera lentamente, então, se você comer com a vida cheia, essa regeneração será desperdiçada!\n\nSe você controlar o ritmo de alimentação com base na sua saúde, sua comida durará muito mais.
journal.document.adventurers_guide.alchemy.title=Alquimia & Acessórios
journal.document.adventurers_guide.alchemy.body=Se você não achar um item consumível útil, pode usá-lo como ingrediente de alquimia ou transformá-lo em energia alquímica multiuso. Energizar poções e pergaminhos também os identificam!\n\nAcessórios são um tipo único de equipamento criado e aprimorado por meio da alquimia. Eles são feitos com um catalisador mágico de acessórios e um pouco de energia alquímica.\n\n(O primeiro pote de alquimia fica no 3º ou 4º andar da masmorra. Há páginas de livros de receitas de alquimia perto desses potes também.)
journal.document.adventurers_guide.dieing.title=Lidar com a Derrota
journal.document.adventurers_guide.dieing.body=Masmorraria é perigoso e muitos aventureiros eventualmente acabarão morrendo.\n\nA sorte ajuda, mas os melhores aventureiros usam todo e cada pequeno truque para melhorar suas chances de sucesso.\n\n(Não fique desanimado se morrer muitas vezes, este jogo é difícil! Foque em aprender e vá melhorando aos poucos, não foque em vencer direto.)
journal.document.adventurers_guide.searching.title=Procurando
journal.document.adventurers_guide.searching.body=As masmorras estão cheias de portas secretas e armadilhas que parecem invisíveis à primeira vista. Você pode tomar algum tempo para procurar com cuidado se suspeitar que há uma porta ou armadilha escondida por perto.\n\n(Você pode procurar todos os espaços ao seu redor usando o botão de lupa duas vezes. Talvez haja alguma porta escondida perto de onde você encontrou esta página!)
journal.document.adventurers_guide.strength.title=Força
journal.document.adventurers_guide.strength.body=Não haverá tempo para treinar com as armas e armaduras que encontrar na masmorra, então você precisará de força bruta para usá-las efetivamente.\n\nPoções de força e pergaminhos de aprimoramento são a maneira mais eficaz de atender aos requisitos de força de equipamentos de tier alto.\n\nEventualmente, é importante começar a usar itens de tier alto, mas não ignore os equipamentos que você pode usar agora.
journal.document.adventurers_guide.upgrades.title=Aprimoramentos
journal.document.adventurers_guide.upgrades.body=Quanto mais fundo você for na masmorra, mais importante é que você esteja usando equipamentos de tier alto aprimorados magicamente, mas você também precisará de força para usá-los corretamente.\n\nVarinhas, anéis e artefatos não precisam de força, mas têm usos limitados ou não ajudam diretamente no combate.\n\nFazer boas escolhas sobre o que você aprimora é muito importante para sobreviver no início da masmorra e para se preparar para o sucesso mais adiante nela.
journal.document.adventurers_guide.looting.title=Pilhagem Efetiva
journal.document.adventurers_guide.looting.body=Salas com portas trancadas ou que contêm obstáculos geralmente têm saques melhores. Quando um obstáculo bloqueia seu caminho, geralmente você pode encontrar um item que ajude a superá-lo no mesmo andar.\n\nVocê sempre poderá encontrar 2 poções de força e 3 pergaminhos de aprimoramento em cada região de masmorra de cinco andares, sendo esses ótimos indicadores de quão bem você está explorando.\n\n(Você pode ver uma lista de pontos de referência e chaves não utilizadas na aba de notas da janela do diário.)
journal.document.adventurers_guide.levelling.title=Ganhando Experiência
journal.document.adventurers_guide.levelling.body=Subir de nível aumenta seus status e concede pontos de talento, o que pode fazer uma grande diferença no combate. É melhor ter pelo menos um nível para cada andar da masmorra.\n\nPode ser tentador avançar evitando exploração ou combate, mas isso o privará de suprimentos e experiência.\n\n(Você pode ver informações sobre seu herói, incluindo exp, no painel de status no canto da interface do jogo. Selecione o retrato do seu herói para obter ainda mais informações.)
journal.document.adventurers_guide.positioning.title=Posicionamento
journal.document.adventurers_guide.positioning.body=A estratégia é tão importante quanto o equipamento. Situações ruins, como ser cercado, geralmente podem ser evitadas com um bom posicionamento.\n\nPor exemplo, a maioria das masmorras possui corredores estreitos, que forçam os inimigos a lutarem contra você um de cada vez. Esses corredores geralmente também têm portas para ataques surpresa! \n\nExistem também muitas pequenas maneiras de usar os recursos do ambiente, como a grama, água, abismos ou armadilhas para sua vantagem.
journal.document.adventurers_guide.magic.title=Ataques Mágicos
journal.document.adventurers_guide.magic.body=Ataques mágicos ignoram a armadura e são extremamente difíceis de esquivar. Isso significa que o dano das varinhas é muito confiável, mas também que inimigos mágicos são muito perigosos!\n\nAtaques mágicos sempre têm uma desvantagem. Varinhas têm cargas limitadas e os inimigos mágicos geralmente não poderão usar sua magia de perto.\n\nQuando enfrentar inimigos que usam magia, é importante aprender como evitar que eles a usem em você.

journal.document.alchemy_guide.title=Guia de Alquimia
journal.document.alchemy_guide.potions.title=Intro e Poções
journal.document.alchemy_guide.potions.body=Bem-vindo às Aplicações Práticas de Alquimia! Este livro é uma referência de receitas para criar itens em um pote de alquimia.\n\nComeçaremos com a receita mais icônica: Poções!\n\nUse três sementes para preparar uma poção aleatória! Cada semente tem uma contraparte na poção; use várias sementes iguais para aumentar a chance de a poção estar relacionada às sementes que você usou.
journal.document.alchemy_guide.stones.title=Criando Pedras Rúnicas
journal.document.alchemy_guide.stones.body=Misturar um pergaminho em um pote de alquimia vai imbuir sua magia em duas pedras dentro do pote. Essa ação cria pedras rúnicas e identifica o pergaminho!
journal.document.alchemy_guide.energy_food.title=Energia e Comida
journal.document.alchemy_guide.energy_food.body=Muitas receitas requerem energia alquímica cristalizada, que é feita pela desconstrução da maioria dos itens consumíveis em um pote de alquimia. Energizar uma poção ou um pergaminho também os identifica.\n\nAlgumas receitas que precisam de energia são mágicas, mas estas lembram uma mistura tradicional.
journal.document.alchemy_guide.exotic_potions.title=Poções Exóticas
journal.document.alchemy_guide.exotic_potions.body=Poções podem ser misturadas com energia para criar poções exóticas. Elas têm efeitos mais poderosos, mas geralmente são úteis de maneiras diferentes.
journal.document.alchemy_guide.exotic_scrolls.title=Pergaminhos Exóticos
journal.document.alchemy_guide.exotic_scrolls.body=Pergaminhos exóticos podem ser feitos com um pouco de energia e um pergaminho. São um pouco mais fortes e mais custosos do que poções exóticas.
journal.document.alchemy_guide.bombs.title=Bombas Aprimoradas
journal.document.alchemy_guide.bombs.body=Uma bomba de pó preto padrão pode ser misturada com um item específico para criar uma bomba aprimorada.
journal.document.alchemy_guide.weapons.title=Encantando armas
journal.document.alchemy_guide.weapons.body=Algumas das armas mais leves ou mais mágicas podem ser usadas na alquimia!\n\nCada conjunto de arma de arremesso produz metal líquido suficiente para reparar totalmente outro conjunto de mesmo nível e tier. Observe que alquimizar um conjunto destruirá o mesmo por inteiro, mesmo que não esteja completo!\n\nUma varinha produz resina arcana suficiente para aprimorar duas varinhas do mesmo nível, mas não superior a +3.
journal.document.alchemy_guide.brews_elixirs.title=Compostos e Elixires
journal.document.alchemy_guide.brews_elixirs.body=Compostos e elixires são poções avançadas com uma variedade de efeitos, normalmente com um único uso.
journal.document.alchemy_guide.spells.title=Feitiços
journal.document.alchemy_guide.spells.body=Feitiços estão contidos em cristais e fornecem uma variedade de efeitos, normalmente com múltiplos usos.

journal.document.intros.title=Apresentação dos setores
journal.document.intros.discover_hint=Você encontra este texto ao entrar num setor pela primeira vez.
journal.document.intros.dungeon.title=A queda da Vigília-7
journal.document.intros.dungeon.body=O transporte Vigília-7 levava uma companhia da Brigada Orbital para a fronteira quando algo atingiu o casco ainda em órbita. Não eram mísseis.\n\nA nave se partiu e caiu sobre um planeta sem nome, tomado pelo Enxame Vórtice. Você é um dos poucos que acordaram entre os destroços.\n\nOs sensores apontam a origem do enxame lá embaixo, numa colmeia escondida sob a crosta. Desça, sobreviva com o que restou da nave e destrua a rainha.
journal.document.intros.sewers.title=Destroços da nave
journal.document.intros.sewers.body=Os primeiros setores são o que sobrou da Vigília-7: corredores retorcidos, compartimentos abertos e dutos onde o enxame já fez ninho.\n\nArmas, munição e suprimentos estão espalhados pela queda. Alguns tripulantes ainda andam por aqui, mas não são mais seus colegas.
journal.document.intros.prison.title=Planícies de cinza
journal.document.intros.prison.body=Fora do casco, cinzas caem de um céu roxo e cobrem pedaços da nave espalhados até o horizonte.\n\nPiratas desceram para catar o que restou, sobretudo o Laztro da Vigília-7. Eles atiram em quem disputar o saque. Sob o chão, algo cava.
journal.document.intros.caves.title=Cavernas profundas
journal.document.intros.caves.body=As planícies descem para um labirinto de cavernas onde a luz não chega. Veias roxas pulsam nas paredes, e o gotejar constante do teto nem sempre é água.\n\nO sensor do capacete enxerga menos aqui embaixo. O enxame enxerga muito bem.
journal.document.intros.city.title=Colmeia exterior
journal.document.intros.city.body=Abaixo das cavernas começa a colmeia. As paredes são feitas de resina e restos de tudo o que o enxame devorou, inclusive metal de outras naves.\n\nOs guerreiros de carapaça guardam cada passagem. Eles aprendem com cada luta.
journal.document.intros.halls.title=Câmara da rainha
journal.document.intros.halls.body=O calor úmido e o zumbido constante dizem que a rainha está perto. Aqui o enxame já se adaptou a tudo o que você usou até agora.\n\nSe ela cair, o enxame perde a voz que o comanda.
journal.document.intros.halls.discover_hint=Você encontra este texto num setor específico, mas só depois de encontrar todos os textos anteriores deste conjunto.

journal.document.sewers_guard.title=Registros do Sgt. Brandt
journal.document.sewers_guard.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.sewers_guard.new_position.title=Embarque
journal.document.sewers_guard.new_position.body=Dia 1 a bordo da Vigília-7\n\nRegistro do Sargento Ivo Brandt, 3º pelotão.\n\nEmbarcamos para a fronteira. Missão de rotina, disseram. O pessoal reclama do rancho e do aperto, mas a nave é nova e a tripulação parece boa. Doze semanas de viagem até a estação avançada.
journal.document.sewers_guard.dangerous.title=Contato no casco
journal.document.sewers_guard.dangerous.body=Dia 61\n\nContato no casco às 03h12. Os sensores registraram dezenas de impactos pequenos, como granizo. Não eram mísseis. Eram coisas vivas, grudando no metal e abrindo caminho para dentro.
journal.document.sewers_guard.crabs.title=A queda
journal.document.sewers_guard.crabs.body=Dia 61, mais tarde\n\nPerdemos os motores. O comandante mandou todos aos assentos de impacto. Se alguém achar este registro, saiba que a Vigília-7 não caiu por falha. Ela foi derrubada.
journal.document.sewers_guard.guild.title=Febre
journal.document.sewers_guard.guild.body=Dia 63\n\nSobramos onze. Três estão com febre, e a pele deles endurece como casca. O médico isolou os três no compartimento de carga. Ninguém dormiu, porque dá para ouvir eles arranhando a porta.
journal.document.sewers_guard.lost.title=A porta cedeu
journal.document.sewers_guard.lost.body=Dia 64\n\nA porta do compartimento de carga cedeu. Eles não falam mais, mas ainda vestem nossas fardas. O Cabo Moreno saiu pela escotilha de evacuação para procurar ajuda. Eu fico para segurar o corredor.
journal.document.sewers_guard.not_worth.title=Último registro
journal.document.sewers_guard.not_worth.body=Sem munição. Ouço o enxame nos dutos acima de mim.\n\nQuem estiver lendo isto: não espere resgate. A frota não sabe onde caímos. Saia daqui, desça e acabe com a coisa que manda neles.

journal.document.prison_warden.title=Diário da Capitã Kell
journal.document.prison_warden.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.prison_warden.journal.title=Achado do século
journal.document.prison_warden.journal.body=Diário da Capitã Rasha Kell, cargueiro Garra Turva.\n\nInterceptamos um pedido de socorro de uma nave de guerra da Brigada. Caiu inteira num planeta sem dono. Nave de guerra quer dizer Laztro, e Laztro quer dizer que nunca mais vamos precisar trabalhar.
journal.document.prison_warden.recruits.title=Pouso
journal.document.prison_warden.recruits.body=Pousamos nas planícies. Os destroços se espalham por quilômetros. A tripulação está eufórica: já recolhemos mais Laztro em um dia do que no último ano inteiro.
journal.document.prison_warden.mines.title=O chão se mexe
journal.document.prison_warden.mines.body=Perdemos o Doss hoje. Ele estava cavando atrás de uma célula de Laztro quando o chão se abriu embaixo dele. Ninguém viu o que o puxou. Proibi cavar sozinho.
journal.document.prison_warden.rotberry.title=Sobreviventes
journal.document.prison_warden.rotberry.body=Há soldados da Brigada vivos nos destroços. Eles atiram em nós como se fôssemos o enxame. Talvez sejamos, para eles. Ordem geral: o saque vem primeiro. Quem disputar o Laztro leva chumbo.
journal.document.prison_warden.no_support.title=Sem decolagem
journal.document.prison_warden.no_support.body=A Garra Turva não decola. Algo entrou nos motores durante a noite e fez ninho. Metade da tripulação quer fugir pelas cavernas. A outra metade quer ficar com o Laztro. Eu quero as duas coisas.
journal.document.prison_warden.letter.title=Uma voz nas cavernas
journal.document.prison_warden.letter.body=Desci sozinha. Lá embaixo, alguma coisa falou comigo sem usar palavras. Ofereceu uma saída para mim e para o Laztro, em troca de alguns favores.\n\nAceitei. Que a tripulação me perdoe.

journal.document.caves_explorer.title=Registros da Cabo Moreno
journal.document.caves_explorer.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.caves_explorer.expedition.title=Fora da nave
journal.document.caves_explorer.expedition.body=Registro da Cabo Lia Moreno.\n\nSaí pela escotilha de evacuação atrás de um sinal fraco, vindo das cavernas ao sul. Pode ser outra cápsula da Vigília-7. Pode ser qualquer coisa.
journal.document.caves_explorer.gold.title=As paredes respiram
journal.document.caves_explorer.gold.body=Entrei na caverna. As paredes têm veias roxas que pulsam devagar, como se respirassem. O sensor do capacete perde alcance aqui. Ando com a arma apontada para o teto.
journal.document.caves_explorer.troll.title=Bulbos
journal.document.caves_explorer.troll.body=Encostei num bulbo verde sem querer. Ele estourou e o pó cobriu o visor por vários minutos. Fiquei cega, ouvindo coisas se mexerem no escuro. Não encoste nos bulbos. Destrua de longe.
journal.document.caves_explorer.city.title=O sinal
journal.document.caves_explorer.city.body=Achei a origem do sinal. Não era uma cápsula. Era o transmissor de um capacete, preso na parede de resina, com o dono ainda dentro. O enxame usa nossos sinais como isca.
journal.document.caves_explorer.alive.title=Está vivo
journal.document.caves_explorer.alive.body=Mais abaixo, a caverna vira colmeia. O chão vibra num ritmo, como um coração. Tudo aqui é parte de uma coisa só, e essa coisa sabe que eu estou aqui.
journal.document.caves_explorer.report.title=Relatório final
journal.document.caves_explorer.report.body=Para quem vier depois: a rainha fica no fundo. Os guerreiros dela aprendem com cada arma que você usa, então troque de arma sempre.\n\nEu vou tentar chegar até ela. Se este for o último registro, termine o serviço.

journal.document.city_warlock.title=Diário do Bruxo
journal.document.city_warlock.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.city_warlock.old_king.title=O Rei está Morto
journal.document.city_warlock.old_king.body=É o quinto dia do segundo mês do trigésimo terceiro ano da era da magia. Se alguém da superfície está lendo isso, é em algum momento do inverno de 264. Meu nome é Thymor Zahir e, até onde sei, sou o último membro sobrevivente da corte dos anões.\n\nNosso rei está morto, substituído por um de meus ex-colegas, o qual enlouqueceu com o poder. O resto da corte se submeteu a ele, como os tolos que são, e perderam o seu livre-arbítrio no processo. Só eu enxerguei a natureza maliciosa por trás do ritual e fugi antes pudesse ser concluído.\n\nO círculo interno caiu, mas o poder do Novo Rei ainda não alcançou a todos. Devo montar uma resistência o mais rápido possível. Eu me recuso a deixar nossa gloriosa civilização cair nas mãos desse megalomaníaco!
journal.document.city_warlock.resistance.title=A Resistência
journal.document.city_warlock.resistance.body=A notícia parece ter se espalhado rapidamente. Passaram-se apenas alguns dias e já reuni um pequeno exército de anões leais ao Antigo Rei. Poucos têm afinidade com magia, mas quase toda a ordem de monges fuzileiros está entre nós. Devemos ser mais do que suficiente para lidar com um anão lunático e sua corte de escravos.\n\nEnquanto isso, o Novo Rei se escondeu nos aposentos internos de nossa cidade. Sem dúvida, ele gastou a maior parte de seu poder e espera se recuperar antes de encontrar mais resistência.\n\nLançaremos nosso ataque em algumas horas. Com sorte, seremos capazes de formar um conselho provisório e devolver à nossa maravilhosa cidade a estabilidade até o final da noite.
journal.document.city_warlock.failure.title=Fracasso
journal.document.city_warlock.failure.body=Parece que eu também sou um tolo. Presumi que o Novo Rei precisava que a corte se submetesse a ele de boa vontade, mas agora vejo que ele tem o poder de controlar até mesmo aqueles que resistem a ele.\n\nEu cegamente trouxe toda a oposição mais forte à sua porta para que ele pudesse pessoalmente transformá-los em seus escravos. Agora, ondas de sua energia necrótica estão se espalhando pela cidade, transformando instantaneamente a maioria em seus suplicantes.\n\nOs poucos que ainda têm livre-arbítrio estão fugindo. Escolhi ficar para trás para, no limite do possível, observá-lo e procurar por uma abertura. Com o poder mágico que tenho, devo ser capaz de ficar escondido e seguro por algum tempo.
journal.document.city_warlock.more_powerful.title=Mais Poderoso
journal.document.city_warlock.more_powerful.body=Manter o acompanhamento do tempo tornou-se difícil, mas já faz cerca de uma semana desde o meu último registro. Nossa civilização realmente entrou em colapso. Os portões estão fechados, todas as funções da nossa sociedade cessaram e cascas de anões vazias vagam pelos corredores.\n\nAo longo de tudo isso, de alguma forma, o Novo Rei está se tornando ainda mais poderoso. A cada dia a força de sua vontade se torna mais forte, mas também está mudando. Eu não sei como descrever, mas parece que ele não é mais um anão.\n\nEstou começando a aceitar que o melhor que posso fazer é documentar esses eventos. Ficarei aqui o máximo que puder e depois recuarei quando minha vontade começar a enfraquecer.
journal.document.city_warlock.new_power.title=Um Novo Poder
journal.document.city_warlock.new_power.body=O que esta acontecendo aqui? O poder que emana do Novo Rei é com certeza diferente do que no início, mas também há algo mais. Este novo poder parece irradiar dos salões mais internos de nossa cidade.\n\nAinda mais intrigante é que a atividade na metrópole superior também diminuiu. Eu não sei o que está acontecendo lá embaixo, mas está atraindo quase toda a atenção do Novo Rei.\n\nRetornar aos salões profundos será perigoso, mas devo descobrir o que está causando essa mudança. Talvez o Novo Rei tenha uma fraqueza afinal?
journal.document.city_warlock.seen_it.title=Eu vi
journal.document.city_warlock.seen_it.body=Eu vi o que espreita abaixo, mas sou incapaz de descrever. Minhas mãos tremem incontrolavelmente enquanto tento escrever meus pensamentos.\n\nPor que isto está acontecendo? O Novo Rei fez isso? Isto não faz sentido. Talvez o uso desenfreado do poder o tenha atraído? Eu esperava salvar nossa civilização, mas agora vejo que o mundo inteiro está em perigo.\n\nDe alguma forma, o rei é o mal menor. Não tenho outra escolha, pelo bem maior, entregar-me-ei. Por favor, guie-me meu rei, use-me como um instrumento para manter Yog-Dzewa a distância!

journal.document.halls_king.title=Diário do ???
journal.document.halls_king.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores deste conjunto.
journal.document.halls_king.rejection.title=Rejeição
journal.document.halls_king.rejection.body=IMBECIS!\n\nNos últimos 33 anos, nosso reino prosperou com nossa nova tecnologia mágica. Aprendemos a invocar espíritos elementais e a submetê-los à nossa vontade, mas, de alguma forma, agora, continuar os experimentos é 'muito perigoso'.\n\nEu sei o que realmente está acontecendo. A rejeição das minhas teorias não tem nada a ver com o mérito delas e tudo a ver com a pessoa que as sugere. Eles provavelmente estão todos rindo de mim pelas minhas costas.\n\nBem, não mais! Não me importa o que digam, explorarei os confins do nosso universo sozinho e guardarei tudo o que descobrir para mim!\n- R
journal.document.halls_king.amulet.title=O Amuleto
journal.document.halls_king.amulet.body=EU CONSEGUI!\n\nEu não sabia exatamente o que poderia encontrar, mas o que descobri estava além da minha especulação mais esdrúxula. Tanto poder, apenas repousando naquele lugar, pronto para ser tomado, e é todo meu!\n\nCom isso, nenhum daqueles tolos da corte ousará se opor a mim. Fico agitado só de pensar em todas as maneiras diferentes que eu poderia humilhá-los. Mas por que parar aí, eu tenho poder suficiente para destruir até o último deles se eu quiser! Isso pode ser excessivo, mas não devo demorar muito para decidir ou eles ficarão desconfiados.\n\nAcho que vou chamar esse grande poder de Amuleto de Yendor!\n- R
journal.document.halls_king.ritual.title=O Ritual
journal.document.halls_king.ritual.body=Thymor me confrontou publicamente hoje cedo e insistiu que eu explicasse minha nova fonte de poder. Eu o dispensei da melhor maneira que pude, mas posso sentir mais uma vez os olhos julgadores do resto da corte sobre mim.\n\nEu esperava passar um pouco mais de tempo aproveitando a calmaria antes da tempestade, mas realmente não importa. Já decidi o que quero fazer. Afirmarei que ganhei meu poder através de um novo ritual e oferecer-me-ei para realizá-lo nos outros feiticeiros e no rei. Quando o ritual terminar, eu serei rei!\n\nThymor protestará, é claro, mas com tanto poder a ofertar, duvido que eles o escutem!\n\nTODOS IRÃO CURVAR-SE PERANTE A MIM!\n- Futuro Rei dos Anões
journal.document.halls_king.new_king.title=Um Novo Rei
journal.document.halls_king.new_king.body=EU SOU REI, AHAHAHAHAAA!\n\nEles simplesmente me deixaram fazer! Com quase nenhum esforço de convencê-los, concordaram em me deixar 'compartilhar' este poder com eles em um grande ritual. Em um instante, foram transformados de um coro de vozes zombeteiras para minha nova corte de súditos silenciosos!\n\nPrevisivelmente, Thymor fugiu como um covarde ao primeiro sinal de ameaça. Eu também já posso sentir a força de resistência que ele está juntando. Acho que vou permitir que ele continue, para que assim possa entregar todos os seus conspiradores a minha porta!\n\nClaramente o reino também não me respeita, acho que vou consertar isso também.\n- Rei dos Anões
journal.document.halls_king.thing.title=A Coisa
journal.document.halls_king.thing.body=Há um problema. Thymor foi despachado sem esforço, mas parece que minha busca em planos externos não passou despercebida.\n\nAlguma... 'coisa'... foi atraída para o meu mundo e está começando a forçar a sua entrada no último andar dos salões. Para complicar ainda mais, esse é o local exato onde guardei o amuleto! Uma criatura muito rancorosa. Por que tentar negar o meu poder quando ainda há tanto para se tomar em outros universos?\n\nApesar do meu poder, porém, não acho que posso simplesmente enfrentá-la. Seu verdadeiro poder é insondável, mas deve haver alguma maneira de limitá-lo. EU IREI DEFENDER O MEU PRÊMIO!
journal.document.halls_king.attrition.title=Atrito
journal.document.halls_king.attrition.body=Eu tenho um plano para lidar com a coisa. Seu poder é infinito, mas sua capacidade de invadir este mundo não é. Ela depende de lacaios e avatares para cumprir suas ordens, enquanto tenta acumular poder suficiente para pegar o amuleto.\n\nEmbora eu não possua o amuleto fisicamente, ainda tenho controle total sobre seu poder. Com toda a cidade anã à minha disposição, também tenho uma vantagem numérica. Eu posso simplesmente continuar enviando soldados para impedir que ela se apodere do amuleto e assim ganhar esta guerra com atrito!\n\nEU, RODNEY, O REI DOS ANÕES, SEREI AQUELE A PERSEVERAR, YOG-DZEWA!

