journal.document.adventurers_guide.title=Tome of Dungeon Mastery
journal.document.adventurers_guide.intro.title=Introduction
journal.document.adventurers_guide.intro.body=Greetings Adventurer, you are reading the Tome of Dungeon Mastery! This guidebook is best used as a reference, and will magically let you know when it's best to read each page.\n\n(When the journal button flashes, select it to read what the guidebook has to tell you! Some pages are missing though, perhaps you can find them in the dungeon?)
journal.document.adventurers_guide.examining.title=Examining
journal.document.adventurers_guide.examining.body=It's important to study your enemies and surroundings instead of rushing in blindly! Get in the habit of examining everything new.\n\n(You can examine by using the magnifying glass button and then selecting what you want to examine. You can also examine buffs or debuffs by selecting their icons.)
journal.document.adventurers_guide.surprise_attacks.title=Surprise Attacks
journal.document.adventurers_guide.surprise_attacks.body=Surprise attacks are guaranteed to hit, making them especially useful against evasive enemies like snakes and wraiths.\n\nYou can surprise enemies right after they enter a doorway while chasing you, or when they otherwise lose sight of you.
journal.document.adventurers_guide.identifying.title=Identifying Items
journal.document.adventurers_guide.identifying.body=The colors of injectors and symbols on cartridges are different in each dungeon. Unidentified equipment can be upgraded or enchanted if you're lucky, or it might be cursed!\n\nScrolls of identify, upgrade, or remove curse are very useful if you want to reduce the risk of using unidentified equipment.\n\n(You can find a list of all the items you've identified in the catalog tab of your journal)
journal.document.adventurers_guide.food.title=Dealing with Hunger
journal.document.adventurers_guide.food.body=Rationing effectively is one of the best ways to improve your odds of survival, you don't always need to eat right when you get hungry!\n\nWhen you aren't starving you will slowly regenerate health, so if you eat at full health that regeneration will be wasted!\n\nIf you pace out when you eat based on your health, your food will last much longer.
journal.document.adventurers_guide.alchemy.title=Alchemy & Trinkets
journal.document.adventurers_guide.alchemy.body=If you don't find a consumable item useful, you can use it as an alchemy ingredient or turn it into all-purpose alchemical energy. Energizing injectors and cartridges also identifies them!\n\nTrinkets are a unique kind of equipment that are created and upgraded using alchemy. They're made with a magical trinket catalyst and a bit of alchemical energy.\n\n(The first alchemy pot is on the 3rd or 4th floor of the dungeon. There are alchemy recipe book pages near these pots as well.)
journal.document.adventurers_guide.dieing.title=Handling Defeat
journal.document.adventurers_guide.dieing.body=Dungeoneering is dangerous and most adventurers eventually meet their demise.\n\nLuck helps, but the best adventurers use every little trick to improve their chances.\n\n(Don't be upset if you are dying a lot, this game is hard! Focus on learning the game and steadily improving, not on winning right away.)
journal.document.adventurers_guide.searching.title=Searching
journal.document.adventurers_guide.searching.body=Dungeons are full of secret doors and traps that appear invisible at first glance. You can spend some time and carefully search if you suspect a door or trap is hidden nearby.\n\n(You can search all the tiles around you by using the magnifying glass button twice. Maybe there are some hidden doors near where you found this page!)
journal.document.adventurers_guide.strength.title=Strength
journal.document.adventurers_guide.strength.body=There isn't time to train with weapons and armor you find in the dungeon, so you'll need brute strength to use them effectively.\n\nPotions of strength and modification kits are the most effective way to meet the strength requirements of higher tier gear.\n\nIt's important to eventually start using high tier items, but don't ignore equipment you can use right now.
journal.document.adventurers_guide.upgrades.title=Upgrades
journal.document.adventurers_guide.upgrades.body=The deeper you go into a dungeon, the more important it is that you're using magically upgraded high tier gear, but you'll also need the strength to use them properly.\n\nWands, rings, and artifacts don't need strength, but have limited usages or don't help as directly in combat.\n\nMaking good choices about what you upgrade is very important for surviving early in the dungeon, and for setting yourself up for success later in the dungeon.
journal.document.adventurers_guide.looting.title=Effective Looting
journal.document.adventurers_guide.looting.body=Rooms that are behind locked doors or that contain obstacles usually have better loot. When an obstacle blocks your path, you can usually find an item to help on the same floor.\n\nYou will always be able to find 2 injectors of strength and 3 modification kits in each five floor dungeon region, so they're a great indicator of how well you're exploring.\n\n(You can see a list of landmarks and unused keycards in the notes tab of the journal window.)
journal.document.adventurers_guide.levelling.title=Gaining Experience
journal.document.adventurers_guide.levelling.body=Levelling up boosts your stats and awards talent points, which can make a big difference in combat. It's best to have at least one level for each floor of the dungeon.\n\nIt can be tempting to rush and avoiding exploration or combat, but doing so will deprive you of supplies and experience.\n\n(You can see information about your hero, including exp, on the status pane at the corner of the game interface. Select your hero portrait to get even more info.)
journal.document.adventurers_guide.positioning.title=Positioning
journal.document.adventurers_guide.positioning.body=Strategy is just as important as equipment. Bad situations like getting surrounded can usually be avoided with good positioning.\n\nFor instance, most dungeons have thin corridors which force enemies to fight you one at a time. These corridors often have doorways for surprise attacks too!\n\nThere are lots of little ways to use environment features like grass, water, pits, or traps to your advantage as well.
journal.document.adventurers_guide.magic.title=Magical Attacks
journal.document.adventurers_guide.magic.body=Magical attacks cut right through armor and are difficult to dodge. This means that damage from wands is very reliable, but also makes magical enemies very dangerous!\n\nMagical attacks always have a drawback though. Wands have limited charges and magical enemies usually won't be able to use their magic in close range.\n\nWhen facing enemies that use magic it is important to learn how to prevent them from using it on you.

journal.document.alchemy_guide.title=Alchemy Guide
journal.document.alchemy_guide.potions.title=Intro and Injectors
journal.document.alchemy_guide.potions.body=Welcome to Practical Applications of Alchemy! This book is a reference of recipes to craft items at an alchemy pot.\n\nWe'll start with the most iconic recipe: Injectors!\n\nUse three seeds to brew a random injector! Every seed has a injector counterpart, use multiple of the same seed to increase the chance that the injector relates to the seeds you used.
journal.document.alchemy_guide.stones.title=Creating Runestones
journal.document.alchemy_guide.stones.body=Mixing a cartridge into an alchemy pot will imbue its magic into two rocks within the pot. This creates runestones and identifies the cartridge!
journal.document.alchemy_guide.energy_food.title=Energy and Food
journal.document.alchemy_guide.energy_food.body=Many recipes require crystal alchemical energy, which is made by deconstructing consumable items in an alchemy pot. Energizing injectors or cartridges also identifies them.\n\nSome recipes that require energy are magical, but these ones resemble traditional cooking.
journal.document.alchemy_guide.exotic_potions.title=Exotic Injectors
journal.document.alchemy_guide.exotic_potions.body=Injectors can be mixed with energy to create exotic injectors. They have more powerful effects, but are often useful in different ways.
journal.document.alchemy_guide.exotic_scrolls.title=Exotic Cartridges
journal.document.alchemy_guide.exotic_scrolls.body=Exotic cartridges can be made with some energy and a cartridge. They're a bit stronger and more expensive than exotic injectors.
journal.document.alchemy_guide.bombs.title=Enhanced Bombs
journal.document.alchemy_guide.bombs.body=A standard black powder bomb can be mixed with a specific item to create an enhanced bomb.
journal.document.alchemy_guide.weapons.title=Enhancing Weapons
journal.document.alchemy_guide.weapons.body=Some of the lighter or more magical weapons can be used in alchemy!\n\nEach thrown weapon set produces enough liquid metal to fully repair another set of the same level and tier. Note that alchemizing a set will destroy the whole set, even if it isn't all present!\n\nOne wand will produce enough arcane resin to upgrade two wands of the same level, but no higher than +3.
journal.document.alchemy_guide.brews_elixirs.title=Brews and Elixirs
journal.document.alchemy_guide.brews_elixirs.body=Brews and elixirs are advanced injectors with a variety of effects, usually with a single use.
journal.document.alchemy_guide.spells.title=Spells
journal.document.alchemy_guide.spells.body=Spells are contained in crystals and provide a variety of effects, usually with multiple uses.

journal.document.intros.title=Sector Briefings
journal.document.intros.discover_hint=You can find this text when entering a specific sector for the first time.
journal.document.intros.dungeon.title=The Fall of the Vigil-7
journal.document.intros.dungeon.body=The transport Vigil-7 was carrying a company of the Orbital Brigade to the frontier when something struck the hull while still in orbit. They were not missiles.\n\nThe ship broke apart and crashed on a nameless planet overrun by the Vortex Swarm. You are one of the few who woke up among the wreckage.\n\nThe sensors trace the swarm to a hive hidden beneath the crust. Go down, survive on what is left of the ship, and destroy the queen.
journal.document.intros.sewers.title=Ship Wreckage
journal.document.intros.sewers.body=The first sectors are what is left of the Vigil-7: twisted corridors, breached compartments and ducts where the swarm has already nested.\n\nWeapons, ammunition and supplies are scattered by the crash. Some crew members still walk these halls, but they are no longer your comrades.
journal.document.intros.prison.title=Ash Plains
journal.document.intros.prison.body=With the Matrix dead, the swarm inside the ship loses strength and the cargo hatch gives way. For the first time you step outside the hull.\n\nAsh falls from a purple sky and covers pieces of the Vigil-7 scattered to the horizon. Pirates have landed to scavenge what is left, especially the Laztro, and they shoot anyone who contests the salvage. Beneath the ground, something is digging.
journal.document.intros.caves.title=Deep Caverns
journal.document.intros.caves.body=Captain Kell has fallen, but the Murky Claw is still stuck on the ground with the swarm in its engines. The only way is down.\n\nThe plains give way to a maze of caverns where no light reaches. Purple veins pulse in the walls, and the dripping from the ceiling is not always water. Your helmet sensor sees less down here. The swarm sees just fine.
journal.document.intros.city.title=Outer Hive
journal.document.intros.city.body=Below the caverns, the hive begins. Its walls are made of resin and the remains of everything the swarm has devoured, including metal from other ships.\n\nCarapace warriors guard every passage. They learn from every fight.
journal.document.intros.halls.title=Queen's Chamber
journal.document.intros.halls.body=The damp heat and the constant hum mean the queen is close. Here the swarm has already adapted to everything you have used so far.\n\nIf she falls, the swarm loses the voice that commands it.
journal.document.intros.halls.discover_hint=You can find this text in a specific sector, but only after finding all prior texts in this set.

journal.document.sewers_guard.title=Sgt. Brandt's Logs
journal.document.sewers_guard.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.sewers_guard.new_position.title=Boarding
journal.document.sewers_guard.new_position.body=Day 1 aboard the Vigil-7\n\nLog of Sergeant Ivo Brandt, 3rd platoon.\n\nWe have shipped out for the frontier. A routine mission, they said. The troops complain about the food and the cramped bunks, but the ship is new and the crew seems decent. Twelve weeks of travel to the forward station.
journal.document.sewers_guard.dangerous.title=Contact on the Hull
journal.document.sewers_guard.dangerous.body=Day 61\n\nContact on the hull at 03:12. The sensors logged dozens of small impacts, like hail. They were not missiles. They were living things, clinging to the metal and cutting their way in.
journal.document.sewers_guard.crabs.title=The Fall
journal.document.sewers_guard.crabs.body=Day 61, later\n\nWe lost the engines. The captain ordered everyone to the crash seats. If anyone finds this log, know that the Vigil-7 did not fall because of a malfunction. She was brought down.
journal.document.sewers_guard.guild.title=Fever
journal.document.sewers_guard.guild.body=Day 63\n\nEleven of us are left. Three have a fever, and their skin is hardening like a shell. The medic sealed them in the cargo bay. Nobody slept, because you can hear them scratching at the door.
journal.document.sewers_guard.lost.title=The Door Gave Way
journal.document.sewers_guard.lost.body=Day 64\n\nThe cargo bay door gave way. They do not speak anymore, but they still wear our uniforms. Corporal Moreno went out through the evacuation hatch to look for help. I am staying to hold the corridor.
journal.document.sewers_guard.not_worth.title=Final Log
journal.document.sewers_guard.not_worth.body=Out of ammunition. I can hear the swarm in the ducts above me.\n\nWhoever is reading this: do not wait for rescue. The fleet does not know where we fell. Get out, go down and kill the thing that commands them.

journal.document.prison_warden.title=Captain Kell's Journal
journal.document.prison_warden.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.prison_warden.journal.title=Find of the Century
journal.document.prison_warden.journal.body=Journal of Captain Rasha Kell, freighter Murky Claw.\n\nWe intercepted a distress call from a Brigade warship. She went down whole on an unclaimed planet. A warship means Laztro, and Laztro means none of us will ever have to work again.
journal.document.prison_warden.recruits.title=Landing
journal.document.prison_warden.recruits.body=We landed on the plains. The wreckage stretches for miles. The crew is ecstatic: we recovered more Laztro in one day than in the whole of last year.
journal.document.prison_warden.mines.title=The Ground Moves
journal.document.prison_warden.mines.body=We lost Doss today. He was digging for a Laztro cell when the ground opened beneath him. Nobody saw what pulled him down. I have banned digging alone.
journal.document.prison_warden.rotberry.title=Survivors
journal.document.prison_warden.rotberry.body=There are Brigade soldiers alive in the wreckage. They shoot at us as if we were the swarm. Maybe to them we are. Standing order: salvage comes first. Anyone who contests the Laztro gets shot.
journal.document.prison_warden.no_support.title=No Liftoff
journal.document.prison_warden.no_support.body=The Murky Claw will not lift off. Something crawled into the engines overnight and nested there. Half the crew wants to escape through the caverns. The other half wants to keep the Laztro. I want both.
journal.document.prison_warden.letter.title=A Voice in the Caverns
journal.document.prison_warden.letter.body=I went down alone. Down there, something spoke to me without using words. It offered a way out for me and for the Laztro, in exchange for a few favours.\n\nI accepted. May the crew forgive me.

journal.document.caves_explorer.title=Corporal Moreno's Logs
journal.document.caves_explorer.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.caves_explorer.expedition.title=Outside the Ship
journal.document.caves_explorer.expedition.body=Log of Corporal Lia Moreno.\n\nI left through the evacuation hatch, following a faint signal from the caverns to the south. It could be another Vigil-7 pod. It could be anything.
journal.document.caves_explorer.gold.title=The Walls Breathe
journal.document.caves_explorer.gold.body=I entered the cave. The walls have purple veins that pulse slowly, as if breathing. My helmet sensor loses range down here. I walk with my rifle pointed at the ceiling.
journal.document.caves_explorer.troll.title=Bulbs
journal.document.caves_explorer.troll.body=I brushed against a green bulb by accident. It burst and the dust covered my visor for several minutes. I was blind, listening to things moving in the dark. Do not touch the bulbs. Destroy them from a distance.
journal.document.caves_explorer.city.title=The Signal
journal.document.caves_explorer.city.body=I found the source of the signal. It was not a pod. It was a helmet transmitter, embedded in a resin wall, with its owner still inside. The swarm uses our signals as bait.
journal.document.caves_explorer.alive.title=It Is Alive
journal.document.caves_explorer.alive.body=Further down, the cave becomes a hive. The ground vibrates in a rhythm, like a heartbeat. Everything here is part of one single thing, and that thing knows I am here.
journal.document.caves_explorer.report.title=Final Report
journal.document.caves_explorer.report.body=To whoever comes next: the queen is at the bottom. Her warriors learn from every weapon you use, so keep switching weapons.\n\nI am going to try to reach her. If this is my last log, finish the job.

journal.document.city_warlock.title=Warlock's Journal
journal.document.city_warlock.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.city_warlock.old_king.title=The King is Dead
journal.document.city_warlock.old_king.body=It is the 5th day of the 2nd month of the 33rd year of the age of magic. If an overworlder is reading this, it is sometime in Winter 264. My name is Thymor Zahir, and to the best of my knowledge I am the last surviving member of the dwarven court.\n\nOur King is dead, replaced by one of my former colleagues who has gone mad with power. The rest of the court submitted to him, like the fools they are, and lost their free will in the process. I alone saw this coming and fled before his ritual could be completed.\n\nThe inner circle has fallen, but the New King's power has not yet reached everyone. I must mount a resistance as quickly as possible. I refuse to let our glorious civilization fall to this megalomaniac!
journal.document.city_warlock.resistance.title=A Resistance
journal.document.city_warlock.resistance.body=Word seems to have spread quickly. It has only been a few days and I have already amassed a small army of loyalists to the Old King. Few are skilled with magic, but almost the entire order of marine monks is among us. We should be more than a match for one crazed dwarf and his court of slaves.\n\nMeanwhile the New King has hidden himself in the inner chambers of our city. No doubt he has expended most of his power and is hoping to recover before he encounters more resistance.\n\nWe will launch our attack in another couple of hours. With luck we will be able to form an interim council and return our wondrous city to stability by the end of the night.
journal.document.city_warlock.failure.title=Failure
journal.document.city_warlock.failure.body=It seems that I'm a fool as well. I assumed that the New King needed the court to submit to him willingly, but now I see that he has the power to control even those who resist him.\n\nI blindly brought all of the strongest opposition right to his doorstep so that he could personally turn them into his slaves. Now waves of his necrotic energy are washing through the city, instantly turning most into his supplicants.\n\nThe few who still have free will are fleeing. I have chosen to stay behind to observe as best I can and look for an opening. With the magic power I have I should be able to stay hidden and safe for some time.
journal.document.city_warlock.more_powerful.title=More Powerful
journal.document.city_warlock.more_powerful.body=Keeping track of time has become difficult, but it has been about a week since my last entry. Our civilization has truly collapsed. The gates are shut, all functions of our society have ceased, and empty dwarven husks roam the halls.\n\nThroughout all of this, somehow, the New King is becoming even more powerful. Every day the force of his will becomes stronger, but it is also changing. I cannot describe it, but it feels as if he is no longer a dwarf at all.\n\nI'm beginning to accept that the best I can probably hope to do is document these events. I will stay here for as long as I can, and then retreat once my will begins to weaken.
journal.document.city_warlock.new_power.title=A New Power
journal.document.city_warlock.new_power.body=What is happening here? The power emanating from the New King is indeed different than at first, but there is something else too. This new power seems to radiate from the innermost halls of our city.\n\nEven more puzzling is that activity in the upper metropolis has decreased as well. I do not know what is happening down there, but it is attracting almost all of the New King's attention.\n\nReturning to the deep halls will be dangerous, but I must discover what is causing this change. Perhaps the New King has a weakness after all?
journal.document.city_warlock.seen_it.title=I've Seen It
journal.document.city_warlock.seen_it.body=I have seen what lies below, but I cannot describe it. My hands shake uncontrollably as I try to put my thoughts into writing.\n\nWhy is this happening? Did the New King do this? It makes no sense. Perhaps his wanton use of power attracted it? I had hoped to save our civilization, but now I see that the entire world is at stake.\n\nSomehow, the king is the lesser evil. I have no other choice, for the greater good I will surrender myself. Please guide me my king, use me as an instrument to hold Yog-Dzewa at bay!

journal.document.halls_king.title=???'s Journal
journal.document.halls_king.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.halls_king.rejection.title=Rejection
journal.document.halls_king.rejection.body=IMBECILES!\n\nOver the last 33 years our kingdom has flourished with our new magical technology. We've learned how to summon elemental spirits and bend them to our will, but somehow now further experimentation is 'too dangerous'.\n\nI know what's really going on. The rejection of my theories has nothing to do with their merit and everything to do with the person who suggests them. They're probably all laughing at me behind my back.\n\nWell no more! I don't care what they say, I will explore the furthest reaches of our universe alone, and keep everything I discover for myself!\n- R.
journal.document.halls_king.amulet.title=The Amulet
journal.document.halls_king.amulet.body=I'VE DONE IT!\n\nI didn't know what I might find exactly, but what I discovered out there was beyond my wildest speculation. So much power, just sitting there ready to be taken, and it's all mine!\n\nWith this none of the fools in the court will dare oppose me. I'm just giddy thinking about all the different ways I could humiliate them. Hell, why stop there, I have enough power to destroy every last one of them if I want! That might be excessive, but I mustn't take too long deciding or they'll get suspicious.\n\nI think I'll call this great power the Amulet of Yendor!\n- R.
journal.document.halls_king.ritual.title=The Ritual
journal.document.halls_king.ritual.body=Thymor publicly confronted me earlier today and insisted I explain my new source of power. I dismissed him as best I could, but I can feel the judging eyes of the rest of the court on me once again.\n\nI had hoped to spend a little more time enjoying the calm before the storm, but it doesn't really matter. I've decided what I want to do. I will claim I gained my power through a new ritual, and will offer to perform it on the other warlocks and the King. Once the ritual is over, I will be king!\n\nThymor will protest, of course, but with this much power on offer I doubt they will listen to him!\n\nALL WILL BOW BEFORE ME!\n- Future King of the Dwarves
journal.document.halls_king.new_king.title=A New King
journal.document.halls_king.new_king.body=I AM KING, AHAHAHAHAAA!\n\nThey just let me do it! With hardly any convincing they agreed to let me 'share' this power with them in a great ritual. In an instant they were transformed from a chorus of mocking voices to my new court of silent subjects!\n\nPredictably, Thymor fled like a coward at the first sign of trouble. I can already feel the resistance force he is building as well. I think I'll allow him to continue, so that he can deliver all of his conspirators right to my door!\n\nClearly the kingdom doesn't respect me either, I suppose I'll fix that as well.\n- King of the Dwarves
journal.document.halls_king.thing.title=The Thing
journal.document.halls_king.thing.body=There's a problem. Thymor was dispatched without effort, but it seems my scrounging in the outer planes did not go unnoticed.\n\nSome... 'thing'... has been attracted to my world and is starting to force itself through at the bottom of the lower halls. To complicate things further, that is the exact location where I stored the amulet! Such a spiteful creature, why must it try to deny me my power when there is plenty out there still to take?\n\nDespite my power though, I don't think I can just charge in and fight it. Its true power is unfathomable, but there must be some way to limit it. I WILL DEFEND MY PRIZE!
journal.document.halls_king.attrition.title=Attrition
journal.document.halls_king.attrition.body=I have a plan for dealing with the thing. Its power is infinite, but its ability to encroach on this world is not. It's relying on minions and avatars to do its bidding while it tries to build enough power to take the amulet.\n\nWhile I don't possess the amulet physically I still have full control over its power. With the entire dwarven city at my disposal I also have a numbers advantage. I can simply keep sending soldiers to prevent it from seizing the amulet and steadily win this war through attrition!\n\nI, RODNEY, KING OF DWARVES, WILL OUTLAST YOU YOG-DZEWA!

