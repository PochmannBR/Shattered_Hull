scenes.titlescene.loja=Loja
scenes.titlescene.apoiador=Apoiador da Brigada
scenes.changesscene.hull_v070_art_title=Inimigos redesenhados
scenes.changesscene.hull_v070_art=Quarenta e um inimigos das cinco regiões ganharam silhueta própria: _rastejadores_ e _escavadores_ com carapaça, _assimilados_ com a farda da Brigada, _mantídeos_, _esporos_, _feromantes_, _estripadores_, as _garras da rainha_ e muitos outros.
scenes.changesscene.hull_v070_names_title=Nomes novos
scenes.changesscene.hull_v070_names=A abelha dourada virou _vespa dourada_, os mímicos viraram _mimetizadores_, as estátuas viraram _autômatos_, os espectros viraram _hologramas_ e as piranhas viraram _lampreias_. A mina infestada da Cabo Moreno e os itens das classes futuras também ganharam nomes novos.
scenes.changesscene.hull_v070_store_title=Intendência
scenes.changesscene.hull_v070_store=A tela inicial ganhou a _Intendência_, com o título de _Apoiador da Brigada_ e as classes futuras, uma a uma ou em pacote. Quando uma classe ficar pronta, dá para testá-la de graça até o fim do setor 5. Nada na loja deixa o soldado mais forte durante a missão.
scenes.changesscene.hull_v070_continue_title=Continue
scenes.changesscene.hull_v070_continue=O _continue_ agora é uma compra de verdade pela Google Play. Se o pagamento sair e o jogo fechar antes da entrega, o continue fica guardado para a próxima queda.
scenes.changesscene.hull_v070_balance_title=Balanceamento
scenes.changesscene.hull_v070_balance=A curva de dificuldade foi refeita a partir de milhares de lutas simuladas. O começo ficou um pouco mais exigente, e a colmeia e a câmara da rainha ficaram bem menos punitivas.
scenes.heroselectscene.teste_chefes_title=Build de teste
scenes.heroselectscene.teste_chefes_msg=Comece a missão normal ou vá direto ao setor de um chefe, com o nível, a força e o equipamento esperados para aquele ponto da missão. Este atalho só aparece nas builds de teste.
scenes.heroselectscene.teste_chefes_normal=Missão normal
scenes.heroselectscene.teste_chefes_setor=Setor %1$d: %2$s
scenes.changesscene.hull_v080_class_title=Forças especiais
scenes.changesscene.hull_v080_class=As _Forças especiais_ estão prontas para a missão. O operador começa com faca de combate, pistola com supressor e módulo de camuflagem ativa, e se especializa como _Eliminador_ ou _Batedor_. Sem a compra da classe, dá para jogar de graça até o fim do setor 5.
scenes.changesscene.hull_v080_stealth_title=Abate furtivo
scenes.changesscene.hull_v080_stealth=Matar um inimigo que não tinha visto o operador é um _abate furtivo_, que revela o mapa em volta do inimigo. A _pistola com supressor_ usa o mesmo carregador do fuzil e não faz barulho.
scenes.changesscene.hull_v080_noise_title=Ruído do fuzil
scenes.changesscene.hull_v080_noise=O tiro do _fuzil de serviço_ agora faz barulho. Ele acorda e atrai os inimigos a até 6 quadrados, que vão até o lugar do disparo.
scenes.changesscene.hull_v080_manual_title=Manual do Combatente Espacial
scenes.changesscene.hull_v080_manual=O guia do jogo virou o _Manual do Combatente Espacial_, o manual de bolso que todo recruta da Brigada recebe no primeiro dia. Todas as páginas foram reescritas.
scenes.changesscene.hull_v080_art_title=Mais inimigos redesenhados
scenes.changesscene.hull_v080_art=Ganharam silhueta nova o _ocelo_, os _lança-ferrões_, os três _piratas_ da Garra Turva, a _casca_, as _plantas pútridas_, a _torre_ e o _núcleo de esporos_ e a _sentinela de Laztro_.
