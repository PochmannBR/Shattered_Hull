scenes.titlescene$changesbutton.title=Uma atualização está disponível!
scenes.titlescene$changesbutton.versioned_title=Atualização disponível: %s
scenes.titlescene$changesbutton.desc=O Shattered Pixel Dungeon é atualizado regularmente com revisões do conteúdo do jogo existente ou conteúdo totalmente novo! \n\nO equilíbrio do jogo também é frequentemente aprimorado nas atualizações do jogo, para que itens/heróis/inimigos específicos não sejam muito fortes ou muito fracos.\n\nAs atualizações também incluem correções para bugs e diversas outras melhorias de estabilidade.
scenes.titlescene$changesbutton.update=Ir para a Página de Atualização
scenes.titlescene$changesbutton.changes=Tela de Mudanças Recentes
scenes.titlescene.patreon_body=O Shattered Pixel Dungeon é um jogo totalmente gratuito, o que significa que eu dependo do apoio de jogadores generosos para continuar fazendo isso.\n\nSe você está interessado em me apoiar, a melhor maneira de fazer isso é através do Patreon. Patreon me dá uma fonte de renda consistente, e me permite dar algo de volta para aqueles que me apoiam! \n\nOs clientes recebem postagens exclusivas do blog todas as semanas, informando-os sobre o que eu estou trabalhando antes de qualquer outra pessoa! \n\nVocê pode dar uma olhada na minha página Patreon para obter as informações mais atualizadas sobre os benefícios, obrigado por sua consideração! \n\n(Recompensas do Patreon  só estão disponíveis em Inglês)
scenes.titlescene.patreon_button=Página do Patreon

scenes.welcomescene.update_intro=Shattered Hull foi atualizado!
scenes.welcomescene.update_msg=V4.0 é sem dúvidas a maior atualização do Shattered até agora! Possui uma missão nova gigantesca, um monte de novas artes dentro do jogo, 6 novos encantamentos, várias mudanças e ajustes pequenos .
scenes.welcomescene.patch_intro=Shattered Hull foi atualizado!
scenes.welcomescene.patch_bugfixes=Esta atualização inclui correções de erros.
scenes.welcomescene.patch_translations=Esta correção contém atualizações de tradução.
scenes.welcomescene.patch_balance=Esta atualização possui melhoria ao balanço do jogo.
scenes.welcomescene.patch_msg=Esta atualização inclui também alguns ajustes de balanceamento e performance.
scenes.welcomescene.what_msg=Parece que estes arquivos são de uma versão futura de Shattered Hull!\n\nTenha cuidado! Seus arquivos podem conter coisas que não existem nesta versão; isto pode fazer com que erros estranhos aconteçam.
scenes.welcomescene.lang_warning_title=Tradução incompleta
scenes.welcomescene.lang_warning_msg=Parte do novo conteúdo desta atualização ainda não foi traduzido.\n\nAlgumas frases podem estar escritas em inglês.\n\nAs equipes de tradução estão trabalhando para resolver isto e uma tradução completa deve ser enviada em breve.\n\nObrigado por sua paciência.
scenes.welcomescene.continue=Continuar
scenes.welcomescene.changelist=Lista de Mudanças
scenes.welcomescene.save_warning=Shattered Hull foi interrompido ao tentar salvar seus dados de jogo recentemente. Shattered tem proteções internas contra isso, então seus dados de jogo devem estar bem.\n\nIsso geralmente acontece quando o dispositivo perde energia repentinamente ou se encerra o Shattered sem deixá-lo fechar corretamente. Os recursos de economia de bateria geralmente podem causar isso em dispositivos móveis. Reiniciar o dispositivo também pode ajudar se você estiver vendo este erro com frequência.
scenes.welcomescene.controller_title=Entrada do controle
scenes.welcomescene.controller_body=Jogando no controle? Use o analógico direito para controlar um cursor na tela.\n\nPressione RT/R2 ou o analógico direito para selecionar com o cursor.
scenes.welcomescene.controller_okay=Ok

###shattered hull
scenes.aboutscene.hull_body=Desenvolvido por: _Pablo Pochmann_\nBaseado no código aberto do Shattered Pixel Dungeon
scenes.aboutscene.hull_license=Shattered Hull é software livre sob a licença GNU GPL versão 3. O código-fonte completo está no link acima. Os créditos abaixo são dos autores do jogo original, cujo código e arte este jogo usa e modifica.
scenes.changesscene.hull_v040_boss_title=Primeiro chefe
scenes.changesscene.hull_v040_boss=O chefe do setor 5 agora é a _Matriz do Enxame_, o primeiro ninho que o enxame montou dentro da Vigília-7. O chefe do setor 10 é a _Capitã Rasha Kell_, da Garra Turva.
scenes.changesscene.hull_v040_enemies_title=Inimigos e comportamentos
scenes.changesscene.hull_v040_enemies=As Planícies de cinza ganharam _cascas_, _incubadoras_, _piratas arpoadores_ e _drones de segurança_.\n\nO _escavador_ se enterra e brota ao seu lado, o _emboscador_ causa dano dobrado quando chega sem ser visto e o _pirata catador_ cata Laztro do chão.
scenes.changesscene.hull_v040_continue_title=Continue
scenes.changesscene.hull_v040_continue=A partir do setor 6, ao morrer, você pode usar o _continue_ da missão: volta no início do setor com metade da vida, sem recuperar munição nem itens. Só existe um por missão, e a missão fica marcada no ranking.
scenes.changesscene.hull_v040_balance_title=Balanceamento
scenes.changesscene.hull_v040_balance=Os inimigos ficam um pouco mais fracos no começo e endurecem aos poucos dentro de cada região, com um degrau depois de cada chefe. Cada setor gera um carregador garantido e tem 50% de chance de gerar um segundo.
scenes.changesscene.hull_v040_classes_title=Classes e arte
scenes.changesscene.hull_v040_classes=A seleção mostra as cinco classes que estão em desenvolvimento, com retrato e descrição: Forças Especiais, Exterminador, Piloto de Exoesqueleto, Renegado e Sintético. Ainda não dá para jogar com elas.\n\nNovo logo, novo ícone e novos retratos das classes.
scenes.changesscene.hull_v030_fab_title=Fabricadores
scenes.changesscene.hull_v030_fab=Os fabricadores da Vigília-7 convertem Laztro em um único tipo de item: munição, remédio ou armadura. São raros e têm energia para poucas fabricações.
scenes.changesscene.hull_v030_credits_title=Créditos
scenes.changesscene.hull_v030_credits=A tela Sobre mostra os créditos do Shattered Hull, o aviso da licença GPLv3 e os créditos do jogo original.
scenes.changesscene.hull_v020_rifle_title=Fuzil de serviço
scenes.changesscene.hull_v020_rifle=O Fuzileiro começa com o fuzil carregado e um carregador de reserva. Atirar gasta munição, a coronhada não. A recarga antecipada guarda o carregador parcial na mochila.
scenes.changesscene.hull_v020_laztro_title=Laztro
scenes.changesscene.hull_v020_laztro=O ouro deu lugar ao _Laztro_ (LZ), a matéria programável que só existe nas naves de guerra. Não há lojas.
scenes.changesscene.hull_v020_story_title=História
scenes.changesscene.hull_v020_story=A queda da Vigília-7 contada nas introduções das regiões e em três diários: do Sgt. Ivo Brandt, da Capitã Rasha Kell e da Cabo Lia Moreno.
scenes.changesscene.hull_v020_env_title=Inimigos e ambientes
scenes.changesscene.hull_v020_env=Rastejadores, assimilados, emboscadores, escavadores, cuspidores e piratas catadores. Os destroços da nave têm piso de chapa de aço e crescimento violeta do enxame.
scenes.changesscene.hull_v010_base_title=Fundação
scenes.changesscene.hull_v010_base=Primeira versão do Shattered Hull, criada a partir do código aberto do Shattered Pixel Dungeon v4.0.2, de Evan Debenham.
scenes.changesscene.hull_v040_recycle_title=Reciclador
scenes.changesscene.hull_v040_recycle=Os fabricadores agora também _desmontam_ itens da mochila e os convertem em Laztro. O reciclador funciona mesmo quando o núcleo do fabricador está sem energia.
scenes.changesscene.hull_v050_story_title=História
scenes.changesscene.hull_v050_story=A missão agora começa com a queda da Vigília-7 contada em duas telas. Ao entrar numa região nova (setores 6, 11, 16 e 21) aparece um texto curto sobre o lugar e sobre o que aconteceu antes.
scenes.changesscene.hull_v050_items_title=Equipamento da Brigada
scenes.changesscene.hull_v050_items=Varinhas viraram _armas especiais_, como a pistola de plasma e o lança-chamas. Anéis viraram _implantes_ e artefatos viraram _módulos da armadura_. As rações têm nomes de campanha e a carne misteriosa agora é carne do enxame. Todos ganharam desenho novo, assim como o lançador de arpão, o punho de exoesqueleto e o drone de retorno.
scenes.changesscene.hull_v050_marine_title=Fuzileiro
scenes.changesscene.hull_v050_marine=O selo virou o _gerador de escudo_. As subclasses agora são _Linha de Frente_ e _Atirador de Elite_, e os finalizadores de combo viraram coronhada, tiro na cabeça, cobertura, fogo de supressão e rajada.\n\nTrês talentos novos: _recarga rápida_ (T1), _munição de reserva_ (T2) e _coronhada atordoante_ (T3).
scenes.changesscene.hull_v050_npcs_title=Sobreviventes
scenes.changesscene.hull_v050_npcs=O fantasma agora é o eco holográfico do _Sgt. Ivo Brandt_. A _técnica de armamentos_ da Vigília-7 troca armas especiais por componentes, a _Cabo Lia Moreno_ pede Laztro bruto da mina, um _contrabandista da Garra Turva_ quer o conteúdo de um cofre e o rei rato virou o _rastejador-rei_.
scenes.changesscene.hull_v060_caves_title=Cavernas profundas
scenes.changesscene.hull_v060_caves=Os gnolls das cavernas agora são _assimilados_: brutamontes, psiônicos, capatazes e sapadores. Os morcegos viraram _sugadores alados_, as aranhas viraram _tecelãs_ e os DM-200 viraram _drones mineradores_ da Garra Turva. O chefe da região é a _Perfuratriz da Garra Turva_, e os cristais da mina da Cabo Moreno agora são de Laztro.
scenes.changesscene.hull_v060_city_title=Colmeia exterior
scenes.changesscene.hull_v060_city=Os anões deram lugar às castas do enxame: _operários_, _esporos_, _artilheiros_, _mantídeos_ e _colossos de carapaça_. Quem governa a colmeia exterior é o _Comodoro Elias Varga_, comandante assimilado da Vigília-3. O cofre do contrabandista também ganhou guardas e textos novos.
scenes.changesscene.hull_v060_halls_title=Câmara da rainha
scenes.changesscene.hull_v060_halls=A câmara tem _feromantes_, _ocelos_, _lança-ferrões_, _estripadores_ e _chocadeiras_. No fundo espera a _Rainha do Enxame_, com as garras da guarda real. O amuleto agora é o _Coração da Rainha_, que continua chamando o enxame na subida.
scenes.changesscene.hull_v060_logs_title=Registros da Vigília-3
scenes.changesscene.hull_v060_logs=Os diários da colmeia e da câmara agora contam o que aconteceu com a Vigília-3, nos registros da _Ten. Irene Sousa_ e do próprio _Comodoro Varga_.
scenes.changesscene.hull_v060_art_title=Arte
scenes.changesscene.hull_v060_art=Os inimigos das regiões 3 a 5 foram recoloridos. Os _módulos da armadura_ ganharam desenhos próprios, a _técnica de armamentos_ ganhou um rosto novo e o _lançador de arpão_ ficou mais encorpado.
scenes.changesscene.hull_v060_english_title=Inglês
scenes.changesscene.hull_v060_english=Os diálogos dos NPCs, o eco do Sgt. Brandt, a oficina da Cabo Moreno e a missão do contrabandista agora também estão em inglês.
