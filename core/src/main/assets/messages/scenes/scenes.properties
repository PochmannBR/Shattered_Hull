scenes.welcomescene.update_intro=Shattered Hull has been updated!
scenes.welcomescene.update_msg=v4.0 is arguably Shattered's biggest update yet! There's a massive new quest, a bunch of new in-game art, 6 new modifications, and plenty smaller changes and adjustments.
scenes.welcomescene.patch_intro=Shattered Hull has been patched!
scenes.welcomescene.patch_bugfixes=This patch contains bugfixes.
scenes.welcomescene.patch_translations=This patch contains translation updates.
scenes.welcomescene.patch_balance=This patch contains tweaks to game balance.
scenes.welcomescene.patch_msg=This patch also contains some small tweaks and performance improvements.
scenes.welcomescene.what_msg=It seems that your current saves are from a future version of Shattered Hull!\n\nTread with caution! Your saves may contain things which don't exist in this version, this could cause some very weird errors to occur.
scenes.welcomescene.lang_warning_title=Incomplete Translation
scenes.welcomescene.lang_warning_msg=Some of the new content from this update has not yet been translated.\n\nSome phrases may be written in English.\n\nThe translation teams are working to resolve this and a full translation should be patched in soon.\n\nThank you for your patience.
scenes.welcomescene.continue=Continue
scenes.welcomescene.changelist=Changelist
scenes.welcomescene.save_warning=Shattered Hull was interrupted while trying to save your game data recently. Shattered has built-in protections against this, so your game data should be fine.\n\nThis usually happens when your device suddenly loses power, or if it terminates Shattered without letting it close properly. Battery saver features can often cause this on mobile devices. Restarting your device may also help if you are seeing this error frequently.
scenes.welcomescene.controller_title=Controller Input
scenes.welcomescene.controller_body=Playing on a controller? Use the right stick to control an on-screen cursor.\n\nPress RT/R2 or the right stick to select with the cursor.
scenes.welcomescene.controller_okay=Okay

###shattered hull
scenes.aboutscene.hull_body=Developed by: _Pablo Pochmann_\nBased on Shattered Pixel Dungeon's open source
scenes.aboutscene.hull_license=Shattered Hull is free software under the GNU GPL version 3. The complete source code is at the link above. The credits below belong to the authors of the original game, whose code and art this game uses and modifies.
scenes.changesscene.hull_v040_boss_title=First boss
scenes.changesscene.hull_v040_boss=The sector 5 boss is now the _Swarm Matrix_, the first nest the swarm built inside the Vigil-7. The sector 10 boss is _Captain Rasha Kell_ of the Murky Claw.
scenes.changesscene.hull_v040_enemies_title=Enemies and behaviors
scenes.changesscene.hull_v040_enemies=The Ash Plains now have _husks_, _incubators_, _harpoon pirates_ and _security drones_.\n\nThe _digger_ burrows and bursts out beside you, the _stalker_ deals double damage when it arrives unseen and the _scavenger pirate_ grabs Laztro off the floor.
scenes.changesscene.hull_v040_continue_title=Continue
scenes.changesscene.hull_v040_continue=From sector 6 on, when you die you can use the mission _continue_: you return to the start of the sector with half your health, without getting back ammo or items. There is only one per mission, and the mission is marked in the rankings.
scenes.changesscene.hull_v040_balance_title=Balance
scenes.changesscene.hull_v040_balance=Enemies are a bit weaker early on and toughen slowly within each region, with a step after each boss. Each sector spawns one guaranteed magazine and has a 50% chance of a second.
scenes.changesscene.hull_v040_classes_title=Classes and art
scenes.changesscene.hull_v040_classes=Hero selection shows the five classes in development, with portrait and description: Special Forces, Exterminator, Exosuit Pilot, Renegade and Synthetic. They cannot be played yet.\n\nNew logo, new icon and new class portraits.
scenes.changesscene.hull_v030_fab_title=Fabricators
scenes.changesscene.hull_v030_fab=Vigil-7 fabricators turn Laztro into a single kind of item: ammo, medicine or armor. They are rare and have power for only a few jobs.
scenes.changesscene.hull_v030_credits_title=Credits
scenes.changesscene.hull_v030_credits=The About screen shows Shattered Hull credits, the GPLv3 license notice and the original game credits.
scenes.changesscene.hull_v020_rifle_title=Service rifle
scenes.changesscene.hull_v020_rifle=The Marine starts with a loaded rifle and a spare magazine. Shooting costs ammo, the rifle butt strike does not. Early reloading stows the partial magazine in the backpack.
scenes.changesscene.hull_v020_laztro_title=Laztro
scenes.changesscene.hull_v020_laztro=Gold was replaced by _Laztro_ (LZ), the programmable matter found only on warships. There are no shops.
scenes.changesscene.hull_v020_story_title=Story
scenes.changesscene.hull_v020_story=The fall of the Vigil-7, told in the region intros and in three logs: Sgt. Ivo Brandt, Captain Rasha Kell and Corporal Lia Moreno.
scenes.changesscene.hull_v020_env_title=Enemies and environments
scenes.changesscene.hull_v020_env=Crawlers, assimilated, stalkers, diggers, spitters and scavenger pirates. The ship wreckage has steel deck plating and violet swarm growth.
scenes.changesscene.hull_v010_base_title=Foundation
scenes.changesscene.hull_v010_base=First Shattered Hull version, built from the open source code of Shattered Pixel Dungeon v4.0.2 by Evan Debenham.
scenes.changesscene.hull_v040_recycle_title=Recycler
scenes.changesscene.hull_v040_recycle=Fabricators can now _dismantle_ items from your backpack and turn them into Laztro. The recycler works even when the fabricator core is out of power.
scenes.changesscene.hull_v050_story_title=Story
scenes.changesscene.hull_v050_story=The mission now opens with the fall of the Vigil-7 told over two screens. Entering a new region (sectors 6, 11, 16 and 21) shows a short text about the place and what came before.
scenes.changesscene.hull_v050_items_title=Brigade gear
scenes.changesscene.hull_v050_items=Wands became _special weapons_, rings became _implants_ and artifacts became _armor modules_. Rations got field names and mystery meat is now swarm meat. All of them got new sprites, along with the harpoon launcher, exosuit fist and return drone.
scenes.changesscene.hull_v050_marine_title=Marine
scenes.changesscene.hull_v050_marine=The seal became the _shield generator_. The subclasses are now _Vanguard_ and _Marksman_, and the combo finishers got gunfight names.\n\nThree new talents: _quick reload_ (T1), _ammo reserve_ (T2) and _stunning butt strike_ (T3).
scenes.changesscene.hull_v050_npcs_title=Survivors
scenes.changesscene.hull_v050_npcs=The ghost is now the holographic echo of _Sgt. Ivo Brandt_. The Vigil-7's _weapons technician_, _Cpl. Lia Moreno_, a _Murky Claw smuggler_ and the _crawler king_ replace the old NPCs.
scenes.changesscene.hull_v060_caves_title=Deep Caverns
scenes.changesscene.hull_v060_caves=The gnolls in the caves are now _assimilated_: brutes, psionics, foremen and sappers. Bats became _winged leeches_, spiders became _weavers_ and the DM-200s became Murky Claw _mining drones_. The region boss is the _Murky Claw Drill Rig_, and the crystals in Corporal Moreno's mine are now Laztro.
scenes.changesscene.hull_v060_city_title=Outer Hive
scenes.changesscene.hull_v060_city=The dwarves have given way to the swarm castes: _workers_, _spores_, _gunners_, _mantids_ and _carapace colossi_. The outer hive is ruled by _Commodore Elias Varga_, the assimilated commander of the Vigil-3. The smuggler's vault also has new guards and texts.
scenes.changesscene.hull_v060_halls_title=Queen's Chamber
scenes.changesscene.hull_v060_halls=The chamber holds _pheromancers_, _ocelli_, _stingers_, _rippers_ and _brooders_. At the bottom waits the _Swarm Queen_, with the claws of her royal guard. The amulet is now the _Queen's Heart_, which keeps calling the swarm on the way up.
scenes.changesscene.hull_v060_logs_title=Vigil-3 Logs
scenes.changesscene.hull_v060_logs=The journals in the hive and the chamber now tell what happened to the Vigil-3, in the logs of _Lt. Irene Sousa_ and _Commodore Varga_ himself.
scenes.changesscene.hull_v060_art_title=Art
scenes.changesscene.hull_v060_art=The enemies of regions 3 to 5 have been recolored. The _armor modules_ have their own drawings, the _weapons technician_ has a new face and the _harpoon launcher_ is bulkier.
scenes.changesscene.hull_v060_english_title=English
scenes.changesscene.hull_v060_english=NPC dialogue, Sgt. Brandt's echo, Corporal Moreno's workshop and the smuggler's quest are now in English as well.
scenes.heroselectscene.teste_title=Free trial
scenes.heroselectscene.teste_msg=You have not bought the %1$s class yet. You can play it until the end of sector %2$d and decide later. If you buy it along the way, the mission carries on from where you are.
scenes.heroselectscene.teste_comecar=Start the trial
scenes.heroselectscene.teste_comprar_classe=Buy the class %s
scenes.heroselectscene.teste_comprar_pacote=Buy the bundle %s
scenes.titlescene.loja=Store
scenes.titlescene.apoiador=Brigade Supporter
scenes.changesscene.hull_v070_art_title=Redesigned enemies
scenes.changesscene.hull_v070_art=Forty-one enemies across the five regions now have their own silhouettes: armored _crawlers_ and _burrowers_, _assimilated_ crew still in Brigade uniform, _mantids_, _spores_, _pheromancers_, _rippers_, the _queen's claws_ and many more.
scenes.changesscene.hull_v070_names_title=New names
scenes.changesscene.hull_v070_names=The golden bee is now the _golden wasp_, mimics are now _mimickers_, statues are now _automatons_, wraiths are now _holograms_ and piranhas are now _lampreys_. Corporal Moreno's infested mine and the future classes' items have new names too.
scenes.changesscene.hull_v070_store_title=Quartermaster
scenes.changesscene.hull_v070_store=The title screen now has the _Quartermaster_, with the _Brigade Supporter_ title and the future classes, one by one or as a bundle. Once a class is ready, you can try it for free until the end of sector 5. Nothing in the store makes your soldier stronger during a mission.
scenes.changesscene.hull_v070_continue_title=Continue
scenes.changesscene.hull_v070_continue=The _continue_ is now a real Google Play purchase. If the payment goes through and the game closes before it is delivered, the continue is saved for your next fall.
scenes.changesscene.hull_v070_balance_title=Balance
scenes.changesscene.hull_v070_balance=The difficulty curve was rebuilt from thousands of simulated fights. The early game is a little more demanding, and the hive and the queen's chamber are much less punishing.
scenes.heroselectscene.teste_chefes_title=Test build
scenes.heroselectscene.teste_chefes_msg=Start a normal mission or go straight to a boss sector, with the level, strength and equipment expected at that point of the mission. This shortcut only appears in test builds.
scenes.heroselectscene.teste_chefes_normal=Normal mission
scenes.heroselectscene.teste_chefes_setor=Sector %1$d: %2$s
scenes.changesscene.hull_v080_class_title=Special Forces
scenes.changesscene.hull_v080_class=The _Special Forces_ are ready for the mission. The operator starts with a combat knife, a suppressed pistol and the active camo module, and specializes as an _Eliminator_ or a _Scout_. Without buying the class, you can play for free until the end of sector 5.
scenes.changesscene.hull_v080_stealth_title=Stealth kills
scenes.changesscene.hull_v080_stealth=Killing an enemy that had not seen the operator is a _stealth kill_, which reveals the map around the enemy. The _suppressed pistol_ takes the same magazine as the rifle and makes no noise.
scenes.changesscene.hull_v080_noise_title=Rifle noise
scenes.changesscene.hull_v080_noise=The _service rifle_ is now loud. Each shot wakes and draws enemies within 6 tiles to the spot it was fired from.
scenes.changesscene.hull_v080_manual_title=Space Combatant's Manual
scenes.changesscene.hull_v080_manual=The game guide is now the _Space Combatant's Manual_, the pocket manual every Brigade recruit gets on day one. Every page has been rewritten.
scenes.changesscene.hull_v080_art_title=More redesigned enemies
scenes.changesscene.hull_v080_art=The _ocellus_, the _stingers_, the three Murky Claw _pirates_, the _husk_, the _rot plants_, the _spore tower_ and _spore core_ and the _Laztro sentinel_ all have new silhouettes.
scenes.changesscene.hull_v081_names_title=Synthesis, devices and capsules
scenes.changesscene.hull_v081_names=Alchemy is now _synthesis_, done at the _synthesis bench_. Spells are now _devices_, runestones are now _tactical capsules_, the arcane stylus is now the _glyph engraver_ and the shopkeeper is now the _scrapper_.
scenes.changesscene.hull_v081_corrupt_title=Corrupted equipment
scenes.changesscene.hull_v081_corrupt=Equipment that used to come _cursed_ now comes _corrupted_. The effect of the neural control emitter is now called _neurally controlled_.
scenes.changesscene.hull_v081_recon_title=Recon
scenes.changesscene.hull_v081_recon=The Special Forces _stealth kill_ now reveals the map in a _3 tile_ radius, and 4 and 5 with deep recon.
scenes.changesscene.hull_v081_caves_title=Cavern walls
scenes.changesscene.hull_v081_caves=The _Deep Caverns_ walls are now made of rough rock and no longer look like masonry.
scenes.changesscene.hull_v081_fab_title=Fabricator in the journal
scenes.changesscene.hull_v081_fab=The _fabricator_ now has its own journal entry, with its own description, instead of the shopkeeper's text.
scenes.supporterscene.apoio_msg=If you enjoy the game and want to see the next classes get made, buy the _Brigade Supporter title_ in the store. It adds a badge to the title screen, and the money goes straight into development.
scenes.changesscene.hull_v082_texts_title=No more fantasy text
scenes.changesscene.hull_v082_texts=About 400 texts were rewritten in Portuguese and English. _Enchantment_ is now _modification_, _glyph_ is now _plating_ and the dungeon floor is now the _sector_. Magic is now _energy_, with energy damage, energy immunity and anti-energy.\n\nNew names: _field defibrillator_, _conductive resin_, _magnetic holster_, _pulse bomb_, _UV bomb_, _focus dart_, _translucent meat_, _plating applicator_, _modification cartridge and capsule_, _cartridge of cataloging_ and the injectors of _tactical insight_, _enhanced sight_ and _fire breath_. The blessed, charmed and hexed effects are now _focused_, _entranced_ and _disoriented_.
scenes.changesscene.hull_v082_terrain_title=Terrain
scenes.changesscene.hull_v082_terrain=The _Ash Plains_ now have walls of welded hull plates, with rust and ash, and an ash floor. The _Outer Hive_ is made of honeycomb resin, with resin-coated crew members and panel stacks. The _Queen's Chamber_ has chitin ribs with Laztro veins, egg hollows and pillars of Brigade helmets.\n\nIn the _Ship Wreckage_, bookshelves are now supply lockers, barrels are now drums and the exit is now a hatch.
scenes.changesscene.hull_v082_badges_title=Badges
scenes.changesscene.hull_v082_badges=Badges no longer mention sewers, prisons, cities or the original classes. The bosses are those of the Shattered Hull regions, and the adventurer and dungeoneer titles are now _Combatant_ and _Expeditionary_.
scenes.changesscene.hull_v082_support_title=Support and history
scenes.changesscene.hull_v082_support=The support screen now talks about _Insane Goblin_ and opens the in-game store, where the Brigade Supporter title is. The change history only shows Shattered Hull versions, and the credits to the original game remain on the About screen.
scenes.changesscene.hull_v092_fixes_title=Fixes
scenes.changesscene.hull_v092_fixes=If the Renegade was assimilated by a sample he used himself, coming back through the continue froze the game.
scenes.changesscene.hull_v091_mage_title=Exterminator
scenes.changesscene.hull_v091_mage=The light turret now fires 3 times in regions 1 and 2 and 5 times from region 3 on, when it also gets sturdier.\n\nA supply drop or bombardment that was marked no longer lands in another sector. If you go down before it lands, the request is cancelled and the charges come back.
scenes.changesscene.hull_v091_classes_title=Synthetic and Renegade
scenes.changesscene.hull_v091_classes=The Synthetic only hacks machines: drones, automatons and holograms. The husk and the carapace colossus belong to the swarm and can no longer be hacked.\n\nFor the Renegade, the warning that the next time means assimilation now comes on the fourth mutation, when the whole body already belongs to the swarm.
scenes.changesscene.hull_v091_fixes_title=Fixes
scenes.changesscene.hull_v091_fixes=With a class on trial, going down the sector 5 stairs froze the game.
scenes.changesscene.hull_v090_duelist_title=Renegade
scenes.changesscene.hull_v090_mage_title=Exterminator
scenes.changesscene.hull_v090_terminals_title=Terminals
scenes.changesscene.hull_v090_duelist=The Renegade joins the game. He installs swarm samples in four places of his body and uses their abilities, filling the assimilation meter. Above 50 and 75 he grows stronger. The meter holds a little past 100, and this tolerance grows with level. When it is exceeded come the surge and the mutations. There are 24 samples, and those from stronger creatures cost more.\n\nSpecializations: Hybrid and Disciplined. Armor abilities: forced assimilation, swarm form and command pheromone.
scenes.changesscene.hull_v090_cleric=The Synthetic joins the game. He does not eat: he has an energy reserve that drains over time and comes back with kills. His core shocks enemies, opens locks, disarms traps, repairs his body, calls a drone and hacks machines, all paid from the same reserve.\n\nSpecializations: Controller and Ironclad. Armor abilities: EMP, core overload and nanodrone swarm.
scenes.changesscene.hull_v090_mage=The Exterminator joins the game. Through his orbital transmitter he requests supplies: special ammo, turrets, shields, grenades and an escort drone, delivered in capsules wherever he marks. The catalog grows with each region.\n\nSpecializations: Quartermaster and Forward Observer. Armor abilities: orbital bombardment, transmitter burst and extraction beacon.
scenes.changesscene.hull_v090_terminals=Wells became ship terminals: the data terminal reveals the sector and identifies items, and the medical station heals. Once used, they go offline.
scenes.changesscene.hull_v090_cleric_title=Synthetic
