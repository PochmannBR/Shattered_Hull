scenes.titlescene$changesbutton.title=An Update is Available!
scenes.titlescene$changesbutton.versioned_title=Update Available: %s
scenes.titlescene$changesbutton.desc=Shattered Pixel Dungeon is regularly updated with overhauls to existing game content, or entirely new content!\n\nGame balance is also frequently improved in game updates, so that specific items/heroes/enemies aren't too strong or too weak.\n\nUpdates also include fixes for bugs and other various stability improvements.
scenes.titlescene$changesbutton.update=Go to Update Page
scenes.titlescene$changesbutton.changes=Current Changes Screen
scenes.titlescene.patreon_body=Shattered Pixel Dungeon is a completely free game, which means that I depend on support from generous players in order to keep making it.\n\nIf you're interested in supporting me, the best way to do so is through Patreon. Patreon gives me a consistent income source, and allows me to give something back to those who support me!\n\nPatrons get exclusive blog posts every week which let them know about what I'm working on before anyone else!\n\nYou can take a look at my Patreon page for the most up to date information about benefits, Thank you for your consideration!\n\n(Patreon rewards are only available in English)
scenes.titlescene.patreon_button=Patreon Page

scenes.welcomescene.update_intro=Shattered Hull has been updated!
scenes.welcomescene.update_msg=v4.0 is arguably Shattered's biggest update yet! There's a massive new quest, a bunch of new in-game art, 6 new enchantments, and plenty smaller changes and adjustments.
scenes.welcomescene.patch_intro=Shattered Hull has been patched!
scenes.welcomescene.patch_bugfixes=This patch contains bugfixes.
scenes.welcomescene.patch_translations=This patch contains translation updates.
scenes.welcomescene.patch_balance=This patch contains tweaks to game balance.
scenes.welcomescene.patch_msg=This patch also contains some small tweaks and performance improvements.
scenes.welcomescene.what_msg=It seems that your current saves are from a future version of Shattered Hull!\n\nTread with caution! Your saves may contain things which don't exist in this version, this could cause some very weird errors to occur.
scenes.welcomescene.lang_warning_title=Incomplete Translation
scenes.welcomescene.lang_warning_msg=Some of the new content from this update has not yet been translated.\n\nSome phrases may be written in English.\n\nThe translation teams are working to resolve this and a full translation should be patched in soon.\n\nThank you for your patience.
scenes.welcomescene.continue=Continue
scenes.welcomescene.changelist=Changelist
scenes.welcomescene.save_warning=Shattered Hull was interrupted while trying to save your game data recently. Shattered has built-in protections against this, so your game data should be fine.\n\nThis usually happens when your device suddenly loses power, or if it terminates Shattered without letting it close properly. Battery saver features can often cause this on mobile devices. Restarting your device may also help if you are seeing this error frequently.
scenes.welcomescene.controller_title=Controller Input
scenes.welcomescene.controller_body=Playing on a controller? Use the right stick to control an on-screen cursor.\n\nPress RT/R2 or the right stick to select with the cursor.
scenes.welcomescene.controller_okay=Okay

###shattered hull
scenes.aboutscene.hull_body=Developed by: _Pablo Pochmann_\nBased on Shattered Pixel Dungeon's open source
scenes.aboutscene.hull_license=Shattered Hull is free software under the GNU GPL version 3. The complete source code is at the link above. The credits below belong to the authors of the original game, whose code and art this game uses and modifies.
scenes.changesscene.hull_v040_boss_title=First boss
scenes.changesscene.hull_v040_boss=The sector 5 boss is now the _Swarm Matrix_, the first nest the swarm built inside the Vigil-7. The sector 10 boss is _Captain Rasha Kell_ of the Murky Claw.
scenes.changesscene.hull_v040_enemies_title=Enemies and behaviors
scenes.changesscene.hull_v040_enemies=The Ash Plains now have _husks_, _incubators_, _harpoon pirates_ and _security drones_.\n\nThe _digger_ burrows and bursts out beside you, the _stalker_ deals double damage when it arrives unseen and the _scavenger pirate_ grabs Laztro off the floor.
scenes.changesscene.hull_v040_continue_title=Continue
scenes.changesscene.hull_v040_continue=From sector 6 on, when you die you can use the mission _continue_: you return to the start of the sector with half your health, without getting back ammo or items. There is only one per mission, and the mission is marked in the rankings.
scenes.changesscene.hull_v040_balance_title=Balance
scenes.changesscene.hull_v040_balance=Enemies are a bit weaker early on and toughen slowly within each region, with a step after each boss. Each sector spawns one guaranteed magazine and has a 50% chance of a second.
scenes.changesscene.hull_v040_classes_title=Classes and art
scenes.changesscene.hull_v040_classes=Hero selection shows the five classes in development, with portrait and description: Special Forces, Exterminator, Exosuit Pilot, Renegade and Synthetic. They cannot be played yet.\n\nNew logo, new icon and new class portraits.
scenes.changesscene.hull_v030_fab_title=Fabricators
scenes.changesscene.hull_v030_fab=Vigil-7 fabricators turn Laztro into a single kind of item: ammo, medicine or armor. They are rare and have power for only a few jobs.
scenes.changesscene.hull_v030_credits_title=Credits
scenes.changesscene.hull_v030_credits=The About screen shows Shattered Hull credits, the GPLv3 license notice and the original game credits.
scenes.changesscene.hull_v020_rifle_title=Service rifle
scenes.changesscene.hull_v020_rifle=The Marine starts with a loaded rifle and a spare magazine. Shooting costs ammo, the rifle butt strike does not. Early reloading stows the partial magazine in the backpack.
scenes.changesscene.hull_v020_laztro_title=Laztro
scenes.changesscene.hull_v020_laztro=Gold was replaced by _Laztro_ (LZ), the programmable matter found only on warships. There are no shops.
scenes.changesscene.hull_v020_story_title=Story
scenes.changesscene.hull_v020_story=The fall of the Vigil-7, told in the region intros and in three logs: Sgt. Ivo Brandt, Captain Rasha Kell and Corporal Lia Moreno.
scenes.changesscene.hull_v020_env_title=Enemies and environments
scenes.changesscene.hull_v020_env=Crawlers, assimilated, stalkers, diggers, spitters and scavenger pirates. The ship wreckage has steel deck plating and violet swarm growth.
scenes.changesscene.hull_v010_base_title=Foundation
scenes.changesscene.hull_v010_base=First Shattered Hull version, built from the open source code of Shattered Pixel Dungeon v4.0.2 by Evan Debenham.
scenes.changesscene.hull_v040_recycle_title=Recycler
scenes.changesscene.hull_v040_recycle=Fabricators can now _dismantle_ items from your backpack and turn them into Laztro. The recycler works even when the fabricator core is out of power.
scenes.changesscene.hull_v050_story_title=Story
scenes.changesscene.hull_v050_story=The mission now opens with the fall of the Vigília-7 told over two screens. Entering a new region (sectors 6, 11, 16 and 21) shows a short text about the place and what came before.
scenes.changesscene.hull_v050_items_title=Brigade gear
scenes.changesscene.hull_v050_items=Wands became _special weapons_, rings became _implants_ and artifacts became _armor modules_. Rations got field names and mystery meat is now swarm meat. All of them got new sprites, along with the harpoon launcher, exosuit fist and return drone.
scenes.changesscene.hull_v050_marine_title=Marine
scenes.changesscene.hull_v050_marine=The seal became the _shield generator_. The subclasses are now _Vanguard_ and _Marksman_, and the combo finishers got gunfight names.\n\nThree new talents: _quick reload_ (T1), _ammo reserve_ (T2) and _stunning butt strike_ (T3).
scenes.changesscene.hull_v050_npcs_title=Survivors
scenes.changesscene.hull_v050_npcs=The ghost is now the holographic echo of _Sgt. Ivo Brandt_. The Vigília-7's _weapons technician_, _Cpl. Lia Moreno_, a _Garra Turva smuggler_ and the _crawler king_ replace the old NPCs.
